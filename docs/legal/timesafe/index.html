tuales Estándar (SCCs) aprobadas por la ANPD según la Resolución CD/ANPD N° 19/2024, u otros mecanismos de transferencia legalmente permitidos, para garantizar un nivel adecuado de protección de datos.\u003c/p\u003e\n\u003ch3\u003eNotificación de Incidentes de Seguridad\u003c/h3\u003e\n\u003cp\u003eEn caso de un incidente de seguridad que pueda acarrear un riesgo o daño relevante para Usted, la Empresa se compromete a notificar a la ANPD y a los titulares de los datos afectados en un plazo de \u003cstrong\u003etres (3) días hábiles\u003c/strong\u003e a partir del conocimiento del incidente, de acuerdo con la regulación vigente. La notificación incluirá la naturaleza de los datos personales afectados, información sobre los titulares implicados, las medidas técnicas y de seguridad utilizadas y los riesgos relacionados con el incidente.\u003c/p\u003e\n\u003ch3\u003eDelegado de Protección de Datos (DPO)\u003c/h3\u003e\n\u003cp\u003eLa Empresa ha designado un Delegado de Protección de Datos (DPO) para supervisar el cumplimiento de la LGPD. La información de contacto del DPO está disponible públicamente y puede obtenerse a través de nuestro canal de contacto oficial: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch2\u003e12. Indemnización\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eUSTED ACEPTA INDEMNIZAR, DEFENDER Y MANTENER INDEMNE A LA EMPRESA\u003c/strong\u003e y a sus empresas matrices, subsidiarias, filiales, directores, funcionarios, empleados, agentes, socios y licenciantes (las \"Partes Indemnizadas\") de y contra todas y cada una de las reclamaciones, responsabilidades, daños, pérdidas, costos, juicios, multas, penalizaciones y gastos (incluidos los honorarios razonables de abogados) que surjan de o estén relacionados de alguna manera con: (a) Su uso o mal uso de la Aplicación; (b) Su violación de este Acuerdo o de cualquier ley, norma o reglamento aplicable; (c) Su violación de cualquier derecho de un tercero, incluyendo cualquier derecho de propiedad intelectual o derecho a la privacidad; o (d) cualquier Contenido que Usted publique, cargue o transmita a través de la Aplicación.\u003c/p\u003e\n\u003cp\u003eLa Empresa se reserva el derecho de asumir la defensa y el control exclusivos de cualquier asunto sujeto a indemnización por Su parte, en cuyo caso Usted cooperará plenamente con la Empresa para hacer valer cualquier defensa disponible.\u003c/p\u003e\n\n\u003ch2\u003e13. Asunción de Riesgo y Exclusión de Garantías\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eUSTED ASUME LA TOTAL RESPONSABILIDAD Y EL RIESGO POR SU USO DE LA APLICACIÓN. LA APLICACIÓN SE LE PROPORCIONA \"TAL CUAL\" (\"AS IS\") Y \"SEGÚN DISPONIBILIDAD\" (\"AS AVAILABLE\"), CON TODOS SUS FALLOS Y DEFECTOS, SIN GARANTÍA DE NINGÚN TIPO.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, LA EMPRESA, EN SU PROPIO NOMBRE Y EN NOMBRE DE SUS AFILIADOS Y SUS RESPECTIVOS LICENCIANTES Y PROVEEDORES DE SERVICIOS, RENUNCIA EXPRESAMENTE A TODAS LAS GARANTÍAS, YA SEAN EXPRESAS, IMPLÍCITAS, LEGALES O DE OTRO TIPO, CON RESPECTO A LA APLICACIÓN. ESTO INCLUYE TODAS LAS GARANTÍAS IMPLÍCITAS DE COMERCIABILIDAD, IDONEIDAD PARA UN PROPÓSITO PARTICULAR, TÍTULO Y NO INFRACCIÓN, Y LAS GARANTÍAS QUE PUEDAN SURGIR DEL CURSO DE LA NEGOCIACIÓN, EL CURSO DEL RENDIMIENTO, EL USO O LA PRÁCTICA COMERCIAL.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eSin limitación a lo anterior, la Empresa no ofrece ninguna garantía ni compromiso, y no hace ninguna representación de ningún tipo de que la Aplicación:\n\u003cul\u003e\n    \u003cli\u003eCumplirá con Sus requisitos.\u003c/li\u003e\n    \u003cli\u003eAlcanzará los resultados previstos.\u003c/li\u003e\n    \u003cli\u003eSerá compatible o funcionará con cualquier otro software, aplicación, sistema o servicio.\u003c/li\u003e\n    \u003cli\u003eOperará sin interrupción, de manera oportuna, segura o libre de errores.\u003c/li\u003e\n    \u003cli\u003eCumplirá con cualquier estándar de rendimiento o fiabilidad.\u003c/li\u003e\n    \u003cli\u003eEstará libre de errores, virus, malware u otros componentes dañinos, o que cualquier error o defecto será corregido.\u003c/li\u003e\n    \u003cli\u003eLos resultados obtenidos del uso de la Aplicación serán precisos, completos o fiables.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/p\u003e\n\u003cp\u003eAlgunas jurisdicciones no permiten la exclusión de ciertos tipos de garantías o limitaciones a los derechos legales aplicables de un consumidor, por lo que algunas o todas las exclusiones y limitaciones anteriores pueden no aplicarse a Usted. Pero en tal caso, las exclusiones y limitaciones establecidas en esta sección se aplicarán en la mayor medida exigible por la ley aplicable.\u003c/p\u003e\n\n\u003ch2\u003e14. Limitación de Responsabilidad\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eEN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES, DIRECTORES, EMPLEADOS O AFILIADOS SERÁN RESPONSABLES POR CUALQUIER DAÑO ESPECIAL, INCIDENTAL, INDIRECTO, PUNITIVO O CONSECUENTE DE NINGÚN TIPO (INCLUYENDO, PERO NO LIMITADO A, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS U OTRA INFORMACIÓN, INTERRUPCIÓN DEL NEGOCIO, LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD) QUE SURJA DE O ESTÉ RELACIONADO DE ALGUNA MANERA CON EL USO O LA INCAPACIDAD DE USAR LA APLICACIÓN, EL SOFTWARE DE TERCEROS Y/O EL HARDWARE DE TERCEROS UTILIZADO CON LA APLICACIÓN, O DE OTRA MANERA EN CONEXIÓN CON CUALQUIER DISPOSICIÓN DE ESTE ACUERDO, INCLUSO SI LA EMPRESA O CUALQUIER PROVEEDOR HA SIDO ADVERTIDO DE LA POSIBILIDAD DE TALES DAÑOS E INCLUSO SI EL RECURSO NO CUMPLE SU PROPÓSITO ESENCIAL.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eA PESAR DE CUALQUIER DAÑO QUE USTED PUEDA SUFRIR, LA RESPONSABILIDAD TOTAL Y ACUMULADA DE LA EMPRESA Y CUALQUIERA DE SUS PROVEEDORES BAJO CUALQUIER DISPOSICIÓN DE ESTE ACUERDO Y SU RECURSO EXCLUSIVO PARA TODO LO ANTERIOR SE LIMITARÁ A LA CANTIDAD MAYOR ENTRE: (A) EL IMPORTE TOTAL EFECTIVAMENTE PAGADO POR USTED POR LA SUSCRIPCIÓN DE LA APLICACIÓN DURANTE LOS DOCE (12) MESES ANTERIORES A LA RECLAMACIÓN QUE DIO LUGAR A LA RESPONSABILIDAD; O (B) LA SUMA DE VEINTE DÓLARES ESTADOUNIDENSES ($20.00 USD).\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAlgunos estados/jurisdicciones no permiten la exclusión o limitación de daños incidentales o consecuentes, por lo que la limitación o exclusión anterior puede no aplicarse a Usted.\u003c/p\u003e\n\n\u003ch2\u003e15. Ley Aplicable y Jurisdicción\u003c/h2\u003e\n\u003cp\u003eEste Acuerdo y Su uso de la Aplicación se regirán e interpretarán de acuerdo con las leyes de la República Federativa de Brasil, excluyendo sus normas sobre conflictos de leyes.\u003c/p\u003e\n\u003cp\u003eUsted acepta irrevocablemente que cualquier disputa, controversia o reclamación que surja de o esté relacionada con este Acuerdo o el incumplimiento, terminación, ejecución, interpretación o validez del mismo, se someterá a la jurisdicción exclusiva de los tribunales del distrito de São Paulo, Estado de São Paulo, Brasil. Las partes renuncian irrevocablemente a cualquier objeción a la jurisdicción y al lugar de celebración en dichos tribunales.\u003c/p\u003e\n\n\u003ch2\u003e16. Disposiciones Generales\u003c/h2\u003e\n\u003ch3\u003eDivisibilidad\u003c/h3\u003e\n\u003cp\u003eSi alguna disposición de este Acuerdo se considera inaplicable o inválida, dicha disposición se cambiará e interpretará para lograr los objetivos de dicha disposición en la mayor medida posible bajo la ley aplicable, y las disposiciones restantes continuarán en pleno vigor y efecto.\u003c/p\u003e\n\u003ch3\u003eRenuncia\u003c/h3\u003e\n\u003cp\u003eSalvo lo dispuesto en el presente, el hecho de no ejercer un derecho o de no exigir el cumplimiento de una obligación en virtud de este Acuerdo no afectará la capacidad de una parte para ejercer dicho derecho o exigir dicho cumplimiento en cualquier momento posterior, ni la renuncia a un incumplimiento constituirá una renuncia a cualquier incumplimiento posterior.\u003c/p\u003e\n\u003ch3\u003eAcuerdo Completo\u003c/h3\u003e\n\u003cp\u003eEste Acuerdo, junto con la Política de Privacidad y cualquier otro aviso legal publicado por la Empresa, constituye el acuerdo completo entre Usted y la Empresa con respecto a Su uso de la Aplicación, y sustituye todos los acuerdos y entendimientos anteriores o contemporáneos, ya sean escritos u orales, con respecto a dicho tema.\u003c/p\u003e\n\n\u003ch2\u003e17. Información de Contacto\u003c/h2\u003e\n\u003cp\u003eSi tiene alguna pregunta sobre este Contrato de Licencia de Usuario Final, o si necesita ponerse en contacto con la Empresa por cualquier motivo, puede hacerlo a través de nuestro canal de contacto oficial:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eVisitando esta página en nuestro sitio web:\u003c/strong\u003e \u003ca href=\"https://www.timesafe.com.br/contato.html\" target=\"_blank\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTenga en cuenta que no se proporciona un correo electrónico de contacto directo en este documento; todas las consultas deben dirigirse a través del enlace de contacto anterior para garantizar un seguimiento adecuado.\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eCopyright \u0026copy; 2026 TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS. Todos los derechos reservados.\u003c/strong\u003e\u003c/p\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Acuerdo de Licencia de Usuario Final (EULA)","languageLabel":"Español"},{"documentType":"privacy_consent","language":"ES","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"es\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003ePolítica de Cookies y Consentimiento de Privacidad - TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003ch2\u003ePolítica de Cookies y Consentimiento de Privacidad\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eÚltima actualización:\u003c/strong\u003e 1 de octubre de 2026\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAVISO IMPORTANTE:\u003c/strong\u003e AL ACCEDER, DESCARGAR, INSTALAR, NAVEGAR O UTILIZAR DE CUALQUIER OTRA FORMA EL SITIO WEB O LOS SERVICIOS DE TIMESAFE (\"EL SERVICIO\"), USTED (\"USTED\", \"SU\", O \"EL USUARIO\") RECONOCE QUE HA LEÍDO, ENTENDIDO Y ACEPTA ESTAR VINCULADO LEGALMENTE POR LOS TÉRMINOS Y CONDICIONES DE ESTA POLÍTICA DE COOKIES Y CONSENTIMIENTO DE PRIVACIDAD (\"POLÍTICA\"). SI NO ESTÁ DE ACUERDO CON ESTA POLÍTICA, DEBE CESAR DE INMEDIATO TODO USO DEL SERVICIO Y NO ACCEDER A ÉL. EL USO CONTINUADO DEL SERVICIO DESPUÉS DE CUALQUIER MODIFICACIÓN DE ESTA POLÍTICA CONSTITUYE SU ACEPTACIÓN DE DICHAS MODIFICACIONES.\u003c/p\u003e\n\u003cp\u003eEsta Política de Cookies explica qué son las cookies y cómo las utilizamos en nuestro Sitio Web y Servicios. Debe leer esta política íntegramente para comprender qué tipo de cookies utilizamos, la información que recopilamos a través de ellas y cómo se utiliza dicha información. Esta política forma parte integrante de nuestros Términos y Condiciones Generales y nuestra Política de Privacidad.\u003c/p\u003e\n\u003cp\u003eLas cookies generalmente no contienen información que identifique personalmente a un usuario. Sin embargo, la información personal que almacenamos sobre usted puede estar vinculada a la información almacenada y obtenida de las cookies. Para obtener más información sobre cómo usamos, almacenamos y mantenemos seguros sus datos personales, consulte nuestra Política de Privacidad completa.\u003c/p\u003e\n\u003cp\u003eNo almacenamos información personal sensible, como direcciones postales, contraseñas de cuentas, etc., en las cookies que utilizamos.\u003c/p\u003e\n\n\u003ch2\u003e1. Interpretación y Definiciones\u003c/h2\u003e\n\u003ch3\u003eInterpretación\u003c/h3\u003e\n\u003cp\u003eLas palabras cuya letra inicial está en mayúscula tienen significados definidos bajo las siguientes condiciones. Las siguientes definiciones tendrán el mismo significado independientemente de que aparezcan en singular o en plural.\u003c/p\u003e\n\u003ch3\u003eDefiniciones\u003c/h3\u003e\n\u003cp\u003eA los efectos de esta Política de Cookies:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD\u003c/strong\u003e se refiere a la Autoridad Nacional de Protección de Datos de Brasil, el organismo regulador responsable de supervisar el cumplimiento de la LGPD.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCompañía\u003c/strong\u003e (referida como \"la Compañía\", \"Nosotros\", \"Nos\" o \"Nuestro\" en esta Política) se refiere a \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, una entidad legalmente constituida bajo las leyes de Brasil, con CNPJ 41.648.990/0001-56, NIRE 35237097027, y con domicilio social en ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e significa pequeños archivos de texto que un sitio web coloca en su computadora, dispositivo móvil o cualquier otro dispositivo, que contienen detalles de su historial de navegación en ese sitio web entre sus múltiples usos. Estos pueden incluir balizas web, píxeles y otras tecnologías de seguimiento.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDatos Personales\u003c/strong\u003e tiene el significado que se le atribuye en la LGPD, refiriéndose a cualquier información relacionada con una persona física identificada o identificable.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e significa cualquier dispositivo que pueda acceder al Servicio, como una computadora, un teléfono celular o una tableta digital.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eLGPD\u003c/strong\u003e se refiere a la Ley General de Protección de Datos de Brasil (Lei Geral de Proteção de Dados Pessoais, Ley N° 13.709/2018), con todas sus enmiendas y regulaciones complementarias vigentes, incluidas las emitidas por la ANPD.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServicio\u003c/strong\u003e se refiere al software, la aplicación, la plataforma y todos los servicios relacionados proporcionados por TIMESAFE.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSitio Web\u003c/strong\u003e se refiere a TIMESAFE, accesible a través de los dominios y subdominios propiedad de la Compañía, incluido el acceso a través de \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eTerceros\u003c/strong\u003e se refiere a cualquier persona o entidad distinta de Usted o la Compañía, incluidos, entre otros, nuestros socios, proveedores de servicios, anunciantes y redes sociales.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e (y sus formas derivadas como \"Su\") significa el individuo que accede o utiliza el Servicio, o la compañía u otra entidad legal en nombre de la cual dicho individuo accede o utiliza el Servicio, según corresponda. Bajo la LGPD, Usted también puede ser referido como el \"Titular de los Datos\".\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e2. El Uso de las Cookies\u003c/h2\u003e\n\u003cp\u003eUtilizamos cookies y tecnologías de seguimiento similares para rastrear la actividad en Nuestro Servicio y almacenar cierta información. Las tecnologías de seguimiento utilizadas son balizas, etiquetas y scripts para recopilar y rastrear información y para mejorar y analizar Nuestro Servicio. El uso de estas tecnologías es fundamental para la operación, mejora y seguridad de nuestra plataforma. Los propósitos para los que utilizamos las cookies incluyen, entre otros:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eProporcionar y Mantener Nuestro Servicio:\u003c/strong\u003e Incluida la monitorización del uso de nuestro Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eGestionar Su Cuenta:\u003c/strong\u003e Para gestionar Su registro como usuario del Servicio. Las cookies pueden facilitar la autenticación y prevenir el uso fraudulento de las cuentas.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEjecución de un Contrato:\u003c/strong\u003e Para el desarrollo, cumplimiento y ejecución del contrato de compra de los productos, artículos o servicios que ha adquirido o de cualquier otro contrato con Nosotros a través del Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePersonalizar Su Experiencia:\u003c/strong\u003e Para recordar sus preferencias y configuraciones, como el idioma o la región, y proporcionarle una experiencia más personal.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSeguridad:\u003c/strong\u003e Para implementar medidas de seguridad y proteger al Servicio y a nuestros usuarios de actividades maliciosas.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAnálisis y Rendimiento:\u003c/strong\u003e Para entender cómo los usuarios interactúan con el Servicio, identificar áreas de mejora, solucionar problemas y optimizar el rendimiento.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePublicidad:\u003c/strong\u003e Para ofrecer publicidad que pueda ser relevante para Usted y sus intereses, tanto en nuestro Servicio como en sitios de terceros.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e3. Tipos de Cookies Utilizadas\u003c/h2\u003e\n\u003cp\u003eLas cookies pueden ser \"Cookies Persistentes\" o \"Cookies de Sesión\". Las Cookies Persistentes permanecen en su computadora personal o dispositivo móvil cuando se desconecta, mientras que las Cookies de Sesión se eliminan tan pronto como cierra su navegador web. Utilizamos tanto Cookies de Sesión como Persistentes para los fines que se detallan a continuación. La base legal para el procesamiento de datos a través de cookies no esenciales es su consentimiento, mientras que las cookies esenciales se procesan en base a nuestro interés legítimo de proporcionar un servicio funcional y seguro.\u003c/p\u003e\n\n\u003ch2\u003e4. Cookies Esenciales\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies de Sesión y Persistentes\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAdministradas por:\u003c/strong\u003e Nosotros (TIMESAFE)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePropósito:\u003c/strong\u003e ESTAS COOKIES SON ABSOLUTAMENTE INDISPENSABLES PARA PROPORCIONARLE LOS SERVICIOS DISPONIBLES A TRAVÉS DEL SITIO WEB Y PARA PERMITIRLE UTILIZAR ALGUNAS DE SUS FUNCIONES. Sin estas cookies, los servicios que ha solicitado, como la autenticación de usuarios, el acceso a áreas seguras, la gestión de suscripciones y la prevención del uso fraudulento de cuentas de usuario, no pueden proporcionarse. Solo utilizamos estas cookies para proporcionarle dichos servicios. Debido a su esencialidad, estas cookies no pueden ser desactivadas a través de nuestro centro de preferencias de cookies, ya que hacerlo impediría el funcionamiento del Servicio. Su uso del Servicio constituye la aceptación de estas cookies esenciales.\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies de Autenticación:\u003c/strong\u003e Identifican si ha iniciado sesión, permitiéndole acceder a las funciones de su cuenta sin tener que introducir sus credenciales en cada página.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies de Seguridad:\u003c/strong\u003e Ayudan a detectar y prevenir riesgos de seguridad. Por ejemplo, las utilizamos para proteger su cuenta y sus datos contra el acceso no autorizado.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies de Aceptación de Políticas:\u003c/strong\u003e Identifican si los usuarios han aceptado el uso de cookies y han sido notificados sobre nuestras políticas, para evitar mostrarle el mismo banner repetidamente.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e5. Cookies de Funcionalidad\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies Persistentes\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAdministradas por:\u003c/strong\u003e Nosotros (TIMESAFE)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePropósito:\u003c/strong\u003e Estas cookies nos permiten recordar las elecciones que realiza cuando utiliza el Sitio Web, como recordar sus detalles de inicio de sesión, preferencia de idioma o configuraciones de la interfaz de usuario. El propósito de estas cookies es proporcionarle una experiencia más personal y evitar que tenga que volver a introducir sus preferencias cada vez que utiliza el Sitio Web. Si elige deshabilitar estas cookies, es posible que algunas partes del Servicio no funcionen como se espera y su experiencia puede ser menos personalizada.\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies de Preferencia de Idioma:\u003c/strong\u003e Recuerdan su idioma seleccionado para mostrar el sitio en su idioma preferido en visitas futuras.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies de Configuración de Usuario:\u003c/strong\u003e Almacenan sus preferencias sobre cómo se muestra el Servicio, como el tema (claro/oscuro) o la disposición de los elementos.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e6. Cookies de Seguimiento y Rendimiento\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies Persistentes\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAdministradas por:\u003c/strong\u003e Terceros (por ejemplo, Google Analytics, Hotjar)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePropósito:\u003c/strong\u003e Estas cookies se utilizan para rastrear información sobre el tráfico al Sitio Web y cómo los usuarios lo utilizan. La información recopilada a través de estas cookies puede identificarlo directa o indirectamente como un visitante individual porque generalmente está vinculada a un identificador seudónimo asociado con el dispositivo que utiliza para acceder al Sitio Web. También podemos usar estas cookies para probar nuevas páginas, características o nuevas funcionalidades del Sitio Web para ver cómo reaccionan nuestros usuarios a ellas. La información recopilada es agregada y anónima en la medida de lo posible y se utiliza exclusivamente para fines estadísticos y de mejora del Servicio.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEXENCIÓN DE RESPONSABILIDAD SOBRE TERCEROS:\u003c/strong\u003e NO TENEMOS CONTROL SOBRE LAS COOKIES DE TERCEROS NI SOBRE CÓMO UTILIZAN LA INFORMACIÓN QUE RECOPILAN. DICHAS COOKIES Y LA RECOPILACIÓN DE DATOS ESTÁN SUJETAS A LAS POLÍTICAS DE PRIVACIDAD DE DICHOS TERCEROS. NO SOMOS RESPONSABLES DE LAS PRÁCTICAS DE PRIVACIDAD O EL CONTENIDO DE NINGÚN SERVICIO DE TERCEROS.\u003c/p\u003e\n\n\u003ch2\u003e7. Cookies de Publicidad\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies Persistentes\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAdministradas por:\u003c/strong\u003e Terceros (por ejemplo, Google AdSense, Meta, LinkedIn)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePropósito:\u003c/strong\u003e Estas cookies rastrean sus hábitos de navegación para permitirnos mostrar publicidad que probablemente sea de su interés. Estas cookies utilizan información sobre su historial de navegación para agruparlo con otros usuarios que tienen intereses similares. En base a esa información, y con nuestro permiso, los anunciantes de terceros pueden colocar cookies para permitirles mostrar anuncios que creemos que serán relevantes para sus intereses mientras se encuentra en sitios web de terceros. También se utilizan para limitar la cantidad de veces que ve un anuncio y para ayudar a medir la efectividad de las campañas publicitarias. Al deshabilitar estas cookies, la publicidad que vea puede ser menos relevante para usted.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEXENCIÓN DE RESPONSABILIDAD:\u003c/strong\u003e LA COMPAÑÍA NO SE HACE RESPONSABLE DEL CONTENIDO, LAS PRÁCTICAS O LAS POLÍTICAS DE LOS ANUNCIANTES TERCEROS. CUALQUIER INTERACCIÓN O TRANSACCIÓN QUE REALICE CON DICHOS ANUNCIANTES ES EXCLUSIVAMENTE ENTRE USTED Y EL TERCERO.\u003c/p\u003e\n\n\u003ch2\u003e8. Sus Opciones\u003c/h2\u003e\n\u003cp\u003eUsted tiene el derecho de decidir si acepta o rechaza las cookies (a excepción de las cookies esenciales). Puede ejercer sus preferencias de cookies a través de nuestro banner de consentimiento de cookies la primera vez que visita nuestro Sitio Web, o en cualquier momento a través de la configuración de su cuenta o navegador.\u003c/p\u003e\n\u003cp\u003eSi prefiere evitar el uso de cookies no esenciales en el Sitio Web, primero debe deshabilitar el uso de cookies en su navegador y luego eliminar las cookies guardadas en su navegador asociadas a este Sitio Web. Puede utilizar esta opción para impedir el uso de cookies en cualquier momento.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCONSECUENCIAS DE LA DESACTIVACIÓN:\u003c/strong\u003e SI NO ACEPTA NUESTRAS COOKIES O LAS DESHABILITA, PUEDE EXPERIMENTAR INCONVENIENTES EN EL USO DEL SITIO WEB Y ALGUNAS FUNCIONES PODRÍAN NO FUNCIONAR CORRECTAMENTE. POR EJEMPLO, ES POSIBLE QUE NO PODAMOS RECONOCER SU DISPOSITIVO Y NECESITE INICIAR SESIÓN CADA VEZ QUE VISITE EL SITIO.\u003c/p\u003e\n\u003cp\u003ePara obtener más información sobre cómo gestionar y eliminar cookies, visite allaboutcookies.org. También puede encontrar instrucciones para su navegador específico a continuación:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eGoogle Chrome:\u003c/strong\u003e \u003ca href=\"https://support.google.com/accounts/answer/32050\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://support.google.com/accounts/answer/32050\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eMicrosoft Edge:\u003c/strong\u003e \u003ca href=\"https://support.microsoft.com/en-us/windows/microsoft-edge-browsing-data-and-privacy-bb8174ba-9d73-dcf2-9b4a-c582b4e640dd\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://support.microsoft.com/en-us/windows/microsoft-edge-browsing-data-and-privacy-bb8174ba-9d73-dcf2-9b4a-c582b4e640dd\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eMozilla Firefox:\u003c/strong\u003e \u003ca href=\"https://support.mozilla.org/en-US/kb/delete-cookies-remove-info-websites-stored\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://support.mozilla.org/en-US/kb/delete-cookies-remove-info-websites-stored\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eApple Safari:\u003c/strong\u003e \u003ca href=\"https://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e9. Contenido Incorporado\u003c/h2\u003e\n\u003cp\u003eEl Servicio puede incluir contenido incorporado de otros sitios web (por ejemplo, videos de YouTube, mapas de Google, artículos, fuentes de redes sociales, etc.). El contenido incorporado de otros sitios web se comporta exactamente de la misma manera que si el visitante hubiera visitado el otro sitio web.\u003c/p\u003e\n\u003cp\u003eESTOS SITIOS WEB DE TERCEROS PUEDEN RECOPILAR DATOS SOBRE USTED, UTILIZAR SUS PROPIAS COOKIES, INCORPORAR SEGUIMIENTO ADICIONAL DE TERCEROS Y MONITOREAR SU INTERACCIÓN CON ESE CONTENIDO INCORPORADO, INCLUIDO EL SEGUIMIENTO DE SU INTERACCIÓN CON EL CONTENIDO INCORPORADO SI TIENE UNA CUENTA Y HA INICIADO SESIÓN EN ESE SITIO WEB. LA COMPAÑÍA NO TIENE CONTROL NI ASUME RESPONSABILIDAD ALGUNA POR EL CONTENIDO, LAS POLÍTICAS DE PRIVACIDAD O LAS PRÁCTICAS DE LOS SITIOS O SERVICIOS DE TERCEROS.\u003c/p\u003e\n\u003cp\u003eLe recomendamos encarecidamente que lea los términos y condiciones y las políticas de privacidad de cualquier sitio web o servicio de terceros que visite.\u003c/p\u003e\n\n\u003chr\u003e\n\n\u003ch2\u003eDISPOSICIONES LEGALES Y LIMITACIÓN DE RESPONSABILIDAD\u003c/h2\u003e\n\n\u003ch3\u003eEXENCIÓN DE GARANTÍAS\u003c/h3\u003e\n\u003cp\u003eEL SERVICIO Y TODO SU CONTENIDO SE PROPORCIONAN \"TAL CUAL\" (\"AS IS\") Y \"SEGÚN DISPONIBILIDAD\" (\"AS AVAILABLE\"), SIN GARANTÍAS DE NINGÚN TIPO, YA SEAN EXPRESAS, IMPLÍCITAS, ESTATUTARIAS O DE OTRO TIPO. HASTA EL MÁXIMO GRADO PERMITIDO POR LA LEY APLICABLE, LA COMPAÑÍA RENUNCIA EXPRESAMENTE A TODAS LAS GARANTÍAS, INCLUIDAS, PERO NO LIMITADAS A, LAS GARANTÍAS IMPLÍCITAS DE COMERCIABILIDAD, IDONEIDAD PARA UN PROPÓSITO PARTICULAR, TÍTULO Y NO INFRACCIÓN.\u003c/p\u003e\n\u003cp\u003eLA COMPAÑÍA NO GARANTIZA QUE: (A) EL SERVICIO CUMPLIRÁ CON SUS REQUISITOS; (B) EL SERVICIO SERÁ ININTERRUMPIDO, OPORTUNO, SEGURO O LIBRE DE ERRORES; (C) LOS RESULTADOS QUE SE PUEDAN OBTENER DEL USO DEL SERVICIO SERÁN EXACTOS O FIABLES; (D) LA CALIDAD DE CUALQUIER PRODUCTO, SERVICIO, INFORMACIÓN U OTRO MATERIAL OBTENIDO A TRAVÉS DEL SERVICIO CUMPLIRÁ CON SUS EXPECTATIVAS; O (E) CUALQUIER ERROR EN EL SOFTWARE SERÁ CORREGIDO. NINGUNA INFORMACIÓN O ASESORAMIENTO, YA SEA ORAL O ESCRITO, OBTENIDO POR USTED DE LA COMPAÑÍA O A TRAVÉS DEL SERVICIO CREARÁ NINGUNA GARANTÍA NO EXPRESAMENTE ESTABLECIDA EN ESTA POLÍTICA.\u003c/p\u003e\n\n\u003ch3\u003eLIMITACIÓN DE RESPONSABILIDAD\u003c/h3\u003e\n\u003cp\u003eEN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO LA COMPAÑÍA, SUS AFILIADOS, DIRECTORES, EMPLEADOS, AGENTES, PROVEEDORES O LICENCIANTES SERÁN RESPONSABLES DE NINGÚN DAÑO ESPECIAL, INCIDENTAL, INDIRECTO, CONSECUENTE O PUNITIVO DE NINGÚN TIPO (INCLUYENDO, SIN LIMITACIÓN, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS U OTRA INFORMACIÓN, INTERRUPCIÓN DEL NEGOCIO, LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD) QUE SURJA DE O ESTÉ RELACIONADO DE ALGUNA MANERA CON EL USO O LA IMPOSIBILIDAD DE USAR EL SERVICIO, EL SOFTWARE DE TERCEROS Y/O EL HARDWARE DE TERCEROS UTILIZADO CON EL SERVICIO, O DE OTRO MODO EN RELACIÓN CON CUALQUIER DISPOSICIÓN DE ESTA POLÍTICA, INCLUSO SI LA COMPAÑÍA O CUALQUIER PROVEEDOR HA SIDO ADVERTIDO DE LA POSIBILIDAD DE TALES DAÑOS E INCLUSO SI EL REMEDIO NO CUMPLE CON SU PROPÓSITO ESENCIAL.\u003c/p\u003e\n\u003cp\u003eLA RESPONSABILIDAD TOTAL ACUMULADA DE LA COMPAÑÍA HACIA USTED BAJO ESTA POLÍTICA, POR CUALQUIER CAUSA Y BAJO CUALQUIER TEORÍA DE RESPONSABILIDAD, NO EXCEDERÁ LA CANTIDAD MAYOR ENTRE: (A) EL IMPORTE TOTAL PAGADO POR USTED A LA COMPAÑÍA POR EL SERVICIO DURANTE LOS DOCE (12) MESES INMEDIATAMENTE ANTERIORES AL EVENTO QUE DIO LUGAR A LA RECLAMACIÓN; O (B) VEINTE DÓLARES ESTADOUNIDENSES (USD $20.00).\u003c/p\u003e\n\u003cp\u003eALGUNAS JURISDICCIONES NO PERMITEN LA EXCLUSIÓN DE CIERTAS GARANTÍAS O LA LIMITACIÓN O EXCLUSIÓN DE RESPONSABILIDAD POR DAÑOS INCIDENTALES O CONSECUENTES. EN CONSECUENCIA, ALGUNAS DE LAS LIMITACIONES ANTERIORES PUEDEN NO APLICARSE A USTED. EN DICHAS JURISDICCIONES, LA RESPONSABILIDAD DE LA COMPAÑÍA SE LIMITARÁ EN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY.\u003c/p\u003e\n\n\u003ch3\u003eIndemnización\u003c/h3\u003e\n\u003cp\u003eUsted acepta indemnizar, defender y mantener indemne a la Compañía, sus afiliados, directores, empleados, agentes, licenciantes y proveedores de y contra todas y cada una de las reclamaciones, responsabilidades, daños, pérdidas, costos, juicios y gastos (incluidos los honorarios razonables de abogados) que surjan de o estén relacionados de alguna manera con: (a) Su uso o mal uso del Servicio; (b) cualquier incumplimiento de esta Política por su parte; (c) cualquier contenido que publique, envíe o transmita a través del Servicio; (d) Su violación de cualquier ley, norma o regulación aplicable; o (e) Su violación de los derechos de cualquier tercero. La Compañía se reserva el derecho, a su propio costo, de asumir la defensa y el control exclusivos de cualquier asunto sujeto a indemnización por su parte, en cuyo caso Usted cooperará plenamente con la Compañía para hacer valer cualquier defensa disponible.\u003c/p\u003e\n\n\u003ch3\u003eAsunción de Riesgo\u003c/h3\u003e\n\u003cp\u003eUSTED ASUME LA TOTAL RESPONSABILIDAD Y RIESGO POR SU USO DEL SERVICIO Y DE INTERNET. USTED RECONOCE Y ACEPTA QUE CUALQUIER INFORMACIÓN QUE ENVÍE O RECIBA DURANTE SU USO DEL SERVICIO PUEDE NO SER SEGURA Y PUEDE SER INTERCEPTADA POR PARTES NO AUTORIZADAS. EL SERVICIO SE PROPORCIONA \"TAL CUAL\" Y SIN GARANTÍAS DE NINGÚN TIPO. LA COMPAÑÍA NO SERÁ RESPONSABLE DE NINGÚN DAÑO RESULTANTE DEL USO O LA IMPOSIBILIDAD DE USAR EL SERVICIO, INCLUIDOS LOS DAÑOS CAUSADOS POR MALWARE, VIRUS O CUALQUIER INCORRECCIÓN O INCOMPLETITUD EN EL PROGRAMA INFORMÁTICO O EL SITIO WEB.\u003c/p\u003e\n\n\u003ch3\u003eLey Aplicable y Jurisdicción\u003c/h3\u003e\n\u003cp\u003eEsta Política se regirá e interpretará de acuerdo con las leyes de la República Federativa de Brasil, sin tener en cuenta sus disposiciones sobre conflicto de leyes.\u003c/p\u003e\n\u003cp\u003eCualquier disputa, controversia o reclamación que surja de o esté relacionada con esta Política, su incumplimiento, terminación o validez, se someterá a la jurisdicción exclusiva de los tribunales de la ciudad de São Paulo, Estado de São Paulo, Brasil. Las partes renuncian irrevocablemente a cualquier objeción a la jurisdicción y competencia de dichos tribunales.\u003c/p\u003e\n\n\u003chr\u003e\n\n\u003ch2\u003eCUMPLIMIENTO CON LA LEY GENERAL DE PROTECCIÓN DE DATOS (LGPD) DE BRASIL\u003c/h2\u003e\n\u003cp\u003eLa Compañía está comprometida a procesar los Datos Personales de acuerdo con la LGPD (Ley N° 13.709/2018) y sus regulaciones actualizadas. Esta sección describe sus derechos y nuestras obligaciones bajo la LGPD en relación con el uso de cookies y el procesamiento de sus Datos Personales.\u003c/p\u003e\n\n\u003ch3\u003ePrincipios y Base Legal\u003c/h3\u003e\n\u003cp\u003eProcesamos sus Datos Personales basándonos en los principios de finalidad, adecuación, necesidad, libre acceso, calidad de los datos, transparencia, seguridad, prevención, no discriminación, y rendición de cuentas. La base legal para procesar datos a través de cookies esenciales es nuestro interés legítimo en operar un servicio seguro y funcional. Para todas las demás cookies (funcionalidad, rendimiento, publicidad), la base legal es su consentimiento explícito, que puede otorgar o retirar en cualquier momento.\u003c/p\u003e\n\n\u003ch3\u003eDerechos de los Titulares de Datos\u003c/h3\u003e\n\u003cp\u003eBajo la LGPD, Usted, como titular de los datos, tiene los siguientes derechos con respecto a sus Datos Personales:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eDerecho de Confirmación y Acceso:\u003c/strong\u003e El derecho a confirmar la existencia de procesamiento de sus datos y a acceder a ellos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerecho de Corrección:\u003c/strong\u003e El derecho a solicitar la corrección de datos incompletos, inexactos o desactualizados.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerecho de Anonimización, Bloqueo o Eliminación:\u003c/strong\u003e El derecho a solicitar la anonimización, bloqueo o eliminación de datos innecesarios, excesivos o procesados en incumplimiento de la LGPD.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerecho a la Portabilidad de los Datos:\u003c/strong\u003e El derecho a solicitar la transferencia de sus datos a otro proveedor de servicios o productos, sujeto a la reglamentación de la ANPD.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerecho de Eliminación:\u003c/strong\u003e El derecho a solicitar la eliminación de los datos personales procesados con su consentimiento.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerecho a la Información:\u003c/strong\u003e El derecho a ser informado sobre las entidades públicas y privadas con las que la Compañía ha compartido datos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerecho a la Revocación del Consentimiento:\u003c/strong\u003e El derecho a revocar su consentimiento en cualquier momento. La revocación no afectará la legalidad del procesamiento basado en el consentimiento antes de su retirada.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePara ejercer cualquiera de estos derechos, por favor contáctenos a través de los canales proporcionados en la sección \"Contacto\".\u003c/p\u003e\n\n\u003ch3\u003eTransferencias Internacionales de Datos\u003c/h3\u003e\n\u003cp\u003eSus datos, incluidos los Datos Personales, pueden ser transferidos y mantenidos en computadoras ubicadas fuera de su estado, provincia, país u otra jurisdicción gubernamental donde las leyes de protección de datos pueden diferir de las de su jurisdicción. La Compañía tiene su sede en Brasil, pero utiliza proveedores de servicios globales. En cumplimiento con la \u003cstrong\u003eResolución CD/ANPD N° 19/2024\u003c/strong\u003e, cualquier transferencia internacional de datos personales se realizará utilizando mecanismos aprobados por la ANPD, como las Cláusulas Contractuales Tipo (Standard Contractual Clauses), para garantizar un nivel adecuado de protección de datos.\u003c/p\u003e\n\n\u003ch3\u003eNotificación de Incidentes de Seguridad\u003c/h3\u003e\n\u003cp\u003eEn caso de un incidente de seguridad que pueda acarrear un riesgo o daño relevante para los titulares de los datos, la Compañía se compromete a cumplir con las regulaciones de la LGPD. Notificaremos a la ANPD y a los titulares de datos afectados dentro de un plazo razonable, según lo define la ley, que actualmente es de \u003cstrong\u003etres (3) días hábiles\u003c/strong\u003e a partir del conocimiento del incidente. La notificación describirá la naturaleza de los datos personales afectados, la información sobre los titulares involucrados, las medidas técnicas y de seguridad utilizadas, los riesgos relacionados con el incidente y las medidas que se han tomado o se tomarán para revertir o mitigar los efectos del perjuicio.\u003c/p\u003e\n\n\u003ch3\u003eDelegado de Protección de Datos (DPO)\u003c/h3\u003e\n\u003cp\u003eLa Compañía ha designado un Delegado de Protección de Datos (DPO) para supervisar el cumplimiento de la LGPD y actuar como punto de contacto entre la Compañía, los titulares de los datos y la ANPD. Puede dirigir cualquier pregunta o solicitud relacionada con sus Datos Personales a nuestro DPO a través del formulario de contacto disponible en nuestro sitio web.\u003c/p\u003e\n\n\u003chr\u003e\n\n\u003ch2\u003eTÉRMINOS ADICIONALES PARA SERVICIOS PAGOS\u003c/h2\u003e\n\n\u003ch3\u003eSuscripciones y Pagos\u003c/h3\u003e\n\u003cp\u003eEl Servicio o algunas partes del Servicio están disponibles únicamente con una Suscripción de pago. Se le facturará por adelantado de forma recurrente y periódica (como mensual o anual), según el tipo de plan de Suscripción que seleccione al comprar la Suscripción. Al final de cada período, su Suscripción se renovará automáticamente bajo las mismas condiciones, a menos que usted la cancele o la Compañía la cancele.\u003c/p\u003e\n\n\u003ch3\u003eCancelación de Suscripción\u003c/h3\u003e\n\u003cp\u003ePuede cancelar la renovación de su Suscripción a través de la página de configuración de su cuenta o contactándonos. No recibirá un reembolso por las tarifas ya pagadas por su período de Suscripción actual y podrá acceder al Servicio hasta el final de su período de Suscripción actual.\u003c/p\u003e\n\n\u003ch3\u003eCambios de Precio\u003c/h3\u003e\n\u003cp\u003eLa Compañía, a su entera discreción y en cualquier momento, puede modificar las tarifas de la Suscripción. Cualquier cambio en la tarifa de la Suscripción entrará en vigencia al final del período de Suscripción vigente en ese momento. La Compañía le proporcionará un aviso previo razonable de cualquier cambio en las tarifas de Suscripción para darle la oportunidad de cancelar su Suscripción antes de que dicho cambio entre en vigencia. Su uso continuado del Servicio después de que el cambio de tarifa de Suscripción entre en vigencia constituye su acuerdo de pagar el monto de la tarifa de Suscripción modificada.\u003c/p\u003e\n\n\u003ch3\u003eReembolsos\u003c/h3\u003e\n\u003cp\u003eSalvo cuando lo exija la ley, las tarifas de Suscripción pagadas no son reembolsables. Ciertas solicitudes de reembolso para Suscripciones pueden ser consideradas por la Compañía caso por caso y otorgadas a la entera discreción de la Compañía.\u003c/p\u003e\n\n\u003ch3\u003ePrueba Gratuita\u003c/h3\u003e\n\u003cp\u003eLa Compañía puede, a su entera discreción, ofrecer una Suscripción con una prueba gratuita por un período de tiempo limitado. Es posible que se le solicite que ingrese su información de facturación para registrarse en la prueba gratuita. Si ingresa su información de facturación al registrarse para una prueba gratuita, no se le cobrará hasta que la prueba gratuita haya expirado. El último día del período de prueba gratuita, a menos que cancele su Suscripción, se le cobrarán automáticamente las tarifas de Suscripción aplicables para el tipo de Suscripción que haya seleccionado.\u003c/p\u003e\n\n\u003chr\u003e\n\n\u003ch2\u003eModificaciones a esta Política de Cookies\u003c/h2\u003e\n\u003cp\u003eNos reservamos el derecho de modificar esta Política en cualquier momento, a nuestra entera discreción. Cuando lo hagamos, actualizaremos la fecha de \"Última actualización\" en la parte superior de esta página. Si los cambios son sustanciales, haremos esfuerzos razonables para notificarle, por ejemplo, mediante un aviso destacado en nuestro Sitio Web o enviándole una notificación a la dirección de correo electrónico que nos haya proporcionado. El uso continuado del Servicio después de la publicación de los cambios constituirá su aceptación de dichos cambios. Es su responsabilidad revisar esta Política periódicamente para informarse de cualquier cambio.\u003c/p\u003e\n\n\u003ch2\u003e10. Contacto\u003c/h2\u003e\n\u003cp\u003eSi tiene alguna pregunta, inquietud o queja sobre esta Política de Cookies o nuestras prácticas de datos, por favor contáctenos. Nuestro equipo está disponible para ayudarlo a ejercer sus derechos y para aclarar cualquier duda.\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eVisitando nuestra página de contacto: \u003ca href=\"https://www.timesafe.com.br/contato.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003ePor correo postal a la atención del Delegado de Protección de Datos (DPO) en nuestra dirección legal: \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Consentimiento de Privacidad (Cookies)","languageLabel":"Español"},{"documentType":"terms_and_conditions","language":"ES","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"es\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003ctitle\u003eTérminos y Condiciones - TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003ch2\u003eTérminos y Condiciones de TIMESAFE\u003c/h2\u003e\n\n\u003cp\u003e\u003cstrong\u003eÚltima actualización: 1 de octubre de 2026\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003ePor favor, lea estos términos y condiciones detenidamente antes de utilizar Nuestro Servicio. Este documento constituye un contrato legalmente vinculante entre usted (en adelante, \"Usted\" o el \"Usuario\") y TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS (en adelante, la \"Empresa\", \"Nosotros\", \"Nos\" o \"Nuestro\").\u003c/p\u003e\n\n\u003ch2\u003e1. Interpretación y Definiciones\u003c/h2\u003e\n\n\u003ch3\u003eInterpretación\u003c/h3\u003e\n\u003cp\u003eLas palabras cuya letra inicial está en mayúscula tienen significados definidos en las siguientes condiciones. Las siguientes definiciones tendrán el mismo significado independientemente de que aparezcan en singular o en plural.\u003c/p\u003e\n\n\u003ch3\u003eDefiniciones\u003c/h3\u003e\n\u003cp\u003ePara los fines de estos Términos y Condiciones:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eAfiliado\u003c/strong\u003e significa una entidad que controla, es controlada por, o está bajo control común con una parte, donde \"control\" significa la propiedad del 50% o más de las acciones, participación accionaria u otros valores con derecho a voto para la elección de directores u otra autoridad de gestión.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAplicación\u003c/strong\u003e se refiere al programa de software proporcionado por la Empresa descargado por Usted en cualquier Dispositivo electrónico, denominado TIMESAFE.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eContenido\u003c/strong\u003e se refiere a contenido como texto, imágenes u otra información que puede ser publicada, cargada, enlazada o puesta a disposición por Usted, independientemente de la forma de ese contenido.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eContenido del Usuario\u003c/strong\u003e se refiere a todo el Contenido que Usted o cualquier usuario de su Cuenta envía, publica, muestra, transmite o pone a disposición a través del Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCuenta\u003c/strong\u003e significa una cuenta única creada para que Usted acceda a nuestro Servicio o a partes de nuestro Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e significa cualquier dispositivo que pueda acceder al Servicio, como una computadora, un teléfono celular o una tableta digital.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"la Empresa\", \"Nosotros\", \"Nos\" o \"Nuestro\" en este Acuerdo) se refiere a TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS, con domicilio en ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL. Para fines de la LGPD, la Empresa es el Controlador de Datos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePaís\u003c/strong\u003e se refiere a: República Federativa de Brasil.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePedidos\u003c/strong\u003e significa una solicitud por parte de Usted para comprar Bienes o Servicios de Nosotros.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePropiedad Intelectual\u003c/strong\u003e se refiere a todas las patentes, derechos de autor, marcas comerciales, secretos comerciales, imagen comercial (trade dress), y cualquier otro derecho de propiedad intelectual reconocido en cualquier jurisdicción del mundo.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServicio\u003c/strong\u003e se refiere a la Aplicación, el Sitio Web o ambos, y todos los servicios, características y funcionalidades relacionados ofrecidos por la Empresa.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSuscripción\u003c/strong\u003e se refiere a los servicios o al acceso al Servicio ofrecido por la Empresa a Usted sobre una base de pago y recurrente.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSitio Web\u003c/strong\u003e se refiere a TIMESAFE, accesible desde \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eTérminos y Condiciones\u003c/strong\u003e (también referidos como \"Términos\") significan estos Términos y Condiciones que forman el acuerdo completo entre Usted y la Empresa con respecto al uso del Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e significa el individuo que accede o utiliza el Servicio, o la empresa, u otra entidad legal en nombre de la cual dicho individuo está accediendo o utilizando el Servicio, según corresponda.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e2. Reconocimiento\u003c/h2\u003e\n\u003cp\u003eEstos son los Términos y Condiciones que rigen el uso de este Servicio y el acuerdo que opera entre Usted y la Empresa. Estos Términos y Condiciones establecen los derechos y obligaciones de todos los usuarios con respecto al uso del Servicio.\u003c/p\u003e\n\u003cp\u003eSu acceso y uso del Servicio están condicionados a su aceptación y cumplimiento de estos Términos y Condiciones. Estos Términos y Condiciones se aplican a todos los visitantes, usuarios y otras personas que accedan o utilicen el Servicio.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAL ACCEDER, DESCARGAR, INSTALAR O UTILIZAR EL SERVICIO DE CUALQUIER MANERA, USTED RECONOCE QUE HA LEÍDO, ENTENDIDO Y ACEPTA ESTAR LEGALMENTE VINCULADO POR ESTOS TÉRMINOS Y CONDICIONES EN SU TOTALIDAD. SI USTED NO ESTÁ DE ACUERDO CON CUALQUIER PARTE DE ESTOS TÉRMINOS Y CONDICIONES, NO DEBE ACCEDER, DESCARGAR, INSTALAR NI UTILIZAR EL SERVICIO.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eUsted declara que tiene más de 18 años de edad y posee la capacidad legal para celebrar un contrato vinculante. La Empresa no permite que personas menores de 18 años utilicen el Servicio. El Servicio no está destinado ni dirigido a niños.\u003c/p\u003e\n\u003cp\u003eSu acceso y uso del Servicio también están condicionados a su aceptación y cumplimiento de la Política de Privacidad de la Empresa. Nuestra Política de Privacidad describe nuestras políticas y procedimientos sobre la recopilación, uso y divulgación de su información personal cuando utiliza la Aplicación o el Sitio Web y le informa sobre sus derechos de privacidad y cómo la ley lo protege. Por favor, lea nuestra Política de Privacidad cuidadosamente antes de usar nuestro Servicio.\u003c/p\u003e\n\u003cp\u003eEl uso continuado del Servicio después de cualquier modificación a estos Términos constituye su aceptación vinculante de dichas modificaciones.\u003c/p\u003e\n\n\u003ch2\u003e3. Cuentas de Usuario\u003c/h2\u003e\n\u003cp\u003eAl crear una Cuenta con Nosotros, Usted debe proporcionarnos información que sea precisa, completa y actual en todo momento. El no hacerlo constituye una violación de los Términos, lo que puede resultar en la terminación inmediata de su Cuenta en nuestro Servicio.\u003c/p\u003e\n\u003cp\u003eUsted es responsable de salvaguardar la contraseña que utiliza para acceder al Servicio y de cualquier actividad o acción bajo su contraseña, ya sea que su contraseña sea con nuestro Servicio o con un servicio de terceros. Usted es el único responsable de mantener la confidencialidad de la información de su Cuenta.\u003c/p\u003e\n\u003cp\u003eUsted se compromete a no divulgar su contraseña a ningún tercero. Debe notificarnos inmediatamente al tomar conocimiento de cualquier violación de seguridad o uso no autorizado de su Cuenta. La notificación debe realizarse a través de nuestro formulario de contacto oficial.\u003c/p\u003e\n\u003cp\u003eUsted no puede usar como nombre de usuario el nombre de otra persona o entidad o que no esté legalmente disponible para su uso, un nombre o marca comercial que esté sujeto a los derechos de otra persona o entidad que no sea Usted sin la autorización apropiada, o un nombre que sea ofensivo, vulgar u obsceno. Nos reservamos el derecho de rechazar el registro, o cancelar una cuenta, a nuestra entera discreción.\u003c/p\u003e\n\n\u003ch2\u003e4. Pedidos de Bienes/Servicios\u003c/h2\u003e\n\u003cp\u003eAl realizar un Pedido de Bienes o Servicios (incluidas las Suscripciones) disponibles en el Servicio, Usted garantiza que es legalmente capaz de celebrar contratos vinculantes.\u003c/p\u003e\n\u003ch3\u003eSu Información\u003c/h3\u003e\n\u003cp\u003eSi desea realizar un Pedido de Bienes o Servicios disponibles en el Servicio, es posible que se le solicite que proporcione cierta información relevante para su Pedido, incluyendo, sin limitación, su nombre, su correo electrónico, su número de teléfono, su número de tarjeta de crédito, la fecha de vencimiento de su tarjeta de crédito, su dirección de facturación y su información de envío.\u003c/p\u003e\n\u003cp\u003eUsted declara y garantiza que: (i) tiene el derecho legal de usar cualquier tarjeta de crédito o débito u otro método de pago en relación con cualquier Pedido; y que (ii) la información que nos proporciona es verdadera, correcta y completa.\u003c/p\u003e\n\u003cp\u003eAl enviar dicha información, Usted nos otorga el derecho de proporcionar la información a terceros procesadores de pagos con el fin de facilitar la finalización de su Pedido.\u003c/p\u003e\n\u003ch3\u003eCancelación de Pedidos\u003c/h3\u003e\n\u003cp\u003eNos reservamos el derecho de rechazar o cancelar su Pedido en cualquier momento por ciertas razones, incluyendo pero no limitado a:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eDisponibilidad de bienes/servicios\u003c/li\u003e\n    \u003cli\u003eErrores en la descripción o precios de los bienes/servicios\u003c/li\u003e\n    \u003cli\u003eErrores en su Pedido\u003c/li\u003e\n    \u003cli\u003eSospecha de fraude o transacción no autorizada o ilegal\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNos reservamos el derecho de rechazar o cancelar su Pedido si se sospecha de fraude o de una transacción no autorizada o ilegal.\u003c/p\u003e\n\n\u003ch2\u003e5. Suscripciones\u003c/h2\u003e\n\u003ch3\u003ePeríodo de Suscripción\u003c/h3\u003e\n\u003cp\u003eEl Servicio o algunas partes del Servicio están disponibles solo con una Suscripción de pago. Se le facturará por adelantado de forma recurrente y periódica (como mensual o anual), dependiendo del tipo de plan de Suscripción que seleccione al comprar la Suscripción.\u003c/p\u003e\n\u003cp\u003eAl final de cada período, su Suscripción se renovará automáticamente bajo las mismas condiciones a menos que Usted la cancele o la Empresa la cancele. La renovación automática garantiza un servicio ininterrumpido.\u003c/p\u003e\n\u003ch3\u003eCancelación de la Suscripción\u003c/h3\u003e\n\u003cp\u003eUsted puede cancelar la renovación de su Suscripción ya sea a través de la página de configuración de su Cuenta o contactándonos a través del enlace de contacto oficial. Usted no recibirá un reembolso por las tarifas ya pagadas por su período de Suscripción actual y podrá acceder al Servicio hasta el final de su período de Suscripción actual.\u003c/p\u003e\n\u003ch3\u003eFacturación\u003c/h3\u003e\n\u003cp\u003eUsted deberá proporcionar a la Empresa información de facturación precisa y completa, incluyendo nombre completo, dirección, estado, código postal, y una información de método de pago válida. En caso de que la facturación automática falle por cualquier motivo, la Empresa emitirá una factura electrónica indicando que debe proceder manualmente, dentro de una fecha límite determinada, con el pago completo correspondiente al período de facturación indicado en la factura. La falta de pago puede resultar en la suspensión o terminación de su acceso al Servicio.\u003c/p\u003e\n\u003ch3\u003eCambios de Precio\u003c/h3\u003e\n\u003cp\u003eLa Empresa, a su entera discreción y en cualquier momento, puede modificar las tarifas de Suscripción. Cualquier cambio en la tarifa de Suscripción entrará en vigencia al final del período de Suscripción entonces vigente. La Empresa le proporcionará un aviso previo razonable de cualquier cambio en las tarifas de Suscripción para darle la oportunidad de terminar su Suscripción antes de que dicho cambio entre en vigencia. Su uso continuado del Servicio después de que el cambio en la tarifa de Suscripción entre en vigencia constituye su acuerdo de pagar el monto modificado de la tarifa de Suscripción.\u003c/p\u003e\n\u003ch3\u003eReembolsos\u003c/h3\u003e\n\u003cp\u003eSalvo que lo exija la ley, las tarifas de Suscripción pagadas no son reembolsables. Ciertas solicitudes de reembolso para Suscripciones pueden ser consideradas por la Empresa caso por caso y otorgadas a la entera discreción de la Empresa.\u003c/p\u003e\n\u003ch3\u003ePrueba Gratuita\u003c/h3\u003e\n\u003cp\u003eLa Empresa puede, a su entera discreción, ofrecer una Suscripción con una prueba gratuita por un período de tiempo limitado. Es posible que se le solicite que ingrese su información de facturación para registrarse en la prueba gratuita. Si ingresa su información de facturación al registrarse para una prueba gratuita, no se le cobrará por la Empresa hasta que la prueba gratuita haya expirado. En el último día del período de prueba gratuita, a menos que haya cancelado su Suscripción, se le cobrarán automáticamente las tarifas de Suscripción aplicables para el tipo de Suscripción que haya seleccionado. En cualquier momento y sin previo aviso, la Empresa se reserva el derecho de (i) modificar los términos y condiciones de la oferta de prueba gratuita, o (ii) cancelar dicha oferta de prueba gratuita.\u003c/p\u003e\n\n\u003ch2\u003e6. Contenido del Usuario\u003c/h2\u003e\n\u003cp\u003eNuestro Servicio le permite publicar, enlazar, almacenar, compartir y de otra manera poner a disposición cierto Contenido. Usted es el único responsable del Contenido del Usuario que publica en o a través del Servicio, incluyendo su legalidad, confiabilidad, idoneidad y la no violación de derechos de terceros.\u003c/p\u003e\n\u003cp\u003eAl publicar Contenido en el Servicio, Usted nos otorga un derecho y licencia mundial, no exclusivo, perpetuo, irrevocable, libre de regalías y sublicenciable para usar, modificar, ejecutar públicamente, mostrar públicamente, reproducir y distribuir dicho Contenido en y a través del Servicio. Usted conserva todos y cada uno de sus derechos sobre cualquier Contenido que envíe, publique o muestre en o a través del Servicio y es responsable de proteger esos derechos. Usted acepta que esta licencia incluye el derecho para Nosotros de poner su Contenido a disposición de otros usuarios del Servicio, quienes también pueden usar su Contenido sujeto a estos Términos.\u003c/p\u003e\n\u003cp\u003eUsted declara y garantiza que: (i) el Contenido es suyo (usted lo posee) o tiene el derecho de usarlo y otorgarnos los derechos y la licencia según lo dispuesto en estos Términos, y (ii) la publicación de su Contenido en o a través del Servicio no viola los derechos de privacidad, derechos de publicidad, derechos de autor, derechos contractuales o cualquier otro derecho de cualquier persona o entidad.\u003c/p\u003e\n\u003cp\u003eLa Empresa no tiene la obligación de monitorear o controlar el Contenido del Usuario. Sin embargo, nos reservamos el derecho, pero no la obligación, de revisar, editar, rechazar o eliminar cualquier Contenido del Usuario que, a nuestra entera discreción, viole estos Términos o sea de alguna manera perjudicial, objetable o inexacto. No somos responsables y no asumimos ninguna responsabilidad por el Contenido del Usuario que usted u otro usuario o tercero publique en o a través del Servicio.\u003c/p\u003e\n\n\u003ch2\u003e7. Propiedad Intelectual\u003c/h2\u003e\n\u003cp\u003eEl Servicio y su contenido original (excluyendo el Contenido proporcionado por Usted u otros usuarios), características y funcionalidades son y seguirán siendo propiedad exclusiva de TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS y sus licenciantes. El nombre \"TIMESAFE\", el logotipo de TIMESAFE, y todos los nombres de productos y servicios, diseños y lemas relacionados son marcas comerciales de la Empresa o sus afiliados o licenciantes.\u003c/p\u003e\n\u003cp\u003eEl Servicio está protegido por leyes de derechos de autor, marcas comerciales, patentes y otras leyes tanto del País (Brasil) como de países extranjeros. Nuestra Propiedad Intelectual, incluyendo nuestras marcas comerciales e imagen comercial, no puede ser utilizada en conexión con ningún producto o servicio sin el consentimiento previo y por escrito de la Empresa. Usted no puede copiar, modificar, distribuir, vender o arrendar ninguna parte de nuestro Servicio o software incluido, ni puede realizar ingeniería inversa o intentar extraer el código fuente de ese software, a menos que las leyes prohíban esas restricciones o tenga nuestro permiso por escrito.\u003c/p\u003e\n\n\u003ch2\u003e8. Enlaces a Otros Sitios Web\u003c/h2\u003e\n\u003cp\u003eNuestro Servicio puede contener enlaces a sitios web o servicios de terceros que no son propiedad ni están controlados por la Empresa. Estos enlaces se proporcionan únicamente para su conveniencia y no constituyen un respaldo por parte de la Empresa del contenido de dichos sitios web de terceros.\u003c/p\u003e\n\u003cp\u003eLa Empresa no tiene control sobre, y no asume ninguna responsabilidad por, el contenido, las políticas de privacidad o las prácticas de los sitios web o servicios de terceros. Usted reconoce y acepta además que la Empresa no será responsable, directa o indirectamente, de ningún daño o pérdida causada o presuntamente causada por o en conexión con el uso o la confianza en cualquier contenido, bienes o servicios disponibles en o a través de dichos sitios web o servicios.\u003c/p\u003e\n\u003cp\u003eLE RECOMENDAMOS ENCARECIDAMENTE QUE LEA LOS TÉRMINOS Y CONDICIONES Y LAS POLÍTICAS DE PRIVACIDAD DE CUALQUIER SITIO WEB O SERVICIO DE TERCEROS QUE VISITE.\u003c/p\u003e\n\n\u003ch2\u003e9. Rescisión\u003c/h2\u003e\n\u003cp\u003ePodemos rescindir o suspender su Cuenta y prohibir el acceso al Servicio de inmediato, sin previo aviso ni responsabilidad, a nuestra entera discreción, por cualquier motivo y sin limitación, incluyendo pero no limitado a una violación de estos Términos y Condiciones.\u003c/p\u003e\n\u003cp\u003eSi desea rescindir su Cuenta, puede simplemente dejar de usar el Servicio y/o cancelar su Suscripción como se describe en la sección \"Cancelación de la Suscripción\".\u003c/p\u003e\n\u003cp\u003eTras la rescisión, su derecho a utilizar el Servicio cesará inmediatamente. Si su cuenta es rescindida, nos reservamos el derecho de eliminar cualquier Contenido del Usuario asociado con su cuenta.\u003c/p\u003e\n\u003cp\u003eTodas las disposiciones de los Términos que por su naturaleza deban sobrevivir a la rescisión, sobrevivirán a la rescisión, incluyendo, sin limitación, las disposiciones de propiedad, las exenciones de garantía, la indemnización y las limitaciones de responsabilidad.\u003c/p\u003e\n\n\u003ch2\u003e10. Limitación de Responsabilidad\u003c/h2\u003e\n\u003cp\u003eNO OBSTANTE CUALQUIER DAÑO QUE USTED PUEDA INCURRIR, LA RESPONSABILIDAD TOTAL DE LA EMPRESA Y CUALQUIERA DE SUS PROVEEDORES BAJO CUALQUIER DISPOSICIÓN DE ESTOS TÉRMINOS Y SU RECURSO EXCLUSIVO PARA TODO LO ANTERIOR SE LIMITARÁ AL MONTO MAYOR ENTRE (A) EL MONTO TOTAL EFECTIVAMENTE PAGADO POR USTED A TRAVÉS DEL SERVICIO DURANTE LOS DOCE (12) MESES ANTERIORES AL EVENTO QUE DIO LUGAR A LA RECLAMACIÓN; O (B) 20,00 DÓLARES ESTADOUNIDENSES (O SU EQUIVALENTE EN MONEDA LOCAL).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHASTA EL MÁXIMO GRADO PERMITIDO POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES, DIRECTORES, EMPLEADOS, AGENTES O AFILIADOS SERÁN RESPONSABLES DE NINGÚN DAÑO ESPECIAL, INCIDENTAL, INDIRECTO O CONSECUENTE DE CUALQUIER TIPO (INCLUYENDO, PERO NO LIMITADO A, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS U OTRA INFORMACIÓN, POR INTERRUPCIÓN DEL NEGOCIO, POR LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD DERIVADA DE O DE CUALQUIER MANERA RELACIONADA CON EL USO O LA INCAPACIDAD DE USAR EL SERVICIO, SOFTWARE DE TERCEROS Y/O HARDWARE DE TERCEROS USADO CON EL SERVICIO, O DE OTRA MANERA EN CONEXIÓN CON CUALQUIER DISPOSICIÓN DE ESTOS TÉRMINOS), INCLUSO SI LA EMPRESA O CUALQUIER PROVEEDOR HA SIDO ADVERTIDO DE LA POSIBILIDAD DE TALES DAÑOS E INCLUSO SI EL RECURSO FALLA EN SU PROPÓSITO ESENCIAL.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAlgunas jurisdicciones no permiten la exclusión de garantías implícitas o la limitación de responsabilidad por daños incidentales o consecuentes, lo que D Y EL RIESGO POR SU USO DEL SERVICIO Y DE INTERNET.\u003c/strong\u003e LA EMPRESA NO SERÁ RESPONSABLE DE NINGÚN DAÑO RESULTANTE DEL USO O LA INCAPACIDAD DE USAR EL SERVICIO, INCLUIDOS LOS DAÑOS CAUSADOS POR MALWARE, VIRUS O CUALQUIER INCORRECCIÓN O INCOMPLETITUD EN EL SOFTWARE O LA INFORMACIÓN.\u003c/p\u003e\n\n\u003ch2\u003e12. Ley Aplicable y Jurisdicción\u003c/h2\u003e\n\u003cp\u003eLas leyes de la República Federativa de Brasil, excluyendo sus normas sobre conflictos de leyes, regirán estos Términos y su uso del Servicio. Su uso de la Aplicación también puede estar sujeto a otras leyes locales, estatales, nacionales o internacionales.\u003c/p\u003e\n\u003cp\u003ePara cualquier disputa que surja de o esté relacionada con estos Términos, el Servicio, o su relación con la Empresa, Usted e la Empresa acuerdan someterse a la jurisdicción personal y exclusiva de los tribunales ubicados en la comarca de São Paulo, Estado de São Paulo, Brasil. Por la presente, Usted renuncia irrevocablemente a cualquier objeción, incluyendo cualquier objeción a la conveniencia del foro, a la jurisdicción de dichos tribunales.\u003c/p\u003e\n\n\u003ch2\u003e13. Resolución de Disputas\u003c/h2\u003e\n\u003cp\u003eSi Usted tiene alguna preocupación o disputa sobre el Servicio, Usted se compromete a intentar primero resolver la disputa de manera informal poniéndose en contacto con la Empresa a través del formulario de contacto oficial disponible en nuestro Sitio Web. La Empresa se esforzará por responder y abordar su preocupación en un plazo de 30 días.\u003c/p\u003e\n\u003cp\u003eSi la disputa no se puede resolver de manera informal, Usted acepta la jurisdicción exclusiva de los tribunales de São Paulo, Brasil, como se establece en la sección \"Ley Aplicable y Jurisdicción\".\u003c/p\u003e\n\n\u003ch2\u003e14. Disposiciones Generales\u003c/h2\u003e\n\n\u003ch3\u003eCumplimiento Legal y Conformidad con la LGPD\u003c/h3\u003e\n\u003cp\u003eEste documento y nuestras prácticas están diseñados para cumplir con la Ley General de Protección de Datos de Brasil (LGPD - Lei Nº 13.709/2018) y sus regulaciones y actualizaciones asociadas.\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eDerechos de los Titulares de Datos:\u003c/strong\u003e De acuerdo con la LGPD, Usted, como titular de los datos, tiene derecho a:\n        \u003cul\u003e\n            \u003cli\u003eConfirmar la existencia del tratamiento de sus datos.\u003c/li\u003e\n            \u003cli\u003eAcceder a sus datos.\u003c/li\u003e\n            \u003cli\u003eCorregir datos incompletos, inexactos o desactualizados.\u003c/li\u003e\n            \u003cli\u003eSolicitar la anonimización, bloqueo o eliminación de datos innecesarios, excesivos o tratados en incumplimiento de la LGPD.\u003c/li\u003e\n            \u003cli\u003eSolicitar la portabilidad de sus datos a otro proveedor de servicios o productos.\u003c/li\u003e\n            \u003cli\u003eEliminar los datos personales tratados con su consentimiento.\u003c/li\u003e\n            \u003cli\u003eObtener información sobre las entidades públicas y privadas con las que la Empresa ha compartido sus datos.\u003c/li\u003e\n            \u003cli\u003eObtener información sobre la posibilidad de no dar su consentimiento y las consecuencias de la negativa.\u003c/li\u003e\n            \u003cli\u003eRevocar su consentimiento en cualquier momento.\u003c/li\u003e\n        \u003c/ul\u003e\n        Para ejercer cualquiera de estos derechos, por favor contáctenos a través de nuestro canal oficial de contacto.\n    \u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotificación de Incidentes de Seguridad:\u003c/strong\u003e En caso de un incidente de seguridad que pueda acarrear un riesgo o daño relevante para los titulares de los datos, la Empresa notificará a la Autoridad Nacional de Protección de Datos (ANPD) y a los titulares de datos afectados en un plazo de \u003cstrong\u003etres (3) días hábiles\u003c/strong\u003e a partir del conocimiento del incidente, de acuerdo con las regulaciones de la ANPD.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eTransferencias Internacionales de Datos:\u003c/strong\u003e Si transferimos datos personales fuera de Brasil, lo haremos en estricto cumplimiento de la LGPD. Esto incluye el uso de mecanismos apropiados como las Cláusulas Contractuales Tipo (Standard Contractual Clauses) aprobadas por la ANPD (conforme a la Resolución CD/ANPD N° 19/2024), u otras salvaguardas legales que garanticen un nivel adecuado de protección de datos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDelegado de Protección de Datos (DPO):\u003c/strong\u003e La Empresa ha designado un Delegado de Protección de Datos (DPO) para supervisar el cumplimiento de la LGPD. La información de contacto del DPO está disponible públicamente y puede ser solicitada a través de nuestro formulario de contacto en el Sitio Web.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSanciones:\u003c/strong\u003e El incumplimiento de la LGPD puede resultar en sanciones significativas, incluyendo multas de hasta el 2% de los ingresos anuales de la empresa en Brasil, limitadas a BRL 50 millones por infracción.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eIndemnización\u003c/h3\u003e\n\u003cp\u003eUsted acepta indemnizar, defender y mantener indemne a la Empresa y a sus afiliados, directores, funcionarios, empleados, agentes, licenciantes y proveedores de y contra todas y cada una de las reclamaciones, responsabilidades, daños, pérdidas, costos, juicios y gastos (incluidos los honorarios razonables de abogados) que surjan de o estén relacionados de alguna manera con: (a) su uso o mal uso del Servicio; (b) cualquier Contenido del Usuario que usted publique, envíe o transmita a través del Servicio; (c) su violación de estos Términos; (d) su violación de cualquier ley, regla o regulación aplicable; o (e) su violación de los derechos de cualquier tercero.\u003c/p\u003e\n\n\u003ch3\u003eDivisibilidad\u003c/h3\u003e\n \u003ch3\u003eClass Action Waiver\u003c/h3\u003e\n    \u003cp\u003eYOU AND THE COMPANY AGREE THAT EACH MAY BRING CLAIMS AGAINST THE OTHER ONLY IN YOUR OR ITS INDIVIDUAL CAPACITY, AND NOT AS A PLAINTIFF OR CLASS MEMBER IN ANY PURPORTED CLASS OR REPRESENTATIVE PROCEEDING. All claims and disputes within the scope of this agreement must be arbitrated or litigated on an individual basis and not on a class basis.\u003c/p\u003e\n\n    \u003ch2\u003e14. General Provisions\u003c/h2\u003e\n    \u003ch3\u003eCompliance with Laws and Data Protection (LGPD)\u003c/h3\u003e\n    \u003cp\u003eYou agree to use the Service in compliance with all applicable laws, including Brazil's General Data Protection Law (Lei Geral de Proteção de Dados Pessoais, \"LGPD\"), Law No. 13.709/2018. The Company is committed to protecting personal data and complying with the LGPD and its subsequent regulations.\u003c/p\u003e\n    \n    \u003ch3\u003eLGPD Compliance and Data Processing\u003c/h3\u003e\n    \u003cp\u003eThe Company acts as a \"Controller\" for the personal data it collects from You to provide the Service. Our Privacy Policy provides comprehensive details on our data processing activities.\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eData Subject Rights:\u003c/strong\u003e In accordance with the LGPD, You have the right to: (i) confirm the existence of the processing; (ii) access your data; (iii) correct incomplete, inaccurate, or out-of-date data; (iv) anonymize, block, or delete unnecessary or excessive data or data processed in noncompliance with the LGPD; (v) obtain the portability of your data to another service or product provider; (vi) delete personal data processed with your consent; (vii) obtain information about public and private entities with which the controller has shared data; (viii) obtain information about the possibility of not giving consent and about the consequences of the refusal; and (ix) revoke your consent at any time. You may exercise these rights by contacting us.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInternational Data Transfer:\u003c/strong\u003e Should the Company need to transfer Your personal data internationally, such transfers will be made to countries or international organizations that provide an adequate level of protection of personal data as determined by the Brazilian National Data Protection Authority (ANPD). For transfers to countries not deemed adequate, We will use specific contractual clauses, such as the Standard Contractual Clauses approved by the ANPD under Resolution CD/ANPD No. 19/2024, or other legally-valid transfer mechanisms to ensure the protection of Your data.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eData Breach Notification:\u003c/strong\u003e In the event of a security incident that may create a relevant risk or damage to You or other data subjects, the Company will notify the ANPD and the affected data subjects within a reasonable timeframe, aiming to comply with the three (3) business day guideline from the date of knowledge of the incident, as recommended by best practices and regulatory guidance. The notification will include, at a minimum, a description of the nature of the personal data affected, information on the data subjects involved, the technical and security measures used, the risks related to the incident, and the measures that were or will be adopted to reverse or mitigate the effects of the damage.\u003c/li\u003e\n        - \u003cstrong\u003ePenalties:\u003c/strong\u003e You acknowledge that violations of the LGPD can result in significant administrative sanctions applied by the ANPD, including warnings, fines of up to 2% of the company's revenue in Brazil (limited to BRL 50 million per violation), and other measures.\n        \u003cli\u003e\u003cstrong\u003eData Protection Officer (DPO):\u003c/strong\u003e The Company has appointed a Data Protection Officer who is responsible for overseeing questions in relation to data protection. You can contact our DPO for any questions or to exercise your rights via the contact form on Our website.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003eIndemnification\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eYou agree to indemnify, defend, and hold harmless the Company and its affiliates, directors, officers, employees, agents, contractors, licensors, and suppliers from and against any and all claims, liabilities, damages, judgments, awards, losses, costs, expenses, or fees (including reasonable attorneys' fees) arising out of or relating to: (a) Your use of, or inability to use, the Service; (b) any User Content You submit, post, or transmit; (c) Your violation of any provision of these Terms; (d) Your violation of any applicable law, rule, or regulation; or (e) Your violation of any right of a third party, including without limitation any intellectual property right, publicity, confidentiality, property, or privacy right.\u003c/strong\u003e We reserve the right, at our own expense, to assume the exclusive defense and control of any matter otherwise subject to indemnification by You, in which event You will fully cooperate with us in asserting any available defenses.\u003c/p\u003e\n\n    \u003ch3\u003eSeverability and Waiver\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eSeverability:\u003c/strong\u003e If any provision of these Terms is held to be unenforceable or invalid, such provision will be changed and interpreted to accomplish the objectives of such provision to the greatest extent possible under applicable law and the remaining provisions will continue in full force and effect.\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eWaiver:\u003c/strong\u003e Except as provided herein, the failure to exercise a right or to require performance of an obligation under these Terms shall not affect a party's ability to exercise such right or require such performance at any time thereafter nor shall the waiver of a breach constitute a waiver of any subsequent breach. No waiver by the Company of any term or condition set out in these Terms shall be deemed a further or continuing waiver of such term or condition or a waiver of any other term or condition.\u003c/p\u003e\n    \n    \u003ch3\u003eChanges to These Terms and Conditions\u003c/h3\u003e\n    \u003cp\u003eWe reserve the right, at Our sole discretion, to modify or replace these Terms at any time. If a revision is material, We will make reasonable efforts to provide at least 30 days' notice prior to any new terms taking effect. What constitutes a material change will be determined at Our sole discretion. By continuing to access or use Our Service after those revisions become effective, You agree to be bound by the revised terms. If You do not agree to the new terms, in whole or in part, please stop using the website and the Service.\u003c/p\u003e\n    \n    \u003ch3\u003eEntire Agreement\u003c/h3\u003e\n    \u003cp\u003eThe Terms and our Privacy Policy constitute the sole and entire agreement between You and the Company regarding the Service and supersede all prior and contemporaneous understandings, agreements, representations, and warranties, both written and oral, regarding the Service.\u003c/p\u003e\n\n    \u003ch2\u003e15. Contact Us\u003c/h2\u003e\n    \u003cp\u003eIf you have any questions about these Terms and Conditions, you can contact us:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eBy visiting this page on our website: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\u003c/body\u003e\n\u003c/html\u003e","label":"Terms and Conditions","languageLabel":"English"},{"documentType":"terms_of_service","language":"PT","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"pt-BR\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003ctitle\u003eTermos de Serviço - TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003ch1\u003eTermos de Serviço do TIMESAFE\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003eÚltima atualização:\u003c/strong\u003e 1 de outubro de 2026\u003c/p\u003e\n\n\u003cp\u003e\n    \u003cstrong\u003eLEIA ESTES TERMOS DE SERVIÇO (\"TERMOS\") CUIDADOSA E INTEGRALMENTE ANTES DE UTILIZAR O SOFTWARE E OS SERVIÇOS TIMESAFE. ESTE DOCUMENTO CONSTITUI UM CONTRATO LEGALMENTE VINCULANTE ENTRE VOCÊ E A EMPRESA.\u003c/strong\u003e\n\u003c/p\u003e\n\n\u003cp\u003e\n    \u003cstrong\u003eAO ACESSAR, BAIXAR, INSTALAR, CRIAR UMA CONTA OU DE QUALQUER OUTRA FORMA UTILIZAR O SERVIÇO {softwareName} (\"SERVIÇO\"), VOCÊ (\"USUÁRIO\" OU \"VOCÊ\") CONFIRMA QUE LEU, COMPREENDEU E CONCORDA EM FICAR VINCULADO A TODOS OS TERMOS E CONDIÇÕES AQUI ESTABELECIDOS, BEM COMO À NOSSA POLÍTICA DE PRIVACIDADE, QUE É INCORPORADA A ESTES TERMOS POR REFERÊNCIA. SE VOCÊ NÃO CONCORDAR COM A TOTALIDADE DESTES TERMOS, VOCÊ NÃO TEM PERMISSÃO PARA ACESSAR OU UTILIZAR O SERVIÇO E DEVE CESSAR IMEDIATAMENTE TODO E QUALQUER USO.\u003c/strong\u003e\n\u003c/p\u003e\n\n\u003cp\u003e\n    Estes Termos regem seu acesso e uso do software, aplicativos móveis, website e serviços correlatos fornecidos pela \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e.\n\u003c/p\u003e\n\n\u003ch2\u003e1. Interpretação e Definições\u003c/h2\u003e\n\n\u003ch3\u003e1.1. Interpretação\u003c/h3\u003e\n\u003cp\u003eAs palavras cuja letra inicial é maiúscula têm seus significados definidos nas condições a seguir. As seguintes definições terão o mesmo significado, independentemente de aparecerem no singular ou no plural. A utilização de títulos de seção neste documento serve apenas para conveniência e não limitará ou afetará de outra forma estes Termos.\u003c/p\u003e\n\n\u003ch3\u003e1.2. Definições\u003c/h3\u003e\n\u003cp\u003ePara os propósitos destes Termos de Serviço:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eAfiliada\u003c/
