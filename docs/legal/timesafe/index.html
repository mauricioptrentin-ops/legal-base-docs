imesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003e\u003cstrong\u003eEmpresa:\u003c/strong\u003e TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eCNPJ:\u003c/strong\u003e 41.648.990/0001-56\u003c/p\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Termos e Condições","languageLabel":"Português"},{"documentType":"return_refund","language":"EN","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eReturn and Refund Policy for TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n    \u003ch1\u003eReturn and Refund Policy\u003c/h1\u003e\n    \u003cp\u003e\u003cstrong\u003eLast updated:\u003c/strong\u003e October 1, 2026\u003c/p\u003e\n\n    \u003cp\u003eThank you for choosing TIMESAFE. This Return and Refund Policy (\"Policy\") governs the purchase and use of subscriptions for the TIMESAFE software and related services (collectively, the \"Service\").\u003c/p\u003e\n\n    \u003cp\u003eThis document is a legally binding agreement between you, the end-user (\"You\", \"Your\", or \"User\"), and TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS (\"Company\", \"We\", \"Us\", or \"Our\"). By placing an order for, subscribing to, or using the Service, You acknowledge that You have read, understood, and unequivocally agree to be bound by the terms and conditions set forth in this Policy. If You do not agree with any part of this Policy, You must not purchase, download, install, or use the Service.\u003c/p\u003e\n\n    \u003cp\u003e\u003cstrong\u003eYOUR ATTENTION IS PARTICULARLY DRAWN TO THE PROVISIONS OF THIS POLICY THAT EXCLUDE OR LIMIT OUR LIABILITY AND THAT REQUIRE YOU TO INDEMNIFY US. THESE ARE CONTAINED IN THE \"LEGAL PROVISIONS\" SECTION BELOW.\u003c/strong\u003e\u003c/p\u003e\n\n    \u003ch2\u003e1. Interpretation and Definitions\u003c/h2\u003e\n\n    \u003ch3\u003eInterpretation\u003c/h3\u003e\n    \u003cp\u003eThe words of which the initial letter is capitalized have meanings defined under the following conditions. The following definitions shall have the same meaning regardless of whether they appear in singular or in plural.\u003c/p\u003e\n\n    \u003ch3\u003eDefinitions\u003c/h3\u003e\n    \u003cp\u003eFor the purposes of this Return and Refund Policy:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\n            \u003cp\u003e\u003cstrong\u003e\"Company\"\u003c/strong\u003e (referred to as either \"the Company\", \"We\", \"Us\" or \"Our\" in this Agreement) refers to \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, a limited liability company duly incorporated and existing under the laws of the Federative Republic of Brazil, with its principal place of business at ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL, registered with the CNPJ under No. 41.648.990/0001-56 and NIRE No. 35237097027.\u003c/p\u003e\n        \u003c/li\u003e\n        \u003cli\u003e\n            \u003cp\u003e\u003cstrong\u003e\"Service\"\u003c/strong\u003e refers to the TIMESAFE software application, its associated features, functionalities, websites, and any other related digital products or services provided by the Company.\u003c/p\u003e\n        \u003c/li\u003e\n        \u003cli\u003e\n            \u003cp\u003e\u003cstrong\u003e\"Goods\"\u003c/strong\u003e refers to the digital items offered for sale through the Service, primarily consisting of software licenses and subscriptions that grant You access to the Service or specific features thereof.\u003c/p\u003e\n        \u003c/li\u003e\n        \u003cli\u003e\n            \u003cp\u003e\u003cstrong\u003e\"Subscription\"\u003c/strong\u003e refers to the access to the Service purchased by You on a recurring basis (e.g., monthly or annually) as detailed in the subscription plan you select.\u003c/p\u003e\n        \u003c/li\u003e\n        \u003cli\u003e\n            \u003cp\u003e\u003cstrong\u003e\"Order\"\u003c/strong\u003e means a request by You to purchase Goods from Us, typically in the form of a Subscription.\u003c/p\u003e\n        \u003c/li\u003e\n        \u003cli\u003e\n            \u003cp\u003e\u003cstrong\u003e\"You\"\u003c/strong\u003e means the individual accessing or using the Service, or the company, or other legal entity on behalf of which such individual is accessing or using the Service, as applicable.\u003c/p\u003e\n        \u003c/li\u003e\n        \u003cli\u003e\n            \u003cp\u003e\u003cstrong\u003e\"Terms\"\u003c/strong\u003e refers to the terms and conditions laid out in this Return and Refund Policy, which forms an integral part of Your agreement with the Company, alongside our Terms of Service and Privacy Policy.\u003c/p\u003e\n        \u003c/li\u003e\n        \u003cli\u003e\n            \u003cp\u003e\u003cstrong\u003e\"Free Trial\"\u003c/strong\u003e means a limited period during which You may use the Service without payment, as may be offered by the Company at its sole discretion.\u003c/p\u003e\n        \u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e2. Your Eligibility for Refund\u003c/h2\u003e\n    \u003cp\u003eOur policy is designed to be clear and compliant with applicable laws, including the Brazilian Consumer Defense Code (Lei nº 8.078/90), while protecting the nature of our digital Goods. Due to the intangible and irrevocable nature of digital software and services, our refund policy is necessarily restrictive.\u003c/p\u003e\n\n    \u003ch3\u003eGeneral Refund Policy\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eEXCEPT AS EXPRESSLY PROVIDED HEREIN OR AS REQUIRED BY MANDATORY APPLICABLE LAW, ALL FEES AND CHARGES FOR THE SERVICE ARE NON-REFUNDABLE.\u003c/strong\u003e The Company may, at its sole and absolute discretion, consider refund requests on a case-by-case basis. The issuance of a refund in one instance does not create an obligation to issue the same or similar refund in the future.\u003c/p\u003e\n\n    \u003ch3\u003eStatutory Right of Regret (Direito de Arrependimento)\u003c/h3\u003e\n    \u003cp\u003eIn accordance with Article 49 of the Brazilian Consumer Defense Code, for purchases made online, You have a \"right of regret\" period of seven (7) calendar days, counted from the date of purchase or the start of the service provision, whichever is later, to cancel your purchase and request a full refund.\u003c/p\u003e\n    \u003cp\u003eHowever, please be aware of the following critical conditions for digital Goods:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eThis right is applicable \u003cstrong\u003eONLY IF YOU HAVE NOT ACCESSED, ACTIVATED, DOWNLOADED, OR OTHERWISE MADE ANY USE OF THE SERVICE.\u003c/strong\u003e\u003c/li\u003e\n        \u003cli\u003eThe act of logging into Your account, activating a license key, downloading the software, or utilizing any feature of the Service during this 7-day period shall be considered as Your acceptance and use of the Service.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eUPON YOUR FIRST USE OF THE SERVICE, YOU EXPRESSLY ACKNOWLEDGE AND AGREE THAT YOU FORFEIT YOUR STATUTORY RIGHT OF REGRET, AS THE SERVICE IS DEEMED TO HAVE BEEN FULLY RENDERED AND CONSUMED.\u003c/strong\u003e The nature of digital goods makes them impossible to \"return\" in an unused condition once accessed.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003eEligibility for Discretionary Refunds\u003c/h3\u003e\n    \u003cp\u003eA refund may be considered, at our sole discretion, under the following limited circumstances:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eService Non-Functionality:\u003c/strong\u003e If the Service is proven to be fundamentally non-functional or fails to perform its core advertised functions on Your system, and our technical support team is unable to resolve the issue within a reasonable timeframe (typically 30 days) after You have provided all necessary information and cooperation for troubleshooting. This does not cover incompatibilities with third-party software or non-standard hardware configurations.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eBilling Errors:\u003c/strong\u003e Verifiable instances of incorrect charges or double-billing due to a technical fault in Our payment processing system.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e3. Deadlines for Request\u003c/h2\u003e\n    \u003ch3\u003e7-Day Statutory Cancellation Period\u003c/h3\u003e\n    \u003cp\u003eAny request for a refund under the statutory right of regret must be submitted to Us via our official contact channels within \u003cstrong\u003eseven (7) calendar days\u003c/strong\u003e of the initial purchase date of a new Subscription. Requests received after this period will not be eligible under this provision.\u003c/p\u003e\n    \n    \u003ch3\u003eDiscretionary Refund Requests\u003c/h3\u003e\n    \u003cp\u003eFor issues related to Service non-functionality, You must contact our support team as soon as the issue is discovered. Refund requests based on technical issues will only be considered if You have actively engaged with our support team to attempt resolution and the request is made within a reasonable period, not to exceed thirty (30) days from the initial purchase date.\u003c/p\u003e\n\n    \u003ch3\u003eSubscription Renewals\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eAUTOMATIC RENEWAL FEES ARE STRICTLY NON-REFUNDABLE.\u003c/strong\u003e Your Subscription will automatically renew at the end of each billing cycle unless You cancel it prior to the renewal date. It is Your sole responsibility to manage Your Subscription and cancel it if You no longer wish to use the Service. We will send a courtesy reminder email before a renewal charge, but failure to receive this email does not constitute grounds for a refund. By agreeing to a Subscription, you authorize us to automatically charge the applicable fees to your stored payment method at the start of each renewal period.\u003c/p\u003e\n\n    \u003ch2\u003e4. Refund Process\u003c/h2\u003e\n    \u003cp\u003eTo initiate a refund request, You must adhere to the following process:\u003c/p\u003e\n    \u003col\u003e\n        \u003cli\u003e\u003cstrong\u003eSubmit a Formal Request:\u003c/strong\u003e You must contact us by visiting our official contact page at \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e. Your request must include:\n            \u003cul\u003e\n                \u003cli\u003eYour full name and the email address associated with your TIMESAFE account.\u003c/li\u003e\n                \u003cli\u003eThe order number or transaction ID of the purchase.\u003c/li\u003e\n                \u003cli\u003eThe date of the purchase.\u003c/li\u003e\n                \u003cli\u003eA clear and detailed reason for the refund request, including any error messages or evidence of technical failure if applicable.\u003c/li\u003e\n            \u003c/ul\u003e\n        \u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCooperation with Support (if applicable):\u003c/strong\u003e If your request is based on a technical issue, You must fully cooperate with our support team. This includes providing diagnostic information, log files, screenshots, and any other data requested to help us identify and resolve the problem. Failure to cooperate will result in the immediate denial of your refund request.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCompany Review:\u003c/strong\u003e We will review your request and investigate its validity based on the terms of this Policy. This may involve checking your account activity, usage logs, and communication history with our support team. We reserve the right to reject any refund request that does not meet the eligibility criteria outlined herein.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eNotification of Decision:\u003c/strong\u003e We will notify You of the approval or rejection of your refund via email, typically within 10-15 business days. Our decision is final and binding.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eProcessing of Approved Refunds:\u003c/strong\u003e If your refund is approved, it will be processed, and a credit will automatically be applied to your original method of payment. Please allow up to 14 business days for the credit to appear on your statement, as processing times can vary depending on the payment gateway and your financial institution.\u003c/li\u003e\n    \u003c/ol\u003e\n    \u003cp\u003eUpon issuance of a refund, your license to use the Service will be immediately terminated, and Your access to the Service will be revoked. You must uninstall and delete all copies of the software from your devices.\u003c/p\u003e\n\n    \u003ch2\u003e5. Non-Refundable Items and Scenarios\u003c/h2\u003e\n    \u003cp\u003eTO THE FULLEST EXTENT PERMITTED BY LAW, THE FOLLOWING ITEMS, COSTS, AND SCENARIOS ARE EXPLICITLY NON-REFUNDABLE UNDER ANY CIRCUMSTANCES:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eSubscription Renewals:\u003c/strong\u003e Any and all fees charged for the automatic renewal of a monthly or annual Subscription.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eUsed Services:\u003c/strong\u003e Any Subscription where the Service has been accessed, activated, or used, even once, after the initial 7-day statutory period has elapsed (or within the 7-day period, as this forfeits the right of regret).\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eChange of Mind:\u003c/strong\u003e Refunds will not be granted for reasons such as \"I changed my mind,\" \"I don't need the software anymore,\" or \"I found an alternative.\"\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eFailure to Cancel:\u003c/strong\u003e Fees incurred because You forgot or failed to cancel your Subscription before the renewal date.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePrice Changes:\u003c/strong\u003e The Company reserves the right to modify Subscription prices at any time. Any price change will become effective at the end of the then-current subscription period. Your continued use of the Service after the price change constitutes your agreement to pay the modified amount. Price protection or refunds for past purchases in the event of a future price reduction or promotional offering are not available.\u003c/li\u003e\n        - \u003cli\u003e\u003cstrong\u003eFree Trials:\u003c/strong\u003e The Company may, at its sole discretion, offer a Subscription with a Free Trial. You will not be charged until the Free Trial period ends. At the end of the Free Trial period, you will be automatically charged the applicable Subscription fees unless you cancel your Subscription before the trial ends. Charges incurred after a Free Trial are non-refundable.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eThird-Party Purchases:\u003c/strong\u003e Subscriptions purchased through third-party vendors, resellers, or app stores (such as the Apple App Store or Google Play Store) are subject to the return and refund policies of those vendors. We cannot process refunds for such purchases.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eIncompatibility Issues:\u003c/strong\u003e Issues arising from incompatibility with your specific hardware configuration, other third-party software, or operating systems that are not explicitly listed as supported in our official system requirements.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eMinor Bugs or Glitches:\u003c/strong\u003e The existence of minor, non-critical bugs that do not prevent the core functionality of the Service. We are committed to resolving bugs, but their presence does not constitute grounds for a refund.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eLack of a Specific Feature:\u003c/strong\u003e Refunds will not be granted if the Service does not contain a specific feature You desire, unless that feature was explicitly advertised as being part of your purchased plan at the time of purchase.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eChargebacks:\u003c/strong\u003e Initiating a chargeback or dispute with your payment provider without first following the refund process outlined in this Policy will be considered a breach of these terms. We reserve the right to dispute any chargeback, report fraudulent activity, and permanently terminate your account and access to the Service.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e6. Partial Refunds\u003c/h2\u003e\n    \u003cp\u003eThe Company does not offer partial refunds, pro-rated refunds for unused time, or refunds for subscription downgrades. If You choose to downgrade your Subscription plan, the new, lower rate will take effect at the beginning of your next billing cycle. No credit or refund will be issued for the difference in price for the current billing period.\u003c/p\u003e\n    \u003cp\u003eIn extremely rare and exceptional circumstances, the Company may, at its sole and absolute discretion, grant a partial refund as a gesture of goodwill. Such an action does not establish a precedent and does not obligate the Company to offer partial refunds in any other situation.\u003c/p\u003e\n\n    \u003ch2\u003e7. Exchanges\u003c/h2\u003e\n    \u003cp\u003eAs the Goods we provide are digital services and subscriptions, the concept of a traditional \"exchange\" is not applicable. We do not replace or exchange one subscription plan for another mid-cycle. If You wish to change your plan, You may do so through your account settings. Upgrades may be processed immediately with a pro-rated charge, while downgrades will take effect at the start of the next billing period.\u003c/p\u003e\n\n    \u003ch2\u003e8. Legal Provisions, Disclaimers, and Limitation of Liability\u003c/h2\u003e\n    \u003cp\u003eThis section outlines critical legal protections for the Company and limitations on Your rights and remedies. By purchasing or using the Service, You explicitly agree to these terms.\u003c/p\u003e\n\n    \u003ch3\u003eDisclaimer of Warranties\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eTHE SERVICE IS PROVIDED TO YOU \"AS IS\" AND \"AS AVAILABLE\" AND WITH ALL FAULTS AND DEFECTS WITHOUT WARRANTY OF ANY KIND. TO THE MAXIMUM EXTENT PERMITTED UNDER APPLICABLE LAW, THE COMPANY, ON ITS OWN BEHALF AND ON BEHALF OF ITS AFFILIATES AND ITS AND THEIR RESPECTIVE LICENSORS AND SERVICE PROVIDERS, EXPRESSLY DISCLAIMS ALL WARRANTIES, WHETHER EXPRESS, IMPLIED, STATUTORY OR OTHERWISE, WITH RESPECT TO THE SERVICE, INCLUDING ALL IMPLIED WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE, TITLE AND NON-INFRINGEMENT, AND WARRANTIES THAT MAY ARISE OUT OF COURSE OF DEALING, COURSE OF PERFORMANCE, USAGE OR TRADE PRACTICE.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eWITHOUT LIMITATION TO THE FOREGOING, THE COMPANY PROVIDES NO WARRANTY OR UNDERTAKING, AND MAKES NO REPRESENTATION OF ANY KIND THAT THE SERVICE WILL MEET YOUR REQUIREMENTS, ACHIEVE ANY INTENDED RESULTS, BE COMPATIBLE OR WORK WITH ANY OTHER SOFTWARE, APPLICATIONS, SYSTEMS OR SERVICES, OPERATE WITHOUT INTERRUPTION, MEET ANY PERFORMANCE OR RELIABILITY STANDARDS OR BE ERROR-FREE OR THAT ANY ERRORS OR DEFECTS CAN OR WILL BE CORRECTED. THE ENTIRE RISK AS TO THE QUALITY AND PERFORMANCE OF THE SERVICE IS WITH YOU.\u003c/strong\u003e\u003c/p\u003e\n\n    \u003ch3\u003eLimitation of Liability\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eTO THE MAXIMUM EXTENT PERMITTED BY APPLICABLE LAW, IN NO EVENT SHALL THE COMPANY OR ITS DIRECTORS, EMPLOYEES, PARTNERS, AGENTS, SUPPLIERS, OR AFFILIATES BE LIABLE FOR ANY SPECIAL, INCIDENTAL, INDIRECT, PUNITIVE, OR CONSEQUENTIAL DAMAGES WHATSOEVER (INCLUDING, BUT NOT LIMITED TO, DAMAGES FOR LOSS OF PROFITS, LOSS OF DATA OR OTHER INFORMATION, FOR BUSINESS INTERRUPTION, FOR PERSONAL INJURY, LOSS OF PRIVACY ARISING OUT OF OR IN ANY WAY RELATED TO THE USE OF OR INABILITY TO USE THE SERVICE, THIRD-PARTY SOFTWARE AND/OR THIRD-PARTY HARDWARE USED WITH THE SERVICE, OR OTHERWISE IN CONNECTION WITH ANY PROVISION OF THIS POLICY OR THE TERMS OF SERVICE), EVEN IF THE COMPANY HAS BEEN ADVISED OF THE POSSIBILITY OF SUCH DAMAGES.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eNOTWITHSTANDING ANY DAMAGES THAT YOU MIGHT INCUR, THE ENTIRE LIABILITY OF THE COMPANY AND ANY OF ITS SUPPLIERS UNDER ANY PROVISION OF THIS POLICY AND YOUR EXCLUSIVE REMEDY FOR ALL OF THE FOREGOING SHALL BE LIMITED TO THE GREATER OF: (A) THE TOTAL AMOUNT ACTUALLY PAID BY YOU FOR THE SERVICE DURING THE TWELVE (12) MONTH PERIOD PRECEDING THE EVENT GIVING RISE TO THE CLAIM; OR (B) TWENTY U.S. DOLLARS ($20.00 USD).\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eSOME JURISDICTIONS DO NOT ALLOW THE EXCLUSION OF IMPLIED WARRANTIES OR LIMITATION OF LIABILITY FOR INCIDENTAL OR CONSEQUENTIAL DAMAGES, WHICH MEANS THAT SOME OF THE ABOVE LIMITATIONS MAY NOT APPLY. IN THESE JURISDICTIONS, EACH PARTY'S LIABILITY WILL BE LIMITED TO THE GREATEST EXTENT PERMITTED BY LAW.\u003c/p\u003e\n\n    \u003ch3\u003eIndemnification\u003c/h3\u003e\n    \u003cp\u003eYou agree to indemnify, defend and hold harmless the Company, its affiliates, directors, employees, agents, licensors and suppliers from and against any and all claims, liabilities, damages, losses, judgments, costs and expenses (including reasonable attorneys' fees and costs) arising out of or in any way related to: (a) Your use or misuse of the Service; (b) any breach of this Policy or the Terms of Service by You; (c) any content or data You process, store, or transmit through the Service; (d) Your violation of any applicable law, rule or regulation; or (e) Your violation of the rights of any third party.\u003c/p\u003e\n    \n    \u003ch3\u003eAssumption of Risk\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eYOU EXPRESSLY ACKNOWLEDGE AND AGREE THAT YOU ASSUME FULL RESPONSIBILITY AND RISK FOR YOUR USE OF THE SERVICE. THE SERVICE IS PROVIDED \"AS IS\" AND YOUR USE OF IT IS AT YOUR OWN DISCRETION AND RISK. THE COMPANY SHALL NOT BE LIABLE FOR ANY DAMAGES OF ANY KIND RESULTING FROM THE USE OR INABILITY TO USE THE SERVICE, INCLUDING BUT NOT LIMITED TO DAMAGES CAUSED BY MALWARE, VIRUSES, OR ANY INCORRECTNESS OR INCOMPLETENESS OF THE SOFTWARE OR INFORMATION.\u003c/strong\u003e\u003c/p\u003e\n\n    \u003ch3\u003eGoverning Law and Jurisdiction\u003c/h3\u003e\n    \u003cp\u003eThis Policy and any dispute or claim arising out of or in connection with it or its subject matter or formation (including non-contractual disputes or claims) shall be governed by and construed in accordance with the laws of the Federative Republic of Brazil, without regard to its conflict of law provisions.\u003c/p\u003e\n    \u003cp\u003eYou irrevocably agree that the courts of the city of São Paulo, State of São Paulo, Brazil, shall have exclusive jurisdiction to settle any dispute or claim that arises out of or in connection with this Policy. You and the Company irrevocably waive any objection to the jurisdiction of such courts, including any objection based on the grounds of forum non conveniens.\u003c/p\u003e\n\n    \u003ch3\u003eData Protection and LGPD Compliance\u003c/h3\u003e\n    \u003cp\u003eIn processing Your refund request, the Company will collect and process personal data such as your name, email address, transaction details, and communications. This processing is necessary for the performance of our contract with You and for compliance with our legal and financial obligations. Our data processing activities are conducted in compliance with the Brazilian General Data Protection Law (Lei Geral de Proteção de Dados Pessoais - LGPD, Law No. 13.709/2018) and its subsequent regulations.\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eData Subject Rights:\u003c/strong\u003e You have rights under the LGPD, including the right to access, correct, and request the deletion of your personal data. Please note that we may be required to retain certain transaction and communication data for a specific period to comply with legal, tax, and auditing requirements, even after a deletion request.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInternational Data Transfers:\u003c/strong\u003e To provide the Service and process payments and refunds, Your data may be transferred to and processed in countries other than Brazil. We ensure that such international data transfers are conducted in compliance with LGPD requirements, including ANPD Resolution CD/ANPD No. 19/2024, by utilizing Standard Contractual Clauses or other approved legal mechanisms to safeguard your data.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eIncident Notification:\u003c/strong\u003e The Company is committed to protecting your data. In the unlikely event of a security incident involving your personal data that may create a risk or relevant damage, we will notify the National Data Protection Authority (ANPD) and affected data subjects within the legally mandated timeframe, which is currently three (3) business days.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eData Protection Officer (DPO):\u003c/strong\u003e Information on how to contact our Data Protection Officer is available in our main Privacy Policy, accessible on our website.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e9. Contact Us\u003c/h2\u003e\n    \u003cp\u003eIf you have any questions about this Return and Refund Policy, or wish to submit a request, please contact us through the official channel provided on our website:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eBy visiting this page on our website:\u003c/strong\u003e \u003ca href=\"https://www.timesafe.com.br/contato.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003ePlease note that we do not provide support or process refund requests via social media or other unofficial channels.\u003c/p\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Return and Refund","languageLabel":"English"},{"documentType":"privacy_consent","language":"EN","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003ePrivacy Consent and Cookie Policy for TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n    \u003ch2\u003ePrivacy Consent and Cookie Policy\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eLast Updated:\u003c/strong\u003e October 1, 2026\u003c/p\u003e\n    \u003cp\u003e\n        This Privacy Consent and Cookie Policy (\"Policy\") explains what cookies are, how TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS (\"Company,\" \"We,\" \"Us,\" or \"Our\") uses them on the TIMESAFE software and associated websites (collectively, the \"Service\"), and your choices regarding cookies.\n    \u003c/p\u003e\n    \u003cp\u003e\n        \u003cstrong\u003eBY ACCESSING, DOWNLOADING, INSTALLING, OR CONTINUING TO USE THE SERVICE, YOU ACKNOWLEDGE THAT YOU HAVE READ, UNDERSTOOD, AND UNCONDITIONALLY AGREE TO BE BOUND BY THIS POLICY IN ITS ENTIRETY. IF YOU DO NOT AGREE TO THE TERMS AND CONDITIONS OUTLINED IN THIS POLICY, YOU MUST IMMEDIATELY CEASE ALL USE OF THE SERVICE AND DELETE ANY ASSOCIATED FILES FROM YOUR DEVICES.\u003c/strong\u003e\n    \u003c/p\u003e\n    \u003cp\u003e\n        This Policy should be read in conjunction with our Terms of Service and Privacy Policy. While cookies do not typically contain information that personally identifies a user, the personal information that We store about You may be linked to the information stored in and obtained from cookies. We do not store sensitive personal information, such as mailing addresses, account passwords, etc., in the cookies We use.\n    \u003c/p\u003e\n\n    \u003ch2\u003e1. Interpretation and Definitions\u003c/h2\u003e\n    \u003ch3\u003eInterpretation\u003c/h3\u003e\n    \u003cp\u003e\n        The words of which the initial letter is capitalized have meanings defined under the following conditions. The following definitions shall have the same meaning regardless of whether they appear in singular or in plural.\n    \u003c/p\u003e\n    \u003ch3\u003eDefinitions\u003c/h3\u003e\n    \u003cp\u003eFor the purposes of this Privacy Consent and Cookie Policy:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003e\"Account\"\u003c/strong\u003e means a unique account created for You to access our Service or parts of our Service.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003e\"ANPD\"\u003c/strong\u003e refers to the Autoridade Nacional de Proteção de Dados, the Brazilian National Data Protection Authority.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003e\"Company\"\u003c/strong\u003e (referred to as either \"the Company,\" \"We,\" \"Us,\" or \"Our\" in this Agreement) refers to \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, with CNPJ 41.648.990/0001-56, NIRE 35237097027, located at ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003e\"Cookies\"\u003c/strong\u003e means small text files that are placed on Your computer, mobile device, or any other device by a website, containing the details of Your browsing history on that website among its many uses. They are fundamental to the operation of the modern internet.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003e\"Country\"\u003c/strong\u003e refers to: Brazil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003e\"Data Controller\"\u003c/strong\u003e, for the purposes of the LGPD, refers to the Company as the legal person which, alone or jointly with others, makes decisions concerning the purposes and means of the processing of Personal Data.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003e\"Device\"\u003c/strong\u003e means any device that can access the Service such as a computer, a cellphone, or a digital tablet.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003e\"LGPD\"\u003c/strong\u003e means the Brazilian General Data Protection Law (Lei Geral de Proteção de Dados - Law No. 13.709/2018), as amended and updated.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003e\"Personal Data\"\u003c/strong\u003e is any information that relates to an identified or identifiable individual.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003e\"Service\"\u003c/strong\u003e refers to the TIMESAFE software, applications, and website accessible via \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e and other related domains and platforms operated by the Company.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003e\"Third-party\"\u003c/strong\u003e refers to any entity, service, or content not directly controlled by the Company.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003e\"You\"\u003c/strong\u003e means the individual accessing or using the Service, or the company, or other legal entity on behalf of which such individual is accessing or using the Service, as applicable. Your agreement to this Policy is a binding agreement between You and the Company.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e2. The Use of Cookies\u003c/h2\u003e\n    \u003cp\u003e\n        We use cookies and similar tracking technologies to track the activity on Our Service and store certain information. The technologies We use may include cookies, web beacons, tags, and scripts to collect and track information and to improve and analyze Our Service. The use of this technology is essential for Us to deliver a functional, secure, and user-friendly experience. You acknowledge and agree that the disabling of certain cookies may significantly impair or completely prevent the functionality of the Service.\n    \u003c/p\u003e\n\n    \u003ch2\u003e3. Types of Cookies Used\u003c/h2\u003e\n    \u003cp\u003e\n        Cookies can be \"Persistent\" or \"Session\" Cookies. Persistent Cookies remain on Your personal computer or mobile device when You go offline, while Session Cookies are deleted as soon as You close Your web browser. We use both Session and Persistent Cookies for the purposes set out below. Your consent, where required by law, will be obtained before placing non-essential cookies on Your device.\n    \u003c/p\u003e\n    \n    \u003ch3\u003e4. Essential Cookies\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eType:\u003c/strong\u003e Session and Persistent Cookies\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAdministered by:\u003c/strong\u003e Us\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePurpose:\u003c/strong\u003e THESE COOKIES ARE ABSOLUTELY ESSENTIAL TO PROVIDE YOU WITH THE SERVICES AVAILABLE THROUGH THE WEBSITE AND TO ENABLE YOU TO USE SOME OF ITS CORE FEATURES. They are critical for functions such as user authentication, fraud prevention, security, and managing network performance. For example, they help to authenticate users and prevent fraudulent use of user accounts. Without these cookies, the services that You have asked for, such as accessing secure areas or processing payments, cannot be provided. We only use these cookies to provide You with those services.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eConsent:\u003c/strong\u003e Because these cookies are strictly necessary to deliver the Service, they do not require Your consent under applicable laws, including the LGPD. BY USING OUR SERVICE, YOU ACKNOWLEDGE AND AGREE THAT THESE COOKIES ARE A NECESSARY PART OF THE SERVICE'S OPERATION.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003e5. Functionality Cookies\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eType:\u003c/strong\u003e Persistent Cookies\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAdministered by:\u003c/strong\u003e Us\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePurpose:\u003c/strong\u003e These cookies allow Us to remember choices You make when You use the Service, such as remembering Your login details, language preference, or other custom settings. The purpose of these cookies is to provide You with a more personal experience and to avoid You having to re-enter Your preferences every time You use the Service. This enhances usability but is not strictly essential for the Service to function at a basic level.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eConsent:\u003c/strong\u003e We will request Your consent before placing these cookies on Your device. You may withdraw this consent at any time through our cookie management tool or Your browser settings, though doing so may result in a less personalized and convenient user experience.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003e6. Tracking and Performance Cookies\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eType:\u003c/strong\u003e Persistent Cookies\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAdministered by:\u003c/strong\u003e Third-Parties\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePurpose:\u003c/strong\u003e These cookies are used to track information about traffic to the Service and how users interact with it. The information gathered via these Cookies may directly or indirectly identify You as an individual visitor. This is because the information collected is typically linked to a pseudonymous identifier associated with the device You use to access the Service. We use this data to understand usage patterns, identify and diagnose technical issues, improve the performance of our Service, and make business decisions. Examples include cookies from Google Analytics or similar analytics providers.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eThird-Party Involvement:\u003c/strong\u003e These cookies are set and managed by third-party service providers. We do not control the setting or data collection practices of these third parties. Their use of your data is governed by their own privacy policies. WE DISCLAIM ALL LIABILITY FOR THE DATA COLLECTION, USE, AND SECURITY PRACTICES OF ANY THIRD-PARTY PROVIDERS.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eConsent:\u003c/strong\u003e We will request Your explicit consent before placing these cookies on Your device. You have the right to refuse or withdraw consent for these cookies at any time.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003e7. Advertising Cookies\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eType:\u003c/strong\u003e Persistent Cookies\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAdministered by:\u003c/strong\u003e Third-Parties\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePurpose:\u003c/strong\u003e These cookies track Your browsing habits to enable third-party advertising networks (such as Google AdSense, Meta, etc.) to show You advertising that is more likely to be of interest to You. These cookies use information about Your browsing history to group You with other users who have similar interests. Based on that information, and with our permission, third-party advertisers can place cookies to enable them to show adverts which We think will be relevant to Your interests while You are on third-party websites.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDisclaimer:\u003c/strong\u003e THE COMPANY HAS NO CONTROL OVER AND ASSUMES NO RESPONSIBILITY FOR THE CONTENT, PRIVACY POLICIES, OR PRACTICES OF ANY THIRD-PARTY ADVERTISERS OR ADVERTISING NETWORKS. Your interaction with these advertisements is at Your own risk.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eConsent:\u003c/strong\u003e We will request Your explicit consent before allowing these cookies to be placed on Your device. Refusing consent will not prevent you from seeing advertisements, but they will not be tailored to your interests.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e8. Your Choices\u003c/h2\u003e\n    \u003cp\u003e\n        You have control over the use of cookies. When you first visit our Service, you will be presented with a cookie consent banner that allows you to accept all cookies, reject non-essential cookies, or customize your preferences.\n    \u003c/p\u003e\n    \u003cp\u003e\n        If You prefer to avoid the use of Cookies on the Service, You must first disable the use of cookies in Your browser and then delete the Cookies saved in Your browser associated with this website. You may use this option for preventing the use of Cookies at any time. However, please be aware of the following consequences:\n    \u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eImpact of Disabling Cookies:\u003c/strong\u003e IF YOU DO NOT ACCEPT OUR COOKIES, OR IF YOU DISABLE THEM, YOU MAY EXPERIENCE SOME INCONVENIENCE IN YOUR USE OF THE SERVICE, AND SOME FEATURES MAY NOT FUNCTION AT ALL. ESSENTIAL COOKIES ARE REQUIRED FOR THE SERVICE TO OPERATE, AND DISABLING THEM WILL LIKELY RENDER THE SERVICE UNUSABLE, PARTICULARLY FOR LOGGED-IN USERS WITH A PAID SUBSCRIPTION.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAssumption of Risk:\u003c/strong\u003e YOU ASSUME ALL RESPONSIBILITY AND RISK FOR ANY SERVICE DEGRADATION, LOSS OF FUNCTIONALITY, OR INABILITY TO USE THE SERVICE RESULTING FROM YOUR DECISION TO DISABLE OR DELETE COOKIES.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eYou can manage cookie settings in most popular web browsers. For more information, please visit the help pages for your browser:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eFor Google Chrome: \u003ca href=\"https://support.google.com/accounts/answer/32050\"\u003ehttps://support.google.com/accounts/answer/32050\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003eFor Microsoft Edge: \u003ca href=\"http://support.microsoft.com/kb/278835\"\u003ehttp://support.microsoft.com/kb/278835\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003eFor Mozilla Firefox: \u003ca href=\"https://support.mozilla.org/en-US/kb/delete-cookies-remove-info-websites-stored\"\u003ehttps://support.mozilla.org/en-US/kb/delete-cookies-remove-info-websites-stored\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003eFor Apple Safari: \u003ca href=\"https://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac\"\u003ehttps://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eFor any other web browser, please visit your web browser's official web pages.\u003c/p\u003e\n    \n    \u003ch2\u003e9. Embedded Content and Third-Party Links\u003c/h2\u003e\n    \u003cp\u003e\n        The Service may contain links to other websites or include embedded content (e.g., videos, images, articles, APIs, etc.) that are not operated by Us. Embedded content from other websites behaves in the exact same way as if the visitor has visited the other website.\n    \u003c/p\u003e\n    \u003cp\u003e\n        These external websites may collect data about You, use their own cookies, embed additional third-party tracking, and monitor Your interaction with that embedded content, including tracking Your interaction with the embedded content if You have an account and are logged in to that website.\n    \u003c/p\u003e\n    \u003cp\u003e\n        \u003cstrong\u003eWE HAVE NO CONTROL OVER AND ASSUME NO RESPONSIBILITY FOR THE CONTENT, PRIVACY POLICIES, COOKIE POLICIES, OR PRACTICES OF ANY THIRD-PARTY SITES OR SERVICES. WE STRONGLY ADVISE YOU TO REVIEW THE PRIVACY POLICY AND TERMS OF EVERY SITE YOU VISIT. YOU ACCESS AND USE SUCH THIRD-PARTY CONTENT AND SERVICES ENTIRELY AT YOUR OWN RISK.\u003c/strong\u003e\n    \u003c/p\u003e\n\n    \u003ch2\u003eLGPD Compliance and Data Subject Rights\u003c/h2\u003e\n    \u003cp\u003e\n        The Company is committed to processing personal data in full compliance with the Brazilian General Data Protection Law (LGPD - Law No. 13.709/2018) and its subsequent regulations, including updates for 2024-2025. This section outlines our commitment and Your rights as a data subject.\n    \u003c/p\u003e\n    \u003ch3\u003eData Subject Rights\u003c/h3\u003e\n    \u003cp\u003eUnder the LGPD, You have the following rights regarding Your personal data:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eConfirmation of Existence:\u003c/strong\u003e The right to confirm the existence of processing of Your data.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAccess:\u003c/strong\u003e The right to access Your personal data that We hold.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCorrection:\u003c/strong\u003e The right to request the correction of incomplete, inaccurate, or out-of-date data.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAnonymization, Blocking, or Deletion:\u003c/strong\u003e The right to request the anonymization, blocking, or deletion of unnecessary or excessive data or data processed in noncompliance with the LGPD.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eData Portability:\u003c/strong\u003e The right to request the portability of Your data to another service or product provider, upon express request, in accordance with the regulations of the ANPD.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDeletion:\u003c/strong\u003e The right to request the deletion of personal data processed with Your consent, except in cases where retention is permitted by law.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInformation about Sharing:\u003c/strong\u003e The right to information about public and private entities with which the Company has shared Your data.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInformation about Consent:\u003c/strong\u003e The right to information about the possibility of not providing consent and the consequences of such a refusal.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRevocation of Consent:\u003c/strong\u003e The right to revoke Your consent at any time, by express request. The revocation of consent does not invalidate the processing carried out prior to the revocation.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eTo exercise any of these rights, please contact Us through the official contact channel provided in the \"Contact Us\" section. We will respond to your request in accordance with the timeframes and procedures established by the LGPD.\u003c/p\u003e\n\n    \u003ch3\u003eInternational Data Transfers\u003c/h3\u003e\n    \u003cp\u003e\n        To provide the Service, We may process and store Your information on servers located outside of Brazil. In the event of an international transfer of Your personal data, We will ensure that such transfer complies with the rules set forth by the ANPD, including ANPD Resolution CD/ANPD No. 19/2024. This will be accomplished through legally-binding mechanisms such as Standard Contractual Clauses (SCCs) approved by the ANPD or other valid transfer mechanisms that guarantee a level of data protection compatible with the LGPD. BY USING THE SERVICE, YOU CONSENT TO THE TRANSFER OF YOUR DATA TO JURISDICTIONS OUTSIDE OF BRAZIL IN ACCORDANCE WITH THESE PROTECTIONS.\n    \u003c/p\u003e\n\n    \u003ch3\u003eData Breach Notification\u003c/h3\u003e\n    \u003cp\u003e\n        In the event of a security incident that may create a relevant risk or damage to You or other data subjects, the Company is committed to notifying both the ANPD and the affected data subjects in a timely manner. In accordance with current regulations, this notification will be made within \u003cstrong\u003ethree (3) business days\u003c/strong\u003e from the date the Company becomes aware of the incident. The notification will include details of the incident, the data affected, the risks involved, and the measures taken to contain the damage and remediate the situation.\n    \u003c/p\u003e\n    \n    \u003ch3\u003eData Protection Officer (DPO)\u003c/h3\u003e\n    \u003cp\u003e\n        The Company has appointed a Data Protection Officer (DPO) who is responsible for overseeing our data protection strategy and implementation to ensure compliance with the LGPD. You may contact our DPO for any questions or requests regarding Your personal data by using the contact information provided in the \"Contact Us\" section below.\n    \u003c/p\u003e\n\n    \u003ch2\u003eGeneral Legal Provisions and Disclaimers\u003c/h2\u003e\n    \u003ch3\u003eDisclaimer of Warranties\u003c/h3\u003e\n    \u003cp\u003e\n        \u003cstrong\u003eTHE SERVICE AND ALL CONTENT, MATERIALS, AND INFORMATION PROVIDED THROUGH IT ARE PROVIDED ON AN \"AS IS\" AND \"AS AVAILABLE\" BASIS, WITHOUT ANY WARRANTIES OF ANY KIND, EITHER EXPRESS, IMPLIED, OR STATUTORY. TO THE FULLEST EXTENT PERMISSIBLE BY APPLICABLE LAW, THE COMPANY, ITS AFFILIATES, AND ITS LICENSORS EXPRESSLY DISCLAIM ALL WARRANTIES, INCLUDING, BUT NOT LIMITED TO, IMPLIED WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE, TITLE, AND NON-INFRINGEMENT.\u003c/strong\u003e\n    \u003c/p\u003e\n    \u003cp\u003e\n        \u003cstrong\u003eTHE COMPANY DOES NOT WARRANT THAT: (A) THE SERVICE WILL BE UNINTERRUPTED, TIMELY, SECURE, OR ERROR-FREE; (B) TH elating to: (a) your use or misuse of the Service; (b) your violation of any provision of this Notice or any other applicable terms; (c) any content, data, or information you submit, post, or transmit through the Service; (d) your violation of any applicable law, rule, or regulation; or (e) your violation of any rights of a third party, including but not limited to intellectual property rights.\u003c/p\u003e\n    \n    \u003ch3\u003eCompliance with Brazilian General Data Protection Law (LGPD)\u003c/h3\u003e\n    \u003cp\u003eThe Company is committed to processing personal data in compliance with the Brazilian General Data Protection Law (Lei Geral de Proteção de Dados Pessoais, \"LGPD\" - Law No. 13.709/2018) and its subsequent regulations.\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eData Subject Rights:\u003c/strong\u003e In accordance with the LGPD, you have the right to: request access to your personal data; request correction of incomplete, inaccurate, or outdated data; request anonymization, blocking, or deletion of unnecessary or excessive data or data processed in noncompliance with the LGPD; request the portability of your data to another service or product provider; request the deletion of personal data processed with your consent; obtain information about public and private entities with which the Company has shared data; obtain information about the possibility of not providing consent and the consequences of denial; and revoke your consent at any time.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eIncident Notification:\u003c/strong\u003e In the event of a security incident that may create a relevant risk or damage to you or other data subjects, the Company will notify the Brazilian National Data Protection Authority (ANPD) and affected data subjects within a reasonable time, making best efforts to comply with the three (3) business day deadline as recommended by the ANPD.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInternational Data Transfer:\u003c/strong\u003e Should it be necessary to transfer your personal data internationally, such transfers will be conducted in strict compliance with LGPD requirements and ANPD regulations, including ANPD Resolution CD/ANPD No. 19/2024. This will be achieved through mechanisms such as the use of standard contractual clauses approved by the ANPD, specific contractual clauses, binding corporate rules, or by transferring to countries that provide an adequate level of data protection.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eData Protection Officer (DPO):\u003c/strong\u003e The Company has appointed a Data Protection Officer who is responsible for overseeing our data protection strategy and implementation to ensure compliance with LGPD requirements. The DPO can be reached for any inquiries related to your personal data or this policy via the contact methods listed below.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003eGoverning Law and Jurisdiction\u003c/h3\u003e\n    \u003cp\u003eThis Notice and your use of the Service shall be governed by and construed in accordance with the laws of the Federative Republic of Brazil, without regard to its conflict of law principles.\u003c/p\u003e\n    \u003cp\u003eYou irrevocably agree that any legal action, dispute, or proceeding arising out of or relating to this Notice or the Service shall be submitted to the exclusive jurisdiction of the courts of the judicial district of São Paulo, State of São Paulo, Brazil. You irrevocably waive any objection to the laying of venue of any such suit, action, or proceeding in such courts and any claim that any such suit, action, or proceeding has been brought in an inconvenient forum.\u003c/p\u003e\n    \n    \u003ch3\u003eSeverability and Waiver\u003c/h3\u003e\n    \u003cp\u003eIf any provision of this Notice is held to be unenforceable or invalid, such provision will be changed and interpreted to accomplish the objectives of such provision to the greatest extent possible under applicable law, and the remaining provisions will continue in full force and effect. No waiver of any term or condition set forth in this Notice shall be deemed a further or continuing waiver of such term or condition or a waiver of any other term or condition.\u003c/p\u003e\n\n    \u003ch2\u003e8. Contact\u003c/h2\u003e\n    \u003cp\u003eFor any questions regarding this Copyright Notice, to request permission for uses not granted herein, to submit an infringement notice, or for any inquiries related to your data under the LGPD, please contact us by visiting this page on our website:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eContact Link:\u003c/strong\u003e \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n    \n    \u003cp\u003eCopyright © 2026 TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS. All Rights Reserved.\u003c/p\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Copyright","languageLabel":"English"},{"documentType":"return_refund","language":"ES","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"es\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003ePolítica de Devolución y Reembolso - TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003ch1\u003ePolítica de Devolución y Reembolso de TIMESAFE\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003eFecha de última actualización:\u003c/strong\u003e 1 de octubre de 2026\u003c/p\u003e\n\n\u003cp\u003eLe agradecemos por adquirir y utilizar el software y los servicios de TIMESAFE (\"Servicio\"). Esta Política de Devolución y Reembolso (\"Política\") describe las condiciones y procedimientos para devoluciones y reembolsos relacionados con nuestro Servicio.\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eAL ACCEDER, DESCARGAR, INSTALAR O UTILIZAR EL SERVICIO, USTED (\"USTED\" O EL \"USUARIO\") RECONOCE QUE HA LEÍDO, COMPRENDIDO Y ACEPTA ESTAR VINCULADO POR LOS TÉRMINOS DE ESTA POLÍTICA, ASÍ COMO POR NUESTROS TÉRMINOS Y CONDICIONES GENERALES. SI NO ESTÁ DE ACUERDO CON ESTA POLÍTICA, NO ACCEDA NI UTILICE EL SERVICIO. EL USO CONTINUADO DEL SERVICIO DESPUÉS DE CUALQUIER MODIFICACIÓN DE ESTA POLÍTICA CONSTITUYE SU ACEPTACIÓN DE DICHAS MODIFICACIONES.\u003c/strong\u003e\u003c/p\u003e\n\n\u003ch2\u003e1. Interpretación y Definiciones\u003c/h2\u003e\n\u003ch3\u003eInterpretación\u003c/h3\u003e\n\u003cp\u003eLas palabras cuya letra inicial está en mayúscula tienen significados definidos bajo las siguientes condiciones. Las siguientes definiciones tendrán el mismo significado independientemente de que aparezcan en singular o en plural.\u003c/p\u003e\n\n\u003ch3\u003eDefiniciones\u003c/h3\u003e\n\u003cp\u003eA los efectos de esta Política de Devolución y Reembolso:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"la Empresa\", \"Nosotros\", \"Nos\" o \"Nuestro\" en este Acuerdo) se refiere a \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, con CNPJ 41.648.990/0001-56, NIRE 35237097027, y domicilio en ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSoftware\u003c/strong\u003e o \u003cstrong\u003eServicio\u003c/strong\u003e se refiere a la aplicación de software denominada \u003cstrong\u003eTIMESAFE\u003c/strong\u003e y todos los servicios, características, contenido y funcionalidades asociados proporcionados por la Empresa.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSuscripción\u003c/strong\u003e se refiere al acceso al Servicio o a partes del Servicio disponible únicamente mediante el pago de una tarifa recurrente.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePedido\u003c/strong\u003e significa una solicitud por su parte para comprar una Suscripción a nuestro Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePrueba Gratuita\u003c/strong\u003e se refiere a un período limitado durante el cual puede utilizar el Servicio sin costo, según lo ofrezca la Empresa a su entera discreción.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e o \u003cstrong\u003eUsuario\u003c/strong\u003e significa la persona física que accede o utiliza el Servicio, o la empresa u otra entidad legal en nombre de la cual dicha persona accede o utiliza el Servicio, según corresponda.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eLGPD\u003c/strong\u003e se refiere a la Ley General de Protección de Datos de Brasil (Lei Geral de Proteção de Dados Pessoais, Ley N° 13.709/2018).\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD\u003c/strong\u003e se refiere a la Autoridad Nacional de Protección de Datos de Brasil.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e2. Su Elegibilidad para un Reembolso\u003c/h2\u003e\n\u003cp\u003eNuestra política de reembolso es estricta debido a la naturaleza digital de nuestro Servicio. Una vez que se ha otorgado acceso a una Suscripción o se ha descargado el Software, es inherentemente no retornable.\u003c/p\u003e\n\n\u003cp\u003eNo obstante, la elegibilidad para un reembolso puede considerarse en las siguientes circunstancias, sujetas a las leyes aplicables y a la discreción exclusiva de la Empresa:\u003c/p\u003e\n\n\u003ch3\u003eDerecho de Arrepentimiento (Legislación Brasileña)\u003c/h3\u003e\n\u003cp\u003eDe conformidad con el Artículo 49 del Código de Defensa del Consumidor de Brasil (Lei nº 8.078/90), si Usted es un consumidor residente en Brasil, tiene derecho a cancelar una Suscripción y solicitar un reembolso completo dentro de los \u003cstrong\u003e7 (siete) días naturales\u003c/strong\u003e siguientes a la fecha de la compra inicial de la Suscripción.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIMPORTANTE: ESTE DERECHO DE ARREPENTIMIENTO ES NULO E INVÁLIDO SI USTED HA HECHO USO EFECTIVO DEL SERVICIO.\u003c/strong\u003e El uso incluye, entre otros, iniciar sesión en su cuenta, activar el software, utilizar cualquiera de sus funcionalidades o descargar cualquier contenido. Al utilizar el Servicio dentro de este período de 7 días, Usted reconoce y acepta que renuncia a su derecho de arrepentimiento y a cualquier reclamación de reembolso bajo esta disposición.\u003c/p\u003e\n\n\u003ch3\u003eFallas Técnicas Graves y No Resueltas\u003c/h3\u003e\n\u003cp\u003eUn reembolso puede ser considerado si Usted experimenta una falla técnica grave que impide el funcionamiento básico del Servicio en su sistema, y si se cumplen \u003cstrong\u003eTODAS\u003c/strong\u003e las siguientes condiciones:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eLa falla es atribuible directamente al Servicio y no a su hardware, software de terceros, configuración del sistema o red.\u003c/li\u003e\n    \u003cli\u003eUsted ha contactado a nuestro equipo de soporte técnico a través de nuestro canal oficial (\u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e) dentro de las 72 horas posteriores a la detección del problema.\u003c/li\u003e\n    \u003cli\u003eUsted ha cooperado plenamente con nuestro equipo de soporte, proporcionando toda la información solicitada (registros de errores, capturas de pantalla, acceso remoto si es necesario) para diagnosticar y intentar resolver el problema.\u003c/li\u003e\n    \u003cli\u003eNuestro equipo técnico ha determinado, a su entera discreción, que el problema es irresoluble en un plazo razonable (generalmente 30 días).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLa elegibilidad para un reembolso por fallas técnicas se evalúa caso por caso y no está garantizada.\u003c/p\u003e\n\n\u003ch2\u003e3. Plazos para la Solicitud\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eSolicitudes bajo el Derecho de Arrepentimiento:\u003c/strong\u003e Cualquier solicitud de reembolso bajo el derecho de arrepentimiento de 7 días debe ser recibida por la Empresa estrictamente dentro de los 7 días naturales posteriores a la fecha de la compra inicial. Las solicitudes recibidas después de este período no serán elegibles.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSolicitudes por Fallas Técnicas:\u003c/strong\u003e Debe informar el problema técnico a nuestro soporte dentro de las 72 horas posteriores a su descubrimiento. La solicitud formal de reembolso solo puede realizarse después de que nuestro equipo de soporte haya confirmado que el problema es irresoluble, según se describe en la sección anterior.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eRenovaciones de Suscripción:\u003c/strong\u003e LAS TARIFAS DE RENOVACIÓN DE SUSCRIPCIÓN (MENSUALES O ANUALES) SON ESTRICTAMENTE NO REEMBOLSABLES. Es su responsabilidad cancelar su Suscripción antes de la fecha de renovación automática si no desea continuar con el Servicio. No se otorgarán reembolsos por olvido o falta de cancelación.\u003c/p\u003e\n\n\u003ch2\u003e4. Proceso de Reembolso\u003c/h2\u003e\n\u003cp\u003ePara solicitar un reembolso, debe seguir este proceso de manera rigurosa:\u003c/p\u003e\n\u003col\u003e\n    \u003cli\u003e\u003cstrong\u003eContacto Inicial:\u003c/strong\u003e Envíe una solicitud formal a través de nuestro formulario de contacto en \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e. Su solicitud debe incluir:\n        \u003cul\u003e\n            \u003cli\u003eSu nombre completo y la dirección de correo electrónico asociada a su cuenta de TIMESAFE.\u003c/li\u003e\n            \u003cli\u003eEl número de pedido o ID de transacción.\u003c/li\u003e\n            \u003cli\u003eLa fecha de la compra.\u003c/li\u003e\n            \u003cli\u003eUn motivo detallado y claro para la solicitud de reembolso, haciendo referencia a los criterios de elegibilidad mencionados en la Sección 2.\u003c/li\u003e\n        \u003c/ul\u003e\n    \u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEvaluación y Diagnóstico:\u003c/strong\u003e Nuestro equipo revisará su solicitud. Si se basa en una falla técnica, se le asignará un ticket de soporte y se iniciará el proceso de diagnóstico. Su plena cooperación es obligatoria. La falta de respuesta a las solicitudes de nuestro equipo de soporte en un plazo de 5 días hábiles resultará en el cierre del ticket y la denegación automática de la solicitud de reembolso.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDecisión:\u003c/strong\u003e Una vez completada la evaluación, le notificaremos por correo electrónico la aprobación o el rechazo de su solicitud de reembolso. La decisión de la Empresa es final y vinculante.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eProcesamiento del Reembolso:\u003c/strong\u003e Si su reembolso es aprobado, procesaremos el crédito a su método de pago original. Tenga en cuenta que puede tardar entre 5 y 15 días hábiles, o incluso más, para que el reembolso aparezca en su estado de cuenta, dependiendo de las políticas de su banco o emisor de tarjeta de crédito. No somos responsables de los retrasos causados por procesadores de pago de terceros. El monto reembolsado puede excluir cualquier tarifa de transacción o impuesto no recuperable.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003ch2\u003e5. Artículos No Reembolsables\u003c/h2\u003e\n\u003cp\u003eSALVO QUE LA LEY APLICABLE EXIJA EXPRESAMENTE LO CONTRARIO, LOS SIGUIENTES ARTÍCULOS Y SERVICIOS SON ESTRICTAMENTE NO REEMBOLSABLES BAJO NINGUNA CIRCUNSTANCIA:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eSuscripciones después del período de 7 días del derecho de arrepentimiento, o dentro de ese período si el Servicio ha sido utilizado.\u003c/li\u003e\n    \u003cli\u003eTarifas de renovación de Suscripción, ya sean mensuales o anuales.\u003c/li\u003e\n    \u003cli\u003eCompras realizadas a través de revendedores de terceros, tiendas de aplicaciones u otros distribuidores. Debe adherirse a la política de reembolso del vendedor respectivo.\u003c/li\u003e\n    \u003cli\u003eTarifas de suscripción si ha violado nuestros Términos y Condiciones, lo que ha resultado en la suspensión o terminación de su cuenta.\u003c/li\u003e\n    \u003cli\u003ePeríodos de suscripción no utilizados. Si cancela su suscripción, conservará el acceso hasta el final de su período de facturación actual, pero no recibirá un reembolso prorrateado.\u003c/li\u003e\n    \u003cli\u003eCambios de opinión o insatisfacción con las características del Servicio que estaban claramente descritas antes de la compra.\u003c/li\u003e\n    \u003cli\u003eIncompatibilidad con software o hardware de terceros que no figura como compatible en nuestra documentación oficial.\u003c/li\u003e\n    \u003cli\u003eFalta de una característica que nunca se publicitó como parte del Servicio.\u003c/li\u003e\n    \u003cli\u003eCompras realizadas por error (es su responsabilidad verificar su pedido antes de confirmar la compra).\u003c/li\u003e\n    \u003cli\u003eSuscripciones compradas con descuento o durante una promoción especial, a menos que se indique explícitamente lo contrario.\u003c/li\u003e\n    \u003cli\u003eCualquier tarifa por servicios adicionales, consultoría o soporte personalizado.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e6. Reembolsos Parciales\u003c/h2\u003e\n\u003cp\u003eLa Empresa generalmente no ofrece reembolsos parciales. En circunstancias excepcionales y a nuestra absoluta y única discreción, podemos considerar un reembolso parcial si una parte significativa del Servicio fue inaccesible durante un período prolongado debido a una falla de nuestro lado que no pudimos resolver. Cualquier cálculo de un reembolso parcial será realizado por la Empresa y su determinación será final.\u003c/p\u003e\n\n\u003ch2\u003e7. Cambios o Sustituciones\u003c/h2\u003e\n\u003cp\u003eDado que TIMESAFE es un servicio de software digital, no ofrecemos \"cambios\" o \"sustituciones\" en el sentido tradicional. Si el Servicio presenta un defecto, nuestro único compromiso, si lo hubiera, será intentar corregir dicho defecto a través de actualizaciones del software, a nuestra entera discreción. No hay garantía de que todos los errores o defectos reportados serán corregidos.\u003c/p\u003e\n\n\u003ch2\u003e8. Términos Legales Adicionales y Cláusulas de Protección\u003c/h2\u003e\n\u003cp\u003eEsta Política de Reembolso está sujeta y se incorpora a nuestros Términos y Condiciones Generales. En caso de conflicto, prevalecerán los Términos y Condiciones Generales.\u003c/p\u003e\n\n\u003ch3\u003eEXCLUSIÓN DE GARANTÍAS\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eEL SERVICIO SE PROPORCIONA \"TAL CUAL\" (\"AS IS\") Y \"SEGÚN DISPONIBILIDAD\" (\"AS AVAILABLE\"), CON TODOS SUS DEFECTOS Y SIN GARANTÍAS DE NINGÚN TIPO. EN LA MEDIDA MÁXIMA PERMITIDA POR LA LEY APLICABLE, LA EMPRESA, EN SU PROPIO NOMBRE Y EN NOMBRE DE SUS AFILIADOS Y SUS RESPECTIVOS LICENCIANTES Y PROVEEDORES DE SERVICIOS, RENUNCIA EXPRESAMENTE A TODAS LAS GARANTÍAS, YA SEAN EXPRESAS, IMPLÍCITAS, LEGALES O DE OTRO TIPO, CON RESPECTO AL SERVICIO, INCLUIDAS TODAS LAS GARANTÍAS IMPLÍCITAS DE COMERCIABILIDAD, IDONEIDAD PARA UN PROPÓSITO PARTICULAR, TÍTULO Y NO INFRACCIÓN, Y GARANTÍAS QUE PUEDAN SURGIR DEL CURSO DE LA NEGOCIACIÓN, CURSO DEL DESEMPEÑO, USO O PRÁCTICA COMERCIAL.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSIN LIMITACIÓN A LO ANTERIOR, LA EMPRESA NO OFRECE GARANTÍA NI COMPROMISO, Y NO HACE NINGUNA DECLARACIÓN DE NINGÚN TIPO DE QUE EL SERVICIO CUMPLIRÁ CON SUS REQUISITOS, ALCANZARÁ LOS RESULTADOS PREVISTOS, SERÁ COMPATIBLE O FUNCIONARÁ CON CUALQUIER OTRO SOFTWARE, APLICACIONES, SISTEMAS O SERVICIOS, FUNCIONARÁ SIN INTERRUPCIONES, CUMPLIRÁ CON CUALQUIER ESTÁNDAR DE RENDIMIENTO O FIABILIDAD, O SERÁ LIBRE DE ERRORES, O QUE CUALQUIER ERROR O DEFECTO PUEDA O SERÁ CORREGIDO.\u003c/strong\u003e\u003c/p\u003e\n\n\u003ch3\u003eLIMITACIÓN DE RESPONSABILIDAD\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eEN LA MEDIDA MÁXIMA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES SERÁN RESPONSABLES POR CUALQUIER DAÑO ESPECIAL, INCIDENTAL, INDIRECTO O CONSECUENTE DE CUALQUIER TIPO (INCLUYENDO, PERO NO LIMITADO A, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS U OTRA INFORMACIÓN, INTERRUPCIÓN DEL NEGOCIO, LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD QUE SURJA DE O ESTÉ RELACIONADA DE ALGUNA MANERA CON EL USO O LA INCAPACIDAD DE USAR EL SERVICIO, SOFTWARE DE TERCEROS Y/O HARDWARE DE TERCEROS UTILIZADO CON EL SERVICIO, O DE OTRO MODO EN RELACIÓN CON CUALQUIER DISPOSICIÓN DE ESTOS TÉRMINOS).\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLA RESPONSABILIDAD TOTAL ACUMULADA DE LA EMPRESA BAJO ESTE ACUERDO, POR CUALQUIER CAUSA DE ACCIÓN, NO EXCEDERÁ LA CANTIDAD MAYOR ENTRE: (A) EL MONTO TOTAL PAGADO POR USTED A LA EMPRESA POR EL SERVICIO DURANTE EL PERÍODO DE DOCE (12) MESES INMEDIATAMENTE ANTERIORES AL EVENTO QUE DIO LUGAR A LA RECLAMACIÓN; O (B) LA SUMA DE VEINTE DÓLARES ESTADOUNIDENSES ($20.00 USD).\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAlgunas jurisdicciones no permiten la exclusión de garantías implícitas o la limitación de responsabilidad por daños incidentales o consecuentes, lo que significa que algunas de las limitaciones anteriores pueden no aplicarse a Usted. En tales jurisdicciones, la responsabilidad de cada parte se limitará en la mayor medida permitida por la ley.\u003c/p\u003e\n\n\u003ch3\u003eIndemnización\u003c/h3\u003e\n\u003cp\u003eUsted acepta indemnizar, defender y mantener indemne a la Empresa, sus afiliados, directores, funcionarios, empleados, agentes, licenciantes y proveedores de y contra todas las reclamaciones, pérdidas, responsabilidades, demandas, daños, juicios, costos y gastos (incluidos los honorarios razonables de abogados) que surjan de o estén relacionados con: (a) su uso o mal uso del Servicio; (b) cualquier incumplimiento de esta Política o de los Términos y Condiciones Generales por su parte; (c) cualquier contenido que Usted publique, transmita o ponga a disposición a través del Servicio; (d) su violación de cualquier ley, norma o regulación aplicable; o (e) su violación de los derechos de cualquier tercero.\u003c/p\u003e\n\n\u003ch3\u003eAsunción de Riesgo\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eUSTED ASUME LA TOTAL RESPONSABILIDAD Y RIESGO POR SU USO DEL SERVICIO Y DE INTERNET. EL SERVICIO SE PROPORCIONA \"TAL CUAL\" SIN GARANTÍAS DE NINGÚN TIPO. LA EMPRESA NO SERÁ RESPONSABLE DE NINGÚN DAÑO RESULTANTE DEL USO O LA INCAPACIDAD DE USAR EL SERVICIO, INCLUIDOS LOS DAÑOS CAUSADOS POR MALWARE, VIRUS, ATAQUES CIBERNÉTICOS O CUALQUIER INCORRECCIÓN O INCOMPLETITUD EN EL SOFTWARE O LA INFORMACIÓN. USTED ES EL ÚNICO RESPONSABLE DE IMPLEMENTAR PROCEDIMIENTOS Y PUNTOS DE CONTROL SUFICIENTES PARA SATISFACER SUS REQUISITOS PARTICULARES DE EXACTITUD DE ENTRADA Y SALIDA DE DATOS, Y DE MANTENER UN MEDIO EXTERNO A NUESTRO SERVICIO PARA LA RECONSTRUCCIÓN DE CUALQUIER DATO PERDIDO.\u003c/strong\u003e\u003c/p\u003e\n\n\u003ch2\u003e9. Cumplimiento de la Ley General de Protección de Datos (LGPD) de Brasil\u003c/h2\u003e\n\u003cp\u003eLa Empresa se compromete a proteger sus datos personales y a cumplir con los requisitos de la LGPD y sus regulaciones asociadas.\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eDerechos de los Titulares de Datos:\u003c/strong\u003e De acuerdo con la LGPD, Usted tiene derecho a:\n        \u003cul\u003e\n            \u003cli\u003eConfirmar la existencia de tratamiento de sus datos.\u003c/li\u003e\n            \u003cli\u003eAcceder a sus datos.\u003c/li\u003e\n            \u003cli\u003eCorregir datos incompletos, inexactos o desactualizados.\u003c/li\u003e\n            \u003cli\u003eAnonimizar, bloquear o eliminar datos innecesarios, excesivos o tratados en incumplimiento de la LGPD.\u003c/li\u003e\n            \u003cli\u003eSolicitar la portabilidad de sus datos a otro proveedor de servicios o productos.\u003c/li\u003e\n            \u003cli\u003eEliminar los datos personales tratados con su consentimiento.\u003c/li\u003e\n            \u003cli\u003eObtener información sobre las entidades públicas y privadas con las que la Empresa ha compartido sus datos.\u003c/li\u003e\n            \u003cli\u003eObtener información sobre la posibilidad de no dar su consentimiento y las consecuencias de la negativa.\u003c/li\u003e\n            \u003cli\u003eRevocar su consentimiento en cualquier momento.\u003c/li\u003e\n        \u003c/ul\u003e\n        Para ejercer estos derechos, contáctenos a través de nuestro portal oficial.\n    \u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotificación de Incidentes de Seguridad:\u003c/strong\u003e En caso de un incidente de seguridad que pueda acarrear un riesgo o daño relevante para Usted, la Empresa notificará a la ANPD y a los titulares de datos afectados en un plazo de \u003cstrong\u003e3 (tres) días hábiles\u003c/strong\u003e a partir del conocimiento del incidente, de conformidad con las regulaciones de la ANPD.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eTransferencia Internacional de Datos:\u003c/strong\u003e Si transferimos sus datos personales fuera de Brasil, lo haremos en estricto cumplimiento de la LGPD, utilizando mecanismos aprobados por la ANPD, como las Cláusulas Contractuales Estándar (según la Resolución CD/ANPD N° 19/2024), para garantizar un nivel adecuado de protección de datos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDelegado de Protección de Datos (DPO):\u003c/strong\u003e La Empresa ha designado un Delegado de Protección de Datos. Puede ponerse en contacto con nuestro DPO para cualquier pregunta o solicitud relacionada con la protección de sus datos personales a través de los canales proporcionados en nuestra página de contacto.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e10. Suscripciones y Pagos\u003c/h2\u003e\n\u003ch3\u003ePeríodo de Suscripción\u003c/h3\u003e\n\u003cp\u003eEl Servicio o algunas partes del Servicio están disponibles únicamente con una Suscripción de pago. Se le facturará por adelantado de forma recurrente y periódica (como mensual o anualmente), dependiendo del tipo de plan de Suscripción que seleccione al comprar la Suscripción.\u003c/p\u003e\n\u003cp\u003eAl final de cada período, su Suscripción se renovará automáticamente bajo exactamente las mismas condiciones, a menos que Usted la cancele o la Empresa la cancele. La Empresa se reserva el derecho de cancelar su suscripción por cualquier motivo, incluido el cese del servicio o el incumplimiento de los términos.\u003c/p\u003e\n\n\u003ch3\u003eCancelación de la Suscripción\u003c/h3\u003e\n\u003cp\u003ePuede cancelar la renovación de su Suscripción a través de la configuración de su cuenta en nuestro Servicio o poniéndose en contacto con nosotros. No recibirá un reembolso por las tarifas ya pagadas por su período de Suscripción actual y podrá acceder al Servicio hasta el final de su período de Suscripción actual.\u003c/p\u003e\n\n\u003ch3\u003eCambios de Precio\u003c/h3\u003e\n\u003cp\u003eLa Empresa, a su entera discreción y en cualquier momento, puede modificar las tarifas de Suscripción. Cualquier cambio en la tarifa de Suscripción entrará en vigor al final del período de Suscripción vigente en ese momento. Le proporcionaremos un aviso previo razonable de cualquier cambio en las tarifas de Suscripción para darle la oportunidad de cancelar su Suscripción antes de que dicho cambio entre en vigor. Su uso continuado del Servicio después de que el cambio en la tarifa de Suscripción entre en vigor constituye su acuerdo de pagar el monto modificado de la tarifa de Suscripción.\u003c/p\u003e\n\n\u003ch3\u003ePrueba Gratuita\u003c/h3\u003e\n\u003cp\u003eLa Empresa puede, a su entera discreción, ofrecer una Suscripción con una Prueba Gratuita por un período limitado. Es posible que se le solicite que ingrese su información de facturación para registrarse en la Prueba Gratuita. Si ingresa su información de facturación, no se le cobrará hasta que la Prueba Gratuita haya expirado. En el último día del período de Prueba Gratuita, a menos que haya cancelado su Suscripción, se le cobrarán automáticamente las tarifas de Suscripción aplicables para el tipo de Suscripción que haya seleccionado.\u003c/p\u003e\n\n\u003ch2\u003e11. Ley Aplicable y Jurisdicción\u003c/h2\u003e\n\u003cp\u003eEsta Política y cualquier disputa que surja de ella se regirán e interpretarán de acuerdo con las leyes de la República Federativa de Brasil, sin tener en cuenta sus disposiciones sobre conflicto de leyes.\u003c/p\u003e\n\u003cp\u003eLas partes acuerdan irrevocablemente que cualquier disputa, controversia o reclamación que surja de o esté relacionada con esta Política se someterá a la jurisdicción exclusiva de los tribunales del distrito de São Paulo, Estado de São Paulo, Brasil, renunciando a cualquier otro foro, por privilegiado que sea.\u003c/p\u003e\n\n\u003ch2\u003e12. Contacto\u003c/h2\u003e\n\u003cp\u003eSi tiene alguna pregunta sobre nuestra Política de Devolución y Reembolso, o si necesita iniciar una solicitud, póngase en contacto con nosotros exclusivamente a través de nuestra página web oficial:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eVisitando esta página en nuestro sitio web: \u003ca href=\"https://www.timesafe.com.br/contato.html\" target=\"_blank\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Devolución y Reembolso","languageLabel":"Español"},{"documentType":"privacy_policy","language":"ES","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"es\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003ctitle\u003ePolítica de Privacidad de TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003ch2\u003ePolítica de Privacidad de TIMESAFE\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eÚltima actualización:\u003c/strong\u003e 1 de octubre de 2026\u003c/p\u003e\n\n\u003cp\u003eEsta Política de Privacidad describe las políticas y procedimientos de \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e (en adelante, \"la Empresa\", \"Nosotros\", \"Nos\" o \"Nuestro\") sobre la recopilación, uso, divulgación y protección de su información cuando utiliza el software y los servicios de TIMESAFE (en adelante, \"el Servicio\").\u003c/p\u003e\n\n\u003cp\u003eUtilizamos sus Datos Personales para proporcionar y mejorar el Servicio. \u003cstrong\u003eAL ACCEDER, DESCARGAR, INSTALAR, CREAR UNA CUENTA O UTILIZAR DE CUALQUIER OTRA FORMA NUESTRO SERVICIO, USTED RECONOCE QUE HA LEÍDO, ENTENDIDO Y ACEPTA DE FORMA INEQUÍVOCA Y VINCULANTE LOS TÉRMINOS, CONDICIONES Y PRÁCTICAS DESCRITAS EN ESTA POLÍTICA DE PRIVACIDAD. SI USTED NO ESTÁ DE ACUERDO CON ESTA POLÍTICA DE PRIVACIDAD, NO DEBE ACCEDER NI UTILIZAR EL SERVICIO.\u003c/strong\u003e El uso continuado del Servicio después de la publicación de cualquier modificación a esta Política de Privacidad constituirá su aceptación de dichas modificaciones.\u003c/p\u003e\n\n\u003cp\u003eEsta Política de Privacidad ha sido elaborada en conformidad con la Ley General de Protección de Datos Personales de Brasil (LGPD), Ley N° 13.709/2018, y sus actualizaciones y regulaciones complementarias emitidas por la Autoridad Nacional de Protección de Datos (ANPD).\u003c/p\u003e\n\n\u003ch2\u003e1. Interpretación y Definiciones\u003c/h2\u003e\n\u003ch3\u003eInterpretación\u003c/h3\u003e\n\u003cp\u003eLas palabras cuya letra inicial está en mayúscula tienen significados definidos en las siguientes condiciones. Las siguientes definiciones tendrán el mismo significado independientemente de que aparezcan en singular o en plural.\u003c/p\u003e\n\n\u003ch3\u003eDefiniciones\u003c/h3\u0
