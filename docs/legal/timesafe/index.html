03e\n\u003cp\u003ePara los fines de esta Política de Privacidad:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eCuenta\u003c/strong\u003e significa una cuenta única creada para que Usted acceda a nuestro Servicio o a partes de nuestro Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAfiliado\u003c/strong\u003e significa una entidad que controla, es controlada por o está bajo control común con una parte, donde \"control\" significa la posesión, directa o indirecta, del poder de dirigir o causar la dirección de la gestión y políticas de una entidad, ya sea a través de la propiedad de valores con derecho a voto, por contrato o de otra manera.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAplicación\u003c/strong\u003e se refiere al programa de software proporcionado por la Empresa descargado por Usted en cualquier dispositivo electrónico, denominado TIMESAFE.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"la Empresa\", \"Nosotros\", \"Nos\" o \"Nuestro\" en este Acuerdo) se refiere a \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, con CNPJ 41.648.990/0001-56, NIRE 35237097027, y domicilio en ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL. Para los fines de la LGPD, la Empresa es el Controlador de Datos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eControlador de Datos\u003c/strong\u003e, para los fines de la LGPD, se refiere a la Empresa como la persona jurídica que toma las decisiones relativas al tratamiento de los Datos Personales.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePaís\u003c/strong\u003e se refiere a: Brasil.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e significa cualquier dispositivo que pueda acceder al Servicio, como una computadora, un teléfono celular o una tableta digital.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDatos Personales\u003c/strong\u003e es cualquier información que se relacione con una persona física identificada o identificable (\"Titular de los Datos\").\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServicio\u003c/strong\u003e se refiere a la Aplicación, el Sitio Web, o ambos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eProveedor de Servicios\u003c/strong\u003e (o Procesador de Datos) significa cualquier persona física o jurídica que procesa los datos en nombre de la Empresa. Se refiere a empresas o individuos de terceros empleados por la Empresa para facilitar el Servicio, para proporcionar el Servicio en nombre de la Empresa, para realizar servicios relacionados con el Servicio o para ayudar a la Empresa a analizar cómo se utiliza el Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDatos de Uso\u003c/strong\u003e se refiere a los datos recopilados automáticamente, ya sea generados por el uso del Servicio o por la propia infraestructura del Servicio (por ejemplo, la duración de una visita a una página).\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSitio Web\u003c/strong\u003e se refiere a TIMESAFE, accesible desde \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e significa el individuo que accede o utiliza el Servicio, o la empresa u otra entidad legal en nombre de la cual dicho individuo está accediendo o utilizando el Servicio, según corresponda. Bajo la LGPD, Usted puede ser referido como el Titular de los Datos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eLGPD\u003c/strong\u003e se refiere a la Ley General de Protección de Datos de Brasil (Lei Geral de Proteção de Dados Pessoais - Ley N° 13.709/2018).\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD\u003c/strong\u003e se refiere a la Autoridad Nacional de Protección de Datos de Brasil.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e2. Recopilación y Uso de Sus Datos Personales\u003c/h2\u003e\n\u003cp\u003eRecopilamos varios tipos de información para diversos fines con el objetivo de proporcionar y mejorar nuestro Servicio para Usted.\u003c/p\u003e\n\n\u003ch2\u003e3. Tipos de Datos Recopilados\u003c/h2\u003e\n\u003ch3\u003eDatos Personales\u003c/h3\u003e\n\u003cp\u003eAl utilizar nuestro Servicio, podemos solicitarle que nos proporcione cierta información de identificación personal que puede ser utilizada para contactarlo, identificarlo y gestionar su cuenta. La información de identificación personal puede incluir, entre otros, los siguientes datos:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eNombre y apellidos\u003c/li\u003e\n    \u003cli\u003eDirección de correo electrónico\u003c/li\u003e\n    \u003cli\u003eNúmero de teléfono\u003c/li\u003e\n    \u003cli\u003eDirección, Estado, Provincia, Código Postal, Ciudad\u003c/li\u003e\n    \u003cli\u003eInformación de la empresa (nombre, CNPJ/identificador fiscal, etc.)\u003c/li\u003e\n    \u003cli\u003eInformación de pago y facturación (como número de tarjeta de crédito, dirección de facturación), que es recopilada y procesada directamente por nuestros proveedores de servicios de pago externos y no es almacenada en nuestros servidores.\u003c/li\u003e\n    \u003cli\u003eDatos de Uso\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUsted nos proporciona esta información directamente cuando se registra en el Servicio, crea o modifica su perfil, realiza compras, se pone en contacto con el soporte al cliente o se comunica con nosotros de cualquier otra manera.\u003c/p\u003e\n\n\u003ch3\u003eDatos de Uso\u003c/h3\u003e\n\u003cp\u003eLos Datos de Uso se recopilan automáticamente al utilizar el Servicio.\u003c/p\u003e\n\u003cp\u003eLos Datos de Uso pueden incluir información como la dirección de Protocolo de Internet (IP) de su Dispositivo, el tipo y versión del navegador, el sistema operativo, las páginas de nuestro Servicio que visita, la fecha y hora de su visita, el tiempo que pasa en esas páginas, identificadores únicos de dispositivos, datos de fallos del sistema y otros datos de diagnóstico. Cuando accede al Servicio a través de un dispositivo móvil, podemos recopilar cierta información automáticamente, incluyendo, entre otros, el tipo de dispositivo móvil que utiliza, el ID único de su dispositivo móvil, la dirección IP de su dispositivo móvil, su sistema operativo móvil, el tipo de navegador de Internet móvil que utiliza, identificadores únicos de dispositivo y otros datos de diagnóstico.\u003c/p\u003e\n\n\u003ch3\u003eCookies y Tecnologías de Rastreo\u003c/h3\u003e\n\u003cp\u003eUtilizamos Cookies y tecnologías de rastreo similares (como balizas web, etiquetas y scripts) para rastrear la actividad en nuestro Servicio y almacenar cierta información. Estas tecnologías se utilizan para recopilar y rastrear información y para mejorar y analizar nuestro Servicio. Las tecnologías que utilizamos pueden incluir:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies o Cookies del Navegador:\u003c/strong\u003e Un cookie es un pequeño archivo que se coloca en su Dispositivo. Usted puede instruir a su navegador para que rechace todos los Cookies o para que le indique cuándo se está enviando un Cookie. Sin embargo, si no acepta los Cookies, es posible que no pueda utilizar algunas partes de nuestro Servicio. A menos que haya ajustado la configuración de su navegador para que rechace los Cookies, nuestro Servicio puede utilizarlos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies Flash:\u003c/strong\u003e Ciertas características de nuestro Servicio pueden utilizar objetos almacenados localmente (o Cookies Flash) para recopilar y almacenar información sobre sus preferencias o su actividad en nuestro Servicio. Los Cookies Flash no se gestionan con la misma configuración del navegador que los Cookies del Navegador.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eBalizas Web:\u003c/strong\u003e Ciertas secciones de nuestro Servicio y nuestros correos electrónicos pueden contener pequeños archivos electrónicos conocidos como balizas web (también denominados gifs transparentes, etiquetas de píxeles y gifs de un solo píxel) que permiten a la Empresa, por ejemplo, contar los usuarios que han visitado esas páginas o abierto un correo electrónico y para otras estadísticas relacionadas con el sitio web.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUtilizamos tanto Cookies de sesión como persistentes para los fines que se detallan a continuación:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies Necesarios / Esenciales:\u003c/strong\u003e Estos Cookies son esenciales para proporcionarle los servicios disponibles a través del Sitio Web y para permitirle utilizar algunas de sus funciones. Ayudan a autenticar a los usuarios y a prevenir el uso fraudulento de las cuentas de usuario. Sin estos Cookies, los servicios que ha solicitado no pueden ser proporcionados.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies de Funcionalidad:\u003c/strong\u003e Estos Cookies nos permiten recordar las elecciones que hace cuando utiliza el Sitio Web, como recordar sus datos de inicio de sesión o su preferencia de idioma. El propósito de estos Cookies es proporcionarle una experiencia más personal y evitar que tenga que volver a introducir sus preferencias cada vez que utiliza el Sitio Web.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies de Análisis y Rendimiento:\u003c/strong\u003e Estos Cookies recopilan información sobre el tráfico a nuestro Servicio y cómo los usuarios lo utilizan. La información recopilada no identifica a ningún visitante individual. Incluye el número de visitantes, los sitios web que los remitieron, las páginas visitadas, la hora del día de la visita, etc. Utilizamos esta información para operar nuestro Servicio de manera más eficiente y para monitorear el nivel de actividad.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e4. Uso de Sus Datos Personales\u003c/h2\u003e\n\u003cp\u003eLa Empresa puede utilizar los Datos Personales para los siguientes fines, con base en las bases legales provistas por la LGPD (incluyendo el cumplimiento de un contrato, el consentimiento, el interés legítimo y las obligaciones legales):\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003ePara proporcionar y mantener nuestro Servicio:\u003c/strong\u003e Incluyendo el monitoreo del uso de nuestro Servicio, con base en la ejecución del contrato y nuestro interés legítimo.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara gestionar su Cuenta:\u003c/strong\u003e Para gestionar su registro como usuario del Servicio. Los Datos Personales que proporciona pueden darle acceso a diferentes funcionalidades del Servicio que están disponibles para usted como usuario registrado, con base en la ejecución del contrato.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara la ejecución de un contrato:\u003c/strong\u003e El desarrollo, cumplimiento y ejecución del contrato de compra de los productos, artículos o servicios que ha adquirido o de cualquier otro contrato con Nosotros a través del Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara contactarlo:\u003c/strong\u003e Para contactarlo por correo electrónico, llamadas telefónicas, SMS u otras formas equivalentes de comunicación electrónica, como notificaciones push de una aplicación móvil, sobre actualizaciones o comunicaciones informativas relacionadas con las funcionalidades, productos o servicios contratados, incluidas las actualizaciones de seguridad, cuando sea necesario o razonable para su implementación.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara proporcionarle noticias, ofertas especiales e información general\u003c/strong\u003e sobre otros bienes, servicios y eventos que ofrecemos y que son similares a los que ya ha comprado o sobre los que ha preguntado, a menos que haya optado por no recibir dicha información (basado en el consentimiento o el interés legítimo).\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara gestionar sus solicitudes:\u003c/strong\u003e Para atender y gestionar sus solicitudes hacia nosotros.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara transferencias comerciales:\u003c/strong\u003e Podemos utilizar su información para evaluar o llevar a cabo una fusión, desinversión, reestructuración, reorganización, disolución u otra venta o transferencia de algunos o todos nuestros activos, ya sea como una empresa en funcionamiento o como parte de un procedimiento de quiebra, liquidación o similar, en el que los Datos Personales que tenemos sobre los usuarios de nuestro Servicio se encuentren entre los activos transferidos (basado en nuestro interés legítimo).\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara fines de seguridad y prevención de fraudes:\u003c/strong\u003e Para detectar, prevenir y abordar problemas técnicos, fraudes o problemas de seguridad, con base en nuestro interés legítimo y obligaciones legales.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara cumplir con obligaciones legales y regulatorias:\u003c/strong\u003e Para cumplir con las leyes aplicables, regulaciones, procesos legales o solicitudes gubernamentales exigibles.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara otros fines:\u003c/strong\u003e Podemos utilizar su información para otros fines, como el análisis de datos, la identificación de tendencias de uso, la determinación de la eficacia de nuestras campañas promocionales y para evaluar y mejorar nuestro Servicio, productos, servicios, marketing y su experiencia.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e5. Retención de Sus Datos Personales\u003c/h2\u003e\n\u003cp\u003eLa Empresa retendrá sus Datos Personales solo durante el tiempo que sea estrictamente necesario para los fines establecidos en esta Política de Privacidad. Retendremos y utilizaremos sus Datos Personales en la medida necesaria para cumplir con nuestras obligaciones legales (por ejemplo, si estamos obligados a retener sus datos para cumplir con las leyes aplicables, como las leyes fiscales y contables), resolver disputas y hacer cumplir nuestros acuerdos y políticas legales.\u003c/p\u003e\n\u003cp\u003eLa Empresa también retendrá los Datos de Uso para fines de análisis interno. Los Datos de Uso generalmente se retienen por un período más corto, excepto cuando estos datos se utilizan para fortalecer la seguridad o para mejorar la funcionalidad de nuestro Servicio, o si estamos legalmente obligados a retener estos datos por períodos más largos.\u003c/p\u003e\n\u003cp\u003eUna vez que el propósito del tratamiento haya finalizado y no exista una obligación legal de retención, los datos serán eliminados de forma segura o anonimizados, de acuerdo con las mejores prácticas y las directrices de la LGPD.\u003c/p\u003e\n\n\u003ch2\u003e6. Transferencia de Sus Datos Personales\u003c/h2\u003e\n\u003cp\u003eSu información, incluidos los Datos Personales, se procesa en las oficinas operativas de la Empresa y en cualquier otro lugar donde se encuentren las partes involucradas en el procesamiento. Esto significa que esta información puede ser transferida y mantenida en computadoras ubicadas fuera de su estado, provincia, país u otra jurisdicción gubernamental donde las leyes de protección de datos pueden diferir de las de su jurisdicción.\u003c/p\u003e\n\u003cp\u003eSu consentimiento a esta Política de Privacidad, seguido del envío de dicha información, representa su acuerdo con dicha transferencia.\u003c/p\u003e\n\u003cp\u003eLa Empresa tomará todas las medidas razonablemente necesarias para garantizar que sus datos se traten de forma segura y de acuerdo con esta Política de Privacidad. \u003cstrong\u003eNO SE REALIZARÁ NINGUNA TRANSFERENCIA DE SUS DATOS PERSONALES\u003c/strong\u003e a una organización o país a menos que existan controles adecuados, incluida la seguridad de sus datos y otra información personal.\u003c/p\u003e\n\u003cp\u003eEn cumplimiento con la LGPD, específicamente con la \u003cstrong\u003eResolución CD/ANPD N° 19/2024\u003c/strong\u003e, cualquier transferencia internacional de datos personales se realizará utilizando mecanismos legalmente válidos, como las \u003cstrong\u003eCláusulas Contractuales Estándar (SCCs)\u003c/strong\u003e aprobadas por la ANPD, o cuando el país de destino proporcione un nivel de protección de datos adecuado según lo determine la ANPD. Al utilizar el Servicio, usted reconoce y acepta estas posibles transferencias internacionales bajo dichas salvaguardias.\u003c/p\u003e\n\n\u003ch2\u003e7. Divulgación de Sus Datos Personales\u003c/h2\u003e\n\u003ch3\u003eTransacciones Comerciales\u003c/h3\u003e\n\u003cp\u003eSi la Empresa participa en una fusión, adquisición o venta de activos, sus Datos Personales pueden ser transferidos. Le proporcionaremos un aviso antes de que sus Datos Personales se transfieran y queden sujetos a una Política de Privacidad diferente.\u003c/p\u003e\n\u003ch3\u003eCumplimiento de la Ley\u003c/h3\u003e\n\u003cp\u003eEn determinadas circunstancias, la Empresa puede verse obligada a divulgar sus Datos Personales si así lo exige la ley o en respuesta a solicitudes válidas de autoridades públicas (por ejemplo, un tribunal o una agencia gubernamental). La Empresa evaluará la legalidad de dichas solicitudes y solo cumplirá si la solicitud es legalmente vinculante.\u003c/p\u003e\n\u003ch3\u003eOtros Requisitos Legales\u003c/h3\u003e\n\u003cp\u003eLa Empresa puede divulgar sus Datos Personales de buena fe cuando considere que dicha acción es necesaria para:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eCumplir con una obligación legal.\u003c/li\u003e\n    \u003cli\u003eProteger y defender los derechos o la propiedad de la Empresa.\u003c/li\u003e\n    \u003cli\u003ePrevenir o investigar posibles irregularidades en relación con el Servicio.\u003c/li\u003e\n    \u003cli\u003eProteger la seguridad personal de los usuarios del Servicio o del público.\u003c/li\u003e\n    \u003cli\u003eProtegerse contra la responsabilidad legal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eProveedores de Servicios\u003c/h3\u003e\n\u003cp\u003ePodemos compartir sus Datos Personales con Proveedores de Servicios para monitorear y analizar el uso de nuestro Servicio, para procesar pagos y para contactarlo. Estos proveedores tienen acceso a sus Datos Personales solo para realizar estas tareas en nuestro nombre y están obligados contractualmente a no divulgarlos ni utilizarlos para ningún otro propósito.\u003c/p\u003e\n\n\u003ch2\u003e8. Seguridad de Sus Datos Personales\u003c/h2\u003e\n\u003cp\u003eLa seguridad de sus Datos Personales es de suma importancia para nosotros. Implementamos y mantenemos medidas de seguridad técnicas, administrativas y físicas comercialmente razonables para proteger sus Datos Personales contra el acceso, la divulgación, la alteración o la destrucción no autorizados.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eRENUNCIA DE GARANTÍAS DE SEGURIDAD.\u003c/strong\u003e A PESAR DE NUESTROS ESFUERZOS, NINGÚN SISTEMA DE SEGURIDAD ES IMPENETRABLE. POR LO TANTO, RECUERDE QUE NINGÚN MÉTODO DE TRANSMISIÓN A TRAVÉS DE INTERNET O MÉTODO DE ALMACENAMIENTO ELECTRÓNICO ES 100% SEGURO O ESTÁ LIBRE DE ERRORES. AUNQUE NOS ESFORZAMOS POR UTILIZAR MEDIOS COMERCIALMENTE ACEPTABLES PARA PROTEGER SUS DATOS PERSONALES, \u003cstrong\u003eNO PODEMOS GARANTIZAR NI GARANTIZAMOS SU SEGURIDAD ABSOLUTA.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eASUNCIÓN DE RIESGO.\u003c/strong\u003e USTED ASUME TOTAL RESPONSABILIDAD Y RIESGO POR SU USO DEL SERVICIO Y DE INTERNET. EL SERVICIO Y LA INFORMACIÓN RELACIONADA SE PROPORCIONAN \"TAL CUAL\" Y \"SEGÚN DISPONIBILIDAD\". LA EMPRESA NO SERÁ RESPONSABLE DE NINGÚN DAÑO RESULTANTE DEL USO O LA INCAPACIDAD DE USO DEL SERVICIO, O DE LA INTERCEPCIÓN O ACCESO NO AUTORIZADO A SUS DATOS PERSONALES, INCLUIDOS LOS DAÑOS CAUSADOS POR MALWARE, VIRUS O CUALQUIER INCORRECCIÓN O INCOMPLETITUD DE LA INFORMACIÓN.\u003c/p\u003e\n\n\u003ch2\u003e9. Derechos de Protección de Datos (LGPD)\u003c/h2\u003e\n\u003cp\u003eLa Empresa se compromete a respetar la confidencialidad de sus Datos Personales y a garantizar que pueda ejercer sus derechos. De acuerdo con la Ley General de Protección de Datos de Brasil (LGPD - Ley N° 13.709/2018), usted tiene los siguientes derechos:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eDerecho a la confirmación y acceso:\u003c/strong\u003e El derecho a confirmar la existencia de tratamiento de sus datos y a acceder a sus datos personales que poseemos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerecho de corrección:\u003c/strong\u003e El derecho a solicitar la corrección de datos incompletos, inexactos o desactualizados.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerecho a la anonimización, bloqueo o eliminación:\u003c/strong\u003e El derecho a solicitar la anonimización, el bloqueo o la eliminación de datos innecesarios, excesivos o tratados en disconformidad con lo dispuesto en la LGPD.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerecho a la portabilidad:\u003c/strong\u003e El derecho a solicitar la portabilidad de sus datos a otro proveedor de servicios o productos, previa solicitud expresa y de acuerdo con la reglamentación de la autoridad nacional.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerecho a la eliminación:\u003c/strong\u003e El derecho a solicitar la eliminación de los datos personales tratados con su consentimiento, excepto en los casos previstos por la ley.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerecho a la información:\u003c/strong\u003e El derecho a ser informado sobre las entidades públicas y privadas con las que la Empresa ha compartido sus datos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerecho a la información sobre la posibilidad de no dar consentimiento:\u003c/strong\u003e El derecho a ser informado sobre la posibilidad de no dar su consentimiento y sobre las consecuencias de la negativa.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerecho a la revocación del consentimiento:\u003c/strong\u003e El derecho a revocar su consentimiento en cualquier momento, de forma gratuita y sencilla. La revocación no afecta la legalidad del tratamiento realizado antes de la revocación.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eEjercicio de sus Derechos\u003c/h3\u003e\n\u003cp\u003ePuede ejercer sus derechos de acceso, rectificación, cancelación, oposición, portabilidad y eliminación contactándonos a través de los medios proporcionados en la sección \"Contacto\" de esta política. Para proteger su privacidad y seguridad, podemos tomar medidas para verificar su identidad antes de responder a su solicitud. Responderemos a su solicitud dentro de los plazos legales establecidos por la LGPD.\u003c/p\u003e\n\n\u003ch3\u003eNotificación de Incidentes de Seguridad\u003c/h3\u003e\n\u003cp\u003eEn estricto cumplimiento con la LGPD y sus actualizaciones, en caso de un incidente de seguridad que pueda acarrear un riesgo o daño relevante para Usted, la Empresa se compromete a notificar a la Autoridad Nacional de Protección de Datos (ANPD) y a los titulares de los datos afectados en un plazo de \u003cstrong\u003etres (3) días hábiles\u003c/strong\u003e a partir del conocimiento del incidente. La notificación incluirá la naturaleza de los datos afectados, los riesgos involucrados y las medidas que se están tomando para remediar la situación.\u003c/p\u003e\n\n\u003ch3\u003eDelegado de Protección de Datos (DPO)\u003c/h3\u003e\n\u003cp\u003eLa Empresa ha designado un Delegado de Protección de Datos (Encarregado de Proteção de Dados - DPO) para supervisar el cumplimiento de esta Política de Privacidad y de la LGPD. Si tiene alguna pregunta sobre esta política o sobre cómo tratamos sus datos personales, puede contactar a nuestro DPO a través de nuestro formulario de contacto:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eVisitando esta página en nuestro sitio web: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e10. Limitación de Responsabilidad e Indemnización\u003c/h2\u003e\n\u003ch3\u003eLimitación de Responsabilidad\u003c/h3\u003e\n\u003cp\u003eEN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES SERÁN RESPONSABLES DE NINGÚN DAÑO ESPECIAL, INCIDENTAL, INDIRECTO O CONSECUENTE DE NINGÚN TIPO (INCLUIDOS, ENTRE OTROS, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS U OTRA INFORMACIÓN, INTERRUPCIÓN DEL NEGOCIO, LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD DERIVADA O RELACIONADA DE ALGUNA MANERA CON EL USO O LA IMPOSIBILIDAD DE USO DEL SERVICIO, SOFTWARE DE TERCEROS Y/O HARDWARE DE TERCEROS UTILIZADO CON EL SERVICIO, O DE OTRO MODO EN RELACIÓN CON CUALQUIER DISPOSICIÓN DE ESTA POLÍTICA).\u003c/p\u003e\n\u003cp\u003eLA RESPONSABILIDAD TOTAL DE LA EMPRESA BAJO ESTE ACUERDO, POR CUALQUIER CAUSA Y BAJO CUALQUIER TEORÍA DE RESPONSABILIDAD, NO EXCEDERÁ LA CANTIDAD MAYOR ENTRE: (A) EL IMPORTE TOTAL PAGADO POR USTED POR EL SERVICIO DURANTE LOS DOCE (12) MESES ANTERIORES A LA RECLAMACIÓN; O (B) $20.00 (VEINTE DÓLARES ESTADOUNIDENSES). ESTAS LIMITACIONES SE APLICARÁN INCLUSO SI EL RECURSO ESTABLECIDO ANTERIORMENTE FALLA EN SU PROPÓSITO ESENCIAL.\u003c/p\u003e\n\n\u003ch3\u003eIndemnización\u003c/h3\u003e\n\u003cp\u003eUSTED ACEPTA INDEMNIZAR, DEFENDER Y MANTENER INDEMNE A LA EMPRESA, SUS AFILIADOS, DIRECTORES, EMPLEADOS, AGENTES, LICENCIANTES Y PROVEEDORES DE Y CONTRA TODAS LAS RECLAMACIONES, RESPONSABILIDADES, DAÑOS, SENTENCIAS, COSTOS Y GASTOS (INCLUIDOS LOS HONORARIOS RAZONABLES DE ABOGADOS) QUE SURJAN DE O ESTÉN RELACIONADOS CON: (A) SU USO O MAL USO DEL SERVICIO; (B) CUALQUIER INCUMPLIMIENTO DE ESTA POLÍTICA DE PRIVACIDAD POR SU PARTE; (C) CUALQUIER CONTENIDO QUE PUBLIQUE O TRANSMITA A TRAVÉS DEL SERVICIO; (D) SU VIOLACIÓN DE CUALQUIER LEY, NORMA O REGLAMENTO APLICABLE; O (E) SU VIOLACIÓN DE LOS DERECHOS DE CUALQUIER TERCERO.\u003c/p\u003e\n\n\u003ch2\u003e11. Información sobre Servicios Pagos y Datos de Facturación\u003c/h2\u003e\n\u003ch3\u003eSuscripciones\u003c/h3\u003e\n\u003cp\u003eEl Servicio o algunas partes del Servicio están disponibles únicamente con una Suscripción de pago. Se le facturará por adelantado de forma recurrente y periódica (mensual o anual), dependiendo del tipo de plan de suscripción que seleccione al comprar la Suscripción.\u003c/p\u003e\n\u003cp\u003eAl final de cada período, su Suscripción se renovará automáticamente bajo las mismas condiciones, a menos que usted la cancele o la Empresa la cancele. El pago se procesará a través de un procesador de pagos de terceros.\u003c/p\u003e\n\n\u003ch3\u003eCancelación de la Suscripción\u003c/h3\u003e\n\u003cp\u003eUsted puede cancelar la renovación de su Suscripción a través de la configuración de su Cuenta o contactándonos. No recibirá un reembolso por las tarifas ya pagadas por su período de suscripción actual y podrá acceder al Servicio hasta el final de su período de suscripción actual.\u003c/p\u003e\n\n\u003ch3\u003eCambios de Precios\u003c/h3\u003e\n\u003cp\u003eLa Empresa, a su entera discreción y en cualquier momento, puede modificar las tarifas de Suscripción. Cualquier cambio en la tarifa de Suscripción entrará en vigencia al final del período de Suscripción vigente en ese momento. La Empresa le proporcionará un aviso previo razonable de cualquier cambio en las tarifas de Suscripción para darle la oportunidad de cancelar su Suscripción antes de que dicho cambio entre en vigor.\u003c/p\u003e\n\n\u003ch3\u003eReembolsos\u003c/h3\u003e\n\u003cp\u003eSalvo cuando lo exija la ley, las tarifas de Suscripción pagadas no son reembolsables. Ciertas solicitudes de reembolso para Suscripciones pueden ser consideradas por la Empresa caso por caso y otorgadas a la entera discreción de la Empresa.\u003c/p\u003e\n\n\u003ch3\u003ePrueba Gratuita\u003c/h3\u003e\n\u003cp\u003eLa Empresa puede, a su entera discreción, ofrecer una Suscripción con una prueba gratuita por un período limitado. Es posible que se le solicite que ingrese su información de facturación para registrarse en la prueba gratuita. Si ingresa su información de facturación, no se le cobrará hasta que expire el período de prueba gratuita. En el último día del período de prueba gratuita, a menos que haya cancelado su Suscripción, se le cobrarán automáticamente las tarifas de Suscripción aplicables para el tipo de Suscripción que haya seleccionado.\u003c/p\u003e\n\n\u003ch2\u003e12. Enlaces a Otros Sitios Web\u003c/h2\u003e\n\u003cp\u003eNuestro Servicio puede contener enlaces a otros sitios web que no son operados por Nosotros. Si hace clic en un enlace de un tercero, será dirigido al sitio de ese tercero. Le recomendamos encarecidamente que revise la Política de Privacidad de cada sitio que visite.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eNO TENEMOS CONTROL NI ASUMIMOS RESPONSABILIDAD ALGUNA POR EL CONTENIDO, LAS POLÍTICAS DE PRIVACIDAD O LAS PRÁCTICAS DE CUALQUIER SITIO O SERVICIO DE TERCEROS.\u003c/strong\u003e Usted accede a dichos sitios web de terceros bajo su propio riesgo.\u003c/p\u003e\n\n\u003ch2\u003e13. Cambios a Esta Política de Privacidad\u003c/h2\u003e\n\u003cp\u003eNos reservamos el derecho exclusivo de actualizar o modificar nuestra Política de Privacidad en cualquier momento. Le notificaremos cualquier cambio publicando la nueva Política de Privacidad en esta página. Le informaremos por correo electrónico y/o mediante un aviso destacado en nuestro Servicio, antes de que el cambio entre en vigor, y actualizaremos la fecha de \"Última actualización\" en la parte superior de esta Política de Privacidad.\u003c/p\u003e\n\u003cp\u003eSe le recomienda revisar esta Política de Privacidad periódicamente para ver si hay cambios. Los cambios a esta Política de Privacidad son efectivos cuando se publican en esta página. Su uso continuado del Servicio después de la publicación de los cambios constituye su aceptación de dichos cambios.\u003c/p\u003e\n\n\u003ch2\u003e14. Ley Aplicable y Jurisdicción\u003c/h2\u003e\n\u003cp\u003eEsta Política de Privacidad y su uso del Servicio se regirán e interpretarán de acuerdo con las leyes de la República Federativa de Brasil, sin tener en cuenta sus disposiciones sobre conflictos de leyes.\u003c/p\u003e\n\u003cp\u003eLas partes acuerdan que cualquier disputa, controversia o reclamación que surja de o esté relacionada con esta Política de Privacidad o el tratamiento de sus Datos Personales será sometida a la jurisdicción exclusiva de los tribunales de la ciudad de São Paulo, Estado de São Paulo, Brasil. Por la presente, Usted renuncia irrevocablemente a cualquier objeción a la jurisdicción de dichos tribunales por motivos de lugar o foro no conveniente.\u003c/p\u003e\n\n\u003ch2\u003e15. Contacto\u003c/h2\u003e\n\u003cp\u003eSi tiene alguna pregunta sobre esta Política de Privacidad, el tratamiento de sus datos, o si desea ejercer alguno de sus derechos de protección de datos, puede contactarnos:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eVisitando esta página en nuestro sitio web: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003ePor correo postal a: TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS, ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Política de Privacidad","languageLabel":"Español"},{"documentType":"copyright","language":"ES","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"es\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003ctitle\u003eAviso de Derechos de Autor - TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003ch2\u003eAviso de Derechos de Autor\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eÚltima actualización:\u003c/strong\u003e 1 de octubre de 2026\u003c/p\u003e\n\n\u003cp\u003e\n    Este Aviso de Derechos de Autor (en adelante, el \"Aviso\") rige el uso del software, la aplicación, el sitio web y todos los servicios relacionados (colectivamente, el \"Servicio\") proporcionados por \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, una empresa debidamente constituida bajo las leyes de Brasil, con CNPJ 41.648.990/0001-56 y NIRE 35237097027, con domicilio en ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL (en adelante, \"TIMESAFE\", \"la Compañía\", \"nosotros\", \"nuestro\").\n\u003c/p\u003e\n\n\u003cp\u003e\n    \u003cstrong\u003eACEPTACIÓN VINCULANTE: AL ACCEDER, DESCARGAR, INSTALAR, O DE CUALQUIER OTRA FORMA UTILIZAR EL SERVICIO, USTED (\"USTED\" O \"EL USUARIO\") RECONOCE QUE HA LEÍDO, COMPRENDIDO Y ACEPTA ESTAR LEGALMENTE VINCULADO POR LOS TÉRMINOS Y CONDICIONES ESTABLECIDOS EN ESTE AVISO. SI USTED NO ESTÁ DE ACUERDO CON ESTOS TÉRMINOS EN SU TOTALIDAD, NO DEBE ACCEDER, DESCARGAR NI UTILIZAR EL SERVICIO DE NINGUNA MANERA. EL USO CONTINUADO DEL SERVICIO CONSTITUYE SU ACEPTACIÓN INEQUÍVOCA DE ESTE AVISO Y DE CUALQUIER MODIFICACIÓN FUTURA.\u003c/strong\u003e\n\u003c/p\u003e\n\n\u003cp\u003eCopyright © 2026 TIMESAFE. Todos los derechos reservados.\u003c/p\u003e\n\u003cp\u003e\n    La marca TIMESAFE, la tecnología subyacente, el software, este sitio web y todo su contenido están protegidos por las leyes de derechos de autor, marcas registradas, secretos comerciales y otras leyes de propiedad intelectual de Brasil e internacionales. El Servicio se distribuye bajo licencias que restringen estrictamente su copia, distribución, descompilación y cualquier otro uso no autorizado expresamente en este documento.\n\u003c/p\u003e\n\n\u003ch2\u003eContenido Protegido\u003c/h2\u003e\n\u003cp\u003e\n    Todo derecho, título e interés en y para el Servicio, incluyendo, pero sin limitarse a, todo el contenido, materiales y componentes, son y seguirán siendo propiedad exclusiva de TIMESAFE y sus licenciantes. El término \"Contenido Protegido\" incluye, sin limitación, lo siguiente:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eSoftware:\u003c/strong\u003e Todo el software, tanto en formato de código fuente como de código objeto, relacionado con el Servicio TIMESAFE, incluyendo algoritmos, arquitecturas, estructuras de datos, bibliotecas, scripts, applets y cualquier documentación técnica asociada.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eContenido del Sitio Web y la Aplicación:\u003c/strong\u003e Todos los textos, gráficos, logotipos, iconos de botones, imágenes, fotografías, clips de audio, clips de video, descargas digitales, compilaciones de datos y cualquier otra forma de material o información presentada en o a través del Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDiseño e Interfaz de Usuario:\u003c/strong\u003e El diseño, la estructura, la selección, la coordinación, la expresión, la \"apariencia\" (look and feel) y la disposición de todo el contenido del Servicio. Esto incluye todos los elementos de la interfaz de usuario y la experiencia de usuario (UI/UX).\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDocumentación:\u003c/strong\u003e Toda la documentación, ya sea en formato electrónico o impreso, incluyendo manuales de usuario, guías de instalación, materiales de capacitación, especificaciones técnicas y cualquier otro material de apoyo proporcionado por TIMESAFE.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eMateriales de Marketing y Promocionales:\u003c/strong\u003e Todos los materiales de marketing, promocionales y publicitarios creados por o para TIMESAFE, incluyendo folletos, presentaciones, contenido de redes sociales y campañas publicitarias.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eBases de Datos:\u003c/strong\u003e Cualquier compilación o base de datos, incluyendo la estructura, secuencia y organización de los datos, que sea creada, mantenida o utilizada por el Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSecretos Comerciales:\u003c/strong\u003e Cualquier información confidencial y propietaria de TIMESAFE que no sea de conocimiento público, incluyendo, pero no limitado a, metodologías de negocio, procesos, fórmulas, diseños y know-how técnico.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    Cualquier uso del Contenido Protegido no autorizado expresamente en este documento constituye una violación de los derechos de autor y otros derechos de propiedad intelectual de TIMESAFE y puede estar sujeto a acciones legales civiles y penales.\n\u003c/p\u003e\n\n\u003ch2\u003eUsos Permitidos\u003c/h2\u003e\n\u003cp\u003e\n    Sujeto a su cumplimiento continuo de este Aviso y al pago de todas las tarifas de suscripción aplicables, TIMESAFE le otorga una licencia limitada, personal, no exclusiva, no transferible, no sublicenciable y revocable para acceder y utilizar el Servicio únicamente para sus fines personales o comerciales internos, de acuerdo con la funcionalidad prevista del Servicio.\n\u003c/p\u003e\n\u003ch3\u003eEsta licencia le permite:\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003eAcceder y utilizar el Servicio a través de un navegador web estándar o una aplicación autorizada de TIMESAFE, según corresponda a su plan de suscripción pagado.\u003c/li\u003e\n    \u003cli\u003eDescargar o imprimir copias de extractos de cualquier página o documento disponible a través del Servicio, exclusivamente para su uso personal y no para su redistribución o explotación comercial.\u003c/li\u003e\n    \u003cli\u003eCitar extractos breves y no sustanciales del contenido textual del Servicio (excluyendo software y código) para fines legítimos de crítica, comentario, reportaje de noticias, enseñanza o investigación, siempre y cuando se otorgue una atribución clara y visible a \"TIMESAFE\" como fuente.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    Esta licencia es revocable a la sola discreción de TIMESAFE en cualquier momento, con o sin causa. Tras la terminación de su suscripción o la revocación de esta licencia, debe cesar inmediatamente todo uso del Servicio y destruir cualquier copia del Contenido Protegido en su posesión o control.\n\u003c/p\u003e\n\n\u003ch2\u003eRestricciones\u003c/h2\u003e\n\u003cp\u003e\n    Usted acepta que no realizará, ni intentará realizar, ni permitirá que un tercero realice o intente realizar, ninguna de las siguientes acciones. Estas restricciones son una condición fundamental de la licencia otorgada en este documento.\n\u003c/p\u003e\n\u003ch3\u003eUsted NO PUEDE:\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003eCopiar, reproducir, duplicar, modificar, adaptar, traducir, crear trabajos derivados, distribuir, transmitir, vender, revender, alquilar, arrendar, prestar, sublicenciar o explotar de cualquier otra forma comercial cualquier parte del Servicio o del Contenido Protegido sin el permiso previo, expreso y por escrito de TIMESAFE.\u003c/li\u003e\n    \u003cli\u003eRealizar ingeniería inversa, descompilar, desensamblar o intentar de cualquier otro modo derivar o extraer el código fuente, las ideas subyacentes, los algoritmos, la estructura o la organización del software que forma parte del Servicio.\u003c/li\u003e\n    \u003cli\u003eEliminar, ocultar, alterar o modificar cualquier aviso de propiedad, incluyendo, sin limitación, avisos de derechos de autor, marcas registradas u otros derechos de propiedad, que aparezcan en o dentro del Servicio.\u003c/li\u003e\n    \u003cli\u003eUtilizar el Servicio o cualquier parte del mismo para desarrollar o crear un producto o servicio competitivo.\u003c/li\u003e\n    \u003cli\u003eUtilizar minería de datos, robots, arañas (spiders), raspado de datos (scraping) o métodos similares de recopilación o extracción de datos en conexión con el Servicio.\u003c/li\u003e\n    \u003cli\u003eInterferir o interrumpir el funcionamiento del Servicio o los servidores o redes conectadas al Servicio; o desobedecer cualquier requisito, procedimiento, política o regulación de las redes conectadas al Servicio.\u003c/li\u003e\n    \u003cli\u003eEludir, desactivar o interferir de otro modo con las características de seguridad del Servicio o las características que impiden o restringen el uso o la copia de cualquier Contenido Protegido.\u003c/li\u003e\n    \u003cli\u003eUtilizar el Servicio para cualquier propósito ilegal, fraudulento, malicioso o no autorizado por este Aviso.\u003c/li\u003e\n    \u003cli\u003eUtilizar el Servicio de una manera que pueda dañar, deshabilitar, sobrecargar o perjudicar el Servicio o interferir con el uso y disfrute del Servicio por parte de cualquier otro usuario.\u003c/li\u003e\n    \u003cli\u003ePublicar, cargar o transmitir cualquier contenido que sea ilegal, dañino, amenazante, abusivo, acosador, difamatorio, vulgar, obsceno o que viole los derechos de propiedad intelectual o de privacidad de terceros.\u003c/li\u003e\n    \u003cli\u003eHacerse pasar por cualquier persona o entidad, o declarar falsamente o tergiversar su afiliación con una persona o entidad en relación con el Servicio.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    Cualquier violación de estas restricciones puede resultar en la terminación inmediata de su acceso al Servicio, sin derecho a reembolso, y puede exponerle a una severa responsabilidad civil y penal bajo las leyes aplicables.\n\u003c/p\u003e\n\n\u003ch3\u003eCláusulas de Protección Adicionales\u003c/h3\u003e\n\n\u003ch3\u003eExclusión de Garantías\u003c/h3\u003e\n\u003cp\u003e\n    EL SERVICIO SE PROPORCIONA \"TAL CUAL\" Y \"SEGÚN DISPONIBILIDAD\", SIN GARANTÍAS DE NINGÚN TIPO, YA SEAN EXPRESAS, IMPLÍCITAS, ESTATUTARIAS O DE OTRO TIPO. EN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, TIMESAFE Y SUS AFILIADOS, DIRECTORES, EMPLEADOS, AGENTES, PROVEEDORES Y LICENCIANTES RENUNCIAN EXPRESAMENTE A TODAS LAS GARANTÍAS, INCLUIDAS, ENTRE OTRAS, LAS GARANTÍAS IMPLÍCITAS DE COMERCIABILIDAD, IDONEIDAD PARA UN PROPÓSITO PARTICULAR, TÍTULO Y NO INFRACCIÓN.\n\u003c/p\u003e\n\u003cp\u003e\n    TIMESAFE NO GARANTIZA QUE: (A) EL SERVICIO CUMPLIRÁ CON SUS REQUISITOS O EXPECTATIVAS; (B) EL ACCESO O USO DEL SERVICIO SERÁ ININTERRUMPIDO, PUNTUAL, SEGURO O LIBRE DE ERRORES; (C) LOS RESULTADOS O LA INFORMACIÓN OBTENIDA DEL USO DEL SERVICIO SERÁN PRECISOS, COMPLETOS O CONFIABLES; (D) LA CALIDAD DE CUALQUIER PRODUCTO, SERVICIO, INFORMACIÓN U OTRO MATERIAL ADQUIRIDO U OBTENIDO A TRAVÉS DEL SERVICIO CUMPLIRÁ CON SUS EXPECTATIVAS; O (E) CUALQUIER ERROR EN EL SOFTWARE O EL SERVICIO SERÁ CORREGIDO.\n\u003c/p\u003e\n\u003cp\u003e\n    USTED RECONOCE QUE NINGUNA INFORMACIÓN O ASESORAMIENTO ORAL O ESCRITO PROPORCIONADO POR TIMESAFE O SUS REPRESENTANTES AUTORIZADOS CREARÁ UNA GARANTÍA.\n\u003c/p\u003e\n\n\u003ch3\u003eLimitación de Responsabilidad\u003c/h3\u003e\n\u003cp\u003e\n    EN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO TIMESAFE, SUS AFILIADOS, DIRECTORES, EMPLEADOS, AGENTES, PROVEEDORES O LICENCIANTES SERÁN RESPONSABLES POR CUALQUIER DAÑO ESPECIAL, INCIDENTAL, INDIRECTO, CONSECUENTE, PUNITIVO O EJEMPLAR DE CUALQUIER TIPO (INCLUYENDO, PERO NO LIMITADO A, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS U OTRA INFORMACIÓN, INTERRUPCIÓN DEL NEGOCIO, LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD) QUE SURJA DE O ESTÉ RELACIONADO DE ALGUNA MANERA CON EL USO O LA IMPOSIBILIDAD DE USAR EL SERVICIO, EL SOFTWARE DE TERCEROS Y/O EL HARDWARE DE TERCEROS UTILIZADO CON EL SERVICIO, O DE OTRO MODO EN RELACIÓN CON CUALQUIER DISPOSICIÓN DE ESTE AVISO, INCLUSO SI LA COMPAÑÍA O CUALQUIER PROVEEDOR HA SIDO ADVERTIDO DE LA POSIBILIDAD DE TALES DAÑOS Y AUNQUE EL REMEDIO FALLE EN SU PROPÓSITO ESENCIAL.\n\u003c/p\u003e\n\u003cp\u003e\n    SIN PERJUICIO DE LO ANTERIOR, LA RESPONSABILIDAD TOTAL AGREGADA DE TIMESAFE Y SUS AFILIADOS BAJO ESTE AVISO O EN RELACIÓN CON EL SERVICIO NO EXCEDERÁ LA CANTIDAD MAYOR ENTRE: (A) EL IMPORTE TOTAL PAGADO POR USTED A TIMESAFE POR EL SERVICIO DURANTE EL PERÍODO DE DOCE (12) MESES INMEDIATAMENTE ANTERIOR AL EVENTO QUE DIO LUGAR A LA RECLAMACIÓN; O (B) VEINTE DÓLARES ESTADOUNIDENSES ($20.00 USD). LAS LIMITACIONES ANTERIORES SE APLICARÁN INCLUSO SI EL REMEDIO MENCIONADO ANTERIORMENTE FALLA EN SU PROPÓSITO ESENCIAL.\n\u003c/p\u003e\n\n\u003ch3\u003eAsunción de Riesgo\u003c/h3\u003e\n\u003cp\u003e\n    USTED ASUME LA TOTAL RESPONSABILIDAD Y RIESGO POR SU USO DEL SERVICIO Y DE INTERNET. EL SERVICIO SE PROPORCIONA \"TAL CUAL\". USTED RECONOCE Y ACEPTA QUE CUALQUIER INFORMACIÓN QUE ENVÍE O RECIBA DURANTE SU USO DEL SERVICIO PUEDE NO SER SEGURA Y PUEDE SER INTERCEPTADA POR PARTES NO AUTORIZADAS. TIMESAFE NO SERÁ RESPONSABLE DE NINGÚN DAÑO RESULTANTE DEL USO O LA IMPOSIBILIDAD DE USAR EL SERVICIO, INCLUYENDO DAÑOS CAUSADOS POR MALWARE, VIRUS, CÓDIGO MALICIOSO O CUALQUIER INCORRECCIÓN O INCOMPLETITUD EN EL SOFTWARE O SU CONTENIDO. EL USO DEL SERVICIO ES BAJO SU PROPIO RIESGO Y DISCRECIÓN.\n\u003c/p\u003e\n\n\u003ch3\u003eIndemnización\u003c/h3\u003e\n\u003cp\u003e\n    Usted acepta indemnizar, defender y mantener indemne a TIMESAFE, sus empresas matrices, subsidiarias, afiliadas, funcionarios, directores, empleados, agentes, licenciantes y proveedores de y contra todas las reclamaciones, demandas, acciones, responsabilidades, pérdidas, daños, sentencias, acuerdos, costos y gastos (incluidos los honorarios razonables de abogados) que surjan de o estén relacionados con: (a) su uso o mal uso del Servicio; (b) cualquier incumplimiento de este Aviso por su parte; (c) cualquier contenido que usted publique, envíe o transmita a través del Servicio; (d) su violación de cualquier ley, norma o regulación aplicable; o (e) su violación de los derechos de cualquier tercero, incluidos, entre otros, los derechos de propiedad intelectual, privacidad o publicidad. TIMESAFE se reserva el derecho, a su propio costo, de asumir la defensa y el control exclusivos de cualquier asunto sujeto a indemnización por su parte, en cuyo caso usted cooperará plenamente con TIMESAFE para hacer valer cualquier defensa disponible.\n\u003c/p\u003e\n\n\u003ch2\u003eMarcas Registradas\u003c/h2\u003e\n\u003cp\u003e\n    \"TIMESAFE\", el logotipo de TIMESAFE y cualquier otro nombre de producto o servicio, eslogan o logotipo contenido en el Servicio son marcas comerciales registradas o no registradas de TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS y sus proveedores o licenciantes. Estas marcas no pueden ser copiadas, imitadas o utilizadas, en su totalidad o en parte, sin el permiso previo y por escrito de TIMESAFE o del titular de la marca correspondiente.\n\u003c/p\u003e\n\u003cp\u003e\n    Usted no puede utilizar metaetiquetas ni ningún otro \"texto oculto\" que utilice \"TIMESAFE\" o cualquier otro nombre, marca comercial o nombre de producto o servicio de TIMESAFE sin nuestro permiso previo y por escrito. Todas las demás marcas comerciales, marcas registradas, nombres de productos y nombres de empresas o logotipos mencionados en el Servicio son propiedad de sus respectivos dueños. La referencia a cualquier producto, servicio, proceso u otra información, por nombre comercial, marca registrada, fabricante, proveedor o de otro modo, no constituye ni implica nuestro respaldo, patrocinio o recomendación.\n\u003c/p\u003e\n\n\u003ch2\u003eContenido de Terceros\u003c/h2\u003e\n\u003cp\u003e\n    El Servicio puede contener enlaces a sitios web de terceros, anuncios, servicios, ofertas especiales u otros eventos o actividades que no son propiedad ni están controlados por TIMESAFE. Asimismo, el Servicio puede incorporar o proporcionar acceso a software, contenido o servicios de terceros.\n\u003c/p\u003e\n\u003cp\u003e\n    TIMESAFE no respalda ni asume ninguna responsabilidad por dicho contenido, información, materiales, productos o servicios de terceros. Si usted accede a un sitio web, servicio o contenido de un tercero desde el Servicio, lo hace bajo su propio riesgo, y entiende que este Aviso y la Política de Privacidad de TIMESAFE no se aplican a su uso de dichos sitios o servicios. Usted libera expresamente a TIMESAFE de toda responsabilidad derivada de su uso de cualquier sitio web, servicio o contenido de terceros. El contenido de terceros está sujeto a los términos de derechos de autor y licencias de sus respectivos propietarios.\n\u003c/p\u003e\n\n\u003ch2\u003eNotificación de Infracción de Derechos de Autor\u003c/h2\u003e\n\u003cp\u003e\n    TIMESAFE respeta los derechos de propiedad intelectual de otros y espera que sus usuarios hagan lo mismo. Es nuestra política responder a las notificaciones de presunta infracción de derechos de autor que cumplan con la ley aplicable. Si usted es propietario de derechos de autor, o está autorizado para actuar en nombre de uno, y cree que el trabajo protegido por derechos de autor ha sido copiado de una manera que constituye una infracción de derechos de autor que está ocurriendo a través del Servicio, por favor envíe su reclamación a través de nuestra página de contacto, con el asunto: \"Reclamación de Infracción de Derechos de Autor\".\n\u003c/p\u003e\n\u003cp\u003e\n    Para que su notificación sea válida, debe proporcionar la siguiente información por escrito:\n\u003c/p\u003e\n\u003col\u003e\n    \u003cli\u003eUna firma física o electrónica de la persona autorizada para actuar en nombre del propietario del derecho de autor presuntamente infringido.\u003c/li\u003e\n    \u003cli\u003eUna identificación del trabajo protegido por derechos de autor que usted alega ha sido infringido, o, si varios trabajos protegidos por derechos de autor en un solo sitio en línea están cubiertos por una sola notificación, una lista representativa de dichos trabajos en ese sitio.\u003c/li\u003e\n    \u003cli\u003eIdentificación del material que se alega que infringe o que es objeto de la actividad infractora y que debe ser eliminado o cuyo acceso debe ser deshabilitado, e información razonablemente suficiente para permitirnos localizar el material (por ejemplo, una URL).\u003c/li\u003e\n    \u003cli\u003eSu información de contacto, incluyendo su dirección, número de teléfono y dirección de correo electrónico.\u003c/li\u003e\n    \u003cli\u003eUna declaración de que usted cree de buena fe que el uso del material en la forma reclamada no está autorizado por el propietario de los derechos de autor, su agente o la ley.\u003c/li\u003e\n    \u003cli\u003eUna declaración de que la información en la notificación es precisa y, bajo pena de perjurio, que usted está autorizado para actuar en nombre del propietario de un derecho exclusivo que presuntamente se ha infringido.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\n    Nos reservamos el derecho de eliminar el contenido presuntamente infractor sin previo aviso, a nuestra sola discreción, y sin responsabilidad hacia usted.\n\u003c/p\u003e\n\n\u003ch3\u003eSuscripciones y Pagos\u003c/h3\u003e\n\u003cp\u003eEl Servicio o algunas partes del Servicio están disponibles solo con una Suscripción de pago.\u003c/p\u003e\n\n\u003ch3\u003ePeríodo de Suscripción\u003c/h3\u003e\n\u003cp\u003eUsted será facturado por adelantado de forma recurrente y periódica (mensual o anualmente), dependiendo del tipo de plan de suscripción que seleccione al comprar la Suscripción. Al final de cada período, su Suscripción se renovará automáticamente bajo exactamente las mismas condiciones, a menos que usted la cancele o la Compañía la cancele.\u003c/p\u003e\n\n\u003ch3\u003eCancelación de la Suscripción\u003c/h3\u003e\n\u003cp\u003ePuede cancelar la renovación de su Suscripción a través de la configuración de su cuenta en el Servicio o contactándonos. No recibirá un reembolso por las tarifas ya pagadas por su período de suscripción actual y podrá acceder al Servicio hasta el final de su período de suscripción actual.\u003c/p\u003e\n\n\u003ch3\u003eCambios de Precio\u003c/h3\u003e\n\u003cp\u003eLa Compañía, a su entera discreción y en cualquier momento, puede modificar las tarifas de la Suscripción. Cualquier cambio en la tarifa de la Suscripción entrará en vigor al final del período de Suscripción vigente en ese momento. La Compañía le proporcionará un aviso previo razonable de cualquier cambio en las tarifas de Suscripción para darle la oportunidad de terminar su Suscripción antes de que dicho cambio entre en vigor.\u003c/p\u003e\n\n\u003ch3\u003eReembolsos\u003c/h3\u003e\n\u003cp\u003eSalvo que lo exija la ley, las tarifas de suscripción pagadas no son reembolsables. Ciertas solicitudes de reembolso para Suscripciones pueden ser consideradas por la Compañía caso por caso y otorgadas a la sola discreción de la Compañía.\u003c/p\u003e\n\n\u003ch3\u003ePrueba Gratuita\u003c/h3\u003e\n\u003cp\u003eLa Compañía puede, a su entera discreción, ofrecer una Suscripción con una prueba gratuita por un período de tiempo limitado. Es posible que se le solicite que ingrese su información de facturación para registrarse en la prueba gratuita. Si ingresa su información de facturación al registrarse para una prueba gratuita, no se le cobrará hasta que la prueba gratuita haya expirado. En el último día del período de prueba gratuita, a menos que haya cancelado su Suscripción, se le cobrarán automáticamente las tarifas de Suscripción aplicables para el tipo de Suscripción que haya seleccionado.\u003c/p\u003e\n\n\u003ch3\u003eProtección de Datos y Cumplimiento de la LGPD\u003c/h3\u003e\n\u003cp\u003e\n    TIMESAFE se compromete a proteger la privacidad y la seguridad de los datos de sus usuarios. Este documento y nuestras prácticas cumplen con la Ley General de Protección de Datos de Brasil (LGPD - Ley N° 13.709/2018) y sus regulaciones y actualizaciones complementarias. Al utilizar el Servicio, usted reconoce y acepta nuestra \u003ca href=\"/politica-de-privacidad\"\u003ePolítica de Privacidad\u003c/a\u003e, que se incorpora por referencia a este Aviso.\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eDerechos de los Titulares de Datos:\u003c/strong\u003e De acuerdo con la LGPD, usted tiene derecho a solicitar acceso, corrección, anonimización, bloqueo o eliminación de sus datos personales, la portabilidad de sus datos a otro proveedor de servicios, e información sobre las entidades con las que hemos compartido sus datos. También puede revocar su consentimiento en cualquier momento.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotificación de Incidentes de Seguridad:\u003c/strong\u003e En caso de un incidente de seguridad que pueda acarrear un riesgo o daño relevante para usted, TIMESAFE notificará a la Autoridad Nacional de Protección de Datos (ANPD) y a los titulares de datos afectados dentro de un plazo de tres (3) días hábiles a partir del conocimiento del incidente, de acuerdo con las regulaciones de la ANPD.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eTransferencias Internacionales de Datos:\u003c/strong\u003e Si transferimos sus datos personales fuera de Brasil, nos aseguraremos de que se haga de conformidad con la LGPD, utilizando mecanismos como las Cláusulas Contractuales Tipo aprobadas por la ANPD (según la Resolución CD/ANPD N° 19/2024) u otras salvaguardas legales adecuadas para garantizar un nivel de protección de datos equivalente al proporcionado por la ley brasileña.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDelegado de Protección de Datos (DPO):\u003c/strong\u003e Hemos designado un Delegado de Protección de Datos (DPO) para supervisar nuestro cumplimiento de la LGPD. Puede contactar a nuestro DPO para cualquier pregunta o solicitud relacionada con sus datos personales a través del formulario en nuestra página de contacto.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eDisposiciones Generales\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eLey Aplicable y Jurisdicción:\u003c/strong\u003e Este Aviso se regirá e interpretará de acuerdo con las leyes de la República Federativa de Brasil, sin tener en cuenta sus disposiciones sobre conflicto de leyes. Usted acepta irrevocablemente que cualquier disputa, controversia o reclamación que surja de o esté relacionada con este Aviso o el Servicio será sometida a la jurisdicción exclusiva de los tribunales de la ciudad de São Paulo, Estado de São Paulo, Brasil. Por el presente, usted renuncia a cualquier objeción a la jurisdicción de dichos tribunales.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eModificaciones:\u003c/strong\u003e TIMESAFE se reserva el derecho, a su sola discreción, de modificar o reemplazar este Aviso en cualquier momento. Si una revisión es material, proporcionaremos un aviso con al menos 30 días de antelación antes de que los nuevos términos entren en vigor. Lo que constituye un cambio material será determinado a nuestra sola discreción. Su uso continuado del Servicio después de la publicación de cualquier cambio en este Aviso constituye la aceptación de dichos cambios.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDivisibilidad:\u003c/strong\u003e Si alguna disposición de este Aviso es considerada inválida o inaplicable por un tribunal de jurisdicción competente, las disposiciones restantes de este Aviso permanecerán en pleno vigor y efecto.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eRenuncia:\u003c/strong\u003e Ninguna renuncia a cualquier término de este Aviso se considerará una renuncia adicional o continua de dicho término o de cualquier otro término, y el hecho de que TIMESAFE no haga valer ningún derecho o disposición bajo este Aviso no constituirá una renuncia a dicho derecho o disposición.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAcuerdo Completo:\u003c/strong\u003e Este Aviso, junto con la Política de Privacidad y cualquier otro aviso legal publicado por TIMESAFE en el Servicio, constituirá el acuerdo completo entre usted y TIMESAFE con respecto al Servicio.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eContacto\u003c/h2\u003e\n\u003cp\u003e\n    Para cualquier pregunta sobre este Aviso de Derechos de Autor, para informar de una infracción, o para solicitar permiso para usar el Contenido Protegido de una manera no permitida en este documento, por favor contáctenos visitando esta página en nuestro sitio web:\n\u003c/p\u003e\n\u003cp\u003e\n    \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\n\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003e© 2026 TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS. Todos los derechos reservados.\u003c/strong\u003e\u003c/p\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Derechos de Autor","languageLabel":"Español"},{"documentType":"eula","language":"PT","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"pt-BR\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eContrato de Licença de Usuário Final - TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003eContrato de Licença de Usuário Final (\"Contrato\" ou \"EULA\") para o Aplicativo TIMESAFE\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eÚltima atualização:\u003c/strong\u003e 1 de outubro de 2026\u003c/p\u003e\n\n    \u003cp\u003e\u003cstrong\u003eIMPORTANTE:\u003c/strong\u003e LEIA ESTE CONTRATO DE LICENÇA DE USUÁRIO FINAL CUIDADOSAMENTE ANTES DE CLICAR NO BOTÃO \"EU CONCORDO\", BAIXAR, INSTALAR OU USAR O APLICATIVO \"TIMESAFE\".\u003c/p\u003e\n\n    \u003ch3\u003e1. Interpretação e Definições\u003c/h3\u003e\n\n    \u003ch4\u003eInterpretação\u003c/h4\u003e\n    \u003cp\u003eAs palavras cuja letra inicial é maiúscula têm seus significados definidos sob as seguintes condições. As definições a seguir terão o mesmo significado, independentemente de aparecerem no singular ou no plural.\u003c/p\u003e\n\n    \u003ch4\u003eDefinições\u003c/h4\u003e\n    \u003cp\u003ePara os fins deste Contrato de Licença de Usuário Final:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eContrato\u003c/strong\u003e significa este Contrato de Licença de Usuário Final que constitui o acordo integral e exclusivo entre Você e a Empresa com relação ao uso do Aplicativo.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAplicativo\u003c/strong\u003e refere-se ao programa de software fornecido pela Empresa, baixado por Você, denominado \u003cstrong\u003eTIMESAFE\u003c/strong\u003e.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"a Empresa\", \"Nós\", \"Nosso\" ou \"Nossos\" neste Contrato) refere-se a \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, pessoa jurídica de direito privado, inscrita no CNPJ/ME sob o nº 41.648.990/0001-56, com NIRE 35237097027, com sede na ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eConteúdo\u003c/strong\u003e refere-se a conteúdo como texto, imagens, documentos, dados ou outras informações que podem ser criadas, postadas, carregadas, vinculadas ou de outra forma disponibilizadas por Você por meio do uso do Aplicativo.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePaís\u003c/strong\u003e refere-se à República Federativa do Brasil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e significa qualquer dispositivo eletrônico capaz de acessar e executar o Aplicativo, como um computador, um smartphone ou um tablet digital.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServiços de Terceiros\u003c/strong\u003e significa quaisquer serviços, conteúdo (incluindo dados, informações, aplicativos e outros produtos) ou links fornecidos por um terceiro que possam ser exibidos, incluídos ou disponibilizados pelo Aplicativo.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVocê\u003c/strong\u003e (referido como \"Você\", \"Seu\" ou \"Usuário\") significa o indivíduo que acessa ou usa o Aplicativo ou, quando aplicável, a empresa ou outra entidade legal em nome da qual tal indivíduo está acessando ou usando o Aplicativo.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAfiliadas\u003c/strong\u003e significa uma entidade que controla, é controlada por, ou está sob controle comum com a Empresa, onde \"controle\" significa a posse de 50% ou mais das ações, participações societárias ou outros títulos com direito a voto para a eleição de diretores ou outra autoridade de gestão.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eLGPD\u003c/strong\u003e refere-se à Lei Geral de Proteção de Dados Pessoais (Lei nº 13.709/2018 do Brasil).\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDados Pessoais\u003c/strong\u003e significa qualquer informação relacionada a uma pessoa natural identificada ou identificável.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTitular dos Dados\u003c/strong\u003e significa a pessoa natural a quem os Dados Pessoais se referem.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTratamento\u003c/strong\u003e significa toda operação realizada com Dados Pessoais, como as que se referem a coleta, produção, recepção, classificação, utilização, acesso, reprodução, transmissão, distribuição, processamento, arquivamento, armazenamento, eliminação, avaliação ou controle da informação, modificação, comunicação, transferência, difusão ou extração.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eANPD\u003c/strong\u003e refere-se à Autoridade Nacional de Proteção de Dados do Brasil.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003e2. Reconhecimento\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eAO ACESSAR, BAIXAR, INSTALAR, CLICAR EM \"EU CONCORDO\" OU DE QUALQUER OUTRA FORMA UTILIZAR O APLICATIVO, VOCÊ (A) RECONHECE QUE LEU, COMPREENDEU E CONCORDA EM ESTAR INTEGRALMENTE VINCULADO AOS TERMOS E CONDIÇÕES DESTE CONTRATO; E (B) DECLARA E GARANTE QUE POSSUI CAPACIDADE LEGAL PARA CELEBRAR ESTE CONTRATO, SEJA EM SEU NOME OU EM NOME DA ENTIDADE QUE VOCÊ REPRESENTA.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eSE VOCÊ NÃO CONCORDAR COM A TOTALIDADE DOS TERMOS DESTE CONTRATO, VOCÊ NÃO DEVE BAIXAR, INSTALAR, ACESSAR OU USAR O APLICATIVO, DEVENDO INTERROMPER IMEDIATAMENTE QUALQUER USO E DESINSTALAR TODAS AS CÓPIAS DO APLICATIVO DE SEUS DISPOSITIVOS.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eEste Contrato é um documento legal vinculante entre Você e a Empresa e rege o seu uso do Aplicativo. O uso contínuo do Aplicativo após quaisquer modificações neste Contrato constitui sua aceitação tácita de tais modificações. O Aplicativo é licenciado, e não vendido, a Você pela Empresa para uso estritamente de acordo com os termos deste Contrato.\u003c/p\u003e\n\n    \u003ch3\u003e3. Licença\u003c/h3\u003e\n    \u003cp\u003eA Empresa concede a Você uma licença revogável, não exclusiva, intransferível, pessoal e limitada para baixar, instalar e usar o Aplicativo estritamente de acordo com os termos e condições deste Contrato e para os fins a que se destina.\u003c/p\u003e\n\n    \u003ch3\u003e4. Escopo da Licença\u003c/h3\u003e\n    \u003cp\u003eA licença concedida a Você pela Empresa é exclusivamente para Seus fins pessoais ou comerciais internos, estritamente de acordo com os termos deste Contrato e o plano de assinatura adquirido. Você só pode usar o Aplicativo em um Dispositivo que Você possui ou controla legalmente e conforme permitido pelas regras de uso da plataforma ou loja de aplicativos da qual Você obteve o Aplicativo.\u003c/p\u003e\n\n    \u003ch3\u003e5. Restrições de Licença\u003c/h3\u003e\n    \u003cp\u003eVocê concorda em não praticar e não permitirá que outros pratiquem, direta ou indiretamente, qualquer um dos seguintes atos:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eLicenciar, sublicenciar, vender, alugar, arrendar, ceder, distribuir, transmitir, hospedar, terceirizar, divulgar ou de outra forma explorar comercialmente o Aplicativo ou disponibilizá-lo a terceiros não autorizados.\u003c/li\u003e\n        \u003cli\u003eCopiar, reproduzir ou usar o Aplicativo para qualquer finalidade que não seja a expressamente permitida na seção \"Licença\" acima.\u003c/li\u003e\n        \u003cli\u003eModificar, traduzir, adaptar, fazer trabalhos derivados, desmontar, descriptografar, descompilar ou fazer engenharia reversa de qualquer parte do Aplicativo, incluindo seus códigos-fonte, algoritmos ou estrutura subjacente.\u003c/li\u003e\n        \u003cli\u003eRemover, alterar, ocultar ou desfigurar qualquer aviso de propriedade (incluindo qualquer aviso de direitos autorais ou marca registrada) da Empresa, suas Afiliadas, parceiros, fornecedores ou licenciadores do Aplicativo.\u003c/li\u003e\n        \u003cli\u003eUtilizar o Aplicativo para criar um produto ou serviço concorrente ou que de qualquer forma copie suas características, funcionalidades ou interface.\u003c/li\u003e\n        \u003cli\u003eUtilizar o Aplicativo de forma que viole quaisquer leis, regulamentos, portarias ou regras locais, estaduais, nacionais ou internacionais aplicáveis.\u003c/li\u003e\n        \u003cli\u003eUtilizar o Aplicativo para enviar spam, mensagens não solicitadas ou qualquer forma de comunicação em massa ilegal.\u003c/li\u003e\n        \u003cli\u003eUtilizar o Aplicativo para armazenar ou transmitir material infrator, calunioso, difamatório ou de outra forma ilegal ou ilícito, ou para armazenar ou transmitir material que viole os direitos de privacidade de terceiros.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eQualquer violação destas restrições resultará na rescisão imediata e automática
