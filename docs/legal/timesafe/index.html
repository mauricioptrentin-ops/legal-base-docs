  --muted-foreground:220 9% 46%;
  --accent:217 33% 95%;
  --font-sans:Inter,system-ui,sans-serif;
  font-family:var(--font-sans);
  font-synthesis:none;
  text-rendering:optimizeLegibility
}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{min-width:320px;min-height:100dvh;margin:0;background:hsl(var(--background));color:hsl(var(--foreground));font-family:var(--font-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit}
.dark{
  color-scheme:dark;
  --background:222 47% 6%;
  --foreground:210 40% 98%;
  --border:217 33% 17%;
  --card:222 47% 8%;
  --card-foreground:210 40% 98%;
  --card-border:217 33% 17%;
  --primary:217 91% 60%;
  --primary-foreground:0 0% 100%;
  --muted:217 33% 17%;
  --muted-foreground:215 20% 65%;
  --accent:217 33% 17%
}
.site-header{position:sticky;top:0;z-index:50;border-bottom:1px solid hsl(var(--border));background:hsl(var(--card)/.5);backdrop-filter:blur(8px)}
.header-inner{width:100%;max-width:1152px;min-height:72px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand-cluster,.product-brand,.header-controls{display:flex;align-items:center}
.brand-cluster{min-width:0;gap:24px}
.product-brand{min-width:0;gap:16px}
.brand-logo{width:40px;height:40px;flex:0 0 40px;object-fit:contain}
.brand-fallback{display:grid;place-items:center;border-radius:8px;background:hsl(var(--primary)/.1);color:hsl(var(--primary))}
.brand-fallback-icon{width:20px;height:20px}
.brand-copy{min-width:0}
.brand-copy h1{margin:0;font-size:18px;font-weight:700;line-height:28px;letter-spacing:-.025em}
.brand-copy p{margin:0;color:hsl(var(--muted-foreground));font-size:12px;line-height:16px}
.company-name{display:flex;align-items:center;gap:8px;color:hsl(var(--muted-foreground));font-size:14px;line-height:20px;white-space:nowrap}
.building-icon{width:16px;height:16px;flex:0 0 16px}
.header-controls{flex:0 0 auto;gap:16px}
.language-picker{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid hsl(var(--border));border-radius:8px;background:hsl(var(--card))}
.language-button{min-width:32px;min-height:32px;padding:0 12px;border:1px solid transparent;border-radius:6px;background:transparent;color:hsl(var(--foreground));font-size:12px;font-weight:500;line-height:16px;white-space:nowrap;cursor:pointer}
.language-button:hover{background:hsl(var(--muted))}
.language-button[aria-pressed=true]{border-color:hsl(var(--primary));background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.theme-toggle{position:relative;width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;padding:0;border:1px solid transparent;border-radius:6px;background:transparent;color:hsl(var(--foreground));cursor:pointer}
.theme-toggle:hover{background:hsla(var(--foreground)/.04)}
.theme-toggle svg{position:absolute;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease,opacity .2s ease}
.theme-toggle .sun-icon{opacity:1;transform:rotate(0) scale(1)}
.theme-toggle .moon-icon{opacity:0;transform:rotate(90deg) scale(0)}
.dark .theme-toggle .sun-icon{opacity:0;transform:rotate(-90deg) scale(0)}
.dark .theme-toggle .moon-icon{opacity:1;transform:rotate(0) scale(1)}
.page-shell{width:100%;max-width:1152px;margin:0 auto;padding:32px 24px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:32px}
.document-rail{min-width:0}
.document-rail h2{margin:0 0 16px;color:hsl(var(--muted-foreground));font-size:14px;font-weight:600;line-height:20px;letter-spacing:.05em;text-transform:uppercase}
.document-list{display:grid;gap:8px}
.document-button{width:100%;min-height:44px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid transparent;border-radius:8px;background:hsl(var(--card));color:hsl(var(--card-foreground));text-align:left;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.document-button:hover{background:hsl(var(--muted))}
.document-button[aria-pressed=true]{border-color:hsl(var(--primary));background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.doc-icon{width:20px;height:20px;flex:0 0 20px}
.document-label{flex:1;font-size:14px;font-weight:500;line-height:20px}
.chevron{width:16px;height:16px;flex:0 0 16px}
.document-main{min-width:0}
.document-card{min-height:0;padding:32px;border:1px solid hsl(var(--card-border));border-radius:12px;background:hsl(var(--card));color:hsl(var(--card-foreground));box-shadow:0 2px 4px -1px hsl(0 0% 0%/.08)}
.dark .document-card{box-shadow:0 2px 4px -1px hsl(0 0% 0%/.25)}
.document-heading{display:flex;align-items:center;gap:12px;margin:0 0 24px;padding:0 0 24px;border-bottom:1px solid hsl(var(--border))}
.active-icon{display:grid;place-items:center;width:24px;height:24px;flex:0 0 24px;color:hsl(var(--primary))}
.active-icon .doc-icon{width:24px;height:24px}
.document-heading h1{margin:0;font-size:24px;font-weight:700;line-height:32px;letter-spacing:-.025em}
.document-heading p{margin:4px 0 0;color:hsl(var(--muted-foreground));font-size:14px;line-height:20px}
.legal-prose{max-width:none;overflow-wrap:anywhere;font-size:16px;line-height:1.625}
.legal-prose h1{margin:32px 0 24px;font-size:24px;font-weight:700;line-height:1.33;letter-spacing:-.025em}
.legal-prose h2{margin:24px 0 16px;font-size:20px;font-weight:600;line-height:1.4;letter-spacing:-.025em}
.legal-prose h3{margin:16px 0 12px;font-size:18px;font-weight:600;line-height:1.5;letter-spacing:-.025em}
.legal-prose h4,.legal-prose h5,.legal-prose h6{margin:16px 0 12px;font-size:16px;font-weight:600;line-height:1.5}
.legal-prose p{margin:1.25em 0 16px}
.legal-prose ul,.legal-prose ol{margin:1.25em 0 16px;padding-left:24px}
.legal-prose li{margin:8px 0}
.legal-prose blockquote{margin:1.25em 0;padding:2px 16px;border-left:4px solid hsl(var(--border));color:hsl(var(--muted-foreground))}
.legal-prose a{color:hsl(var(--primary));text-decoration:underline}
.legal-prose strong,.legal-prose b{font-weight:700}
.legal-prose hr{height:1px;margin:24px 0;border:0;background:hsl(var(--border))}
.legal-prose pre,.legal-prose code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.legal-prose code{padding:.1em .3em;border-radius:4px;background:hsl(var(--muted))}
.legal-prose pre{overflow:auto;padding:16px;border-radius:8px;background:hsl(var(--muted));font-size:14px}
.legal-prose pre code{padding:0;background:none}
.legal-prose table{width:100%;margin:16px 0;border-collapse:collapse}
.legal-prose th,.legal-prose td{padding:8px 12px;border:1px solid hsl(var(--border));text-align:left;vertical-align:top}
.legal-prose th{background:hsl(var(--muted));font-weight:600}
.site-footer{margin-top:48px;border-top:1px solid hsl(var(--border))}
.footer-inner{width:100%;max-width:1152px;margin:0 auto;padding:32px 24px;color:hsl(var(--muted-foreground));text-align:center;font-size:12px;line-height:16px}
.footer-inner p{margin:8px 0 0}
.footer-inner p:first-child{margin-top:0}
.company-registration{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.empty-documents{padding:48px 0;color:hsl(var(--muted-foreground));text-align:center}
button:focus-visible{outline:2px solid hsl(var(--primary));outline-offset:2px}
@media(min-width:1024px){.layout{grid-template-columns:280px minmax(0,1fr)}}
@media(max-width:767px){
  .company-name{display:none}
  .header-inner{flex-wrap:wrap;row-gap:12px}
  .header-controls{margin-left:auto}
  .page-shell{padding-top:32px}
}
@media(max-width:480px){
  .brand-cluster{flex:1}
  .header-controls{width:100%;justify-content:space-between;gap:8px}
  .language-picker{gap:2px}
  .document-card{padding:32px}
}
@media print{
  .site-header{position:static}
  .header-controls,.document-rail,.site-footer{display:none}
  .page-shell{width:100%;padding:0}
  .layout{display:block}
  .document-card{border:0;box-shadow:none}
}

<script type="application/json" id="documents">[{"documentType":"privacy_consent","language":"PT","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"pt-BR\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003ctitle\u003ePolítica de Cookies e Consentimento de Privacidade - TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003ch1\u003ePolítica de Cookies e Consentimento de Privacidade\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003eÚltima atualização: 1 de outubro de 2026\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eEsta Política de Cookies e Consentimento de Privacidade (\"Política\") descreve como a \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, pessoa jurídica de direito privado, inscrita no CNPJ/ME sob o nº 41.648.990/0001-56, com sede na ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL (doravante referida como \"Empresa\", \"TIMESAFE\", \"Nós\", \"Nos\" ou \"Nossos\"), utiliza cookies e tecnologias similares para coletar e armazenar informações quando Você visita nosso site ou utiliza nossos serviços (\"Serviço\").\u003c/p\u003e\n\n\u003cp\u003eEsta política deve ser lida em conjunto com nossa Política de Privacidade e nossos Termos de Serviço. Ao acessar, navegar ou utilizar nosso site e serviços, Você reconhece que leu, compreendeu e concorda em ficar vinculado aos termos aqui descritos. A sua aceitação é condição indispensável para a utilização do nosso site.\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eAO ACESSAR, BAIXAR, INSTALAR OU USAR O SERVIÇO, VOCÊ RECONHECE QUE LEU, ENTENDEU E CONCORDA EM FICAR VINCULADO A ESTA POLÍTICA DE COOKIES E CONSENTE COM O PROCESSAMENTO DE SEUS DADOS CONFORME AQUI DESCRITO. SE VOCÊ NÃO CONCORDAR COM ESTA POLÍTICA EM SUA TOTALIDADE, VOCÊ NÃO DEVE ACESSAR OU UTILIZAR O SERVIÇO. O USO CONTINUADO DO SERVIÇO APÓS QUAISQUER MODIFICAÇÕES NESTA POLÍTICA CONSTITUI SUA ACEITAÇÃO TÁCITA E VINCULATIVA DE TAIS MODIFICAÇÕES.\u003c/strong\u003e\u003c/p\u003e\n\n\u003ch2\u003e1. Interpretação e Definições\u003c/h2\u003e\n\n\u003ch3\u003e1.1. Interpretação\u003c/h3\u003e\n\u003cp\u003eOs termos cujas letras iniciais são maiúsculas têm seus significados definidos nas condições a seguir. As seguintes definições terão o mesmo significado, independentemente de aparecerem no singular ou no plural. A linguagem utilizada nesta Política será interpretada de acordo com seu significado justo e não estritamente a favor ou contra qualquer uma das partes.\u003c/p\u003e\n\n\u003ch3\u003e1.2. Definições\u003c/h3\u003e\n\u003cp\u003ePara os fins desta Política de Cookies:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e: Refere-se a TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS, com endereço em ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eControlador de Dados\u003c/strong\u003e: Para os fins da LGPD, a Empresa é o Controlador dos Dados Pessoais coletados através do Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e: Pequenos arquivos de texto que são colocados em seu computador, dispositivo móvel ou qualquer outro dispositivo por um site, contendo detalhes do seu histórico de navegação nesse site entre seus vários usos. Eles são essenciais para o funcionamento da internet moderna.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDados Pessoais\u003c/strong\u003e: Qualquer informação relacionada a uma pessoa natural identificada ou identificável (\"Titular dos Dados\"), conforme definido pela LGPD.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e: Qualquer aparelho que possa acessar o Serviço, como um computador, um celular ou um tablet digital.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eLGPD\u003c/strong\u003e: Lei Geral de Proteção de Dados Pessoais (Lei Federal nº 13.709/2018).\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD\u003c/strong\u003e: Autoridade Nacional de Proteção de Dados, órgão da administração pública federal responsável por zelar, implementar e fiscalizar o cumprimento da LGPD em todo o território nacional.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServiço\u003c/strong\u003e: Refere-se ao software, aplicativo e site do TIMESAFE, acessíveis através de seus domínios e subdomínios oficiais, incluindo o portal de contato em \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVocê/Usuário\u003c/strong\u003e: A pessoa física que acessa ou utiliza o Serviço, ou a pessoa jurídica em nome da qual tal pessoa física está acessando ou utilizando o Serviço, conforme aplicável.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eTerceiros\u003c/strong\u003e: Parceiros, prestadores de serviços, anunciantes ou qualquer outra entidade que não seja Você ou a Empresa.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e2. O Uso dos Cookies\u003c/h2\u003e\n\u003cp\u003eUtilizamos cookies e tecnologias de rastreamento similares (como web beacons, tags e scripts) para coletar e rastrear informações sobre sua atividade em nosso Serviço e reter certas informações. O objetivo principal do uso de cookies é aprimorar e otimizar a sua experiência de navegação, garantir a segurança e o funcionamento adequado de nossos sistemas, e nos permitir analisar o desempenho do Serviço para melhorias contínuas.\u003c/p\u003e\n\u003cp\u003eOs cookies permitem que o Serviço \"lembre\" de suas ações e preferências (como login, idioma, tamanho da fonte e outras preferências de exibição) por um período de tempo, para que você não precise reinseri-las sempre que retornar ao site ou navegar de uma página para outra. Eles também são cruciais para funcionalidades de segurança, análise de tráfego e personalização de conteúdo.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eNÃO ARMAZENAMOS INFORMAÇÕES PESSOAIS SENSÍVEIS\u003c/strong\u003e, como senhas completas, dados de cartão de crédito ou endereços residenciais completos, nos cookies que utilizamos. As informações pessoais que armazenamos sobre Você podem estar vinculadas às informações armazenadas e obtidas a partir dos cookies, sempre em conformidade com nossa Política de Privacidade e a legislação aplicável.\u003c/p\u003e\n\n\u003ch2\u003e3. Tipos de Cookies Utilizados\u003c/h2\u003e\n\u003cp\u003eOs cookies podem ser classificados como \"Persistentes\" ou \"de Sessão\". Cookies Persistentes permanecem em seu dispositivo pessoal mesmo quando você fica offline, até que expirem ou sejam excluídos por você. Cookies de Sessão são excluídos assim que você fecha o navegador.\u003c/p\u003e\n\u003cp\u003eUtilizamos uma combinação de cookies próprios (first-party) e de terceiros (third-party) para diversas finalidades, conforme detalhado abaixo.\u003c/p\u003e\n\n\u003ch3\u003e3.1. Cookies Essenciais (ou Estritamente Necessários)\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies de Sessão e Persistentes\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Nós (TIMESAFE)\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eFinalidade:\u003c/strong\u003e Estes cookies são indispensáveis para o funcionamento do Serviço e não podem ser desativados em nossos sistemas. Eles são geralmente configurados em resposta a ações feitas por Você que equivalem a uma solicitação de serviços, como definir suas preferências de privacidade, fazer login ou preencher formulários. Eles são cruciais para:\n        \u003cul\u003e\n            \u003cli\u003eAutenticar usuários e prevenir o uso fraudulento de contas de usuário.\u003c/li\u003e\n            \u003cli\u003eManter a sua sessão ativa enquanto você navega entre as páginas.\u003c/li\u003e\n            \u003cli\u003eGarantir a segurança do site e dos dados transmitidos.\u003c/li\u003e\n            \u003cli\u003eFornecer os serviços que Você solicitou, como o acesso a áreas seguras do site.\u003c/li\u003e\n        \u003c/ul\u003e\n    \u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eConsentimento:\u003c/strong\u003e De acordo com a LGPD, estes cookies não exigem seu consentimento prévio, pois são essenciais para a execução do contrato entre Você e a Empresa e para o cumprimento de obrigações legais. No entanto, os listamos aqui para sua total transparência.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003e3.2. Cookies de Funcionalidade\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies Persistentes\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Nós (TIMESAFE)\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eFinalidade:\u003c/strong\u003e Estes cookies permitem que o Serviço se lembre das escolhas que Você faz para proporcionar uma experiência mais personalizada e conveniente. Sua finalidade é evitar que Você tenha que reinserir suas preferências a cada visita. Exemplos de uso incluem:\n        \u003cul\u003e\n            \u003cli\u003eLembrar seus detalhes de login ou nome de usuário.\u003c/li\u003e\n            \u003cli\u003eMemorizar sua preferência de idioma ou região.\u003c/li\u003e\n            \u003cli\u003eGuardar configurações de interface que Você personalizou (ex: tamanho do texto).\u003c/li\u003e\n        \u003c/ul\u003e\n    \u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eConsentimento:\u003c/strong\u003e O uso destes cookies está sujeito ao seu consentimento, que pode ser gerenciado através do nosso banner de consentimento de cookies ou das configurações do seu navegador.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003e3.3. Cookies de Rastreamento e Desempenho (Análise)\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies Persistentes\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Terceiros (ex: Google Analytics, Hotjar)\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eFinalidade:\u003c/strong\u003e Estes cookies são utilizados para coletar informações sobre como os visitantes interagem com nosso Serviço. As informações coletadas são agregadas e, na medida do possível, anônimas. Eles nos ajudam a:\n        \u003cul\u003e\n            \u003cli\u003eEntender o tráfego do site, as páginas mais visitadas e as fontes de tráfego.\u003c/li\u003e\n            \u003cli\u003eIdentificar gargalos de desempenho e áreas para melhoria.\u003c/li\u003e\n            \u003cli\u003eAnalisar a eficácia de nossas campanhas de marketing.\u003c/li\u003e\n            \u003cli\u003eMonitorar a saúde e o desempenho técnico do Serviço.\u003c/li\u003e\n        \u003c/ul\u003e\n    \u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eResponsabilidade de Terceiros:\u003c/strong\u003e As informações coletadas por meio desses cookies podem identificar Você, direta ou indiretamente, como um visitante individual. Esses cookies são gerenciados por provedores de serviços terceirizados, e o uso dos dados coletados por eles é regido por suas próprias políticas de privacidade. A EMPRESA SE ISENTA DE QUALQUER RESPONSABILIDADE PELAS PRÁTICAS DE PRIVACIDADE OU CONTEÚDO DESSES SERVIÇOS DE TERCEIROS.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eConsentimento:\u003c/strong\u003e O uso destes cookies está sujeito ao seu consentimento explícito.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003e3.4. Cookies de Publicidade e Segmentação\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies Persistentes\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Terceiros (ex: Google Ads, Meta/Facebook, LinkedIn Ads)\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eFinalidade:\u003c/strong\u003e Estes cookies são usados para rastrear seus hábitos de navegação em nosso site e em outros sites para construir um perfil de seus interesses. Esse perfil é usado para exibir publicidade que seja mais relevante para Você em outras plataformas (retargeting). Eles podem ser usados por empresas de publicidade para:\n        \u003cul\u003e\n            \u003cli\u003eLimitar o número de vezes que Você vê um anúncio.\u003c/li\u003e\n            \u003cli\u003eMedir a eficácia de uma campanha publicitária.\u003c/li\u003e\n            \u003cli\u003eMostrar anúncios de produtos ou serviços da TIMESAFE em outros sites que Você visita.\u003c/li\u003e\n        \u003c/ul\u003e\n    \u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eResponsabilidade de Terceiros:\u003c/strong\u003e Estes cookies são colocados por redes de publicidade de terceiros com nossa permissão. A EMPRESA NÃO TEM CONTROLE SOBRE ESSES COOKIES DE TERCEIROS E NÃO É RESPONSÁVEL PELAS POLÍTICAS OU PRÁTICAS DESSAS EMPRESAS. Recomendamos que você leia as políticas de privacidade desses parceiros.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eConsentimento:\u003c/strong\u003e O uso destes cookies está sujeito ao seu consentimento explícito.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e4. Suas Escolhas e Gerenciamento de Cookies\u003c/h2\u003e\n\u003cp\u003eVocê tem o controle sobre o uso de cookies. Ao visitar nosso site pela primeira vez, será apresentado um banner de consentimento de cookies, permitindo que Você aceite todos os cookies, rejeite cookies não essenciais ou personalize suas preferências.\u003c/p\u003e\n\u003cp\u003eSe preferir evitar o uso de cookies não essenciais a qualquer momento, Você pode seguir os passos abaixo:\u003c/p\u003e\n\u003col\u003e\n    \u003cli\u003e\u003cstrong\u003eAjuste suas preferências em nosso site:\u003c/strong\u003e Você pode alterar seu consentimento a qualquer momento através do nosso centro de preferências de privacidade (geralmente acessível através de um link no rodapé do site).\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDesative os cookies em seu navegador:\u003c/strong\u003e Você pode instruir seu navegador a recusar todos os cookies ou a indicar quando um cookie está sendo enviado. No entanto, se Você não aceitar os cookies, especialmente os essenciais, \u003cstrong\u003eVOCÊ PODERÁ EXPERIMENTAR INCONVENIENTES NO USO DO SERVIÇO, E ALGUNS RECURSOS PODEM NÃO FUNCIONAR CORRETAMENTE.\u003c/strong\u003e A experiência pode ser degradada e funcionalidades essenciais, como o login, podem ser desativadas.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003ch3\u003eComo gerenciar cookies nos principais navegadores:\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eGoogle Chrome:\u003c/strong\u003e \u003ca href=\"https://support.google.com/accounts/answer/61416\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://support.google.com/accounts/answer/61416\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eMozilla Firefox:\u003c/strong\u003e \u003ca href=\"https://support.mozilla.org/pt-BR/kb/impeca-que-sites-armazenem-cookies-e-dados-no-fir\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://support.mozilla.org/pt-BR/kb/impeca-que-sites-armazenem-cookies-e-dados-no-fir\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eMicrosoft Edge:\u003c/strong\u003e \u003ca href=\"https://support.microsoft.com/pt-br/microsoft-edge/excluir-cookies-no-microsoft-edge-63947406-40ac-c3b8-57b9-2a946a29ae09\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://support.microsoft.com/pt-br/microsoft-edge/excluir-cookies-no-microsoft-edge-63947406-40ac-c3b8-57b9-2a946a29ae09\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eApple Safari:\u003c/strong\u003e \u003ca href=\"https://support.apple.com/pt-br/guide/safari/sfri11471/mac\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://support.apple.com/pt-br/guide/safari/sfri11471/mac\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePara outros navegadores, consulte a documentação de ajuda do respectivo desenvolvedor.\u003c/p\u003e\n\n\u003ch2\u003e5. Conteúdo Incorporado e Links para Terceiros\u003c/h2\u003e\n\u003cp\u003eO Serviço pode conter links para outros sites que não são operados por Nós, bem como conteúdo incorporado (por exemplo, vídeos do YouTube, mapas do Google, artigos, imagens, etc.). O conteúdo incorporado de outros sites se comporta exatamente da mesma maneira como se o visitante tivesse visitado o outro site.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSE VOCÊ CLICAR EM UM LINK DE TERCEIROS OU INTERAGIR COM CONTEÚDO INCORPORADO, VOCÊ SERÁ DIRECIONADO PARA O SITE DESSE TERCEIRO. ESSES SITES PODEM COLETAR DADOS SOBRE VOCÊ, USAR SEUS PRÓPRIOS COOKIES, INCORPORAR RASTREAMENTO ADICIONAL DE TERCEIROS E MONITORAR SUA INTERAÇÃO COM ESSE CONTEÚDO.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eA EMPRESA NÃO TEM CONTROLE E NÃO ASSUME RESPONSABILIDADE PELO CONTEÚDO, POLÍTICAS DE PRIVACIDADE OU PRÁTICAS DE QUAISQUER SITES OU SERVIÇOS DE TERCEIROS. A INCLUSÃO DE TAIS LINKS OU CONTEÚDO NÃO IMPLICA EM ENDOSSO POR PARTE DA EMPRESA. VOCÊ ASSUME TOTAL RESPONSABILIDADE E RISCO PELO USO DE SITES E SERVIÇOS DE TERCEIROS.\u003c/p\u003e\n\n\u003ch2\u003e6. Conformidade com a Lei Geral de Proteção de Dados (LGPD)\u003c/h2\u003e\n\u003cp\u003eA TIMESAFE está comprometida com a proteção de seus dados pessoais e em total conformidade com a Lei nº 13.709/2018 (LGPD) e regulamentações subsequentes da ANPD.\u003c/p\u003e\n\n\u003ch3\u003e6.1. Direitos do Titular dos Dados\u003c/h3\u003e\n\u003cp\u003eComo titular dos dados, Você possui os seguintes direitos, que podem ser exercidos a qualquer momento mediante solicitação:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eConfirmação da existência de tratamento:\u003c/strong\u003e Saber se tratamos seus dados pessoais.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAcesso aos dados:\u003c/strong\u003e Obter uma cópia dos dados pessoais que temos sobre você.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCorreção de dados:\u003c/strong\u003e Solicitar a correção de dados incompletos, inexatos ou desatualizados.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAnonimização, bloqueio ou eliminação:\u003c/strong\u003e Solicitar a anonimização, bloqueio ou eliminação de dados desnecessários, excessivos ou tratados em desconformidade com a LGPD.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePortabilidade dos dados:\u003c/strong\u003e Solicitar a transferência de seus dados para outro fornecedor de serviço ou produto.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEliminação dos dados tratados com consentimento:\u003c/strong\u003e Solicitar a exclusão de seus dados pessoais cujo tratamento foi baseado no seu consentimento.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eInformação sobre compartilhamento:\u003c/strong\u003e Ser informado sobre as entidades públicas e privadas com as quais o controlador realizou uso compartilhado de dados.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eInformação sobre a possibilidade de não fornecer consentimento:\u003c/strong\u003e Ser informado sobre as consequências da negativa em fornecer seu consentimento.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eRevogação do consentimento:\u003c/strong\u003e Revogar seu consentimento a qualquer momento. A revogação não afeta a legalidade do tratamento realizado antes da sua retirada.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePara exercer qualquer um desses direitos, entre em contato conosco através do nosso canal oficial: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e. Sua solicitação será analisada e respondida nos prazos legais.\u003c/p\u003e\n\n\u003ch3\u003e6.2. Transferência Internacional de Dados\u003c/h3\u003e\n\u003cp\u003eAlguns de nossos parceiros e prestadores de serviços (especialmente para cookies de análise e publicidade, como Google e Meta) podem estar localizados fora do Brasil. Portanto, os dados coletados através de cookies podem ser transferidos internacionalmente.\u003c/p\u003e\n\u003cp\u003eA EMPRESA garante que tais transferências são realizadas em estrita conformidade com a LGPD e as regulamentações da ANPD, especialmente a \u003cstrong\u003eResolução CD/ANPD nº 19, de 23 de novembro de 2023\u003c/strong\u003e. As transferências são baseadas em mecanismos adequados, como as Cláusulas Contratuais Padrão (Standard Contractual Clauses - SCCs) aprovadas pela ANPD, ou em outras salvaguardas que garantam um nível de proteção de dados equivalente ao exigido pela legislação brasileira.\u003c/p\u003e\n\n\u003ch3\u003e6.3. Notificação de Incidentes de Segurança\u003c/h3\u003e\n\u003cp\u003eEm caso de um incidente de segurança que possa acarretar risco ou dano relevante aos titulares de dados, a TIMESAFE se compromete a comunicar a Autoridade Nacional de Proteção de Dados (ANPD) e os titulares afetados em um prazo razoável, em conformidade com o Art. 48 da LGPD, que estabelece o prazo de \u003cstrong\u003e3 (três) dias úteis\u003c/strong\u003e, a contar da data do conhecimento do incidente, para a comunicação à ANPD.\u003c/p\u003e\n\n\u003ch3\u003e6.4. Encarregado pela Proteção de Dados (DPO)\u003c/h3\u003e\n\u003cp\u003eA TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS nomeou um Encarregado pela Proteção de Dados (DPO) para supervisionar questões relacionadas a esta Política de Cookies e à Política de Privacidade. Se você tiver quaisquer perguntas ou preocupações sobre nossas práticas de privacidade, entre em contato com nosso DPO através do formulário disponível em nossa página de contato: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch2\u003e7. Isenção de Garantias e Limitação de Responsabilidade\u003c/h2\u003e\n\n\u003ch3\u003e7.1. Isenção de Garantias\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eO SERVIÇO E TODAS AS INFORMAÇÕES, CONTEÚDOS, MATERIAIS, PRODUTOS (INCLUINDO SOFTWARE) E OUTROS SERVIÇOS INCLUÍDOS OU DE OUTRA FORMA DISPONIBILIZADOS A VOCÊ ATRAVÉS DO SERVIÇO SÃO FORNECIDOS PELA EMPRESA \"COMO ESTÃO\" (\"AS IS\") E \"CONFORME DISPONÍVEIS\" (\"AS AVAILABLE\"), SEM GARANTIAS DE QUALQUER TIPO, EXPRESSAS, IMPLÍCITAS OU LEGAIS.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, A EMPRESA SE ISENTA DE TODAS AS GARANTIAS, EXPRESSAS OU IMPLÍCITAS, INCLUINDO, MAS NÃO SE LIMITANDO A, GARANTIAS IMPLÍCITAS DE COMERCIALIZAÇÃO, ADEQUAÇÃO A UM FIM ESPECÍFICO, NÃO VIOLAÇÃO, TÍTULO, USO PACÍFICO, E AQUELAS DECORRENTES DE NEGOCIAÇÃO OU USO COMERCIAL. A EMPRESA NÃO GARANTE QUE O SERVIÇO SERÁ ININTERRUPTO, OPORTUNO, SEGURO, LIVRE DE ERROS, VÍRUS OU OUTROS COMPONENTES PREJUDICIAIS, OU QUE OS RESULTADOS OBTIDOS COM O USO DO SERVIÇO SERÃO PRECISOS OU CONFIÁVEIS.\u003c/strong\u003e\u003c/p\u003e\n\n\u003ch3\u003e7.2. Limitação de Responsabilidade\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, EM NENHUM CASO A EMPRESA, SUAS AFILIADAS, DIRETORES, FUNCIONÁRIOS, AGENTES, FORNECEDORES OU LICENCIADORES SERÃO RESPONSÁVEIS POR QUAISQUER DANOS INDIRETOS, PUNITIVOS, INCIDENTAIS, ESPECIAIS, CONSEQUENCIAIS OU EXEMPLARES, INCLUINDO, SEM LIMITAÇÃO, DANOS POR PERDA DE LUCROS, DADOS, USO, FUNDO DE COMÉRCIO OU OUTRAS PERDAS INTANGÍVEIS, DECORRENTES DE OU RELACIONADOS AO USO OU INCAPACIDADE DE USAR O SERVIÇO; AO USO DE COOKIES DE TERCEIROS; AO ACESSO NÃO AUTORIZADO OU ALTERAÇÃO DE SUAS TRANSMISSÕES OU DADOS; OU A QUALQUER OUTRO ASSUNTO RELACIONADO AO SERVIÇO.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eA RESPONSABILIDADE TOTAL E AGREGADA DA EMPRESA E SUAS AFILIADAS SOB ESTA POLÍTICA E PELO USO DO SERVIÇO, INDEPENDENTEMENTE DA FORMA DA AÇÃO, ESTARÁ LIMITADA AO MAIOR VALOR ENTRE: (A) O MONTANTE TOTAL PAGO POR VOCÊ À EMPRESA PELO SERVIÇO NOS DOZE (12) MESES ANTERIORES AO EVENTO QUE DEU ORIGEM À RECLAMAÇÃO; OU (B) R$ 100,00 (CEM REAIS). AS LIMITAÇÕES DESTA SUBSEÇÃO SE APLICARÃO A QUALQUER TEORIA DE RESPONSABILIDADE, SEJA BASEADA EM GARANTIA, CONTRATO, ESTATUTO, DELITO (INCLUINDO NEGLIGÊNCIA) OU OUTRA, MESMO QUE UMA DAS PARTES TENHA SIDO AVISADA DA POSSIBILIDADE DE TAIS DANOS.\u003c/strong\u003e\u003c/p\u003e\n\n\u003ch2\u003e8. Indenização\u003c/h2\u003e\n\u003cp\u003eVocê concorda em defender, indenizar e isentar a Empresa, suas afiliadas, diretores, funcionários e agentes de e contra todas e quaisquer reivindicações, danos, obrigações, perdas, responsabilidades, custos ou dívidas e despesas (incluindo, mas não se limitando a, honorários advocatícios razoáveis) decorrentes de: (i) seu uso e acesso ao Serviço; (ii) sua violação de qualquer termo desta Política de Cookies; (iii) sua violação de qualquer direito de terceiros, incluindo, sem limitação, qualquer direito de privacidade ou propriedade intelectual; ou (iv) sua violação de qualquer lei, regra ou regulamento aplicável. Esta obrigação de defesa e indenização sobreviverá à rescisão desta Política e ao seu uso do Serviço.\u003c/p\u003e\n\n\u003ch2\u003e9. Lei Aplicável e Jurisdição\u003c/h2\u003e\n\u003cp\u003eEsta Política será regida e interpretada de acordo com as leis da República Federativa do Brasil, sem levar em conta suas disposições sobre conflito de leis.\u003c/p\u003e\n\u003cp\u003eFica eleito, com exclusão de qualquer outro, por mais privilegiado que seja, o foro da Comarca de São Paulo, Estado de São Paulo, Brasil, como o único competente para dirimir quaisquer litígios, disputas ou controvérsias decorrentes ou relacionadas a esta Política de Cookies e ao uso do Serviço. As partes renunciam irrevogavelmente a qualquer objeção à jurisdição ou ao foro de tais tribunais.\u003c/p\u003e\n\n\u003ch2\u003e10. Alterações a Esta Política de Cookies\u003c/h2\u003e\n\u003cp\u003eReservamo-nos o direito, a nosso exclusivo critério, de modificar ou substituir esta Política a qualquer momento. Se uma revisão for material, faremos esforços razoáveis para fornecer um aviso com pelo menos 30 dias de antecedência antes que os novos termos entrem em vigor, seja através de um aviso em nosso site ou por e-mail.\u003c/p\u003e\n\u003cp\u003eAo continuar a acessar ou usar nosso Serviço após essas revisões entrarem em vigor, Você concorda em ficar vinculado aos termos revisados. Se Você não concordar com a nova política, no todo ou em parte, por favor, pare de usar o site e o Serviço.\u003c/p\u003e\n\n\u003ch2\u003e11. Contato\u003c/h2\u003e\n\u003cp\u003eSe você tiver alguma dúvida sobre esta Política de Cookies ou sobre as práticas de privacidade da TIMESAFE, entre em contato conosco através do nosso canal de atendimento oficial:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eVisitando esta página em nosso site:\u003c/strong\u003e \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTodas as comunicações serão devidamente registradas e tratadas por nossa equipe ou pelo Encarregado de Proteção de Dados (DPO), conforme o caso.\u003c/p\u003e\n\n\u003chr\u003e\n\u003cp\u003e\u003cem\u003eEste documento constitui um acordo legalmente vinculativo entre Você e a TIMESAFE. Sua utilização do Serviço implica na aceitação integral de seus termos.\u003c/em\u003e\u003c/p\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Consentimento de Privacidade (Cookies)","languageLabel":"Português"},{"documentType":"disclaimer","language":"EN","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eDisclaimer for TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003c cial policy or position of any other author, agency, organization, employer, or company, including the Company.\u003c/p\u003e\n    \u003cp\u003eComments and other content published by users are their sole responsibility. Users will take full responsibility, liability, and blame for any libel, defamation, or litigation that results from something written in or as a direct result of something written in a comment or other user-generated content. The Company is not liable for any comment published by users and reserves the right, in its sole discretion, to delete, edit, or move any comment for any reason and without notice.\u003c/p\u003e\n\n    \u003ch2\u003e10. No Professional Advice Disclaimer\u003c/h2\u003e\n    \u003cp\u003eThe information available through the Service is provided for informational purposes only and is not intended to be, and should not be construed as, professional advice. The Service is not a substitute for professional legal, financial, tax, investment, or medical advice. The Company is not engaged in rendering any such professional services.\u003c/p\u003e\n    \u003cp\u003eYou should not act or refrain from acting on the basis of any content included in the Service without seeking the necessary professional advice from a qualified professional licensed in your jurisdiction. The reliance on any information provided by the Service is solely at your own risk.\u003c/p\u003e\n    \u003cp\u003eIn no event shall the Company or its suppliers be liable for any special, incidental, indirect, or consequential damages whatsoever arising out of or in connection with your access or use or inability to access or use the Service in a context requiring professional advice.\u003c/p\u003e\n    \n    \u003ch2\u003e11. Subscriptions, Payments, and Refunds\u003c/h2\u003e\n    \u003cp\u003eAs the Service is a Paid service, the following terms apply:\u003c/p\u003e\n    \u003ch3\u003eSubscription Period\u003c/h3\u003e\n    \u003cp\u003eThe Service or some parts of the Service are available only with a paid Subscription. You will be billed in advance on a recurring and periodic basis (such as monthly or annually), depending on the type of subscription plan you select when purchasing the Subscription.\u003c/p\u003e\n    \u003cp\u003eAt the end of each period, Your Subscription will automatically renew under the exact same conditions unless You cancel it or the Company cancels it. You authorize Us to charge the applicable subscription fees to the payment method you have on file.\u003c/p\u003e\n    \u003ch3\u003eSubscription Cancellation\u003c/h3\u003e\n    \u003cp\u003eYou may cancel Your Subscription renewal either through Your Account settings page or by contacting the Company. You will not receive a refund for the fees You already paid for Your current subscription period and You will be able to access the Service until the end of Your current subscription period.\u003c/p\u003e\n    \u003ch3\u003ePrice Changes\u003c/h3\u003e\n    \u003cp\u003eThe Company, in its sole discretion and at any time, may modify the Subscription fees. Any Subscription fee change will become effective at the end of the then-current Subscription period. The Company will provide You with reasonable prior notice of any change in Subscription fees to give You an opportunity to terminate Your Subscription before such change becomes effective.\u003c/p\u003e\n    \u003cp\u003eYour continued use of the Service after the Subscription fee change comes into effect constitutes Your agreement to pay the modified Subscription fee amount.\u003c/p\u003e\n    \u003ch3\u003eRefunds\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eEXCEPT WHEN REQUIRED BY APPLICABLE LAW, PAID SUBSCRIPTION FEES ARE NON-REFUNDABLE.\u003c/strong\u003e Certain refund requests for Subscriptions may be considered by the Company on a case-by-case basis and granted at the sole discretion of the Company.\u003c/p\u003e\n    \u003ch3\u003eFree Trial\u003c/h3\u003e\n    \u003cp\u003eThe Company may, at its sole discretion, offer a Subscription with a free trial for a limited period of time. You may be required to enter Your billing information in order to sign up for the Free Trial. If You do enter Your billing information when signing up for a Free Trial, You will not be charged by the Company until the Free Trial has expired. On the last day of the Free Trial period, unless You cancelled Your Subscription, You will be automatically charged the applicable Subscription fees for the type of Subscription You have selected. At any time and without notice, the Company reserves the right to (i) modify the terms and conditions of the Free Trial offer, or (ii) cancel such Free Trial offer.\u003c/p\u003e\n    \n    \u003ch2\u003e12. Data Protection and LGPD Compliance\u003c/h2\u003e\n    \u003cp\u003eThe Company is committed to protecting your privacy and personal data in compliance with applicable data protection laws, including the Brazilian General Data Protection Law (Lei Geral de Proteção de Dados - LGPD), Law No. 13.709/2018.\u003c/p\u003e\n    \u003ch3\u003eData Processing\u003c/h3\u003e\n    \u003cp\u003eOur Privacy Policy, which is incorporated by reference into this Disclaimer, details how we collect, use, store, and share your personal data. By using the Service, you consent to such processing as described in the Privacy Policy.\u003c/p\u003e\n    \u003ch3\u003eData Subject Rights under LGPD\u003c/h3\u003e\n    \u003cp\u003eIf you are a data subject under the LGPD, you have certain rights, including:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eConfirmation and Access:\u003c/strong\u003e The right to obtain confirmation of the existence of processing of your personal data and to access it.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCorrection:\u003c/strong\u003e The right to request the correction of incomplete, inaccurate, or out-of-date data.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAnonymization, Blocking, or Deletion:\u003c/strong\u003e The right to request the anonymization, blocking, or deletion of unnecessary or excessive data or data processed in noncompliance with the LGPD.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eData Portability:\u003c/strong\u003e The right to request the portability of your personal data to another service or product provider.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDeletion:\u003c/strong\u003e The right to request the deletion of personal data processed with your consent.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInformation:\u003c/strong\u003e The right to be informed about public and private entities with which the controller has shared data, and about the possibility of not giving consent and the consequences of refusal.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eConsent Revocation:\u003c/strong\u003e The right to revoke your consent at any time.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eTo exercise these rights, please contact us through the official channels listed in the \"Contact Us\" section.\u003c/p\u003e\n    \u003ch3\u003eIncident and Data Breach Notification\u003c/h3\u003e\n    \u003cp\u003eIn compliance with LGPD regulations, in the event of a security incident that may create a risk or relevant damage to data subjects, the Company will notify the Brazilian National Data Protection Authority (ANPD) and the affected data subjects. This notification will be made within a reasonable time frame, aiming to comply with the stipulated deadline, such as the \u003cstrong\u003ethree (3) business day\u003c/strong\u003e period from the moment the Company becomes aware of the incident, as guided by best practices and regulatory expectations.\u003c/p\u003e\n    \u003ch3\u003eInternational Data Transfers\u003c/h3\u003e\n    \u003cp\u003eYour information, including personal data, may be transferred to — and maintained on — computers located outside of your state, province, country, or other governmental jurisdiction where the data protection laws may differ from those of your jurisdiction. For transfers of personal data from Brazil, we will adhere to the rules established by the ANPD, including ANPD Resolution CD/ANPD No. 19/2024. This may involve using Standard Contractual Clauses (SCCs) approved by the ANPD or other legally valid transfer mechanisms to ensure an adequate level of data protection.\u003c/p\u003e\n    \u003ch3\u003eData Protection Officer (DPO)\u003c/h3\u003e\n    \u003cp\u003eThe Company has appointed a Data Protection Officer (DPO) to oversee compliance with the LGPD. For any questions related to data protection or to exercise your rights, please refer to the contact information in our Privacy Policy or contact us via the link provided below.\u003c/p\u003e\n\n    \u003ch2\u003e13. Governing Law and Jurisdiction\u003c/h2\u003e\n    \u003cp\u003eThis Disclaimer and your use of the Service shall be governed by and construed in accordance with the laws of the Federative Republic of Brazil, without regard to its conflict of law provisions.\u003c/p\u003e\n    \u003cp\u003eYou agree that any legal action or proceeding arising out of or related to this Disclaimer or the Service shall be brought exclusively in the courts of the judicial district of São Paulo, State of São Paulo, Brazil. YOU HEREBY IRREVOCABLY WAIVE ANY OBJECTION TO, AND AGREE TO SUBMIT TO, THE EXCLUSIVE JURISDICTION OF SUCH COURTS in any such suit, action or proceeding.\u003c/p\u003e\n\n    \u003ch2\u003e14. Contact Us\u003c/h2\u003e\n    \u003cp\u003eIf you have any questions, concerns, or require clarification about this Disclaimer, please do not hesitate to contact us. While a direct contact email is not provided, you can reach us through our official contact page:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eBy visiting this page on our website:\u003c/strong\u003e \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eCommunications made through the Service's contact channels shall not be deemed to constitute legal notice to the Company or any of its officers, employees, agents, or representatives in any situation where notice to the Company is required by contract or any law or regulation.\u003c/p\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Disclaimer","languageLabel":"English"},{"documentType":"privacy_policy","language":"EN","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003ePrivacy Policy for TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n    \u003ch2\u003ePrivacy Policy for TIMESAFE\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eLast updated:\u003c/strong\u003e October 1, 2026\u003c/p\u003e\n\n    \u003cp\u003eThis Privacy Policy (\"Policy\") describes the policies and procedures of \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, a company registered in Brazil under CNPJ 41.648.990/0001-56 and NIRE 35237097027, with its principal place of business at ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL (hereinafter referred to as \"Company\", \"We\", \"Us\", or \"Our\"), on the collection, use, processing, and disclosure of Your information when You use the TIMESAFE software, application, and/or website (collectively, the \"Service\"). This Policy also informs You about Your privacy rights and how the law, particularly the Brazilian General Data Protection Law (LGPD), protects You.\u003c/p\u003e\n\n    \u003cp\u003e\u003cstrong\u003eBY ACCESSING, DOWNLOADING, INSTALLING, REGISTERING FOR, OR OTHERWISE USING THE SERVICE, YOU (A) ACKNOWLEDGE THAT YOU HAVE READ, UNDERSTOOD, AND AGREE TO BE BOUND BY THIS PRIVACY POLICY IN ITS ENTIRETY; AND (B) REPRESENT THAT YOU ARE OF LEGAL AGE TO FORM A BINDING CONTRACT WITH THE COMPANY. IF YOU DO NOT AGREE TO ALL THE TERMS AND CONDITIONS OF THIS PRIVACY POLICY, YOU MUST NOT ACCESS, DOWNLOAD, OR USE THE SERVICE.\u003c/strong\u003e\u003c/p\u003e\n\n    \u003cp\u003eYour continued use of the Service following the posting of any changes or modifications to this Privacy Policy will constitute Your acceptance of such changes or modifications. You are advised to review this Privacy Policy periodically for any changes.\u003c/p\u003e\n\n    \u003ch2\u003e1. Interpretation and Definitions\u003c/h2\u003e\n    \u003ch3\u003eInterpretation\u003c/h3\u003e\n    \u003cp\u003eThe words of which the initial letter is capitalized have meanings defined under the following conditions. The following definitions shall have the same meaning regardless of whether they appear in singular or in plural.\u003c/p\u003e\n\n    \u003ch3\u003eDefinitions\u003c/h3\u003e\n    \u003cp\u003eFor the purposes of this Privacy Policy:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eAccount\u003c/strong\u003e means a unique account created for You to access our Service or parts of our Service.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eANPD\u003c/strong\u003e means the Autoridade Nacional de Proteção de Dados, the Brazilian National Data Protection Authority.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCompany\u003c/strong\u003e (referred to as either \"the Company\", \"We\", \"Us\" or \"Our\" in this Agreement) refers to TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS, ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL. For the purpose of the LGPD, the Company is the Data Controller.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e are small files that are placed on Your computer, mobile device or any other device by a website, containing the details of Your browsing history on that website among its many uses.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCountry\u003c/strong\u003e refers to: Brazil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eData Controller\u003c/strong\u003e, for the purposes of the LGPD, refers to the Company as the legal person which determines the purposes and means of the processing of Personal Data.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDevice\u003c/strong\u003e means any device that can access the Service such as a computer, a cellphone or a digital tablet.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eLGPD\u003c/strong\u003e means the Lei Geral de Proteção de Dados Pessoais (Law No. 13.709/2018), the Brazilian General Data Protection Law.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePersonal Data\u003c/strong\u003e is any information that relates to an identified or identifiable natural person.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eService\u003c/strong\u003e refers to the TIMESAFE software, application, and/or the associated website accessible from https://www.timesafe.com.br/contato.html.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eService Provider\u003c/strong\u003e means any natural or legal person who processes the data on behalf of the Company. It refers to third-party companies or individuals employed by the Company to facilitate the Service, to provide the Service on behalf of the Company, to perform services related to the Service or to assist the Company in analyzing how the Service is used.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSubscription\u003c/strong\u003e refers to the paid access model for the Service, which may be billed on a recurring basis.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eUsage Data\u003c/strong\u003e refers to data collected automatically, either generated by the use of the Service or from the Service infrastructure itself (for example, the duration of a page visit, IP address, or device identifiers).\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eYou\u003c/strong\u003e means the individual accessing or using the Service, or the company, or other legal entity on behalf of which such individual is accessing or using the Service, as applicable.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e2. Collection and Use of Your Personal Data\u003c/h2\u003e\n    \u003cp\u003eWe use Your Personal Data to provide, maintain, and improve the Service. By using the Service, You agree to the collection and use of information in accordance with this Privacy Policy. We are committed to processing Your data lawfully, fairly, and in a transparent manner.\u003c/p\u003e\n\n    \u003ch2\u003e3. Types of Data Collected\u003c/h2\u003e\n    \u003ch3\u003ePersonal Data\u003c/h3\u003e\n    \u003cp\u003eWhile using Our Service, especially during account registration, subscription purchase, and general use, We may ask You to provide Us with certain personally identifiable information that can be used to contact or identify You. Personally identifiable information may include, but is not limited to:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eIdentity Data:\u003c/strong\u003e Full name (first name and last name).\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eContact Data:\u003c/strong\u003e Email address, phone number, physical address, State, Province, ZIP/Postal code, City.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eFinancial Data:\u003c/strong\u003e For paid Subscriptions, we collect information necessary to process payments, such as billing address. Please note that We utilize third-party payment processors to handle payment transactions securely. We do not store or have access to Your full credit card numbers or other sensitive payment credentials. We only receive transaction confirmations and billing details.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAccount Data:\u003c/strong\u003e Username, password (stored in a hashed format), user preferences, and settings.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTechnical Data:\u003c/strong\u003e As described in Usage Data below.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eProfile Data:\u003c/strong\u003e Information You voluntarily add to Your user profile.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eMarketing and Communications Data:\u003c/strong\u003e Your preferences in receiving marketing from Us and Your communication preferences.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003eUsage Data\u003c/h3\u003e\n    \u003cp\u003eUsage Data is collected automatically when using the Service.\u003c/p\u003e\n    \u003cp\u003eUsage Data may include, but is not limited to, information such as Your Device's Internet Protocol (IP) address, browser type, browser version, the specific pages of our Service that You visit, the time and date of Your visit, the time spent on those pages, unique device identifiers, operating system, mobile network information, and other diagnostic data. This data is essential for security, service optimization, and troubleshooting.\u003c/p\u003e\n    \u003cp\u003eWhen You access the Service by or through a mobile device, We may collect certain information automatically, including, but not limited to, the type of mobile device You use, Your mobile device unique ID, the IP address of Your mobile device, Your mobile operating system, the type of mobile Internet browser You use, unique device identifiers and other diagnostic data.\u003c/p\u003e\n\n    \u003ch3\u003eTracking Technologies and Cookies\u003c/h3\u003e\n    \u003cp\u003eWe use Cookies and similar tracking technologies (like beacons, tags, and scripts) to track the activity on Our Service and store certain information. These technologies are used to collect and track information and to improve and analyze Our Service.\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eNecessary / Essential Cookies:\u003c/strong\u003e These Cookies are essential to provide You with services available through the website and to enable You to use some of its features. They help to authenticate users and prevent fraudulent use of user accounts. Without these Cookies, the services that You have asked for cannot be provided.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePerformance and Analytics Cookies:\u003c/strong\u003e These Cookies collect information about how You use our Service, such as which pages you visited and which links you clicked on. This information is used to help us improve how our Service works. All information these cookies collect is aggregated and therefore anonymous.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eFunctionality Cookies:\u003c/strong\u003e These Cookies allow our Service to remember choices You make when You use the Service, such as remembering your login details or language preference. The purpose of these cookies is to provide You with a more personal experience and to avoid You having to re-enter your preferences every time You use the Service.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eBy using the Service, You consent to the use of these tracking technologies as described herein. You can instruct Your browser to refuse all Cookies or to indicate when a Cookie is being sent. However, if You do not accept Cookies, You may not be able to use some parts of our Service.\u003c/p\u003e\n\n    \u003ch2\u003e4. Use of Your Personal Data\u003c/h2\u003e\n    \u003cp\u003eThe Company processes and uses Personal Data for the following legitimate business purposes:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eTo provide, operate, and maintain our Service:\u003c/strong\u003e This includes monitoring the usage of our Service, ensuring its security, and managing its performance and functionality.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTo manage Your Account:\u003c/strong\u003e To manage Your registration as a user of the Service. The Personal Data You provide gives You access to different functionalities of the Service that are available to You as a registered user.\u003c/li\u003e\n        - \u003cstrong\u003eTo manage Your Subscription and payments:\u003c/strong\u003e To process transactions, manage Subscription renewals, handle cancellations, and communicate with You about Your Subscription.\n        \u003cli\u003e\u003cstrong\u003eFor the performance of a contract:\u003c/strong\u003e The development, compliance and undertaking of the purchase contract for the products, items or services You have purchased or of any other contract with Us through the Service.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTo contact You:\u003c/strong\u003e To contact You by email, telephone calls, SMS, or other equivalent forms of electronic communication, such as a mobile application's push notifications regarding updates, security alerts, or informative communications related to the functionalities, products or contracted services, including the security updates, when necessary or reasonable for their implementation.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTo provide You with news and general information:\u003c/strong\u003e To provide You with news, special offers and general information about other goods, services and events which we offer that are similar to those that you have already purchased or enquired about, unless You have opted not to receive such information.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTo manage Your requests:\u003c/strong\u003e To attend and manage Your requests to Us, including support inquiries.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eFor business transfers:\u003c/strong\u003e We may use Your information to evaluate or conduct a merger, divestiture, restructuring, reorganization, dissolution, or other sale or transfer of some or all of Our assets, whether as a going concern or as part of bankruptcy, liquidation, or similar proceeding, in which Personal Data held by Us about our Service users is among the assets transferred.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eFor data analysis and improvement:\u003c/strong\u003e For other purposes, such as data analysis, identifying usage trends, determining the effectiveness of our promotional campaigns and to evaluate and improve our Service, products, services, marketing and your experience. This processing is based on Our legitimate interest in improving Our Service for our users.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTo enforce our terms and policies and for legal compliance:\u003c/strong\u003e To enforce our Terms of Service, this Privacy Policy, and to comply with legal obligations and protect our rights, privacy, safety, or property, and/or that of our affiliates, You, or others.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e5. Retention of Your Personal Data\u003c/h2\u003e\n    \u003cp\u003eThe Company will retain Your Personal Data only for as long as is necessary for the purposes set out in this Privacy Policy. We will retain and use Your Personal Data to the extent necessary to comply with our legal obligations (for example, if we are required to retain your data to comply with applicable tax and accounting laws), resolve disputes, and enforce our legal agreements and policies.\u003c/p\u003e\n    \u003cp\u003eSpecifically, account information is retained for as long as Your Account is active and for a reasonable period thereafter in case You decide to re-activate the Service. Transaction and billing information is retained for the period required by Brazilian law for tax and audit purposes, which may be several years.\u003c/p\u003e\n    \u003cp\u003eUsage Data is generally retained for a shorter period of time, except when this data is used to strengthen the security or to improve the functionality of Our Service, or We are legally obligated to retain this data for longer time periods.\u003c/p\u003e\n    \u003cp\u003eUpon expiration of the retention period, Personal Data shall be securely deleted or anonymized in a way that it can no longer be associated with You.\u003c/p\u003e\n\n    \u003ch2\u003e6. Transfer of Your Personal Data\u003c/h2\u003e\n    \u003cp\u003eYour information, including Personal Data, is processed at the Company's operating offices in Brazil and in any other places where the parties involved in the processing are located, such as the data centers of our Service Providers. This means that this information may be transferred to — and maintained on — computers located outside of Your state, province, country or other governmental jurisdiction where the data protection laws may differ from those of Your jurisdiction.\u003c/p\u003e\n    \u003cp\u003eYour consent to this Privacy Policy followed by Your submission of such information represents Your agreement to that transfer.\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eCompliance with LGPD for International Transfers:\u003c/strong\u003e For users in Brazil or where LGPD applies, the Company ensures that any international transfer of Personal Data complies with the LGPD. In accordance with ANPD Resolution CD/ANPD No. 19/2024, such transfers will be carried out using legally valid mechanisms, primarily through the adoption of Standard Contractual Clauses (SCCs) approved by the ANPD, or to countries that provide a level of data protection adequate to that of Brazil. By using the Service, You acknowledge and agree that the transfer of Your Personal Data is necessary for the provision of a global Service and for the performance of the contract between You and the Company.\u003c/p\u003e\n    \u003cp\u003eThe Company will take all steps reasonably necessary to ensure that Your data is treated securely and in accordance with this Privacy Policy and no transfer of Your Personal Data will take place to an organization or a country unless there are adequate controls in place including the security of Your data and other personal information.\u003c/p\u003e\n\n    \u003ch2\u003e7. Disclosure of Your Personal Data\u003c/h2\u003e\n    \u003cp\u003eWe do not sell Your Personal Data. We may disclose Your Personal Data in the good faith belief that such action is necessary under the following circumstances:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eWith Service Providers:\u003c/strong\u003e We may share Your personal information with Service Providers to monitor and analyze the use of our Service, for payment processing, for data hosting, and to contact You. We have contracts in place with our Service Providers that require them to safeguard your data and only use it for the purposes we authorize.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eFor Business Transfers:\u003c/strong\u003e We may share or transfer Your personal information in connection with, or during negotiations of, any merger, sale of Company assets, financing, or acquisition of all or a portion of Our business to another company. We will provide notice before Your Personal Data is transferred and becomes subject to a different Privacy Policy.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eWith Affiliates:\u003c/strong\u003e We may share Your information with Our affiliates, in which case we will require those affiliates to honor this Privacy Policy. Affiliates include Our parent company and any other subsidiaries, joint venture partners or other companies that We control or that are under common control with Us.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTo Comply with Law or Protect Rights:\u003c/strong\u003e We may disclose Your Personal Data if required to do so by law or in response to valid requests by public authorities (e.g., a court or a government agency). This includes for national security or law enforcement requirements.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTo Enforce Our Rights and Prevent Fraud:\u003c/strong\u003e We may disclose Your information to protect and defend the rights or property of the Company, to prevent or investigate possible wrongdoing in connection with the Service, to protect the personal safety of Users of the Service or the public, and to protect against legal liability.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e8. Security of Your Personal Data\u003c/h2\u003e\n    \u003cp\u003eThe security of Your Personal Data is important to Us. We implement and maintain reasonable administrative, physical, and technical security safeguards to help protect Your Personal Data from loss, theft, misuse, and unauthorized access, disclosure, alteration, and destruction. We use measures like encryption, access controls, and secure software development practices.\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eDISCLAIMER AND ASSUMPTION OF RISK:\u003c/strong\u003e DESPITE OUR EFFORTS, YOU ACKNOWLEDGE AND AGREE THAT NO METHOD OF TRANSMISSION OVER THE INTERNET, OR METHOD OF ELECTRONIC STORAGE, IS 100% SECURE. THEREFORE, WHILE WE STRIVE TO USE COMMERCIALLY ACCEPTABLE MEANS TO PROTECT YOUR PERSONAL DATA, WE CANNOT AND DO NOT GUARANTEE ITS ABSOLUTE SECURITY OR CONFIDENTIALITY. YOU ASSUME ALL RISK ASSOCIATED WITH THE TRANSMISSION OF YOUR DATA TO THE SERVICE AND ITS STORAGE BY THE COMPANY. TO THE MAXIMUM EXTENT PERMITTED BY LAW, THE COMPANY DISCLAIMS ALL LIABILITY FOR ANY UNAUTHORIZED ACCESS, DISCLOSURE, OR LOSS OF YOUR PERSONAL DATA.\u003c/p\u003e\n\n    \u003ch2\u003e9. Data Protection Rights (LGPD)\u003c/h2\u003e\n    \u003cp\u003eThe Company undertakes to respect the confidentiality of Your Personal Data and to guarantee You can exercise Your rights. If the LGPD applies to you, you have the right under this Privacy Policy, and by law, to:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eRight to Confirmation and Access:\u003c/strong\u003e Request confirmation of the existence of processing of your Personal Data and to request access to the Personal Data we hold about you.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRight to Correction:\u003c/strong\u003e Request the correction of incomplete, inaccurate, or out-of-date data.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRight to Anonymization, Blocking, or Elimination:\u003c/strong\u003e Request the anonymization, blocking, or elimination of unnecessary or excessive data or data processed in noncompliance with the provisions of the LGPD.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRight to Portability:\u003c/strong\u003e Request the portability of your data to another service or product provider, by means of an express request, in accordance with the regulations of the national authority, observing commercial and industrial secrets.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRight to Deletion:\u003c/strong\u003e Request the deletion of Personal Data processed with your consent, except in the cases where retention is permitted by law.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRight to Information:\u003c/strong\u003e Request information about the public and private entities with which the Company has shared your data.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRight to Information on the Possibility of Denying Consent:\u003c/strong\u003e Be informed about the possibility of not providing consent and the consequences of such denial.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRight to Revoke Consent:\u003c/strong\u003e Revoke your consent at any time, through a simple and free procedure. The revocation does not cancel the processing carried out under the previously given consent.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003eExercising Your LGPD Rights\u003c/h3\u003e\n    \u003cp\u003eYou may exercise Your rights of access, rectification, cancellation, and opposition by contacting us. To do so, please contact our Data Protection Officer (DPO) via our official contact page. We may ask you to verify your identity before responding to such requests to ensure the security of your data. You can contact us here:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eBy visiting this page on our website: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003eSecurity Incident Notification\u003c/h3\u003e\n    \u003cp\u003eIn full compliance with the LGPD and its 2024 updates, in the event of a security incident that may create a relevant risk or damage to You or other data subjects, the Company will notify both the ANPD and all affected data subjects. This notification will be made within a reasonable time, not to exceed \u003cstrong\u003ethree (3) business days\u003c/strong\u003e from the date the Company becomes aware of the incident. The notification will include, at a minimum, a description of the nature of the affected Personal Data, information about the data subjects involved, the technical and security measures used, the risks related to the incident, and the measures that were or will be adopted to reverse or mitigate the effects of the damage.\u003c/p\u003e\n\n    \u003ch2\u003e10. General Disclaimers and Limitation of Liability\u003c/h2\u003e\n    \u003ch3\u003eDisclaimer of Warranties\u003c/h3\u003e\n    \u003cp\u003eTHE SERVICE IS PROVIDED TO YOU \"AS IS\" AND \"AS AVAILABLE\" AND WITH ALL FAULTS AND DEFECTS WITHOUT WARRANTY OF ANY KIND. TO THE MAXIMUM EXTENT PERMITTED UNDER APPLICABLE LAW, THE COMPANY, ON ITS OWN BEHALF AND ON BEHALF OF ITS AFFILIATES AND ITS AND THEIR RESPECTIVE LICENSORS AND SERVICE PROVIDERS, EXPRESSLY DISCLAIMS ALL WARRANTIES, WHETHER EXPRESS, IMPLIED, STAT \u003ch4\u003eData Subject Rights\u003c/h4\u003e\n    \u003cp\u003eUnder the LGPD, You have certain rights regarding Your Personal Data. Subject to legal limitations, these rights include:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eRight to Confirmation and Access:\u003c/strong\u003e The right to obtain confirmation of the existence of processing and to access your data.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRight to Rectification:\u003c/strong\u003e The right to correct incomplete, inaccurate, or out-of-date data.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRight to Anonymization, Blocking, or Erasure:\u003c/strong\u003e The right to request the anonymization, blocking, or erasure of unnecessary or excessive data or data processed in noncompliance with the LGPD.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRight to Portability:\u003c/strong\u003e The right to request the transfer of your data to another service or product provider.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRight to Erasure:\u003c/strong\u003e The right to have your personal data erased when processed with your consent.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRight to Information:\u003c/strong\u003e The right to be informed about public and private entities with which the controller has shared data.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRight to Withdraw Consent:\u003c/strong\u003e The right to withdraw your consent at any time.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eTo exercise these rights, please contact us via the contact methods provided in the \"Contact Us\" section.\u003c/p\u003e\n    \u003ch4\u003eInternational Data Transfer\u003c/h4\u003e\n    \u003cp\u003eYour information, including Personal Data, may be transferred to — and maintained on — computers located outside of Your state, province, country, or other governmental jurisdiction where the data protection laws may differ. We will take all steps reasonably necessary to ensure that Your data is treated securely and in accordance with this Agreement and our Privacy Policy. Any international transfer of Personal Data will comply with the LGPD, including through the use of standard contractual clauses as approved by the Brazilian National Data Protection Authority (ANPD), such as those specified in ANPD Resolution CD/ANPD No. 19/2024, or other legal transfer mechanisms.\u003c/p\u003e\n    \u003ch4\u003eData Security and Breach Notification\u003c/h4\u003e\n    \u003cp\u003eWe implement appropriate technical and organizational measures to protect your Personal Data. In the event of a security incident that may create a risk or relevant damage to You or other data subjects, the Company will notify the ANPD and the affected data subjects within a reasonable timeframe, aiming to comply with the 3 (three) business day deadline stipulated by ANPD regulations, where applicable.\u003c/p\u003e\n    \u003ch4\u003eData Protection Officer (DPO)\u003c/h4\u003e\n    \u003cp\u003eThe Company has appointed a Data Protection Officer (DPO). If you have any questions about this Agreement or our data protection practices, you may contact our DPO through the official channels listed on our contact page: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e.\u003c/p\u003e\n\n    \u003ch3\u003e14. Term and Termination\u003c/h3\u003e\n    \u003cp\u003eThis Agreement shall remain in effect until terminated by You or the Company. The Company may, in its sole discretion, at any time and for any or no reason, suspend or terminate this Agreement with or without prior notice. This Agreement will terminate immediately, without prior notice from the Company, in the event that You fail to comply with any provision of this Agreement. You may terminate this Agreement by deleting the Application and all copies thereof from Your Device.\u003c 003eConfirmation and Access:\u003c/strong\u003e The right to confirm the existence of processing and to access Your Personal Data.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCorrection:\u003c/strong\u003e The right to request the correction of incomplete, inaccurate, or out-of-date data.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAnonymization, Blocking, or Deletion:\u003c/strong\u003e The right to request the anonymization, blocking, or deletion of unnecessary or excessive data or data processed in noncompliance with the LGPD.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePortability:\u003c/strong\u003e The right to request the portability of Your Personal Data to another service or product provider, upon express request.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDeletion:\u003c/strong\u003e The right to request the deletion of Personal Data processed with Your consent.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInformation:\u003c/strong\u003e The right to be informed about public and private entities with which the Company has shared Your data.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eConsent Revocation:\u003c/strong\u003e The right to revoke Your consent at any time.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eTo exercise these rights, please contact us through the official channels listed in the \"Contact Us\" section. We may need to verify Your identity before processing Your request.\u003c/p\u003e\n\n    \u003ch3\u003eInternational Data Transfer\u003c/h3\u003e\n    \u003cp\u003eYou acknowledge and agree that Your Personal Data may be transferred to, stored, and processed in countries other than Brazil, where our servers or the servers of our third-party service providers may be located. The Company will ensure that any international transfer of Personal Data complies with the requirements of the LGPD, including, where applicable, the use of Standard Contractual Clauses as defined by ANPD Resolution CD/ANPD No. 19/2024, or other legally permitted transfer mechanisms, to ensure an adequate level of data protection.\u003c/p\u003e\n\n    \u003ch3\u003eData Breach Notification\u003c/h3\u003e\n    \u003cp\u003eIn the event of a security incident that may create a relevant risk or damage to You or other data subjects, the Company is committed to complying with its legal obligations. In accordance with LGPD regulations, we will notify the ANPD and the affected data subjects of the occurrence of such security incident within a reasonable time, which will not exceed \u003cstrong\u003ethree (3) business days\u003c/strong\u003e from the date of our knowledge of the incident.\u003c/p\u003e\n\n    \u003ch3\u003eData Protection Officer (DPO)\u003c/h3\u003e\n    \u003cp\u003eThe Company has appointed a Data Protection Officer (DPO) to oversee our data protection strategy and implementation to ensure compliance with LGPD requirements. For any questions or to exercise your rights, the DPO can be reached via the contact methods provided on our contact page: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e.\u003c/p\u003e\n\n    \u003ch2\u003e11. Dispute Resolution\u003c/h2\u003e\n    \u003ch3\u003eInformal Resolution\u003c/h3\u003e\n    \u003cp\u003eIf You have any concern or dispute about the Service, You agree to first try to resolve the dispute informally by contacting the Company. We will use our best efforts to resolve the matter amicably through negotiation. You can initiate this process by reaching out to us via our contact page: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e.\u003c/p\u003e\n\n    \u003ch3\u003eJurisdiction\u003c/h3\u003e\n    \u003cp\u003eIf a dispute cannot be resolved informally within sixty (60) days of Your notice, any legal suit, action, or proceeding arising out of, or related to, these
