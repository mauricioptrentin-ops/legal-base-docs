so","languageLabel":"Português"},{"documentType":"disclaimer","language":"PT","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"pt-BR\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eExoneração de Responsabilidade - TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n    \u003ch2\u003eExoneração de Responsabilidade do TIMESAFE\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eÚltima atualização:\u003c/strong\u003e 1 de outubro de 2026\u003c/p\u003e\n\n    \u003ch3\u003eACEITAÇÃO VINCULANTE\u003c/h3\u003e\n    \u003cp\u003eESTE DOCUMENTO É UM ACORDO LEGALMENTE VINCULANTE ENTRE VOCÊ (\"USUÁRIO\" OU \"VOCÊ\") E A TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS (\"EMPRESA\", \"NÓS\", \"NOSSO\"). AO ACESSAR, BAIXAR, INSTALAR, CADASTRAR-SE OU DE QUALQUER OUTRA FORMA UTILIZAR O SERVIÇO (CONFORME DEFINIDO ABAIXO), VOCÊ RECONHECE QUE LEU, COMPREENDEU E CONCORDA INTEGRALMENTE EM ESTAR VINCULADO A TODOS OS TERMOS E CONDIÇÕES ESTABELECIDOS NESTA EXONERAÇÃO DE RESPONSABILIDADE. SE VOCÊ NÃO CONCORDAR COM QUALQUER PARTE DESTES TERMOS, VOCÊ NÃO TEM PERMISSÃO PARA ACESSAR OU UTILIZAR O SERVIÇO E DEVE CESSAR O USO IMEDIATAMENTE.\u003c/p\u003e\n    \u003cp\u003eO seu uso continuado do Serviço após a publicação de quaisquer alterações a esta Exoneração de Responsabilidade constituirá sua aceitação inequívoca de tais alterações. É sua responsabilidade revisar este documento periodicamente.\u003c/p\u003e\n\n    \u003ch2\u003e1. Interpretação e Definições\u003c/h2\u003e\n\n    \u003ch3\u003e1.1. Interpretação\u003c/h3\u003e\n    \u003cp\u003eAs palavras cuja letra inicial é maiúscula têm seus significados definidos sob as condições a seguir. As definições apresentadas terão o mesmo significado, independentemente de aparecerem no singular ou no plural. Os títulos das seções são usados apenas por conveniência e não limitam o escopo ou a interpretação das cláusulas.\u003c/p\u003e\n\n    \u003ch3\u003e1.2. Definições\u003c/h3\u003e\n    \u003cp\u003ePara os fins desta Exoneração de Responsabilidade:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"a Empresa\", \"Nós\" ou \"Nosso\" neste documento) refere-se a \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, pessoa jurídica de direito privado, inscrita no CNPJ sob o nº 41.648.990/0001-56, com NIRE 35237097027, sediada na ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServiço\u003c/strong\u003e refere-se coletivamente ao Aplicativo de software TIMESAFE, ao Site, e a todas as funcionalidades, conteúdos, dados, APIs e serviços relacionados disponibilizados pela Empresa.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVocê\u003c/strong\u003e (ou \"Usuário\") significa o indivíduo que acessa ou utiliza o Serviço, ou a empresa, ou outra entidade legal em nome da qual tal indivíduo está acessando ou utilizando o Serviço, conforme aplicável. Ao utilizar o Serviço em nome de uma entidade, você declara e garante que tem autoridade para vincular tal entidade a estes termos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e refere-se ao portal online do TIMESAFE, acessível através de domínios e subdomínios associados à Empresa, incluindo, mas não se limitando a, informações acessíveis em \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAplicativo\u003c/strong\u003e significa o programa de software fornecido pela Empresa, denominado \u003cstrong\u003eTIMESAFE\u003c/strong\u003e, baixado por Você em qualquer dispositivo.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eConteúdo\u003c/strong\u003e refere-se a texto, imagens, dados, informações ou outros materiais que podem ser postados, carregados, vinculados ou de outra forma disponibilizados por Você ou pela Empresa através do Serviço.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTerceiros\u003c/strong\u003e refere-se a qualquer indivíduo, empresa ou entidade que não seja Você ou a Empresa, incluindo, mas não se limitando a, provedores de serviços de pagamento, hospedagem, análise de dados e plataformas de publicidade.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eLGPD\u003c/strong\u003e refere-se à Lei Geral de Proteção de Dados Pessoais (Lei Federal nº 13.709/2018) do Brasil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eANPD\u003c/strong\u003e refere-se à Autoridade Nacional de Proteção de Dados do Brasil.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e2. Exoneração de Responsabilidade Geral\u003c/h2\u003e\n    \u003cp\u003eAs informações, materiais e funcionalidades contidas no Serviço são fornecidos exclusivamente para fins informacionais e operacionais gerais. A Empresa não assume qualquer responsabilidade por erros, imprecisões ou omissões no conteúdo do Serviço.\u003c/p\u003e\n    \u003cp\u003eA EMPRESA RESERVA-SE O DIREITO DE FAZER ADIÇÕES, EXCLUSÕES OU MODIFICAÇÕES NO CONTEÚDO E NA FUNCIONALIDADE DO SERVIÇO A QUALQUER MOMENTO, SEM AVISO PRÉVIO, A SEU EXCLUSIVO CRITÉRIO. A UTILIZAÇÃO DO SERVIÇO É UM PRIVILÉGIO, NÃO UM DIREITO, E PODE SER REVOGADO OU SUSPENSO A QUALQUER MOMENTO.\u003c/p\u003e\n    \u003cp\u003eA Empresa não garante que o Serviço esteja, ou permanecerá, livre de vírus, worms, cavalos de troia, malware, ransomware ou outros componentes prejudiciais. Você é o único responsável por implementar procedimentos e pontos de verificação suficientes para satisfazer seus requisitos particulares de segurança de dados e por manter um meio, externo ao nosso Serviço, para a reconstrução de quaisquer dados perdidos.\u003c/p\u003e\n\n    \u003ch2\u003e3. \"USE POR SUA CONTA E RISCO\" E ISENÇÃO DE GARANTIAS\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eESTA SEÇÃO LIMITA SUBSTANCIALMENTE AS NOSSAS RESPONSABILIDADES. LEIA-A COM ATENÇÃO.\u003c/strong\u003e\u003c/p\u003e\n    \n    \u003ch3\u003e3.1. Assunção de Risco\u003c/h3\u003e\n    \u003cp\u003eVOCÊ RECONHECE E CONCORDA EXPRESSAMENTE QUE O USO DO SERVIÇO E DE QUALQUER CONTEÚDO OU INFORMAÇÃO OBTIDA ATRAVÉS DELE É FEITO POR SUA CONTA E RISCO. VOCÊ ASSUME TOTAL RESPONSABILIDADE E RISCO POR QUALQUER PERDA OU DANO RESULTANTE DO SEU USO DO SERVIÇO, INCLUINDO, MAS NÃO SE LIMITANDO A, DANOS AO SEU SISTEMA DE COMPUTADOR, DISPOSITIVO MÓVEL, OU PERDA DE DADOS.\u003c/p\u003e\n    \u003cp\u003eA Empresa não será responsável por quaisquer danos resultantes do uso ou da incapacidade de uso do Serviço, incluindo danos diretos ou indiretos causados por malware, vírus, interrupções de serviço, corrupção de arquivos ou dados, falhas de hardware ou software, ou qualquer inexatidão ou incompletude nas informações ou no funcionamento do Aplicativo ou Site.\u003c/p\u003e\n\n    \u003ch3\u003e3.2. Isenção de Todas as Garantias (\"COMO ESTÁ\")\u003c/h3\u003e\n    \u003cp\u003eO SERVIÇO É FORNECIDO A VOCÊ \"COMO ESTÁ\" (AS IS) E \"CONFORME DISPONÍVEL\" (AS AVAILABLE), COM TODAS AS FALHAS E DEFEITOS, SEM GARANTIA DE QUALQUER TIPO. NA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, A EMPRESA, EM SEU PRÓPRIO NOME E EM NOME DE SUAS AFILIADAS E DE SEUS RESPECTIVOS LICENCIADORES E PRESTADORES DE SERVIÇOS, ISENTA-SE EXPRESSAMENTE DE TODAS AS GARANTIAS, SEJAM ELAS EXPRESSAS, IMPLÍCITAS, ESTATUTÁRIAS OU DE OUTRA FORMA, COM RELAÇÃO AO SERVIÇO, INCLUINDO:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eTODAS AS GARANTIAS IMPLÍCITAS DE COMERCIALIZAÇÃO;\u003c/strong\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eADEQUAÇÃO A UM PROPÓSITO ESPECÍFICO;\u003c/strong\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTÍTULO E NÃO VIOLAÇÃO DE DIREITOS DE TERCEIROS;\u003c/strong\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eGARANTIAS DECORRENTES DE NEGOCIAÇÃO, CURSO DE DESEMPENHO, USO OU PRÁTICA COMERCIAL.\u003c/strong\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eSEM LIMITAÇÃO AO ACIMA EXPOSTO, A EMPRESA NÃO OFERECE NENHUMA GARANTIA OU COMPROMISSO, E NÃO FAZ NENHUMA REPRESENTAÇÃO DE QUALQUER TIPO DE QUE O SERVIÇO ATENDERÁ ÀS SUAS NECESSIDADES, ALCANÇARÁ OS RESULTADOS PRETENDIDOS, SERÁ COMPATÍVEL OU FUNCIONARÁ COM QUALQUER OUTRO SOFTWARE, APLICATIVOS, SISTEMAS OU SERVIÇOS, OPERARÁ DE FORMA ININTERRUPTA, ATENDERÁ A QUAISQUER PADRÕES DE DESEMPENHO OU CONFIABILIDADE OU SERÁ LIVRE DE ERROS, OU QUE QUAISQUER ERROS OU DEFEITOS POSSAM SER OU SERÃO CORRIGIDOS.\u003c/p\u003e\n    \u003cp\u003eA Empresa não garante que: (a) o Serviço atenderá às suas expectativas ou requisitos; (b) o acesso ao Serviço será ininterrupto, pontual, seguro ou livre de erros; (c) os resultados obtidos com o uso do Serviço serão precisos, completos ou confiáveis; ou (d) a qualidade de quaisquer produtos, serviços, informações ou outros materiais adquiridos ou obtidos por Você através do Serviço atenderá às suas expectativas.\u003c/p\u003e\n    \u003cp\u003eAlgumas jurisdições não permitem a exclusão de certos tipos de garantias ou limitações aos direitos estatutários aplicáveis de um consumidor, portanto, algumas ou todas as exclusões e limitações acima podem não se aplicar a Você. Mas, em tal caso, as exclusões e limitações estabelecidas nesta seção serão aplicadas na maior extensão possível sob a lei aplicável.\u003c/p\u003e\n\n    \u003ch2\u003e4. Limitação de Responsabilidade\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, EM NENHUMA CIRCUNSTÂNCIA A EMPRESA, SUAS AFILIADAS, DIRETORES, FUNCIONÁRIOS, AGENTES, FORNECEDORES OU LICENCIADORES SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, PUNITIVOS, INDIRETOS OU CONSEQUENCIAIS DE QUALQUER NATUREZA (INCLUINDO, MAS NÃO SE LIMITANDO A, DANOS POR PERDA DE LUCROS, PERDA DE DADOS OU OUTRAS INFORMAÇÕES CONFIDENCIAIS, POR INTERRUPÇÃO DE NEGÓCIOS, POR LESÃO PESSOAL, PERDA DE PRIVACIDADE) DECORRENTES DE OU DE QUALQUER FORMA RELACIONADOS A:\u003c/strong\u003e\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003e(i) O USO OU A INCAPACIDADE DE USAR O SERVIÇO;\u003c/strong\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003e(ii) SOFTWARE DE TERCEIROS E/OU HARDWARE DE TERCEIROS USADO COM O SERVIÇO;\u003c/strong\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003e(iii) CONTEÚDO DE TERCEIROS, INCLUINDO CONDUTA DIFAMATÓRIA, OFENSIVA OU ILEGAL DE OUTROS USUÁRIOS OU TERCEIROS;\u003c/strong\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003e(iv) ACESSO NÃO AUTORIZADO, USO OU ALTERAÇÃO DE SUAS TRANSMISSÕES OU CONTEÚDO;\u003c/strong\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003e(v) QUALQUER OUTRA QUESTÃO RELACIONADA AO SERVIÇO, MESMO QUE A EMPRESA TENHA SIDO AVISADA DA POSSIBILIDADE DE TAIS DANOS E MESMO QUE A SOLUÇÃO FALHE EM SEU PROPÓSITO ESSENCIAL.\u003c/strong\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eNÃO OBSTANTE QUAISQUER DANOS QUE VOCÊ POSSA SOFRER, A RESPONSABILIDADE TOTAL E AGREGADA DA EMPRESA E DE QUALQUER UM DE SEUS FORNECEDORES SOB QUALQUER DISPOSIÇÃO DESTA EXONERAÇÃO E SEU RECURSO EXCLUSIVO PARA TUDO O QUE FOI DITO ACIMA SERÁ LIMITADO AO MAIOR DOS SEGUINTES VALORES: (a) O MONTANTE EFETIVAMENTE PAGO POR VOCÊ PELO SERVIÇO NO PERÍODO DE 12 (DOZE) MESES IMEDIATAMENTE ANTERIOR AO EVENTO QUE DEU ORIGEM À RECLAMAÇÃO; OU (b) R$ 100,00 (CEM REAIS).\u003c/p\u003e\n    \u003cp\u003eAs limitações e exclusões de responsabilidade acima aplicam-se independentemente de a responsabilidade ser baseada em contrato, ato ilícito (incluindo negligência), responsabilidade objetiva ou qualquer outra teoria legal, e sobreviverão à rescisão ou expiração deste acordo.\u003c/p\u003e\n\n    \u003ch2\u003e5. Indenização\u003c/h2\u003e\n    \u003cp\u003eVocê concorda em indenizar, defender e isentar de responsabilidade a Empresa, suas afiliadas, controladoras, subsidiárias, diretores, conselheiros, funcionários, agentes, contratados, licenciadores e fornecedores de e contra todas e quaisquer reclamações, perdas, responsabilidades, danos, julgamentos, sentenças, custos, despesas e honorários (incluindo honorários advocatícios razoáveis) decorrentes de ou relacionados a:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e(a) seu uso ou mau uso do Serviço;\u003c/li\u003e\n        \u003cli\u003e(b) qualquer violação por sua parte desta Exoneração de Responsabilidade ou de quaisquer outros termos, políticas ou diretrizes da Empresa;\u003c/li\u003e\n        \u003cli\u003e(c) qualquer conteúdo ou informação que você submeta, poste, transmita ou disponibilize através do Serviço;\u003c/li\u003e\n        \u003cli\u003e(d) sua violação de qualquer lei, regra ou regulamento aplicável, incluindo, mas não se limitando à LGPD; ou\u003c/li\u003e\n        \u003cli\u003e(e) sua violação dos direitos de qualquer terceiro, incluindo, sem limitação, direitos de propriedade intelectual, privacidade ou publicidade.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eA Empresa reserva-se o direito, às suas próprias custas, de assumir a defesa e o controle exclusivos de qualquer assunto sujeito a indenização por sua parte, caso em que você cooperará plenamente com a Empresa na afirmação de quaisquer defesas disponíveis.\u003c/p\u003e\n\n    \u003ch2\u003e6. Isenção de Responsabilidade de Links Externos\u003c/h2\u003e\n    \u003cp\u003eO Serviço pode conter links para sites ou serviços externos que não são fornecidos, mantidos, controlados por ou de qualquer forma afiliados à Empresa. A inclusão de qualquer link não implica endosso, aprovação ou controle pela Empresa do site externo ou de seu conteúdo.\u003c/p\u003e\n    \u003cp\u003eA EMPRESA NÃO GARANTE A PRECISÃO, RELEVÂNCIA, ATUALIDADE, CONFIABILIDADE OU INTEGRIDADE DE QUALQUER INFORMAÇÃO NESSES SITES EXTERNOS. NÃO SOMOS RESPONSÁVEIS PELAS PRÁTICAS DE PRIVACIDADE, CONTEÚDO OU DISPONIBILIDADE DE TAIS SITES DE TERCEIROS. AO ACESSAR SITES DE TERCEIROS, VOCÊ O FAZ POR SUA CONTA E RISCO E ESTARÁ SUJEITO AOS TERMOS E CONDIÇÕES E POLÍTICAS DE PRIVACIDADE DESSES SITES.\u003c/p\u003e\n\n    \u003ch2\u003e7. Isenção de Responsabilidade por Erros e Omissões\u003c/h2\u003e\n    \u003cp\u003eAs informações fornecidas pelo Serviço destinam-se a ser uma orientação geral sobre assuntos de interesse. Embora a Empresa tome todas as precauções razoáveis para garantir que o conteúdo do Serviço seja atual, preciso e confiável, podem ocorrer erros. Além disso, devido à natureza dinâmica e mutável das leis, regras e regulamentos, pode haver atrasos, omissões ou imprecisões nas informações contidas no Serviço.\u003c/p\u003e\n    \u003cp\u003eA Empresa não é responsável por quaisquer erros ou omissões, nem pelos resultados obtidos com o uso dessas informações. A informação é fornecida sem qualquer garantia de que será completa, precisa ou oportuna. A Empresa não se compromete a atualizar o material contido no Serviço.\u003c/p\u003e\n\n    \u003ch2\u003e8. Isenção de Responsabilidade sobre Direitos Autorais\u003c/h2\u003e\n    \u003cp\u003eA Empresa pode utilizar material protegido por direitos autorais cujo uso nem sempre foi especificamente autorizado pelo proprietário dos direitos autorais. A Empresa disponibiliza tal material para fins como crítica, comentário, reportagem, ensino, bolsa de estudos ou pesquisa. A Empresa acredita que isso se enquadra nas limitações aos direitos autorais, conforme previsto na legislação brasileira de direitos autorais (Lei nº 9.610/98).\u003c/p\u003e\n    \u003cp\u003eSe você deseja usar material protegido por direitos autorais do Serviço para seus próprios fins que vão além do uso permitido pela lei, você deve obter permissão expressa do proprietário dos direitos autorais.\u003c/p\u003e\n\n    \u003ch2\u003e9. Isenção de Responsabilidade Expressa das Visualizações\u003c/h2\u003e\n    \u003cp\u003eO Serviço pode conter pontos de vista e opiniões que são dos autores e não refletem necessariamente a política ou posição oficial de qualquer outro autor, agência, organização, empregador ou empresa, incluindo a Empresa.\u003c/p\u003e\n    \u003cp\u003eComentários, postagens e outros conteúdos publicados por usuários são de sua exclusiva responsabilidade. Os usuários assumem total responsabilidade, obrigação e culpa por qualquer difamação, ofensa ou litígio que resulte de algo escrito em, ou como resultado direto de algo escrito em, um comentário ou outra forma de conteúdo gerado pelo usuário. A Empresa não se responsabiliza por nenhum conteúdo publicado por usuários e reserva-se o direito de remover qualquer conteúdo por qualquer motivo, a seu exclusivo critério.\u003c/p\u003e\n\n    \u003ch2\u003e10. Isenção de Responsabilidade Profissional\u003c/h2\u003e\n    \u003cp\u003eAs informações e funcionalidades fornecidas pelo Serviço não constituem e não devem ser interpretadas como consultoria jurídica, contábil, tributária, financeira, de investimento ou qualquer outra forma de consultoria profissional. O TIMESAFE é uma ferramenta tecnológica e seu uso não cria uma relação profissional-cliente de qualquer tipo.\u003c/p\u003e\n    \u003cp\u003eVocê não deve tomar ou deixar de tomar qualquer ação com base nas informações contidas no Serviço. Antes de tomar qualquer decisão ou ação financeira, legal ou de negócios, você deve sempre consultar consultores profissionais competentes e devidamente licenciados em sua jurisdição.\u003c/p\u003e\n    \u003cp\u003eEM NENHUM CASO A EMPRESA OU SEUS FORNECEDORES SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS OU CONSEQUENCIAIS DE QUALQUER NATUREZA DECORRENTES DE SEU ACESSO, USO OU INCAPACIDADE DE ACESSAR OU USAR O SERVIÇO, OU DE SUA CONFIANÇA EM QUALQUER INFORMAÇÃO FORNECIDA PELO SERVIÇO.\u003c/p\u003e\n    \n    \u003ch2\u003e11. Assinaturas, Pagamentos e Reembolsos\u003c/h2\u003e\n    \n    \u003ch3\u003e11.1. Período de Assinatura\u003c/h3\u003e\n    \u003cp\u003eO Serviço, ou algumas de suas partes, está disponível apenas mediante uma Assinatura paga (\"Assinatura\"). Você será cobrado antecipadamente de forma recorrente e periódica (como mensal ou anual), dependendo do tipo de plano de Assinatura que você selecionar ao adquirir a Assinatura.\u003c/p\u003e\n    \u003cp\u003eAo final de cada período de faturamento, sua Assinatura será renovada automaticamente sob as mesmas condições, a menos que você a cancele ou a Empresa a cancele. A cobrança da renovação será efetuada através do método de pagamento registrado em sua conta.\u003c/p\u003e\n\n    \u003ch3\u003e11.2. Cancelamento da Assinatura\u003c/h3\u003e\n    \u003cp\u003eVocê pode cancelar a renovação de sua Assinatura a qualquer momento, seja através da página de configurações de sua conta no Serviço ou entrando em contato com a Empresa. Você não receberá um reembolso pelas taxas já pagas pelo período de assinatura atual e continuará a ter acesso ao Serviço até o final do período de assinatura vigente.\u003c/p\u003e\n\n    \u003ch3\u003e11.3. Alterações de Preço\u003c/h3\u003e\n    \u003cp\u003eA Empresa pode, a seu exclusivo critério e a qualquer momento, modificar as taxas de Assinatura. Qualquer alteração no preço da Assinatura entrará em vigor no final do período de Assinatura então vigente. A Empresa fornecerá a você um aviso prévio razoável sobre qualquer alteração nos preços para lhe dar a oportunidade de encerrar sua Assinatura antes que tal alteração entre em vigor. Seu uso continuado do Serviço após a entrada em vigor da alteração de preço constitui sua concordância em pagar o valor da taxa de Assinatura modificada.\u003c/p\u003e\n    \n    \u003ch3\u003e11.4. Reembolsos\u003c/h3\u003e\n    \u003cp\u003eEXCETO QUANDO EXIGIDO POR LEI, AS TAXAS DE ASSINATURA PAGAS NÃO SÃO REEMBOLSÁVEIS. Determinados pedidos de reembolso para Assinaturas podem ser considerados pela Empresa caso a caso e concedidos a critério exclusivo da Empresa. A concessão de um reembolso em uma ocasião não cria a obrigação de conceder um reembolso em ocasiões futuras.\u003c/p\u003e\n\n    \u003ch3\u003e11.5. Teste Gratuito (\"Free Trial\")\u003c/h3\u003e\n    \u003cp\u003eA Empresa pode, a seu exclusivo critério, oferecer uma Assinatura com um período de teste gratuito por um tempo limitado (\"Teste Gratuito\"). Você pode ser solicitado a inserir suas informações de faturamento para se inscrever no Teste Gratuito. Se você inserir suas informações de faturamento, não será cobrado pela Empresa até que o Teste Gratuito tenha expirado. No último dia do período de Teste Gratuito, a menos que você tenha cancelado sua Assinatura, você será cobrado automaticamente pelas taxas de Assinatura aplicáveis ao tipo de Assinatura que você selecionou. A qualquer momento e sem aviso prévio, a Empresa reserva-se o direito de (i) modificar os termos e condições da oferta de Teste Gratuito, ou (ii) cancelar tal oferta de Teste Gratuito.\u003c/p\u003e\n\n    \u003ch2\u003e12. Conformidade com a LGPD e Privacidade de Dados\u003c/h2\u003e\n    \u003cp\u003eA Empresa está comprometida com a proteção de seus dados pessoais e em conformidade com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018) e suas regulamentações subsequentes.\u003c/p\u003e\n\n    \u003ch3\u003e12.1. Direitos dos Titulares de Dados\u003c/h3\u003e\n    \u003cp\u003eConforme a LGPD, você, como titular de dados pessoais, tem o direito de:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eConfirmação e Acesso:\u003c/strong\u003e Obter a confirmação da existência de tratamento e acessar seus dados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCorreção:\u003c/strong\u003e Solicitar a correção de dados incompletos, inexatos ou desatualizados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAnonimização, Bloqueio ou Eliminação:\u003c/strong\u003e Solicitar a anonimização, bloqueio ou eliminação de dados desnecessários, excessivos ou tratados em desconformidade com a LGPD.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePortabilidade:\u003c/strong\u003e Solicitar a portabilidade dos seus dados a outro fornecedor de serviço ou produto.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEliminação:\u003c/strong\u003e Solicitar a eliminação dos dados pessoais tratados com o seu consentimento.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInformação sobre Compartilhamento:\u003c/strong\u003e Obter informação sobre as entidades públicas e privadas com as quais a Empresa realizou uso compartilhado de dados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRevogação do Consentimento:\u003c/strong\u003e Revogar o seu consentimento a qualquer momento.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003ePara exercer seus direitos, entre em contato conosco através do nosso canal oficial.\u003c/p\u003e\n\n    \u003ch3\u003e12.2. Notificação de Incidentes de Segurança\u003c/h3\u003e\n    \u003cp\u003eEm conformidade com as regulamentações da ANPD, em caso de ocorrência de um incidente de segurança que possa acarretar risco ou dano relevante aos titulares, a Empresa comunicará a ANPD e os titulares afetados em um prazo de \u003cstrong\u003e3 (três) dias úteis\u003c/strong\u003e a partir do conhecimento do incidente, detalhando a natureza dos dados afetados, as medidas tomadas e os riscos relacionados.\u003c/p\u003e\n\n    \u003ch3\u003e12.3. Transferência Internacional de Dados\u003c/h3\u003e\n    \u003cp\u003ePara fornecer o Serviço, a Empresa pode precisar transferir seus dados pessoais para outros países, por exemplo, para servidores de hospedagem localizados no exterior. Tais transferências serão realizadas apenas para países que proporcionem um grau de proteção de dados adequado ao previsto na LGPD ou quando a Empresa garantir o cumprimento dos princípios, dos direitos do titular e do regime de proteção de dados previsto na lei, por meio de mecanismos como as Cláusulas Contratuais Padrão aprovadas pela ANPD (conforme Resolução CD/ANPD nº 19/2024).\u003c/p\u003e\n\n    \u003ch3\u003e12.4. Encarregado de Proteção de Dados (DPO)\u003c/h3\u003e\n    \u003cp\u003eA Empresa nomeou um Encarregado de Proteção de Dados (DPO) para supervisionar questões relacionadas a esta política de privacidade e à LGPD. Se você tiver alguma dúvida sobre como seus dados são tratados ou desejar exercer seus direitos, por favor, entre em contato através do canal disponibilizado em nossa página de contato.\u003c/p\u003e\n\n    \u003ch2\u003e13. Lei Aplicável e Jurisdição\u003c/h2\u003e\n    \u003cp\u003eEsta Exoneração de Responsabilidade e seu uso do Serviço serão regidos e interpretados de acordo com as leis da República Federativa do Brasil, desconsiderando seus princípios de conflitos de leis.\u003c/p\u003e\n    \u003cp\u003eAs partes concordam que qualquer litígio, controvérsia ou reclamação decorrente de ou relacionado a este documento ou ao Serviço será submetido à jurisdição exclusiva do \u003cstrong\u003eForo da Comarca de São Paulo, Estado de São Paulo, Brasil\u003c/strong\u003e. Você e a Empresa renunciam irrevogavelmente a qualquer objeção, incluindo objeções baseadas na doutrina de \u003cem\u003eforum non conveniens\u003c/em\u003e, à jurisdição e ao foro de tais tribunais para julgar e determinar qualquer ação ou processo.\u003c/p\u003e\n\n    \u003ch2\u003e14. Disposições Gerais\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eDivisibilidade:\u003c/strong\u003e Se qualquer disposição desta Exoneração de Responsabilidade for considerada inexequível ou inválida, tal disposição será alterada e interpretada para cumprir os objetivos de tal disposição na maior extensão possível sob a lei aplicável, e as disposições restantes continuarão em pleno vigor e efeito.\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eRenúncia:\u003c/strong\u003e A falha da Empresa em exercer ou fazer cumprir qualquer direito ou disposição deste documento não constituirá uma renúncia a tal direito ou disposição. Nenhuma renúncia por parte da Empresa a qualquer termo ou condição aqui estabelecido será considerada uma renúncia adicional ou contínua de tal termo ou condição.\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eAcordo Integral:\u003c/strong\u003e Esta Exoneração de Responsabilidade, juntamente com nossa Política de Privacidade e quaisquer outros avisos legais publicados por nós no Serviço, constituem o acordo integral entre você e a Empresa em relação ao Serviço e substituem todos os entendimentos, acordos, representações e garantias anteriores e contemporâneos, tanto escritos quanto orais.\u003c/p\u003e\n\n    \u003ch2\u003e15. Contato\u003c/h2\u003e\n    \u003cp\u003eSe você tiver alguma dúvida sobre esta Exoneração de Responsabilidade, pode entrar em contato conosco:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eVisitando a página de contato em nosso site: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Aviso Legal","languageLabel":"Português"},{"documentType":"copyright","language":"PT","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"pt-BR\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003ctitle\u003eAviso de Direitos Autorais - TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003eAviso de Direitos Autorais\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eÚltima atualização:\u003c/strong\u003e 1 de outubro de 2026\u003c/p\u003e\n    \n    \u003cp\u003eEste Aviso de Direitos Autorais (\"Aviso\") governa o uso do software TIMESAFE, do website associado, de todos os serviços relacionados, e de todo o conteúdo fornecido pela \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, pessoa jurídica de direito privado, inscrita no CNPJ sob o nº 41.648.990/0001-56, com NIRE 35237097027, e sede em ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL (doravante referida como \"Empresa\", \"Nós\", \"Nosso\").\u003c/p\u003e\n\n    \u003cp\u003e\u003cstrong\u003eAO ACESSAR, BAIXAR, INSTALAR, ASSINAR OU DE QUALQUER FORMA UTILIZAR O SOFTWARE OU SERVIÇOS TIMESAFE (\"SERVIÇO\"), VOCÊ (\"USUÁRIO\", \"VOCÊ\") CONFIRMA QUE LEU, COMPREENDEU E CONCORDA EM ESTAR VINCULADO, SEM LIMITAÇÕES OU QUALIFICAÇÕES, A TODOS OS TERMOS E CONDIÇÕES CONTIDOS NESTE AVISO. SE VOCÊ NÃO CONCORDA COM QUALQUER PARTE DESTES TERMOS, VOCÊ NÃO TEM NOSSA PERMISSÃO PARA ACESSAR OU UTILIZAR O SERVIÇO E DEVE CESSAR O USO IMEDIATAMENTE.\u003c/strong\u003e\u003c/p\u003e\n\n    \u003cp\u003eEste documento é um acordo legalmente vinculativo entre você e a Empresa. A utilização contínua do Serviço após qualquer modificação neste Aviso constituirá sua aceitação tácita e vinculativa de tais modificações.\u003c/p\u003e\n\n    \u003cp\u003eCopyright © 2026 TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS. Todos os direitos são reservados. A marca TIMESAFE, a tecnologia subjacente, este website, o aplicativo e todo o seu conteúdo são protegidos pelas leis de direitos autorais e propriedade intelectual da República Federativa do Brasil (notavelmente a Lei nº 9.610/98 - Lei de Direitos Autorais, e a Lei nº 9.609/96 - Lei de Software) e tratados internacionais. A distribuição, cópia, modificação ou qualquer uso não autorizado são estritamente proibidos e sujeitos a sanções civis e criminais.\u003c/p\u003e\n\n    \u003ch2\u003eConteúdo Protegido\u003c/h2\u003e\n    \u003cp\u003eSalvo indicação em contrário, todo o conteúdo, material e ativos intelectuais que compõem ou são disponibilizados através do Serviço são de propriedade exclusiva da Empresa ou de seus licenciadores e são rigorosamente protegidos por leis de direitos autorais, marcas registradas, patentes, segredos comerciais e outras leis de propriedade intelectual. O Conteúdo Protegido inclui, mas não se limita a:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eSoftware:\u003c/strong\u003e Todo o código-fonte, código-objeto, algoritmos, arquivos executáveis, bibliotecas, APIs (Interfaces de Programação de Aplicativos), atualizações, novas versões, e qualquer documentação técnica relacionada ao software TIMESAFE.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eConteúdo Textual:\u003c/strong\u003e Todos os textos, artigos, postagens de blog, descrições, manuais do usuário, guias de ajuda, termos de serviço, políticas de privacidade e qualquer outra forma de material escrito presente no website, no aplicativo ou em materiais de marketing.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eElementos Visuais e de Design:\u003c/strong\u003e A aparência e a sensação (\"look and feel\") do Serviço, incluindo, mas não se limitando a, todos os gráficos, logotipos, ícones de botão, imagens, fotografias, clipes de áudio, vídeos, tutoriais, a interface do usuário (UI), o design da experiência do usuário (UX), paletas de cores, layouts de página, e a compilação e arranjo de todos os elementos visuais.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCompilações de Dados e Bases de Dados:\u003c/strong\u003e Qualquer compilação de dados, estrutura de banco de dados, organização, sequência e estrutura que sejam originais e façam parte do Serviço.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eMateriais de Marketing e Documentação:\u003c/strong\u003e Todos os materiais promocionais, folhetos, white papers, apresentações, estudos de caso, documentação de vendas e materiais de treinamento associados ao TIMESAFE.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSegredos Comerciais:\u003c/strong\u003e Conceitos, ideias, know-how, métodos ope erviço até o final do período de assinatura corrente já pago.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAlterações de Preço:\u003c/strong\u003e A Empresa reserva-se o direito, a seu exclusivo e absoluto critério, de modificar as taxas de Assinatura a qualquer momento. Qualquer alteração de preço se tornará efetiva no final do período de Assinatura então vigente. Forneceremos um aviso prévio razoável de qualquer alteração nos preços para lhe dar a oportunidade de cancelar sua Assinatura antes que tal alteração entre em vigor. Seu uso continuado do Serviço após a alteração de preço entrar em vigor constitui sua concordância em pagar o valor modificado da taxa de Assinatura.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eReembolsos:\u003c/strong\u003e EXCETO QUANDO EXPRESSAMENTE EXIGIDO PELA LEGISLAÇÃO APLICÁVEL (COMO O DIREITO DE ARREPENDIMENTO DE 7 DIAS PARA COMPRAS ONLINE PREVISTO NO CÓDIGO DE DEFESA DO CONSUMIDOR BRASILEIRO), AS TAXAS DE ASSINATURA PAGAS SÃO FINAIS E NÃO REEMBOLSÁVEIS. A Empresa não tem obrigação de fornecer reembolsos ou créditos, mas pode considerar fazê-lo caso a caso, a seu exclusivo e absoluto critério.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTeste Gratuito (Free Trial):\u003c/strong\u003e A Empresa pode, a seu exclusivo critério, oferecer uma Assinatura com um período de teste gratuito por um tempo limitado. Você pode ser solicitado a fornecer suas informações de faturamento para se inscrever no teste gratuito. Se você fornecer suas informações de faturamento, você não será cobrado até o término do período de teste. NO ÚLTIMO DIA DO PERÍODO DE TESTE GRATUITO, A MENOS QUE VOCÊ TENHA CANCELADO SUA ASSINATURA, VOCÊ SERÁ AUTOMATICAMENTE COBRADO PELAS TAXAS DE ASSINATURA APLICÁVEIS AO TIPO DE ASSINATURA QUE VOCÊ SELECIONOU. A Empresa reserva-se o direito de modificar ou cancelar a oferta de teste gratuito a qualquer momento, sem aviso prévio.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eRestrições\u003c/h2\u003e\n    \u003cp\u003eOs direitos concedidos a você neste Aviso são sujeitos às seguintes restrições. Qualquer uso do Serviço ou de seu Conteúdo Protegido em violação a estas restrições é uma quebra material deste acordo, uma violação de nossos direitos autorais e pode resultar na terminação imediata e automática de sua licença e direitos de uso, sem prejuízo de outras medidas legais cabíveis.\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eVocê não pode, e não pode permitir que terceiros:\u003c/strong\u003e\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eCopiar, reproduzir, duplicar, modificar, traduzir, adaptar, criar trabalhos derivados, distribuir, disseminar, vender, alugar, arrendar, emprestar, sublicenciar ou de qualquer outra forma transferir ou explorar comercialmente qualquer parte do Serviço ou do Conteúdo Protegido sem a permissão prévia, expressa e por escrito da Empresa.\u003c/li\u003e\n        \u003cli\u003eRealizar engenharia reversa, descompilar, desmontar, ou de qualquer outra forma tentar descobrir, extrair ou obter o código-fonte, os algoritmos ou os segredos comerciais do software TIMESAFE.\u003c/li\u003e\n        \u003cli\u003eRemover, ocultar, alterar ou tornar ilegível qualquer aviso de direitos autorais, marca registrada, patente ou outros avisos de propriedade contidos no ou sobre o Serviço ou qualquer Conteúdo Protegido.\u003c/li\u003e\n        \u003cli\u003eUsar o Serviço ou qualquer parte dele para desenvolver um produto ou serviço concorrente, ou qualquer produto ou serviço que tenha características, funções ou gráficos semelhantes aos do Serviço.\u003c/li\u003e\n        \u003cli\u003eUtilizar qualquer robô, \"spider\", \"scraper\", ou outros meios automatizados para acessar o Serviço para qualquer finalidade sem nossa permissão expressa por escrito, ou contornar quaisquer medidas que possamos usar para prevenir ou restringir o acesso ao Serviço.\u003c/li\u003e\n        \u003cli\u003eInterferir ou tentar interferir no funcionamento adequado do Serviço, ou de qualquer atividade conduzida no Serviço, incluindo sobrecarregar, \"inundar\", \"bombardear\" ou \"quebrar\" nossos sistemas.\u003c/li\u003e\n        \u003cli\u003eUtilizar o Serviço para qualquer finalidade ilegal, fraudulenta ou não autorizada, ou em violação de quaisquer leis aplicáveis (incluindo, sem limitação, leis de direitos autorais, exportação e proteção de dados).\u003c/li\u003e\n        \u003cli\u003eTransmitir quaisquer worms, vírus, cavalos de Tróia, ou qualquer código de natureza destrutiva.\u003c/li\u003e\n        \u003cli\u003eFazer \"framing\" ou \"mirroring\" de qualquer parte do Serviço sem nossa autorização prévia por escrito.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eMarcas Registradas\u003c/h2\u003e\n    \u003cp\u003eO nome \"TIMESAFE\", o logotipo TIMESAFE e todos os nomes de produtos e serviços, designs, slogans e gráficos relacionados são marcas registradas, marcas de serviço ou \"trade dress\" da TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS ou de suas afiliadas. Estas marcas não podem ser usadas, copiadas ou imitadas, no todo ou em parte, sem a permissão prévia e por escrito da Empresa.\u003c/p\u003e\n    \u003cp\u003eQualquer uso não autorizado é estritamente proibido. Você não pode usar nossas marcas:\n    \u003cul\u003e\n        \u003cli\u003eEm conexão com qualquer produto ou serviço que não seja da Empresa.\u003c/li\u003e\n        \u003cli\u003eDe qualquer maneira que possa causar confusão entre os clientes.\u003c/li\u003e\n        \u003cli\u003eDe qualquer maneira que deprecie ou desacredite a Empresa.\u003c/li\u003e\n        \u003cli\u003eComo parte de seu próprio nome de empresa, marca, nome de domínio ou em metatags, texto oculto ou palavras-chave de publicidade online (ex: Google Ads) sem consentimento explícito.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eTodas as outras marcas registradas, nomes de produtos e nomes de empresas ou logotipos mencionados no Serviço são de propriedade de seus respectivos donos. A referência a quaisquer produtos, serviços, processos ou outras informações, por nome comercial, marca registrada, fabricante, fornecedor ou de outra forma, não constitui nem implica endosso, patrocínio ou recomendação por parte da Empresa.\u003c/p\u003e\n    \n    \u003ch2\u003eConteúdo de Terceiros\u003c/h2\u003e\n    \u003cp\u003eO Serviço pode conter, incorporar ou fornecer links para websites, conteúdo, dados, aplicações, serviços ou materiais de terceiros (\"Conteúdo de Terceiros\"). Você reconhece e concorda que a Empresa não é responsável por examinar ou avaliar o conteúdo, precisão, completude, pontualidade, validade, conformidade com direitos autorais, legalidade, decência, qualidade ou qualquer outro aspecto de tal Conteúdo de Terceiros.\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eA EMPRESA EXPRESSAMENTE SE ISENTA DE QUALQUER RESPONSABILIDADE POR TODO E QUALQUER CONTEÚDO DE TERCEIROS. O CONTEÚDO DE TERCEIROS E OS LINKS PARA ELE SÃO FORNECIDOS APENAS COMO UMA CONVENIÊNCIA PARA VOCÊ. SEU ACESSO E USO DE QUALQUER CONTEÚDO DE TERCEIROS SÃO FEITOS POR SUA CONTA E RISCO E ESTÃO SUJEITOS AOS TERMOS E CONDIÇÕES DE TAIS TERCEIROS.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eA Empresa não endossa nem assume qualquer responsabilidade por qualquer Conteúdo de Terceiros. Você é responsável por ler e entender os termos de uso e as políticas de privacidade que se aplicam ao seu uso de qualquer Conteúdo de Terceiros.\u003c/p\u003e\n    \n    \u003ch2\u003eDisposições Legais Gerais e Isenção de Responsabilidade\u003c/h2\u003e\n    \u003cp\u003eAs seguintes disposições são fundamentais para este acordo e se aplicam na máxima extensão permitida pela lei.\u003c/p\u003e\n\n    \u003ch3\u003eIsenção de Garantias\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eO SERVIÇO, INCLUINDO TODO O CONTEÚDO PROTEGIDO, SOFTWARE E MATERIAIS ASSOCIADOS, É FORNECIDO AO USUÁRIO \"COMO ESTÁ\" (\"AS IS\") E \"CONFORME DISPONÍVEL\" (\"AS AVAILABLE\"), COM TODAS AS FALHAS E DEFEITOS, SEM GARANTIA DE QUALQUER TIPO.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, A EMPRESA, EM SEU PRÓPRIO NOME E EM NOME DE SUAS AFILIADAS E DE SEUS RESPECTIVOS LICENCIADORES E PRESTADORES DE SERVIÇOS, EXPRESSAMENTE SE ISENTA DE TODAS AS GARANTIAS, SEJAM ELAS EXPRESSAS, IMPLÍCITAS, ESTATUTÁRIAS OU DE OUTRA FORMA, COM RELAÇÃO AO SERVIÇO, INCLUINDO TODAS AS GARANTIAS IMPLÍCITAS DE COMERCIALIZAÇÃO, ADEQUAÇÃO A UM FIM ESPECÍFICO, TÍTULO, NÃO VIOLAÇÃO E GARANTIAS QUE POSSAM SURGIR DO CURSO DE NEGOCIAÇÃO, CURSO DE DESEMPENHO, USO OU PRÁTICA COMERCIAL.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eA EMPRESA NÃO OFERECE NENHUMA GARANTIA OU COMPROMISSO E NÃO FAZ NENHUMA REPRESENTAÇÃO DE QUALQUER TIPO DE QUE O SERVIÇO ATENDERÁ ÀS SUAS NECESSIDADES, ALCANÇARÁ OS RESULTADOS PRETENDIDOS, SERÁ COMPATÍVEL OU FUNCIONARÁ COM QUALQUER OUTRO SOFTWARE, APLICATIVOS, SISTEMAS OU SERVIÇOS, OPERARÁ SEM INTERRUPÇÃO, ATENDERÁ A QUAISQUER PADRÕES DE DESEMPENHO OU CONFIABILIDADE, OU SERÁ LIVRE DE ERROS, VÍRUS OU OUTROS COMPONENTES PREJUDICIAIS, OU QUE QUAISQUER ERROS OU DEFEITOS POSSAM OU SERÃO CORRIGIDOS.\u003c/strong\u003e\u003c/p\u003e\n    \n    \u003ch3\u003eLimitação de Responsabilidade\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, EM NENHUMA CIRCUNSTÂNCIA A EMPRESA, SUAS AFILIADAS, DIRETORES, FUNCIONÁRIOS, AGENTES, FORNECEDORES OU LICENCIADORES SERÃO RESPONSÁVEIS POR QUAISQUER DANOS INDIRETOS, PUNITIVOS, INCIDENTAIS, ESPECIAIS, CONSEQUENCIAIS OU EXEMPLARES, INCLUINDO, SEM LIMITAÇÃO, DANOS POR PERDA DE LUCROS, RECEITA, DADOS, BOA VONTADE, OU OUTRAS PERDAS INTANGÍVEIS, DECORRENTES DE OU RELACIONADOS A: (A) SEU ACESSO OU USO OU INCAPACIDADE DE ACESSAR OU USAR O SERVIÇO; (B) QUALQUER CONDUTA OU CONTEÚDO DE TERCEIROS NO SERVIÇO; (C) QUALQUER CONTEÚDO OBTIDO DO SERVIÇO; E (D) ACESSO, USO OU ALTERAÇÃO NÃO AUTORIZADOS DE SUAS TRANSMISSÕES OU CONTEÚDO, SEJA BASEADO EM GARANTIA, CONTRATO, ATO ILÍCITO (INCLUINDO NEGLIGÊNCIA) OU QUALQUER OUTRA TEORIA JURÍDICA, MESMO QUE A EMPRESA TENHA SIDO AVISADA DA POSSIBILIDADE DE TAIS DANOS.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eEM NENHUM CASO A RESPONSABILIDADE AGREGADA TOTAL DA EMPRESA E SUAS AFILIADAS PERANTE VOCÊ, POR TODOS OS DANOS, PERDAS E CAUSAS DE AÇÃO DECORRENTES OU RELACIONADOS A ESTE AVISO OU AO SEU USO DO SERVIÇO, EXCEDERÁ O MAIOR VALOR ENTRE: (A) O MONTANTE TOTAL DAS TAXAS DE ASSINATURA QUE VOCÊ PAGOU À EMPRESA NOS DOZE (12) MESES IMEDIATAMENTE ANTERIORES AO EVENTO QUE DEU ORIGEM À RECLAMAÇÃO; OU (B) R$ 100,00 (CEM REAIS). AS LIMITAÇÕES DESTA SUBSEÇÃO SE APLICARÃO A QUALQUER TEORIA DE RESPONSABILIDADE, SEJA BASEADA EM GARANTIA, CONTRATO, ESTATUTO, ATO ILÍCITO (INCLUINDO NEGLIGÊNCIA) OU DE OUTRA FORMA, E MESMO QUE UMA SOLUÇÃO AQUI ESTABELECIDA FALHE EM SEU PROPÓSITO ESSENCIAL.\u003c/strong\u003e\u003c/p\u003e\n\n    \u003ch3\u003eIndenização\u003c/h3\u003e\n    \u003cp\u003eVocê concorda em defender, indenizar e isentar de responsabilidade a Empresa, suas afiliadas, diretores, funcionários, agentes, licenciadores e fornecedores de e contra todas e quaisquer reivindicações, ações, demandas, danos, perdas, responsabilidades, custos e despesas (incluindo honorários advocatícios razoáveis) decorrentes de ou relacionados a: (a) seu uso ou mau uso do Serviço; (b) sua violação de qualquer termo deste Aviso; (c) sua violação de quaisquer leis, regras ou regulamentos aplicáveis; ou (d) sua violação de quaisquer direitos de terceiros, incluindo, mas não limitado a, direitos de propriedade intelectual. A Empresa reserva-se o direito, às suas próprias custas, de assumir a defesa e o controle exclusivos de qualquer assunto sujeito a indenização por você, caso em que você cooperará totalmente com a Empresa na afirmação de quaisquer defesas disponíveis.\u003c/p\u003e\n    \n    \u003ch3\u003eLei Aplicável e Jurisdição\u003c/h3\u003e\n    \u003cp\u003eEste Aviso de Direitos Autorais e a relação entre você e a Empresa serão regidos e interpretados de acordo com as leis da República Federativa do Brasil, sem consideração aos seus princípios de conflito de leis.\u003c/p\u003e\n    \u003cp\u003eVocê e a Empresa concordam em submeter-se à jurisdição exclusiva e pessoal dos tribunais localizados no Foro da Comarca de São Paulo, Estado de São Paulo, Brasil, para resolver qualquer disputa, reivindicação ou controvérsia que surja em conexão com este Aviso. Você renuncia irrevogavelmente a qualquer objeção quanto à conveniência do foro para a condução de qualquer processo em tais tribunais.\u003c/p\u003e\n\n    \u003ch2\u003eNotificação de Violação\u003c/h2\u003e\n    \u003cp\u003eA Empresa respeita os direitos de propriedade intelectual de terceiros e espera que seus usuários façam o mesmo. É nossa política responder a notificações de suposta violação de direitos autorais que cumpram com a legislação aplicável. Se você é um proprietário de direitos autorais, ou está autorizado a agir em nome de um, e acredita que o material protegido por direitos autorais foi copiado de uma forma que constitui violação de direitos autorais e está acessível através do Serviço, você pode enviar uma notificação por escrito.\u003c/p\u003e\n    \u003cp\u003eSua notificação de violação deve incluir substancialmente o seguinte:\u003c/p\u003e\n    \u003col\u003e\n        \u003cli\u003eUma assinatura física ou eletrônica da pessoa autorizada a agir em nome do proprietário de um direito exclusivo que supostamente foi infringido.\u003c/li\u003e\n        \u003cli\u003eIdentificação da obra protegida por direitos autorais que você alega ter sido violada, ou, se várias obras protegidas por direitos autorais forem cobertas por uma única notificação, uma lista representativa de tais obras.\u003c/li\u003e\n        \u003cli\u003eIdentificação do material que se alega estar infringindo ou ser objeto de atividade infratora e que deve ser removido ou cujo acesso deve ser desativado, e informações razoavelmente suficientes para permitir que a Empresa localize o material (por exemplo, a URL).\u003c/li\u003e\n        \u003cli\u003eInformações razoavelmente suficientes para permitir que a Empresa entre em contato com você, como endereço, número de telefone e, se disponível, um endereço de e-mail.\u003c/li\u003e\n        \u003cli\u003eUma declaração de que você acredita de boa-fé que o uso do material da maneira reclamada não é autorizado pelo proprietário dos direitos autorais, seu agente ou pela lei.\u003c/li\u003e\n        \u003cli\u003eUma declaração de que as informações na notificação são precisas e, sob pena de perjúrio, que você está autorizado a agir em nome do proprietário de um direito exclusivo que supostamente foi infringido.\u003c/li\u003e\n    \u003c/ol\u003e\n    \u003cp\u003eAs notificações devem ser enviadas através do nosso formulário de contato.\u003c/p\u003e\n    \n    \u003ch3\u003ePrivacidade e Proteção de Dados (LGPD)\u003c/h3\u003e\n    \u003cp\u003eAo enviar uma notificação de violação, você reconhece e concorda que a Empresa pode processar os dados pessoais que você fornecer. Este processamento é necessário para cumprir nossas obrigações legais de investigar e responder a alegações de violação de direitos autorais. Em conformidade com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018) e suas atualizações:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eOs dados pessoais coletados durante este processo (como nome, e-mail, endereço) serão usados exclusivamente para o propósito de gerenciar a reclamação de violação.\u003c/li\u003e\n        \u003cli\u003eEm caso de incidente de segurança que possa acarretar risco ou dano relevante aos titulares, a Empresa se compromete a comunicar a Autoridade Nacional de Proteção de Dados (ANPD) e os titulares afetados em um prazo de 3 (três) dias úteis.\u003c/li\u003e\n        \u003cli\u003eSe a gestão da sua reclamação exigir a transferência internacional de seus dados (por exemplo, para um detentor de direitos ou plataforma legal sediado no exterior), tal transferência será realizada em conformidade com as regras da ANPD, incluindo a Resolução CD/ANPD nº 19/2024 sobre Cláusulas Contratuais Padrão, garantindo um nível adequado de proteção.\u003c/li\u003e\n        \u003cli\u003eVocê, como titular dos dados, tem o direito de solicitar acesso, correção, anonimização, bloqueio ou eliminação de seus dados, de acordo com os limites legais. Para exercer seus direitos ou para mais informações, consulte nossa Política de Privacidade ou entre em contato com nosso Encarregado de Proteção de Dados (DPO) através dos canais oficiais.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eContato\u003c/h2\u003e\n    \u003cp\u003ePara quaisquer perguntas sobre este Aviso de Direitos Autorais, para solicitar permissão para usar nosso Conteúdo Protegido de uma maneira não permitida por este Aviso, ou para enviar uma notificação de violação, entre em contato conosco.\u003c/p\u003e\n    \u003cp\u003ePor favor, note que não fornecemos um endereço de e-mail de contato direto nesta página. Toda a comunicação deve ser iniciada através do nosso formulário de contato oficial para garantir o rastreamento e a resposta adequados.\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eVisitando esta página em nosso site:\u003c/strong\u003e \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003e\u003cstrong\u003eInformações da Empresa:\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\n        TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003cbr\u003e\n        CNPJ: 41.648.990/0001-56\u003cbr\u003e\n        NIRE: 35237097027\u003cbr\u003e\n        ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA\u003cbr\u003e\n        SAO PAULO, SP, 01404-001, BRASIL\n    \u003c/p\u003e\n\n    \u003cp\u003eCopyright © 2026 TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS. Todos os direitos reservados.\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e","label":"Direitos Autorais","languageLabel":"Português"},{"documentType":"terms_and_conditions","language":"PT","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"pt-BR\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003ctitle\u003eTermos e Condições - TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch1\u003eTermos e Condições do TIMESAFE\u003c/h1\u003e\n    \u003cp\u003e\u003cstrong\u003eÚltima atualização:\u003c/strong\u003e 1 de outubro de 2026\u003c/p\u003e\n    \u003cp\u003ePor favor, leia estes termos e condições cuidadosamente antes de utilizar o nosso Serviço.\u003c/p\u003e\n\n    \u003ch2\u003e1. Interpretação e Definições\u003c/h2\u003e\n    \u003ch3\u003eInterpretação\u003c/h3\u003e\n    \u003cp\u003eAs palavras cuja letra inicial é maiúscula têm significados definidos nas seguintes condições. As seguintes definições terão o mesmo significado, independentemente de aparecerem no singular ou no plural.\u003c/p\u003e\n\n    \u003ch3\u003eDefinições\u003c/h3\u003e\n    \u003cp\u003ePara os fins destes Termos e Condições:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eAfiliada\u003c/strong\u003e significa uma entidade que controla, é controlada por, ou está sob controlo comum com uma parte, onde \"controlo\" significa a propriedade de 50% ou mais das ações, participações societárias ou outros títulos com direito a voto para a eleição de diretores ou outra autoridade de gestão.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAplicativo\u003c/strong\u003e significa o programa de software fornecido pela Empresa, descarregado por Você em qualquer Dispositivo eletrónico, denominado TIMESAFE.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAssinatura\u003c/strong\u003e refere-se aos serviços ou acesso ao Serviço oferecido pela Empresa a Você numa base de subscrição paga.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eConta\u003c/strong\u003e significa uma conta única criada para Você aceder ao nosso Serviço ou a partes do nosso Serviço.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eANPD\u003c/strong\u003e significa a Autoridade Nacional de Proteção de Dados do Brasil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eConteúdo do Usuário\u003c/strong\u003e refere-se a qualquer conteúdo como texto, imagens, dados, documentos ou outras informações que possam ser publicadas, carregadas, vinculadas ou de outra forma disponibilizadas por Você através do Serviço.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"a Empresa\", \"Nós\", \"Nos\" ou \"Nosso\" neste Contrato) refere-se a TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS, pessoa jurídica de direito privado, inscrita no CNPJ sob o nº 41.648.990/0001-56, com NIRE 35237097027, com sede na ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e significa qualquer dispositivo que possa aceder ao Serviço, como um computador, um telemóvel ou um tablet digital.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eLGPD\u003c/strong\u003e refere-se à Lei Geral de Proteção de Dados Pessoais (Lei nº 13.709/2018) e suas posteriores alterações e regulamentações.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePaís\u003c/strong\u003e refere-se a: Brasil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServiço\u003c/strong\u003e refere-se ao Aplicativo, ao Website, e a todas as funcionalidades, ferramentas, dados, software e outros serviços fornecidos pela Empresa.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTermos e Condições\u003c/strong\u003e (também referidos como \"Termos\") significam estes Termos e Condições que formam o acordo integral entre Você e a Empresa relativamente à utilização do Serviço.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTeste Gratuito\u003c/strong\u003e refere-se a um período de tempo limitado durante o qual o Serviço pode ser oferecido gratuitamente.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eWebsite\u003c/strong\u003e refere-se ao site da TIMESAFE, acessível em https://www.timesafe.com.br/contato.html e domínios associados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVocê\u003c/strong\u003e (e suas variações \"Seu\", \"Sua\") significa o indivíduo que acede ou utiliza o Serviço, ou a empresa, ou outra entidade legal em nome da qual tal indivíduo está a aceder ou a utilizar o Serviço, conforme aplicável.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e2. Reconhecimento\u003c/h2\u003e\n    \u003cp\u003eEstes são os Termos e Condições que regem o uso deste Serviço e o acordo que opera entre Você e a Empresa. Estes Termos e Condições estabelecem os direitos e obrigações de todos os usuários em relação ao uso do Serviço.\u003c/p\u003e\n    \u003cp\u003eO seu acesso e uso do Serviço estão condicionados à sua aceitação e conformidade com estes Termos e Condições. Estes Termos e Condições aplicam-se a todos os visitantes, usuários e outras pessoas que acedem ou utilizam o Serviço.\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eAO ACEDER, DESCARREGAR, INSTALAR OU UTILIZAR O SERVIÇO DE QUALQUER FORMA, VOCÊ RECONHECE QUE LEU, ENTENDEU E CONCORDA EM ESTAR LEGALMENTE VINCULADO A ESTES TERMOS E CONDIÇÕES E À NOSSA POLÍTICA DE PRIVACIDADE. SE VOCÊ NÃO CONCORDAR COM QUALQUER PARTE DESTES TERMOS E CONDIÇÕES, DEVERÁ CESSAR IMEDIATAMENTE TODO E QUALQUER USO DO SERVIÇO.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eVocê declara que tem mais de 18 anos de idade. A Empresa não permite, de forma consciente, que menores de 18 anos utilizem o Serviço. A utilização do Serviço por menores de 18 anos é uma violação destes Termos.\u003c/p\u003e\n    \u003cp\u003eO seu acesso e uso do Serviço também estão condicionados à sua aceitação e conformidade com a Política de Privacidade da Empresa. A nossa Política de Privacidade descreve as nossas políticas e procedimentos sobre a recolha, uso e divulgação das suas informações pessoais quando Você utiliza o Aplicativo ou o Website e informa-o sobre os seus direitos de privacidade e como a lei o protege. Por favor, leia a nossa Política de Privacidade cuidadosamente antes de utilizar o nosso Serviço.\u003c/p\u003e\n\n    \u003ch2\u003e3. Contas de Usuário\u003c/h2\u003e\n    \u003cp\u003eAo criar uma Conta connosco, Você deve fornecer-nos informações que sejam precisas, completas e atuais em todos os momentos. O não cumprimento desta obrigação constitui uma violação dos Termos, que pode resultar na rescisão imediata da sua Conta no nosso Serviço.\u003c/p\u003e\n    \u003cp\u003eVocê é responsável por salvaguardar a senha que utiliza para aceder ao Serviço e por quaisquer atividades ou ações sob a sua senha, quer a sua senha seja com o nosso Serviço ou com um serviço de terceiros. A sua senha é pessoal e intransferível.\u003c/p\u003e\n    \u003cp\u003eVocê concorda em não divulgar a sua senha a terceiros. Você deve notificar-nos imediatamente após tomar conhecimento de qualquer violação de segurança ou uso não autorizado da sua Conta. A notificação deve ser feita através dos canais de contato oficiais.\u003c/p\u003e\n    \u003cp\u003eVocê não pode usar como nome de usuário o nome de outra pessoa ou entidade ou que não esteja legalmente disponível para uso, um nome ou marca comercial que esteja sujeito a quaisquer direitos de outra pessoa ou entidade que não Você, sem a devida autorização, ou um nome que seja de outra forma ofensivo, vulgar ou obsceno. Reservamo-nos o direito de recusar o serviço, encerrar contas, remover ou editar conteúdo a nosso exclusivo critério.\u003c/p\u003e\n\n    \u003ch2\u003e4. Pedidos de Bens/Serviços\u003c/h2\u003e\n    \u003cp\u003eAo fazer um pedido de bens ou serviços (como uma Assinatura) através do Serviço, Você garante que tem a capacidade legal para celebrar contratos vinculativos.\u003c/p\u003e\n    \u003cp\u003eSe desejar fazer um pedido, poderá ser-lhe solicitado que forneça certas informações relevantes para o seu Pedido, incluindo, sem limitação, o seu nome, o seu email, o seu número de telefone, as informações do seu cartão de crédito, o endereço de faturação e as informações de envio.\u003c/p\u003e\n    \u003cp\u003eVocê declara e garante que: (i) tem o direito legal de usar qualquer(quaisquer) cartão(ões) de crédito ou débito ou outro(s) método(s) de pagamento em conexão com qualquer Pedido; e que (ii) as informações que nos fornece são verdadeiras, corretas e completas.\u003c/p\u003e\n    \u003cp\u003eAo submeter tais informações, Você concede-nos o direito de fornecer as informações a terceiros processadores de pagamento para fins de facilitação da conclusão do seu Pedido.\u003c/p\u003e\n    \u003cp\u003eReservamo-nos o direito de recusar ou cancelar o seu Pedido a qualquer momento por certas razões, incluindo mas não limitado a: disponibilidade do produto/serviço, erros na descrição ou preços, erro no seu Pedido, ou suspeita de fraude ou transação não autorizada ou ilegal. A recusa ou cancelamento será comunicado a Você.\u003c/p\u003e\n\n    \u003ch2\u003e5. Assinaturas\u003c/h2\u003e\n    \u003ch3\u003ePeríodo de Assinatura\u003c/h3\u003e\n    \u003cp\u003eO Serviço ou algumas partes do Serviço estão disponíveis apenas com uma Assinatura paga. Você será cobrado antecipadamente de forma recorrente e periódica (como mensal ou anual), dependendo do tipo de plano de Assinatura que selecionar ao comprar a Assinatura.\u003c/p\u003e\n    \u003cp\u003eNo final de cada período, a sua Assinatura será renovada automaticamente sob exatamente as mesmas condições, a menos que Você a cancele ou a Empresa a cancele. A renovação automática garante a continuidade do seu acesso ao Serviço.\u003c/p\u003e\n\n    \u003ch3\u003eCancelamento de Assinatura\u003c/h3\u003e\n    \u003cp\u003eVocê pode cancelar a renovação da sua Assinatura através da página de configurações da sua Conta ou entrando em contato connosco através do link de contato oficial. Você não receberá um reembolso pelas taxas que já pagou pelo seu período de Assinatura atual e poderá aceder ao Serviço até o final do seu período de Assinatura atual.\u003c/p\u003e\n\n    \u003ch3\u003eFaturação\u003c/h3\u003e\n    \u003cp\u003eVocê deverá fornecer à Empresa informações de faturação precisas e completas, incluindo nome completo, endereço, estado, CEP, número de telefone e informações de um método de pagamento válido. Caso a faturação automática falhe por qualquer motivo, a Empresa emitirá uma fatura eletrónica indicando que Você deve proceder manualmente, dentro de um determinado prazo, com o pagamento integral correspondente ao período de faturação indicado na fatura. A falha no pagamento pode levar à suspensão ou rescisão do seu acesso ao Serviço.\u003c/p\u003e\n\n    \u003ch3\u003eAlterações de Preço\u003c/h3\u003e\n    \u003cp\u003eA Empresa, a seu exclusivo critério e a qualquer momento, pode modificar as taxas de Assinatura. Qualquer alteração na taxa de Assinatura entrará em vigor no final do período de Assinatura então vigente. A Empresa fornecerá a Você um aviso prévio razoável de qualquer alteração nas taxas de Assinatura para lhe dar a oportunidade de rescindir a sua Assinatura antes que tal alteração se torne efetiva. O seu uso continuado do Serviço após a alteração da taxa de Assinatura entrar em vigor constitui a sua concordância em pagar o valor da taxa de Assinatura modificada.\u003c/p\u003e\n\n    \u003ch3\u003eReembolsos\u003c/h3\u003e\n    \u003cp\u003eExceto quando exigido por lei, as taxas de Assinatura pagas não são reembolsáveis. Certos pedidos de reembolso para Assinaturas podem ser considerados pela Empresa caso a caso e concedidos a critério exclusivo da Empresa. A análise de um pedido de reembolso não garante a sua aprovação.\u003c/p\u003e\n\n    \u003ch3\u003eTeste Gratuito\u003c/h3\u003e\n    \u003cp\u003eA Empresa pode, a seu exclusivo critério, oferecer uma Assinatura com um Teste Gratuito por um período de tempo limitado. Você pode ser obrigado a inserir as suas informações de faturação para se inscrever no Teste Gratuito. Se Você inserir as suas informações de faturação ao se inscrever para um Teste Gratuito, não será cobrado pela Empresa até que o Teste Gratuito tenha expirado. No último dia do período de Teste Gratuito, a menos que Você tenha cancelado a sua Assinatura, ser-lhe-ão cobradas automaticamente as taxas de Assinatura aplicáveis para o tipo de Assinatura que selecionou.\u003c/p\u003e\n    \u003cp\u003eA qualquer momento e sem aviso prévio, a Empresa reserva-se o direito de (i) modificar os termos e condições da oferta de Teste Gratuito, ou (ii) cancelar tal oferta de Teste Gratuito.\u003c/p\u003e\n\n    \u003ch2\u003e6. Conteúdo do Usuário\u003c/h2\u003e\n    \u003cp\u003eO nosso Serviço permite que Você publique, vincule, armazene, partilhe e de outra forma disponibilize certas informações, textos, gráficos, vídeos ou outro material (\"Conteúdo do Usuário\"). Você é o único responsável pelo Conteúdo do Usuário que publica no ou através do Serviço, incluindo a sua legalidade, confiabilidade e adequação.\u003c/p\u003e\n    \u003cp\u003eAo publicar Conteúdo do Usuário no ou através do Serviço, Você declara e garante que: (i) o Conteúdo do Usuário é seu (Você é o proprietário) e/ou tem o direito de usá-lo e o direito de nos conceder os direitos e a licença conforme previsto nestes Termos, e (ii) a publicação do seu Conteúdo do Usuário no ou através do Serviço não viola os direitos de privacidade, direitos de publicidade, direitos autorais, direitos contratuais ou quaisquer outros direitos de qualquer pessoa ou entidade.\u003c/p\u003e\n    \u003cp\u003eVocê retém todos os seus direitos sobre qualquer Conteúdo do Usuário que submeta, publique ou exiba no ou através do Serviço e é responsável por proteger esses direitos. Não assumimos qualquer responsabilidade e não nos responsabilizamos por Conteúdo do Usuário que Você ou qualquer terceiro publique no ou através do Serviço.\u003c/p\u003e\n    \u003cp\u003eNo entanto, ao publicar Conteúdo do Usuário utilizando o Serviço, Você concede-nos uma licença mundial, não exclusiva, isenta de royalties, sublicenciável e transferível para usar, modificar, executar publicamente, exibir publicamente, reproduzir e distribuir tal Conteúdo do Usuário no e através do Serviço. Você concorda que esta licença inclui o direito de nós disponibilizarmos o seu Conteúdo do Usuário a outros usuários do Serviço, que também podem usar o seu Conteúdo do Usuário sujeito a estes Termos.\u003c/p\u003e\n    \u003cp\u003eA Empresa tem o direito, mas não a obrigação, de monitorizar, editar ou remover todo o Conteúdo do Usuário fornecido pelos usuários. Além disso, a Empresa reserva-se o direito de tomar as medidas que julgar necessárias, incluindo a remoção de Conteúdo do Usuário e a rescisão de Contas de usuários que violem a lei ou estes Termos.\u003c/p\u003e\n\n    \u003ch2\u003e7. Propriedade Intelectual\u003c/h2\u003e\n    \u003cp\u003eO Serviço e o seu conteúdo original (excluindo o Conteúdo do Usuário), características e funcionalidades são e permanecerão propriedade exclusiva da TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS e dos seus licenciadores. O Serviço é protegido por leis de direitos autorais, marcas registadas e outras leis do Brasil e de países estrangeiros.\u003c/p\u003e\n    \u003cp\u003eAs nossas marcas comerciais, nomes comerciais (incluindo TIMESAFE) e imagem comercial não podem ser usadas em conexão com qualquer produto ou serviço sem o consentimento prévio por escrito da Empresa. Você não pode copiar, modificar, distribuir, vender ou alugar qualquer parte do nosso Serviço ou software incluído, nem pode fazer engenharia reversa ou tentar extrair o código-fonte desse software, exceto se as leis proibirem essas restrições ou se tiver a nossa permissão por escrito.\u003c/p\u003e\n    \u003cp\u003eA licença concedida a Você é estritamente para aceder e usar o Serviço de acordo com estes Termos. Nenhum outro direito ou licença, expresso ou implícito, é concedido.\u003c/p\u003e\n\n    \u003ch2\u003e8. Links para Outros Sites\u003c/h2\u003e\n    \u003cp\u003eO nosso Serviço pode conter links para websites ou serviços de terceiros que não são propriedade nem controlados pela Empresa.\u003c/p\u003e\n    \u003cp\u003eA Empresa não tem controlo e não assume qualquer responsabilidade pelo conteúdo, políticas de privacidade ou práticas de quaisquer websites ou serviços de terceiros. Você reconhece e concorda que a Empresa não será responsável, direta ou indiretamente, por qualquer dano ou perda causada ou alegadamente causada por ou em conexão com o uso ou confiança em qualquer conteúdo, bens ou serviços disponíveis em ou através de tais websites ou serviços.\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eRECOMENDAMOS FORTEMENTE QUE VOCÊ LEIA OS TERMOS E CONDIÇÕES E AS POLÍTICAS DE PRIVACIDADE DE QUAISQUER WEBSITES OU SERVIÇOS DE TERCEIROS QUE VISITE.\u003c/strong\u003e\u003c/p\u003e\n\n    \u003ch2\u003e9. Rescisão\u003c/h2\u003e\n    \u003cp\u003ePodemos rescindir ou suspender a sua Conta e barrar o acesso ao Serviço imediatamente, sem aviso prévio ou responsabilidade, a nosso exclusivo critério, por qualquer motivo, incluindo, sem limitação, se Você violar estes Termos e Condições.\u003c/p\u003e\n    \u003cp\u003eSe Você desejar rescindir a sua Conta, pode simplesmente descontinuar o uso do Serviço ou seguir o procedimento de cancelamento de Assinatura, se aplicável.\u003c/p\u003e\n    \u003cp\u003eApós a rescisão, o seu direito de usar o Serviço cessará imediatamente. Se a sua Conta for rescindida, reservamo-nos o direito de remover ou apagar qualquer Conteúdo do Usuário associado à sua Conta, sem qualquer responsabilidade para com Você.\u003c/p\u003e\n    \u003cp\u003eTodas as disposições dos Termos que, por sua natureza, devam sobreviver à rescisão, sobreviverão à rescisão, incluindo, sem limitação, disposições de propriedade, isenções de garantia, indemnização e limitações de responsabilidade.\u003c/p\u003e\n\n    \u003ch2\u003e10. Limitação de Responsabilidade\u003c/h2\u003e\n    \u003cp\u003eNÃO OBSTANTE QUAISQUER DANOS QUE VOCÊ POSSA INCORRER, A RESPONSABILIDADE TOTAL DA EMPRESA E DE QUALQUER UM DOS SEUS FORNECEDORES SOB QUALQUER DISPOSIÇÃO DESTES TERMOS E O SEU RECURSO EXCLUSIVO PARA TUDO O QUE FOI DITO ACIMA SERÁ LIMITADO AO MAIOR VALOR ENTRE: (A) O MONTANTE EFETIVAMENTE PAGO POR VOCÊ ATRAVÉS DO SERVIÇO NOS 12 (DOZE) MESES ANTERIORES AO EVENTO QUE DEU ORIGEM À RECLAMAÇÃO; OU (B) R$ 100,00 (CEM REAIS), CASO VOCÊ NÃO TENHA ADQUIRIDO NADA ATRAVÉS DO SERVIÇO.\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, EM NENHUMA HIPÓTESE A EMPRESA OU SEUS FORNECEDORES, DIRETORES, FUNCIONÁRIOS, AGENTES OU AFILIADAS SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS OU CONSEQUENCIAIS DE QUALQUER NATUREZA (INCLUINDO, MAS NÃO SE LIMITANDO A, DANOS POR PERDA DE LUCROS, PERDA DE DADOS OU OUTRAS INFORMAÇÕES, POR INTERRUPÇÃO DE NEGÓCIOS, POR DANOS PESSOAIS, PERDA DE PRIVACIDADE DECORRENTE DE OU DE QUALQUER FORMA RELACIONADA AO USO OU INCAPACIDADE DE USAR O SERVIÇO, SOFTWARE DE TERCEIROS E/OU HARDWARE DE TERCEIROS USADO COM O SERVIÇO, OU DE OUTRA FORMA EM CONEXÃO COM QUALQUER DISPOSIÇÃO DESTES TERMOS), MESMO QUE A EMPRESA OU QUALQUER FORNECEDOR TENHA SIDO AVISADO DA POSSIBILIDADE DE TAIS DANOS E MESMO QUE A SOLUÇÃO FALHE NO SEU PROPÓSITO ESSENCIAL.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eAlgumas jurisdições, como o Brasil sob o Código de Defesa do Consumidor, não permitem a exclusão de certas garantias ou a limitação de responsabilidade por danos incidentais ou consequenciais, o que significa que algumas das limitações acima podem não se aplicar a Você se for classificado como consumidor. Nesses casos, a responsabilidade da Empresa será limitada à extensão máxima permitida por lei.\u003c/p\u003e\n\n    \u003ch2\u003e11. Isenção de Garantias \"COMO ESTÁ\" e \"CONFORME DISPONÍVEL\"\u003c/h2\u003e\n    \u003cp\u003eO SERVIÇO É FORNECIDO A VOCÊ \"COMO ESTÁ\" E \"CONFORME DISPONÍVEL\", COM TODAS AS FALHAS E DEFEITOS, SEM GARANTIA DE QUALQUER TIPO. NA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, A EMPRESA, EM SEU PRÓPRIO NOME E EM NOME DE SUAS AFILIADAS E DE SEUS RESPECTIVOS LICENCIADORES E PRESTADORES DE SERVIÇOS, RENUNCIA EXPRESSAMENTE A TODAS AS GARANTIAS, SEJAM EXPRESSAS, IMPLÍCITAS, LEGAIS OU DE OUTRA FORMA, COM RELAÇÃO AO SERVIÇO, INCLUINDO TODAS AS GARANTIAS IMPLÍCITAS DE COMERCIALIZAÇÃO, ADEQUAÇÃO A UM FIM ESPECÍFICO, TÍTULO E NÃO VIOLAÇÃO, E GARANTIAS QUE POSSAM SURGIR DO CURSO DE NEGOCIAÇÃO, CURSO DE DESEMPENHO, USO OU PRÁTICA COMERCIAL.\u003c/p\u003e\n    \u003cp\u003eSEM LIMITAÇÃO AO EXPOSTO, A EMPRESA NÃO OFERECE NENHUMA GARANTIA OU COMPROMISSO, E NÃO FAZ NENHUMA DECLARAÇÃO DE QUALQUER TIPO DE QUE O SERVIÇO ATENDERÁ ÀS SUAS EXIGÊNCIAS, ATINGIRÁ QUAISQUER RESULTADOS PRETENDIDOS, SERÁ COMPATÍVEL OU FUNCIONARÁ COM QUALQUER OUTRO SOFTWARE, APLICATIVOS, SISTEMAS OU SERVIÇOS, OPERARÁ SEM INTERRUPÇÃO, ATENDERÁ A QUAISQUER PADRÕES DE DESEMPENHO OU CONFIABILIDADE OU SERÁ LIVRE DE ERROS, OU QUE QUAISQUER ERROS OU DEFEITOS POSSAM OU SERÃO CORRIGIDOS.\u003c/p\u003e\n    \u003cp\u003eSEM LIMITAR O PRECEDENTE, NEM A EMPRESA NEM QUALQUER UM DOS SEUS PROVEDORES FAZ QUALQUER REPRESENTAÇÃO OU GARANTIA DE QUALQUER TIPO, EXPRESSA OU IMPLÍCITA: (I) QUANTO À OPERAÇÃO OU DISPONIBILIDADE DO SERVIÇO, OU DAS INFORMAÇÕES, CONTEÚDO E MATERIAIS OU PRODUTOS INCLUÍDOS NELE; (II) QUE O SERVIÇO SERÁ ININTERRUPTO OU LIVRE DE ERROS; (III) QUANTO À PRECISÃO, CONFIABILIDADE OU ATUALIDADE DE QUALQUER INFORMAÇÃO OU CONTEÚDO FORNECIDO ATRAVÉS DO SERVIÇO; OU (IV) QUE O SERVIÇO, SEUS SERVIDORES, O CONTEÚDO OU E-MAILS ENVIADOS PELA EMPRESA OU EM NOME DA EMPRESA ESTÃO LIVRES DE VÍRUS, SCRIPTS, CAVALOS DE TRÓIA, WORMS, MALWARE, BOMBAS-RELÓGIO OU OUTROS COMPONENTES NOCIVOS.\u003c/p\u003e\n    \u003ch3\u003eAssunção de Risco\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eVOCÊ ASSUME TOTAL RESPONSABILIDADE E RISCO PELO SEU USO DO SERVIÇO E DA INTERNET. O SERVIÇO É FORNECIDO \"COMO ESTÁ\". A EMPRESA NÃO SERÁ RESPONSÁVEL POR QUAISQUER CUSTOS OU DANOS DECORRENTES DIRETA OU INDIRETAMENTE DE TAL USO. É SUA ÚNICA RESPONSABILIDADE AVALIAR A PRECISÃO, INTEGRIDADE E UTILIDADE DE TODAS AS OPINIÕES, CONSELHOS, SERVIÇOS, MERCADORIAS E OUTRAS INFORMAÇÕES FORNECIDAS ATRAVÉS DO SERVIÇO.\u003c/strong\u003e\u003c/p\u003e\n\n    \u003ch2\u003e12. Lei Aplicável e Jurisdição\u003c/h2\u003e\n    \u003cp\u003eEstes Termos e o seu uso do Serviço serão regidos e interpretados de acordo com as leis da República Federativa do Brasil, excluindo as suas regras de conflitos de leis.\u003c/p\u003e\n    \u003cp\u003ePara todas as disputas ou controvérsias decorrentes ou relacionadas a estes Termos, ao Serviço ou à Política de Privacidade, as partes concordam em submeter-se à jurisdição exclusiva do Foro da Comarca de São Paulo, Estado de São Paulo, Brasil. As partes renunciam, de forma irrevogável e irretratável, a qualquer outra jurisdição, por mais privilegiada que seja ou venha a ser.\u003c/p\u003e\n\n    \u003ch2\u003e13. Resolução de Disputas\u003c/h2\u003e\n    \u003cp\u003eSe Você tiver qualquer preocupação ou disputa sobre o Serviço, Você concorda em primeiro tentar resolver a disputa informalmente, entrando em contato com a Empresa através dos canais oficiais. A Empresa envidará esforços razoáveis para resolver a questão amigavelmente.\u003c/p\u003e\n    \u003cp\u003eSe uma solução amigável não for alcançada dentro de 60 (sessenta) dias a partir do início da comunicação, qualquer uma das partes poderá levar a disputa ao sistema judiciário, sujeito à jurisdição exclusiva definida na Seção 12 destes Termos.\u003c/p\u003e\n\n    \u003ch2\u003e14. Disposições Gerais\u003c/h2\u003e\n    \u003ch3\u003eConformidade com a LGPD e Proteção de Dados\u003c/h3\u003e\n    \u003cp\u003eA Empresa compromete-se a cumprir a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018) e todas as regulamentações aplicáveis emitidas pela ANPD.\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eDireitos dos Titulares de Dados:\u003c/strong\u003e Você, como titular de dados pessoais, tem o direito de solicitar à Empresa: a confirmação da existência de tratamento; o acesso aos dados; a correção de dados incompletos, inexatos ou desatualizados; a anonimização, bloqueio ou eliminação de dados desnecessários ou excessivos; a portabilidade dos seus dados a outro fornecedor de serviço; a eliminação dos dados tratados com o seu consentimento; a informação sobre as entidades com as quais a Empresa realizou uso compartilhado de dados; a informação sobre a possibilidade de não fornecer consentimento e sobre as consequências da negativa; e a revogação do consentimento. Para exercer os seus direitos, entre em contato connosco através do nosso link de contato.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eNotificação de Incidentes de Segurança:\u003c/strong\u003e Em caso de um incidente de segurança que possa acarretar risco ou dano relevante aos titulares, a Empresa compromete-se a comunicar a ocorrência à ANPD e aos titulares de dados afetados em um prazo de 3 (três) dias úteis a contar da data de conhecimento do incidente, em conformidade com as regulamentações vigentes.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTransferências Internacionais de Dados:\u003c/strong\u003e O Serviço pode ser oferecido em uma base global. Caso seja necessário transferir seus dados pessoais para fora do Brasil, a Empresa garante que tais transferências serão realizadas em conformidade com a LGPD, utilizando mecanismos aprovados pela ANPD, como Cláusulas Contratuais Padrão (conforme Resolução CD/ANPD nº 19/2024), para garantir um nível de proteção de dados adequado.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEncarregado de Proteção de Dados (DPO):\u003c/strong\u003e A Empresa designou um Encarregado de Proteção de Dados, que pode ser contatado para esclarecer dúvidas sobre o tratamento de seus dados pessoais através do formulário disponível em nosso link de contato.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003eIndenização\u003c/h3\u003e\n    \u003cp\u003eVocê concorda em indenizar, defender e isentar a Empresa e suas Afiliadas, e seus respectivos diretores, funcionários, agentes, licenciadores e fornecedores, de e contra todas e quaisquer reclamações, perdas, despesas, danos e custos, incluindo honorários advocatícios razoáveis, resultantes de ou decorrentes de: (a) seu uso e acesso ao Serviço; (b) qualquer violação destes Termos por Você; (c) qualquer Conteúdo do Usuário que Você publique, submeta ou transmita através do Serviço; (d) sua violação de qualquer lei, regra ou regulamento aplicável; ou (e) sua violação de quaisquer direitos de terceiros, incluindo, sem limitação, qualquer direito de propriedade intelectual, publicidade ou privacidade.\u003c/p\u003e\n\n    \u003ch3\u003eDivisibilidade\u003c/h3\u003e\n    \u003cp\u003eSe qualquer disposição destes Termos for considerada inexequível ou inválida, tal disposição será alterada e interpretada para atingir os objetivos de tal disposição na maior medida possível sob a lei aplicável, e as disposições restantes continuarão em pleno vigor e efeito.\u003c/p\u003e\n\n    \u003ch3\u003eRenúncia\u003c/h3\u003e\n    \u003cp\u003eExceto conforme previsto neste documento, a falha em exercer um direito ou em exigir o cumprimento de uma obrigação sob estes Termos não afetará a capacidade de uma parte de exercer tal direito ou exigir tal cumprimento em qualquer momento posterior, nem a renúncia de uma violação constituirá uma renúncia de qualquer violação subsequente.\u003c/p\u003e\n    \n    \u003ch3\u003eAlterações a Estes Termos e Condições\u003c/h3\u003e\n    \u003cp\u003eReservamo-nos o direito, a nosso exclusivo critério, de modificar ou substituir estes Termos a qualquer momento. Se uma revisão for material, faremos esforços razoáveis para fornecer um aviso de pelo menos 30 dias antes de quaisquer novos termos entrarem em vigor. O que constitui uma alteração material será determinado a nosso exclusivo critério. Ao continuar a aceder ou usar o nosso Serviço após essas revisões se tornarem efetivas, Você concorda em estar vinculado aos termos revistos.\u003c/p\u003e\n\n    \u003ch3\u003eAcordo Integral\u003c/h3\u003e\n    \u003cp\u003eEstes Termos e Condições, juntamente com a nossa Política de Privacidade, constituem o acordo integral entre Você e a Empresa em relação ao Serviço e substituem todos os acordos, comunicações e propostas anteriores ou contemporâneas, sejam orais ou escritas, entre Você e a Empresa.\u003c/p\u003e\n\n    \u003ch3\u003eForça Maior\u003c/h3\u003e\n    \u003cp\u003eA Empresa não será responsável por qualquer falha ou atraso no desempenho de suas obrigações aqui estipuladas, se tal falha ou atraso for causado por eventos fora de seu controle razoável, incluindo, mas não limitado a, atos de Deus, guerra, terrorismo, motins, embargos, atos de autoridades civis ou militares, incêndios, inundações, acidentes, pandemias, greves ou escassez de meios de transporte, combustível, energia, mão de obra ou materiais.\u003c/p\u003e\n\n    \u003ch2\u003e15. Contato\u003c/h2\u003e\n    \u003cp\u003eSe tiver alguma dúvida sobre estes Termos e Condições, pode entrar em contato connosco:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eVisitando esta página no nosso website: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.t
