HAGAMOS.\n    \u003c/p\u003e\n\n    \u003ch2\u003e1. Interpretación y Definiciones\u003c/h2\u003e\n    \u003ch3\u003eInterpretación\u003c/h3\u003e\n    \u003cp\u003eLas palabras cuya letra inicial está en mayúscula tienen significados definidos en las siguientes condiciones. Las siguientes definiciones tendrán el mismo significado independientemente de que aparezcan en singular o en plural.\u003c/p\u003e\n\n    \u003ch3\u003eDefiniciones\u003c/h3\u003e\n    \u003cp\u003ePara los fines de esta Exención de Responsabilidad:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"la Empresa\", \"Nosotros\", \"Nuestro\" en este documento) se refiere a \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, con CNPJ 41.648.990/0001-56, NIRE 35237097027, y domicilio en ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL. También opera bajo los nombres comerciales de TIMESAFE.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServicio\u003c/strong\u003e se refiere colectivamente al Aplicativo, el Sitio Web y cualquier otro software, producto o servicio relacionado proporcionado por la Empresa.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e (o \"Usuario\") significa la persona física que accede o utiliza el Servicio, o la empresa u otra entidad legal en nombre de la cual dicha persona accede o utiliza el Servicio, según corresponda.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSitio Web\u003c/strong\u003e se refiere al sitio web de TIMESAFE, accesible principalmente a través del dominio relacionado con nuestro formulario de contacto en \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e y otros sitios operados por la Empresa.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAplicativo\u003c/strong\u003e se refiere al programa de software proporcionado por la Empresa, denominado \u003cstrong\u003eTIMESAFE\u003c/strong\u003e, descargado por Usted en cualquier dispositivo.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eContenido\u003c/strong\u003e se refiere a contenido como texto, imágenes, u otra información que puede ser publicada, cargada, enlazada o puesta a disposición por Usted, independientemente de la forma de ese contenido.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eLGPD\u003c/strong\u003e se refiere a la Ley General de Protección de Datos de Brasil (Lei Nº 13.709/2018).\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eANPD\u003c/strong\u003e se refiere a la Autoridade Nacional de Proteção de Dados, la autoridad de supervisión de protección de datos de Brasil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTitular de los Datos\u003c/strong\u003e se refiere a la persona física a quien se refieren los datos personales que son objeto de tratamiento.\u003c/li\u003e\n    ]    \u003cli\u003e\u003cstrong\u003eDatos Personales\u003c/strong\u003e tiene el significado que se le atribuye en la LGPD.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e2. Exención de Responsabilidad General\u003c/h2\u003e\n    \u003cp\u003eLa información y las funcionalidades contenidas en el Servicio se proporcionan únicamente con fines de información general y para facilitar la protección y gestión de documentos digitales según las capacidades del software. La Empresa no asume ninguna responsabilidad por errores u omisiones en el contenido del Servicio. El uso que Usted haga del Servicio es bajo su propio y exclusivo riesgo.\u003c/p\u003e\n    \u003cp\u003e\n        EN NINGÚN CASO LA EMPRESA SERÁ RESPONSABLE DE NINGÚN DAÑO ESPECIAL, DIRECTO, INDIRECTO, CONSECUENTE O INCIDENTAL, NI DE DAÑOS DE NINGÚN TIPO, YA SEA EN UNA ACCIÓN CONTRACTUAL, NEGLIGENCIA U OTRO AGRAVIO, QUE SURJA DE O EN RELACIÓN CON EL USO DEL SERVICIO O EL CONTENIDO DEL SERVICIO. LA EMPRESA SE RESERVA EL DERECHO DE REALIZAR ADICIONES, ELIMINACIONES O MODIFICACIONES AL CONTENIDO DEL SERVICIO EN CUALQUIER MOMENTO Y SIN PREVIO AVISO.\n    \u003c/p\u003e\n    \u003cp\u003eLa Empresa no garantiza que el Servicio esté libre de virus, malware, troyanos u otros componentes dañinos. Usted es el único responsable de implementar procedimientos y puntos de control suficientes para satisfacer sus requisitos particulares de seguridad antivirus y precisión de la entrada y salida de datos, y de mantener un medio externo a nuestro Servicio para la reconstrucción de cualquier dato perdido.\u003c/p\u003e\n\n    \u003ch2\u003e3. Suscripciones y Pagos (Servicio Pagado)\u003c/h2\u003e\n    \u003ch3\u003ePeríodo de Suscripción\u003c/h3\u003e\n    \u003cp\u003eEl Servicio, o partes del mismo, están disponibles únicamente con una Suscripción de pago. Se le facturará por adelantado de forma recurrente y periódica (ya sea mensual o anualmente), según el tipo de plan de suscripción que seleccione al comprar la Suscripción.\u003c/p\u003e\n    \u003cp\u003eAl final de cada período, su Suscripción se renovará automáticamente bajo exactamente las mismas condiciones, a menos que Usted la cancele o la Empresa la cancele. La renovación automática garantiza un servicio ininterrumpido.\u003c/p\u003e\n    \n    \u003ch3\u003eCancelación de la Suscripción\u003c/h3\u003e\n    \u003cp\u003eUsted puede cancelar la renovación de su Suscripción a través de la configuración de su cuenta dentro del Servicio o poniéndose en contacto con el soporte de la Empresa a través del enlace de contacto proporcionado. NO RECIBIRÁ UN REEMBOLSO POR LAS TARIFAS YA PAGADAS POR SU PERÍODO DE SUSCRIPCIÓN ACTUAL. Usted continuará teniendo acceso al Servicio hasta el final de su período de suscripción actual.\u003c/p\u003e\n\n    \u003ch3\u003eCambios de Precio\u003c/h3\u003e\n    \u003cp\u003eLa Empresa, a su entera discreción y en cualquier momento, puede modificar las tarifas de Suscripción. Cualquier cambio en la tarifa de Suscripción entrará en vigor al final del período de Suscripción vigente en ese momento. La Empresa le proporcionará un aviso previo razonable de cualquier cambio en las tarifas de Suscripción para darle la oportunidad de cancelar su Suscripción antes de que dicho cambio entre en vigor. Su uso continuado del Servicio después de que el cambio de la tarifa de Suscripción entre en vigor constituye su acuerdo de pagar el monto de la tarifa de Suscripción modificada.\u003c/p\u003e\n    \n    \u003ch3\u003eReembolsos\u003c/h3\u003e\n    \u003cp\u003eSALVO CUANDO LO EXIJA LA LEY APLICABLE, LAS TARIFAS DE SUSCRIPCIÓN PAGADAS NO SON REEMBOLSABLES. Ciertas solicitudes de reembolso pueden ser consideradas por la Empresa caso por caso y otorgadas a la entera discreción de la Empresa.\u003c/p\u003e\n    \n    \u003ch3\u003ePrueba Gratuita\u003c/h3\u003e\n    \u003cp\u003eLa Empresa puede, a su entera discreción, ofrecer una Suscripción con una prueba gratuita por un período de tiempo limitado. Es posible que se le solicite que ingrese su información de facturación para registrarse en la prueba gratuita. Si ingresa su información de facturación al registrarse para una prueba gratuita, no se le cobrará hasta que la prueba gratuita haya expirado. En el último día del período de prueba gratuita, a menos que haya cancelado su Suscripción, se le cobrarán automáticamente las tarifas de Suscripción aplicables para el tipo de Suscripción que haya seleccionado. En cualquier momento y sin previo aviso, la Empresa se reserva el derecho de (i) modificar los términos de la oferta de prueba gratuita, o (ii) cancelar dicha oferta de prueba gratuita.\u003c/p\u003e\n\n    \u003ch2\u003e4. Exención de Responsabilidad de Enlaces Externos\u003c/h2\u003e\n    \u003cp\u003eEl Servicio puede contener enlaces a sitios web externos que no son proporcionados, mantenidos ni están afiliados de ninguna manera con la Empresa. La inclusión de cualquier enlace no implica la aprobación, garantía o recomendación por parte de la Empresa.\u003c/p\u003e\n    \u003cp\u003eTenga en cuenta que la Empresa no garantiza la exactitud, relevancia, actualidad o integridad de ninguna información en estos sitios web externos. La Empresa no se hace responsable del contenido, las políticas de privacidad o las prácticas de los sitios o servicios de terceros. Usted reconoce y acepta que la Empresa no será responsable, directa o indirectamente, por cualquier daño o pérdida causada o presuntamente causada por o en conexión con el uso o la confianza en dicho contenido, bienes o servicios disponibles en o a través de dichos sitios o servicios.\u003c/p\u003e\n\n    \u003ch2\u003e5. Exención de Responsabilidad por Errores y Omisiones\u003c/h2\u003e\n    \u003cp\u003eLa información proporcionada por el Servicio es solo para orientación general sobre asuntos de interés. Aunque la Empresa toma todas las precauciones para asegurar que el contenido del Servicio sea actual y preciso, pueden ocurrir errores. Además, dada la naturaleza cambiante de las leyes, reglas y regulaciones, puede haber retrasos, omisiones o inexactitudes en la información contenida en el Servicio.\u003c/p\u003e\n    \u003cp\u003eLa Empresa no es responsable de ningún error u omisión, ni de los resultados obtenidos del uso de esta información. Toda la información en el Servicio se proporciona \"tal cual\", sin garantía de integridad, exactitud, puntualidad o de los resultados obtenidos del uso de esta información.\u003c/p\u003e\n\n    \u003ch2\u003e6. Exención de Responsabilidad de Uso Legítimo\u003c/h2\u003e\n    \u003cp\u003eLa Empresa puede utilizar material protegido por derechos de autor que no siempre ha sido específicamente autorizado por el propietario de los derechos de autor. La Empresa pone a disposición dicho material para fines de crítica, comentario, reportaje de noticias, enseñanza, becas o investigación, según lo permitido por las leyes de derechos de autor aplicables, como la Ley de Derechos de Autor de Brasil (Ley N° 9.610/98).\u003c/p\u003e\n    \u003cp\u003eLa Empresa cree que esto constituye un uso permitido de cualquier material protegido por derechos de autor. Sin embargo, si Usted desea utilizar material protegido por derechos de autor del Servicio para sus propios fines que van más allá del uso permitido, Usted debe obtener el permiso del propietario de los derechos de autor. La Empresa no ofrece ninguna garantía ni representación con respecto a su derecho a utilizar dicho material.\u003c/p\u003e\n\n    \u003ch2\u003e7. Exención de Responsabilidad de Opiniones Expresadas\u003c/h2\u003e\n    \u003cp\u003eEl Servicio puede contener puntos de vista y opiniones que son de los autores y no reflejan necesariamente la política o posición oficial de ningún otro autor, agencia, organización, empleador o empresa, incluida la Empresa. Esto incluye cualquier Contenido generado o publicado por los usuarios.\u003c/p\u003e\n    \u003cp\u003eLos comentarios y otro Contenido publicado por los usuarios son de su exclusiva responsabilidad. Los usuarios asumirán toda la responsabilidad, obligación y culpa por cualquier difamación, violación de derechos de autor o litigio que resulte de algo escrito en o como resultado directo de algo escrito en un comentario o Contenido. La Empresa no es responsable de ningún comentario o Contenido publicado por los usuarios y se reserva el derecho, a su entera discreción, de eliminar cualquier comentario o Contenido por cualquier motivo y sin previo aviso.\u003c/p\u003e\n\n    \u003ch2\u003e8. Exención de Responsabilidad Profesional\u003c/h2\u003e\n    \u003cp\u003eLa información y las herramientas proporcionadas en el Servicio no constituyen asesoramiento legal, de cumplimiento, contable, fiscal, financiero ni de ningún otro tipo profesional. El Servicio TIMESAFE es una herramienta tecnológica y no un proveedor de servicios profesionales.\u003c/p\u003e\n    \u003cp\u003eComo tal, la información no debe utilizarse como sustituto de la consulta con asesores profesionales competentes en materia contable, fiscal, legal, de cumplimiento u otros. El uso del Servicio no crea una relación profesional-cliente entre Usted y la Empresa.\u003c/p\u003e\n    \u003cp\u003eBajo ninguna circunstancia la Empresa o sus proveedores serán responsables de ningún daño especial, incidental, indirecto o consecuente que surja de o en conexión con su acceso o uso o incapacidad para acceder o usar el Servicio. Usted es el único responsable de garantizar que su uso del Servicio cumple con todas las leyes, regulaciones y obligaciones contractuales aplicables a Usted.\u003c/p\u003e\n\n    \u003ch2\u003e9. CLÁUSULAS FUNDAMENTALES DE PROTECCIÓN LEGAL\u003c/h2\u003e\n    \n    \u003ch3\u003e9.1. AUSENCIA DE GARANTÍAS (EXENCIÓN DE RESPONSABILIDAD \"TAL CUAL\" Y \"SEGÚN DISPONIBILIDAD\")\u003c/h3\u003e\n    \u003cp\u003eEL SERVICIO SE PROPORCIONA A USTED \"TAL CUAL\" Y \"SEGÚN DISPONIBILIDAD\" Y CON TODOS LOS DEFECTOS Y FALLAS SIN GARANTÍA DE NINGÚN TIPO. EN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, LA EMPRESA, EN SU PROPIO NOMBRE Y EN NOMBRE DE SUS AFILIADOS Y SUS RESPECTIVOS LICENCIANTES Y PROVEEDORES DE SERVICIOS, RENUNCIA EXPRESAMENTE A TODAS LAS GARANTÍAS, YA SEAN EXPRESAS, IMPLÍCITAS, ESTATUTARIAS O DE OTRO TIPO, CON RESPECTO AL SERVICIO, INCLUYENDO TODAS LAS GARANTÍAS IMPLÍCITAS DE COMERCIABILIDAD, IDONEIDAD PARA UN PROPÓSITO PARTICULAR, TÍTULO Y NO INFRACCIÓN, Y GARANTÍAS QUE PUEDAN SURGIR DEL CURSO DE LA NEGOCIACIÓN, CURSO DEL DESEMPEÑO, USO O PRÁCTICA COMERCIAL.\u003c/p\u003e\n    \u003cp\u003eSIN LIMITACIÓN A LO ANTERIOR, LA EMPRESA NO OFRECE NINGUNA GARANTÍA NI COMPROMISO, Y NO HACE NINGUNA REPRESENTACIÓN DE NINGÚN TIPO DE QUE EL SERVICIO:\n    \u003cul\u003e\n        \u003cli\u003e(A) CUMPLIRÁ CON SUS REQUISITOS O EXPECTATIVAS;\u003c/li\u003e\n        \u003cli\u003e(B) SERÁ COMPATIBLE O FUNCIONARÁ CON CUALQUIER OTRO SOFTWARE, APLICACIÓN, SISTEMA O SERVICIO;\u003c/li\u003e\n        \u003cli\u003e(C) FUNCIONARÁ SIN INTERRUPCIONES, SERÁ OPORTUNO, SEGURO O LIBRE DE ERRORES;\u003c/li\u003e\n        \u003cli\u003e(D) LOS RESULTADOS O LA INFORMACIÓN OBTENIDA DEL USO DEL SERVICIO SERÁN EXACTOS, COMPLETOS, CONFIABLES O ACTUALES;\u003c/li\u003e\n        \u003cli\u003e(E) LA CALIDAD DE CUALQUIER PRODUCTO, SERVICIO, INFORMACIÓN U OTRO MATERIAL COMPRADO U OBTENIDO POR USTED A TRAVÉS DEL SERVICIO CUMPLIRÁ CON SUS EXPECTATIVAS; O\u003c/li\u003e\n        \u003cli\u003e(F) QUE CUALQUIER ERROR O DEFECTO EN EL SERVICIO SERÁ CORREGIDO.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003c/p\u003e\n    \u003cp\u003eALGUNAS JURISDICCIONES NO PERMITEN LA EXCLUSIÓN DE CIERTOS TIPOS DE GARANTÍAS O LIMITACIONES A LOS DERECHOS ESTATUTARIOS APLICABLES DE UN CONSUMIDOR, POR LO QUE ALGUNAS O TODAS LAS EXCLUSIONES Y LIMITACIONES ANTERIORES PUEDEN NO APLICARSE A USTED. PERO EN TAL CASO, LAS EXCLUSIONES Y LIMITACIONES ESTABLECIDAS EN ESTA SECCIÓN SE APLICARÁN EN LA MAYOR MEDIDA EJECUTABLE BAJO LA LEY APLICABLE.\u003c/p\u003e\n\n    \u003ch3\u003e9.2. \"USE BAJO SU PROPIO RIESGO\" Y ASUNCIÓN DE RIESGO\u003c/h3\u003e\n    \u003cp\u003eTODA LA INFORMACIÓN EN EL SERVICIO SE PROPORCIONA \"TAL CUAL\", SIN GARANTÍA DE INTEGRIDAD, EXACTITUD, OPORTUNIDAD O DE LOS RESULTADOS OBTENIDOS DEL USO DE ESTA INFORMACIÓN, Y SIN GARANTÍA DE NINGÚN TIPO, EXPRESA O IMPLÍCITA.\u003c/p\u003e\n    \u003cp\u003eUSTED ASUME LA TOTAL RESPONSABILIDAD Y EL RIESGO POR SU USO DEL SERVICIO, INCLUYENDO PERO NO LIMITADO A LA INFORMACIÓN CONTENIDA EN ÉL. LA EMPRESA NO SERÁ RESPONSABLE ANTE USTED NI ANTE NADIE MÁS POR CUALQUIER DECISIÓN TOMADA O ACCIÓN REALIZADA EN CONFIANZA EN LA INFORMACIÓN PROPORCIONADA POR EL SERVICIO O POR CUALQUIER DAÑO CONSECUENTE, ESPECIAL O SIMILAR, INCLUSO SI SE HA ADVERTIDO DE LA POSIBILIDAD DE TALES DAÑOS. USTED ES RESPONSABLE DE LA CUSTODIA, CONFIDENCIALIDAD Y SEGURIDAD DE SUS PROPIOS DATOS, DOCUMENTOS Y CREDENCIALES DE ACCESO.\u003c/p\u003e\n\n    \u003ch3\u003e9.3. LIMITACIÓN DE RESPONSABILIDAD\u003c/h3\u003e\n    \u003cp\u003eEN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES, DIRECTORES, EMPLEADOS, AGENTES O AFILIADOS SERÁN RESPONSABLES DE NINGÚN DAÑO ESPECIAL, INCIDENTAL, INDIRECTO O CONSECUENTE DE NINGÚN TIPO (INCLUYENDO, PERO NO LIMITADO A, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS U OTRA INFORMACIÓN, INTERRUPCIÓN DEL NEGOCIO, LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD) QUE SURJA DE O ESTÉ RELACIONADO DE ALGUNA MANERA CON EL USO O LA INCAPACIDAD DE USAR EL SERVICIO, SOFTWARE DE TERCEROS Y/O HARDWARE DE TERCEROS UTILIZADO CON EL SERVICIO, O DE OTRO MODO EN RELACIÓN CON CUALQUIER DISPOSICIÓN DE ESTOS TÉRMINOS, INCLUSO SI LA EMPRESA O CUALQUIER PROVEEDOR HA SIDO ADVERTIDO DE LA POSIBILIDAD DE TALES DAÑOS E INCLUSO SI EL REMEDIO NO CUMPLE CON SU PROPÓSITO ESENCIAL.\u003c/p\u003e\n    \u003cp\u003eSIN PERJUICIO DE LOS DAÑOS QUE USTED PUEDA SUFRIR, LA RESPONSABILIDAD TOTAL Y COMPLETA DE LA EMPRESA Y CUALQUIERA DE SUS PROVEEDORES BAJO CUALQUIER DISPOSICIÓN DE ESTOS TÉRMINOS Y SU RECURSO EXCLUSIVO PARA TODO LO ANTERIOR SE LIMITARÁ A LA CANTIDAD MAYOR ENTRE: (A) EL MONTO TOTAL EFECTIVAMENTE PAGADO POR USTED A TRAVÉS DEL SERVICIO DURANTE EL PERÍODO DE DOCE (12) MESES ANTERIORES AL EVENTO QUE DIO LUGAR A LA RECLAMACIÓN; O (B) $20.00 USD (VEINTE DÓLARES ESTADOUNIDENSES).\u003c/p\u003e\n    \u003cp\u003eAlgunos estados o jurisdicciones no permiten la exclusión o limitación de daños incidentales o consecuentes, por lo que la limitación o exclusión anterior puede no aplicarse a Usted.\u003c/p\u003e\n\n    \u003ch3\u003e9.4. INDEMNIZACIÓN\u003c/h3\u003e\n    \u003cp\u003eUsted acepta indemnizar, defender y mantener indemne a la Empresa, sus afiliados, funcionarios, directores, empleados, consultores, agentes, proveedores y licenciantes de y contra todas y cada una de las reclamaciones, responsabilidades, daños, pérdidas, costos, gastos y honorarios (incluidos los honorarios razonables de abogados) que dichas partes puedan incurrir como resultado de o que surjan de (a) su uso (o el de cualquier persona que use su cuenta) del Servicio; (b) cualquier incumplimiento de estos Términos o cualquier ley, regla o regulación aplicable por su parte; (c) cualquier Contenido o material que usted envíe, publique, transmita o ponga a disposición a través del Servicio; o (d) su violación de los derechos de cualquier tercero, incluidos, entre otros, los derechos de propiedad intelectual, privacidad o publicidad.\u003c/p\u003e\n    \u003cp\u003eLa Empresa se reserva el derecho, a su propio costo, de asumir la defensa y el control exclusivos de cualquier asunto sujeto a indemnización por su parte, en cuyo caso Usted cooperará plenamente con la Empresa para hacer valer cualquier defensa disponible.\u003c/p\u003e\n\n    \u003ch2\u003e10. Cumplimiento de la Ley General de Protección de Datos (LGPD) de Brasil\u003c/h2\u003e\n    \u003cp\u003eLa Empresa está comprometida con la protección de los datos personales y cumple con los requisitos de la Ley General de Protección de Datos de Brasil (LGPD - Lei Nº 13.709/2018) y sus regulaciones y actualizaciones asociadas.\u003c/p\u003e\n\n    \u003ch3\u003e10.1. Derechos de los Titulares de los Datos\u003c/h3\u003e\n    \u003cp\u003eComo Titular de los Datos, Usted tiene los siguientes derechos con respecto a sus datos personales, que puede ejercer en cualquier momento:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eConfirmación y Acceso:\u003c/strong\u003e El derecho a obtener la confirmación de la existencia del tratamiento de sus datos y a acceder a ellos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCorrección:\u003c/strong\u003e El derecho a solicitar la corrección de datos incompletos, inexactos o desactualizados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAnonimización, Bloqueo o Eliminación:\u003c/strong\u003e El derecho a solicitar la anonimización, bloqueo o eliminación de datos innecesarios, excesivos o tratados en incumplimiento de la LGPD.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePortabilidad:\u003c/strong\u003e El derecho a la portabilidad de sus datos a otro proveedor de servicios o productos, previa solicitud expresa.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEliminación:\u003c/strong\u003e El derecho a solicitar la eliminación de los datos personales tratados con su consentimiento.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInformación:\u003c/strong\u003e El derecho a ser informado sobre las entidades públicas y privadas con las que la Empresa ha compartido sus datos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRevocación del Consentimiento:\u003c/strong\u003e El derecho a revocar su consentimiento en cualquier momento, lo que puede afectar la disponibilidad de ciertos servicios.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003ePara ejercer estos derechos, por favor contáctenos a través de nuestro formulario de contacto oficial.\u003c/p\u003e\n    \n    \u003ch3\u003e10.2. Transferencias Internacionales de Datos\u003c/h3\u003e\n    \u003cp\u003eEn el curso de la prestación del Servicio, es posible que la Empresa necesite transferir sus datos personales a países fuera de Brasil. Dichas transferencias se realizarán en estricto cumplimiento de la LGPD, particularmente de acuerdo con las reglas establecidas en la \u003cstrong\u003eResolución CD/ANPD N° 19/2024\u003c/strong\u003e. Utilizaremos mecanismos de transferencia aprobados por la ANPD, como las Cláusulas Contractuales Estándar (Standard Contractual Clauses), o nos aseguraremos de que la transferencia se realice a países que proporcionen un nivel adecuado de protección de datos según lo determine la ANPD.\u003c/p\u003e\n\n    \u003ch3\u003e10.3. Notificación de Incidentes de Seguridad (Violación de Datos)\u003c/h3\u003e\n    \u003cp\u003eEn caso de un incidente de seguridad que pueda acarrear un riesgo o daño relevante para los Titulares de los Datos, la Empresa se compromete a comunicar el incidente a la ANPD y a los Titulares de los Datos afectados. De acuerdo con las regulaciones de la ANPD, esta comunicación se realizará en un plazo razonable, que se define como \u003cstrong\u003etres (3) días hábiles\u003c/strong\u003e a partir del conocimiento del incidente. La notificación describirá la naturaleza de los datos personales afectados, la información sobre los titulares involucrados, las medidas técnicas y de seguridad utilizadas y los riesgos relacionados con el incidente.\u003c/p\u003e\n\n    \u003ch3\u003e10.4. Delegado de Protección de Datos (DPO)\u003c/h3\u003e\n    \u003cp\u003eLa Empresa ha designado un Delegado de Protección de Datos (DPO) o \"Encarregado\" para supervisar el cumplimiento de la LGPD. El DPO es el punto de contacto para los Titulares de los Datos y la ANPD. Puede dirigir sus preguntas o solicitudes relacionadas con la protección de datos a nuestro DPO utilizando la información proporcionada en nuestra página de contacto.\u003c/p\u003e\n\n    \u003ch2\u003e11. Ley Aplicable y Jurisdicción\u003c/h2\u003e\n    \u003cp\u003eEstos Términos y esta Exención de Responsabilidad se regirán e interpretarán de acuerdo con las leyes de la \u003cstrong\u003eRepública Federativa de Brasil\u003c/strong\u003e, sin tener en cuenta sus disposiciones sobre conflicto de leyes.\u003c/p\u003e\n    \u003cp\u003eUsted acepta irrevocablemente que cualquier disputa, controversia o reclamación que surja de o esté relacionada con este documento o el Servicio se someterá a la \u003cstrong\u003ejurisdicción exclusiva de los tribunales del Foro de la Comarca de São Paulo, Estado de São Paulo, Brasil\u003c/strong\u003e. Las partes renuncian expresamente a cualquier otro foro o jurisdicción que pudiera corresponderles por razón de sus domicilios presentes o futuros o por cualquier otra causa.\u003c/p\u003e\n\n    \u003ch2\u003e12. Divisibilidad y Renuncia\u003c/h2\u003e\n    \u003ch3\u003eDivisibilidad\u003c/h3\u003e\n    \u003cp\u003eSi alguna disposición de esta Exención de Responsabilidad se considera inaplicable o inválida, dicha disposición se cambiará e interpretará para lograr los objetivos de dicha disposición en la mayor medida posible bajo la ley aplicable, y las disposiciones restantes continuarán en pleno vigor y efecto.\u003c/p\u003e\n    \u003ch3\u003eRenuncia\u003c/h3\u003e\n    \u003cp\u003eSalvo lo dispuesto en el presente documento, el hecho de no ejercer un derecho o de no exigir el cumplimiento de una obligación en virtud de esta Exención de Responsabilidad no afectará la capacidad de una parte para ejercer dicho derecho o exigir dicho cumplimiento en cualquier momento posterior, ni la renuncia a un incumplimiento constituirá una renuncia a cualquier incumplimiento posterior.\u003c/p\u003e\n\n    \u003ch2\u003e13. Modificaciones\u003c/h2\u003e\n    \u003cp\u003eLa Empresa se reserva el derecho, a su entera discreción, de modificar o reemplazar esta Exención de Responsabilidad en cualquier momento. Si una revisión es material, haremos esfuerzos razonables para proporcionar un aviso antes de que los nuevos términos entren en vigor. Lo que constituye un cambio material se determinará a nuestra entera discreción. Al continuar accediendo o utilizando nuestro Servicio después de que esas revisiones entren en vigor, Usted acepta estar sujeto a los términos revisados.\u003c/p\u003e\n\n    \u003ch2\u003e14. Contacto\u003c/h2\u003e\n    \u003cp\u003eSi tiene alguna pregunta sobre esta Exención de Responsabilidad, puede ponerse en contacto con nosotros:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eVisitando la página de contacto en nuestro sitio web: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Aviso Legal","languageLabel":"Español"},{"documentType":"terms_of_use","language":"ES","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"es\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003ctitle\u003eTérminos de Uso - TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n    \u003ch2\u003eTérminos de Uso de TIMESAFE\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eÚltima actualización:\u003c/strong\u003e 1 de octubre de 2026\u003c/p\u003e\n\n    \u003cp\u003ePOR FAVOR, LEA ESTOS TÉRMINOS DE USO (\"TÉRMINOS\", \"TÉRMINOS DE USO\") CUIDADOSAMENTE ANTES DE DESCARGAR, INSTALAR, ACCEDER O UTILIZAR EL SOFTWARE TIMESAFE (\"EL SERVICIO\"). ESTOS TÉRMINOS CONSTITUYEN UN ACUERDO LEGALMENTE VINCULANTE ENTRE USTED Y TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS.\u003c/p\u003e\n\n    \u003cp\u003e\u003cstrong\u003eAL ACCEDER, DESCARGAR, INSTALAR O UTILIZAR DE CUALQUIER MODO EL SERVICIO, USTED RECONOCE QUE HA LEÍDO, ENTENDIDO Y ACEPTA ESTAR LEGALMENTE VINCULADO POR LA TOTALIDAD DE ESTOS TÉRMINOS Y CONDICIONES. SI USTED NO ESTÁ DE ACUERDO CON ALGUNA PARTE DE ESTOS TÉRMINOS, DEBE CESAR INMEDIATAMENTE TODO USO DEL SERVICIO Y DESINSTALAR CUALQUIER COMPONENTE DEL MISMO.\u003c/strong\u003e\u003c/p\u003e\n\n    \u003cp\u003eEl uso continuado del Servicio después de cualquier modificación de estos Términos constituirá su aceptación de dichas modificaciones.\u003c/p\u003e\n\n    \u003ch2\u003e1. Interpretación y Definiciones\u003c/h2\u003e\n    \u003ch3\u003eInterpretación\u003c/h3\u003e\n    \u003cp\u003eLas palabras cuya letra inicial está en mayúscula tienen significados definidos en las siguientes condiciones. Las siguientes definiciones tendrán el mismo significado independientemente de si aparecen en singular o en plural.\u003c/p\u003e\n\n    \u003ch3\u003eDefiniciones\u003c/h3\u003e\n    \u003cp\u003ePara los fines de estos Términos de Uso:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eAfiliada\u003c/strong\u003e significa una entidad que controla, es controlada por o está bajo control común con una parte, donde \"control\" significa la propiedad del 50% o más de las acciones, participación accionaria u otros valores con derecho a voto para la elección de directores u otra autoridad de gestión.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCuenta\u003c/strong\u003e significa una cuenta única creada para que Usted acceda a nuestro Servicio o a partes de nuestro Servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"la Empresa\", \"Nosotros\", \"Nos\" o \"Nuestro\" en este Acuerdo) se refiere a \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, con CNPJ 41.648.990/0001-56, NIRE 35237097027, y domicilio en ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eContenido\u003c/strong\u003e se refiere a contenido como texto, imágenes u otra información que puede ser publicada, cargada, enlazada o puesta a disposición por Usted, independientemente de la forma de ese contenido.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePaís\u003c/strong\u003e se refiere a: Brasil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e significa cualquier dispositivo que pueda acceder al Servicio, como una computadora, un teléfono celular o una tableta digital.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServicio\u003c/strong\u003e se refiere al software, la aplicación y la plataforma web de \u003cstrong\u003eTIMESAFE\u003c/strong\u003e.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSuscripción\u003c/strong\u003e se refiere a los servicios o el acceso al Servicio proporcionado por la Empresa a Usted sobre una base de pago.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTérminos y Condiciones\u003c/strong\u003e (también referidos como \"Términos\") significan estos Términos y Condiciones que forman el acuerdo completo entre Usted y la Empresa con respecto al uso del Servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServicio de Red Social de Terceros\u003c/strong\u003e significa cualquier servicio o contenido (incluidos datos, información, productos o servicios) proporcionado por un tercero que pueda ser mostrado, incluido o puesto a disposición por el Servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e (referido como \"Usted\", \"Su\" o \"Usuario\") significa el individuo que accede o utiliza el Servicio, o la empresa u otra entidad legal en nombre de la cual dicho individuo accede o utiliza el Servicio, según corresponda.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e2. Aceptación de los Términos\u003c/h2\u003e\n    \u003cp\u003eEstos son los Términos y Condiciones que rigen el uso de este Servicio y el acuerdo que opera entre Usted y la Empresa. Estos Términos y Condiciones establecen los derechos y obligaciones de todos los usuarios con respecto al uso del Servicio.\u003c/p\u003e\n    \u003cp\u003eSu acceso y uso del Servicio está condicionado a Su aceptación y cumplimiento de estos Términos y Condiciones. Estos Términos y Condiciones se aplican a todos los visitantes, usuarios y otras personas que acceden o utilizan el Servicio.\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eSU ACCESO O USO DEL SERVICIO IMPLICA SU ACEPTACIÓN INCONDICIONAL DE ESTOS TÉRMINOS. SI NO ESTÁ DE ACUERDO, NO ACCEDA NI UTILICE EL SERVICIO.\u003c/strong\u003e Usted declara que tiene más de 18 años. La Empresa no permite que los menores de 18 años utilicen el Servicio.\u003c/p\u003e\n    \u003cp\u003eSu acceso y uso del Servicio también está condicionado a Su aceptación y cumplimiento de la Política de Privacidad de la Empresa. Nuestra Política de Privacidad describe nuestras políticas y procedimientos sobre la recopilación, uso y divulgación de su información personal cuando utiliza la Aplicación o el Sitio Web y le informa sobre sus derechos de privacidad y cómo la ley lo protege. Lea atentamente nuestra Política de Privacidad antes de utilizar nuestro Servicio.\u003c/p\u003e\n\n    \u003ch2\u003e3. Suscripciones y Pagos\u003c/h2\u003e\n    \u003ch3\u003ePeríodo de Suscripción\u003c/h3\u003e\n    \u003cp\u003eEl Servicio, o algunas partes del Servicio, están disponibles únicamente con una Suscripción de pago. Se le facturará por adelantado de forma recurrente y periódica (mensual o anualmente), según el tipo de plan de Suscripción que seleccione al comprar la Suscripción.\u003c/p\u003e\n    \u003cp\u003eAl final de cada período, su Suscripción se renovará automáticamente bajo exactamente las mismas condiciones, a menos que usted la cancele o la Empresa la cancele. La renovación automática garantiza un servicio ininterrumpido.\u003c/p\u003e\n\n    \u003ch3\u003eCancelación de la Suscripción\u003c/h3\u003e\n    \u003cp\u003eUsted puede cancelar la renovación de su Suscripción ya sea a través de la configuración de su página de Cuenta o contactando a la Empresa a través del enlace de contacto. Usted no recibirá un reembolso por las tarifas ya pagadas por su período de Suscripción actual y podrá acceder al Servicio hasta el final de su período de Suscripción actual. Es su exclusiva responsabilidad gestionar y cancelar su Suscripción a tiempo para evitar cargos de renovación.\u003c/p\u003e\n    \n    \u003ch3\u003eFacturación y Cambios de Precio\u003c/h3\u003e\n    \u003cp\u003eUsted deberá proporcionar a la Empresa información de facturación precisa y completa, incluyendo nombre completo, dirección, estado, código postal, número de teléfono y una información de método de pago válida. En caso de que la facturación automática falle por cualquier motivo, la Empresa emitirá una factura electrónica indicando que debe proceder manualmente, dentro de una fecha límite determinada, con el pago completo correspondiente al período de facturación indicado en la factura.\u003c/p\u003e\n    \u003cp\u003eLa Empresa, a su entera discreción y en cualquier momento, puede modificar las tarifas de la Suscripción. Cualquier cambio en la tarifa de la Suscripción se hará efectivo al final del período de Suscripción vigente en ese momento. La Empresa le proporcionará un aviso previo razonable de cualquier cambio en las tarifas de Suscripción para darle la oportunidad de terminar su Suscripción antes de que dicho cambio entre en vigor. Su uso continuado del Servicio después de que el cambio de tarifa de Suscripción entre en vigor constituye su acuerdo de pagar el monto modificado de la tarifa de Suscripción.\u003c/p\u003e\n\n    \u003ch3\u003eReembolsos\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eSALVO CUANDO LA LEY LO EXIJA, LAS TARIFAS DE SUSCRIPCIÓN PAGADAS NO SON REEMBOLSABLES.\u003c/strong\u003e Ciertas solicitudes de reembolso para Suscripciones pueden ser consideradas por la Empresa caso por caso y otorgadas a la entera discreción de la Empresa.\u003c/p\u003e\n\n    \u003ch3\u003ePrueba Gratuita\u003c/h3\u003e\n    \u003cp\u003eLa Empresa puede, a su entera discreción, ofrecer una Suscripción con una prueba gratuita por un período de tiempo limitado. Es posible que se le solicite que ingrese su información de facturación para registrarse en la prueba gratuita. Si ingresa su información de facturación al registrarse para una prueba gratuita, no se le cobrará por parte de la Empresa hasta que la prueba gratuita haya expirado. En el último día del período de prueba gratuita, a menos que haya cancelado su Suscripción, se le cobrarán automáticamente las tarifas de Suscripción aplicables para el tipo de Suscripción que haya seleccionado. En cualquier momento y sin previo aviso, la Empresa se reserva el derecho de (i) modificar los términos y condiciones de la oferta de prueba gratuita, o (ii) cancelar dicha oferta de prueba gratuita.\u003c/p\u003e\n\n    \u003ch2\u003e4. Uso Aceptable\u003c/h2\u003e\n    \u003cp\u003eUsted se compromete a utilizar el Servicio únicamente para fines lícitos y de conformidad con estos Términos. Usted se compromete a no utilizar el Servicio:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eDe cualquier manera que viole cualquier ley o regulación local, estatal, nacional o internacional aplicable (incluyendo, sin limitación, cualquier ley relativa a la exportación de datos o software hacia y desde Brasil u otros países).\u003c/li\u003e\n        \u003cli\u003eCon el propósito de explotar, dañar o intentar explotar o dañar a menores de cualquier manera, exponiéndolos a contenido inapropiado, solicitando información de identificación personal o de otra manera.\u003c/li\u003e\n        \u003cli\u003ePara transmitir o procurar el envío de cualquier material publicitario o promocional no solicitado o no autorizado, incluyendo cualquier \"correo basura\", \"carta en cadena\", \"spam\" o cualquier otra solicitud similar.\u003c/li\u003e\n        \u003cli\u003ePara suplantar o intentar suplantar a la Empresa, un empleado de la Empresa, otro usuario o cualquier otra persona o entidad (incluyendo, sin limitación, mediante el uso de direcciones de correo electrónico o nombres de pantalla asociados con cualquiera de los anteriores).\u003c/li\u003e\n        \u003cli\u003ePara participar en cualquier otra conducta que restrinja o inhiba el uso o disfrute del Servicio por parte de cualquier persona, o que, según lo determinemos, pueda dañar a la Empresa o a los usuarios del Servicio o exponerlos a responsabilidad.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e5. Actividades Prohibidas\u003c/h2\u003e\n    \u003cp\u003eAdemás de otras prohibiciones establecidas en los Términos de Uso, se le prohíbe usar el sitio o su contenido:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003ePara cualquier propósito ilegal.\u003c/li\u003e\n        \u003cli\u003ePara solicitar a otros que realicen o participen en actos ilegales.\u003c/li\u003e\n        \u003cli\u003ePara violar cualquier regulación, regla, ley u ordenanza local internacional, federal, provincial o estatal.\u003c/li\u003e\n        \u003cli\u003ePara infringir o violar nuestros derechos de propiedad intelectual o los derechos de propiedad intelectual de otros.\u003c/li\u003e\n        \u003cli\u003ePara acosar, abusar, insultar, dañar, difamar, calumniar, menospreciar, intimidar o discriminar por motivos de género, orientación sexual, religión, etnia, raza, edad, origen nacional o discapacidad.\u003c/li\u003e\n        \u003cli\u003ePara enviar información falsa o engañosa.\u003c/li\u003e\n        \u003cli\u003ePara cargar o transmitir virus, troyanos, gusanos, bombas lógicas o cualquier otro tipo de código malicioso que será o podrá ser utilizado de cualquier manera que afecte la funcionalidad o el funcionamiento del Servicio o de cualquier sitio web relacionado, otros sitios web o Internet.\u003c/li\u003e\n        \u003cli\u003ePara recopilar o rastrear la información personal de otros sin su consentimiento explícito.\u003c/li\u003e\n        \u003cli\u003ePara hacer spam, phishing, pharming, pretexting, spidering, crawling o scraping.\u003c/li\u003e\n        \u003cli\u003ePara cualquier propósito obsceno o inmoral.\u003c/li\u003e\n        \u003cli\u003ePara interferir o eludir las características de seguridad del Servicio o de cualquier sitio web relacionado, otros sitios web o Internet.\u003c/li\u003e\n        \u003cli\u003ePara realizar ingeniería inversa, descompilar, desensamblar o intentar descubrir el código fuente o los algoritmos del Servicio.\u003c/li\u003e\n        \u003cli\u003ePara alquilar, arrendar, prestar, vender, sublicenciar, distribuir, asignar o transferir de otro modo cualquier derecho sobre el Servicio o su contenido.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eNos reservamos el derecho de terminar su uso del Servicio o de cualquier sitio web relacionado por violar cualquiera de los usos prohibidos.\u003c/p\u003e\n\n    \u003ch2\u003e6. Contenido del Usuario\u003c/h2\u003e\n    \u003cp\u003eEl Servicio puede permitirle publicar, enlazar, almacenar, compartir y de otra manera poner a disposición cierta información, texto, gráficos, videos u otro material (\"Contenido\"). Usted es el único responsable del Contenido que publica en o a través del Servicio, incluyendo su legalidad, fiabilidad y adecuación.\u003c/p\u003e\n    \u003cp\u003eAl publicar Contenido en o a través del Servicio, Usted declara y garantiza que: (i) el Contenido es suyo (Usted lo posee) y/o tiene el derecho de usarlo y el derecho de otorgarnos los derechos y la licencia según lo dispuesto en estos Términos, y (ii) la publicación de su Contenido en o a través del Servicio no viola los derechos de privacidad, derechos de publicidad, derechos de autor, derechos contractuales o cualquier otro derecho de cualquier persona o entidad.\u003c/p\u003e\n    \u003cp\u003eLa Empresa no asume ninguna responsabilidad por el Contenido publicado por los usuarios del Servicio. Sin embargo, al publicar Contenido, usted otorga a la Empresa una licencia mundial, no exclusiva, libre de regalías, sublicenciable y transferible para usar, reproducir, modificar, adaptar, publicar, traducir, crear trabajos derivados, distribuir y mostrar dicho Contenido en conexión con la operación y promoción del Servicio.\u003c/p\u003e\n    \u003cp\u003eLa Empresa tiene el derecho, pero no la obligación, de monitorear, editar o eliminar todo el Contenido proporcionado por los usuarios. La Empresa no se responsabiliza y no asume ninguna responsabilidad por cualquier Contenido publicado por usted o cualquier tercero.\u003c/p\u003e\n\n    \u003ch2\u003e7. Derechos de Propiedad Intelectual\u003c/h2\u003e\n    \u003cp\u003eEl Servicio y todo su contenido original (excluyendo el Contenido proporcionado por los usuarios), características y funcionalidades son y seguirán siendo propiedad exclusiva de \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e y sus licenciantes. El Servicio está protegido por leyes de derechos de autor, marcas comerciales y otras leyes tanto de Brasil como de países extranjeros.\u003c/p\u003e\n    \u003cp\u003eNuestras marcas comerciales y nuestra imagen comercial, incluyendo el nombre \"TIMESAFE\", no pueden ser utilizadas en conexión con ningún producto o servicio sin el consentimiento previo por escrito de la Empresa. Nada en estos Términos le otorga un derecho o licencia para usar ninguna marca comercial, logotipo o nombre de dominio de la Empresa.\u003c/p\u003e\n    \u003cp\u003eUsted no puede copiar, modificar, distribuir, vender o arrendar ninguna parte de nuestro Servicio o software incluido, ni puede realizar ingeniería inversa o intentar extraer el código fuente de ese software, a menos que las leyes prohíban esas restricciones o que tenga nuestro permiso por escrito.\u003c/p\u003e\n    \n    \u003ch2\u003e8. Cumplimiento de la Privacidad y la LGPD\u003c/h2\u003e\n    \u003cp\u003eLa Empresa se compromete a proteger su privacidad y a cumplir con las leyes de protección de datos aplicables, incluyendo la Ley General de Protección de Datos de Brasil (LGPD - Ley N° 13.709/2018) y sus regulaciones y actualizaciones posteriores.\u003c/p\u003e\n\n    \u003ch3\u003eDerechos de los Titulares de Datos\u003c/h3\u003e\n    \u003cp\u003eDe acuerdo con la LGPD, Usted, como titular de los datos, tiene los siguientes derechos con respecto a sus datos personales:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eConfirmación y Acceso:\u003c/strong\u003e El derecho a obtener la confirmación de la existencia del tratamiento y a acceder a sus datos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCorrección:\u003c/strong\u003e El derecho a solicitar la corrección de datos incompletos, inexactos o desactualizados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAnonimización, Bloqueo o Eliminación:\u003c/strong\u003e El derecho a solicitar la anonimización, el bloqueo o la eliminación de datos innecesarios, excesivos o tratados en incumplimiento de la LGPD.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePortabilidad:\u003c/strong\u003e El derecho a solicitar la portabilidad de sus datos a otro proveedor de servicios o productos, previa solicitud expresa.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEliminación:\u003c/strong\u003e El derecho a solicitar la eliminación de los datos personales tratados con su consentimiento.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInformación sobre el Compartir:\u003c/strong\u003e El derecho a ser informado sobre las entidades públicas y privadas con las que el controlador ha compartido datos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRevocación del Consentimiento:\u003c/strong\u003e El derecho a revocar su consentimiento en cualquier momento.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003ePara ejercer cualquiera de estos derechos, por favor contáctenos a través de los canales proporcionados en la sección \"Contacto\".\u003c/p\u003e\n\n    \u003ch3\u003eTransferencias Internacionales de Datos\u003c/h3\u003e\n    \u003cp\u003eAl utilizar el Servicio, Usted reconoce y acepta que sus datos personales pueden ser transferidos, almacenados y procesados en países fuera de su jurisdicción, incluido Brasil. La Empresa garantiza que todas las transferencias internacionales de datos personales se realizan en estricto cumplimiento de la LGPD, incluyendo el uso de Cláusulas Contractuales Tipo (Standard Contractual Clauses - SCCs) aprobadas por la Autoridad Nacional de Protección de Datos (ANPD) de Brasil, conforme a la Resolución CD/ANPD N° 19/2024, u otros mecanismos de transferencia legalmente válidos para asegurar un nivel adecuado de protección de datos.\u003c/p\u003e\n\n    \u003ch3\u003eNotificación de Incidentes de Seguridad\u003c/h3\u003e\n    \u003cp\u003eEn caso de un incidente de seguridad que pueda acarrear un riesgo o daño relevante para Usted (un \"Incidente\"), la Empresa se compromete a notificar a la ANPD y a los titulares de datos afectados en un plazo razonable, que no excederá los \u003cstrong\u003e3 (tres) días hábiles\u003c/strong\u003e a partir de la fecha en que la Empresa tenga conocimiento del Incidente. La notificación incluirá, como mínimo, la naturaleza de los datos personales afectados, información sobre los titulares involucrados, las medidas técnicas y de seguridad utilizadas, los riesgos relacionados con el incidente y las medidas que se han tomado o se tomarán para revertir o mitigar los efectos del daño.\u003c/p\u003e\n\n    \u003ch3\u003eDelegado de Protección de Datos (DPO)\u003c/h3\u003e\n    \u003cp\u003eLa Empresa ha designado un Delegado de Protección de Datos (DPO) para supervisar el cumplimiento de la LGPD. La información de contacto del DPO está disponible públicamente y puede ser solicitada a través de nuestro canal de contacto oficial.\u003c/p\u003e\n\n    \u003ch2\u003e9. Rescisión de la Cuenta\u003c/h2\u003e\n    \u003cp\u003ePODEMOS RESCINDIR O SUSPENDER SU CUENTA Y PROHIBIR EL ACCESO AL SERVICIO DE FORMA INMEDIATA, SIN PREVIO AVISO NI RESPONSABILIDAD, A NUESTRA ENTERA DISCRECIÓN, POR CUALQUIER MOTIVO Y SIN LIMITACIÓN, INCLUYENDO, PERO NO LIMITADO A, UNA VIOLACIÓN DE ESTOS TÉRMINOS.\u003c/p\u003e\n    \u003cp\u003eSi desea rescindir su Cuenta, puede simplemente dejar de usar el Servicio y/o cancelar su Suscripción. Todas las disposiciones de los Términos que por su naturaleza deban sobrevivir a la rescisión sobrevivirán a la rescisión, incluyendo, sin limitación, las disposiciones de propiedad, las exenciones de garantía, la indemnización y las limitaciones de responsabilidad.\u003c/p\u003e\n    \u003cp\u003eTras la rescisión, su derecho a utilizar el Servicio cesará inmediatamente. La Empresa no tendrá ninguna obligación de mantener o proporcionar acceso a su Contenido después de la rescisión.\u003c/p\u003e\n\n    \u003ch2\u003e10. Modificaciones de los Términos\u003c/h2\u003e\n    \u003cp\u003eNos reservamos el derecho, a nuestra entera discreción, de modificar o reemplazar estos Términos en cualquier momento. Si una revisión es material, haremos esfuerzos razonables para proporcionar un aviso de al menos 30 días antes de que los nuevos términos entren en vigor. Lo que constituye un cambio material será determinado a nuestra entera discreción.\u003c/p\u003e\n    \u003cp\u003eAl continuar accediendo o utilizando nuestro Servicio después de que esas revisiones entren en vigor, usted acepta estar sujeto a los términos revisados. Si no está de acuerdo con los nuevos términos, en su totalidad o en parte, por favor deje de usar el sitio web y el Servicio.\u003c/p\u003e\n\n    \u003ch2\u003e11. Exención de Responsabilidad de Garantías\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eEL SERVICIO SE PROPORCIONA \"TAL CUAL\" Y \"SEGÚN DISPONIBILIDAD\", SIN GARANTÍAS DE NINGÚN TIPO, YA SEAN EXPRESAS O IMPLÍCITAS. USTED ACEPTA QUE SU USO DEL SERVICIO ES BAJO SU PROPIO RIESGO.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eEN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, LA EMPRESA, SUS AFILIADAS Y SUS LICENCIANTES RENUNCIAN EXPRESAMENTE A TODAS LAS GARANTÍAS, YA SEAN EXPRESAS, IMPLÍCITAS, ESTATUTARIAS O DE OTRO TIPO, CON RESPECTO AL SERVICIO, INCLUYENDO, PERO NO LIMITADO A, TODAS LAS GARANTÍAS IMPLÍCITAS DE COMERCIABILIDAD, IDONEIDAD PARA UN PROPÓSITO PARTICULAR, TÍTULO Y NO INFRACCIÓN, Y GARANTÍAS QUE PUEDAN SURGIR DEL CURSO DE LA NEGOCIACIÓN, CURSO DEL DESEMPEÑO, USO O PRÁCTICA COMERCIAL.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eSIN LIMITACIÓN A LO ANTERIOR, LA EMPRESA NO OFRECE NINGUNA GARANTÍA O COMPROMISO, Y NO HACE NINGUNA DECLARACIÓN DE NINGÚN TIPO DE QUE EL SERVICIO:\u003c/strong\u003e\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eCUMPLIRÁ CON SUS REQUISITOS O EXPECTATIVAS.\u003c/strong\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSERÁ COMPATIBLE O FUNCIONARÁ CON CUALQUIER OTRO SOFTWARE, APLICACIÓN, SISTEMA O SERVICIO.\u003c/strong\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eESTARÁ DISPONIBLE DE FORMA ININTERRUMPIDA, OPORTUNA, SEGURA O LIBRE DE ERRORES.\u003c/strong\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eLOS RESULTADOS O LA INFORMACIÓN OBTENIDA DEL USO DEL SERVICIO SERÁN EXACTOS, CONFIABLES, COMPLETOS O ACTUALES.\u003c/strong\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eLOS ERRORES O DEFECTOS EN EL SERVICIO SERÁN CORREGIDOS.\u003c/strong\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEL SERVICIO, SUS SERVIDORES, EL CONTENIDO O LOS CORREOS ELECTRÓNICOS ENVIADOS DESDE O EN NOMBRE DE LA EMPRESA ESTÁN LIBRES DE VIRUS, SCRIPTS, CABALLOS DE TROYA, GUSANOS, MALWARE, BOMBAS DE TIEMPO U OTROS COMPONENTES DAÑINOS.\u003c/strong\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eAlgunas jurisdicciones no permiten la exclusión de ciertos tipos de garantías o limitaciones a los derechos estatutarios aplicables de un consumidor, por lo que algunas o todas las exclusiones y limitaciones anteriores pueden no aplicarse a Usted. Pero en tal caso, las exclusiones y limitaciones establecidas en esta sección se aplicarán en la mayor medida exigible bajo la ley aplicable.\u003c/p\u003e\n\n    \u003ch2\u003e12. Asunción de Riesgo por Parte del Usuario\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eUSTED ASUME LA TOTAL RESPONSABILIDAD Y RIESGO POR SU USO DEL SERVICIO Y DE INTERNET. EL SERVICIO SE PROPORCIONA \"TAL CUAL\". LA EMPRESA NO SERÁ RESPONSABLE DE NINGÚN DAÑO RESULTANTE DEL USO O LA INCAPACIDAD DE USAR EL SERVICIO, INCLUYENDO DAÑOS CAUSADOS POR MALWARE, VIRUS O CUALQUIER INCORRECCIÓN O INCOMPLETITUD DEL SOFTWARE O LA INFORMACIÓN, A MENOS QUE DICHO DAÑO SEA EL RESULTADO DE CUALQUIER MALA CONDUCTA INTENCIONAL O NEGLIGENCIA GRAVE POR PARTE DE LA EMPRESA. EL RIESGO DE PÉRDIDA DE DATOS O DAÑO A SU DISPOSITIVO O SISTEMA RESIDE EXCLUSIVAMENTE EN USTED.\u003c/strong\u003e\u003c/p\u003e\n    \n    \u003ch2\u003e13. Limitación de Responsabilidad\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eEN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES, DIRECTORES, EMPLEADOS, AGENTES O AFILIADAS SERÁN RESPONSABLES POR CUALQUIER DAÑO ESPECIAL, INCIDENTAL, INDIRECTO, PUNITIVO O CONSECUENTE DE CUALQUIER TIPO (INCLUYENDO, PERO NO LIMITADO A, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS U OTRA INFORMACIÓN, INTERRUPCIÓN DEL NEGOCIO, LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD) QUE SURJA DE O ESTÉ RELACIONADO DE ALGUNA MANERA CON EL USO O LA INCAPACIDAD DE USAR EL SERVICIO, SOFTWARE DE TERCEROS Y/O HARDWARE DE TERCEROS UTILIZADO CON EL SERVICIO, O DE OTRA MANERA EN CONEXIÓN CON CUALQUIER DISPOSICIÓN DE ESTOS TÉRMINOS, INCLUSO SI LA EMPRESA O CUALQUIER PROVEEDOR HA SIDO ADVERTIDO DE LA POSIBILIDAD DE TALES DAÑOS E INCLUSO SI EL REMEDIO NO CUMPLE CON SU PROPÓSITO ESENCIAL.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eSIN PERJUICIO DE CUALQUIER DAÑO QUE USTED PUEDA SUFRIR, LA RESPONSABILIDAD TOTAL ACUMULADA DE LA EMPRESA Y CUALQUIERA DE SUS PROVEEDORES BAJO CUALQUIER DISPOSICIÓN DE ESTOS TÉRMINOS Y SU RECURSO EXCLUSIVO PARA TODO LO ANTERIOR SE LIMITARÁ A LA CANTIDAD MAYOR ENTRE: (A) LA CANTIDAD TOTAL REALMENTE PAGADA POR USTED POR EL SERVICIO DURANTE EL PERÍODO DE DOCE (12) MESES INMEDIATAMENTE ANTERIOR AL EVENTO QUE DIO LUGAR A LA RECLAMACIÓN; O (B) $20.00 (VEINTE DÓLARES ESTADOUNIDENSES).\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eAlgunos estados/jurisdicciones no permiten la exclusión o limitación de daños incidentales o consecuentes, por lo que la limitación o exclusión anterior puede no aplicarse a Usted.\u003c/p\u003e\n    \n    \u003ch2\u003e14. Indemnización\u003c/h2\u003e\n    \u003cp\u003eUsted acepta indemnizar, defender y mantener indemne a la Empresa, sus Afiliadas, directores, funcionarios, empleados, consultores, agentes, licenciantes y proveedores de y contra todas y cada una de las reclamaciones, responsabilidades, daños, pérdidas, costos, juicios, multas, sanciones y gastos (incluidos los honorarios razonables de abogados) que surjan de o estén relacionados de alguna manera con: (a) su uso o mal uso del Servicio; (b) cualquier violación de estos Términos por su parte; (c) cualquier Contenido que publique, envíe o transmita a través del Servicio; (d) su violación de cualquier ley, regla o regulación aplicable; o (e) su violación de los derechos de cualquier tercero, incluyendo, sin limitación, cualquier derecho de propiedad intelectual o derecho de privacidad. La Empresa se reserva el derecho, a su propio costo, de asumir la defensa y el control exclusivos de cualquier asunto sujeto a indemnización por su parte, en cuyo caso usted cooperará plenamente con la Empresa para hacer valer cualquier defensa disponible.\u003c/p\u003e\n\n    \u003ch2\u003e15. Ley Aplicable y Jurisdicción\u003c/h2\u003e\n    \u003cp\u003eEstos Términos se regirán e interpretarán de acuerdo con las leyes de la República Federativa de Brasil, sin tener en cuenta sus disposiciones sobre conflicto de leyes.\u003c/p\u003e\n    \u003cp\u003eCualquier disputa, controversia o reclamación que surja de o se relacione con estos Términos, o el incumplimiento, terminación, ejecución, interpretación o validez de los mismos, se someterá a la jurisdicción exclusiva de los tribunales de la ciudad de São Paulo, Estado de São Paulo, Brasil. Las partes renuncian irrevocablemente a cualquier objeción a la jurisdicción y competencia de dichos tribunales.\u003c/p\u003e\n\n    \u003ch3\u003eDivisibilidad\u003c/h3\u003e\n    \u003cp\u003eSi alguna disposición de estos Términos se considera inaplicable o inválida, dicha disposición se cambiará e interpretará para lograr los objetivos de dicha disposición en la mayor medida posible bajo la ley aplicable y las disposiciones restantes continuarán en pleno vigor y efecto.\u003c/p\u003e\n\n    \u003ch3\u003eRenuncia\u003c/h3\u003e\n    \u003cp\u003eSalvo lo dispuesto en el presente, el hecho de no ejercer un derecho o de no exigir el cumplimiento de una obligación en virtud de estos Términos no afectará la capacidad de una parte para ejercer dicho derecho o exigir dicho cumplimiento en cualquier momento posterior, ni la renuncia a un incumplimiento constituirá una renuncia a cualquier incumplimiento posterior.\u003c/p\u003e\n\n    \u003ch2\u003e16. Contacto\u003c/h2\u003e\n    \u003cp\u003eSi tiene alguna pregunta sobre estos Términos de Uso, puede contactarnos:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eVisitando esta página en nuestro sitio web: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003cp\u003e© {year} TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS. Todos los derechos reservados.\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e","label":"Términos de Uso","languageLabel":"Español"},{"documentType":"eula","language":"ES","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"es\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003ctitle\u003eContrato de Licencia de Usuario Final - TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003ch2\u003eContrato de Licencia de Usuario Final (\"Contrato\") para TIMESAFE\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eÚltima actualización:\u003c/strong\u003e 1 de octubre de 2026\u003c/p\u003e\n\n\u003cp\u003ePOR FAVOR, LEA ESTE CONTRATO DE LICENCIA DE USUARIO FINAL (\"CONTRATO\") DETENIDAMENTE ANTES DE HACER CLIC EN EL BOTÓN \"ACEPTO\", DESCARGAR, INSTALAR O UTILIZAR LA APLICACIÓN \"TIMESAFT\". ESTE ES UN DOCUMENTO LEGAL VINCULANTE.\u003c/p\u003e\n\n\u003ch2\u003e1. Interpretación y Definiciones\u003c/h2\u003e\n\u003ch3\u003eInterpretación\u003c/h3\u003e\n\u003cp\u003eLas palabras cuya letra inicial está en mayúscula tienen significados definidos en las siguientes condiciones. Las siguientes definiciones tendrán el mismo significado independientemente de que aparezcan en singular o en plural.\u003c/p\u003e\n\n\u003ch3\u003eDefiniciones\u003c/h3\u003e\n\u003cp\u003eA los efectos de este Contrato de Licencia de Usuario Final:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eAcuerdo\u003c/strong\u003e se refiere a este Contrato de Licencia de Usuario Final que constituye el acuerdo completo y exclusivo entre Usted y la Empresa con respecto al uso de la Aplicación.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAplicación\u003c/strong\u003e se refiere al programa de software proporcionado por la Empresa, descargado por Usted, denominado TIMESAFE.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"la Empresa\", \"Nosotros\", \"Nuestro\" o \"Nuestros\" en este Acuerdo) se refiere a \u003cstrong\u003eTIMESAFT SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, una entidad legalmente constituida con CNPJ 41.648.990/0001-56 y NIRE 35237097027, con domicilio en ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eContenido\u003c/strong\u003e se refiere a contenido como texto, imágenes, documentos, datos u otra información que puede ser creada, cargada, publicada, enlazada o puesta a disposición de otra manera por Usted a través del uso de la Aplicación.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePaís\u003c/strong\u003e se refiere a la República Federativa de Brasil.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e se refiere a cualquier dispositivo que pueda acceder a la Aplicación, como un ordenador, un teléfono móvil, una tableta digital o cualquier otro dispositivo electrónico.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSuscripción\u003c/strong\u003e se refiere al plan de pago que le da acceso a la Aplicación o a partes de la misma, según el modelo de precios de la Empresa.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServicios de Terceros\u003c/strong\u003e se refiere a cualquier servicio, contenido (incluidos datos, información, aplicaciones y otros productos) o enlaces proporcionados por un tercero que puedan ser mostrados, incluidos o puestos a disposición por la Aplicación.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e (referido como \"Usted\", \"Su\" o \"Usuario\") se refiere a la persona física que accede o utiliza la Aplicación, o a la empresa u otra entidad legal en cuyo nombre dicha persona accede o utiliza la Aplicación, según corresponda.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eLGPD\u003c/strong\u003e se refiere a la Ley General de Protección de Datos de Brasil (Lei Geral de Proteção de Dados Pessoais, Ley N° 13.709/2018), con todas sus enmiendas y regulaciones complementarias.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD\u003c/strong\u003e se refiere a la Autoridad Nacional de Protección de Datos de Brasil.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDatos Personales\u003c/strong\u003e tiene el significado que se le atribuye en la LGPD.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e2. Reconocimiento y Aceptación de los Términos\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eAL ACCEDER, DESCARGAR, INSTALAR, HACER CLIC EN \"ACEPTO\" O UTILIZAR DE CUALQUIER OTRA FORMA LA APLICACIÓN, USTED RECONOCE QUE HA LEÍDO, COMPRENDIDO Y ACEPTA ESTAR LEGALMENTE VINCULADO POR LOS TÉRMINOS Y CONDICIONES DE ESTE ACUERDO. SI USTED NO ESTÁ DE ACUERDO CON TODOS LOS TÉRMINOS DE ESTE ACUERDO, NO ACCEDA, DESCARGUE, INSTALE NI UTILICE LA APLICACIÓN Y DEBE ELIMINAR CUALQUIER COPIA QUE POSEA.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eEste Acuerdo es un documento legal vinculante entre Usted y la Empresa y rige Su uso de la Aplicación puesta a Su disposición por la Empresa. Si Usted está aceptando este Acuerdo en nombre de una corporación, organización u otra entidad legal, Usted declara y garantiza que tiene la autoridad para vincular a dicha entidad a este Acuerdo, en cuyo caso \"Usted\" y \"Su\" se referirán a dicha entidad.\u003c/p\u003e\n\u003cp\u003eEl uso continuado de la Aplicación después de cualquier modificación de este Acuerdo constituirá Su aceptación de dichas modificaciones. Es Su responsabilidad revisar este Acuerdo periódicamente.\u003c/p\u003e\n\u003cp\u003eLa Aplicación se licencia, no se vende, a Usted por parte de la Empresa para su uso estrictamente de acuerdo con los términos de este Acuerdo.\u003c/p\u003e\n\n\u003ch2\u003e3. Licencia\u003c/h2\u003e\n\u003ch3\u003eAlcance de la Licencia\u003c/h3\u003e\n\u003cp\u003eSujeto al estricto cumplimiento de los términos y condiciones de este Acuerdo, la Empresa le concede una licencia personal, limitada, no exclusiva, revocable, intransferible y no sublicenciable para descargar, instalar y utilizar la Aplicación en un Dispositivo que sea de Su propiedad o esté bajo Su control legítimo, únicamente para Sus fines personales o comerciales internos, según lo previsto por el diseño de la Aplicación y de acuerdo con los términos de este Acuerdo y cualquier documentación aplicable.\u003c/p\u003e\n\n\u003ch3\u003eRestricciones de la Licencia\u003c/h3\u003e\n\u003cp\u003eUsted se compromete a no realizar, y a no permitir que otros realicen, ninguna de las siguientes acciones:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eLicenciar, vender, alquilar, arrendar, ceder, distribuir, transmitir, alojar, externalizar, divulgar o explotar comercialmente de cualquier otra forma la Aplicación o poner la Aplicación a disposición de terceros.\u003c/li\u003e\n    \u003cli\u003eCopiar, reproducir o utilizar la Aplicación o cualquier parte de la misma para cualquier propósito que no sea el permitido explícitamente en la sección \"Alcance de la Licencia\".\u003c/li\u003e\n    \u003cli\u003eModificar, realizar trabajos derivados, desensamblar, descompilar, realizar ingeniería inversa o intentar derivar de cualquier otro modo el código fuente de cualquier parte de la Aplicación.\u003c/li\u003e\n    \u003cli\u003eEliminar, alterar u ocultar cualquier aviso de propiedad (incluido cualquier aviso de derechos de autor o marca registrada) de la Empresa, sus filiales, socios, proveedores o licenciantes de la Aplicación.\u003c/li\u003e\n    \u003cli\u003eUtilizar la Aplicación para crear un producto, servicio o software que sea, directa o indirectamente, competitivo o un sustituto de cualquier servicio, producto o software ofrecido por la Empresa.\u003c/li\u003e\n    \u003cli\u003eUtilizar la Aplicación para enviar consultas automatizadas a cualquier sitio web o para enviar correo electrónico comercial no solicitado (\"spam\").\u003c/li\u003e\n    \u003cli\u003eUtilizar la Aplicación de cualquier manera que viole cualquier ley, regla o regulación local, estatal, nacional o internacional aplicable.\u003c/li\u003e\n    \u003cli\u003eUtilizar la Aplicación para cualquier propósito para el que no fue diseñada o prevista.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eCualquier intento de hacer lo anterior es una violación de los derechos de la Empresa y sus licenciantes. Si Usted incumple estas restricciones, puede ser objeto de enjuiciamiento y daños. La Empresa se reserva todos los derechos no otorgados expresamente a Usted en este Acuerdo.\u003c/p\u003e\n\n\u003ch2\u003e4. Suscripciones y Pagos\u003c/h2\u003e\n\u003ch3\u003ePeríodo de Suscripción\u003c/h3\u003e\n\u003cp\u003eLa Aplicación o algunas partes de la Aplicación están disponibles únicamente con una Suscripción de pago. Se le facturará por adelantado de forma recurrente y periódica (como mensual o anual), dependiendo del tipo de plan de suscripción que seleccione al comprar la Suscripción.\u003c/p\u003e\n\u003cp\u003eAl final de cada período, Su Suscripción se renovará automáticamente bajo exactamente las mismas condiciones, a menos que Usted la cancele o la Empresa la cancele. El pago se cargará a Su método de pago registrado en el momento de la renovación.\u003c/p\u003e\n\n\u003ch3\u003eCancelación de la Suscripción\u003c/h3\u003e\n\u003cp\u003eUsted puede cancelar la renovación de Su Suscripción en cualquier momento a través de la configuración de Su cuenta dentro de la Aplicación o poniéndose en contacto con la Empresa a través del enlace de contacto proporcionado. Usted no recibirá un reembolso por las tarifas ya pagadas por Su período de suscripción actual y podrá continuar accediendo a la Aplicación hasta el final de Su período de suscripción actual.\u003c/p\u003e\n\n\u003ch3\u003eCambios de Precio\u003c/h3\u003e\n\u003cp\u003eLa Empresa, a su entera discreción y en cualquier momento, puede modificar las tarifas de la Suscripción. Cualquier cambio en la tarifa de la Suscripción se hará efectivo al final del período de Suscripción vigente en ese momento. La Empresa le proporcionará un aviso previo razonable de cualquier cambio en las tarifas de Suscripción para darle la oportunidad de terminar Su Suscripción antes de que dicho cambio se haga efectivo. Su uso continuado de la Aplicación después de que el cambio de la tarifa de Suscripción entre en vigor constituye Su acuerdo de pagar el monto de la tarifa de Suscripción modificada.\u003c/p\u003e\n\n\u003ch3\u003eReembolsos\u003c/h3\u003e\n\u003cp\u003eSalvo que la ley lo exija, las tarifas de Suscripción pagadas no son reembolsables. Ciertas solicitudes de reembolso para Suscripciones pueden ser consideradas por la Empresa caso por caso y otorgadas a la entera discreción de la Empresa.\u003c/p\u003e\n\n\u003ch3\u003ePrueba Gratuita\u003c/h3\u003e\n\u003cp\u003eLa Empresa puede, a su entera discreción, ofrecer una Suscripción con una prueba gratuita por un período de tiempo limitado. Es posible que se le solicite que ingrese Su información de facturación para registrarse en la prueba gratuita. Si ingresa Su información de facturación al registrarse para una prueba gratuita, no se le cobrará hasta que la prueba gratuita haya expirado. En el último día del período de prueba gratuita, a menos que haya cancelado Su Suscripción, se le cobrarán automáticamente las tarifas de Suscripción aplicables para el tipo de Suscripción que haya seleccionado. En cualquier momento y sin previo aviso, la Empresa se reserva el derecho de (i) modificar los términos y condiciones de la oferta de prueba gratuita, o (ii) cancelar dicha oferta de prueba gratuita.\u003c/p\u003e\n\n\u003ch2\u003e5. Contenido\u003c/h2\u003e\n\u003ch3\u003eResponsabilidad por el Contenido\u003c/h3\u003e\n\u003cp\u003eLa Empresa no es responsable de las entradas, la información o el Contenido de los usuarios de la Aplicación. Usted entiende y acepta expresamente que es el único responsable del Contenido que carga, transmite o muestra utilizando la Aplicación y de toda la actividad que ocurra bajo Su cuenta, ya sea realizada por Usted o por cualquier tercero que utilice Su cuenta.\u003c/p\u003e\n\u003cp\u003eUsted declara y garantiza que (i) el Contenido es Suyo (Usted es el propietario) o tiene el derecho de usarlo y nos concede los derechos y la licencia según lo dispuesto en estos Términos, y (ii) la publicación de Su Contenido en o a través de la Aplicación no viola los derechos de privacidad, derechos de publicidad, derechos de autor, derechos contractuales o cualquier otro derecho de cualquier persona.\u003c/p\u003e\n\n\u003ch3\u003eRestricciones de Contenido\u003c/h3\u003e\n\u003cp\u003eUsted no puede transmitir ningún Contenido que sea ilegal, ofensivo, perturbador, destinado a disgustar, amenazante, calumnioso, difamatorio, obsceno o de cualquier otra manera objetable. Ejemplos de dicho Contenido objetable incluyen, pero no se limitan a, lo siguiente:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eActividades ilegales o promoción de actividades ilegales.\u003c/li\u003e\n    \u003cli\u003eContenido difamatorio, discriminatorio o malicioso, incluyendo referencias o comentarios sobre religión, raza, orientación sexual, género, origen nacional/étnico u otros grupos específicos.\u003c/li\u003e\n    \u003cli\u003eSpam, generado por máquina o al azar, que constituya publicidad no autorizada o no solicitada, cartas en cadena, cualquier otra forma de solicitud no autorizada o cualquier forma de lotería o juego de azar.\u003c/li\u003e\n    \u003cli\u003eContenido que contenga o instale virus, gusanos, malware, troyanos u otro contenido diseñado o destinado a interrumpir, dañar o limitar el funcionamiento de cualquier software, hardware o equipo de telecomunicaciones o a dañar u obtener acceso no autorizado a datos o a otra información de un tercero.\u003c/li\u003e\n    \u003cli\u003eInfracción de los derechos de propiedad de cualquier parte, incluyendo patentes, marcas registradas, secretos comerciales, derechos de autor, derechos de publicidad u otros derechos.\u003c/li\u003e\n    \u003cli\u003eHacerse pasar por cualquier persona o entidad, incluyendo a la Empresa y sus empleados o representantes.\u003c/li\u003e\n    \u003cli\u003eViolación de la privacidad de cualquier tercero.\u003c/li\u003e\n    \u003cli\u003eInformación y características falsas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLa Empresa se reserva el derecho, pero no la obligación, a su entera discreción, de determinar si algún Contenido es apropiado y cumple con este Acuerdo, y de rechazar o eliminar dicho Contenido. La Empresa además se reserva el derecho de realizar formateo y ediciones y cambiar la manera de cualquier Contenido. La Empresa también puede limitar o revocar el uso de la Aplicación si Usted publica dicho Contenido objetable. Como la Empresa no puede controlar todo el contenido publicado por los usuarios y/o terceros en la Aplicación, Usted acepta usar la Aplicación bajo Su propio riesgo.\u003c/p\u003e\n\n\u003ch2\u003e6. Propiedad Intelectual\u003c/h2\u003e\n\u003cp\u003eLa Aplicación, incluyendo, sin limitación, todo su código fuente, características, funcionalidad, diseño, texto, gráficos, logotipos, iconos, imágenes, clips de audio y video, compilaciones de datos y software, así como todos los derechos de autor, patentes, marcas registradas, secretos comerciales y otros derechos de propiedad intelectual relacionados con los mismos (colectivamente, la \"Propiedad Intelectual\"), son y seguirán siendo propiedad única y exclusiva de la Empresa y sus licenciantes.\u003c/p\u003e\n\u003cp\u003eEl nombre TIMESAFE, el logotipo de TIMESAFE y todos los nombres, logotipos, nombres de productos y servicios, diseños y eslóganes relacionados son marcas comerciales de la Empresa o sus filiales o licenciantes. No debe utilizar dichas marcas sin el permiso previo por escrito de la Empresa. Todos los demás nombres, logotipos, nombres de productos y servicios, diseños y eslóganes en esta Aplicación son marcas comerciales de sus respectivos propietarios.\u003c/p\u003e\n\u003cp\u003eEste Acuerdo no le otorga ningún derecho de propiedad sobre la Aplicación, sino únicamente un derecho de uso limitado y revocable de acuerdo con sus términos. La Empresa no estará obligada a indemnizarle o defenderle con respecto a cualquier reclamación de terceros que surja de o esté relacionada con la Aplicación. En la medida en que la ley exija dicha indemnización, la Empresa, y no un tercero proveedor de la plataforma de aplicaciones, será la única responsable.\u003c/p\u003e\n\n\u003ch2\u003e7. Sus Sugerencias\u003c/h2\u003e\n\u003cp\u003eCualquier retroalimentación, comentario, idea, mejora o sugerencia (colectivamente, \"Sugerencias\") que Usted proporcione a la Empresa con respecto a la Aplicación se convertirá en propiedad única y exclusiva de la Empresa. Usted cede irrevocablemente a la Empresa todos los derechos, títulos e intereses sobre las Sugerencias.\u003c/p\u003e\n\u003cp\u003eLa Empresa será libre de usar, copiar, modificar, publicar o redistribuir las Sugerencias para cualquier propósito y de cualquier manera, sin que se le deba ningún crédito ni se le pague ninguna compensación. Usted renuncia a cualquier derecho moral que pueda tener sobre dichas Sugerencias.\u003c/p\u003e\n\n\u003ch2\u003e8. Modificaciones a la Aplicación\u003c/h2\u003e\n\u003cp\u003eLa Empresa se reserva el derecho de modificar, suspender o descontinuar, temporal o permanentemente, la Aplicación o cualquier servicio al que se conecte, con o sin previo aviso y sin ninguna responsabilidad hacia Usted.\u003c/p\u003e\n\u003ch3\u003eActualizaciones de la Aplicación\u003c/h3\u003e\n\u003cp\u003eLa Empresa puede, de vez en cuando, proporcionar mejoras o perfeccionamientos a las características/funcionalidad de la Aplicación, que pueden incluir parches, correcciones de errores, actualizaciones, mejoras y otras modificaciones (\"Actualizaciones\"). Las Actualizaciones pueden modificar o eliminar ciertas características y/o funcionalidades de la Aplicación.\u003c/p\u003e\n\u003cp\u003eUsted acepta que la Empresa no tiene ninguna obligación de (i) proporcionar ninguna Actualización, o (ii) continuar proporcionando o habilitando características y/o funcionalidades particulares de la Aplicación para Usted. Además, Usted acepta que todas las Actualizaciones se considerarán una parte integral de la Aplicación y estarán sujetas a los términos y condiciones de este Acuerdo.\u003c/p\u003e\n\u003ch3\u003eMantenimiento y Soporte\u003c/h3\u003e\n\u003cp\u003eUsted reconoce que la Empresa no tiene ninguna obligación de proporcionar mantenimiento o soporte para la descarga y el uso de la Aplicación. Cualquier soporte que la Empresa decida proporcionar será a su entera discreción.\u003c/p\u003e\n\n\u003ch2\u003e9. Servicios de Terceros\u003c/h2\u003e\n\u003cp\u003eLa Aplicación puede mostrar, incluir o poner a disposición contenido de terceros (incluyendo datos, información, aplicaciones y otros servicios de productos) o proporcionar enlaces a sitios web o servicios de terceros (\"Servicios de Terceros\").\u003c/p\u003e\n\u003cp\u003eUsted reconoce y acepta que la Empresa no será responsable de ningún Servicio de Terceros, incluyendo su exactitud, integridad, puntualidad, validez, cumplimiento de derechos de autor, legalidad, decencia, calidad o cualquier otro aspecto de los mismos. La Empresa no asume y no tendrá ninguna responsabilidad ante Usted o cualquier otra persona o entidad por los Servicios de Terceros.\u003c/p\u003e\n\u003cp\u003eLos Servicios de Terceros y los enlaces a los mismos se proporcionan únicamente para Su conveniencia y Usted accede y los utiliza enteramente bajo Su propio riesgo y sujeto a los términos y condiciones de dichos terceros.\u003c/p\u003e\n\n\u003ch2\u003e10. Vigencia y Rescisión\u003c/h2\u003e\n\u003cp\u003eEste Acuerdo permanecerá en vigor hasta que sea rescindido por Usted o por la Empresa.\u003c/p\u003e\n\u003cp\u003eLa Empresa puede, a su entera discreción, en cualquier momento y por cualquier motivo o sin motivo alguno, suspender o rescindir este Acuerdo con o sin previo aviso. Las razones para la rescisión pueden incluir, entre otras, el incumplimiento de este Acuerdo.\u003c/p\u003e\n\u003cp\u003eEste Acuerdo se rescindirá inmediatamente, sin previo aviso de la Empresa, en caso de que Usted no cumpla con alguna de las disposiciones de este Acuerdo.\u003c/p\u003e\n\u003cp\u003eUsted puede rescindir este Acuerdo eliminando la Aplicación y todas las copias de la misma de Su Dispositivo.\u003c/p\u003e\n\u003cp\u003eTras la rescisión de este Acuerdo, Usted deberá cesar todo uso de la Aplicación y eliminar todas las copias de la Aplicación de Su Dispositivo. La rescisión de este Acuerdo no limitará ninguno de los derechos o recursos de la Empresa por ley o en equidad en caso de incumplimiento por Su parte de cualquiera de Sus obligaciones bajo el presente Acuerdo.\u003c/p\u003e\n\u003cp\u003eLas secciones que, por su naturaleza, deban sobrevivir a la rescisión, sobrevivirán, incluyendo, sin limitación, las disposiciones de propiedad, exclusiones de garantía, indemnización y limitaciones de responsabilidad.\u003c/p\u003e\n\n\u003ch2\u003e11. Privacidad de Datos y Cumplimiento de la LGPD\u003c/h2\u003e\n\u003cp\u003eLa Empresa se compromete a proteger Su privacidad y a cumplir con la Ley General de Protección de Datos de Brasil (LGPD). Nuestra Política de Privacidad, que se incorpora por referencia a este Acuerdo, describe cómo recopilamos, usamos, divulgamos y protegemos Sus Datos Personales.\u003c/p\u003e\n\u003ch3\u003eDerechos del Titular de los Datos\u003c/h3\u003e\n\u003cp\u003eDe conformidad con la LGPD, Usted tiene derecho a:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eConfirmar la existencia del tratamiento de sus datos.\u003c/li\u003e\n    \u003cli\u003eAcceder a sus datos.\u003c/li\u003e\n    \u003cli\u003eCorregir datos incompletos, inexactos o desactualizados.\u003c/li\u003e\n    \u003cli\u003eAnonimizar, bloquear o eliminar datos innecesarios, excesivos o tratados en incumplimiento de la LGPD.\u003c/li\u003e\n    \u003cli\u003eSolicitar la portabilidad de los datos a otro proveedor de servicios o productos.\u003c/li\u003e\n    \u003cli\u003eEliminar los datos personales tratados con su consentimiento.\u003c/li\u003e\n    \u003cli\u003eObtener información sobre las entidades públicas y privadas con las que la Empresa ha compartido sus datos.\u003c/li\u003e\n    \u003cli\u003eObtener información sobre la posibilidad de no dar su consentimiento y las consecuencias de la negativa.\u003c/li\u003e\n    \u003cli\u003eRevocar su consentimiento en cualquier momento.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePara ejercer estos derechos, por favor contáctenos a través de los canales oficiales indicados en este Acuerdo.\u003c/p\u003e\n\u003ch3\u003eTransferencias Internacionales de Datos\u003c/h3\u003e\n\u003cp\u003eSi transferimos Sus Datos Personales fuera de Brasil, nos aseguraremos de que se haga de conformidad con la LGPD, incluyendo el uso de Cláusulas Contrac
