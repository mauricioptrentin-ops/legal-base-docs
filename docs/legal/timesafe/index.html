li\u003eQue promova violência, terrorismo, atividades ilegais ou discriminação com base em raça, sexo, religião, nacionalidade, deficiência, orientação sexual ou idade.\u003c/li\u003e\n        \u003cli\u003eQue infrinja qualquer patente, marca registrada, segredo comercial, direito autoral ou outros direitos de propriedade intelectual ou de propriedade de qualquer parte.\u003c/li\u003e\n        \u003cli\u003eQue contenha vírus de software, worms, cavalos de Tróia ou qualquer outro código de computador, arquivos ou programas projetados para interromper, destruir ou limitar a funcionalidade de qualquer software ou hardware de computador ou equipamento de telecomunicações.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003e8. Propriedade Intelectual\u003c/h3\u003e\n    \u003cp\u003eO Aplicativo, incluindo, sem limitação, todo o seu código-fonte e objeto, design, estrutura, aparência (look and feel), texto, gráficos, interface, fotografias, sons, vídeos, marcas registradas, logotipos, segredos comerciais e outros direitos de propriedade intelectual, são e permanecerão propriedade única e exclusiva da Empresa e de seus licenciadores.\u003c/p\u003e\n    \u003cp\u003eEste Contrato não lhe concede quaisquer direitos de propriedade sobre o Aplicativo, mas apenas um direito limitado de uso, revogável de acordo com seus termos. A Empresa reserva-se todos os direitos não expressamente concedidos a Você neste Contrato. As marcas \"TIMESAFE\" e todos os logotipos associados são marcas comerciais da Empresa. Você não poderá usá-los sem o consentimento prévio por escrito da Empresa.\u003c/p\u003e\n    \u003cp\u003eA EMPRESA NÃO SERÁ OBRIGADA A INDENIZAR OU DEFENDÊ-LO EM RELAÇÃO A QUALQUER RECLAMAÇÃO DE TERCEIROS DECORRENTE DE OU RELACIONADA AO SEU USO DO APLICATIVO. NA MEDIDA EM QUE QUALQUER REIVINDICAÇÃO DE VIOLAÇÃO DE PROPRIEDADE INTELECTUAL DE TERCEIROS SURJA, A EMPRESA, E NÃO A LOJA DE APLICATIVOS, SERÁ A ÚNICA RESPONSÁVEL PELA INVESTIGAÇÃO, DEFESA, ACORDO E QUITAÇÃO DE TAL REIVINDICAÇÃO, SE E SOMENTE SE A REIVINDICAÇÃO RESULTAR DIRETAMENTE DO USO DO APLICATIVO CONFORME AUTORIZADO POR ESTE CONTRATO.\u003c/p\u003e\n\n    \u003ch3\u003e9. Suas Sugestões\u003c/h3\u003e\n    \u003cp\u003eQualquer feedback, comentários, ideias, melhorias ou sugestões (\"Sugestões\") fornecidas por Você à Empresa com relação ao Aplicativo, seja por e-mail, fóruns, através do Aplicativo ou de outra forma, se tornarão propriedade única e exclusiva da Empresa.\u003c/p\u003e\n    \u003cp\u003eA Empresa estará livre para usar, copiar, modificar, publicar, ou redistribuir as Sugestões para qualquer finalidade e de qualquer forma, sem qualquer crédito, reconhecimento ou compensação financeira para Você. Você cede irrevogavelmente à Empresa todos os direitos, títulos e interesses sobre todas as Sugestões.\u003c/p\u003e\n\n    \u003ch3\u003e10. Modificações no Aplicativo\u003c/h3\u003e\n    \u003cp\u003eA Empresa reserva-se o direito de, a seu exclusivo critério, modificar, suspender ou descontinuar, temporária ou permanentemente, o Aplicativo ou qualquer serviço ao qual ele se conecte, com ou sem aviso prévio e sem qualquer responsabilidade para com Você.\u003c/p\u003e\n    \u003ch4\u003eAtualizações do Aplicativo\u003c/h4\u003e\n    \u003cp\u003eA Empresa pode, de tempos em tempos, fornecer aprimoramentos ou melhorias nos recursos/funcionalidades do Aplicativo, que podem incluir patches, correções de bugs, atualizações, upgrades e outras modificações (\"Atualizações\"). As Atualizações podem modificar ou excluir completamente certos recursos e/ou funcionalidades. Você concorda que a Empresa não tem nenhuma obrigação de (i) fornecer quaisquer Atualizações, ou (ii) continuar a fornecer ou habilitar quaisquer recursos e/ou funcionalidades específicas do Aplicativo para Você. Você concorda ainda que todas as Atualizações serão consideradas parte integrante do Aplicativo e estarão sujeitas aos termos e condições deste Contrato.\u003c/p\u003e\n    \u003ch4\u003eManutenção e Suporte\u003c/h4\u003e\n    \u003cp\u003eA Empresa não tem obrigação de fornecer qualquer manutenção ou suporte técnico para o download, instalação ou uso do Aplicativo. Qualquer suporte que a Empresa possa oferecer será a seu exclusivo critério.\u003c/p\u003e\n\n    \u003ch3\u003e11. Serviços de Terceiros\u003c/h3\u003e\n    \u003cp\u003eO Aplicativo pode exibir, incluir ou disponibilizar conteúdo de terceiros (incluindo dados, informações, aplicativos e outros produtos ou serviços) ou fornecer links para sites ou serviços de terceiros (\"Serviços de Terceiros\").\u003c/p\u003e\n    \u003cp\u003eVocê reconhece e concorda que a Empresa não será responsável, direta ou indiretamente, por quaisquer Serviços de Terceiros, incluindo sua precisão, integridade, oportunidade, validade, conformidade com direitos autorais, legalidade, decência, qualidade ou qualquer outro aspecto. A Empresa não assume e não terá qualquer obrigação ou responsabilidade perante Você ou qualquer outra pessoa ou entidade por quaisquer Serviços de Terceiros. Os Serviços de Terceiros e os links para eles são fornecidos apenas como uma conveniência para Você, e Você os acessa e usa inteiramente por sua conta e risco e sujeito aos termos e condições de tais terceiros.\u003c/p\u003e\n\n    \u003ch3\u003e12. Vigência e Rescisão\u003c/h3\u003e\n    \u003cp\u003eEste Contrato permanecerá em vigor até ser rescindido por Você ou pela Empresa.\u003c/p\u003e\n    \u003cp\u003eA Empresa pode, a seu exclusivo critério, a qualquer momento e por qualquer motivo ou sem motivo algum, suspender ou rescindir este Contrato, com ou sem aviso prévio. Os motivos para rescisão podem incluir, mas não se limitam a, violação deste Contrato, inatividade da conta ou descontinuação do serviço.\u003c/p\u003e\n    \u003cp\u003eEste Contrato será rescindido imediatamente, sem aviso prévio da Empresa, caso Você não cumpra qualquer disposição deste Contrato. Você também pode rescindir este Contrato excluindo o Aplicativo e todas as suas cópias de seus Dispositivos.\u003c/p\u003e\n    \u003cp\u003eApós a rescisão deste Contrato, por qualquer motivo, Você deverá cessar imediatamente todo o uso do Aplicativo e excluir permanentemente todas as cópias do Aplicativo de todos os seus Dispositivos. A rescisão deste Contrato não limitará nenhum dos direitos ou recursos da Empresa perante a lei ou em equidade em caso de violação por Você de qualquer uma de suas obrigações sob o presente Contrato.\u003c/p\u003e\n    \u003cp\u003eAs cláusulas de Propriedade Intelectual, Suas Sugestões, Indenização, Sem Garantias, Limitação de Responsabilidade, Lei Aplicável e Privacidade de Dados sobreviverão à rescisão deste Contrato.\u003c/p\u003e\n\n    \u003ch3\u003e13. Assinaturas e Pagamentos\u003c/h3\u003e\n    \n    \u003ch4\u003ePeríodo de Assinatura\u003c/h4\u003e\n    \u003cp\u003eO Aplicativo ou algumas de suas partes e funcionalidades estão disponíveis apenas mediante uma Assinatura paga. Você será cobrado antecipadamente de forma recorrente e periódica (\"Ciclo de Faturamento\"), seja mensalmente ou anualmente, dependendo do tipo de plano de assinatura que você selecionar ao comprar a Assinatura.\u003c/p\u003e\n    \u003cp\u003eAo final de cada Ciclo de Faturamento, sua Assinatura será renovada automaticamente sob as mesmas condições, a menos que Você a cancele ou a Empresa a cancele. A cobrança será realizada através do método de pagamento registrado em sua conta.\u003c/p\u003e\n\n    \u003ch4\u003eCancelamento de Assinatura\u003c/h4\u003e\n    \u003cp\u003eVocê pode cancelar a renovação de sua Assinatura a qualquer momento, seja através da página de configurações de sua conta no Aplicativo ou entrando em contato conosco através do link de contato oficial. Você não receberá um reembolso pelas taxas já pagas pelo seu período de assinatura atual. Você continuará a ter acesso ao serviço até o final do seu período de assinatura atual.\u003c/p\u003e\n    \n    \u003ch4\u003eAlterações de Preço\u003c/h4\u003e\n    \u003cp\u003eA Empresa pode, a seu exclusivo critério e a qualquer momento, modificar as taxas de Assinatura. Qualquer alteração de preço da Assinatura entrará em vigor no final do Ciclo de Faturamento então vigente. A Empresa fornecerá a Você um aviso prévio razoável sobre qualquer alteração nas taxas de Assinatura para lhe dar a oportunidade de rescindir sua Assinatura antes que tal alteração se torne efetiva. Seu uso continuado do serviço após a alteração da taxa de Assinatura entrar em vigor constitui sua concordância em pagar o valor da taxa de Assinatura modificada.\u003c/p\u003e\n    \n    \u003ch4\u003eReembolsos\u003c/h4\u003e\n    \u003cp\u003eEXCETO QUANDO EXIGIDO PELA LEI APLICÁVEL, AS TAXAS DE ASSINATURA PAGAS SÃO NÃO-REEMBOLSÁVEIS. Determinadas solicitações de reembolso para Assinaturas podem ser consideradas pela Empresa caso a caso e concedidas a critério exclusivo da Empresa.\u003c/p\u003e\n    \n    \u003ch4\u003eTeste Gratuito (Free Trial)\u003c/h4\u003e\n    \u003cp\u003eA Empresa pode, a seu exclusivo critério, oferecer uma Assinatura com um teste gratuito por um período limitado (\"Teste Gratuito\"). Você pode ser obrigado a inserir suas informações de faturamento para se inscrever no Teste Gratuito. Se Você inserir suas informações de faturamento, não será cobrado pela Empresa até que o Teste Gratuito tenha expirado. No último dia do período de Teste Gratuito, a menos que Você tenha cancelado sua Assinatura, Você será cobrado automaticamente pelas taxas de Assinatura aplicáveis ao tipo de Assinatura que selecionou. A qualquer momento e sem aviso prévio, a Empresa se reserva o direito de (i) modificar os termos e condições da oferta de Teste Gratuito, ou (ii) cancelar tal oferta de Teste Gratuito.\u003c/p\u003e\n\n    \u003ch3\u003e14. Privacidade e Proteção de Dados (LGPD)\u003c/h3\u003e\n    \u003cp\u003eA Empresa está comprometida com a proteção de seus Dados Pessoais e com a conformidade com a Lei Geral de Proteção de Dados (LGPD) e regulamentações correlatas, incluindo as atualizações de 2024-2025.\u003c/p\u003e\n    \n    \u003ch4\u003eTratamento de Dados Pessoais\u003c/h4\u003e\n    \u003cp\u003eAo usar o Aplicativo, a Empresa pode coletar e tratar certos Dados Pessoais, como dados de cadastro (nome, e-mail), dados de pagamento, dados de uso do dispositivo e do aplicativo, e informações técnicas. O tratamento desses dados é realizado com base na execução deste Contrato, no cumprimento de obrigações legais, no legítimo interesse da Empresa para melhorar o serviço e, quando aplicável, no seu consentimento.\u003c/p\u003e\n\n    \u003ch4\u003eSeus Direitos como Titular dos Dados\u003c/h4\u003e\n    \u003cp\u003eDe acordo com a LGPD, Você tem o direito de:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eConfirmar a existência de tratamento de seus dados;\u003c/li\u003e\n        \u003cli\u003eAcessar seus dados;\u003c/li\u003e\n        \u003cli\u003eCorrigir dados incompletos, inexatos ou desatualizados;\u003c/li\u003e\n        \u003cli\u003eSolicitar a anonimização, bloqueio ou eliminação de dados desnecessários, excessivos ou tratados em desconformidade com a LGPD;\u003c/li\u003e\n        \u003cli\u003eSolicitar a portabilidade dos seus dados a outro fornecedor de serviço ou produto;\u003c/li\u003e\n        \u003cli\u003eEliminar os dados pessoais tratados com o seu consentimento;\u003c/li\u003e\n        \u003cli\u003eObter informações sobre as entidades públicas e privadas com as quais a Empresa realizou uso compartilhado de dados;\u003c/li\u003e\n        \u003cli\u003eObter informação sobre a possibilidade de não fornecer consentimento e sobre as consequências da negativa;\u003c/li\u003e\n        \u003cli\u003eRevogar o seu consentimento a qualquer momento.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003ePara exercer seus direitos, entre em contato conosco através do canal oficial de contato.\u003c/p\u003e\n\n    \u003ch4\u003eTransferência Internacional de Dados\u003c/h4\u003e\n    \u003cp\u003eO Aplicativo pode ser operado em servidores localizados fora do Brasil. Caso seus Dados Pessoais sejam transferidos internacionalmente, a Empresa garante que tal transferência ocorrerá em conformidade com a LGPD, utilizando mecanismos como as Cláusulas Contratuais Padrão aprovadas pela ANPD, conforme a Resolução CD/ANPD nº 19/2024, ou outras salvaguardas adequadas para garantir um nível de proteção de dados equivalente ao brasileiro.\u003c/p\u003e\n\n    \u003ch4\u003eNotificação de Incidentes de Segurança\u003c/h4\u003e\n    \u003cp\u003eEm conformidade com as regulamentações da ANPD, no caso de um incidente de segurança que possa acarretar risco ou dano relevante aos Titulares dos Dados, a Empresa comunicará a ocorrência à ANPD e aos Titulares afetados em um prazo de \u003cstrong\u003e3 (três) dias úteis\u003c/strong\u003e a contar da data de conhecimento do incidente, fornecendo as informações necessárias sobre o ocorrido, os riscos e as medidas adotadas.\u003c/p\u003e\n    \n    \u003ch4\u003eEncarregado de Proteção de Dados (DPO)\u003c/h4\u003e\n    \u003cp\u003eA Empresa nomeou um Encarregado de Proteção de Dados (DPO) para supervisionar questões relacionadas a esta política de privacidade e à LGPD. Se você tiver alguma dúvida ou para exercer seus direitos, por favor, entre em contato com nosso DPO através do formulário disponível em nosso site.\u003c/p\u003e\n    \n    \u003ch3\u003e15. Indenização\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eVOCÊ CONCORDA EM INDENIZAR, DEFENDER E ISENTAR A EMPRESA, SUAS AFILIADAS, SUBSIDIÁRIAS, DIRETORES, FUNCIONÁRIOS, AGENTES, SUCESSORES, PARCEIROS E LICENCIADORES DE E CONTRA TODAS E QUAISQUER RECLAMAÇÕES, RESPONSABILIDADES, DANOS, PERDAS, CUSTOS, JULGAMENTOS E DESPESAS (INCLUINDO HONORÁRIOS ADVOCATÍCIOS RAZOÁVEIS) DECORRENTES DE OU RELACIONADOS A: (A) SEU USO OU MAU USO DO APLICATIVO; (B) QUALQUER VIOLAÇÃO DESTES TERMOS E CONDIÇÕES POR VOCÊ; (C) QUALQUER CONTEÚDO QUE VOCÊ POSTE, ENVIE OU TRANSMITA ATRAVÉS DO APLICATIVO; (D) SUA VIOLAÇÃO DE QUALQUER LEI, REGRA OU REGULAMENTO APLICÁVEL; OU (E) SUA VIOLAÇÃO DOS DIREITOS DE TERCEIROS, INCLUINDO DIREITOS DE PROPRIEDADE INTELECTUAL.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eA Empresa se reserva o direito de assumir a defesa e o controle exclusivos de qualquer assunto sujeito a indenização por Você, caso em que Você cooperará plenamente com a Empresa na afirmação de quaisquer defesas disponíveis.\u003c/p\u003e\n\n    \u003ch3\u003e16. Isenção de Garantias (\"COMO ESTÁ\")\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, O APLICATIVO É FORNECIDO A VOCÊ \"COMO ESTÁ\" E \"CONFORME DISPONÍVEL\", COM TODAS AS FALHAS E DEFEITOS, SEM QUALQUER TIPO DE GARANTIA.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eA EMPRESA, EM SEU PRÓPRIO NOME E EM NOME DE SUAS AFILIADAS E DE SEUS RESPECTIVOS LICENCIADORES E PRESTADORES DE SERVIÇOS, RENUNCIA EXPRESSAMENTE A TODAS AS GARANTIAS, SEJAM ELAS EXPRESSAS, IMPLÍCITAS, LEGAIS OU DE OUTRA FORMA, COM RELAÇÃO AO APLICATIVO, INCLUINDO, MAS NÃO SE LIMITANDO A, TODAS AS GARANTIAS IMPLÍCITAS DE COMERCIABILIDADE, ADEQUAÇÃO A UM FIM ESPECÍFICO, TÍTULO, NÃO VIOLAÇÃO E GARANTIAS QUE POSSAM SURGIR DO CURSO DE NEGOCIAÇÃO, CURSO DE DESEMPENHO, USO OU PRÁTICA COMERCIAL.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eSEM LIMITAÇÃO AO PRECEDENTE, A EMPRESA NÃO OFERECE NENHUMA GARANTIA OU COMPROMISSO, E NÃO FAZ QUALQUER DECLARAÇÃO DE QUALQUER TIPO DE QUE O APLICATIVO ATENDERÁ ÀS SUAS NECESSIDADES, ALCANÇARÁ OS RESULTADOS PRETENDIDOS, SERÁ COMPATÍVEL OU FUNCIONARÁ COM QUALQUER OUTRO SOFTWARE, APLICATIVO, SISTEMA OU SERVIÇO, OPERARÁ SEM INTERRUPÇÃO, ATENDERÁ A QUAISQUER PADRÕES DE DESEMPENHO OU CONFIABILIDADE, OU QUE SERÁ LIVRE DE ERROS, VÍRUS, BUGS OU OUTROS COMPONENTES PREJUDICIAIS. VOCÊ ASSUME TOTAL RESPONSABILIDADE E RISCO PELO SEU USO DO APLICATIVO.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eAlgumas jurisdições não permitem a exclusão de certos tipos de garantias ou limitações dos direitos legais aplicáveis de um consumidor, portanto, algumas ou todas as exclusões e limitações acima podem não se aplicar a Você. Mas, em tal caso, as exclusões e limitações estabelecidas nesta seção serão aplicadas na maior extensão possível sob a lei aplicável.\u003c/p\u003e\n\n    \u003ch3\u003e17. Limitação de Responsabilidade\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, EM NENHUM CASO A EMPRESA, SUAS AFILIADAS, OU SEUS FORNECEDORES, DIRETORES, FUNCIONÁRIOS OU AGENTES SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS, PUNITIVOS, EXEMPLARES OU CONSEQUENTES DE QUALQUER NATUREZA (INCLUINDO, MAS NÃO LIMITADO A, DANOS POR PERDA DE LUCROS, PERDA DE DADOS OU OUTRAS INFORMAÇÕES CONFIDENCIAIS, POR INTERRUPÇÃO DE NEGÓCIOS, POR LESÃO PESSOAL, PERDA DE PRIVACIDADE, DECORRENTES DE OU DE QUALQUER FORMA RELACIONADOS AO USO OU INCAPACIDADE DE USAR O APLICATIVO, SOFTWARE DE TERCEIROS E/OU HARDWARE DE TERCEIROS USADO COM O APLICATIVO, OU DE OUTRA FORMA EM CONEXÃO COM QUALQUER DISPOSIÇÃO DESTE CONTRATO), MESMO QUE A EMPRESA OU QUALQUER FORNECEDOR TENHA SIDO AVISADO DA POSSIBILIDADE DE TAIS DANOS E MESMO QUE A SOLUÇÃO FALHE EM SEU PROPÓSITO ESSENCIAL.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eNÃO OBSTANTE QUAISQUER DANOS QUE VOCÊ POSSA INCORRER, A RESPONSABILIDADE TOTAL E CUMULATIVA DA EMPRESA E DE QUALQUER UM DE SEUS FORNECEDORES SOB QUALQUER DISPOSIÇÃO DESTE CONTRATO, E SEU RECURSO EXCLUSIVO PARA TODO O ACIMA EXPOSTO, SERÁ LIMITADA AO MAIOR VALOR ENTRE: (A) O VALOR TOTAL EFETIVAMENTE PAGO POR VOCÊ À EMPRESA PELA LICENÇA DO APLICATIVO DURANTE O PERÍODO DE 12 (DOZE) MESES IMEDIATAMENTE ANTERIOR AO EVENTO QUE DEU ORIGEM À RECLAMAÇÃO; OU (B) R$ 100,00 (CEM REAIS).\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eAs limitações e exclusões de responsabilidade acima se aplicam independentemente de os danos decorrerem de (a) quebra de contrato, (b) quebra de garantia, (c) negligência, ou (d) qualquer outra causa de pedir, na medida em que tais exclusões e limitações não sejam proibidas pela lei aplicável.\u003c/p\u003e\n\n    \u003ch3\u003e18. Disposições Gerais\u003c/h3\u003e\n    \u003ch4\u003eLei Aplicável e Jurisdição\u003c/h4\u003e\n    \u003cp\u003eEste Contrato e o seu uso do Aplicativo serão regidos e interpretados de acordo com as leis da República Federativa do Brasil, excluindo suas regras sobre conflitos de leis.\u003c/p\u003e\n    \u003cp\u003ePara a solução de quaisquer controvérsias ou disputas decorrentes ou relacionadas a este Contrato, fica eleito o foro da Comarca de São Paulo, Estado de São Paulo, Brasil, com renúncia expressa a qualquer outro, por mais privilegiado que seja.\u003c/p\u003e\n\n    \u003ch4\u003eDivisibilidade\u003c/h4\u003e\n    \u003cp\u003eSe qualquer disposição deste Contrato for considerada inexequível ou inválida, tal disposição será alterada e interpretada para cumprir os objetivos de tal disposição na maior medida possível sob a lei aplicável, e as disposições restantes continuarão em pleno vigor e efeito.\u003c/p\u003e\n\n    \u003ch4\u003eRenúncia\u003c/h4\u003e\n    \u003cp\u003eA falha de qualquer uma das partes em exercer qualquer direito ou exigir o cumprimento de qualquer obrigação sob este Contrato não afetará a capacidade dessa parte de exercer tal direito ou exigir tal cumprimento em qualquer momento posterior, nem a renúncia a uma violação constituirá uma renúncia a qualquer violação subsequente.\u003c/p\u003e\n    \n    \u003ch4\u003eAcordo Integral\u003c/h4\u003e\n    \u003cp\u003eEste Contrato, juntamente com a Política de Privacidade e quaisquer outros avisos legais publicados pela Empresa, constituem o acordo integral entre Você e a Empresa em relação ao seu uso do Aplicativo e substituem todos os acordos e entendimentos anteriores e contemporâneos, sejam eles escritos ou orais.\u003c/p\u003e\n\n    \u003ch3\u003e19. Contato\u003c/h3\u003e\n    \u003cp\u003eSe você tiver alguma dúvida sobre este Contrato de Licença de Usuário Final, pode entrar em contato conosco:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eVisitando esta página em nosso site: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\u003c/body\u003e\n\u003c/html\u003e","label":"Contrato de Licença de Usuário Final (EULA)","languageLabel":"Português"},{"documentType":"privacy_policy","language":"PT","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"pt-BR\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003ctitle\u003ePolítica de Privacidade - TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch1\u003ePolítica de Privacidade do TIMESAFE\u003c/h1\u003e\n    \u003cp\u003e\u003cstrong\u003eData da Última Atualização:\u003c/strong\u003e 1 de outubro de 2026\u003c/p\u003e\n\n    \u003cp\u003eBem-vindo ao TIMESAFE (\"Serviço\"). Esta Política de Privacidade é um documento legalmente vinculativo entre Você, o usuário final, e a TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS (\"Empresa\", \"Nós\", \"Nosso\"). Esta política rege a coleta, o uso, a divulgação, o tratamento e a proteção de suas informações pessoais e outros dados que coletamos em conexão com o seu uso do nosso software, aplicativo e serviços relacionados.\u003c/p\u003e\n\n    \u003cp\u003e\u003cstrong\u003eAO ACESSAR, BAIXAR, INSTALAR OU DE QUALQUER FORMA UTILIZAR O SERVIÇO, VOCÊ (A) RECONHECE QUE LEU, COMPREENDEU E CONCORDA EM FICAR VINCULADO INTEGRALMENTE A ESTA POLÍTICA DE PRIVACIDADE; E (B) DECLARA QUE POSSUI IDADE LEGAL E CAPACIDADE PARA FIRMAR ESTE ACORDO VINCULATIVO. SE VOCÊ NÃO CONCORDAR COM TODOS OS TERMOS E CONDIÇÕES DESTA POLÍTICA DE PRIVACIDADE, VOCÊ NÃO DEVE ACESSAR, BAIXAR OU UTILIZAR O SERVIÇO.\u003c/strong\u003e\u003c/p\u003e\n\n    \u003cp\u003eEsta Política de Privacidade foi elaborada em estrita conformidade com a Lei nº 13.709/2018 (Lei Geral de Proteção de Dados - \"LGPD\") e suas atualizações, incluindo as diretrizes e resoluções mais recentes da Autoridade Nacional de Proteção de Dados (\"ANPD\"). Nosso compromisso primordial é com a proteção da sua privacidade e a transparência no tratamento de seus dados.\u003c/p\u003e\n\n    \u003ch2\u003e1. Interpretação e Definições\u003c/h2\u003e\n    \u003ch3\u003e1.1. Interpretação\u003c/h3\u003e\n    \u003cp\u003eOs termos iniciados com letra maiúscula nesta Política de Privacidade terão os significados a eles atribuídos abaixo. Estas definições se aplicam independentemente de os termos aparecerem no singular ou no plural.\u003c/p\u003e\n\n    \u003ch3\u003e1.2. Definições\u003c/h3\u003e\n    \u003cp\u003ePara os fins desta Política de Privacidade:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eVocê\u003c/strong\u003e refere-se ao indivíduo que acessa ou utiliza o Serviço, ou à empresa ou outra entidade legal em nome da qual tal indivíduo está acessando ou utilizando o Serviço, conforme aplicável. Sob a LGPD, \"Você\" é também referido como o \"Titular\".\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"a Empresa\", \"Nós\", \"Nosso(a)\") refere-se a \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, pessoa jurídica de direito privado, inscrita no CNPJ sob o nº 41.648.990/0001-56, com NIRE 35237097027, com sede na ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServiço\u003c/strong\u003e refere-se ao software, aplicativo e site do \u003cstrong\u003eTIMESAFE\u003c/strong\u003e, incluindo todas as suas funcionalidades, conteúdo e serviços associados, acessíveis através de nosso site ou plataformas de aplicativos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eConta\u003c/strong\u003e significa uma conta única e intransferível criada por Você para acessar e utilizar nosso Serviço ou partes dele.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDados Pessoais\u003c/strong\u003e significa qualquer informação relacionada a uma pessoa natural identificada ou identificável (\"Titular dos Dados\").\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDados de Uso\u003c/strong\u003e refere-se a dados coletados automaticamente, gerados pelo uso do Serviço ou pela própria infraestrutura do Serviço (por exemplo, a duração de uma visita a uma página, logs de sistema).\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTratamento\u003c/strong\u003e significa toda operação realizada com Dados Pessoais, como as que se referem a coleta, produção, recepção, classificação, utilização, acesso, reprodução, transmissão, distribuição, processamento, arquivamento, armazenamento, eliminação, avaliação ou controle da informação, modificação, comunicação, transferência, difusão ou extração.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eConsentimento\u003c/strong\u003e é a manifestação livre, informada e inequívoca pela qual o Titular concorda com o Tratamento de seus Dados Pessoais para uma finalidade determinada.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eANPD\u003c/strong\u003e refere-se à Autoridade Nacional de Proteção de Dados, órgão da administração pública federal responsável por zelar, implementar e fiscalizar o cumprimento da LGPD em todo o território nacional.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eControlador\u003c/strong\u003e refere-se à pessoa natural ou jurídica, de direito público ou privado, a quem competem as decisões referentes ao Tratamento de Dados Pessoais. Para os fins desta Política, a \u003cstrong\u003eEmpresa\u003c/strong\u003e é a Controladora dos seus Dados Pessoais.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eOperador\u003c/strong\u003e refere-se à pessoa natural ou jurídica, de direito público ou privado, que realiza o Tratamento de Dados Pessoais em nome do Controlador.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePaís\u003c/strong\u003e refere-se à República Federativa do Brasil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e significa qualquer aparelho eletrônico que possa acessar o Serviço, como um computador, smartphone ou tablet.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e2. Coleta e Uso de Seus Dados Pessoais\u003c/h2\u003e\n    \u003cp\u003eColetamos diferentes tipos de informações para várias finalidades, visando fornecer e aprimorar nosso Serviço para Você. O Tratamento de seus Dados Pessoais será sempre fundamentado em uma das bases legais previstas na LGPD, como a execução de contrato, o cumprimento de obrigação legal, o legítimo interesse do Controlador ou o seu Consentimento, quando aplicável.\u003c/p\u003e\n\n    \u003ch2\u003e3. Tipos de Dados Coletados\u003c/h2\u003e\n    \u003ch3\u003e3.1. Dados Pessoais\u003c/h3\u003e\n    \u003cp\u003eAo utilizar nosso Serviço, especialmente ao criar uma Conta, adquirir uma assinatura ou entrar em contato conosco, podemos solicitar que Você nos forneça certas informações de identificação pessoal. Essas informações podem incluir, mas não se limitam a:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eDados de Identificação:\u003c/strong\u003e Nome completo, CPF, RG.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDados de Contato:\u003c/strong\u003e Endereço de e-mail, número de telefone.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDados de Localização:\u003c/strong\u003e Endereço completo (rua, número, complemento, bairro, cidade, estado, CEP).\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDados Financeiros:\u003c/strong\u003e Informações de cartão de crédito/débito, endereço de faturamento e outros dados de pagamento necessários para processar suas transações. Estes dados são coletados e processados diretamente por nossos parceiros de processamento de pagamentos, que são certificados PCI-DSS, e não são armazenados em nossos servidores.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDados Profissionais:\u003c/strong\u003e Cargo, nome da empresa (se aplicável).\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003e3.2. Dados de Uso\u003c/h3\u003e\n    \u003cp\u003eOs Dados de Uso são coletados automaticamente quando Você utiliza o Serviço. A coleta desses dados é essencial para a manutenção da segurança, para a otimização do desempenho e para a análise de tendências de uso do nosso Serviço.\u003c/p\u003e\n    \u003cp\u003eOs Dados de Uso podem incluir, entre outros:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eEndereço de Protocolo de Internet do seu Dispositivo (endereço IP).\u003c/li\u003e\n        \u003cli\u003eTipo e versão do navegador, sistema operacional.\u003c/li\u003e\n        \u003cli\u003eIdentificadores únicos de dispositivo (por exemplo, UDID, IDFA, Google Advertising ID).\u003c/li\u003e\n        \u003cli\u003eAs páginas do nosso Serviço que Você visita, a data e a hora da sua visita, o tempo gasto nessas páginas.\u003c/li\u003e\n        \u003cli\u003eLogs de erro e relatórios de falhas do sistema (crash reports).\u003c/li\u003e\n        \u003cli\u003eDados de geolocalização aproximada (derivados do endereço IP) para fins de análise regional e conformidade legal.\u003c/li\u003e\n        \u003cli\u003eInterações com a interface do usuário, como cliques e movimentos do mouse.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e4. Uso de Seus Dados Pessoais\u003c/h2\u003e\n    \u003cp\u003eA Empresa utiliza os Dados Pessoais coletados para as seguintes finalidades e com base nas respectivas bases legais da LGPD:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003ePara fornecer e manter nosso Serviço:\u003c/strong\u003e Incluindo monitorar o uso, garantir a estabilidade e a segurança do Serviço. \u003cstrong\u003eBase Legal:\u003c/strong\u003e Execução de contrato e Legítimo Interesse.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara gerenciar sua Conta:\u003c/strong\u003e Para administrar seu registro como usuário, permitindo o acesso a diferentes funcionalidades do Serviço. \u003cstrong\u003eBase Legal:\u003c/strong\u003e Execução de contrato.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara a execução de um contrato:\u003c/strong\u003e O desenvolvimento, cumprimento e execução do contrato de compra dos produtos, itens ou serviços que Você adquiriu, ou de qualquer outro contrato conosco através do Serviço. \u003cstrong\u003eBase Legal:\u003c/strong\u003e Execução de contrato.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara processar pagamentos e gerenciar assinaturas:\u003c/strong\u003e Para processar suas transações, gerenciar renovações automáticas, prevenir fraudes e cumprir com obrigações fiscais. \u003cstrong\u003eBase Legal:\u003c/strong\u003e Execução de contrato e Cumprimento de obrigação legal.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara entrar em contato com Você:\u003c/strong\u003e Para contatá-lo por e-mail, chamadas telefônicas, SMS ou outras formas equivalentes de comunicação eletrônica (como notificações push) sobre atualizações ou comunicados informativos relacionados às funcionalidades, produtos ou serviços contratados, incluindo atualizações de segurança, quando necessário ou razoável para sua implementação. \u003cstrong\u003eBase Legal:\u003c/strong\u003e Execução de contrato e Legítimo Interesse.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara fornecer notícias, ofertas especiais e informações gerais:\u003c/strong\u003e Sobre outros bens, serviços e eventos que oferecemos, semelhantes aos que Você já adquiriu ou pelos quais demonstrou interesse, a menos que Você tenha optado por não receber tais informações. \u003cstrong\u003eBase Legal:\u003c/strong\u003e Consentimento ou Legítimo Interesse.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara gerenciar suas solicitações:\u003c/strong\u003e Para atender e gerenciar suas solicitações de suporte, dúvidas ou para o exercício de seus direitos. \u003cstrong\u003eBase Legal:\u003c/strong\u003e Execução de contrato ou Cumprimento de obrigação legal.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara análises de dados e melhorias:\u003c/strong\u003e Para identificar tendências de uso, determinar a eficácia de nossas campanhas promocionais e avaliar e melhorar nosso Serviço, produtos, marketing e sua experiência. \u003cstrong\u003eBase Legal:\u003c/strong\u003e Legítimo Interesse.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara fins de cumprimento legal e segurança:\u003c/strong\u003e Para cumprir com obrigações legais, regulatórias, ordens judiciais ou para proteger nossos direitos, propriedade e segurança, bem como os de nossos usuários e de terceiros. \u003cstrong\u003eBase Legal:\u003c/strong\u003e Cumprimento de obrigação legal.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e5. Retenção de Seus Dados Pessoais\u003c/h2\u003e\n    \u003cp\u003eA Empresa reterá seus Dados Pessoais apenas pelo tempo estritamente necessário para cumprir as finalidades para as quais foram coletados, conforme estabelecido nesta Política de Privacidade. Reteremos e utilizaremos seus Dados Pessoais na medida necessária para:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eCumprir com nossas obrigações legais e regulatórias (por exemplo, somos obrigados a reter seus dados fiscais e de transação por um determinado período de tempo, conforme a legislação brasileira).\u003c/li\u003e\n        \u003cli\u003eResolver disputas e fazer valer nossos acordos e políticas legais.\u003c/li\u003e\n        \u003cli\u003eManter registros para fins de auditoria interna e análise.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eDados de Uso são geralmente retidos por um período mais curto, exceto quando esses dados são usados para fortalecer a segurança, melhorar a funcionalidade do nosso Serviço, ou quando somos legalmente obrigados a retê-los por períodos mais longos. Após o término do período de retenção, os Dados Pessoais serão eliminados de forma segura ou anonimizados, impossibilitando a identificação do Titular.\u003c/p\u003e\n\n    \u003ch2\u003e6. Transferência de Seus Dados Pessoais\u003c/h2\u003e\n    \u003cp\u003eSuas informações, incluindo Dados Pessoais, são processadas nos escritórios operacionais da Empresa e em quaisquer outros locais onde as partes envolvidas no Tratamento estejam localizadas, como servidores de nuvem e prestadores de serviços. Isso significa que essas informações podem ser transferidas e mantidas em computadores e servidores localizados fora do seu estado, província, país ou outra jurisdição governamental onde as leis de proteção de dados podem ser diferentes das da sua jurisdição.\u003c/p\u003e\n    \u003cp\u003eSeu consentimento a esta Política de Privacidade, seguido pelo envio de tais informações, representa sua concordância com essa transferência.\u003c/p\u003e\n    \u003cp\u003eA Empresa tomará todas as medidas razoavelmente necessárias para garantir que seus dados sejam tratados com segurança e de acordo com esta Política de Privacidade. Nenhuma transferência de seus Dados Pessoais ocorrerá para uma organização ou país, a menos que existam controles adequados em vigor, incluindo a segurança de seus dados e outras informações pessoais. Em conformidade com a LGPD, notadamente a \u003cstrong\u003eResolução CD/ANPD nº 19/2024\u003c/strong\u003e, qualquer transferência internacional de dados para países que não proporcionem grau de proteção de dados adequado ao previsto na legislação brasileira será realizada com base em mecanismos legais apropriados, como \u003cstrong\u003eCláusulas Contratuais Padrão (Standard Contractual Clauses - SCCs)\u003c/strong\u003e aprovadas pela ANPD, normas corporativas globais ou outras salvaguardas previstas no artigo 33 da LGPD.\u003c/p\u003e\n\n    \u003ch2\u003e7. Divulgação de Seus Dados Pessoais\u003c/h2\u003e\n    \u003cp\u003ePodemos compartilhar seus Dados Pessoais nas seguintes situações:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eCom Prestadores de Serviços (Operadores):\u003c/strong\u003e Podemos compartilhar seus Dados Pessoais com prestadores de serviços terceirizados que atuam como Operadores para monitorar e analisar o uso do nosso Serviço, para processamento de pagamentos, para hospedagem de dados, para fornecer suporte técnico e para nos auxiliar na prestação do Serviço. Exigimos contratualmente que esses prestadores de serviços protejam a confidencialidade e a segurança dos Dados Pessoais e os processem apenas conforme nossas instruções.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara Transações Comerciais:\u003c/strong\u003e Se a Empresa estiver envolvida em uma fusão, aquisição, venda de ativos, reestruturação ou falência, seus Dados Pessoais podem ser transferidos como um ativo da empresa. Forneceremos aviso prévio antes que seus Dados Pessoais sejam transferidos e se tornem sujeitos a uma Política de Privacidade diferente.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCom autoridades legais:\u003c/strong\u003e Podemos divulgar seus Dados Pessoais se formos obrigados por lei, intimação, mandado de busca ou outra solicitação legalmente válida, ou se acreditarmos de boa-fé que tal ação é necessária para:\n            \u003cul\u003e\n                \u003cli\u003eCumprir uma obrigação legal ou regulatória.\u003c/li\u003e\n                \u003cli\u003eProteger e defender os direitos ou propriedade da Empresa.\u003c/li\u003e\n                \u003cli\u003ePrevenir ou investigar possíveis irregularidades em conexão com o Serviço.\u003c/li\u003e\n                \u003cli\u003eProteger a segurança pessoal dos usuários do Serviço ou do público.\u003c/li\u003e\n                \u003cli\u003eProteger contra responsabilidade legal.\u003c/li\u003e\n            \u003c/ul\u003e\n        \u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCom o seu Consentimento:\u003c/strong\u003e Podemos divulgar seus Dados Pessoais para qualquer outra finalidade com o seu consentimento explícito.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e8. Segurança de Seus Dados Pessoais\u003c/h2\u003e\n    \u003cp\u003eA segurança dos seus Dados Pessoais é uma prioridade máxima para Nós. Implementamos medidas de segurança técnicas, administrativas e físicas, projetadas para proteger seus Dados Pessoais contra acesso, uso, alteração, divulgação ou destruição não autorizados. Essas medidas incluem, entre outras, criptografia de dados em trânsito (TLS/SSL) e em repouso, controles de acesso rigorosos, firewalls, monitoramento de sistemas e políticas de segurança da informação.\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eASSUNÇÃO DE RISCO:\u003c/strong\u003e ENTRETANTO, VOCÊ RECONHECE E CONCORDA QUE NENHUM MÉTODO DE TRANSMISSÃO PELA INTERNET OU MÉTODO DE ARMAZENAMENTO ELETRÔNICO É 100% SEGURO E INFALÍVEL. EMBORA NOS ESFORCEMOS PARA USAR MEIOS COMERCIALMENTE ACEITÁVEIS E ALINHADOS COM AS MELHORES PRÁTICAS DE MERCADO PARA PROTEGER SEUS DADOS PESSOAIS, NÃO PODEMOS GARANTIR SUA SEGURANÇA ABSOLUTA. VOCÊ ASSUME TOTAL RESPONSABILIDADE E RISCO PELO USO DO SERVIÇO E PELA TRANSMISSÃO DE DADOS ATRAVÉS DA INTERNET. A EMPRESA NÃO SERÁ RESPONSÁVEL POR DANOS RESULTANTES DO ACESSO NÃO AUTORIZADO, VIOLAÇÕES DE SEGURANÇA, VAZAMENTOS DE DADOS OU OUTROS INCIDENTES FORA DE NOSSO CONTROLE RAZOÁVEL.\u003c/p\u003e\n\n    \u003ch3\u003e8.1. Notificação de Incidentes de Segurança\u003c/h3\u003e\n    \u003cp\u003eEm estrita conformidade com o Art. 48 da LGPD e as regulamentações da ANPD, em caso de ocorrência de um incidente de segurança que possa acarretar risco ou dano relevante aos Titulares, a Empresa se compromete a comunicar a Autoridade Nacional de Proteção de Dados (ANPD) e os Titulares afetados em um prazo razoável, estabelecido em \u003cstrong\u003eaté 3 (três) dias úteis\u003c/strong\u003e a contar da data de conhecimento do incidente. A comunicação incluirá a descrição da natureza dos Dados Pessoais afetados, as informações sobre os Titulares envolvidos, a indicação das medidas técnicas e de segurança utilizadas, os riscos relacionados ao incidente e as medidas que foram ou serão adotadas para reverter ou mitigar os efeitos do prejuízo.\u003c/p\u003e\n\n    \u003ch2\u003e9. Direitos de Proteção de Dados (LGPD)\u003c/h2\u003e\n    \u003cp\u003eA Empresa garante a Você, como Titular de Dados Pessoais, o pleno exercício dos direitos previstos no Artigo 18 da Lei Geral de Proteção de Dados (LGPD). A qualquer momento, Você pode solicitar:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eConfirmação da existência de tratamento:\u003c/strong\u003e O direito de saber se realizamos algum tratamento com seus Dados Pessoais.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAcesso aos dados:\u003c/strong\u003e O direito de obter uma cópia dos Dados Pessoais que temos sobre Você.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCorreção de dados incompletos, inexatos ou desatualizados:\u003c/strong\u003e O direito de solicitar a retificação de seus dados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAnonimização, bloqueio ou eliminação de dados desnecessários, excessivos ou tratados em desconformidade com a LGPD:\u003c/strong\u003e O direito de ter seus dados anonimizados, bloqueados ou excluídos quando aplicável.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePortabilidade dos dados:\u003c/strong\u003e O direito de solicitar a transferência de seus Dados Pessoais para outro fornecedor de serviço ou produto, mediante requisição expressa, de acordo com a regulamentação da ANPD.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEliminação dos dados pessoais tratados com o consentimento do titular:\u003c/strong\u003e O direito de ter seus dados deletados, exceto nas hipóteses de conservação previstas em lei.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInformação das entidades públicas e privadas com as quais o controlador realizou uso compartilhado de dados:\u003c/strong\u003e O direito de saber com quem compartilhamos seus dados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInformação sobre a possibilidade de não fornecer consentimento e sobre as consequências da negativa:\u003c/strong\u003e O direito de ser claramente informado sobre as implicações de não consentir com o tratamento de dados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRevogação do consentimento:\u003c/strong\u003e O direito de retirar seu consentimento a qualquer momento, de forma fácil e gratuita. A revogação não afeta a legalidade do tratamento realizado antes da sua retirada.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003e9.1. Como Exercer Seus Direitos e Contato com o Encarregado (DPO)\u003c/h3\u003e\n    \u003cp\u003ePara exercer qualquer um dos seus direitos de proteção de dados, ou se tiver dúvidas sobre como seus dados são tratados, entre em contato com nosso Encarregado pela Proteção de Dados (Data Protection Officer - DPO). O Encarregado é o ponto de contato entre a Empresa, os Titulares dos dados e a ANPD.\u003c/p\u003e\n    \u003cp\u003eVocê pode entrar em contato conosco para exercer seus direitos através do nosso canal oficial:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eVisitando esta página em nosso site:\u003c/strong\u003e \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003ePara sua segurança, podemos solicitar informações adicionais para verificar sua identidade antes de responder à sua solicitação. As solicitações serão atendidas sem custo e no prazo legal.\u003c/p\u003e\n\n    \u003ch2\u003e10. Privacidade de Menores\u003c/h2\u003e\n    \u003cp\u003eNosso Serviço não se destina a indivíduos menores de 18 anos (\"Menores\"). Não coletamos intencionalmente informações de identificação pessoal de Menores. Se Você é pai ou responsável e está ciente de que seu filho nos forneceu Dados Pessoais sem o seu consentimento, por favor, entre em contato conosco imediatamente. Se tomarmos conhecimento de que coletamos Dados Pessoais de um Menor sem a verificação do consentimento dos pais ou responsáveis legais, tomaremos medidas para remover essas informações de nossos servidores.\u003c/p\u003e\n\n    \u003ch2\u003e11. Links para Outros Sites\u003c/h2\u003e\n    \u003cp\u003eNosso Serviço pode conter links para outros sites que não são operados por Nós. Se Você clicar em um link de terceiros, Você será direcionado para o site desse terceiro. \u003cstrong\u003eRECOMENDAMOS FORTEMENTE QUE VOCÊ REVISE A POLÍTICA DE PRIVACIDADE DE CADA SITE QUE VISITAR.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eNÃO TEMOS CONTROLE E NÃO ASSUMIMOS QUALQUER RESPONSABILIDADE PELO CONTEÚDO, POLÍTICAS DE PRIVACIDADE OU PRÁTICAS DE QUAISQUER SITES OU SERVIÇOS DE TERCEIROS.\u003c/strong\u003e A inclusão de um link não implica endosso, garantia ou recomendação por parte da Empresa.\u003c/p\u003e\n\n    \u003ch2\u003e12. Disposições sobre Assinaturas e Pagamentos\u003c/h2\u003e\n    \u003cp\u003eO Tratamento de dados é essencial para a gestão do nosso modelo de negócio baseado em assinaturas pagas.\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eDados para Cobrança:\u003c/strong\u003e Para processar pagamentos de sua \u003cstrong\u003eAssinatura\u003c/strong\u003e, coletamos dados financeiros através de nossos parceiros de pagamento. Esses dados são usados exclusivamente para a finalidade de cobrança recorrente (mensal ou anual), conforme o plano selecionado.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRenovação Automática:\u003c/strong\u003e No final de cada período de faturamento, sua Assinatura será renovada automaticamente sob as mesmas condições, a menos que Você a cancele ou a Empresa a cancele. O tratamento de seus dados de pagamento continuará para permitir essa renovação.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCancelamento de Assinatura:\u003c/strong\u003e Você pode cancelar a renovação de sua Assinatura através das configurações de sua Conta ou entrando em contato conosco. Seus dados serão mantidos até o final do período de assinatura atual para garantir seu acesso ao Serviço e, posteriormente, retidos conforme nossa política de retenção para fins legais e fiscais.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAlterações de Preço:\u003c/strong\u003e A Empresa pode modificar os preços da assinatura. Seus dados de contato serão utilizados para notificá-lo com antecedência razoável sobre qualquer alteração de preço, que entrará em vigor no início do próximo período de assinatura.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eReembolsos:\u003c/strong\u003e Exceto quando exigido por lei, as taxas de assinatura pagas não são reembolsáveis. Dados relacionados a solicitações de reembolso podem ser processados para avaliar o caso e, se aplicável, efetuar o pagamento.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTeste Gratuito (Free Trial):\u003c/strong\u003e Se oferecermos um período de avaliação gratuita, podemos solicitar seus dados de pagamento no início. Esses dados serão usados para iniciar a cobrança automática no final do período de teste, a menos que Você cancele antes do término.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e13. Disposições Legais de Proteção\u003c/h2\u003e\n    \u003ch3\u003e13.1. Isenção de Garantias\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eO SERVIÇO É FORNECIDO A VOCÊ \"COMO ESTÁ\" E \"CONFORME DISPONÍVEL\", COM TODAS AS FALHAS E DEFEITOS, SEM GARANTIA DE QUALQUER TIPO. NA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, A EMPRESA, EM SEU PRÓPRIO NOME E EM NOME DE SUAS AFILIADAS E DE SEUS RESPECTIVOS LICENCIADORES E PRESTADORES DE SERVIÇOS, ISENTA-SE EXPRESSAMENTE DE TODAS AS GARANTIAS, SEJAM EXPRESSAS, IMPLÍCITAS, ESTATUTÁRIAS OU DE OUTRA FORMA, COM RELAÇÃO AO SERVIÇO, INCLUINDO TODAS AS GARANTIAS IMPLÍCITAS DE COMERCIALIZAÇÃO, ADEQUAÇÃO A UM FIM ESPECÍFICO, TÍTULO E NÃO VIOLAÇÃO, E GARANTIAS QUE POSSAM SURGIR DO CURSO DE NEGOCIAÇÃO, CURSO DE DESEMPENHO, USO OU PRÁTICA COMERCIAL. SEM LIMITAÇÃO AO ANTERIOR, A EMPRESA NÃO OFERECE NENHUMA GARANTIA OU COMPROMISSO, E NÃO FAZ NENHUMA REPRESENTAÇÃO DE QUALQUER TIPO DE QUE O SERVIÇO ATENDERÁ ÀS SUAS NECESSIDADES, ALCANÇARÁ OS RESULTADOS PRETENDIDOS, SERÁ COMPATÍVEL OU FUNCIONARÁ COM QUALQUER OUTRO SOFTWARE, APLICATIVOS, SISTEMAS OU SERVIÇOS, OPERARÁ SEM INTERRUPÇÃO, ATENDERÁ A QUAISQUER PADRÕES DE DESEMPENHO OU CONFIABILIDADE OU SERÁ LIVRE DE ERROS, OU QUE QUAISQUER ERROS OU DEFEITOS PODEM SER OU SERÃO CORRIGIDOS.\u003c/strong\u003e\u003c/p\u003e\n\n    \u003ch3\u003e13.2. Limitação de Responsabilidade\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, EM NENHUM CASO A EMPRESA OU SEUS FORNECEDORES, DIRETORES, FUNCIONÁRIOS, AGENTES OU AFILIADAS SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS, PUNITIVOS OU CONSEQUENTES DE QUALQUER NATUREZA (INCLUINDO, MAS NÃO SE LIMITANDO A, DANOS POR PERDA DE LUCROS, PERDA DE DADOS OU OUTRAS INFORMAÇÕES, INTERRUPÇÃO DE NEGÓCIOS, LESÃO PESSOAL, PERDA DE PRIVACIDADE DECORRENTE DE OU DE QUALQUER FORMA RELACIONADA AO USO OU INCAPACIDADE DE USAR O SERVIÇO, SOFTWARE DE TERCEIROS E/OU HARDWARE DE TERCEIROS USADO COM O SERVIÇO, OU DE OUTRA FORMA EM CONEXÃO COM QUALQUER DISPOSIÇÃO DESTA POLÍTICA).\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eNÃO OBSTANTE QUAISQUER DANOS QUE VOCÊ POSSA INCORRER, A RESPONSABILIDADE TOTAL E CUMULATIVA DA EMPRESA E DE QUALQUER UM DE SEUS FORNECEDORES SOB QUALQUER DISPOSIÇÃO DESTA POLÍTICA E SEU ÚNICO RECURSO PARA TUDO O QUE FOI MENCIONADO ACIMA SERÁ LIMITADA AO MAIOR VALOR ENTRE: (A) O MONTANTE EFETIVAMENTE PAGO POR VOCÊ PELO SERVIÇO NOS 12 (DOZE) MESES ANTERIORES AO EVENTO QUE DEU ORIGEM À RECLAMAÇÃO; OU (B) R$ 100,00 (CEM REAIS).\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eAlgumas jurisdições não permitem a exclusão de garantias implícitas ou a limitação de responsabilidade por danos incidentais ou consequentes, o que significa que algumas das limitações acima podem não se aplicar a Você. Nessas jurisdições, a responsabilidade de cada parte será limitada à máxima extensão permitida por lei.\u003c/p\u003e\n\n    \u003ch3\u003e13.3. Indenização\u003c/h3\u003e\n    \u003cp\u003eVocê concorda em indenizar, defender e isentar a Empresa, suas afiliadas, executivos, diretores, funcionários, consultores, agentes, licenciadores e fornecedores de e contra todas e quaisquer reclamações, responsabilidades, danos, perdas, custos, despesas e honorários (incluindo honorários advocatícios razoáveis) que tais partes incorram como resultado de ou decorrentes de (a) qualquer violação desta Política de Privacidade por Você; (b) seu uso indevido do Serviço; (c) sua violação de qualquer lei, regra ou regulamento aplicável; ou (d) sua violação de quaisquer direitos de terceiros.\u003c/p\u003e\n\n    \u003ch3\u003e13.4. Lei Aplicável e Jurisdição\u003c/h3\u003e\n    \u003cp\u003eEsta Política de Privacidade e o seu uso do Serviço serão regidos e interpretados de acordo com as leis da República Federativa do Brasil, desconsiderando seus conflitos de disposições legais.\u003c/p\u003e\n    \u003cp\u003ePara a solução de quaisquer controvérsias decorrentes deste instrumento, fica eleito o foro da Comarca de São Paulo, Estado de São Paulo, com expressa renúncia a qualquer outro, por mais privilegiado que seja <script>
(function(){

  var languages=Array.from(new Set(docs.map(function(doc){return doc.language;})));
  var translations={

    FR:{legal:"Documentation Juridique",documents:"Documents",rights:"Tous droits réservés.",notice:"Les marques {brands}, tous les projets, codes et textes individuels, titres, images, animations, modèles 3D, design et marques, ce site et son contenu sont protégés par le droit d'auteur et distribués sous des licences qui restreignent la copie, la distribution et la décompilation."},
    DE:{legal:"Rechtsdokumentation",documents:"Dokumente",rights:"Alle Rechte vorbehalten.",notice:"Die Marken {brands}, alle einzelnen Projekte, Codes und Texte, Titel, Bilder, Animationen, 3D-Modelle, Design und Marken, diese Website und ihr Inhalt sind urheberrechtlich geschützt und werden unter Lizenzen verteilt, die das Kopieren, Verteilen und Dekompilieren einschränken."},
    ZH:{legal:"法律文件",documents:"文件",rights:"保留所有权利。",notice:"品牌 {brands}、所有项目、代码和单独的文本、标题、图像、动画、3D 模型、设计和品牌、本网站及其内容均受版权保护，并根据限制复制、分发和反编译的许可进行分发。"},
    JA:{legal:"法的文書",documents:"文書",rights:"無断転載を禁じます。",notice:"ブランド {brands}、すべてのプロジェクト、コードおよび個々のテキスト、タイトル、画像、アニメーション、3D モデル、デザインおよびブランド、本サイトとそのコンテンツは著作権で保護されており、複製、配布、逆コンパイルを制限するライセンスの下で配布されています。"}
  };
  var langNames={PT:"Português",EN:"English",ES:"Español",FR:"Français",DE:"Deutsch",ZH:"中文",JA:"日本語"};
  var selectedLanguage="EN";
  var selectedType="";
  var dangerous={script:1,style:1,iframe:1,object:1,embed:1,svg:1,math:1,template:1,noscript:1};
  var allowed={h1:1,h2:1,h3:1,h4:1,h5:1,h6:1,p:1,strong:1,b:1,em:1,i:1,u:1,s:1,del:1,ins:1,mark:1,small:1,sub:1,sup:1,ul:1,ol:1,li:1,blockquote:1,br:1,hr:1,div:1,span:1,section:1,article:1,header:1,footer:1,main:1,aside:1,nav:1,figure:1,figcaption:1,pre:1,code:1,table:1,caption:1,thead:1,tbody:1,tfoot:1,tr:1,th:1,td:1,dl:1,dt:1,dd:1,a:1};
  var iconMarkup={};
  Array.prototype.forEach.call(document.querySelectorAll("[data-icon]"),function(node){iconMarkup[node.getAttribute("data-icon")]=node.innerHTML;});
  function cleanHref(raw){
    if(!raw||raw.length>2048||/[\u0000-\u0020\\]/.test(raw))return "";
    if(/^mailto:/i.test(raw)&&/^mailto:[^\s@]+@[^\s@]+(?:\?[^\s]*)?$/i.test(raw))return raw;
    if(!/^https:\/\//i.test(raw))return "";
    try{
      var parsed=new URL(raw);
      if(parsed.protocol!=="https:"||!parsed.hostname||/(^|\.)replit\.(com|dev|app|co)$/i.test(parsed.hostname)||/replit/i.test(parsed.hostname))return "";
      return parsed.href;
    }catch(_){return "";}
  }
  function copySafeChildren(source,target){
    Array.prototype.forEach.call(source.childNodes,function(node){
      if(node.nodeType===Node.TEXT_NODE){target.appendChild(document.createTextNode(node.nodeValue||""));return;}
      if(node.nodeType!==Node.ELEMENT_NODE)return;
      var tag=node.tagName.toLowerCase();
      if(dangerous[tag])return;
      if(!allowed[tag]){copySafeChildren(node,target);return;}
      var clone=document.createElement(tag);
      if(tag==="a"){
        var href=cleanHref(node.getAttribute("href"));
        if(href){clone.setAttribute("href",href);clone.setAttribute("rel","noopener noreferrer");clone.setAttribute("target","_blank");}
      }
      if(tag==="th"||tag==="td"){
        var span=node.getAttribute("colspan");
        var row=node.getAttribute("rowspan");
        if(span&&/^([1-9]|1[0-2])$/.test(span))clone.setAttribute("colspan",span);
        if(row&&/^([1-9]|1[0-9])$/.test(row))clone.setAttribute("rowspan",row);
      }
      if(tag==="ol"){
        var start=node.getAttribute("start");
        if(start&&/^\d{1,5}$/.test(start))clone.setAttribute("start",start);
      }
      copySafeChildren(node,clone);
      target.appendChild(clone);
    });
  }
  function sanitizedFragment(html){
    var source=document.createElement("template");
    source.innerHTML=String(html||"");
    var output=document.createDocumentFragment();
    copySafeChildren(source.content,output);
    return output;
  }
  function updateFooter(){
    var text=translations[selectedLanguage]||translations.EN;
    var legal=document.querySelector("[data-legal-documentation]");
    var heading=document.querySelector("[data-documents-heading]");
    if(legal)legal.textContent=text.legal;
    if(heading)heading.textContent=text.documents;
    var rights=document.querySelector("[data-footer-rights]");
    if(rights)rights.textContent=text.rights;
    var brands=document.querySelector("[data-footer-brands]");
    if(brands)brands.textContent=text.notice.replace("{brands}",(brands.getAttribute("data-footer-brands")||"").split(",").map(function(part){return part.trim();}).join(", "));
  }
  function setTheme(theme){
    document.documentElement.classList.toggle("dark",theme==="dark");
    document.documentElement.classList.toggle("light",theme!=="dark");
    themeButton.setAttribute("aria-pressed",theme==="dark"?"true":"false");
    themeButton.setAttribute("aria-label",theme==="dark"?"Switch to light theme":"Switch to dark theme");
    themeButton.setAttribute("title",theme==="dark"?"Switch to light theme":"Switch to dark theme");
    try{localStorage.setItem("legal-base-landing-theme-"+"timesafe",theme);}catch(_){}
  }
  var themeKey="legal-base-landing-theme-"+"timesafe";
  var startingTheme="light";
  try{var saved=localStorage.getItem(themeKey);if(saved==="dark"||saved==="light")startingTheme=saved;}catch(_){}
  setTheme(startingTheme);
  themeButton.addEventListener("click",function(){setTheme(document.documentElement.classList.contains("dark")?"light":"dark");});
  function showDocument(){
    var current=docs.find(function(doc){return doc.language===selectedLanguage&&doc.documentType===selectedType;});
    if(!current)return;
    title.textContent=current.label;
    languageTitle.textContent=current.languageLabel;
    activeIcon.innerHTML=iconMarkup[current.documentType]||iconMarkup.terms_and_conditions||"";
    content.replaceChildren(sanitizedFragment(current.content));
    Array.prototype.forEach.call(docHost.querySelectorAll(".document-button"),function(button){
      button.setAttribute("aria-pressed",button.getAttribute("data-type")===selectedType?"true":"false");
    });
  }
  function setLanguage(language){
    selectedLanguage=language;
    document.documentElement.lang=language.toLowerCase();
    langHost.replaceChildren();
    languages.forEach(function(code){
      var button=document.createElement("button");
      button.type="button";button.className="language-button";button.textContent=code;
      button.setAttribute("aria-label",langNames[code]||code);
      button.setAttribute("aria-pressed",code===selectedLanguage?"true":"false");
      button.addEventListener("click",function(){setLanguage(code);});
      langHost.appendChild(button);
    });
    var available=docs.filter(function(doc,index,all){
      return doc.language===selectedLanguage&&all.findIndex(function(item){return item.language===selectedLanguage&&item.documentType===doc.documentType;})===index;
    });
    docHost.replaceChildren();
    available.forEach(function(doc){
      var button=document.createElement("button");
      button.type="button";button.className="document-button";button.setAttribute("data-type",doc.documentType);
      button.setAttribute("aria-pressed",doc.documentType===selectedType?"true":"false");
      var icon=document.createElement("span");icon.innerHTML=iconMarkup[doc.documentType]||iconMarkup.terms_and_conditions||"";
      var label=document.createElement("span");label.className="document-label";label.textContent=doc.label;
      button.append(icon,label);
      if(doc.documentType===selectedType){var chevron=document.createElementNS("http://www.w3.org/2000/svg","svg");chevron.setAttribute("viewBox","0 0 24 24");chevron.setAttribute("class","chevron");chevron.setAttribute("aria-hidden","true");chevron.innerHTML='<path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>';button.appendChild(chevron);}
      button.addEventListener("click",function(){selectedType=doc.documentType;setLanguage(selectedLanguage);showDocument();});
      docHost.appendChild(button);
    });
    if(!available.some(function(doc){return doc.documentType===selectedType;}))selectedType=available.length?available[0].documentType:"";
    if(!available.length){
      var empty=document.createElement("p");empty.className="empty-documents";empty.textContent="";docHost.appendChild(empty);
      title.textContent="";languageTitle.textContent="";activeIcon.replaceChildren();content.replaceChildren();
    }else showDocument();
    updateFooter();
  }
  var firstEnglish=docs.find(function(doc){return doc.language==="EN";});

  setLanguage(selectedLanguage);
})();</script></body></html>
