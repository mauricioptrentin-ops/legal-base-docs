strong\u003e significa uma entidade que controla, é controlada por ou está sob controle comum com uma parte, onde \"controle\" significa a posse de 50% ou mais das ações, participações societárias ou outros títulos com direito a voto para a eleição de diretores ou outra autoridade administrativa.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD\u003c/strong\u003e significa a Autoridade Nacional de Proteção de Dados do Brasil.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eConta\u003c/strong\u003e significa uma conta única criada por Você para acessar nosso Serviço ou partes de nosso Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eConteúdo do Usuário\u003c/strong\u003e refere-se a quaisquer dados, textos, documentos, informações ou outros materiais que Você carrega, envia, armazena ou transmite através do Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"a Empresa\", \"Nós\", \"Nosso\" ou \"Conosco\" neste Acordo) refere-se a \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, sociedade empresária limitada, inscrita no CNPJ/ME sob o nº 41.648.990/0001-56, com NIRE 35237097027, com sede na ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eLGPD\u003c/strong\u003e significa a Lei Geral de Proteção de Dados Pessoais (Lei nº 13.709/2018) e suas alterações e regulamentações subsequentes.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServiço\u003c/strong\u003e refere-se ao software, aplicativos, website e todas as funcionalidades relacionadas oferecidas sob o nome \u003cstrong\u003eTIMESAFE\u003c/strong\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAssinatura\u003c/strong\u003e refere-se aos planos de acesso pagos ao Serviço, oferecidos pela Empresa de forma recorrente.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eTermos\u003c/strong\u003e significam estes Termos de Serviço que formam o acordo integral entre Você e a Empresa em relação ao uso do Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eTerceiros\u003c/strong\u003e refere-se a quaisquer serviços, conteúdos (incluindo dados, informações, produtos ou serviços) ou links fornecidos por terceiros que possam ser exibidos, incluídos ou disponibilizados pelo Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVocê\u003c/strong\u003e (referido como \"Usuário\" ou \"Seu\") significa o indivíduo que acessa ou usa o Serviço, ou a empresa ou outra entidade legal em nome da qual tal indivíduo está acessando ou usando o Serviço, conforme aplicável. Caso esteja utilizando o Serviço em nome de uma organização, você declara e garante que possui autoridade para vincular tal organização a estes Termos.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e2. Descrição do Serviço\u003c/h2\u003e\n\u003cp\u003eO \u003cstrong\u003eTIMESAFE\u003c/strong\u003e é uma plataforma de software como serviço (SaaS) projetada para oferecer soluções avançadas de proteção e gerenciamento de documentos digitais. O Serviço permite aos Usuários aplicar carimbos de tempo qualificados, gerenciar assinaturas digitais, verificar a integridade de arquivos e armazenar documentos em um ambiente seguro, visando garantir a autenticicidade, integridade e temporalidade de informações digitais.\u003c/p\u003e\n\u003cp\u003eO Serviço pode incluir, mas não se limita a, funcionalidades de upload de documentos, geração de hashes criptográficos, aplicação de carimbos de tempo (timestamping) em conformidade com padrões técnicos, verificação de validade de documentos, e um painel de controle para gerenciamento de atividades. O acesso a determinadas funcionalidades pode estar sujeito a um plano de Assinatura pago.\u003c/p\u003e\n\n\u003ch2\u003e3. Contas de Usuário\u003c/h2\u003e\n\n\u003ch3\u003e3.1. Elegibilidade e Criação de Conta\u003c/h3\u003e\n\u003cp\u003ePara acessar e utilizar a maioria dos recursos do Serviço, Você deve se registrar e criar uma Conta. Ao criar uma Conta, Você declara e garante que: (a) tem pelo menos 18 anos de idade e possui plena capacidade legal para celebrar este contrato; (b) todas as informações de registro que Você envia são verdadeiras, precisas, atuais e completas; e (c) Você manterá a precisão de tais informações.\u003c/p\u003e\n\n\u003ch3\u003e3.2. Responsabilidade pela Conta\u003c/h3\u003e\n\u003cp\u003eVocê é inteiramente responsável por manter a confidencialidade de sua senha e informações de sua Conta. Você concorda em aceitar total responsabilidade por todas as atividades que ocorram sob sua Conta ou senha. Você deve nos notificar imediatamente ao tomar conhecimento de qualquer violação de segurança ou uso não autorizado de sua Conta. A Empresa não será responsável por quaisquer perdas ou danos decorrentes do seu descumprimento desta obrigação de segurança.\u003c/p\u003e\n\n\u003ch3\u003e3.3. Conteúdo do Usuário\u003c/h3\u003e\n\u003cp\u003eVocê é o único responsável por todo o Conteúdo do Usuário que carrega, publica, exibe ou transmite através do Serviço. Você retém todos os direitos de propriedade sobre seu Conteúdo do Usuário. No entanto, ao enviar Conteúdo do Usuário para o Serviço, Você concede à Empresa uma licença mundial, não exclusiva, isenta de royalties, sublicenciável e transferível para usar, reproduzir, modificar, processar, adaptar e exibir tal conteúdo exclusivamente para o propósito de operar, fornecer e melhorar o Serviço para Você.\u003c/p\u003e\n\u003cp\u003eVocê declara e garante que: (i) o Conteúdo do Usuário é seu (você o possui) ou você tem o direito de usá-lo e nos conceder os direitos e a licença conforme previsto nestes Termos, e (ii) o upload ou uso do seu Conteúdo do Usuário no ou através do Serviço não viola os direitos de privacidade, direitos de publicidade, direitos autorais, direitos contratuais ou quaisquer outros direitos de qualquer pessoa ou entidade.\u003c/p\u003e\n\u003cp\u003eA Empresa não assume qualquer responsabilidade pelo Conteúdo do Usuário. Nós nos reservamos o direito, mas não a obrigação, de, a nosso exclusivo critério, monitorar, revisar, remover ou desativar o acesso a qualquer Conteúdo do Usuário que viole estes Termos ou que seja de outra forma questionável.\u003c/p\u003e\n\n\u003ch3\u003e3.4. Suspensão e Encerramento da Conta\u003c/h3\u003e\n\u003cp\u003eA Empresa reserva-se o direito de suspender ou encerrar sua Conta e barrar seu acesso ao Serviço, a qualquer momento, por qualquer motivo ou sem motivo, a nosso exclusivo critério, com ou sem aviso prévio, incluindo, mas não se limitando a, violações destes Termos, atividade ilegal ou fraudulenta, inatividade prolongada ou não pagamento de taxas devidas.\u003c/p\u003e\n\n\u003ch2\u003e4. Termos de Pagamento\u003c/h2\u003e\n\n\u003cp\u003eO Serviço, ou partes dele, é disponibilizado mediante uma Assinatura paga. Ao selecionar um plano de Assinatura, Você concorda com os termos de preços, pagamento e faturamento aqui descritos.\u003c/p\u003e\n\n\u003ch3\u003e4.1. Período de Assinatura e Renovação Automática\u003c/h3\u003e\n\u003cp\u003eVocê será cobrado antecipadamente em uma base recorrente e periódica (\"Ciclo de Faturamento\"). Os Ciclos de Faturamento são definidos mensal ou anualmente, dependendo do tipo de plano de Assinatura que Você selecionar ao adquirir a Assinatura.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAO FINAL DE CADA CICLO DE FATURAMENTO, SUA ASSINATURA SERÁ RENOVADA AUTOMATICAMENTE SOB AS MESMAS CONDIÇÕES, A MENOS QUE VOCÊ A CANCELE OU A EMPRESA A CANCELE.\u003c/strong\u003e A cobrança será realizada no método de pagamento registrado em sua Conta.\u003c/p\u003e\n\n\u003ch3\u003e4.2. Cancelamento de Assinatura\u003c/h3\u003e\n\u003cp\u003eVocê pode cancelar a renovação de sua Assinatura a qualquer momento, seja através da página de configurações de sua Conta ou entrando em contato com o suporte da Empresa através do link: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e. O cancelamento impedirá futuras cobranças de renovação. \u003cstrong\u003eVocê não receberá um reembolso pelas taxas já pagas pelo seu período de Assinatura atual\u003c/strong\u003e e poderá continuar a acessar o Serviço até o final do período de Assinatura vigente.\u003c/p\u003e\n\n\u003ch3\u003e4.3. Alterações de Preço\u003c/h3\u003e\n\u003cp\u003eA Empresa pode, a seu exclusivo critério e a qualquer momento, modificar as taxas de Assinatura. Qualquer alteração no preço da Assinatura se tornará efetiva no final do Ciclo de Faturamento então vigente. A Empresa fornecerá a Você um aviso prévio razoável sobre qualquer alteração nas taxas de Assinatura para lhe dar a oportunidade de encerrar sua Assinatura antes que tal alteração se torne efetiva. Seu uso continuado do Serviço após a alteração do preço da Assinatura entrar em vigor constitui sua concordância em pagar o valor modificado da taxa de Assinatura.\u003c/p\u003e\n\n\u003ch3\u003e4.4. Reembolsos\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eEXCETO QUANDO EXIGIDO PELA LEI APLICÁVEL, AS TAXAS DE ASSINATURA PAGAS NÃO SÃO REEMBOLSÁVEIS.\u003c/strong\u003e A Empresa não é obrigada a fornecer reembolsos ou créditos por períodos de uso parcial, cancelamentos no meio do ciclo de faturamento ou por funcionalidades não utilizadas. Quaisquer reembolsos ou créditos que possam ser considerados serão feitos a critério exclusivo da Empresa e caso a caso.\u003c/p\u003e\n\n\u003ch3\u003e4.5. Teste Gratuito (Free Trial)\u003c/h3\u003e\n\u003cp\u003eA Empresa pode, a seu exclusivo critério, oferecer uma Assinatura com um período de teste gratuito por tempo limitado. Você pode ser solicitado a inserir suas informações de faturamento para se inscrever no teste gratuito. Se Você inserir suas informações de faturamento, não será cobrado pela Empresa até que o período de teste gratuito tenha expirado. No último dia do período de teste gratuito, a menos que Você tenha cancelado sua Assinatura, Você será cobrado automaticamente pelas taxas de Assinatura aplicáveis ao tipo de Assinatura que selecionou.\u003c/p\u003e\n\n\u003ch2\u003e5. Proteção de Dados Pessoais e Conformidade com a LGPD\u003c/h2\u003e\n\u003cp\u003eA Empresa está comprometida com a proteção dos seus dados pessoais e em conformidade com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018).\u003c/p\u003e\n\n\u003ch3\u003e5.1. Coleta e Uso de Dados\u003c/h3\u003e\n\u003cp\u003eColetamos dados pessoais para operar o Serviço, incluindo dados de registro (nome, e-mail), dados de pagamento (processados por nossos parceiros de pagamento) e dados de uso (logs de atividade, endereço IP). Utilizamos esses dados para: (a) fornecer, manter e melhorar o Serviço; (b) processar pagamentos; (c) comunicar-nos com Você sobre sua conta e atualizações do Serviço; (d) cumprir obrigações legais e regulatórias.\u003c/p\u003e\n\n\u003ch3\u003e5.2. Direitos dos Titulares de Dados\u003c/h3\u003e\n\u003cp\u003eConforme a LGPD, Você tem o direito de:\n\u003cul\u003e\n    \u003cli\u003eConfirmar a existência de tratamento de seus dados;\u003c/li\u003e\n    \u003cli\u003eAcessar seus dados pessoais;\u003c/li\u003e\n    \u003cli\u003eCorrigir dados incompletos, inexatos ou desatualizados;\u003c/li\u003e\n    \u003cli\u003eSolicitar a anonimização, bloqueio ou eliminação de dados desnecessários ou excessivos;\u003c/li\u003e\n    \u003cli\u003eSolicitar a portabilidade dos seus dados a outro fornecedor de serviço;\u003c/li\u003e\n    \u003cli\u003eSolicitar a eliminação dos dados pessoais tratados com o seu consentimento;\u003c/li\u003e\n    \u003cli\u003eObter informação sobre as entidades com as quais a Empresa realizou uso compartilhado de dados;\u003c/li\u003e\n    \u003cli\u003eRevogar o seu consentimento a qualquer momento.\u003c/li\u003e\n\u003c/ul\u003e\nPara exercer seus direitos, entre em contato conosco através do nosso formulário de contato.\u003c/p\u003e\n\n\u003ch3\u003e5.3. Transferência Internacional de Dados\u003c/h3\u003e\n\u003cp\u003ePara fornecer o Serviço, podemos precisar transferir seus dados pessoais para servidores ou prestadores de serviços localizados fora do Brasil. Tais transferências serão realizadas em estrita conformidade com a LGPD, especialmente com a \u003cstrong\u003eResolução CD/ANPD nº 19/2024\u003c/strong\u003e. Asseguramos que as transferências internacionais ocorrerão apenas para países que proporcionem um nível adequado de proteção de dados ou através de mecanismos de garantia aprovados pela ANPD, como as Cláusulas Contratuais Padrão.\u003c/p\u003e\n\n\u003ch3\u003e5.4. Notificação de Incidentes de Segurança\u003c/h3\u003e\n\u003cp\u003eEm caso de um incidente de segurança que possa acarretar risco ou dano relevante aos titulares de dados, a Empresa se compromete a comunicar a ANPD e os titulares afetados em um prazo razoável, em conformidade com a legislação, que atualmente estipula um prazo de \u003cstrong\u003e3 (três) dias úteis\u003c/strong\u003e a contar da ciência do incidente.\u003c/p\u003e\n\n\u003ch3\u003e5.5. Encarregado de Proteção de Dados (DPO)\u003c/h3\u003e\n\u003cp\u003eA Empresa nomeou um Encarregado de Proteção de Dados (DPO) para supervisionar questões relacionadas a esta política e à proteção de dados. As informações de contato do nosso DPO podem ser obtidas através da nossa página de contato: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch2\u003e6. Propriedade Intelectual\u003c/h2\u003e\n\u003cp\u003eO Serviço e todo o seu conteúdo original, características e funcionalidades (incluindo, mas não se limitando a todo o software, código-fonte, texto, gráficos, logotipos, ícones de botão, imagens, clipes de áudio e vídeo) são e permanecerão propriedade exclusiva da \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e e de seus licenciadores. O Serviço é protegido por leis de direitos autorais, marcas registradas e outras leis do Brasil e de países estrangeiros.\u003c/p\u003e\n\u003cp\u003eNossas marcas registradas e identidade visual não podem ser usadas em conexão com qualquer produto ou serviço sem o consentimento prévio por escrito da Empresa. Ao utilizar o Serviço, concedemos a Você uma licença limitada, não exclusiva, intransferível e revogável para usar o Serviço estritamente de acordo com estes Termos. Você concorda em não (e não permitir que terceiros): (a) licenciar, sublicenciar, vender, revender, alugar, arrendar, transferir, ceder, distribuir ou de outra forma explorar comercialmente ou disponibilizar o Serviço a terceiros; (b) modificar, fazer trabalhos derivados, desmontar, descompilar ou fazer engenharia reversa de qualquer parte do Serviço.\u003c/p\u003e\n\n\u003ch2\u003e7. Disponibilidade do Serviço, Isenção de Garantias e Assunção de Risco\u003c/h2\u003e\n\n\u003ch3\u003e7.1. Disponibilidade\u003c/h3\u003e\n\u003cp\u003eA Empresa envidará esforços comercialmente razoáveis para manter o Serviço operacional. No entanto, o acesso ao Serviço pode ser interrompido, incluindo, mas não se limitando a, manutenções programadas ou urgentes, falhas de rede, ou por outras razões fora do nosso controle. A Empresa não garante disponibilidade ininterrupta ou livre de erros e não será responsável por qualquer indisponibilidade.\u003c/p\u003e\n\n\u003ch3\u003e7.2. Isenção de Garantias\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eO SERVIÇO É FORNECIDO A VOCÊ \"COMO ESTÁ\" E \"CONFORME DISPONÍVEL\" E COM TODAS AS FALHAS E DEFEITOS, SEM GARANTIA DE QUALQUER TIPO. NA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, A EMPRESA, EM SEU PRÓPRIO NOME E EM NOME DE SUAS AFILIADAS E DE SEUS RESPECTIVOS LICENCIADORES E PRESTADORES DE SERVIÇOS, RENUNCIA EXPRESSAMENTE A TODAS AS GARANTIAS, SEJAM EXPRESSAS, IMPLÍCITAS, ESTATUTÁRIAS OU DE OUTRA FORMA, COM RELAÇÃO AO SERVIÇO, INCLUINDO TODAS AS GARANTIAS IMPLÍCITAS DE COMERCIALIZAÇÃO, ADEQUAÇÃO A UM PROPÓSITO ESPECÍFICO, TÍTULO E NÃO VIOLAÇÃO, E GARANTIAS QUE POSSAM SURGIR DO CURSO DE NEGOCIAÇÃO, CURSO DE DESEMPENHO, USO OU PRÁTICA COMERCIAL.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSEM LIMITAÇÃO AO EXPOSTO, A EMPRESA NÃO OFERECE NENHUMA GARANTIA OU COMPROMISSO, E NÃO FAZ NENHUMA DECLARAÇÃO DE QUALQUER TIPO DE QUE O SERVIÇO ATENDERÁ ÀS SUAS NECESSIDADES, ALCANÇARÁ QUAISQUER RESULTADOS PRETENDIDOS, SERÁ COMPATÍVEL OU FUNCIONARÁ COM QUALQUER OUTRO SOFTWARE, APLICATIVOS, SISTEMAS OU SERVIÇOS, OPERARÁ SEM INTERRUPÇÃO, ATENDERÁ A QUAISQUER PADRÕES DE DESEMPENHO OU CONFIABILIDADE OU ESTARÁ LIVRE DE ERROS, OU QUE QUAISQUER ERROS OU DEFEITOS POSSAM OU SERÃO CORRIGIDOS.\u003c/strong\u003e\u003c/p\u003e\n\n\u003ch3\u003e7.3. Assunção de Risco\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eVOCÊ RECONHECE E CONCORDA QUE ASSUME TOTAL RESPONSABILIDADE E RISCO PELO SEU USO DO SERVIÇO E DA INTERNET. O SERVIÇO É FORNECIDO \"COMO ESTÁ\", SEM GARANTIAS DE QUALQUER TIPO. A EMPRESA NÃO SERÁ RESPONSÁVEL POR QUAISQUER CUSTOS OU DANOS DECORRENTES DIRETA OU INDIRETAMENTE DE TAL USO. É DE SUA EXCLUSIVA RESPONSABILIDADE AVALIAR A PRECISÃO, INTEGRIDADE E UTILIDADE DE TODAS AS OPINIÕES, CONSELHOS, SERVIÇOS, MERCADORIAS E OUTRAS INFORMAÇÕES FORNECIDAS ATRAVÉS DO SERVIÇO. A EMPRESA NÃO SERÁ RESPONSÁVEL POR QUAISQUER DANOS RESULTANTES DO USO OU DA INCAPACIDADE DE USO DO SERVIÇO, INCLUINDO DANOS CAUSADOS POR MALWARE, VÍRUS OU QUALQUER INCORREÇÃO OU INCOMPLETUDE DAS INFORMAÇÕES OU DO SOFTWARE.\u003c/strong\u003e\u003c/p\u003e\n\n\u003ch2\u003e8. Limitação de Responsabilidade\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, EM NENHUMA HIPÓTESE A EMPRESA, SUAS AFILIADAS, DIRETORES, FUNCIONÁRIOS, AGENTES, FORNECEDORES OU LICENCIADORES SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS, PUNITIVOS OU CONSEQUENCIAIS DE QUALQUER NATUREZA (INCLUINDO, MAS NÃO SE LIMITANDO A, DANOS POR PERDA DE LUCROS, PERDA DE DADOS OU OUTRAS INFORMAÇÕES, POR INTERRUPÇÃO DE NEGÓCIOS, POR LESÕES PESSOAIS, PERDA DE PRIVACIDADE DECORRENTE DE OU DE QUALQUER FORMA RELACIONADA AO USO OU INCAPACIDADE DE USAR O SERVIÇO, SOFTWARE DE TERCEIROS E/OU HARDWARE DE TERCEIROS USADO COM O SERVIÇO, OU DE OUTRA FORMA EM CONEXÃO COM QUALQUER DISPOSIÇÃO DESTES TERMOS), MESMO QUE A EMPRESA OU QUALQUER FORNECEDOR TENHA SIDO AVISADO DA POSSIBILIDADE DE TAIS DANOS E MESMO QUE A SOLUÇÃO FALHE EM SEU PROPÓSITO ESSENCIAL.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eNÃO OBSTANTE QUAISQUER DANOS QUE VOCÊ POSSA INCORRER, A RESPONSABILIDADE TOTAL E CUMULATIVA DA EMPRESA E DE QUALQUER UM DE SEUS FORNECEDORES SOB QUALQUER DISPOSIÇÃO DESTES TERMOS E SEU ÚNICO RECURSO PARA TUDO O QUE FOI EXPOSTO SERÁ LIMITADA AO MAIOR VALOR ENTRE: (A) O MONTANTE TOTAL EFETIVAMENTE PAGO POR VOCÊ À EMPRESA PELO SERVIÇO DURANTE O PERÍODO DE 12 (DOZE) MESES IMEDIATAMENTE ANTERIOR AO EVENTO QUE DEU ORIGEM À RECLAMAÇÃO; OU (B) R$ 100,00 (CEM REAIS).\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAlgumas jurisdições não permitem a exclusão de garantias implícitas ou a limitação de responsabilidade por danos incidentais ou consequenciais, o que significa que algumas das limitações acima podem não se aplicar a Você. Nessas jurisdições, a responsabilidade de cada parte será limitada à extensão máxima permitida por lei.\u003c/p\u003e\n\n\u003ch2\u003e9. Indenização\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eVOCÊ CONCORDA EM INDENIZAR, DEFENDER E ISENTAR DE RESPONSABILIDADE A EMPRESA, SUAS AFILIADAS, DIRETORES, FUNCIONÁRIOS, AGENTES, CONTRATADOS, LICENCIADORES E FORNECEDORES DE E CONTRA TODAS E QUAISQUER RECLAMAÇÕES, AÇÕES, PROCESSOS, RESPONSABILIDADES, DANOS, PERDAS, JULGAMENTOS, CUSTOS E DESPESAS (INCLUINDO HONORÁRIOS ADVOCATÍCIOS RAZOÁVEIS) DECORRENTES DE OU RELACIONADOS A: (A) SEU USO OU MAU USO DO SERVIÇO; (B) QUALQUER VIOLAÇÃO DESTES TERMOS POR VOCÊ OU POR QUALQUER TERCEIRO USANDO SUA CONTA; (C) QUALQUER CONTEÚDO DO USUÁRIO QUE VOCÊ POSTAR, ENVIAR OU TRANSMITIR ATRAVÉS DO SERVIÇO; (D) SUA VIOLAÇÃO DE QUALQUER LEI, REGRA OU REGULAMENTO APLICÁVEL; OU (E) SUA VIOLAÇÃO DE QUAISQUER DIREITOS DE TERCEIROS.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eA Empresa reserva-se o direito, às suas próprias custas, de assumir a defesa e o controle exclusivos de qualquer assunto sujeito a indenização por Você, caso em que Você cooperará totalmente com a Empresa na afirmação de quaisquer defesas disponíveis.\u003c/p\u003e\n\n\u003ch2\u003e10. Modificações do Serviço e dos Termos\u003c/h2\u003e\n\u003cp\u003eA Empresa reserva-se o direito de, a seu exclusivo critério, modificar, suspender ou descontinuar o Serviço (ou qualquer parte ou conteúdo dele), temporária ou permanentemente, a qualquer momento, com ou sem aviso prévio. Você concorda que a Empresa não será responsável perante Você ou terceiros por qualquer modificação, suspensão ou descontinuação do Serviço.\u003c/p\u003e\n\u003cp\u003eReservamo-nos o direito, a nosso exclusivo critério, de modificar ou substituir estes Termos a qualquer momento. Se uma revisão for material, faremos esforços razoáveis para fornecer um aviso com pelo menos 30 dias de antecedência antes que os novos termos entrem em vigor. O que constitui uma alteração material será determinado a nosso exclusivo critério. Ao continuar a acessar ou usar nosso Serviço após essas revisões se tornarem efetivas, Você concorda em ficar vinculado aos termos revisados.\u003c/p\u003e\n\n\u003ch2\u003e11. Resolução de Disputas\u003c/h2\u003e\n\u003cp\u003eSe Você tiver qualquer preocupação ou disputa sobre o Serviço, Você concorda em primeiro tentar resolver a disputa informalmente entrando em contato com a Empresa através dos canais de comunicação fornecidos. As partes concordam em negociar de boa-fé para resolver qualquer disputa. Se as partes não conseguirem resolver a disputa por meio de negociações informais, a disputa será resolvida de acordo com a seção \"Lei Aplicável e Jurisdição\" abaixo.\u003c/p\u003e\n\n\u003ch2\u003e12. Lei Aplicável e Jurisdição\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eEstes Termos e o seu uso do Serviço serão regidos e interpretados de acordo com as leis da República Federativa do Brasil, desconsiderando suas disposições sobre conflito de leis.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePara a resolução de todas as controvérsias ou questões relacionadas ao uso do Serviço ou a estes Termos, as partes elegem, com renúncia expressa a qualquer outro, por mais privilegiado que seja, o foro da Comarca de São Paulo, Estado de São Paulo, Brasil. Você e a Empresa consentem irrevogavelmente com a jurisdição exclusiva de tais tribunais.\u003c/strong\u003e\u003c/p\u003e\n\n\u003ch2\u003e13. Disposições Gerais\u003c/h2\u003e\n\u003ch3\u003e13.1. Acordo Integral\u003c/h3\u003e\n\u003cp\u003eEstes Termos, juntamente com nossa Política de Privacidade, constituem o acordo integral e exclusivo entre Você e a Empresa com relação ao Serviço e substituem e anulam todos os acordos, propostas ou representações anteriores e contemporâneas, escritas ou orais, relativas ao seu objeto.\u003c/p\u003e\n\n\u003ch3\u003e13.2. Divisibilidade\u003c/h3\u003e\n\u003cp\u003eSe qualquer disposição destes Termos for considerada inexequível ou inválida, tal disposição será alterada e interpretada para cumprir os objetivos de tal disposição na maior extensão possível sob a lei aplicável, e as disposições restantes continuarão em pleno vigor e efeito.\u003c/p\u003e\n\n\u003ch3\u003e13.3. Renúncia\u003c/h3\u003e\n\u003cp\u003eNenhuma falha ou atraso por qualquer uma das partes no exercício de qualquer direito sob estes Termos constituirá uma renúncia a esse direito. Nenhuma renúncia sob estes Termos será eficaz a menos que feita por escrito e assinada por um representante autorizado da parte que se considera ter renunciado.\u003c/p\u003e\n\n\u003ch3\u003e13.4. Cessão\u003c/h3\u003e\n\u003cp\u003eVocê não pode ceder ou transferir quaisquer de seus direitos ou obrigações sob estes Termos sem o consentimento prévio por escrito da Empresa. A Empresa pode ceder ou transferir estes Termos, no todo ou em parte, sem restrições.\u003c/p\u003e\n\n\u003ch3\u003e13.5. Força Maior\u003c/h3\u003e\n\u003cp\u003eA Empresa não será responsável por qualquer falha ou atraso no desempenho de suas obrigações devido a eventos além do seu controle razoável, que podem incluir, mas não se limitam a, ataques de negação de serviço, greves, escassez, motins, atos de terrorismo, guerras, incêndios, inundações, tempestades, pandemias, ou atos de Deus.\u003c/p\u003e\n\n\u003ch2\u003e14. Contato\u003c/h2\u003e\n\u003cp\u003eSe Você tiver alguma dúvida sobre estes Termos de Serviço, pode entrar em contato conosco:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eVisitando esta página em nosso site: \u003ca href=\"https://www.timesafe.com.br/contato.html\" target=\"_blank\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Termos de Serviço","languageLabel":"Português"},{"documentType":"terms_of_service","language":"ES","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"es\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003ctitle\u003eTérminos de Servicio de TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003eTérminos de Servicio de TIMESAFE\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eÚltima actualización:\u003c/strong\u003e 1 de octubre de 2026\u003c/p\u003e\n\n    \u003cp\u003e\n        POR FAVOR, LEA ESTOS TÉRMINOS DE SERVICIO (\"TÉRMINOS\") CUIDADOSAMENTE ANTES DE UTILIZAR EL SERVICIO TIMESAFE (EL \"SERVICIO\") OPERADO POR TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS (\"EMPRESA\", \"NOSOTROS\", \"NOS\").\n    \u003c/p\u003e\n\n    \u003cp\u003e\n        \u003cstrong\u003e\n            AL ACCEDER, DESCARGAR, INSTALAR, CREAR UNA CUENTA O UTILIZAR DE CUALQUIER OTRA FORMA EL SERVICIO, USTED (\"USTED\", \"USUARIO\") RECONOCE QUE HA LEÍDO, ENTENDIDO Y ACEPTA ESTAR LEGALMENTE VINCULADO POR ESTOS TÉRMINOS Y CONDICIONES, ASÍ COMO POR NUESTRA POLÍTICA DE PRIVACIDAD, QUE SE INCORPORA AQUÍ COMO REFERENCIA. SI USTED NO ESTÁ DE ACUERDO CON ALGUNA PARTE DE ESTOS TÉRMINOS, DEBE CESAR INMEDIATAMENTE TODO USO DEL SERVICIO.\n        \u003c/strong\u003e\n    \u003c/p\u003e\n\n    \u003cp\u003e\n        El uso continuado del Servicio después de cualquier modificación de estos Términos constituye su aceptación de dichas modificaciones. Si usted está aceptando estos Términos en nombre de una entidad, como su empleador, usted declara que tiene la autoridad legal para vincular a dicha entidad a estos Términos.\n    \u003c/p\u003e\n\n    \u003ch3\u003e1. Interpretación y Definiciones\u003c/h3\u003e\n    \u003ch4\u003e1.1. Interpretación\u003c/h4\u003e\n    \u003cp\u003eLas palabras cuya letra inicial está en mayúscula tienen significados definidos bajo las siguientes condiciones. Las siguientes definiciones tendrán el mismo significado independientemente de si aparecen en singular o en plural.\u003c/p\u003e\n\n    \u003ch4\u003e1.2. Definiciones\u003c/h4\u003e\n    \u003cp\u003ePara los propósitos de estos Términos de Servicio:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eAfiliado\u003c/strong\u003e significa una entidad que controla, es controlada por, o está bajo control común con una parte, donde \"control\" significa la posesión, directa o indirecta, del poder de dirigir o causar la dirección de la gestión y políticas de una entidad, ya sea a través de la propiedad de valores con derecho a voto, por contrato o de otra manera.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCuenta\u003c/strong\u003e significa una cuenta única creada para que Usted acceda a nuestro Servicio o a partes de nuestro Servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eANPD\u003c/strong\u003e se refiere a la Autoridade Nacional de Proteção de Dados de Brasil, la autoridad supervisora de la protección de datos en Brasil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"la Empresa\", \"Nosotros\", \"Nos\" o \"Nuestro\" en este Acuerdo) se refiere a TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS, con CNPJ 41.648.990/0001-56, NIRE 35237097027, y domicilio en ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eContenido\u003c/strong\u003e se refiere a contenido como texto, imágenes, u otra información que puede ser publicada, cargada, enlazada o puesta a disposición por Usted, independientemente de la forma de ese contenido.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePaís\u003c/strong\u003e se refiere a la República Federativa de Brasil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e significa cualquier dispositivo que pueda acceder al Servicio, como una computadora, un teléfono celular o una tableta digital.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePrueba Gratuita\u003c/strong\u003e se refiere a un período de tiempo limitado que puede ser gratuito al comprar una Suscripción.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eLGPD\u003c/strong\u003e se refiere a la Ley General de Protección de Datos de Brasil (Lei Geral de Proteção de Dados Pessoais, Ley N° 13.709/2018), con sus enmiendas y regulaciones complementarias.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServicio\u003c/strong\u003e se refiere al software, la aplicación y la plataforma web de TIMESAFE, diseñados para ofrecer sistemas, soluciones y protección de documentos digitales.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSuscripción\u003c/strong\u003e se refiere a los servicios o acceso al Servicio ofrecidos por la Empresa bajo un modelo de pago por suscripción.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTérminos\u003c/strong\u003e (también referidos como \"Términos y Condiciones\") significan estos Términos de Servicio que forman el acuerdo completo entre Usted y la Empresa con respecto al uso del Servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServicio de Terceros\u003c/strong\u003e significa cualquier servicio o contenido (incluyendo datos, información, productos o servicios) proporcionado por un tercero que pueda ser mostrado, incluido o puesto a disposición por el Servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e (también referido como \"Usuario\") significa el individuo que accede o utiliza el Servicio, o la empresa u otra entidad legal en nombre de la cual dicho individuo accede o utiliza el Servicio, según corresponda.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003e2. Descripción del Servicio\u003c/h3\u003e\n    \u003cp\u003eTIMESAFE es un servicio de software que proporciona soluciones avanzadas para la protección, gestión y validación de documentos digitales. El Servicio está diseñado para garantizar la integridad, autenticidad y seguridad de la información digital de sus usuarios a través de diversas herramientas y funcionalidades. El acceso y uso de ciertas características del Servicio pueden requerir una Suscripción de pago.\u003c/p\u003e\n    \u003cp\u003eEl Servicio no contiene contenido para adultos y está dirigido a un público profesional y corporativo a nivel global, con un enfoque en América Latina.\u003c/p\u003e\n\n    \u003ch3\u003e3. Cuentas de Usuario\u003c/h3\u003e\n    \u003ch4\u003e3.1. Creación de Cuenta\u003c/h4\u003e\n    \u003cp\u003ePara acceder y utilizar la mayoría de las funcionalidades del Servicio, debe registrarse y crear una Cuenta. Al crear una Cuenta, usted se compromete a proporcionar información verdadera, precisa, actual y completa. Usted es responsable de actualizar y mantener la veracidad de dicha información.\u003c/p\u003e\n\n    \u003ch4\u003e3.2. Responsabilidad de la Cuenta\u003c/h4\u003e\n    \u003cp\u003eUsted es el único responsable de mantener la confidencialidad de su contraseña y de toda la actividad que ocurra en su Cuenta. Usted acepta notificar a la Empresa inmediatamente sobre cualquier uso no autorizado de su Cuenta o cualquier otra violación de seguridad. La Empresa no será responsable de ninguna pérdida o daño que surja de su incumplimiento de esta obligación de seguridad.\u003c/p\u003e\n\n    \u003ch4\u003e3.3. Conducta del Usuario y Usos Prohibidos\u003c/h4\u003e\n    \u003cp\u003eUsted se compromete a no utilizar el Servicio para ningún propósito que sea ilegal o esté prohibido por estos Términos. Usted se compromete a no:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eUtilizar el Servicio de cualquier manera que pueda dañar, deshabilitar, sobrecargar o deteriorar el Servicio o interferir con el uso y disfrute del Servicio por parte de terceros.\u003c/li\u003e\n        \u003cli\u003eIntentar obtener acceso no autorizado a cualquier parte del Servicio, otras cuentas, sistemas informáticos o redes conectadas al Servicio, a través de piratería, extracción de contraseñas o cualquier otro medio.\u003c/li\u003e\n        \u003cli\u003eRealizar ingeniería inversa, descompilar, desensamblar o intentar descubrir el código fuente o los algoritmos del Servicio.\u003c/li\u003e\n        \u003cli\u003eCargar, publicar o transmitir cualquier material que contenga virus de software o cualquier otro código informático, archivos o programas diseñados para interrumpir, destruir o limitar la funcionalidad de cualquier software o hardware informático o equipo de telecomunicaciones.\u003c/li\u003e\n        \u003cli\u003eUtilizar el Servicio para transmitir o almacenar material ilegal, difamatorio, acosador, abusivo, fraudulento, obsceno o de cualquier otra forma objetable.\u003c/li\u003e\n        \u003cli\u003eViolar cualquier ley o regulación aplicable, incluyendo, entre otras, las leyes de protección de datos como la LGPD.\u003c/li\u003e\n        \u003cli\u003eViolar los derechos de propiedad intelectual, derechos de privacidad o cualquier otro derecho de terceros.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eLa Empresa se reserva el derecho de investigar y tomar las medidas legales apropiadas contra cualquier persona que, a discreción exclusiva de la Empresa, viole esta disposición, incluyendo, sin limitación, la suspensión o terminación de su Cuenta y la denuncia a las autoridades policiales.\u003c/p\u003e\n\n    \u003ch3\u003e4. Términos de Pago\u003c/h3\u003e\n    \u003cp\u003eEl Servicio o algunas partes del mismo están disponibles únicamente con una Suscripción de pago.\u003c/p\u003e\n\n    \u003ch4\u003e4.1. Período de Suscripción y Renovación Automática\u003c/h4\u003e\n    \u003cp\u003eSe le facturará por adelantado de forma recurrente y periódica (mensual o anual), dependiendo del tipo de plan de Suscripción que seleccione al comprar la Suscripción. AL FINAL DE CADA PERÍODO DE SUSCRIPCIÓN, SU SUSCRIPCIÓN SE RENOVARÁ AUTOMÁTICAMENTE BAJO EXACTAMENTE LAS MISMAS CONDICIONES A MENOS QUE USTED LA CANCELE O LA EMPRESA LA CANCELE. La autorización para cargar en su método de pago elegido continuará vigente hasta que sea cancelada de acuerdo con estos Términos.\u003c/p\u003e\n\n    \u003ch4\u003e4.2. Cancelación de la Suscripción\u003c/h4\u003e\n    \u003cp\u003eUsted puede cancelar la renovación de su Suscripción en cualquier momento a través de la configuración de su Cuenta o contactándonos a través de nuestro formulario de contacto en \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e. Para evitar la facturación del siguiente período, la cancelación debe realizarse antes de la fecha de renovación. Usted no recibirá un reembolso por las tarifas ya pagadas por su período de Suscripción actual y podrá acceder al Servicio hasta el final de dicho período.\u003c/p\u003e\n\n    \u003ch4\u003e4.3. Facturación y Cambios de Precio\u003c/h4\u003e\n    \u003cp\u003eUsted debe proporcionar a la Empresa información de facturación precisa y completa, incluyendo nombre completo, dirección, estado, código postal, país y un método de pago válido. La Empresa, a su entera discreción y en cualquier momento, puede modificar las tarifas de la Suscripción. Cualquier cambio en la tarifa de la Suscripción entrará en vigencia al final del período de Suscripción entonces vigente. Le proporcionaremos un aviso previo razonable de cualquier cambio en las tarifas para darle la oportunidad de cancelar su Suscripción antes de que dicho cambio entre en vigencia. Su uso continuado del Servicio después de que el cambio de tarifa entre en vigencia constituye su acuerdo de pagar el monto modificado de la tarifa de Suscripción.\u003c/p\u003e\n\n    \u003ch4\u003e4.4. Política de Reembolso\u003c/h4\u003e\n    \u003cp\u003eSALVO CUANDO LA LEY APLICABLE LO EXIJA, LAS TARIFAS DE SUSCRIPCIÓN PAGADAS NO SON REEMBOLSABLES. Ciertas solicitudes de reembolso para Suscripciones pueden ser consideradas por la Empresa caso por caso y otorgadas a la entera discreción de la Empresa.\u003c/p\u003e\n\n    \u003ch4\u003e4.5. Prueba Gratuita\u003c/h4\u003e\n    \u003cp\u003eLa Empresa puede, a su entera discreción, ofrecer una Suscripción con una Prueba Gratuita por un período de tiempo limitado. Es posible que se le solicite que ingrese su información de facturación para registrarse en la Prueba Gratuita. Si ingresa su información de facturación, no se le cobrará hasta que la Prueba Gratuita haya expirado. En el último día del período de Prueba Gratuita, a menos que haya cancelado su Suscripción, se le cobrarán automáticamente las tarifas de Suscripción aplicables para el tipo de Suscripción que haya seleccionado. En cualquier momento y sin previo aviso, la Empresa se reserva el derecho de (i) modificar los términos de la oferta de Prueba Gratuita, o (ii) cancelar dicha oferta de Prueba Gratuita.\u003c/p\u003e\n\n    \u003ch3\u003e5. Cumplimiento de la LGPD y Privacidad de Datos\u003c/h3\u003e\n    \u003cp\u003eLa Empresa está comprometida a proteger la privacidad y la seguridad de sus datos. Este documento y nuestra Política de Privacidad describen nuestras prácticas en cumplimiento con la Ley General de Protección de Datos de Brasil (LGPD).\u003c/p\u003e\n    \n    \u003ch4\u003e5.1. Compromiso y Base Legal\u003c/h4\u003e\n    \u003cp\u003eTratamos sus datos personales basándonos en bases legales válidas, principalmente para la ejecución del contrato de servicio con Usted, para cumplir con nuestras obligaciones legales, y con su consentimiento cuando sea necesario. Al aceptar estos Términos, usted consiente el tratamiento de sus datos según lo descrito aquí y en nuestra Política de Privacidad.\u003c/p\u003e\n\n    \u003ch4\u003e5.2. Derechos de los Titulares de los Datos\u003c/h4\u003e\n    \u003cp\u003eBajo la LGPD, Usted tiene los siguientes derechos con respecto a sus datos personales:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eConfirmación y Acceso:\u003c/strong\u003e El derecho a obtener la confirmación de la existencia del tratamiento y a acceder a sus datos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCorrección:\u003c/strong\u003e El derecho a solicitar la corrección de datos incompletos, inexactos o desactualizados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAnonimización, Bloqueo o Eliminación:\u003c/strong\u003e El derecho a solicitar la anonimización, el bloqueo o la eliminación de datos innecesarios, excesivos o tratados en incumplimiento de la LGPD.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePortabilidad:\u003c/strong\u003e El derecho a solicitar la portabilidad de sus datos a otro proveedor de servicios o productos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEliminación:\u003c/strong\u003e El derecho a solicitar la eliminación de los datos personales tratados con su consentimiento.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInformación:\u003c/strong\u003e El derecho a ser informado sobre las entidades públicas y privadas con las que la Empresa ha compartido sus datos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRevocación del Consentimiento:\u003c/strong\u003e El derecho a revocar su consentimiento en cualquier momento.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003ePara ejercer cualquiera de estos derechos, por favor contáctenos a través de nuestro canal oficial: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e. Responderemos a su solicitud de acuerdo con los plazos y procedimientos establecidos por la ley.\u003c/p\u003e\n\n    \u003ch4\u003e5.3. Transferencias Internacionales de Datos\u003c/h4\u003e\n    \u003cp\u003eDado que nuestro Servicio se ofrece a nivel mundial, es posible que sus datos personales sean transferidos y procesados en países distintos a Brasil. La Empresa garantiza que dichas transferencias internacionales de datos se realizan en estricto cumplimiento con la LGPD, específicamente utilizando Cláusulas Contractuales Estándar (Standard Contractual Clauses) aprobadas por la ANPD, de acuerdo con la Resolución CD/ANPD N° 19/2024, u otros mecanismos de transferencia legalmente válidos para asegurar un nivel adecuado de protección de datos.\u003c/p\u003e\n\n    \u003ch4\u003e5.4. Notificación de Incidentes de Seguridad\u003c/h4\u003e\n    \u003cp\u003eEn el caso de un incidente de seguridad que pueda crear un riesgo o daño relevante para Usted, la Empresa se compromete a notificar a la ANPD y a los titulares de datos afectados dentro de un plazo de 3 (tres) días hábiles a partir del conocimiento del incidente, de acuerdo con las regulaciones de la ANPD. La notificación incluirá la naturaleza de los datos afectados, los riesgos involucrados y las medidas tomadas para mitigar el daño.\u003c/p\u003e\n\n    \u003ch4\u003e5.5. Delegado de Protección de Datos (DPO)\u003c/h4\u003e\n    \u003cp\u003eLa Empresa ha designado un Delegado de Protección de Datos (DPO) para supervisar el cumplimiento de la LGPD. La información de contacto del DPO está disponible para los titulares de datos y la ANPD y se puede solicitar a través de nuestro canal de contacto oficial.\u003c/p\u003e\n\n    \u003ch3\u003e6. Disponibilidad del Servicio\u003c/h3\u003e\n    \u003cp\u003eLa Empresa se esfuerza por mantener el Servicio disponible las 24 horas del día, los 7 días de la semana. Sin embargo, no garantizamos que el Servicio estará disponible de forma ininterrumpida, segura o libre de errores. El acceso al Servicio puede ser suspendido temporalmente y sin previo aviso en caso de fallo del sistema, mantenimiento o reparación, o por razones fuera de nuestro control razonable.\u003c/p\u003e\n    \u003cp\u003eNos reservamos el derecho, a nuestra entera discreción, de suspender, retirar o modificar el Servicio, o cualquier parte del mismo, de forma temporal o permanente, con o sin previo aviso, sin que ello genere responsabilidad alguna hacia Usted.\u003c/p\u003e\n    \n    \u003ch3\u003e7. Propiedad Intelectual\u003c/h3\u003e\n    \u003cp\u003eEl Servicio y todo su contenido original, características y funcionalidad (incluyendo, pero no limitado a, todo el software, texto, interfaces de usuario, interfaces visuales, gráficos, logotipos, íconos de botones, imágenes, clips de audio, descargas digitales, compilaciones de datos y el diseño, estructura, selección, coordinación, expresión y \"aspecto y sensación\" de dicho contenido) son y seguirán siendo propiedad exclusiva de TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS y sus licenciantes. El Servicio está protegido por leyes de derechos de autor, marcas registradas y otras leyes tanto de Brasil como de países extranjeros.\u003c/p\u003e\n    \u003cp\u003eNuestras marcas comerciales y nuestra imagen comercial no pueden ser utilizadas en conexión con ningún producto o servicio sin el consentimiento previo por escrito de la Empresa.\u003c/p\u003e\n    \u003cp\u003eLe otorgamos una licencia limitada, no exclusiva, no transferible y revocable para acceder y utilizar el Servicio estrictamente de acuerdo con estos Términos. Usted no adquiere ningún derecho de propiedad sobre el Servicio. Usted se compromete a no copiar, modificar, crear trabajos derivados, alquilar, arrendar, vender, distribuir o explotar de cualquier otra forma el Servicio sin nuestro permiso explícito por escrito.\u003c/p\u003e\n\n    \u003ch3\u003e8. Exclusión de Garantías, Limitación de Responsabilidad y Asunción de Riesgo\u003c/h3\u003e\n    \u003cp\u003eESTA SECCIÓN ES FUNDAMENTAL Y LIMITA LA RESPONSABILIDAD DE LA EMPRESA HACIA USTED. POR FAVOR, LÉALA DETENIDAMENTE.\u003c/p\u003e\n\n    \u003ch4\u003e8.1. EXCLUSIÓN DE GARANTÍAS\u003c/h4\u003e\n    \u003cp\u003e\u003cstrong\u003eEL SERVICIO SE PROPORCIONA AL USUARIO \"TAL CUAL\" Y \"SEGÚN DISPONIBILIDAD\" Y CON TODOS LOS FALLOS Y DEFECTOS, SIN GARANTÍA DE NINGÚN TIPO. EN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, LA EMPRESA, EN SU PROPIO NOMBRE Y EN NOMBRE DE SUS AFILIADOS Y SUS RESPECTIVOS LICENCIANTES Y PROVEEDORES DE SERVICIOS, RENUNCIA EXPRESAMENTE A TODAS LAS GARANTÍAS, YA SEAN EXPRESAS, IMPLÍCITAS, ESTATUTARIAS O DE OTRO TIPO, CON RESPECTO AL SERVICIO, INCLUIDAS TODAS LAS GARANTÍAS IMPLÍCITAS DE COMERCIABILIDAD, IDONEIDAD PARA UN PROPÓSITO PARTICULAR, TÍTULO Y NO INFRACCIÓN, Y GARANTÍAS QUE PUEDAN SURGIR DEL CURSO DE LA NEGOCIACIÓN, CURSO DEL DESEMPEÑO, USO O PRÁCTICA COMERCIAL.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eLA EMPRESA NO OFRECE NINGUNA GARANTÍA NI COMPROMISO, Y NO HACE NINGUNA DECLARACIÓN DE NINGÚN TIPO DE QUE EL SERVICIO: (A) CUMPLIRÁ CON SUS REQUISITOS; (B) SERÁ ININTERRUMPIDO, OPORTUNO, SEGURO O LIBRE DE ERRORES; (C) LOS RESULTADOS OBTENIDOS DEL USO DEL SERVICIO SERÁN PRECISOS, COMPLETOS O FIABLES; O (D) LA CALIDAD DE CUALQUIER PRODUCTO, SERVICIO, INFORMACIÓN U OTRO MATERIAL OBTENIDO A TRAVÉS DEL SERVICIO CUMPLIRÁ CON SUS EXPECTATIVAS.\u003c/strong\u003e\u003c/p\u003e\n\n    \u003ch4\u003e8.2. LIMITACIÓN DE RESPONSABILIDAD\u003c/h4\u003e\n    \u003cp\u003e\u003cstrong\u003eEN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS AFILIADOS, DIRECTORES, EMPLEADOS, AGENTES, PROVEEDORES O LICENCIANTES SERÁN RESPONSABLES DE NINGÚN DAÑO ESPECIAL, INCIDENTAL, INDIRECTO, PUNITIVO O CONSECUENTE DE NINGÚN TIPO (INCLUYENDO, PERO NO LIMITADO A, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS U OTRA INFORMACIÓN, INTERRUPCIÓN DEL NEGOCIO, LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD) QUE SURJA DE O ESTÉ RELACIONADO DE ALGUNA MANERA CON EL USO O LA INCAPACIDAD DE USAR EL SERVICIO, SOFTWARE DE TERCEROS Y/O HARDWARE DE TERCEROS UTILIZADO CON EL SERVICIO, O DE OTRA MANERA EN CONEXIÓN CON CUALQUIER DISPOSICIÓN DE ESTOS TÉRMINOS, INCLUSO SI LA EMPRESA O CUALQUIER PROVEEDOR HA SIDO ADVERTIDO DE LA POSIBILIDAD DE TALES DAÑOS E INCLUSO SI EL REMEDIO NO CUMPLE CON SU PROPÓSITO ESENCIAL.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eSIN PERJUICIO DE LO ANTERIOR, LA RESPONSABILIDAD TOTAL Y ACUMULADA DE LA EMPRESA Y SUS AFILIADOS ANTE USTED POR TODAS LAS RECLAMACIONES QUE SURJAN O ESTÉN RELACIONADAS CON ESTOS TÉRMINOS O EL SERVICIO, INDEPENDIENTEMENTE DE LA FORMA DE LA ACCIÓN, NO EXCEDERÁ EN NINGÚN CASO LA CANTIDAD MAYOR ENTRE: (A) EL IMPORTE TOTAL PAGADO POR USTED A LA EMPRESA POR EL SERVICIO DURANTE EL PERÍODO DE DOCE (12) MESES INMEDIATAMENTE ANTERIOR AL EVENTO QUE DIO LUGAR A LA RECLAMACIÓN; O (B) VEINTE DÓLARES ESTADOUNIDENSES ($20.00 USD).\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eAlgunas jurisdicciones no permiten la exclusión de ciertas garantías o la limitación o exclusión de responsabilidad por daños incidentales o consecuentes. En consecuencia, algunas de las limitaciones anteriores pueden no aplicarse a Usted.\u003c/p\u003e\n\n    \u003ch4\u003e8.3. Asunción de Riesgo\u003c/h4\u003e\n    \u003cp\u003e\u003cstrong\u003eUSTED ASUME LA TOTAL RESPONSABILIDAD Y RIESGO POR SU USO DEL SERVICIO Y DE INTERNET. EL USO DEL SERVICIO ES BAJO SU PROPIO RIESGO. LA EMPRESA NO SERÁ RESPONSABLE DE NINGÚN DAÑO RESULTANTE DEL USO O LA INCAPACIDAD DE USAR EL SERVICIO, INCLUYENDO DAÑOS CAUSADOS POR MALWARE, VIRUS O CUALQUIER INCORRECCIÓN O INCOMPLETITUD EN EL SOFTWARE O LA INFORMACIÓN, A MENOS QUE DICHO DAÑO SEA EL RESULTADO DE CUALQUIER MALA CONDUCTA INTENCIONAL O NEGLIGENCIA GRAVE POR PARTE DE LA EMPRESA.\u003c/strong\u003e\u003c/p\u003e\n    \n    \u003ch3\u003e9. Indemnización\u003c/h3\u003e\n    \u003cp\u003eUsted acepta indemnizar, defender y mantener indemne a la Empresa, sus Afiliados, directores, funcionarios, empleados, contratistas, agentes, licenciantes y proveedores de y contra todas y cada una de las reclamaciones, pérdidas, responsabilidades, daños, juicios, laudos, costos, gastos y honorarios (incluidos los honorarios razonables de abogados) que surjan o estén relacionados con: (a) su uso o mal uso del Servicio; (b) cualquier incumplimiento de estos Términos por su parte; (c) cualquier Contenido que usted publique, envíe o transmita a través del Servicio; (d) su violación de cualquier ley, norma o regulación aplicable; o (e) su violación de los derechos de cualquier tercero, incluyendo los derechos de propiedad intelectual o de privacidad. La Empresa se reserva el derecho de asumir la defensa y el control exclusivos de cualquier asunto sujeto a indemnización por su parte, en cuyo caso usted cooperará plenamente con la Empresa para hacer valer cualquier defensa disponible.\u003c/p\u003e\n\n    \u003ch3\u003e10. Modificaciones del Servicio y de los Términos\u003c/h3\u003e\n    \u003cp\u003eNos reservamos el derecho, a nuestra entera discreción, de retirar o modificar nuestro Servicio, y cualquier servicio o material que proporcionemos a través del Servicio, sin previo aviso. No seremos responsables si, por cualquier motivo, todo o parte del Servicio no está disponible en cualquier momento o durante cualquier período.\u003c/p\u003e\n    \u003cp\u003eTambién podemos actualizar estos Términos de vez en cuando. Es su responsabilidad revisar estos Términos periódicamente. La fecha de la \"Última actualización\" en la parte superior de esta página indicará cuándo se realizaron las últimas revisiones. Su uso continuado del Servicio después de la publicación de los Términos revisados significa que usted acepta y está de acuerdo con los cambios. Se espera que revise esta página con frecuencia para estar al tanto de cualquier cambio, ya que son vinculantes para usted.\u003c/p\u003e\n    \n    \u003ch3\u003e11. Terminación\u003c/h3\u003e\n    \u003cp\u003ePodemos terminar o suspender su Cuenta y prohibir el acceso al Servicio de inmediato, sin previo aviso ni responsabilidad, por cualquier motivo, incluyendo, sin limitación, si usted incumple estos Términos.\u003c/p\u003e\n    \u003cp\u003eUsted puede terminar su Cuenta en cualquier momento dejando de usar el Servicio y cancelando su Suscripción. La terminación de su Cuenta no le da derecho a ningún reembolso.\u003c/p\u003e\n    \u003cp\u003eTras la terminación, su derecho a utilizar el Servicio cesará inmediatamente. Las disposiciones de estos Términos que, por su naturaleza, deban sobrevivir a la terminación, sobrevivirán a la terminación, incluyendo, sin limitación, las disposiciones de propiedad, las exclusiones de garantía, la indemnización y las limitaciones de responsabilidad.\u003c/p\u003e\n    \n    \u003ch3\u003e12. Resolución de Disputas, Ley Aplicable y Jurisdicción\u003c/h3\u003e\n    \u003ch4\u003e12.1. Resolución Informal\u003c/h4\u003e\n    \u003cp\u003eSi usted tiene alguna preocupación o disputa sobre el Servicio, usted se compromete a intentar primero resolver la disputa de manera informal contactando a la Empresa a través de nuestro formulario de contacto en \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e.\u003c/p\u003e\n    \n    \u003ch4\u003e12.2. Ley Aplicable\u003c/h4\u003e\n    \u003cp\u003eEstos Términos y su uso del Servicio se regirán e interpretarán de acuerdo con las leyes de la República Federativa de Brasil, excluyendo sus disposiciones sobre conflictos de leyes. Su uso del Servicio también puede estar sujeto a otras leyes locales, estatales, nacionales o internacionales.\u003c/p\u003e\n    \n    \u003ch4\u003e12.3. Jurisdicción Exclusiva\u003c/h4\u003e\n    \u003cp\u003ePARA CUALQUIER DISPUTA, RECLAMACIÓN O CONTROVERSIA QUE SURJA DE O ESTÉ RELACIONADA CON ESTOS TÉRMINOS O EL INCUMPLIMIENTO, TERMINACIÓN, APLICACIÓN, INTERPRETACIÓN O VALIDEZ DE LOS MISMOS, O EL USO DEL SERVICIO, USTED Y LA EMPRESA ACUERDAN SOMETERSE A LA JURISDICCIÓN PERSONAL Y EXCLUSIVA DE LOS TRIBUNALES DE LA CIUDAD DE SÃO PAULO, ESTADO DE SÃO PAULO, BRASIL. AMBAS PARTES RENUNCIAN IRREVOCABLEMENTE A CUALQUIER OBJECIÓN, INCLUIDA CUALQUIER OBJECIÓN A LA COMPETENCIA O BASADA EN LA DOCTRINA DE FORUM NON CONVENIENS, QUE PUEDAN TENER AHORA O EN EL FUTURO RESPECTO A LA JURISDICCIÓN DE DICHOS TRIBUNALES.\u003c/p\u003e\n\n    \u003ch3\u003e13. Disposiciones Generales\u003c/h3\u003e\n    \u003ch4\u003e13.1. Acuerdo Completo\u003c/h4\u003e\n    \u003cp\u003eEstos Términos, junto con nuestra Política de Privacidad, constituyen el acuerdo completo y exclusivo entre Usted y la Empresa con respecto al Servicio, y sustituyen y reemplazan todos los acuerdos, entendimientos, promesas, representaciones o garantías anteriores, tanto orales como escritas, con respecto a su objeto.\u003c/p\u003e\n\n    \u003ch4\u003e13.2. Divisibilidad\u003c/h4\u003e\n    \u003cp\u003eSi alguna disposición de estos Términos se considera inaplicable o inválida, dicha disposición se cambiará e interpretará para lograr los objetivos de dicha disposición en la mayor medida posible bajo la ley aplicable, y las disposiciones restantes continuarán en pleno vigor y efecto.\u003c/p\u003e\n\n    \u003ch4\u003e13.3. Renuncia\u003c/h4\u003e\n    \u003cp\u003eLa falta de la Empresa para ejercer o hacer cumplir cualquier derecho o disposición de estos Términos no constituirá una renuncia a dicho derecho o disposición. Ninguna renuncia por parte de la Empresa a cualquier término o condición establecido en estos Términos se considerará una renuncia posterior o continua de dicho término o condición o una renuncia a cualquier otro término o condición.\u003c/p\u003e\n\n    \u003ch4\u003e13.4. Fuerza Mayor\u003c/h4\u003e\n    \u003cp\u003eLa Empresa no será responsable de ningún fallo o retraso en el cumplimiento de sus obligaciones en virtud del presente documento cuando dicho fallo o retraso resulte de cualquier causa más allá de nuestro control razonable, incluyendo, sin limitación, actos de fuerza mayor, desastres naturales, actos de guerra o terrorismo, disturbios, embargos, actos de autoridades civiles o militares, incendios, inundaciones, accidentes, pandemias, huelgas o escasez de instalaciones de transporte, combustible, energía, mano de obra o materiales.\u003c/p\u003e\n    \n    \u003ch3\u003e14. Contacto\u003c/h3\u003e\n    \u003cp\u003eSi tiene alguna pregunta sobre estos Términos de Servicio, puede ponerse en contacto con nosotros:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eVisitando esta página en nuestro sitio web: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003ePor correo postal: ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003cp\u003e© {2026} TIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS. Todos los derechos reservados.\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e","label":"Términos de Servicio","languageLabel":"Español"},{"documentType":"return_refund","language":"PT","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"pt-BR\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003ePolítica de Devolução e Reembolso - TIMESAFE\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003ePolítica de Devolução e Reembolso do TIMESAFE\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eÚltima atualização:\u003c/strong\u003e 1 de outubro de 2026\u003c/p\u003e\n\n    \u003cp\u003eAgradecemos por escolher e adquirir os serviços da \u003cstrong\u003eTIMESAFE\u003c/strong\u003e. Esta Política de Devolução e Reembolso (\"Política\") descreve os termos e condições sob os quais reembolsos podem ser concedidos para o nosso software e serviços associados.\u003c/p\u003e\n\n    \u003cp\u003e\u003cstrong\u003eAO ADQUIRIR, ACESSAR, INSTALAR OU UTILIZAR O SERVIÇO, VOCÊ (\"USUÁRIO\" OU \"VOCÊ\") RECONHECE QUE LEU, COMPREENDEU E CONCORDA INTEGRALMENTE EM ESTAR VINCULADO A TODOS OS TERMOS E CONDIÇÕES DESTA POLÍTICA. SE VOCÊ NÃO CONCORDAR COM ESTA POLÍTICA OU QUALQUER UMA DE SUAS CLÁUSULAS, VOCÊ NÃO DEVE ADQUIRIR OU UTILIZAR O SERVIÇO. A CONTINUIDADE DO USO DO SERVIÇO APÓS A COMPRA CONSTITUI ACEITAÇÃO INEQUÍVOCA DESTES TERMOS.\u003c/strong\u003e\u003c/p\u003e\n\n    \u003cp\u003eEsta Política é parte integrante e inseparável dos Termos de Serviço da TIMESAFE. Os termos não definidos aqui terão o mesmo significado que lhes é atribuído nos Termos de Serviço.\u003c/p\u003e\n\n    \u003ch3\u003e1. Interpretação e Definições\u003c/h3\u003e\n    \n    \u003ch4\u003eInterpretação\u003c/h4\u003e\n    \u003cp\u003eAs palavras cuja letra inicial é maiúscula têm significados definidos nas seguintes condições. As seguintes definições terão o mesmo significado, independentemente de aparecerem no singular ou no plural. Esta seção estabelece a base para a interpretação jurídica de todos os termos subsequentes, com o objetivo de eliminar ambiguidades e proteger a Empresa contra interpretações extensivas ou desfavoráveis.\u003c/p\u003e\n\n    \u003ch4\u003eDefinições\u003c/h4\u003e\n    \u003cp\u003ePara os fins desta Política de Devolução e Reembolso:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"a Empresa\", \"Nós\", \"Nos\" ou \"Nosso\" neste Contrato) refere-se a \u003cstrong\u003eTIMESAFE SISTEMAS, SOLUÇÕES E PROTEÇÃO DE DOCUMENTOS DIGITAIS\u003c/strong\u003e, pessoa jurídica de direito privado, inscrita no CNPJ sob o nº 41.648.990/0001-56, com NIRE 35237097027, com sede na ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServiço\u003c/strong\u003e refere-se ao software \u003cstrong\u003eTIMESAFE\u003c/strong\u003e, incluindo todas as suas funcionalidades, aplicativos, websites, APIs e quaisquer outros produtos ou serviços digitais oferecidos pela Empresa sob a marca TIMESAFE.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eBens\u003c/strong\u003e ou \u003cstrong\u003eProdutos Digitais\u003c/strong\u003e referem-se às licenças de software, assinaturas, créditos ou outros itens intangíveis oferecidos para venda ou acesso através do Serviço.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAssinatura\u003c/strong\u003e refere-se ao acesso ao Serviço ou a partes dele, disponibilizado mediante pagamento antecipado e recorrente (mensal, anual ou outro período).\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePedido\u003c/strong\u003e significa uma solicitação feita por Você para comprar Bens Digitais de Nós.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVocê\u003c/strong\u003e significa o indivíduo que acessa ou usa o Serviço, ou a empresa ou outra entidade legal em nome da qual tal indivíduo está acessando ou usando o Serviço, conforme aplicável.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDia útil\u003c/strong\u003e significa qualquer dia que não seja sábado, domingo ou feriado nacional ou local na cidade de São Paulo, SP, Brasil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eLGPD\u003c/strong\u003e refere-se à Lei Geral de Proteção de Dados Pessoais (Lei nº 13.709/2018 do Brasil).\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDireito de Arrependimento\u003c/strong\u003e refere-se ao direito legalmente garantido pelo Artigo 49 do Código de Defesa do Consumidor brasileiro (Lei nº 8.078/90), que permite ao consumidor desistir de uma compra feita fora do estabelecimento comercial físico no prazo de 7 (sete) dias.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003e2. Sua Elegibilidade para Reembolso\u003c/h3\u003e\n    \n    \u003cp\u003eA nossa política de reembolso é estrita e foi desenvolvida para proteger a propriedade intelectual e a natureza digital de nossos produtos. A elegibilidade para um reembolso é limitada e determinada a critério exclusivo da Empresa, exceto onde a lei aplicável exija o contrário.\u003c/p\u003e\n    \n    \u003ch4\u003eDireito de Arrependimento (Lei Brasileira)\u003c/h4\u003e\n    \u003cp\u003eConforme estipulado pelo Artigo 49 do Código de Defesa do Consumidor, Você tem o direito de se arrepender da compra de uma nova Assinatura no prazo de \u003cstrong\u003e7 (sete) dias corridos\u003c/strong\u003e a contar da data da compra inicial. Para ser elegível a um reembolso total sob esta cláusula:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eA solicitação de cancelamento e reembolso deve ser feita inequivocamente dentro do período de 7 dias.\u003c/li\u003e\n        \u003cli\u003eO Serviço não deve ter sido utilizado de forma substancial. A Empresa reserva-se o direito de avaliar o nível de utilização para determinar a elegibilidade. O download, ativação e uso contínuo das funcionalidades principais do Serviço podem ser considerados como utilização substancial, invalidando o direito ao reembolso, mesmo dentro do período de 7 dias, na máxima extensão permitida pela interpretação legal.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003e\u003cstrong\u003eAPÓS O PERÍODO DE 7 (SETE) DIAS, OU SE HOUVER USO SUBSTANCIAL DO SERVIÇO, VOCÊ PERDE O DIREITO AO REEMBOLSO COM BASE NO ARREPENDIMENTO, E NENHUM VALOR PAGO SERÁ REEMBOLSADO.\u003c/strong\u003e\u003c/p\u003e\n    \n    \u003ch4\u003eDefeitos Técnicos Irreparáveis\u003c/h4\u003e\n    \u003cp\u003eUm reembolso pode ser considerado, a nosso exclusivo critério, caso o Serviço apresente um defeito técnico grave que impeça completamente sua funcionalidade principal e que nossa equipe de suporte técnico não consiga resolver dentro de um prazo razoável (tipicamente 30 dias corridos) após Você ter fornecido todas as informações necessárias para o diagnóstico. Para ser elegível sob esta cláusula:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eVocê deve entrar em contato com nosso suporte técnico através do canal oficial (\u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e) e cooperar plenamente com os esforços de solução de problemas.\u003c/li\u003e\n        \u003cli\u003eVocê deve fornecer provas documentadas do defeito, como capturas de tela, vídeos, logs de erro e uma descrição detalhada do problema e do ambiente do seu sistema (sistema operacional, versão, etc.).\u003c/li\u003e\n        \u003cli\u003eO defeito não pode ser causado por incompatibilidade com hardware, software de terceiros, configurações de rede, restrições de firewall ou outras variáveis no seu ambiente que estão fora do controle da Empresa. VOCÊ É O ÚNICO RESPONSÁVEL POR GARANTIR A COMPATIBILIDADE DO SERVIÇO COM SEU SISTEMA ANTES DA COMPRA.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003e3. Prazos para Solicitação\u003c/h3\u003e\n\n    \u003ch4\u003ePrazo para Direito de Arrependimento\u003c/h4\u003e\n    \u003cp\u003eA solicitação de reembolso com base no Direito de Arrependimento deve ser formalizada em até \u003cstrong\u003e7 (sete) dias corridos\u003c/strong\u003e contados a partir da data de confirmação do pagamento da primeira Assinatura. Solicitações recebidas após este prazo serão automaticamente negadas para fins desta cláusula.\u003c/p\u003e\n\n    \u003ch4\u003ePrazo para Reclamações de Defeitos Técnicos\u003c/h4\u003e\n    \u003cp\u003eReclamações sobre defeitos técnicos devem ser reportadas ao nosso suporte o mais rápido possível após a descoberta do problema. A elegibilidade para um reembolso por defeito técnico, se aplicável, é válida durante o período de assinatura ativo, mas a análise considerará o tempo de uso do serviço antes do relato do problema.\u003c/p\u003e\n\n    \u003ch4\u003eRenovações de Assinatura\u003c/h4\u003e\n    \u003cp\u003e\u003cstrong\u003eRENOVAÇÕES DE ASSINATURAS (MENSAIS, ANUAIS OU DE OUTRA PERIODICIDADE) SÃO FINAIS E NÃO REEMBOLSÁVEIS.\u003c/strong\u003e O Direito de Arrependimento de 7 dias não se aplica a renovações automáticas ou manuais de assinaturas existentes. É de sua exclusiva responsabilidade gerenciar sua assinatura e cancelá-la antes da data de renovação, caso não deseje continuar com o Serviço. A Empresa envidará esforços comerciais razoáveis para notificá-lo sobre a renovação iminente, mas a falha no recebimento de tal notificação não o isenta da responsabilidade pelo pagamento nem o torna elegível para um reembolso.\u003c/p\u003e\n\n    \u003ch3\u003e4. Processo de Reembolso\u003c/h3\u003e\n\n    \u003cp\u003ePara solicitar um reembolso, Você deve seguir estritamente o processo abaixo. A falha em cumprir qualquer uma das etapas pode resultar na recusa da sua solicitação.\u003c/p\u003e\n    \u003col\u003e\n        \u003cli\u003e\u003cstrong\u003eContato Inicial:\u003c/strong\u003e Todas as solicitações de reembolso devem ser iniciadas exclusivamente através do nosso formulário de contato oficial, disponível em: \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e. Solicitações feitas por outros meios não serão consideradas válidas.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eFornecimento de Informações:\u003c/strong\u003e Na sua solicitação, você deve incluir:\n            \u003cul\u003e\n                \u003cli\u003eO endereço de e-mail associado à sua conta TIMESAFE.\u003c/li\u003e\n                \u003cli\u003eO número do pedido ou ID da transação.\u003c/li\u003e\n                \u003cli\u003eUma justificativa clara e detalhada para o pedido de reembolso, especificando se é com base no Direito de Arrependimento ou em um defeito técnico.\u003c/li\u003e\n                \u003cli\u003eEm caso de defeito técnico, fornecer todas as evidências solicitadas por nossa equipe, conforme descrito na Seção 2.\u003c/li\u003e\n            \u003c/ul\u003e\n        \u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAnálise e Investigação:\u003c/strong\u003e Após o recebimento da sua solicitação completa, a Empresa irá analisá-la. Para alegações de defeitos, nossa equipe de suporte técnico pode precisar entrar em contato com você para realizar procedimentos de diagnóstico. Sua cooperação total é obrigatória. Reservamo-nos o direito de levar até 30 (trinta) dias úteis para investigar e responder à sua solicitação.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eNotificação da Decisão:\u003c/strong\u003e Você será notificado por e-mail sobre a aprovação ou rejeição do seu pedido de reembolso. A decisão da Empresa é final e vinculante, na máxima extensão permitida pela lei.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eProcessamento do Reembolso:\u003c/strong\u003e Se o seu reembolso for aprovado, o valor será creditado no seu método de pagamento original. O prazo para que o crédito apareça em sua fatura ou extrato pode variar de 5 a 15 dias úteis, dependendo da operadora do cartão de crédito ou do processador de pagamento. A Empresa não se responsabiliza por atrasos causados por terceiros (bancos, operadoras de cartão).\u003c/li\u003e\n    \u003c/ol\u003e\n    \u003cp\u003e\u003cstrong\u003eCONSEQUÊNCIAS DE UM REEMBOLSO:\u003c/strong\u003e Se um reembolso for emitido, seu acesso ao Serviço será imediatamente revogado. Todas as licenças concedidas a Você serão rescindidas, e Você concorda em desinstalar e destruir todas as cópias do software em sua posse ou controle.\u003c/p\u003e\n    \n    \u003ch3\u003e5. Itens Não Reembolsáveis\u003c/h3\u003e\n\n    \u003cp\u003ePARA EVITAR DÚVIDAS, E EM ADIÇÃO A OUTRAS RESTRIÇÕES NESTA POLÍTICA, OS SEGUINTES ITENS SÃO ESTRITAMENTE NÃO REEMBOLSÁVEIS, EXCETO QUANDO EXPRESSAMENTE EXIGIDO PELA LEI IMPERATIVA:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eRenovações de Assinatura:\u003c/strong\u003e Quaisquer taxas pagas pela renovação automática ou manual de uma assinatura existente.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePeríodos de Assinatura Parcialmente Utilizados:\u003c/strong\u003e Se você cancelar sua assinatura no meio do ciclo de faturamento, não haverá reembolso pró-rata pelo tempo não utilizado. Você continuará a ter acesso ao Serviço até o final do período já pago.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eUpgrades ou Downgrades de Plano:\u003c/strong\u003e Taxas associadas à mudança de um plano de assinatura para outro.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCompras Feitas Após o Período de Teste Gratuito (Free Trial):\u003c/strong\u003e Se oferecermos um período de teste gratuito, é sua responsabilidade cancelar antes do final do teste para evitar a cobrança. Uma vez que a cobrança é feita, ela não é reembolsável.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eIncompatibilidade de Sistema:\u003c/strong\u003e Falhas no funcionamento do Serviço devido ao seu hardware, software de terceiros, sistema operacional desatualizado ou não suportado, ou configurações de rede. A verificação dos requisitos de sistema é de sua exclusiva responsabilidade.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eMudança de Ideia ou Insatisfação Subjetiva:\u003c/strong\u003e Após o período de 7 dias do Direito de Arrependimento, a insatisfação com os recursos, a interface ou o funcionamento geral do Serviço não é motivo para reembolso.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eFalta de Uso:\u003c/strong\u003e O fato de você não ter usado o Serviço durante o período de assinatura não o qualifica para um reembolso.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCompras com Desconto ou Promocionais:\u003c/strong\u003e Itens comprados durante vendas especiais ou com códigos de desconto podem ser designados como \"venda final\" e não são elegíveis para reembolso.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServiços de Consultoria ou Personalização:\u003c/strong\u003e Quaisquer taxas pagas por serviços profissionais, treinamento, personalização ou consultoria são estritamente não reembolsáveis uma vez que o trabalho tenha começado.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003e6. Reembolsos Parciais\u003c/h3\u003e\n\n    \u003cp\u003eA Empresa não oferece reembolsos parciais como prática padrão. Em circunstâncias excepcionais e a seu exclusivo e absoluto critério, a Empresa pode optar por oferecer um reembolso parcial ou um crédito para uso futuro como um gesto de boa vontade. Tal oferta não constitui um precedente nem uma obrigação para casos futuros. A aceitação de um reembolso parcial por Você encerra permanentemente qualquer disputa ou reclamação relacionada ao Pedido em questão.\u003c/p\u003e\n    \n    \u003ch3\u003e7. Trocas\u003c/h3\u003e\n\n    \u003cp\u003eSendo o Serviço um produto digital, o conceito tradicional de \"troca\" não se aplica. Não trocamos uma assinatura do \u003cstrong\u003eTIMESAFE\u003c/strong\u003e por outro produto ou serviço. Se sua licença ou chave de ativação estiver com defeito e nossa equipe de suporte confirmar o problema, forneceremos uma nova licença ou chave de ativação para o mesmo produto, mas isso não constitui uma troca de produto.\u003c/p\u003e\n\n    \u003chr\u003e\n\n    \u003ch3\u003eDISPOSIÇÕES LEGAIS E LIMITAÇÃO DE RESPONSABILIDADE\u003c/h3\u003e\n    \n    \u003ch4\u003eIsenção de Garantias (\"COMO ESTÁ\")\u003c/h4\u003e\n    \u003cp\u003eO SERVIÇO E TODOS OS BENS DIGITAIS SÃO FORNECIDOS A VOCÊ \"COMO ESTÃO\" E \"CONFORME DISPONÍVEIS\", COM TODAS AS FALHAS E DEFEITOS, SEM GARANTIA DE QUALQUER TIPO. NA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, A EMPRESA, EM SEU PRÓPRIO NOME E EM NOME DE SUAS AFILIADAS E SEUS RESPECTIVOS LICENCIADORES E PRESTADORES DE SERVIÇOS, ISENTA-SE EXPRESSAMENTE DE TODAS AS GARANTIAS, SEJAM EXPRESSAS, IMPLÍCITAS, ESTATUTÁRIAS OU DE OUTRA FORMA, COM RELAÇÃO AO SERVIÇO, INCLUINDO TODAS AS GARANTIAS IMPLÍCITAS DE COMERCIALIZAÇÃO, ADEQUAÇÃO A UM FIM ESPECÍFICO, TÍTULO E NÃO VIOLAÇÃO, E GARANTIAS QUE POSSAM SURGIR DO CURSO DA NEGOCIAÇÃO, CURSO DO DESEMPENHO, USO OU PRÁTICA COMERCIAL.\u003c/p\u003e\n    \u003cp\u003eA EMPRESA NÃO OFERECE NENHUMA GARANTIA OU COMPROMISSO, E NÃO FAZ NENHUMA DECLARAÇÃO DE QUALQUER TIPO DE QUE O SERVIÇO ATENDERÁ ÀS SUAS NECESSIDADES, ALCANÇARÁ OS RESULTADOS PRETENDIDOS, SERÁ COMPATÍVEL OU FUNCIONARÁ COM QUALQUER OUTRO SOFTWARE, APLICATIVOS, SISTEMAS OU SERVIÇOS, OPERARÁ SEM INTERRUPÇÃO, ATENDERÁ A QUAISQUER PADRÕES DE DESEMPENHO OU CONFIABILIDADE OU SERÁ LIVRE DE ERROS, OU QUE QUAISQUER ERROS OU DEFEITOS PODEM OU SERÃO CORRIGIDOS.\u003c/p\u003e\n\n    \u003ch4\u003eLimitação de Responsabilidade\u003c/h4\u003e\n    \u003cp\u003e\u003cstrong\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, EM NENHUMA CIRCUNSTÂNCIA A EMPRESA, SEUS DIRETORES, FUNCIONÁRIOS, SÓCIOS, AGENTES, FORNECEDORES OU AFILIADAS SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS, PUNITIVOS OU CONSEQUENCIAIS DE QUALQUER NATUREZA (INCLUINDO, MAS NÃO SE LIMITANDO A, DANOS POR PERDA DE LUCROS, PERDA DE DADOS OU OUTRAS INFORMAÇÕES CONFIDENCIAIS, POR INTERRUPÇÃO DE NEGÓCIOS, POR LESÃO PESSOAL, PERDA DE PRIVACIDADE DECORRENTE DE OU DE QUALQUER FORMA RELACIONADA AO USO OU INCAPACIDADE DE USAR O SERVIÇO, SOFTWARE DE TERCEIROS E/OU HARDWARE DE TERCEIROS USADO COM O SERVIÇO, OU DE OUTRA FORMA EM CONEXÃO COM QUALQUER DISPOSIÇÃO DESTA POLÍTICA), MESMO QUE A EMPRESA OU QUALQUER FORNECEDOR TENHA SIDO AVISADO DA POSSIBILIDADE DE TAIS DANOS E MESMO QUE A SOLUÇÃO FALHE EM SEU PROPÓSITO ESSENCIAL.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eA RESPONSABILIDADE TOTAL E CUMULATIVA DA EMPRESA E DE SEUS FORNECEDORES SOB ESTA POLÍTICA, OU DECORRENTE DE SEU USO DO SERVIÇO, NÃO EXCEDERÁ, EM HIPÓTESE ALGUMA, O MAIOR DOS SEGUINTES VALORES: (A) O MONTANTE TOTAL EFETIVAMENTE PAGO POR VOCÊ À EMPRESA PELO SERVIÇO ESPECÍFICO QUE DEU ORIGEM À RECLAMAÇÃO DURANTE OS 12 (DOZE) MESES IMEDIATAMENTE ANTERIORES AO EVENTO QUE ORIGINOU A RESPONSABILIDADE; OU (B) R$ 100,00 (CEM REAIS). AS LIMITAÇÕES E EXCLUSÕES NESTA SEÇÃO APLICAM-se INDEPENDENTEMENTE DA TEORIA DA RESPONSABILIDADE, SEJA CONTRATUAL, EXTRACONTRATUAL (INCLUINDO NEGLIGÊNCIA), GARANTIA, RESPONSABILIDADE OBJETIVA OU QUALQUER OUTRA BASE LEGAL.\u003c/strong\u003e\u003c/p\u003e\n\n    \u003ch4\u003eIndenização\u003c/h4\u003e\n    \u003cp\u003eVocê concorda em indenizar, defender e isentar de responsabilidade a Empresa e suas afiliadas, diretores, funcionários, agentes, licenciadores e fornecedores de e contra todas e quaisquer reclamações, perdas, responsabilidades, demandas, danos, custos e despesas (incluindo honorários advocatícios razoáveis e custos judiciais) decorrentes de ou relacionados a: (i) seu uso ou mau uso do Serviço; (ii) sua violação desta Política ou dos Termos de Serviço; (iii) sua violação de quaisquer leis, regras ou regulamentos aplicáveis; ou (iv) sua violação de quaisquer direitos de terceiros, incluindo, sem limitação, qualquer direito de propriedade intelectual ou direito de privacidade. A Empresa reserva-se o direito, às suas próprias custas, de assumir a defesa e o controle exclusivos de qualquer assunto sujeito a indenização por Você, caso em que Você cooperará plenamente com a Empresa na afirmação de quaisquer defesas disponíveis.\u003c/p\u003e\n\n    \u003ch4\u003eLei Aplicável e Jurisdição\u003c/h4\u003e\n    \u003cp\u003eEsta Política e qualquer disputa ou reclamação decorrente de ou em conexão com ela serão regidas e interpretadas de acordo com as leis da República Federativa do Brasil, desconsiderando quaisquer princípios de conflitos de leis que possam direcionar a aplicação da lei de outra jurisdição.\u003c/p\u003e\n    \u003cp\u003eFica eleito o foro da Comarca de São Paulo, Estado de São Paulo, Brasil, como o único competente para dirimir quaisquer controvérsias decorrentes desta Política, com a renúncia expressa a qualquer outro, por mais privilegiado que seja ou venha a ser.\u003c/p\u003e\n\n    \u003ch4\u003eConformidade com a LGPD e Privacidade de Dados\u003c/h4\u003e\n    \u003cp\u003eA Empresa está em conformidade com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018) e suas regulamentações subsequentes. Ao solicitar um reembolso, Você reconhece e concorda que a Empresa coletará e processará seus dados pessoais (como nome, e-mail, informações de pagamento e detalhes da transação) para as seguintes finalidades:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eProcessar e analisar sua solicitação de reembolso.\u003c/li\u003e\n        \u003cli\u003ePrevenir fraudes e abusos de nossa política de reembolso.\u003c/li\u003e\n        \u003cli\u003eCumprir obrigações legais e regulatórias.\u003c/li\u003e\n        \u003cli\u003eComunicar-se com Você sobre sua solicitação.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eSeus dados serão tratados de acordo com nossa Política de Privacidade. Em conformidade com a LGPD, você tem direitos sobre seus dados, incluindo acesso, correção, eliminação, portabilidade e revogação do consentimento. Para exercer esses direitos, entre em contato conosco.\u003c/p\u003e\n    \u003cp\u003eEm caso de um incidente de segurança que possa acarretar risco ou dano relevante aos seus dados pessoais, a Empresa notificará a Autoridade Nacional de Proteção de Dados (ANPD) e os titulares dos dados afetados em um prazo de \u003cstrong\u003e3 (três) dias úteis\u003c/strong\u003e, conforme as mais recentes diretrizes da ANPD.\u003c/p\u003e\n    \u003cp\u003ePara transferências internacionais de dados, se necessárias para o processamento de pagamentos ou suporte, a Empresa adota as Cláusulas Contratuais Padrão aprovadas pela ANPD (conforme Resolução CD/ANPD nº 19/2024) ou outras salvaguardas legais para garantir um nível adequado de proteção.\u003c/p\u003e\n\n    \u003ch3\u003e8. Contato\u003c/h3\u003e\n\n    \u003cp\u003eSe você tiver alguma dúvida sobre nossa Política de Devolução e Reembolso, ou precisar iniciar uma solicitação, entre em contato conosco exclusivamente através do nosso canal oficial:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eVisitando esta página em nosso site:\u003c/strong\u003e \u003ca href=\"https://www.timesafe.com.br/contato.html\"\u003ehttps://www.timesafe.com.br/contato.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eAs comunicações enviadas para qualquer outro endereço ou canal não serão consideradas oficialmente recebidas e não terão validade legal para os fins desta Política.\u003c/p\u003e\n    \n    \u003cp\u003eA Empresa reserva-se o direito de modificar esta Política a qualquer momento, a seu exclusivo critério. Publicaremos a política revisada nesta página e atualizaremos a data da \"Última atualização\". O uso continuado do Serviço após tais alterações constitui sua aceitação da nova Política.\u003c/p\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Devolução e Reembol
