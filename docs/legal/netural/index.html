SPRICHT; (B) DER DIENST UNUNTERBROCHEN, RECHTZEITIG, SICHER ODER FEHLERFREI IST; (C) DIE ERGEBNISSE, DIE AUS DER NUTZUNG DES DIENSTES ABGELEITET WERDEN, GENAU ODER ZUVERLÄSSIG SIND; ODER (D) DIE QUALITÄT VON PRODUKTEN, DIENSTLEISTUNGEN, INFORMATIONEN ODER ANDEREN MATERIALIEN, DIE ÜBER DEN DIENST ERLANGT WERDEN, IHREN ERWARTUNGEN ENTSPRICHT.\u003c/p\u003e\n\n    \u003ch2\u003eAkzeptanz durch Nutzung\u003c/h2\u003e\n    \u003cp\u003eINDEM SIE AUF DEN DIENST ZUGREIFEN, IHN HERUNTERLADEN, INSTALLIEREN ODER VERWENDEN, BESTÄTIGEN SIE, DASS SIE DIESE BEDINGUNGEN GELESEN UND VERSTANDEN HABEN UND SICH VERPFLICHTEN, AN DIESE BEDINGUNGEN GEBUNDEN ZU SEIN. WENN SIE DIESEN BEDINGUNGEN NICHT ZUSTIMMEN, ZUGRIFF AUF DEN DIENST ODER DIE NUTZUNG DES DIENSTES VERWEIGERN.\u003c/p\u003e\n    \u003cp\u003eDie fortgesetzte Nutzung des Dienstes nach Änderungen dieser Bedingungen stellt Ihre Akzeptanz solcher Änderungen dar.\u003c/p\u003e\n\n    \u003ch2\u003eGeltendes Recht und Gerichtsstand\u003c/h2\u003e\n    \u003cp\u003eDiese Bedingungen unterliegen den Gesetzen der Föderativen Republik Brasilien und sind in Übereinstimmung mit diesen auszulegen, ohne Berücksichtigung der Vorschriften über das Rechtskonfliktrecht.\u003c/p\u003e\n    \u003cp\u003eAlle Streitigkeiten, die sich aus oder im Zusammenhang mit diesen Bedingungen ergeben, unterliegen der ausschließlichen Zuständigkeit der Gerichte der Stadt São Paulo, Bundesstaat São Paulo, Brasilien, und die Parteien verzichten unwiderruflich auf jeglichen Einwand gegen die Zuständigkeit solcher Gerichte.\u003c/p\u003e\n\n    \u003ch2\u003eRisikotransfer\u003c/h2\u003e\n    \u003cp\u003eSIE ÜBERNEHMEN VOLLE VERANTWORTUNG UND RISIKO FÜR IHRE NUTZUNG DES DIENSTES. DER DIENST WIRD \"WIE BESEHEN\" BEREITGESTELLT OHNE GEWÄHRLEISTUNGEN IRGENDWELCHER ART. DIE FIRMA HAFTET NICHT FÜR SCHÄDEN, DIE AUS DER NUTZUNG ODER UNMÖGLICHKEIT DER NUTZUNG DES DIENSTES RESULTIEREN, EINSCHLIESSLICH SCHÄDEN, DIE DURCH SCHADSOFTWARE, VIREN ODER IRGENDEINEN FALSCHEN ODER UNVOLLSTÄNDIGEN COMPUTERPROGRAMM VERURSACHT WERDEN.\u003c/p\u003e\n\n    \u003ch2\u003eLGPD-Konformität\u003c/h2\u003e\n    \u003cp\u003eDieses Dokument entspricht dem brasilianischen Allgemeinen Datenschutzgesetz (LGPD - Gesetz Nr. 13.709/2018) und seinen Aktualisierungen, einschließlich:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eANPD-Beschluss CD Nr. 19/2024\u003c/strong\u003e: Regeln für die internationale Übertragung personenbezogener Daten.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVorfallmeldung\u003c/strong\u003e: Frist von 3 (drei) Werktagen zur Benachrichtigung der ANPD und der betroffenen Personen.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRechte der Betroffenen\u003c/strong\u003e: Zugang, Berichtigung, Übertragbarkeit, Löschung und Widerruf der Einwilligung.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDatenschutzbeauftragter (DPO)\u003c/strong\u003e: Kontaktinformationen öffentlich verfügbar.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eDie Strafen können bis zu 2 % des jährlichen Umsatzes in Brasilien oder bis zu 50 Millionen BRL pro Verstoß betragen.\u003c/p\u003e\n\n    \u003ch2\u003eAbonnements und Zahlungen\u003c/h2\u003e\n    \u003ch3\u003eAbonnementzeitraum\u003c/h3\u003e\n    \u003cp\u003eDer Dienst oder einige Teile des Dienstes sind nur mit einem kostenpflichtigen Abonnement verfügbar. Sie werden im Voraus in regelmäßigen Abständen (monatlich oder jährlich) abgerechnet, abhängig von dem von Ihnen gewählten Abonnementplan.\u003c/p\u003e\n    \u003cp\u003eAm Ende jedes Zeitraums wird Ihr Abonnement automatisch unter den gleichen Bedingungen verlängert, es sei denn, Sie kündigen es oder die Firma kündigt es.\u003c/p\u003e\n\n    \u003ch3\u003eAbonnementkündigung\u003c/h3\u003e\n    \u003cp\u003eSie können die Verlängerung Ihres Abonnements über Ihre Kontoeinstellungen oder indem Sie uns kontaktieren, kündigen. Sie erhalten keine Rückerstattung für bereits gezahlte Gebühren für den aktuellen Abonnementzeitraum und können bis zum Ende des laufenden Zeitraums auf den Dienst zugreifen.\u003c/p\u003e\n\n    \u003ch3\u003ePreisänderungen\u003c/h3\u003e\n    \u003cp\u003eDie Firma kann nach eigenem Ermessen die Preise für Abonnements jederzeit ändern. Jede Änderung tritt am Ende des aktuellen Abonnementzeitraums in Kraft.\u003c/p\u003e\n\n    \u003ch3\u003eRückzahlungen\u003c/h3\u003e\n    \u003cp\u003eEs sei denn, es ist gesetzlich vorgeschrieben, sind die Gebühren für kostenpflichtige Abonnements nicht rückerstattbar. Rückerstattungen können auf einer Einzelfallbasis nach dem alleinigen Ermessen der Firma in Betracht gezogen werden.\u003c/p\u003e\n\n    \u003ch3\u003eKostenlose Testversion\u003c/h3\u003e\n    \u003cp\u003eDie Firma kann eine kostenlose Testversion für einen begrenzten Zeitraum anbieten. Am Ende des Testzeitraums werden Ihnen automatisch Abonnementgebühren berechnet, es sei denn, Sie kündigen vor Ende des Testzeitraums.\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e","label":"Copyright","languageLabel":"Deutsch"},{"documentType":"privacy_policy","language":"EN","content":"\u003ch2\u003ePrivacy Policy\u003c/h2\u003e\n\n\u003cp\u003eLast updated: January 20, 2026\u003c/p\u003e\n\n\u003cp\u003eThis Privacy Policy describes our policies and procedures regarding the collection, use, and disclosure of your information when you use the Service and informs you about your privacy rights and how the law protects you.\u003c/p\u003e\n\n\u003cp\u003eWe use your personal data to provide and improve the Service. By using the Service, you agree to the collection and use of information in accordance with this Privacy Policy.\u003c/p\u003e\n\n\u003ch2\u003eInterpretation and Definitions\u003c/h2\u003e\n\n\u003ch3\u003eInterpretation\u003c/h3\u003e\n\n\u003cp\u003eThe words whose initial letter is capitalized have meanings defined under the following conditions. The following definitions shall have the same meaning regardless of whether they appear in the singular or in the plural.\u003c/p\u003e\n\n\u003ch3\u003eDefinitions\u003c/h3\u003e\n\n\u003cp\u003eFor the purposes of this Privacy Policy:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eAccount\u003c/strong\u003e means a unique account created for you to access our Service or parts of our Service.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCompany\u003c/strong\u003e (referred to as \"the Company\", \"We\", \"Us\" or \"Our\" in this Privacy Policy) refers to MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e are small files that are placed on your computer, mobile device, or any other device by a website, containing the details of your browsing history on that website among its many uses.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCountry\u003c/strong\u003e refers to: Brazil.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDevice\u003c/strong\u003e means any device that can access the Service, such as a computer, a mobile phone, or a digital tablet.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePersonal Data\u003c/strong\u003e is any information that relates to an identified or identifiable individual.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eService\u003c/strong\u003e refers to the Application or the Website, or both.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eService Provider\u003c/strong\u003e means any natural or legal person who processes the data on behalf of the Company.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUsage Data\u003c/strong\u003e refers to data collected automatically, generated by the use of the Service or by the Service infrastructure itself.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eWebsite\u003c/strong\u003e refers to NETURAL, accessible from https://www.incodetech.com.br/contact.html.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eYou\u003c/strong\u003e means the individual accessing or using the Service, or the company, or any other legal entity on behalf of which such individual is accessing or using the Service, as applicable.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eCollection and Use of Your Personal Data\u003c/h2\u003e\n\n\u003ch3\u003eTypes of Data Collected\u003c/h3\u003e\n\n\u003ch4\u003ePersonal Data\u003c/h4\u003e\n\n\u003cp\u003eWhile using our Service, we may ask you to provide us with certain personally identifiable information that can be used to contact or identify you. Personally identifiable information may include, but is not limited to:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eEmail address\u003c/li\u003e\n    \u003cli\u003eFirst and last name\u003c/li\u003e\n    \u003cli\u003ePhone number\u003c/li\u003e\n    \u003cli\u003eAddress, State, Province, ZIP/Postal code, City\u003c/li\u003e\n    \u003cli\u003eUsage Data\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch4\u003eUsage Data\u003c/h4\u003e\n\n\u003cp\u003eUsage Data is collected automatically, either generated by the use of the Service or from the Service infrastructure itself.\u003c/p\u003e\n\n\u003cp\u003eUsage Data may include information such as your device's Internet Protocol address (e.g., IP address), browser type, browser version, the pages of our Service that you visit, the time and date of your visit, the time spent on those pages, unique device identifiers, and other diagnostic data.\u003c/p\u003e\n\n\u003ch2\u003eUse of Your Personal Data\u003c/h2\u003e\n\n\u003cp\u003eThe Company may use Personal Data for the following purposes:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eTo provide and maintain our Service:\u003c/strong\u003e including monitoring the use of our Service.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eTo manage your Account:\u003c/strong\u003e to manage your registration as a user of the Service.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eTo perform a contract:\u003c/strong\u003e the development, compliance, and undertaking of the contract for the purchase of the products, items, or services you have purchased.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eTo contact you:\u003c/strong\u003e To contact you by email, telephone calls, SMS, or other equivalent forms of electronic communication, such as a mobile application’s push notifications.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eTo manage your requests:\u003c/strong\u003e To manage and respond to your requests to us.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eRetention of Your Personal Data\u003c/h2\u003e\n\n\u003cp\u003eThe Company will retain your Personal Data only for as long as is necessary for the purposes set out in this Privacy Policy. We will retain and use your Personal Data to the extent necessary to comply with our legal obligations (for example, if we are required to retain your data to comply with applicable laws), resolve disputes, and enforce our legal agreements and policies.\u003c/p\u003e\n\n\u003ch2\u003eTransfer of Your Personal Data\u003c/h2\u003e\n\n\u003cp\u003eYour information, including Personal Data, may be transferred to — and maintained on — computers located outside of your state, province, country, or other governmental jurisdiction where the data protection laws may differ from those of your jurisdiction.\u003c/p\u003e\n\n\u003cp\u003eIn accordance with the LGPD and ANPD Resolution CD No. 19/2024, any international transfer of personal data will be conducted using Standard Contractual Clauses approved by the ANPD or other legally valid mechanisms.\u003c/p\u003e\n\n\u003ch2\u003eDisclosure of Your Personal Data\u003c/h2\u003e\n\n\u003ch3\u003eBusiness Transactions\u003c/h3\u003e\n\n\u003cp\u003eIf the Company is involved in a merger, acquisition, or asset sale, your Personal Data may be transferred. We will provide notice before your Personal Data is transferred and becomes subject to a different Privacy Policy.\u003c/p\u003e\n\n\u003ch3\u003eLegal Requirements\u003c/h3\u003e\n\n\u003cp\u003eThe Company may disclose your Personal Data in the good faith belief that such action is necessary to:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eTo comply with a legal obligation\u003c/li\u003e\n    \u003cli\u003eTo protect and defend the rights or property of the Company\u003c/li\u003e\n    \u003cli\u003eTo prevent or investigate possible wrongdoing in connection with the Service\u003c/li\u003e\n    \u003cli\u003eTo protect the personal safety of users of the Service or the public\u003c/li\u003e\n    \u003cli\u003eTo protect against legal liability\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eSecurity of Your Personal Data\u003c/h2\u003e\n\n\u003cp\u003eThe security of your Personal Data is important to us, but remember that no method of transmission over the Internet or method of electronic storage is 100% secure. While we strive to use commercially acceptable means to protect your Personal Data, we cannot guarantee its absolute security.\u003c/p\u003e\n\n\u003ch2\u003eYour Rights under LGPD\u003c/h2\u003e\n\n\u003cp\u003eUnder the General Data Protection Law (LGPD - Law No. 13.709/2018), you have the following rights:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eConfirmation and Access:\u003c/strong\u003e Confirm the existence of processing and access to your personal data.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCorrection:\u003c/strong\u003e Request the correction of incomplete, inaccurate, or outdated data.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAnonymization, Blocking, or Deletion:\u003c/strong\u003e Request the anonymization, blocking, or deletion of unnecessary, excessive data or data processed in noncompliance.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePortability:\u003c/strong\u003e Request the portability of the data to another service provider.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDeletion:\u003c/strong\u003e Request the deletion of personal data processed with the consent of the data subject.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eInformation:\u003c/strong\u003e Be informed about the public and private entities with which we share your data.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eRevocation of Consent:\u003c/strong\u003e Revoke consent at any time.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eIncident Notification\u003c/h3\u003e\n\n\u003cp\u003eIn accordance with the LGPD and the 2024 updates, we will notify the National Data Protection Authority (ANPD) and affected data subjects within 3 (three) business days from the knowledge of any security incident that may cause relevant risk or harm to data subjects.\u003c/p\u003e\n\n\u003ch3\u003eData Protection Officer (DPO)\u003c/h3\u003e\n\n\u003cp\u003eTo exercise your rights or clarify questions regarding the processing of your personal data, please contact our Data Protection Officer:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eEmail: info@incodetech.com.br\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eChanges to This Privacy Policy\u003c/h2\u003e\n\n\u003cp\u003eWe may update our Privacy Policy from time to time. We will notify you of any changes by posting the new Privacy Policy on this page.\u003c/p\u003e\n\n\u003cp\u003eWe recommend that you review this Privacy Policy periodically for any changes.\u003c/p\u003e\n\n\u003ch2\u003eContact Us\u003c/h2\u003e\n\n\u003cp\u003eIf you have any questions about this Privacy Policy, you can contact us:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eEmail: info@incodetech.com.br\u003c/li\u003e\n    \u003cli\u003eVisiting this page: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eContact Page\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eLimitation of Liability\u003c/h2\u003 how we use, store, and keep your personal data secure, please see our Privacy Policy.\u003c/p\u003e\n\n\u003cp\u003eWe do not store sensitive personal information such as mailing addresses, account passwords, etc., in the cookies we use.\u003c/p\u003e\n\n\u003ch2\u003eInterpretation and Definitions\u003c/h2\u003e\n\n\u003ch3\u003eInterpretation\u003c/h3\u003e\n\u003cp\u003eThe words whose initial letter is capitalized have meanings defined in the following conditions. The following definitions shall have the same meaning regardless of whether they appear in singular or plural form.\u003c/p\u003e\n\n\u003ch3\u003eDefinitions\u003c/h3\u003e\n\u003cp\u003eFor the purposes of this Cookie Policy:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eCompany\u003c/strong\u003e (referred to as \"the Company\", \"We\", \"Us\" or \"Our\" in this Cookie Policy) refers to MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e means small files that are placed on your computer, mobile device, or any other device by a website, containing details of your browsing history on that website among your various uses.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e refers to NETURAL, accessible at \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eYou\u003c/strong\u003e means the individual accessing or using the Site, or a business or legal entity on behalf of which such individual is accessing or using the Site, as applicable.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eThe Use of Cookies\u003c/h2\u003e\n\n\u003ch3\u003eTypes of Cookies We Use\u003c/h3\u003e\n\u003cp\u003eCookies can be “Persistent” or “Session.” Persistent cookies remain on your personal computer or mobile device when you go offline, while session cookies are deleted as soon as you close your browser.\u003c/p\u003e\n\u003cp\u003eWe use session and persistent cookies for the purposes defined below:\u003c/p\u003e\n\n\u003ch4\u003eEssential / Necessary Cookies\u003c/h4\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eType:\u003c/strong\u003e Session Cookies\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eManaged by:\u003c/strong\u003e Us\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePurpose:\u003c/strong\u003e These cookies are essential for providing you with the services available through the Site and for enabling you to use some of its features. They assist in authenticating users and preventing the fraudulent use of user accounts. Without these cookies, the services you requested cannot be provided, and we only use these cookies to provide those services to you.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch4\u003eCookie Acceptance Cookies\u003c/h4\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eType:\u003c/strong\u003e Persistent Cookies\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eManaged by:\u003c/strong\u003e Us\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePurpose:\u003c/strong\u003e These cookies identify if users have accepted the use of cookies on the Site.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch4\u003eFunctionality Cookies\u003c/h4\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eType:\u003c/strong\u003e Persistent Cookies\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eManaged by:\u003c/strong\u003e Us\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePurpose:\u003c/strong\u003e These cookies allow us to remember choices you make when you use the Site, such as remembering your login details or language preference. The purpose of these cookies is to provide you with a more personalized experience and to avoid having to re-enter your preferences every time you use the Site.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch4\u003eTracking and Performance Cookies\u003c/h4\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eType:\u003c/strong\u003e Persistent Cookies\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eManaged by:\u003c/strong\u003e Third Parties\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePurpose:\u003c/strong\u003e These cookies are used to track information about traffic to the Site and how users use the Site. Information collected through these cookies may identify you directly or indirectly as an individual visitor.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch4\u003eAdvertising and Targeting Cookies\u003c/h4\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eType:\u003c/strong\u003e Persistent Cookies\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eManaged by:\u003c/strong\u003e Third Parties\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePurpose:\u003c/strong\u003e These cookies track your browsing habits to allow us to show advertising that is likely to be of interest to you.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eYour Choices Regarding Cookies\u003c/h3\u003e\n\u003cp\u003eIf you prefer to avoid the use of cookies on the Site, you must first disable the use of cookies in your browser and then delete the cookies saved in your browser associated with this Site. You can use this option for preventing the use of cookies at any time.\u003c/p\u003e\n\n\u003cp\u003eIf you do not accept our cookies, you may experience some inconvenience in your use of the Site and some features may not function properly.\u003c/p\u003e\n\n\u003ch4\u003eHow to Disable Cookies\u003c/h4\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eChrome:\u003c/strong\u003e \u003ca href=\"https://support.google.com/accounts/answer/32050\"\u003ehttps://support.google.com/accounts/answer/32050\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eInternet Explorer:\u003c/strong\u003 lo, State of São Paulo, Brazil, and the parties irrevocably waive any objection to the jurisdiction of such courts.\u003c/p\u003e\n\n\u003ch2\u003eAssumption of Risk\u003c/h2\u003e\n\n\u003cp\u003eYOU ASSUME FULL RESPONSIBILITY AND RISK FOR YOUR USE OF THE SERVICE. THE SERVICE IS PROVIDED \"AS IS\" WITHOUT WARRANTIES OF ANY KIND. INCODE TECH SHALL NOT BE LIABLE FOR ANY DAMAGES RESULTING FROM THE USE OR INABILITY TO USE THE SERVICE, INCLUDING DAMAGES CAUSED BY MALWARE, VIRUSES, OR ANY INCORRECT OR INCOMPLETE COMPUTER PROGRAM.\u003c/p\u003e\n\n\u003ch2\u003eLGPD Compliance\u003c/h2\u003e\n\n\u003cp\u003eThis document complies with the Brazilian General Data Protection Law (LGPD - Law No. 13.709/2018) and its updates, including:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD Resolution CD No. 19/2024\u003c/strong\u003e: Rules for international transfer of personal data.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eIncident Notification\u003c/strong\u003e: 3 (three) business day deadline to notify ANPD and affected data subjects.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eData Subject Rights\u003c/strong\u003e: Access, correction, portability, deletion, and consent revocation.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eData Protection Officer (DPO)\u003c/strong\u003e: Contact information publicly available.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eKey LGPD 2024-2025 requirements\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003eData breach notification: 3 business days to notify ANPD and affected users.\u003c/li\u003e\n    \u003cli\u003eInternational data transfers: Must use ANPD-approved Standard Contractual Clauses (Resolution CD/ANPD No. 19/2024).\u003c/li\u003e\n    \u003cli\u003eData subject rights: Access, correction, portability, deletion, and consent revocation.\u003c/li\u003e\n    \u003cli\u003eDPO contact information must be publicly available.\u003c/li\u003e\n    \u003cli\u003ePenalties: Up to 2% of annual Brazil revenue or BRL 50 million per violation.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eSubscriptions and Payments\u003c/h2\u003e\n\n\u003ch3\u003eSubscription Period\u003c/h3\u003e\n\u003cp\u003eThe Service or some parts of the Service are available only with a paid Subscription. You will be billed in advance on a recurring basis (monthly or annual), depending on the type of subscription plan you select.\u003c/p\u003e\n\u003cp\u003eAt the end of each period, your Subscription will automatically renew under the same conditions unless you cancel it or INCODE TECH cancels it.\u003c/p\u003e\n\n\u003ch3\u003eSubscription Cancellation\u003c/h3\u003e\n\u003cp\u003eYou may cancel the renewal of your Subscription through your Account settings or by contacting us. You will not receive a refund for fees already paid for the current subscription period and may access the Service until the end of the current period.\u003c/p\u003e\n\n\u003ch3\u003ePrice Changes\u003c/h3\u003e\n\u003cp\u003eINCODE TECH may, in its sole discretion, modify subscription prices at any time. Any change will take effect at the end of the current subscription period.\u003c/p\u003e\n\n\u003ch3\u003eRefunds\u003c/h3\u003e\n\u003cp\u003eExcept when required by law, paid subscription fees are non-refundable. Refunds may be considered on a case-by-case basis at INCODE TECH's sole discretion.\u003c/p\u003e\n\n\u003ch3\u003eFree Trial\u003c/h3\u003e\n\u003cp\u003eINCODE TECH may offer a free trial for a limited time. At the end of the trial period, you will be automatically charged subscription fees unless you cancel before the end of the trial period.\u003c/p\u003e","label":"Copyright","languageLabel":"English"},{"documentType":"return_refund","language":"PT","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003ePolítica de Devolução e Reembolso\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003ePolítica de Devolução e Reembolso\u003c/h2\u003e\n    \u003cp\u003eÚltima atualização: 20 de janeiro de 2026\u003c/p\u003e\n    \u003cp\u003eObrigado por comprar em NETURAL.\u003c/p\u003e\n    \u003cp\u003eSe você não estiver totalmente satisfeito com sua compra, estamos aqui para ajudar.\u003c/p\u003e\n\n    \u003ch2\u003eInterpretação e Definições\u003c/h2\u003e\n    \u003ch3\u003eDefinições\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e refere-se a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICAÇÃO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SÃO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eBens\u003c/strong\u003e referem-se aos itens oferecidos para venda no Serviço.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePedidos\u003c/strong\u003e significa uma solicitação sua para comprar Bens de nós.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServiço\u003c/strong\u003e refere-se a NETURAL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVocê\u003c/strong\u003e significa o indivíduo acessando ou usando o Serviço, ou a empresa, ou outra entidade legal em nome da qual tal indivíduo está acessando ou usando o Serviço.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eSua Elegibilidade para Reembolso\u003c/h2\u003e\n    \u003cp\u003eOs seguintes itens são elegíveis para reembolso:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eBens com defeito ou danificados no momento da entrega.\u003c/li\u003e\n        \u003cli\u003eBens que não correspondem à descrição fornecida.\u003c/li\u003e\n        \u003cli\u003eBens não utilizados e em sua embalagem original.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003ePara ser elegível para um retorno, seu item deve estar não utilizado e nas mesmas condições em que você o recebeu. Também deve estar na embalagem original.\u003c/p\u003e\n\n    \u003ch2\u003ePrazos para Solicitação\u003c/h2\u003e\n    \u003cp\u003eVocê tem 7 (sete) dias corridos a partir da data de recebimento do produto para solicitar a devolução ou reembolso, conforme previsto no Código de Defesa do Consumidor (Lei nº 8.078/90).\u003c/p\u003e\n    \u003cp\u003ePara assinaturas digitais, você pode cancelar e solicitar reembolso em até 7 dias após a contratação, desde que o serviço não tenha sido utilizado.\u003c/p\u003e\n\n    \u003ch2\u003eProcesso de Reembolso\u003c/h2\u003e\n    \u003cp\u003ePara solicitar um reembolso, siga estas etapas:\u003c/p\u003e\n    \u003col\u003e\n        \u003cli\u003eEntre em contato conosco em \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e com seu número de pedido e motivo do reembolso.\u003c/li\u003e\n        \u003cli\u003eAguarde nossa resposta com instruções sobre como proceder.\u003c/li\u003e\n        \u003cli\u003eSe aplicável, devolva o item conforme instruções fornecidas.\u003c/li\u003e\n        \u003cli\u003eApós recebermos e inspecionarmos o item, notificaremos você sobre a aprovação ou rejeição do reembolso.\u003c/li\u003e\n    \u003c/ol\u003e\n    \u003cp\u003eSe aprovado, seu reembolso será processado e um crédito será aplicado automaticamente ao seu método de pagamento original em até 14 dias úteis.\u003c/p\u003e\n\n    \u003ch2\u003eItens Não Reembolsáveis\u003c/h2\u003e\n    \u003cp\u003eOs seguintes itens não são elegíveis para reembolso:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eProdutos digitais que já foram baixados ou acessados.\u003c/li\u003e\n        \u003cli\u003eAssinaturas após o período de 7 dias, se o serviço já foi utilizado.\u003c/li\u003e\n        \u003cli\u003eProdutos personalizados feitos sob encomenda.\u003c/li\u003e\n        \u003cli\u003eProdutos que por sua natureza não podem ser devolvidos (por exemplo, por razões de higiene).\u003c/li\u003e\n        \u003cli\u003eCartões-presente.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eReembolsos Parciais\u003c/h2\u003e\n    \u003cp\u003eEm certas situações, apenas reembolsos parciais são concedidos:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eItem com sinais evidentes de uso.\u003c/li\u003e\n        \u003cli\u003eItem devolvido mais de 7 dias após a entrega.\u003c/li\u003e\n        \u003cli\u003eItem não na condição original ou com peças faltando.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eReembolsos Atrasados ou Ausentes\u003c/h2\u003e\n    \u003cp\u003eSe você ainda não recebeu um reembolso:\u003c/p\u003e\n    \u003col\u003e\n        \u003cli\u003ePrimeiro verifique sua conta bancária novamente.\u003c/li\u003e\n        \u003cli\u003eEntre em contato com a empresa do seu cartão de crédito, pois pode levar algum tempo antes que seu reembolso seja oficialmente lançado.\u003c/li\u003e\n        \u003cli\u003eEntre em contato com seu banco, pois geralmente há algum tempo de processamento antes que um reembolso seja lançado.\u003c/li\u003e\n        \u003cli\u003eSe você fez tudo isso e ainda não recebeu seu reembolso, entre em contato conosco em \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e.\u003c/li\u003e\n    \u003c/ol\u003e\n\n    \u003ch2\u003eTrocas\u003c/h2\u003e\n    \u003cp\u003eSó substituímos itens se estiverem com defeito ou danificados. Se você precisar trocá-lo pelo mesmo item, envie-nos um e-mail em \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e.\u003c/p\u003e\n\n    \u003ch2\u003eContato\u003c/h2\u003e\n    \u003cp\u003eSe você tiver alguma dúvida sobre nossa Política de Devolução e Reembolso, entre em contato conosco:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eE-mail: \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e\u003c/li\u003e\n        \u003cli\u003eVisitando esta página: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eContato\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eLimitação de Responsabilidade\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, EM NENHUM CASO A EMPRESA OU SEUS FORNECEDORES SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS OU CONSEQUENTES DE QUALQUER NATUREZA (INCLUINDO, MAS NÃO LIMITADO A, DANOS POR PERDA DE LUCROS, PERDA DE DADOS OU OUTRAS INFORMAÇÕES, POR INTERRUPÇÃO DE NEGÓCIOS, POR LESÃO PESSOAL, PERDA DE PRIVACIDADE DECORRENTE DE OU DE QUALQUER FORMA RELACIONADA AO USO OU INCAPACIDADE DE USAR O SERVIÇO, SOFTWARE DE TERCEIROS E/OU HARDWARE DE TERCEIROS USADO COM O SERVIÇO, OU DE OUTRA FORMA EM CONEXÃO COM QUALQUER DISPOSIÇÃO DESTES TERMOS).\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eA responsabilidade total da Empresa sob este acordo não excederá o maior valor entre: (a) o valor total pago por Você pelo Serviço durante os 12 meses anteriores à reclamação; ou (b) R$ 100,00 (cem reais).\u003c/p\u003e\n\n    \u003ch2\u003eIndenização\u003c/h2\u003e\n    \u003cp\u003eVocê concorda em indenizar, defender e isentar a Empresa, suas afiliadas, diretores, funcionários, agentes, licenciadores e fornecedores de e contra todas e quaisquer reclamações, responsabilidades, danos, julgamentos, custos e despesas (incluindo honorários advocatícios razoáveis) decorrentes de ou relacionados a: (a) seu uso do Serviço; (b) qualquer violação destes Termos por você; (c) qualquer conteúdo que você postar ou transmitir através do Serviço; (d) sua violação de qualquer lei, regra ou regulamento aplicável; ou (e) sua violação dos direitos de terceiros.\u003c/p\u003e\n\n    \u003ch2\u003eIsenção de Garantias\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eO SERVIÇO É FORNECIDO \"COMO ESTÁ\" E \"CONFORME DISPONÍVEL\", SEM GARANTIAS DE QUALQUER TIPO, EXPRESSAS OU IMPLÍCITAS, INCLUINDO, MAS NÃO LIMITADO A, GARANTIAS IMPLÍCITAS DE COMERCIALIZAÇÃO, ADEQUAÇÃO A UM DETERMINADO FIM E NÃO VIOLAÇÃO.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eA EMPRESA NÃO GARANTE QUE: (A) O SERVIÇO ATENDERÁ SUAS NECESSIDADES; (B) O SERVIÇO SERÁ ININTERRUPTO, OPORTUNO, SEGURO OU LIVRE DE ERROS; (C) OS RESULTADOS OBTIDOS DO USO DO SERVIÇO SERÃO PRECISOS OU CONFIÁVEIS; OU (D) A QUALIDADE DE QUAISQUER PRODUTOS, SERVIÇOS, INFORMAÇÕES OU OUTROS MATERIAIS OBTIDOS ATRAVÉS DO SERVIÇO ATENDERÃO SUAS EXPECTATIVAS.\u003c/p\u003e\n\n    \u003ch2\u003eAceitação pelo Uso\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eAO ACESSAR, BAIXAR, INSTALAR OU USAR O SERVIÇO, VOCÊ RECONHECE QUE LEU, ENTENDEU E CONCORDA EM FICAR VINCULADO A ESTES TERMOS. SE VOCÊ NÃO CONCORDAR COM ESTES TERMOS, NÃO ACESSE OU USE O SERVIÇO.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eO uso continuado do Serviço após quaisquer modificações nestes Termos constitui sua aceitação de tais modificações.\u003c/p\u003e\n\n    \u003ch2\u003eLei Aplicável e Jurisdição\u003c/h2\u003e\n    \u003cp\u003eEstes Termos serão regidos e interpretados de acordo com as leis da República Federativa do Brasil, sem considerar suas disposições sobre conflitos de leis.\u003c/p\u003e\n    \u003cp\u003eQualquer disputa decorrente ou relacionada a estes Termos será submetida à jurisdição exclusiva dos tribunais da cidade de São Paulo, Estado de São Paulo, Brasil, e as partes renunciam irrevogavelmente a qualquer objeção à jurisdição de tais tribunais.\u003c/p\u003e\n\n    \u003ch2\u003eAssunção de Risco\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eVOCÊ ASSUME TOTAL RESPONSABILIDADE E RISCO PELO USO DO SERVIÇO. O SERVIÇO É FORNECIDO \"COMO ESTÁ\" SEM GARANTIAS DE QUALQUER TIPO. A EMPRESA NÃO SERÁ RESPONSÁVEL POR QUAISQUER DANOS RESULTANTES DO USO OU DA INCAPACIDADE DE USO DO SERVIÇO, INCLUINDO DANOS CAUSADOS POR MALWARE, VÍRUS OU QUALQUER PROGRAMA DE COMPUTADOR INCORRETO OU INCOMPLETO.\u003c/strong\u003e\u003c/p\u003e\n\n    \u003ch2\u003eConformidade com a LGPD\u003c/h2\u003e\n    \u003cp\u003eEste documento está em conformidade com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018) e suas atualizações, incluindo:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eResolução CD/ANPD nº 19/2024\u003c/strong\u003e: Regras para transferência internacional de dados pessoais\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eNotificação de Incidentes\u003c/strong\u003e: Prazo de 3 (três) dias úteis para comunicação à ANPD e aos titulares afetados\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDireitos dos Titulares\u003c/strong\u003e: Acesso, correção, portabilidade, eliminação e revogação de consentimento\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEncarregado de Proteção de Dados (DPO)\u003c/strong\u003e: Informações de contato disponíveis publicamente\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eAs penalidades podem chegar a 2% da receita anual no Brasil ou até R$ 50 milhões por violação.\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e","label":"Return and Refund","languageLabel":"Português"},{"documentType":"privacy_policy","language":"PT","content":"\u003ch2\u003ePolítica de Privacidade\u003c/h2\u003e\n\n\u003cp\u003eÚltima atualização: 20 de janeiro de 2026\u003c/p\u003e\n\n\u003cp\u003eEsta Política de Privacidade descreve nossas políticas e procedimentos sobre a coleta, uso e divulgação de suas informações quando você usa o Serviço e informa sobre seus direitos de privacidade e como a lei protege você.\u003c/p\u003e\n\n\u003cp\u003eUsamos seus dados pessoais para fornecer e melhorar o Serviço. Ao usar o Serviço, você concorda com a coleta e uso de informações de acordo com esta Política de Privacidade.\u003c/p\u003e\n\n\u003ch2\u003eInterpretação e Definições\u003c/h2\u003e\n\n\u003ch3\u003eInterpretação\u003c/h3\u003e\n\n\u003cp\u003eAs palavras cuja letra inicial é maiúscula têm significados definidos nas seguintes condições. As seguintes definições devem ter o mesmo significado, independentemente de aparecerem no singular ou no plural.\u003c/p\u003e\n\n\u003ch3\u003eDefinições\u003c/h3\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eConta\u003c/strong\u003e significa uma conta única criada para você acessar nosso Serviço ou partes de nosso Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"a Empresa\", \"Nós\", \"Nos\" ou \"Nosso\" nesta Política de Privacidade) refere-se a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICAÇÃO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e são pequenos arquivos que são colocados em seu computador, dispositivo móvel ou qualquer outro dispositivo por um site, contendo os detalhes de seu histórico de navegação nesse site entre seus muitos usos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePaís\u003c/strong\u003e refere-se a: Brasil.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e significa qualquer dispositivo que pode acessar o Serviço, como um computador, um telefone celular ou um tablet digital.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDados Pessoais\u003c/strong\u003e são quaisquer informações que se relacionam a um indivíduo identificado ou identificável.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServiço\u003c/strong\u003e refere-se ao Aplicativo ou ao Site, ou ambos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePrestador de Serviços\u003c/strong\u003e significa qualquer pessoa física ou jurídica que processa os dados em nome da Empresa.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDados de Uso\u003c/strong\u003e refere-se aos dados coletados automaticamente, gerados pelo uso do Serviço ou pela própria infraestrutura do Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e refere-se a NETURAL, acessível a partir de \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVocê\u003c/strong\u003e significa o indivíduo acessando ou usando o Serviço, ou a empresa ou outra entidade legal em nome da qual tal indivíduo está acessando ou usando o Serviço, conforme aplicável.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eColeta e Uso de Seus Dados Pessoais\u003c/h2\u003e\n\n\u003ch3\u003eTipos de Dados Coletados\u003c/h3\u003e\n\n\u003ch4\u003eDados Pessoais\u003c/h4\u003e\n\n\u003cp\u003eAo usar nosso Serviço, podemos solicitar que você nos forneça certas informações de identificação pessoal que podem ser usadas para contatá-lo ou identificá-lo. As informações de identificação pessoal podem incluir, mas não estão limitadas a:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eEndereço de email\u003c/li\u003e\n    \u003cli\u003eNome e sobrenome\u003c/li\u003e\n    \u003cli\u003eNúmero de telefone\u003c/li\u003e\n    \u003cli\u003eEndereço, Estado, Província, CEP/Código Postal, Cidade\u003c/li\u003e\n    \u003cli\u003eDados de Uso\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch4\u003eDados de Uso\u003c/h4\u003e\n\n\u003cp\u003eOs Dados de Uso são coletados automaticamente ao usar o Serviço.\u003c/p\u003e\n\n\u003cp\u003eOs Dados de Uso podem incluir informações como o endereço de Protocolo de Internet do seu Dispositivo (por exemplo, endereço IP), tipo de navegador, versão do navegador, as páginas do nosso Serviço que você visita, a hora e data da sua visita, o tempo gasto nessas páginas, identificadores exclusivos de dispositivos e outros dados de diagnóstico.\u003c/p\u003e\n\n\u003ch3\u003eUso de Seus Dados Pessoais\u003c/h3\u003e\n\n\u003cp\u003eA Empresa pode usar Dados Pessoais para os seguintes fins:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003ePara fornecer e manter nosso Serviço\u003c/strong\u003e, incluindo monitorar o uso de nosso Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara gerenciar sua Conta:\u003c/strong\u003e para gerenciar seu registro como usuário do Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara a execução de um contrato:\u003c/strong\u003e o desenvolvimento, conformidade e execução do contrato de compra dos produtos, itens ou serviços que você adquiriu.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara entrar em contato com você:\u003c/strong\u003e Para entrar em contato com você por e-mail, chamadas telefônicas, SMS, ou outras formas equivalentes de comunicação eletrônica.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara gerenciar suas solicitações:\u003c/strong\u003e Para atender e gerenciar suas solicitações para nós.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eRetenção de Seus Dados Pessoais\u003c/h3\u003e\n\n\u003cp\u003eA Empresa reterá seus Dados Pessoais apenas pelo tempo necessário para os fins estabelecidos nesta Política de Privacidade. Reteremos e usaremos seus Dados Pessoais na medida necessária para cumprir nossas obrigações legais.\u003c/p\u003e\n\n\u003ch3\u003eTransferência de Seus Dados Pessoais\u003c/h3\u003e\n\n\u003cp\u003eSuas informações, incluindo Dados Pessoais, são processadas nos escritórios operacionais da Empresa e em quaisquer outros lugares onde as partes envolvidas no processamento estejam localizadas. Isso significa que essas informações podem ser transferidas para — e mantidas em — computadores localizados fora do seu estado, província, país ou outra jurisdição governamental onde as leis de proteção de dados podem diferir daquelas da sua jurisdição.\u003c/p\u003e\n\n\u003cp\u003eEm conformidade com a LGPD e a Resolução CD/ANPD nº 19/2024, qualquer transferência internacional de dados pessoais será realizada mediante Cláusulas Contratuais Padrão aprovadas pela ANPD ou outros mecanismos legalmente válidos.\u003c/p\u003e\n\n\u003ch3\u003eDivulgação de Seus Dados Pessoais\u003c/h3\u003e\n\n\u003cp\u003eA Empresa pode divulgar seus Dados Pessoais em boa fé, acreditando que tal ação é necessária para:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eCumprir uma obrigação legal\u003c/li\u003e\n    \u003cli\u003eProteger e defender os direitos ou propriedade da Empresa\u003c/li\u003e\n    \u003cli\u003ePrevenir ou investigar possíveis irregularidades em conexão com o Serviço\u003c/li\u003e\n    \u003cli\u003eProteger a segurança pessoal dos usuários do Serviço ou do público\u003c/li\u003e\n    \u003cli\u003eProteger contra responsabilidade legal\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eSegurança de Seus Dados Pessoais\u003c/h3\u003e\n\n\u003cp\u003eA segurança de seus Dados Pessoais é importante para nós, mas lembre-se de que nenhum método de transmissão pela Internet ou método de armazenamento eletrônico é 100% seguro. Embora nos esforcemos para usar meios comercialmente aceitáveis para proteger seus Dados Pessoais, não podemos garantir sua segurança absoluta.\u003c/p\u003e\n\n\u003ch2\u003eDireitos de Proteção de Dados (LGPD)\u003c/h2\u003e\n\n\u003cp\u003eDe acordo com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018), você tem os seguintes direitos:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eConfirmação e Acesso:\u003c/strong\u003e Confirmar a existência de tratamento e acessar seus dados pessoais.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCorreção:\u003c/strong\u003e Solicitar a correção de dados incompletos, inexatos ou desatualizados.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAnonimização, Bloqueio ou Eliminação:\u003c/strong\u003e Solicitar a anonimização, bloqueio ou eliminação de dados desnecessários, excessivos ou tratados em desconformidade.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePortabilidade:\u003c/strong\u003e Solicitar a portabilidade dos dados a outro fornecedor de serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEliminação:\u003c/strong\u003e Solicitar a eliminação dos dados pessoais tratados com o consentimento do titular.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eInformação:\u003c/strong\u003e Ser informado sobre as entidades públicas e privadas com as quais compartilhamos seus dados.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eRevogação do Consentimento:\u003c/strong\u003e Revogar o consentimento a qualquer momento.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eNotificação de Incidentes de Segurança\u003c/h3\u003e\n\n\u003cp\u003eEm conformidade com a LGPD e as atualizações de 2024, notificaremos a Autoridade Nacional de Proteção de Dados (ANPD) e os titulares afetados em até 3 (três) dias úteis a partir do conhecimento de qualquer incidente de segurança que possa acarretar risco ou dano relevante aos titulares.\u003c/p\u003e\n\n\u003ch3\u003eEncarregado de Proteção de Dados (DPO)\u003c/h3\u003e\n\n\u003cp\u003ePara exercer seus direitos ou esclarecer dúvidas sobre o tratamento de seus dados pessoais, entre em contato com nosso Encarregado de Proteção de Dados:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eE-mail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eAlterações a Esta Política de Privacidade\u003c/h2\u003e\n\n\u003cp\u003ePodemos atualizar nossa Política de Privacidade de tempos em tempos. Notificaremos você sobre quaisquer alterações publicando a nova Política de Privacidade nesta página.\u003c/p\u003e\n\n\u003cp\u003eRecomendamos que você revise esta Política de Privacidade periodicamente para quaisquer alterações.\u003c/p\u003e\n\n\u003ch2\u003eContato\u003c/h2\u003e\n\n\u003cp\u003eSe você tiver alguma dúvida sobre esta Política de Privacidade, você pode entrar em contato conosco:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eE-mail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eVisitando esta página: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eLimitação de Responsabilidade\u003c/h2\u003e\n\n\u003cp\u003e\u003cstrong\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, EM NENHUM CASO A EMPRESA OU SEUS FORNECEDORES SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS OU CONSEQUENTES DE QUALQUER NATUREZA, INCLUINDO, MAS NÃO LIMITADO A, DANOS POR PERDA DE LUCROS, PERDA DE DADOS OU OUTRAS INFORMAÇÕES, POR INTERRUPÇÃO DE NEGÓCIOS, POR LESÃO PESSOAL, PERDA DE PRIVACIDADE DECORRENTE DE OU DE QUALQUER FORMA RELACIONADA AO USO OU INCAPACIDADE DE USAR O SERVIÇO, SOFTWARE DE TERCEIROS E/OU HARDWARE DE TERCEIROS USADO COM O SERVIÇO, OU DE OUTRA FORMA EM CONEXÃO COM QUALQUER DISPOSIÇÃO DESTES TERMOS.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eA responsabilidade total da Empresa sob este acordo não excederá o maior valor entre: (a) o valor total pago por Você pelo Serviço durante os 12 meses anteriores à reclamação; ou (b) R$ 100,00 (cem reais).\u003c/p\u003e\n\n\u003ch2\u003eIndenização\u003c/h2\u003e\n\n\u003cp\u003eVocê concorda em indenizar, defender e isentar a Empresa, suas afiliadas, diretores, funcionários, agentes, licenciadores e fornecedores de e contra todas e quaisquer reclamações, responsabilidades, danos, julgamentos, custos e despesas (incluindo honorários advocatícios razoáveis) decorrentes de ou relacionados a: (a) seu uso do Serviço; (b) qualquer violação destes Termos por você; (c) qualquer conteúdo que você postar ou transmitir através do Serviço; (d) sua violação de qualquer lei, regra ou regulamento aplicável; ou (e) sua violação dos direitos de terceiros.\u003c/p\u003e\n\n\u003ch2\u003eIsenção de Garantias\u003c/h2\u003e\n\n\u003cp\u003e\u003cstrong\u003eO SERVIÇO É FORNECIDO \"COMO ESTÁ\" E \"CONFORME DISPONÍVEL\", SEM GARANTIAS DE QUALQUER TIPO, EXPRESSAS OU IMPLÍCITAS, INCLUINDO, MAS NÃO LIMITADO A, GARANTIAS IMPLÍCITAS DE COMERCIALIZAÇÃO, ADEQUAÇÃO A UM DETERMINADO FIM E NÃO VIOLAÇÃO.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eA EMPRESA NÃO GARANTE QUE: (A) O SERVIÇO ATENDERÁ SUAS NECESSIDADES; (B) O SERVIÇO SERÁ ININTERRUPTO, OPORTUNO, SEGURO OU LIVRE DE ERROS; (C) OS RESULTADOS OBTIDOS DO USO DO SERVIÇO SERÃO PRECISOS OU CONFIÁVEIS; OU (D) A QUALIDADE DE QUAISQUER PRODUTOS, SERVIÇOS, INFORMAÇÕES OU OUTROS MATERIAIS OBTIDOS ATRAVÉS DO SERVIÇO ATENDERÁ SUAS EXPECTATIVAS.\u003c/p\u003e\n\n\u003ch2\u003eAceitação pelo Uso\u003c/h2\u003e\n\n\u003cp\u003e\u003cstrong\u003eAO ACESSAR, BAIXAR, INSTALAR OU USAR O SERVIÇO, VOCÊ RECONHECE QUE LEU, ENTENDEU E CONCORDA EM FICAR VINCULADO A ESTES TERMOS. SE VOCÊ NÃO ACORDAR COM ESTES TERMOS, NÃO ACESSE OU USE O SERVIÇO.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eO uso continuado do Serviço após quaisquer modificações nestes Termos constitui sua aceitação de tais modificações.\u003c/p\u003e\n\n\u003ch2\u003eLei Aplicável e Jurisdição\u003c/h2\u003e\n\n\u003cp\u003eEstes Termos serão regidos e interpretados de acordo com as leis da República Federativa do Brasil, sem considerar suas disposições sobre conflitos de leis.\u003c/p\u003e\n\n\u003cp\u003eQualquer disputa decorrente ou relacionada a estes Termos será submetida à jurisdição exclusiva dos tribunais da cidade de São Paulo, Estado de São Paulo, Brasil, e as partes renunciam irrevogavelmente a qualquer objeção à jurisdição de tais tribunais.\u003c/p\u003e\n\n\u003ch2\u003eAssunção de Risco\u003c/h2\u003e\n\n\u003cp\u003e\u003cstrong\u003eVOCÊ ASSUME TOTAL RESPONSABILIDADE E RISCO PELO USO DO SERVIÇO. O SERVIÇO É FORNECIDO \"COMO ESTÁ\" SEM GARANTIAS DE QUALQUER TIPO. A EMPRESA NÃO SERÁ RESPONSÁVEL POR QUAISQUER DANOS RESULTANTES DO USO OU DA INCAPACIDADE DE USO DO SERVIÇO, INCLUINDO DANOS CAUSADOS POR MALWARE, VÍRUS OU QUALQUER PROGRAMA DE COMPUTADOR INCORRETO OU INCOMPLETO.\u003c/strong\u003e\u003c/p\u003e","label":"Privacy Policy","languageLabel":"Português"},{"documentType":"privacy_consent","language":"PT","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003ePolítica de Cookies e Consentimento de Privacidade\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch1\u003ePolítica de Cookies e Consentimento de Privacidade\u003c/h1\u003e\n    \u003cp\u003eÚltima atualização: 20 de janeiro de 2026\u003c/p\u003e\n    \u003cp\u003eEsta política de cookies explica o que são cookies e como os usamos. Você deve ler esta política para entender que tipo de cookies usamos ou as informações que coletamos usando cookies e como essas informações são usadas.\u003c/p\u003e\n    \u003cp\u003eOs cookies normalmente não contêm nenhuma informação que identifique pessoalmente um usuário, mas as informações pessoais que armazenamos sobre você podem estar vinculadas às informações armazenadas e obtidas nos cookies. Para obter mais informações sobre como usamos, armazenamos e mantemos seus dados pessoais seguros, consulte nossa Política de Privacidade.\u003c/p\u003e\n    \u003cp\u003eNão armazenamos informações pessoais confidenciais, como endereços de correspondência, senhas de contas, etc., nos cookies que usamos.\u003c/p\u003e\n    \n    \u003ch2\u003eInterpretação e Definições\u003c/h2\u003e\n\n    \u003ch3\u003eInterpretação\u003c/h3\u003e\n    \u003cp\u003eAs palavras cuja letra inicial é maiúscula têm significados definidos nas condições a seguir. As seguintes definições devem ter o mesmo significado, independentemente de aparecerem no singular ou no plural.\u003c/p\u003e\n\n    \u003ch3\u003eDefinições\u003c/h3\u003e\n    \u003cp\u003ePara os fins desta Política de Cookies:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"a Empresa\", \"Nós\", \"Nos\" ou \"Nossos\" nesta Política de Cookies) refere-se a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICAÇÃO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e significam pequenos arquivos que são colocados em seu computador, dispositivo móvel ou qualquer outro dispositivo por um site da Web, contendo detalhes de seu histórico de navegação nesse site entre seus vários usos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e refere-se a NETURAL, acessível em \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVocê\u003c/strong\u003e significa o indivíduo que acessa ou usa o site, ou uma empresa, ou qualquer pessoa jurídica em nome da qual tal indivíduo está acessando ou usando o site, conforme aplicável.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eO Uso dos Cookies\u003c/h2\u003e\n    \u003cp\u003eOs cookies podem ser \"Persistentes\" ou \"de Sessão\". Os cookies persistentes permanecem em seu computador pessoal ou dispositivo móvel quando você fica offline, enquanto os cookies de sessão são excluídos assim que você fecha o navegador.\u003c/p\u003e\n    \u003cp\u003eUsamos cookies de sessão e persistentes para os fins definidos abaixo:\u003c/p\u003e\n\n    \u003ch3\u003eTipos de Cookies Utilizados\u003c/h3\u003e\n\n    \u003ch4\u003eCookies Essenciais\u003c/h4\u003e\n    \u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies de sessão\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Nós\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e Esses cookies são essenciais para fornecer a você os serviços disponíveis por meio do site e permitir que você use alguns de seus recursos. Eles ajudam a autenticar usuários e prevenir o uso fraudulento de contas de usuários. Sem esses cookies, os serviços que você solicitou não podem ser fornecidos e nós apenas usamos esses cookies para fornecer esses serviços a você.\u003c/p\u003e\n\n    \u003ch4\u003eCookies de Aceitação de Política de Cookies\u003c/h4\u003e\n    \u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies persistentes\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Nós\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e Esses cookies identificam se os usuários aceitaram o uso de cookies no site.\u003c/p\u003e\n\n    \u003ch4\u003eCookies de Funcionalidade\u003c/h4\u003e\n    \u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies persistentes\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Nós\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e Esses cookies nos permitem lembrar as escolhas que você faz quando usa o site, como lembrar seus detalhes de login ou preferência de idioma. O objetivo desses cookies é fornecer a você uma experiência mais pessoal e evitar que você tenha que inserir novamente suas preferências toda vez que usar o site.\u003c/p\u003e\n\n    \u003ch4\u003eCookies de Rastreamento e Desempenho\u003c/h4\u003e\n    \u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies persistentes\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Terceiros\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e Esses cookies são usados para rastrear informações sobre o tráfego para o site e como os usuários usam o site. As informações coletadas por meio desses Cookies podem identificá-lo direta ou indiretamente como um visitante individual.\u003c/p\u003e\n\n    \u003ch4\u003eCookies de Publicidade e Segmentação\u003c/h4\u003e\n    \u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies persistentes\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Terceiros\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e Esses cookies rastreiam seus hábitos de navegação para permitir que mostremos publicidade que provavelmente será do seu interesse.\u003c/p\u003e\n\n    \u003ch2\u003eSuas Escolhas\u003c/h2\u003e\n    \u003cp\u003eSe preferir evitar o uso de cookies no site, primeiro você deve desativar o uso de cookies no seu navegador e, em seguida, excluir os cookies salvos no seu navegador associados a este site. Você pode usar esta opção para evitar o uso de cookies a qualquer momento.\u003c/p\u003e\n    \u003cp\u003eSe você não aceitar nossos cookies, poderá ter alguns inconvenientes no uso do site e alguns recursos podem não funcionar corretamente.\u003c/p\u003e\n\n    \u003ch3\u003eComo Desativar Cookies\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eChrome:\u003c/strong\u003e \u003ca href=\"https://support.google.com/accounts/answer/32050\"\u003esupport.google.com/accounts/answer/32050\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInternet Explorer:\u003c/strong\u003e \u003ca href=\"http://support.microsoft.com/kb/278835\"\u003esupport.microsoft.com/kb/278835\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eFirefox:\u003c/strong\u003e \u003ca href=\"https://support.mozilla.org/en-US/kb/delete-cookies-remove-info-websites-stored\"\u003esupport.mozilla.org/en-US/kb/delete-cookies-remove-info-websites-stored\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSafari:\u003c/strong\u003e \u003ca href=\"https://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac\"\u003esupport.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eConteúdo Incorporado\u003c/h2\u003e\n    \u003cp\u003eO Serviço pode incluir conteúdo incorporado (por exemplo, vídeos, imagens, artigos, etc.). O conteúdo incorporado de outros sites se comporta exatamente da mesma forma como se o visitante tivesse visitado o outro site.\u003c/p\u003e\n    \u003cp\u003eEsses sites podem coletar dados sobre você, usar cookies, incorporar rastreamento adicional de terceiros e monitorar sua interaç o durante os 12 meses anteriores à reclamação; ou (b) R$ 100,00 (cem reais).\u003c/p\u003e\n\n    \u003ch2\u003eIndenização\u003c/h2\u003e\n    \u003cp\u003eVocê concorda em indenizar, defender e isentar a Empresa, suas afiliadas, diretores, funcionários, agentes, licenciadores e fornecedores de e contra todas e quaisquer reclamações, responsabilidades, danos, julgamentos, custos e despesas (incluindo honorários advocatícios razoáveis) decorrentes de ou relacionados a: (a) seu uso do Serviço; (b) qualquer violação destes Termos por você; (c) qualquer conteúdo que você postar ou transmitir através do Serviço; (d) sua violação de qualquer lei, regra ou regulamento aplicável; ou (e) sua violação dos direitos de terceiros.\u003c/p\u003e\n\n    \u003ch2\u003eIsenção de Garantias\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eO SERVIÇO É FORNECIDO \"COMO ESTÁ\" E \"CONFORME DISPONÍVEL\", SEM GARANTIAS DE QUALQUER TIPO, EXPRESSAS OU IMPLÍCITAS, INCLUINDO, MAS NÃO LIMITADO A, GARANTIAS IMPLÍCITAS DE COMERCIALIZAÇÃO, ADEQUAÇÃO A UM DETERMINADO FIM E NÃO VIOLAÇÃO.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eA EMPRESA NÃO GARANTE QUE: (A) O SERVIÇO ATENDERÁ SUAS NECESSIDADES; (B) O SERVIÇO SERÁ ININTERRUPTO, OPORTUNO, SEGURO OU LIVRE DE ERROS; (C) OS RESULTADOS OBTIDOS DO USO DO SERVIÇO SERÃO PRECISOS OU CONFIÁVEIS; OU (D) A QUALIDADE DE QUAISQUER PRODUTOS, SERVIÇOS, INFORMAÇÕES OU OUTROS MATERIAIS OBTIDOS ATRAVÉS DO SERVIÇO ATENDERÁ SUAS EXPECTATIVAS.\u003c/p\u003e\n\n    \u003ch2\u003eAceitação pelo Uso\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eAO ACESSAR, BAIXAR, INSTALAR OU USAR O SERVIÇO, VOCÊ RECONHECE QUE LEU, ENTENDEU E CONCORDA EM FICAR VINCULADO A ESTES TERMOS. SE VOCÊ NÃO CONCORDAR COM ESTES TERMOS, NÃO ACESSE OU USE O SERVIÇO.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eO uso continuado do Serviço após quaisquer modificações nestes Termos constitui sua aceitação de tais modificações.\u003c/p\u003e\n\n    \u003ch2\u003eLei Aplicável e Juri     \u003cli\u003eIf applicable, return the item as per the provided instructions.\u003c/li\u003e\n    \u003cli\u003eUpon receiving and inspecting the item, we will notify you of the approval or rejection of the refund.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003cp\u003eIf approved, your refund will be processed, and a credit will automatically be applied to your original payment method within 14 business days.\u003c/p\u003e\n\n\u003ch2\u003eNon-Refundable Items\u003c/h2\u003e\n\n\u003cp\u003eThe following items are not eligible for a refund:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eDigital products that have been downloaded or accessed.\u003c/li\u003e\n    \u003cli\u003eSubscriptions after the 7-day period, if the service has been used.\u003c/li\u003e\n    \u003cli\u003eCustom-made products.\u003c/li\u003e\n    \u003cli\u003eProducts that are inherently non-returnable (e.g., for hygiene reasons).\u003c/li\u003e\n    \u003cli\u003eGift cards.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003ePartial Refunds\u003c/h2\u003e\n\n\u003cp\u003eIn certain situations, only partial refunds are granted:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eItems that show evident signs of use.\u003c/li\u003e\n    \u003cli\u003eItems returned more than 7 days after delivery.\u003c/li\u003e\n    \u003cli\u003eItems not in original condition or with missing parts.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eDelayed or Missing Refunds\u003c/h2\u003e\n\n\u003cp\u003eIf you have not yet received a refund:\u003c/p\u003e\n\n\u003col\u003e\n    \u003cli\u003eFirst, check your bank account again.\u003c/li\u003e\n    \u003cli\u003eContact your credit card company, as it may take some time before your refund is officially posted.\u003c/li\u003e\n    \u003cli\u003eContact your bank, as there is often some processing time before a refund is posted.\u003c/li\u003e\n    \u003cli\u003eIf you have done all of this and still have not received your refund, please contact us at \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003ch2\u003eExchanges\u003c/h2\u003e\n\n\u003cp\u003eWe only replace items if they are defective or damaged. If you need to exchange it for the same item, please email us at \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch2\u003eContact Us\u003c/h2\u003e\n\n\u003cp\u003eIf you have any questions about our Return and Refund Policy, please contact us:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eEmail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eVisit us at: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ethis page\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eLimitation of Liability\u003c/h2\u003e\n\n\u003cp\u003eTO THE MAXIMUM EXTENT PERMITTED BY APPLICABLE LAW, IN NO EVENT SHALL THE COMPANY OR ITS SUPPLIERS BE LIABLE FOR ANY SPECIAL, INCIDENTAL, INDIRECT, OR CONSEQUENTIAL DAMAGES WHATSOEVER (INCLUDING, BUT NOT LIMITED TO, DAMAGES FOR LOSS OF PROFITS, LOSS OF DATA OR OTHER INFORMATION, FOR BUSINESS INTERRUPTION, FOR PERSONAL INJURY, LOSS OF PRIVACY ARISING OUT OF OR IN ANY WAY RELATED TO THE USE OF OR INABILITY TO USE THE SERVICE, THIRD-PARTY SOFTWARE AND/OR THIRD-PARTY HARDWARE USED WITH THE SERVICE, OR OTHERWISE IN CONNECTION WITH ANY PROVISION OF THESE TERMS).\u003c/p\u003e\n\n\u003cp\u003eThe Company's total liability under this agreement shall not exceed the greater of: (a) the total amount paid by You for the Service during the 12 months preceding the claim; or (b) $20.00 (twenty dollars).\u003c/p\u003e\n\n\u003ch2\u003eIndemnification\u003c/h2\u003e\n\n\u003cp\u003eYou agree to indemnify, defend and hold harmless the Company, its affiliates, directors, employees, agents, licensors, and suppliers from and against all claims, liabilities, damages, judgments, costs, diction of such courts.\u003c/p\u003e\n\n\u003ch2\u003eAssumption of Risk\u003c/h2\u003e\n\n\u003cp\u003eYOU ASSUME FULL RESPONSIBILITY AND RISK FOR YOUR USE OF THE SERVICE. THE SERVICE IS PROVIDED \"AS IS\" WITHOUT WARRANTIES OF ANY KIND. THE COMPANY SHALL NOT BE LIABLE FOR ANY DAMAGES RESULTING FROM THE USE OR INABILITY TO USE THE SERVICE, INCLUDING DAMAGES CAUSED BY MALWARE, VIRUSES OR ANY INCORRECT OR INCOMPLETE COMPUTER PROGRAM.\u003c/p\u003e\n\n\u003ch2\u003eLGPD Compliance\u003c/h2\u003e\n\n\u003cp\u003eThis document complies with the Brazilian General Data Protection Law (LGPD - Law No. 13.709/2018) and its updates, including:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD Resolution CD No. 19/2024\u003c/strong\u003e: Rules for international transfer of personal data.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eIncident Notification\u003c/strong\u003e: 3 (three) business day deadline to notify ANPD and affected data subjects.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eData Subject Rights\u003c/strong\u003e: Access, correction, portability, deletion, and consent revocation.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eData Protection Officer (DPO)\u003c/strong\u003e: Contact information publicly available.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003e\u003cstrong\u003eKey LGPD 2024-2025 requirements:\u003c/strong\u003e\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eData breach notification: 3 business days to notify ANPD and affected users.\u003c/li\u003e\n    \u003cli\u003eInternational data transfers: Must use ANPD-approved Standard Contractual Clauses (Resolution CD/ANPD No. 19/2024).\u003c/li\u003e\n    \u003cli\u003eData subject rights: Access, correction, portability, deletion, consent revocation.\u003c/li\u003e\n    \u003cli\u003eDPO contact information must be publicly available.\u003c/li\u003e\n    \u003cli\u003ePenalties: Up to 2% of annual Brazil revenue or BRL 50 million per violation.\u003
