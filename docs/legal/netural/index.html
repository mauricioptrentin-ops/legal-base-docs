ce during the 12 months preceding the claim; or (b) $20.00 (twenty dollars).\u003c/p\u003e\n\n\u003ch2\u003eDisclaimer of Warranties\u003c/h2\u003e\n\n\u003cp\u003eTHE SERVICE IS PROVIDED \"AS IS\" AND \"AS AVAILABLE\" WITHOUT WARRANTIES OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING, BUT NOT LIMITED TO, IMPLIED WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NON-INFRINGEMENT.\u003c/p\u003e\n\n\u003cp\u003eTHE COMPANY DOES NOT WARRANT THAT: (A) THE SERVICE WILL MEET YOUR REQUIREMENTS; (B) THE SERVICE WILL BE UNINTERRUPTED, TIMELY, SECURE OR ERROR-FREE; (C) THE RESULTS OBTAINED FROM THE USE OF THE SERVICE WILL BE ACCURATE OR RELIABLE; OR (D) THE QUALITY OF ANY PRODUCTS, SERVICES, INFORMATION OR OTHER MATERIALS OBTAINED THROUGH THE SERVICE WILL MEET YOUR EXPECTATIONS.\u003c/p\u003e\n\n\u003ch2\u003eAcceptance by Use\u003c/h2\u003e\n\n\u003cp\u003eBY ACCESSING, DOWNLOADING, INSTALLING OR USING THE SERVICE, YOU ACKNOWLEDGE THAT YOU HAVE READ, UNDERSTOOD AND AGREE TO BE BOUND BY THESE TERMS. IF YOU DO NOT AGREE TO THESE TERMS, DO NOT ACCESS OR USE THE SERVICE.\u003c/p\u003e\n\n\u003cp\u003eContinued use of the Service after any modifications to these Terms constitutes your acceptance of such modifications.\u003c/p\u003e\n\n\u003ch2\u003eGoverning Law\u003c/h2\u003e\n\n\u003cp\u003eThese Terms shall be governed by and construed in accordance with the laws of the Federative Republic of Brazil, without regard to its conflict of law provisions.\u003c/p\u003e\n\n\u003cp\u003eAny dispute arising out of or relating to these Terms shall be submitted to the exclusive jurisdiction of the courts of the city of São Paulo, State of São Paulo, Brazil, and the parties irrevocably waive any objection to the jurisdiction of such courts.\u003c/p\u003e\n\n\u003ch2\u003eDispute Resolution\u003c/h2\u003e\n\n\u003cp\u003eIf you have any concerns or disputes regarding the Service, you agree to first try to resolve the dispute informally by contacting the Company.\u003c/p\u003e\n\n\u003ch2\u003eGeneral Provisions\u003c/h2\u003e\n\n\u003ch3\u003eWaiver\u003c/h3\u003e\n\n\u003cp\u003eThe failure of the Company to enforce any right or provision of these Terms shall not be deemed a waiver of such right.\u003c/p\u003e\n\n\u003ch3\u003eSeverability\u003c/h3\u003e\n\n\u003cp\u003eIf any provision of these Terms is found to be unenforceable or invalid, that provision will be modified and interpreted to achieve the objectives of that provision to the greatest extent possible under the applicable law, and the remaining provisions will continue in full force and effect.\u003c/p\u003e\n\n\u003ch3\u003eEntire Agreement\u003c/h3\u003e\n\n\u003cp\u003eThese Terms constitute the entire agreement between You and the Company regarding the use of the Service and supersede all prior and contemporaneous agreements.\u003c/p\u003e\n\n\u003ch2\u003eContact Us\u003c/h2\u003e\n\n\u003cp\u003eIf you have any questions about these Terms and Conditions, you can contact us:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eEmail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eVisiting this page: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eLGPD Compliance\u003c/h2\u003e\n\n\u003cp\u003eThis document complies with the Brazilian General Data Protection Law (LGPD - Law No. 13.709/2018) and its updates, including:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD Resolution CD No. 19/2024\u003c/strong\u003e: Rules for international transfer of personal data.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eIncident Notification\u003c/strong\u003e: 3 (three) business day deadline to notify ANPD and affected data subjects.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eData Subject Rights\u003c/strong\u003e: Access, correction, portability, deletion, and consent revocation.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eData Protection Officer (DPO)\u003c/strong\u003e: Contact information publicly available.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eKey LGPD 2024-2025 requirements include:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eData Breach Notification\u003c/strong\u003e: 3 business days to notify ANPD and affected users.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eInternational Data Transfers\u003c/strong\u003e: Must use ANPD-approved Standard Contractual Clauses (Resolution CD/ANPD No. 19/2024).\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eData Subject Rights\u003c/strong\u003e: Access, correction, portability, deletion, consent revocation.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDPO Contact Information\u003c/strong\u003e: Must be publicly available.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePenalties\u003c/strong\u003e: Up to 2% of annual Brazil revenue or BRL 50 million per violation.\u003c/li\u003e\n\u003c/ul\u003e","label":"Terms and Conditions","languageLabel":"English"},{"documentType":"return_refund","language":"ES","content":"\u003ch2\u003ePolítica de Devolución y Reembolso\u003c/h2\u003e\n\n\u003cp\u003eÚltima actualización: 20 de enero de 2026\u003c/p\u003e\n\n\u003cp\u003eGracias por comprar en NETURAL.\u003c/p\u003e\n\n\u003cp\u003eSi no está completamente satisfecho con su compra, estamos aquí para ayudar.\u003c/p\u003e\n\n\u003ch2\u003eInterpretación y Definiciones\u003c/h2\u003e\n\n\u003ch3\u003eDefiniciones\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e se refiere a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eBienes\u003c/strong\u003e se refiere a los artículos ofrecidos para la venta en el Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePedidos\u003c/strong\u003e significa una solicitud suya para comprar Bienes de nosotros.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServicio\u003c/strong\u003e se refiere a NETURAL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e significa el individuo que accede o utiliza el Servicio, o la empresa, u otra entidad legal en nombre de la cual tal individuo está accediendo o utilizando el Servicio.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eSu Elegibilidad para Reembolso\u003c/h2\u003e\n\n\u003cp\u003eLos siguientes ítems son elegibles para reembolso:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eBienes defectuosos o dañados en el momento de la entrega.\u003c/li\u003e\n    \u003cli\u003eBienes que no corresponden a la descripción proporcionada.\u003c/li\u003e\n    \u003cli\u003eBienes no utilizados y en su empaque original.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003ePara ser elegible para un retorno, su ítem debe estar no utilizado y en las mismas condiciones en las que lo recibió. También debe estar en el empaque original.\u003c/p\u003e\n\n\u003ch2\u003ePrazos para Solicitação\u003c/h2\u003e\n\n\u003cp\u003eTiene 7 (siete) días naturales a partir de la fecha de recepción del producto para solicitar la devolución o reembolso, conforme lo previsto en el Código de Protección al Consumidor (Ley nº 8.078/90).\u003c/p\u003e\n\n\u003cp\u003ePara suscripciones digitales, puede cancelar y solicitar reembolso hasta 7 días después de la contratación, siempre que el servicio no haya sido utilizado.\u003c/p\u003e\n\n\u003ch2\u003eProceso de Reembolso\u003c/h2\u003e\n\n\u003cp\u003ePara solicitar un reembolso, siga estos pasos:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eContáctenos a través de \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e con su número de pedido y motivo del reembolso.\u003c/li\u003e\n    \u003cli\u003eAguarde nuestra respuesta con instrucciones sobre cómo proceder.\u003c/li\u003e\n    \u003cli\u003eSi es aplicable, devuelva el artículo según las instrucciones proporcionadas.\u003c/li\u003e\n    \u003cli\u003eDespués de recibir e inspeccionar el artículo, le notificaremos sobre la aprobación o rechazo del reembolso.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eSi es aprobado, su reembolso será procesado y un crédito será aplicado automáticamente a su método de pago original en un plazo de hasta 14 días hábiles.\u003c/p\u003e\n\n\u003ch2\u003eItens Não Reembolsáveis\u003c/h2\u003e\n\n\u003cp\u003eLos siguientes ítems no son elegibles para reembolso:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eProductos digitales que ya han sido descargados o accedidos.\u003c/li\u003e\n    \u003cli\u003eSuscripciones después del período de 7 días, si el servicio ya fue utilizado.\u003c/li\u003e\n    \u003cli\u003eProductos personalizados hechos a medida.\u003c/li\u003e\n    \u003cli\u003eProductos que por su naturaleza no pueden ser devueltos (por ejemplo, por razones de higiene).\u003c/li\u003e\n    \u003cli\u003eTarjetas de regalo.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eReembolsos Parciales\u003c/h2\u003e\n\n\u003cp\u003eEn ciertas situaciones, solo se conceden reembolsos parciales:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eArtículo con evidentes signos de uso.\u003c/li\u003e\n    \u003cli\u003eArtículo devuelto más de 7 días después de la entrega.\u003c/li\u003e\n    \u003cli\u003eArtículo no en condición original o con piezas faltantes.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eReembolsos Atrasados o Ausentes\u003c/h2\u003e\n\n\u003cp\u003eSi aún no ha recibido su reembolso:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003ePrimero verifique su cuenta bancaria nuevamente.\u003c/li\u003e\n    \u003cli\u003eContáctese con la empresa de su tarjeta de crédito, ya que puede llevar tiempo antes de que su reembolso sea oficialmente procesado.\u003c/li\u003e\n    \u003cli\u003eContáctese con su banco, ya que generalmente hay algún tiempo de procesamiento antes de que un reembolso sea liberado.\u003c/li\u003e\n    \u003cli\u003eSi ha hecho todo esto y aún no ha recibido su reembolso, contáctenos a \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eTrocas\u003c/h2\u003e\n\n\u003cp\u003eSolo sustituimos ítems si están defectuosos o dañados. Si necesita cambiarlo por el mismo artículo, envíenos un correo a \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch2\u003eContacto\u003c/h2\u003e\n\n\u003cp\u003eSi tiene alguna pregunta sobre nuestra Política de Devolución y Reembolso, contáctenos:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eCorreo Electrónico:\u003c/strong\u003e \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVisite esta página:\u003c/strong\u003e \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eLimitación de Responsabilidad\u003c/h3\u003e\n\n\u003cp\u003eEN LA MEDIDA MÁXIMA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES SERÁN RESPONSABLES POR DAÑOS ESPECIALES, INCIDENTALES, INDIRECTOS O CONSECUENTES DE CUALQUIER TIPO (INCLUYENDO, PERO NO LIMITÁNDOSE A, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS U OTRA INFORMACIÓN, POR INTERRUPCIÓN DEL NEGOCIO, POR LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD SURGIDA DE O DE CUALQUIER MANERA RELACIONADA CON EL USO O LA INCAPACIDAD DE UTILIZAR EL SERVICIO, SOFTWARE DE TERCEROS Y/O HARDWARE DE TERCEROS UTILIZADOS CON EL SERVICIO, O DE OTRA MANERA EN RELACIÓN CON CUALQUIER DISPOSICIÓN DE ESTOS TÉRMINOS).\u003c/p\u003e\n\n\u003cp\u003eLa responsabilidad total de la Empresa bajo este acuerdo no excederá el mayor de: (a) el total pagado por usted por el Servicio durante los 12 meses anteriores a la reclamación; o (b) $20.00 (veinte dólares).\u003c/p\u003e\n\n\u003ch3\u003eIndemnización\u003c/h3\u003e\n\n\u003cp\u003eUsted acepta indemnizar, defender y mantener indemne a la Empresa, sus afiliados, directores, empleados, agentes, licenciantes y proveedores de y contra todas las reclamaciones, responsabilidades, daños, juicios, costos y gastos (incluidos los honorarios razonables de los abogados) que surjan o estén relacionados con: (a) su uso del Servicio; (b) cualquier incumplimiento de estos Términos por su parte; (c) cualquier contenido que publique o transmita a través del Servicio; (d) su violación de cualquier ley, regla o regulación aplicable; o (e) su violación de los derechos de cualquier tercero.\u003c/p\u003e\n\n\u003ch3\u003eRenuncia de Garantías\u003c/h3\u003e\n\n\u003cp\u003eEL SERVICIO SE PROVEE \"TAL CUAL\" Y \"SEGÚN DISPONIBILIDAD\" SIN GARANTÍAS DE NINGÚN TIPO, EXPRESAS O IMPLÍCITAS, INCLUYENDO, PERO NO LIMITÁNDOSE A, GARANTÍAS IMPLÍCITAS DE COMERCIABILIDAD, ADECUACIÓN PARA UN PROPÓSITO PARTICULAR Y NO INFRACCIÓN.\u003c/p\u003e\n\n\u003cp\u003eLA EMPRESA NO GARANTIZA QUE: (A) EL SERVICIO CUMPLIRÁ CON SUS REQUISITOS; (B) EL SERVICIO SERÁ ININTERRUMPIDO, OPORTUNO, SEGURO O SIN ERRORES; (C) LOS RESULTADOS OBTENIDOS DEL USO DEL SERVICIO SERÁN PRECISOS O CONFIABLES; O (D) LA CALIDAD DE CUALQUIER PRODUCTO, SERVICIO, INFORMACIÓN U OTROS MATERIALES OBTENIDOS A TRAVÉS DEL SERVICIO CUMPLIRÁ CON SUS EXPECTATIVAS.\u003c/p\u003e\n\n\u003ch3\u003eAceptación por Uso\u003c/h3\u003e\n\n\u003cp\u003eAL ACCEDER, DESCARGAR, INSTALAR O USAR EL SERVICIO, USTED RECONOCE QUE HA LEÍDO, ENTIENDIDO Y ACEPTA ESTAR OBLIGADO POR ESTOS TÉRMINOS. SI NO ACEPTA ESTOS TÉRMINOS, NO ACCEDA NI USE EL SERVICIO.\u003c/p\u003e\n\n\u003cp\u003eEl uso continuado del Servicio después de cualquier modificación a estos Términos constituye su aceptación de tales modificaciones.\u003c/p\u003e\n\n\u003ch3\u003eLey Aplicable y Jurisdicción\u003c/h3\u003e\n\n\u003cp\u003eEstos Términos se regirán e interpretarán de acuerdo con las leyes de la República Federativa del Brasil, sin tener en cuenta sus disposiciones sobre conflictos de leyes.\u003c/p\u003e\n\n\u003cp\u003eCualquier disputa que surja de o se relacione con estos Términos será sometida a la jurisdicción exclusiva de los tribunales de la ciudad de São Paulo, Estado de São Paulo, Brasil, y las partes renuncian irrevocablemente a cualquier objeción a la jurisdicción de tales tribunales.\u003c/p\u003e\n\n\u003ch3\u003eAsunción de Riesgo\u003c/h3\u003e\n\n\u003cp\u003eUSTED ASUME LA RESPONSABILIDAD Y RIESGO TOTAL POR SU USO DEL SERVICIO. EL SERVICIO SE PROVEE \"TAL CUAL\" SIN GARANTÍAS DE NINGÚN TIPO. LA EMPRESA NO SERÁ RESPONSABLE POR CUALQUIER DAÑO RESULTANTE DEL USO O LA INCAPACIDAD DE UTILIZAR EL SERVICIO, INCLUYENDO DAÑOS CAUSADOS POR MALWARE, VÍRUS O CUALQUIER PROGRAMA INFORMÁTICO INCORRECTO O INCOMPLETO.\u003c/p\u003e\n\n\u003ch3\u003eCumplimiento de la LGPD\u003c/h3\u003e\n\n\u003cp\u003eEste documento cumple con la Ley General de Protección de Datos de Brasil (LGPD - Ley N° 13.709/2018) y sus actualizaciones, incluyendo:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eResolución CD/ANPD N° 19/2024\u003c/strong\u003e: Reglas para la transferencia internacional de datos personales.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotificación de Incidentes\u003c/strong\u003e: Plazo de 3 (tres) días hábiles para comunicar a la ANPD y a los titulares afectados.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerechos de los Titulares\u003c/strong\u003e: Acceso, corrección, portabilidad, eliminación y revocación del consentimiento.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDelegado de Protección de Datos (DPO)\u003c/strong\u003e: Información de contacto disponible públicamente.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eLas sanciones pueden llegar hasta el 2% de los ingresos anuales de Brasil o BRL 50 millones por violación.\u003c/p\u003e","label":"Return and Refund","languageLabel":"Español"},{"documentType":"privacy_policy","language":"ES","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003ePolítica de Privacidad de NETURAL\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003ePolítica de Privacidad\u003c/h2\u003e\n    \u003cp\u003eÚltima actualización: 20 de enero de 2026\u003c/p\u003e\n    \u003cp\u003eEsta Política de Privacidad describe nuestras políticas y procedimientos sobre la recolección, uso y divulgación de su información cuando utiliza el Servicio y le informa sobre sus derechos de privacidad y cómo la ley lo protege.\u003c/p\u003e\n    \u003cp\u003eUtilizamos sus datos personales para proporcionar y mejorar el Servicio. Al usar el Servicio, usted acepta la recolección y uso de información de acuerdo con esta Política de Privacidad.\u003c/p\u003e\n\n    \u003ch2\u003eInterpretación y Definiciones\u003c/h2\u003e\n\n    \u003ch3\u003eInterpretación\u003c/h3\u003e\n    \u003cp\u003eLas palabras cuya primera letra está en mayúscula tienen significados definidos en las siguientes condiciones. Las siguientes definiciones tienen el mismo significado, ya sea que aparezcan en singular o en plural.\u003c/p\u003e\n\n    \u003ch3\u003eDefiniciones\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eCuenta:\u003c/strong\u003e significa una cuenta única creada para usted para acceder a nuestro Servicio o partes de nuestro Servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa:\u003c/strong\u003e (referida como \"la Empresa\", \"Nosotros\", \"Nuestro\" en esta Política de Privacidad) se refiere a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., con CNPJ 08.337.937/0001-69 y dirección en ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCookies:\u003c/strong\u003e son pequeños archivos que se colocan en su computadora, dispositivo móvil o cualquier otro dispositivo por un sitio web, conteniendo los detalles de su historial de navegación en ese sitio entre sus múltiples usos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePaís:\u003c/strong\u003e se refiere a: Brasil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDispositivo:\u003c/strong\u003e significa cualquier dispositivo que puede acceder al Servicio, como un ordenador, un teléfono móvil o una tablet.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDatos Personales:\u003c/strong\u003e son cualquier información que se relaciona a una persona identificada o identificable.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServicio:\u003c/strong\u003e se refiere a la Aplicación o al Sitio, o ambos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePrestador de Servicios:\u003c/strong\u003e significa cualquier persona física o jurídica que procesa los datos en nombre de la Empresa.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDatos de Uso:\u003c/strong\u003e se refiere a los datos recogidos automáticamente, generados por el uso del Servicio o por la propia infraestructura del Servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSitio:\u003c/strong\u003e se refiere a NETURAL, accesible desde \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eaquí\u003c/a\u003e.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eUsted:\u003c/strong\u003e significa el individuo que accede o utiliza el Servicio, o la empresa u otra entidad legal en nombre de la cual dicho individuo está accediendo o usando el Servicio, según corresponda.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eRecolección y Uso de Sus Datos Personales\u003c/h2\u003e\n\n    \u003ch3\u003eTipos de Datos Recogidos\u003c/h3\u003e\n\n    \u003ch4\u003eDatos Personales\u003c/h4\u003e\n    \u003cp\u003eAl usar nuestro Servicio, podemos solicitarle que nos proporcione cierta información de identificación personal que puede ser utilizada para contactarlo o identificarlo. La información de identificación personal puede incluir, pero no se limita a:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eDirección de correo electrónico\u003c/li\u003e\n        \u003cli\u003eNombre y apellidos\u003c/li\u003e\n        \u003cli\u003eNúmero de teléfono\u003c/li\u003e\n        \u003cli\u003eDirección, Estado, Provincia, Código Postal, Ciudad\u003c/li\u003e\n        \u003cli\u003eDatos de Uso\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch4\u003eDatos de Uso\u003c/h4\u003e\n    \u003cp\u003eLos Datos de Uso son recolectados automáticamente durante el uso del Servicio.\u003c/p\u003e\n    \u003cp\u003eLos Datos de Uso pueden incluir información como la dirección de Protocolo de Internet de su Dispositivo (por ejemplo, dirección IP), tipo de navegador, versión del navegador, las páginas de nuestro Servicio que usted visita, la hora y la fecha de su visita, el tiempo pasado en esas páginas, identificadores únicos de dispositivos y otros datos de diagnóstico.\u003c/p\u003e\n\n    \u003ch3\u003eUso de Sus Datos Personales\u003c/h3\u003e\n    \u003cp\u003eLa Empresa puede utilizar Datos Personales para los siguientes fines:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003ePara proporcionar y mantener nuestro Servicio:\u003c/strong\u003e incluyendo monitorear el uso de nuestro Servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara gestionar su Cuenta:\u003c/strong\u003e para gestionar su registro como usuario del Servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara la ejecución de un contrato:\u003c/strong\u003e el desarrollo, cumplimiento y ejecución del contrato de compra de productos, artículos o servicios que usted adquiera.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara contactarlo:\u003c/strong\u003e Para comunicarnos con usted por correo electrónico, llamadas telefónicas, mensajes de texto u otras formas de comunicación electrónica equivalente.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara gestionar sus solicitudes:\u003c/strong\u003e Para atender y gestionar sus solicitudes hacia nosotros.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003eRetención de Sus Datos Personales\u003c/h3\u003e\n    \u003cp\u003eLa Empresa retendrá sus Datos Personales únicamente durante el tiempo necesario para los propósitos establecidos en esta Política de Privacidad. Reteremos y utilizaremos sus Datos Personales en la medida necesaria para cumplir con nuestras obligaciones legales.\u003c/p\u003e\n\n    \u003ch3\u003eTransferencia de Sus Datos Personales\u003c/h3\u003e\n    \u003cp\u003eSu información, incluyendo Datos Personales, se procesa en las oficinas operativas de la Empresa y en cualquier otro lugar donde las partes involucradas en el procesamiento estén localizadas. Esto significa que esta información puede ser transferida a — y mantenida en — ordenadores ubicados fuera de su estado, provincia, país o jurisdicción gubernamental donde las leyes de protección de datos pueden diferir de las de su jurisdicción.\u003c/p\u003e\n    \u003cp\u003eConforme a la LGPD y la Resolución CD/ANPD No. 19/2024, cualquier transferencia internacional de datos personales se llevará a cabo mediante Cláusulas Contractuales Estándar aprobadas por la ANPD u otros mecanismos legalmente válidos.\u003c/p\u003e\n\n    \u003ch3\u003eDivulgación de Sus Datos Personales\u003c/h3\u003e\n    \u003cp\u003eLa Empresa podrá divulgar sus Datos Personales en la creencia de que dicha acción es necesaria para:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003ePara cumplir con una obligación legal;\u003c/li\u003e\n        \u003cli\u003ePara proteger y defender los derechos o la propiedad de la Empresa;\u003c/li\u003e\n        \u003cli\u003ePara prevenir o investigar posibles irregularidades en conexión con el Servicio;\u003c/li\u003e\n        \u003cli\u003ePara proteger la seguridad personal de los usuarios del Servicio o del público;\u003c/li\u003e\n        \u003cli\u003ePara protegerse contra responsabilidad legal.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003eSeguridad de Sus Datos Personales\u003c/h3\u003e\n    \u003cp\u003eLa seguridad de sus Datos Personales es importante para nosotros, pero recuerde que ningún método de transmisión a través de Internet o método de almacenamiento electrónico es 100% seguro. Aunque nos esforzamos por utilizar medios comercialmente aceptables para proteger sus Datos Personales, no podemos garantizar su seguridad absoluta.\u003c/p\u003e\n\n    \u003ch2\u003eDerechos de Protección de Datos (LGPD)\u003c/h2\u003e\n    \u003cp\u003eDe acuerdo con la Ley General de Protección de Datos (LGPD - Ley N° 13.709/2018), usted tiene los siguientes derechos:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eConfirmación y Acceso:\u003c/strong\u003e Confirmar la existencia de tratamiento y acceder a sus datos personales.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCorrección:\u003c/strong\u003e Solicitar la corrección de datos incompletos, inexactos o desactualizados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAnonimización, Bloqueo o Eliminación:\u003c/strong\u003e Solicitar la anonimización, bloqueo o eliminación de datos innecesarios, excesivos o tratados en desconformidad.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePortabilidad:\u003c/strong\u003e Solicitar la portabilidad de los datos a otro proveedor de servicios.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEliminación:\u003c/strong\u003e Solicitar la eliminación de los datos personales tratados con el consentimiento del titular.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInformación:\u003c/strong\u003e Ser informado sobre las entidades públicas y privadas con las cuales compartimos sus datos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRevocación del Consentimiento:\u003c/strong\u003e Revocar el consentimiento en cualquier momento.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003eNotificación de Incidentes de Seguridad\u003c/h3\u003e\n    \u003cp\u003eEn conformidad con la LGPD y las actualizaciones de 2024, notificaremos a la Autoridad Nacional de Protección de Datos (ANPD) y a los titulares afectados dentro de un plazo de 3 (tres) días hábiles a partir del conocimiento de cualquier incidente de seguridad que pueda acarrear riesgo o daño relevante a los titulares.\u003c/p\u003e\n\n    \u003ch3\u003eDelegado de Protección de Datos (DPO)\u003c/h3\u003e\n    \u003cp\u003ePara ejercer sus derechos o aclarar dudas sobre el tratamiento de sus datos personales, contáctenos a través de nuestro Delegado de Protección de Datos:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eEmail:\u003c/strong\u003e \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eAlteraciones a Esta Política de Privacidad\u003c/h2\u003e\n    \u003cp\u003ePodeemos actualizar nuestra Política de Privacidad de vez en cuando. Notificaremos a usted sobre cualquier cambio publicando la nueva Política de Privacidad en esta página.\u003c/p\u003e\n    \u003cp\u003eRecomendamos que revise esta Política de Privacidad periódicamente para cualquier cambio.\u003c/p\u003e\n\n    \u003ch2\u003eContacto\u003c/h2\u003e\n    \u003cp\u003eSi tiene alguna pregunta sobre esta Política de Privacidad, puede ponerse en contacto con nosotros a través de:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eEmail:\u003c/strong\u003e \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVisitar esta página:\u003c/strong\u003e \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eContacto\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eAceptación por Uso\u003c/h2\u003e\n    \u003cp\u003eAL ACCEDER, DESCARGAR, INSTALAR O UTILIZAR EL SERVICIO, USTED RECONOCE QUE HA LEÍDO, ENTENDIDO Y ACEPTA ESTAR SUJETO A ESTOS TÉRMINOS. SI NO ACEPTA ESTOS TÉRMINOS, NO ACCEDA O UTILICE EL SERVICIO.\u003c/p\u003e\n    \u003cp\u003eEl uso continuado del Servicio después de cualquier modificación a estos Términos constituye su aceptación de tales modificaciones.\u003c/p\u003e\n\n    \u003ch2\u003eLimitaciones de Responsabilidad\u003c/h2\u003e\n    \u003cp\u003eA LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES SERÁN RESPONSABLES POR NINGÚN DAÑO ESPECIAL, INCIDENTAL, INDIRECTO O CONSECUENTE DE CUALQUIER TIPO (INCLUYENDO, PERO NO LIMITÁNDOSE A, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS U OTRA INFORMACIÓN, INTERRUPCIÓN DEL NEGOCIO, LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD QUE SURJA DE O DE CUALQUIER MANERA RELACIONADA CON EL USO O LA INCAPACIDAD DE UTILIZAR EL SERVICIO, SOFTWARE DE TERCEROS Y/O HARDWARE DE TERCEROS UTILIZADOS CON EL SERVICIO, O DE OTRA MANERA EN RELACIÓN CON CUALQUIER PROVISIÓN DE ESTOS TÉRMINOS).\u003c/p\u003e\n    \u003cp\u003eLa responsabilidad total de la Empresa bajo este acuerdo no excederá la mayor de: (a) la cantidad total pagada por usted durante los 12 meses anteriores a la reclamación; o (b) $20.00 (veinte dólares).\u003c/p\u003e\n\n    \u003ch2\u003eIndemnización\u003c/h2\u003e\n    \u003cp\u003eUsted acepta indemnizar, defender y mantener indemne a la Empresa, sus afiliados, directores, empleados, agentes, licenciantes y proveedores de y contra todas las reclamaciones, responsabilidades, daños, juicios, costos y gastos (incluyendo honorarios razonables de abogados) que surjan de o estén relacionados con: (a) su uso del Servicio; (b) cualquier incumplimiento de estos Términos por su parte; (c) cualquier contenido que usted publique o transmita a través del Servicio; (d) su violación de cualquier ley, regla o regulación aplicable; o (e) su violación de los derechos de cualquier tercero.\u003c/p\u003e\n\n    \u003ch2\u003eAsunción de Riesgo\u003c/h2\u003e\n    \u003cp\u003eUSTED ASUME LA RESPONSABILIDAD Y EL RIESGO PLENO POR SU USO DEL SERVICIO. EL SERVICIO SE PROPORCIONA \"TAL CUAL\" SIN GARANTÍAS DE NINGÚN TIPO. LA EMPRESA NO SERÁ RESPONSABLE POR NINGÚN DAÑO RESULTANTE DEL USO O LA INCAPACIDAD DE UTILIZAR EL SERVICIO, INCLUYENDO DAÑOS CAUSADOS POR MALWARE, VIRUS O CUALQUIER PROGRAMA INFORMÁTICO INCORRECTO O INCOMPLETO.\u003c/p\u003e\n\n    \u003ch2\u003eLey Gobernante y Jurisdicción\u003c/h2\u003e\n    \u003cp\u003eEstos Términos se regirán e interpretarán de acuerdo con las leyes de la República Federativa de Brasil, sin tener en cuenta sus disposiciones sobre conflicto de leyes.\u003c/p\u003e\n    \u003cp\u003eCualquier disputa que surja de o esté relacionada con estos Términos será sometida a la jurisdicción exclusiva de los tribunales de la ciudad de São Paulo, Estado de São Paulo, Brasil, y las partes renuncian irrevocablemente a cualquier objeción a la jurisdicción de dichos tribunales.\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e","label":"Privacy Policy","languageLabel":"Español"},{"documentType":"privacy_consent","language":"ES","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003ePolítica de Cookies y Consentimiento de Privacidad\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003ePolítica de Cookies y Consentimiento de Privacidad\u003c/h2\u003e\n    \u003cp\u003eÚltima actualización: 20 de enero de 2026\u003c/p\u003e\n    \u003cp\u003eEsta política de cookies explica qué son los cookies y cómo los utilizamos. Debe leer esta política para entender qué tipo de cookies usamos o las informaciones que recopilamos usando Cookies y cómo se utilizan estas informaciones.\u003c/p\u003e\n    \u003cp\u003eLos cookies normalmente no contienen ninguna información que identifique personalmente a un usuario, pero las informaciones personales que almacenamos sobre usted pueden estar vinculadas a la información almacenada y obtenida en los cookies. Para más información sobre cómo usamos, almacenamos y mantenemos sus datos personales seguros, consulte nuestra Política de Privacidad.\u003c/p\u003e\n    \u003cp\u003eNo almacenamos información personal confidencial, como direcciones de correspondencia, contraseñas de cuentas, etc. en los cookies que usamos.\u003c/p\u003e\n\n    \u003ch2\u003eInterpretación y Definiciones\u003c/h2\u003e\n    \u003ch3\u003eInterpretación\u003c/h3\u003e\n    \u003cp\u003eLas palabras cuya letra inicial es mayúscula tienen significados definidos en las siguientes condiciones. Las siguientes definiciones deben tener el mismo significado, independientemente de aparecer en singular o plural.\u003c/p\u003e\n\n    \u003ch3\u003eDefiniciones\u003c/h3\u003e\n    \u003cp\u003ePara los fines de esta Política de Cookies:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"la Empresa\", \"Nosotros\", \"Nuestro\" o \"Nuestros\" en esta Política de Cookies) se refiere a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ubicada en ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e son pequeños archivos que son colocados en su computadora, dispositivo móvil o cualquier otro dispositivo por un sitio web, conteniendo detalles de su historial de navegación en ese sitio entre sus varios usos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSitio\u003c/strong\u003e se refiere a NETURAL, accesible en \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e se refiere al individuo que accede o usa el sitio, o una empresa, o cualquier persona jurídica en nombre de la cual tal individuo está accediendo o usando el sitio, según corresponda.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eEl Uso de los Cookies\u003c/h2\u003e\n    \u003ch3\u003eTipos de Cookies que Usamos\u003c/h3\u003e\n    \u003cp\u003eLos cookies pueden ser \"Persistentes\" o \"de Sesión\". Los cookies persistentes permanecen en su computadora personal o dispositivo móvil cuando está offline, mientras que los cookies de sesión son eliminados tan pronto como cierra el navegador.\u003c/p\u003e\n    \u003cp\u003eUsamos cookies de sesión y persistentes para los fines definidos a continuación:\u003c/p\u003e\n\n    \u003ch3\u003eCookies Esenciales\u003c/h3\u003e\n    \u003cstrong\u003eTipo:\u003c/strong\u003e Cookies de sesión\u003cbr\u003e\n    \u003cstrong\u003eAdministrado por:\u003c/strong\u003e Nosotros\u003cbr\u003e\n    \u003cstrong\u003eObjetivo:\u003c/strong\u003e Estos cookies son esenciales para proporcionarle a usted los servicios disponibles a través del sitio y permitir que usted use algunos de sus recursos. Ayudan a autenticar usuarios y prevenir el uso fraudulento de cuentas de usuarios. Sin estos cookies, los servicios que usted solicitó no pueden ser proporcionados y solo usamos estos cookies para brindarle esos servicios.\n\n    \u003ch3\u003eCookies de Funcionalidad\u003c/h3\u003e\n    \u003cstrong\u003eTipo:\u003c/strong\u003e Cookies persistentes\u003cbr\u003e\n    \u003cstrong\u003eAdministrado por:\u003c/strong\u003e Nosotros\u003cbr\u003e\n    \u003cstrong\u003eObjetivo:\u003c/strong\u003e Estos cookies nos permiten recordar las elecciones que usted hace cuando usa el sitio, como recordar sus detalles de inicio de sesión o preferencias de idioma. El objetivo de estos cookies es proporcionarle una experiencia más personal y evitar que usted tenga que ingresar nuevamente sus preferencias cada vez que usa el sitio.\n\n    \u003ch3\u003eCookies de Rastreo y Desempeño\u003c/h3\u003e\n    \u003cstrong\u003eTipo:\u003c/strong\u003e Cookies persistentes\u003cbr\u003e\n    \u003cstrong\u003eAdministrado por:\u003c/strong\u003e Terceros\u003cbr\u003e\n    \u003cstrong\u003eObjetivo:\u003c/strong\u003e Estos cookies se utilizan para rastrear información sobre el tráfico hacia el sitio y cómo los usuarios utilizan el sitio. La información recopilada a través de estos cookies puede identificarlo directa o indirectamente como un visitante individual.\n\n    \u003ch3\u003eCookies de Publicidad\u003c/h3\u003e\n    \u003cstrong\u003eTipo:\u003c/strong\u003e Cookies persistentes\u003cbr\u003e\n    \u003cstrong\u003eAdministrado por:\u003c/strong\u003e Terceros\u003cbr\u003e\n    \u003cstrong\u003eObjetivo:\u003c/strong\u003e Estos cookies rastrean sus hábitos de navegación para permitir que mostremos publicidad que probablemente sea de su interés. \n\n    \u003ch2\u003eSus Elecciones\u003c/h2\u003e\n    \u003cp\u003eSi prefiere evitar el uso de cookies en el sitio, primero debe desactivar el uso de cookies en su navegador y, a continuación, eliminar los cookies guardados en su navegador asociados a este sitio. Puede utilizar esta opción para impedir el uso de cookies en cualquier momento.\u003c/p\u003e\n    \u003cp\u003eSi usted no acepta nuestros cookies, puede tener algunos inconvenientes en el uso del sitio y algunas funciones pueden no funcionar correctamente.\u003c/p\u003e\n\n    \u003ch3\u003eCómo Desactivar Cookies\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eChrome:\u003c/strong\u003e \u003ca href=\"https://support.google.com/accounts/answer/32050\"\u003eSoporte de Chrome\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInternet Explorer:\u003c/strong\u003e \u003ca href=\"http://support.microsoft.com/kb/278835\"\u003eSoporte de Internet Explorer\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eFirefox:\u003c/strong\u003e \u003ca href=\"https://support.mozilla.org/en-US/kb/delete-cookies-remove-info-websites-stored\"\u003eSoporte de Firefox\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSafari:\u003c/strong\u003e \u003ca href=\"https://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac\"\u003eSoporte de Safari\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eContenido Incorporado\u003c/h2\u003e\n    \u003cp\u003eEl Servicio puede incluir contenido incorporado (por ejemplo, vídeos, imágenes, artículos, etc.). El contenido incorporado de otros sitios se comporta exactamente de la misma manera como si el visitante hubiera visitado el otro sitio.\u003c/p\u003e\n    \u003cp\u003eEstos sitios pueden recopilar datos sobre usted, usar cookies, incorporar seguimiento adicional de terceros y monitorear su interacción con ese contenido incorporado, incluyendo rastrear su interacción con el contenido incorporado si usted tiene una cuenta y está conectado a ese sitio.\u003c/p\u003e\n\n    \u003ch2\u003eCumplimiento de la LGPD\u003c/h2\u003e\n    \u003cp\u003eEste documento cumple con la Ley General de Protección de Datos de Brasil (LGPD - Ley N° 13.709/2018) y sus actualizaciones, incluyendo:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eResolución CD/ANPD N° 19/2024:\u003c/strong\u003e Reglas para transferencia internacional de datos personales.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eNotificación de Incidentes:\u003c/strong\u003e Plazo de 3 (tres) días hábiles para comunicar a la ANPD y a los titulares afectados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDerechos de los Titulares:\u003c/strong\u003e Acceso, corrección, portabilidad, eliminación y revocación del consentimiento.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDelegado de Protección de Datos (DPO):\u003c/strong\u003e Información de contacto disponible públicamente.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eLos titulares de datos tienen derecho a saber cómo se tratan sus datos, y tienen derecho a solicitar la eliminación de sus datos personales y a revocar su consentimiento en cualquier momento.\u003c/p\u003e\n    \u003cp\u003eEn caso de incidente de seguridad, notificaremos a la ANPD y a los titulares de los datos afectados dentro del plazo de 3 días hábiles, tal como lo exige la LGPD.\u003c/p\u003e\n\n    \u003ch2\u003eContacto\u003c/h2\u003e\n    \u003cp\u003eSi tiene alguna duda sobre esta política de cookies, puede ponerse en contacto con nosotros:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eEmail:\u003c/strong\u003e \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVisitando nuestra página de contacto:\u003c/strong\u003e \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eContactar\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n    \n    \u003ch2\u003eLimitación de Responsabilidad\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eEN LA MAYOR MEDIDA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES SERÁN RESPONSABLES POR CUALQUIER DAÑO ESPECIAL, INCIDENTAL, INDIRECTO O CONSECUENTE, INCLUYENDO, PERO NO LIMITÁNDOSE A, DAÑOS POR PÉRDIDA DE GANANCIAS, PÉRDIDA DE DATOS O OTRA INFORMACIÓN, POR INTERRUPCIÓN DE NEGOCIO, POR LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD QUE SURJA O ESTÉ EN MODO ALGUNO RELACIONADA CON EL USO O LA INCAPACIDAD DE USAR EL SERVICIO, SOFTWARE DE TERCEROS Y/O HARDWARE DE TERCEROS UTILIZADOS CON EL SERVICIO, O DE OTRA MANERA EN CONEXIÓN CON CUALQUIER PROVISIÓN DE ESTOS TÉRMINOS.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eLa responsabilidad total de la Compañía bajo este acuerdo no excederá el mayor de: (a) el monto total pagado por usted por el Servicio durante los 12 meses anteriores a la reclamación; o (b) $20.00 (veinte dólares).\u003c/p\u003e\n\n    \u003ch2\u003eIndemnización\u003c/h2\u003e\n    \u003cp\u003eUsted acepta indemnizar, defender y mantener indemne a la Compañía, sus afiliados, directores, empleados, agentes, licenciantes y proveedores de y contra todas las reclamaciones, responsabilidades, daños, juicios, costos y gastos (incluidos los honorarios razonables de abogados) que surjan o estén relacionados con: (a) su uso del Servicio; (b) cualquier incumplimiento de estos Términos por parte de usted; (c) cualquier contenido que usted publique o transmita a través del Servicio; (d) su violación de cualquier ley, regla o regulación aplicable; o (e) su violación de los derechos de cualquier tercero.\u003c/p\u003e\n    \n    \u003ch2\u003eAviso de No Garantías\u003c/h2\u003e\n    \u003cp\u003eEL SERVICIO SE PROPORCIONA \"TAL CUAL\" Y \"SEGÚN DISPONIBILIDAD\" SIN GARANTÍAS DE NINGÚN TIPO, EXPRESAS O IMPLÍCITAS, INCLUYENDO, PERO NO LIMITÁNDOSE A, GARANTÍAS IMPLÍCITAS DE COMERCIALIZACIÓN, IDONEIDAD PARA UN PROPÓSITO PARTICULAR Y NO INFRACCIÓN.\u003c/p\u003e\n    \u003cp\u003eLA EMPRESA NO GARANTIZA QUE: (A) EL SERVICIO CUMPLIRÁ CON SUS REQUISITOS; (B) EL SERVICIO SERÁ ININTERRUMPIDO, OPORTUNO, SEGURO O LIBRE DE ERRORES; (C) LOS RESULTADOS OBTENIDOS DEL USO DEL SERVICIO SERÁN EXACTOS O FIABLES; O (D) LA CALIDAD DE CUALQUIER PRODUCTO, SERVICIO, INFORMACIÓN O OTROS MATERIALES OBTENIDOS A TRAVÉS DEL SERVICIO CUMPLIRÁN CON SUS EXPECTATIVAS.\u003c/p\u003e\n\n    \u003ch2\u003eAceptación por Uso\u003c/h2\u003e\n    \u003cp\u003eAL ACCEDER, DESCARGAR, INSTALAR O UTILIZAR EL SERVICIO, USTED RECONOCE QUE HA LEÍDO, COMPRENDIDO Y ACEPTA ESTAR SUJETO A ESTOS TÉRMINOS. SI NO ACEPTA ESTOS TÉRMINOS, NO ACCEDA NI USE EL SERVICIO.\u003c/p\u003e\n    \u003cp\u003eEl uso continuo del Servicio después de cualquier modificación a estos Términos constituye su aceptación de dichas modificaciones.\u003c/p\u003e\n\n    \u003ch2\u003eLey Aplicable y Jurisdicción\u003c/h2\u003e\n    \u003cp\u003eEstos Términos se regirán e interpretarán de conformidad con las leyes de la República Federativa de Brasil, sin tener en cuenta sus disposiciones sobre conflicto de leyes.\u003c/p\u003e\n    \u003cp\u003eCualquier disputa que surja de o esté relacionada con estos Términos se someterá a la jurisdicción exclusiva de los tribunales de la ciudad de São Paulo, Estado de São Paulo, Brasil, y las partes renuncian irrevocablemente a cualquier objeción a la jurisdicción de tales tribunales.\u003c/p\u003e\n\n    \u003ch2\u003eAsunción de Riesgo\u003c/h2\u003e\n    \u003cp\u003eUSTED ASUME PLENA RESPONSABILIDAD Y RIESGO POR SU USO DEL SERVICIO. EL SERVICIO SE PROPORCIONA \"TAL CUAL\" SIN GARANTÍAS DE NINGÚN TIPO. LA EMPRESA NO SERÁ RESPONSABLE POR CUALQUIER DAÑO RESULTANTE DEL USO O LA INCAPACIDAD DE UTILIZAR EL SERVICIO, INCLUYENDO DAÑOS CAUSADOS POR MALWARE, VIRALES O CUALQUIER PROGRAMA DE COMPUTADORA INCORRECTO O INCOMPLETO.\u003c/p\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Privacy Consent (Cookies)","languageLabel":"Español"},{"documentType":"return_refund","language":"FR","content":"\u003ch2\u003ePolitique de Retour et de Remboursement\u003c/h2\u003e\n\n\u003cp\u003eDernière mise à jour : 20 janvier 2026\u003c/p\u003e\n\n\u003cp\u003eMerci d'avoir acheté chez \u003cstrong\u003eNETURAL\u003c/strong\u003e.\u003c/p\u003e\n\n\u003cp\u003eSi vous n'êtes pas entièrement satisfait de votre achat, nous sommes ici pour vous aider.\u003c/p\u003e\n\n\u003ch2\u003eInterprétation et Définitions\u003c/h2\u003e\n\n\u003ch3\u003eDéfinitions\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eEntreprise\u003c/strong\u003e désigne \u003cstrong\u003eMIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA.\u003c/strong\u003e, ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASILE.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eBons\u003c/strong\u003e désigne les éléments offerts à la vente via le Service.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCommandes\u003c/strong\u003e signifie une demande faite par vous pour acheter des Bons auprès de nous.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eService\u003c/strong\u003e désigne \u003cstrong\u003eNETURAL\u003c/strong\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVous\u003c/strong\u003e désigne la personne accédant ou utilisant le Service, ou l'entreprise, ou autre entité juridique au nom de laquelle cette personne accède ou utilise le Service.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eVotre Éligibilité pour Remboursement\u003c/h2\u003e\n\n\u003cp\u003eLes éléments suivants sont éligibles pour un remboursement :\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eProduits défectueux ou endommagés au moment de la livraison.\u003c/li\u003e\n    \u003cli\u003eProduits qui ne correspondent pas à la description fournie.\u003c/li\u003e\n    \u003cli\u003eProduits non utilisés et dans leur emballage d'origine.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003ePour être éligible à un retour, votre article doit être non utilisé et dans le même état que vous l'avez reçu. Il doit également être dans l'emballage d'origine.\u003c/p\u003e\n\n\u003ch2\u003ePrazos para Solicitação\u003c/h2\u003e\n\n\u003cp\u003eVous disposez de 7 (sept) jours civils à partir de la date de réception du produit pour demander un retour ou un remboursement, conformément aux dispositions du Code de protection des consommateurs (Loi n° 8.078/90).\u003c/p\u003e\n\n\u003cp\u003ePour les abonnements numériques, vous pouvez annuler et demander un remboursement dans les 7 jours suivant la souscription, à condition que le service n'ait pas été utilisé.\u003c/p\u003e\n\n\u003ch2\u003eProcessus de Remboursement\u003c/h2\u003e\n\n\u003cp\u003ePour demander un remboursement, suivez ces étapes :\u003c/p\u003e\n\u003col\u003e\n    \u003cli\u003eContactez-nous à \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e en indiquant votre numéro de commande et la raison de votre demande de remboursement.\u003c/li\u003e\n    \u003cli\u003eAttendez notre réponse avec des instructions sur la manière de procéder.\u003c/li\u003e\n    \u003cli\u003eSi applicable, renvoyez l'article selon les instructions fournies.\u003c/li\u003e\n    \u003cli\u003eUne fois que nous avons reçu et inspecté l'article, nous vous informerons de l'approbation ou du refus de votre remboursement.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003cp\u003eSi votre remboursement est approuvé, il sera traité et un crédit sera automatiquement appliqué à votre méthode de paiement d'origine dans un délai de 14 jours ouvrables.\u003c/p\u003e\n\n\u003ch2\u003eItems Non Remboursables\u003c/h2\u003e\n\n\u003cp\u003eLes éléments suivants ne sont pas éligibles pour un remboursement :\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eProduits numériques qui ont déjà été téléchargés ou accédés.\u003c/li\u003e\n    \u003cli\u003eAbonnements après la période de 7 jours, si le service a déjà été utilisé.\u003c/li\u003e\n    \u003cli\u003eProduits personnalisés fabriqués sur commande.\u003c/li\u003e\n    \u003cli\u003eProduits qui, par leur nature, ne peuvent pas être retournés (par exemple, pour des raisons d'hygiène).\u003c/li\u003e\n    \u003cli\u003eChèques-cadeaux.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eRemboursements Partiels\u003c/h2\u003e\n\n\u003cp\u003eDans certaines situations, seuls des remboursements partiels peuvent être accordés :\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eArticle présentant des signes évidents d'utilisation.\u003c/li\u003e\n    \u003cli\u003eArticle renvoyé plus de 7 jours après la livraison.\u003c/li\u003e\n    \u003cli\u003eArticle non dans son état d'origine ou avec des pièces manquantes.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eRemboursements Atrasés ou Absents\u003c/h2\u003e\n\n\u003cp\u003eSi vous n'avez pas encore reçu de remboursement :\u003c/p\u003e\n\u003col\u003e\n    \u003cli\u003eVérifiez d'abord à nouveau votre compte bancaire.\u003c/li\u003e\n    \u003cli\u003eContactez l'entreprise de votre carte de crédit, car il peut falloir du temps avant que votre remboursement soit officiellement publié.\u003c/li\u003e\n    \u003cli\u003eContactez votre banque, car il y a généralement un temps de traitement avant qu'un remboursement soit publié.\u003c/li\u003e\n    \u003cli\u003eSi vous avez effectué toutes ces étapes et n'avez toujours pas reçu votre remboursement, contactez-nous à \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003ch2\u003eÉchanges\u003c/h2\u003e\n\n\u003cp\u003eNous substituons uniquement les articles s'ils sont défectueux ou endommagés. Si vous devez échanger le même article, envoyez-nous un e-mail à \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e.\u003c/p\u003e\n\n\u003ch2\u003eContact\u003c/h2\u003e\n\n\u003cp\u003eSi vous avez des questions concernant notre politique de retour et de remboursement, veuillez nous contacter :\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eEmail : \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e\u003c/li\u003e\n    \u003cli\u003eVisitez cette page : \u003ca href=\"https://www.incodetech.com.br/contact.html\" target=\"_blank\"\u003eContactez-nous\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eLimitation de Responsabilité\u003c/h2\u003e\n\n\u003cp\u003eAU MAXIMUM DES LIMITES PERMISES PAR LA LOI APPLICABLE, EN AUCUN CAS, L'ENTREPRISE OU SES FOURNISSEURS NE SERONT RESPONSABLES DE DOMMAGES SPÉCIAUX, INDIRECTS, ACCESSOIRES OU CONSÉCUTIFS QUELS QU'ILS SOIENT (Y COMPRIS, SANS S'Y LIMITER, DES DOMMAGES POUR PERTE DE PROFITS, PERTE DE DONNÉES OU AUTRES INFORMATIONS, INTERUPTION D'ACTIVITÉ, BLESSURE PERSONNELLE, PERTE DE CONFIDENTIALITÉ RÉSULTANT DE OU EN LIEN AVEC L'UTILISATION OU L'INCAPACITÉ À UTILISER LE SERVICE, LOGICIEL TIERS ET/OU MATÉRIEL TIERS UTILISÉS AVEC LE SERVICE, OU AUTREMENT EN LIEN AVEC TOUTE DISPOSITION DE CES TERMES).\u003c/p\u003e\n\n\u003cp\u003eLa responsabilité totale de l'Entreprise en vertu de cet accord ne dépassera pas le plus élevé entre : (a) le montant total payé par vous pour le Service durant les 12 mois précédant la réclamation ; ou (b) 20,00 $ (vingt dollars).\u003c/p\u003e\n\n\u003ch2\u003eIndemnisation\u003c/h2\u003e\n\n\u003cp\u003eVous acceptez d'indemniser, de défendre et de dégager de toute responsabilité l'Entreprise, ses affiliés, directeurs, employés, agents, concédants de licence et fournisseurs de et contre toutes réclamations, responsabilités, dommages-intérêts, jugements, coûts et dépenses (y compris les frais d'avocat raisonnables) découlant de ou liés à : (a) votre utilisation du Service ; (b) toute violation des présentes Termes par vous ; (c) tout contenu que vous publiez ou transmettez via le Service ; (d) votre violation de toute loi, règle ou réglementation applicable ; ou (e) votre violation des droits de tout tiers.\u003c/p\u003e\n\n\u003ch2\u003eAvis de Non-Garantie\u003c/h2\u003e\n\n\u003cp\u003eLE SERVICE EST FOURNI \"TEL QUEL\" ET \"SELON DISPONIBILITÉ\" SANS GARANTIES D'AUCUNE SORTE, EXPRESSES OU IMPLICITES, Y COMPRIS, MAIS SANS S'Y LIMITER, DES GARANTIES IMPLICITES DE QUALITÉ MARCHANDE, D'ADÉQUATION À UN USAGE PARTICULIER ET DE NON-VIOLATION.\u003c/p\u003e\n\n\u003cp\u003eL'ENTREPRISE NE GARANTIT PAS QUE : (A) LE SERVICE RÉPONDRA À VOS EXIGENCES ; (B) LE SERVICE SERA ININTERROMPU, OPPORTUN, SÉCURISÉ OU SANS ERREUR ; (C) LES RÉSULTATS OBTENUS PAR L'UTILISATION DU SERVICE SERA RÉEL OU FIABLE ; OU (D) LA QUALITÉ DE QUELS QUE SOIENT LES PRODUITS, SERVICES, INFORMATIONS OU AUTRES MATÉRIAUX OBTENUS PAR LE SERVICE RÉPONDRA À VOS ATTENTES.\u003c/p\u003e\n\n\u003ch2\u003eAcceptation par l'Utilisation\u003c/h2\u003e\n\n\u003cp\u003eEN ACCÉDANT, TÉLÉCHARGEANT, INSTALLANT OU UTILISANT LE SERVICE, VOUS RECONNAISSEZ AVOIR LU, COMPRIS ET ACCEPTEZ D'ÊTRE LIÉ PAR CES TERMES. SI VOUS NE CONSENTEZ PAS À CES TERMES, NE VOUS CONNECTEZ PAS OU N'UTILISEZ PAS LE SERVICE.\u003c/p\u003e\n\n\u003cp\u003eLa poursuite de l'utilisation du Service après toute modification de ces Termes constitue votre acceptation de telles modifications.\u003c/p\u003e\n\n\u003ch2\u003eDroit Applicable et Juridiction\u003c/h2\u003e\n\n\u003cp\u003eCes Termes seront régis par et interprétés conformément aux lois de la République Fédérative du Brésil, sans tenir compte de ses dispositions relatives aux conflits de lois.\u003c/p\u003e\n\n\u003cp\u003eTout litige découlant de ou lié à ces Termes sera soumis à la juridiction exclusive des tribunaux de la ville de São Paulo, État de São Paulo, Brésil, et les parties renoncent irrévocablement à toute objection à la juridiction de ces tribunaux.\u003c/p\u003e\n\n\u003ch2\u003eAssomption de Risque\u003c/h2\u003e\n\n\u003cp\u003eVOUS ASSUMEZ L'ENTIÈRE RESPONSABILITÉ ET LE RISQUE LIÉS À VOTRE UTILISATION DU SERVICE. LE SERVICE EST FOURNI \"TEL QUEL\" SANS GARANTIES D'AUCUNE SORTE. L'ENTREPRISE NE SERA PAS RESPONSABLE DES DOMMAGES RÉSULTANT DE L'UTILISATION OU DE L'INCAPACITÉ À UTILISER LE SERVICE, Y COMPRIS LES DOMMAGES CAUSÉS PAR DES MALICIELS, DES VIRUS OU TOUT PROGRAMME INFORMATIQUE INCORRECT OU INCOMPLET.\u003c/p\u003e\n\n\u003ch2\u003eConformité LGPD\u003c/h2\u003e\n\n\u003cp\u003eCe document est conforme à la Loi Générale sur la Protection des Données du Brésil (LGPD - Loi n° 13.709/2018) et ses mises à jour, notamment :\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eRésolution CD/ANPD n° 19/2024\u003c/strong\u003e : Règles pour le transfert international de données personnelles.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotification d'Incidents\u003c/strong\u003e : Délai de 3 (trois) jours ouvrables pour notifier l'ANPD et les personnes concernées.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDroits des Personnes Concernées\u003c/strong\u003e : Accès, rectification, portabilité, suppression et révocation du consentement.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDélégué à la Protection des Données (DPO)\u003c/strong\u003e : Coordonnées publiquement disponibles.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eLes pénalités pour violation de la LGPD peuvent atteindre 2 % des revenus annuels du Brésil ou 50 millions de BRL par violation.\u003c/p\u003e","label":"Return and Refund","languageLabel":"Français"},{"documentType":"privacy_policy","language":"FR","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003ePolitique de Confidentialité\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch1\u003ePolitique de Confidentialité\u003c/h1\u003e\n    \u003cp\u003eDernière mise à jour : 20 janvier 2026\u003c/p\u003e\n    \u003cp\u003eCette Politique de Confidentialité décrit nos politiques et procédures concernant la collecte, l'utilisation et la divulgation de vos informations lorsque vous utilisez le Service et vous informe de vos droits en matière de confidentialité et de la manière dont la loi vous protège.\u003c/p\u003e\n    \u003cp\u003eNous utilisons vos données personnelles pour fournir et améliorer le Service. En utilisant le Service, vous acceptez la collecte et l'utilisation d'informations conformément à cette Politique de Confidentialité.\u003c/p\u003e\n\n    \u003ch2\u003eInterprétation et Définitions\u003c/h2\u003e\n    \u003ch3\u003eInterprétation\u003c/h3\u003e\n    \u003cp\u003eLes mots dont la première lettre est en majuscule ont des significations définies dans les conditions suivantes. Les définitions suivantes doivent avoir le même sens, qu'elles apparaissent au singulier ou au pluriel.\u003c/p\u003e\n\n    \u003ch3\u003eDéfinitions\u003c/h3\u003e\n    \u003cp\u003eAux fins de cette Politique de Confidentialité :\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eCompte\u003c/strong\u003e désigne un compte unique créé pour vous permettre d'accéder à notre Service ou à certaines parties de notre Service.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEntreprise\u003c/strong\u003e (désignée comme \"l'Entreprise\", \"Nous\", \"Nos\" ou \"Notre\" dans cette Politique de Confidentialité) fait référence à MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e désignent de petits fichiers placés sur votre ordinateur, appareil mobile ou tout autre dispositif par un site Web, contenant les détails de votre historique de navigation sur ce site lors de ses nombreuses utilisations.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePays\u003c/strong\u003e désigne : Brésil\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDispositif\u003c/strong\u003e désigne tout dispositif pouvant accéder au Service, tel qu'un ordinateur, un téléphone mobile ou une tablette numérique.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDonnées Personnelles\u003c/strong\u003e désignent toute information relative à une personne physique identifiée ou identifiable.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eService\u003c/strong\u003e désigne l'Application ou le Site, ou les deux.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eFournisseur de Services\u003c/strong\u003e désigne toute personne physique ou morale qui traite les données pour le compte de l'Entreprise.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDonnées d'Utilisation\u003c/strong\u003e désignent les données collectées automatiquement, générées par l'utilisation du Service ou par l'infrastructure même du Service.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e désigne NETURAL, accessible à partir de \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVous\u003c/strong\u003e désigne l'individu accédant ou utilisant le Service, ou la société, ou toute autre entité juridique au nom de laquelle cet individu accède ou utilise le Service, selon le cas applicable.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eCollecte et Utilisation de Vos Données Personnelles\u003c/h2\u003e\n    \u003ch3\u003eTypes de Données Collectées\u003c/h3\u003e\n    \u003ch4\u003eDonnées Personnelles\u003c/h4\u003e\n    \u003cp\u003eEn utilisant notre Service, nous pouvons vous demander de nous fournir certaines informations personnelles identifiables qui peuvent être utilisées pour vous contacter ou vous identifier. Les informations personnelles identifiables peuvent inclure, sans s'y limiter :\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eAdresse e-mail\u003c/li\u003e\n        \u003cli\u003eNom et prénom\u003c/li\u003e\n        \u003cli\u003eNuméro de téléphone\u003c/li\u003e\n        \u003cli\u003eAdresse, État, Province, Code Postal, Ville\u003c/li\u003e\n        \u003cli\u003eDonnées d'Usage\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch4\u003eDonnées d'Usage\u003c/h4\u003e\n    \u003cp\u003eLes Données d'Usage sont collectées automatiquement lors de l'utilisation du Service.\u003c/p\u003e\n    \u003cp\u003eLes Données d'Usage peuvent inclure des informations telles que l'adresse de Protocole Internet de votre Dispositif (par exemple, adresse IP), le type de navigateur, la version du navigateur, les pages de notre Service que vous visitez, l'heure et la date de votre visite, le temps passé sur ces pages, des identifiants uniques de dispositifs et d'autres données de diagnostic.\u003c/p\u003e\n\n    \u003ch3\u003eUtilisation de Vos Données Personnelles\u003c/h3\u003e\n    \u003cp\u003eL'Entreprise peut utiliser les Données Personnelles pour les finalités suivantes :\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003ePour fournir et maintenir notre Service\u003c/strong\u003e, y compris surveiller l'utilisation de notre Service.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePour gérer votre Compte\u003c/strong\u003e : pour gérer votre enregistrement en tant qu'utilisateur du Service.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePour l'exécution d'un contrat\u003c/strong\u003e : le développement, la conformité et l'exécution du contrat d'achat des produits, articles ou services que vous avez acquis.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePour entrer en contact avec vous\u003c/strong\u003e : Pour vous contacter par e-mail, appels téléphoniques, SMS ou d'autres formes équivalentes de communication électronique.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePour gérer vos demandes\u003c/strong\u003e : Pour répondre et gérer vos demandes auprès de nous.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003eRetention de Vos Données Personnelles\u003c/h3\u003e\n    \u003cp\u003eL'Entreprise ne conservera vos Données Personnelles que le temps nécessaire aux fins établies dans cette Politique de Confidentialité. Nous conserverons et utiliserons vos Données Personnelles dans la mesure nécessaire pour respecter nos obligations légales.\u003c/p\u003e\n\n    \u003ch3\u003eTransfert de Vos Données Personnelles\u003c/h3\u003e\n    \u003cp\u003eVos informations, y compris les Données Personnelles, sont traitées dans les bureaux opérationnels de l'Entreprise et dans d'autres lieux où les parties impliquées dans le traitement sont situées. Cela signifie que ces informations peuvent être transférées — et maintenues — sur des ordinateurs situés en dehors de votre État, province, pays ou autre juridiction gouvernementale où les lois sur la protection des données peuvent différer de celles de votre juridiction.\u003c/p\u003e\n    \u003cp\u003eConformément à la LGPD et à la Résolution CD/ANPD n° 19/2024, tout transfert international de données personnelles sera effectué selon les Clauses Contractuelles Standards approuvées par l'ANPD ou d'autres mécanismes légalement valables.\u003c/p\u003e\n\n    \u003ch3\u003eSécurité de Vos Données Personnelles\u003c/h3\u003e\n    \u003cp\u003eLa sécurité de vos Données Personnelles est importante pour nous, mais rappelez-vous qu'aucun mode de transmission par Internet ou méthode de stockage électronique n'est 100% sûr. Bien que nous nous efforçons d'utiliser des moyens commercialement acceptables pour protéger vos Données Personnelles, nous ne pouvons garantir leur sécurité absolue.\u003c/p\u003e\n\n    \u003ch2\u003eVos Droits sous la LGPD\u003c/h2\u003e\n    \u003cp\u003eConformément à la Loi Générale sur la Protection des Données (LGPD - Loi n° 13.709/2018), vous avez les droits suivants :\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eConfirmation et Accès\u003c/strong\u003e : Confirmer l'existence d'un traitement et accéder à vos données personnelles.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCorrection\u003c/strong\u003e : Demander la correction de données incomplètes, inexactes ou obsolètes.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAnonimisation, Blocage ou Élimination\u003c/strong\u003e : Demander l'anonymisation, le blocage ou l'élimination de données non nécessaires, excessives ou traitées en méconnaissance.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePortabilité\u003c/strong\u003e : Demander la portabilité des données à un autre fournisseur de service.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eÉlimination\u003c/strong\u003e : Demander l'élimination des données personnelles traitées avec le consentement du titulaire.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInformation\u003c/strong\u003e : Être informé des entités publiques et privées avec lesquelles nous partageons vos données.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRévocation du Consentement\u003c/strong\u003e : Révoquer le consentement à tout moment.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003eNotification d'Incidents de Sécurité\u003c/h3\u003e\n    \u003cp\u003eConformément à la LGPD et aux mises à jour de 2024, nous notifierons l'Autorité Nationale de Protection des Données (ANPD) et les titulaires affectés dans un délai de 3 (trois) jours ouvrables à partir de la connaissance de tout incident de sécurité pouvant entraîner un risque ou un dommage significatif pour les titulaires.\u003c/p\u003e\n\n    \u003ch3\u003eDélégué à la Protection des Données (DPO)\u003c/h3\u003e\n    \u003cp\u003ePour exercer vos droits ou clarifier des questions concernant le traitement de vos données personnelles, veuillez contacter notre Délégué à la Protection des Données :\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eE-mail\u003c/strong\u003e : info@incodetech.com.br\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eLiens vers d'Autres Sites\u003c/h2\u003e\n    \u003cp\u003eNotre Service peut contenir des liens vers d'autres sites qui ne sont pas exploités par nous. Si vous cliquez sur un lien d'un tiers, vous serez dirigé vers ce tiers. Nous vous conseillons fortement de consulter la Politique de Confidentialité de chaque site que vous visitez.\u003c/p\u003e\n    \u003cp\u003eNous n'avons aucun contrôle sur le contenu, les politiques de confidentialité ou les pratiques des sites ou services tiers.\u003c/p\u003e\n\n    \u003ch2\u003eModifications de cette Politique de Confidentialité\u003c/h2\u003e\n    \u003cp\u003eNous pouvons mettre à jour notre Politique de Confidentialité de temps à autre. Nous vous notifierons de toute modification en publiant la nouvelle Politique de Confidentialité sur cette page.\u003c/p\u003e\n    \u003cp\u003eNous vous conseillons de revoir régulièrement cette Politique de Confidentialité pour tout changement.\u003c/p\u003e\n\n    \u003ch2\u003eContactez-Nous\u003c/h2\u003e\n    \u003cp\u003eSi vous avez des questions concernant cette Politique de Confidentialité, vous pouvez nous contacter :\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eE-mail\u003c/strong\u003e : info@incodetech.com.br\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVisitez cette page\u003c/strong\u003e : \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eLimitation de responsabilité\u003c/h2\u003e\n    \u003cp\u003eDans toute la mesure permise par la loi applicable, EN AUCUN CAS L'ENTREPRISE OU SES FOURNISSEURS NE POURRONT ÊTRE TENUS RESPONSABLES DE TOUT DOMMAGE SPÉCIAL, ACCESSOIRE, INDIRECT OU CONSÉCUTIF QUEL QU’IL SOIT (Y COMPRIS, MAIS SANS S'Y LIMITER, DES DOMMAGES POUR PERTE DE PROFITS, PERTE DE DONNÉES OU D'AUTRES INFORMATIONS, INTERRUPTION D'ACTIVITÉS, BLESSURES PERSONNELLES, PERTE DE CONFIDENTIALITÉ DÉCOULANT DE OU DE QUELQUE MANIÈRE LIÉ À L'UTILISATION OU À L'INCAPACITÉ D'UTILISER LE SERVICE, LOGICIEL TIERS ET/OU MATÉRIEL TIERS UTILISÉ AVEC LE SERVICE, OU AUTRE DANS LE CADRE DE QUELQUES DISPOSITIONS DE CES TERMES).\u003c/p\u003e\n    \u003cp\u003eLa responsabilité totale de l'Entreprise en vertu de cet accord ne dépassera pas le plus élevé de : (a) le montant total que vous avez payé pour le Service au cours des 12 mois précédant la réclamation ; ou (b) 20,00 $ (vingt dollars).\u003c/p\u003e\n\n    \u003ch2\u003eIndemnisation\u003c/h2\u003e\n    \u003cp\u003eVous vous engagez à indemniser, défendre et dégager de toute responsabilité l'Entreprise, ses sociétés affiliées, directeurs, employés, agents, concédants et fournisseurs de toutes réclamations, responsabilités, dommages, jugements, coûts et dépenses (y compris les honoraires d'avocat raisonnables) découlant de ou liés à : (a) votre utilisation du Service ; (b) toute violation de ces Termes par vous ; (c) tout contenu que vous publiez ou transmettez via le Service ; (d) votre violation de toute loi, règle ou réglementation applicable ; ou (e) votre violation des droits d'un tiers.\u003c/p\u003e\n\n    \u003ch2\u003eAvis de Non-Garantie\u003c/h2\u003e\n    \u003cp\u003eLE SERVICE EST FOURNI \"TEL QUEL\" ET \"DISPONIBLE\" SANS GARANTIES D'AUCUNE SORTE, EXPRESSES OU IMPLICITES, Y COMPRIS, MAIS SANS S'Y LIMITER, DES GARANTIES IMPLICITES DE QUALITÉ MARCHANDE, D'ADÉQUATION À UN USAGE PARTICULIER ET DE NON-VIOLATION.\u003c/p\u003e\n    \u003cp\u003eL'ENTREPRISE NE GARANTIT PAS QUE : (A) LE SERVICE RÉPONDRA À VOS EXIGENCES ; (B) LE SERVICE SERA ININTERROMPU, OPPORTUN, SÉCURISÉ OU SANS ERREUR ; (C) LES RÉSULTATS OBTENUS DE L'UTILISATION DU SERVICE SERONT EXACTS OU FIABLES ; OU (D) LA QUALITÉ DE TOUT PRODUCTE, SERVICE, INFORMATION OU AUTRES MATÉRIAUX OBTENUS PAR LE SERVICE RÉPONDRA À VOS ATTENTES.\u003c/p\u003e\n\n    \u003ch2\u003eAcceptation par l'Usage\u003c/h2\u003e\n    \u003cp\u003eEN ACCÉDANT, TÉLÉCHARGEANT, INSTALLANT OU UTILISANT LE SERVICE, VOUS RECONNAISSEZ AVOIR LU, COMPRIS ET ACCEPTEZ D'ÊTRE LIÉ PAR CES TERMES. SI VOUS N'ACCEPTEZ PAS CES TERMES, NE CONSULTEZ PAS OU N'UTILISEZ PAS LE SERVICE.\u003c/p\u003e\n    \u003cp\u003eLa poursuite de l'utilisation du Service après toute modification de ces Termes constitue votre acceptation de ces modifications.\u003c/p\u003e\n\n    \u003ch2\u003eDroit Applicable et Juridiction\u003c/h2\u003e\n    \u003cp\u003eCes Termes seront régis et interprétés conformément aux lois de la République Fédérative du Brésil, sans égard à ses dispositions en matière de conflit de lois.\u003c/p\u003e\n    \u003cp\u003eToute dispute résultant de ou liée à ces Termes sera soumise à la compétence exclusive des tribunaux de la ville de São Paulo, État de São Paulo, Brésil, et les parties renoncent irrévocablement à toute objection à la compétence de ces tribunaux.\u003c/p\u003e\n\n    \u003ch2\u003eTransfert de Risque\u003c/h2\u003e\n    \u003cp\u003eVOUS ASSUMEZ LA PLEINE RESPONSABILITÉ ET LE RISQUE LIÉS À VOTRE UTILISATION DU SERVICE. LE SERVICE EST FOURNI \"EN L'ÉT
