ous par la Société pour une utilisation strictement conforme aux termes de ce Contrat.\u003c/p\u003e\n\n    \u003ch2\u003eLicence\u003c/h2\u003e\n    \u003ch3\u003eScope de la Licence\u003c/h3\u003e\n    \u003cp\u003eLa Société vous accorde une licence révocable, non exclusive, intransférable et limitée pour télécharger, installer et utiliser l'Application strictement conformément aux termes de ce Contrat.\u003c/p\u003e\n    \u003cp\u003eVous ne pouvez utiliser l'Application que sur un Dispositif que vous possédez ou contrôlez.\u003c/p\u003e\n    \u003cp\u003eLa licence accordée par la Société à Vous est exclusivement à des fins personnelles et non commerciales, strictement conformément aux termes de ce Contrat.\u003c/p\u003e\n\n    \u003ch3\u003eRestrictions de Licence\u003c/h3\u003e\n    \u003cp\u003eVous convenez de ne pas faire et de ne pas permettre à d'autres de :\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eLicencier, vendre, louer, prêter, céder, distribuer, transmettre, héberger, sous-traiter, divulguer ou autrement exploiter commercialement l'Application ou mettre l'Application à la disposition de tiers.\u003c/li\u003e\n        \u003cli\u003eCopier ou utiliser l'Application à des fins différentes de celles autorisées dans la section 'Licence' ci-dessus.\u003c/li\u003e\n        \u003cli\u003eModifier, faire des travaux dérivés, désassembler, déchiffrer, compiler ou procéder à une ingénierie inverse de toute partie de l'Application.\u003c/li\u003e\n        \u003cli\u003eSupprimer, altérer ou masquer tout avis de propriété (y compris tout avis de droits d'auteur ou de marque déposée) de la Société ou de ses affiliés.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eContenu\u003c/h2\u003e\n    \u003ch3\u003eRestrictions de Contenu\u003c/h3\u003e\n    \u003cp\u003eLa Société n'est pas responsable des entrées, informations ou contenus des utilisateurs de l'Application. Vous reconnaissez expressément et acceptez que Vous êtes le seul responsable du Contenu et de toutes les activités se produisant dans votre compte.\u003c/p\u003e\n    \u003cp\u003eVous ne pouvez transmettre aucun Contenu qui est illégal, offensant, troublant, menaçant, diffamatoire, obscène ou autrement inacceptable.\u003c/p\u003e\n    \u003cp\u003eLa Société se réserve le droit, mais pas l'obligation, de déterminer à sa seule discrétion si un Contenu est approprié ou non et est conforme à cet Accord, de refuser ou de retirer tout Contenu.\u003c/p\u003e\n\n    \u003ch2\u003ePropriété Intellectuelle\u003c/h2\u003e\n    \u003cp\u003eL'Application, y compris, sans limitation, tous les droits d'auteur, brevets, marques déposées, secrets commerciaux et autres droits de propriété intellectuelle sont, et resteront, la propriété unique et exclusive de la Société.\u003c/p\u003e\n    \u003cp\u003eLa Société n'est pas tenue d'indemniser ou de vous défendre contre toute réclamation de tiers découlant ou liée à l'Application.\u003c/p\u003e\n\n    \u003ch2\u003eVos Suggestions\u003c/h2\u003e\n    \u003cp\u003eToutes suggestions, commentaires, idées, améliorations ou recommandations fournies par vous à la Société concernant l'Application resteront la propriété unique et exclusive de la Société.\u003c/p\u003e\n    \u003cp\u003eLa Société sera libre d'utiliser, de copier, de modifier, de publier ou de redistribuer les suggestions à toute fin et de toute manière, sans crédit ou compensation pour vous.\u003c/p\u003e\n\n    \u003ch2\u003eModifications dans l'Application\u003c/h2\u003e\n    \u003cp\u003eLa Société se réserve le droit de modifier, suspendre ou interrompre, temporairement ou définitivement, l'Application ou tout service auquel elle est connectée, avec ou sans préavis et sans responsabilité envers Vous.\u003c/p\u003e\n\n    \u003ch3\u003eActualisations de l'Application\u003c/h3\u003e\n    \u003cp\u003eLa Société peut, de temps à autre, fournir des améliorations ou des mises à jour des fonctionnalités de l'Application, qui peuvent inclure des correctifs, des corrections de bogues, des mises à jour, des améliorations et d'autres modifications.\u003c/p\u003e\n    \u003cp\u003eVous convenez que la Société n'a aucune obligation de fournir des Actualisations ou de continuer à fournir ou activer des fonctionnalités spécifiques de l'Application pour Vous.\u003c/p\u003e\n\n    \u003ch3\u003eMaintenance et Support\u003c/h3\u003e\n    \u003cp\u003eLa Société ne fournit aucune maintenance ou support pour le téléchargement et l'utilisation de l'Application.\u003c/p\u003e\n\n    \u003ch2\u003eServices de Tiers\u003c/h2\u003e\n    \u003cp\u003eL'Application peut afficher, inclure ou rendre disponible du contenu de tiers ou fournir des liens vers des sites ou services de tiers.\u003c/p\u003e\n    \u003cp\u003eVous reconnaissez et acceptez que la Société ne sera pas responsable de tout Service de Tiers, y compris de son exactitude, de son intégralité, de sa pertinence, de sa validité, de sa conformité aux droits d'auteur, de sa légalité, de sa décence, de sa qualité ou de tout autre aspect de celui-ci.\u003c/p\u003e\n\n    \u003ch2\u003eVigence et Résiliation\u003c/h2\u003e\n    \u003cp\u003eCe Contrat demeurera en vigueur jusqu'à ce qu'il soit résilié par Vous ou par la Société.\u003c/p\u003e\n    \u003cp\u003eLa Société peut, à sa seule discrétion, à tout moment et pour toute raison ou sans raison, suspendre ou résilier ce Contrat avec ou sans préavis.\u003c/p\u003e\n    \u003cp\u003eCe Contrat sera résilié immédiatement, sans préavis de la part de la Société, si vous ne respectez pas une quelconque disposition de ce Contrat.\u003c/p\u003e\n    \u003cp\u003eAprès la résiliation de ce Contrat, Vous devez cesser toute utilisation de l'Application et supprimer toutes les copies de l'Application de votre dispositif.\u003c/p\u003e\n\n    \u003ch2\u003eIndemnisation\u003c/h2\u003e\n    \u003cp\u003eVous convenez d'indemniser et de dégager de toute responsabilité la Société ainsi que ses sociétés mères, filiales, affiliées, directeurs, employés, agents, partenaires et concédants de licence de toute réclamation ou demande, y compris les honoraires d'avocat raisonnables, résultant de ou découlant de votre : (a) utilisation de l'Application ; (b) violation de ce Contrat ou de toute loi ou règlement ; ou (c) violation de tout droit d'autrui.\u003c/p\u003e\n\n    \u003ch2\u003eSans Garanties\u003c/h2\u003e\n    \u003cp\u003eL'Application vous est fournie \"TELLE QUELLE\" et \"SELON DISPONIBILITÉ\" et avec tous les défauts et sans garantie de quelque nature que ce soit.\u003c/p\u003e\n    \u003cp\u003eDans la mesure maximale autorisée par la loi applicable, la Société, en son nom et au nom de ses affiliés et de ses concédants respectifs, renonce expressément à toutes garanties, qu'elles soient expressément énoncées, implicites, légales ou de toute autre manière, concernant l'Application, y compris toutes les garanties implicites de qualité marchande, d'adéquation à un usage particulier, de titre et de non-violation.\u003c/p\u003e\n    \n    \u003ch3\u003eCLAUSE D'AVERTISSEMENT DE GARANTIE\u003c/h3\u003e\n    \u003cp\u003eLA SOCIÉTÉ NE GARANTIT PAS QUE : (A) L'APPLICATION RÉPONDRA À VOS EXIGENCES ; (B) L'APPLICATION SERA ININTERROMPUE, À TEMPS, SÉCURISÉE OU SANS ERREUR ; (C) LES RÉSULTATS OBTENUS PAR L'UTILISATION DE L'APPLICATION SERONT EXACTS OU FIABLES ; OU (D) LA QUALITÉ DES PRODUITS, SERVICES, INFORMATIONS OU AUTRES MATÉRIAUX OBTENUS PAR L'APPLICATION RÉPONDRONT À VOS ATTENTES.\u003c/p\u003e\n\n    \u003ch2\u003eLimitation de Responsabilité\u003c/h2\u003e\n    \u003cp\u003eÀ LA MAXIMUM PERMISE PAR LA LOI APPLICABLE, EN AUCUN CAS LA SOCIÉTÉ OU SES FOURNISSEURS NE SAURAIENT ÊTRE RESPONSABLES DE QUELS QUE SOIENT DOMMAGES SPÉCIAUX, INCIDENTELS, INDIRECTS OU CONSÉCUTIFS DE QUELQUE NATURE QUE CE SOIT (INCLUANT, MAIS SANS S'Y LIMITER, DES DOMMAGES POUR PERTE DE PROFITS, PERTE DE DONNÉES OU AUTRES INFORMATIONS, ARISE EN LIEN AVEC L'UTILISATION OU L'INCAPACITÉ D'UTILISER L'APPLICATION, DES LOGICIELS TIERS ET / OU DU MATÉRIEL TIERS UTILISÉS AVEC L'APPLICATION, OU AUTREMENT LIÉS À TOUTE DISPOSITION DE CES TERMES).\u003c/p\u003e\n    \u003cp\u003eLa responsabilité totale de la Société en vertu de cet accord ne doit pas dépasser le plus élevé des montants suivants : (a) le montant total payé par Vous pour le Service au cours des 12 mois précédant la réclamation ; ou (b) 20,00 $ (vingt dollars).\u003c/p\u003e\n\n    \u003ch2\u003eConformité LGPD\u003c/h2\u003e\n    \u003cp\u003eCe document est conforme à la Loi Générale sur la Protection des Données du Brésil (LGPD - Loi n° 13.709/2018) et ses mises à jour, notamment :\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eRésolution CD/ANPD n° 19/2024\u003c/strong\u003e : Règles pour le transfert international de données personnelles.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eNotification d'Incidents\u003c/strong\u003e : Délai de 3 (trois) jours ouvrables pour notifier l'ANPD et les personnes concernées.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDroits des Personnes Concernées\u003c/strong\u003e : Accès, rectification, portabilité, suppression et révocation du consentement.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDélégué à la Protection des Données (DPO)\u003c/strong\u003e : Coordonnées publiquement disponibles.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eLois Applicables et Juridiction\u003c/h2\u003e\n    \u003cp\u003eCes termes seront régis par et interprétés conformément aux lois de la République fédérative du Brésil, sans tenir compte de ses dispositions en matière de conflit de lois.\u003c/p\u003e\n    \u003cp\u003eTout litige découlant de ou lié à ces termes sera soumis à la compétence exclusive des tribunaux de la ville de São Paulo, État de São Paulo, Brésil, et les parties renoncent irrévocablement à toute objection à la juridiction de ces tribunaux.\u003c/p\u003e\n\n    \u003ch2\u003eVos Droits de Protection des Données\u003c/h2\u003e\n    \u003cp\u003eVous avez des droits sous la LGPD, y compris, mais sans s'y limiter, le droit d'accéder, de corriger, de demander la portabilité, de supprimer des données et de révoquer votre consentement.\u003c/p\u003e\n\n    \u003ch2\u003eContact\u003c/h2\u003e\n    \u003cp\u003eSi vous avez des questions concernant ce Contrat, vous pouvez nous contacter :\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eE-mail : \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003eEn visitant cette page : \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eContact\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003eAcceptation par l'utilisation\u003c/h3\u003e\n    \u003cp\u003eEN ACCÉDANT, TÉLÉCHARGEANT, INSTALLANT OU UTILISANT L'APPLICATION, VOUS RECONNAISSEZ AVOIR LU, COMPRIS ET ACCEPTEZ D'ÊTRE LIÉ PAR CES TERMES. SI VOUS N'ACCEPTEZ PAS CES TERMES, NE VOUS ACCÉDEZ PAS OU N'UTILISEZ PAS L'APPLICATION.\u003c/p\u003e\n    \u003cp\u003eLa poursuite de l'utilisation de l'Application après toute modification de ces termes constitue votre acceptation de ces modifications.\u003c/p\u003e\n\n    \u003ch3\u003eTransfert de Risque\u003c/h3\u003e\n    \u003cp\u003eVOUS ASSUMEZ LA PLEINE RESPONSABILITÉ ET LE RISQUE DE VOTRE UTILISATION DE L'APPLICATION. L'APPLICATION EST FOURNIE \"TELLE QUELLE\" SANS GARANTIES DE QUELQUE NATURE QUE CE SOIT. LA SOCIÉTÉ NE SERA PAS RESPONSABLE DES DOMMAGES RÉSULTANT DE L'UTILISATION OU DE L'INCAPACITÉ À UTILISER L'APPLICATION, Y COMPRIS DES DOMMAGES CAUSÉS PAR DES MALWARES, VIRUS OU TOUT PROGRAMME INFORMATIQUE INCORRECT OU INCOMPLET.\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e","label":"End-User License Agreement (EULA)","languageLabel":"Français"},{"documentType":"eula","language":"DE","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003eEndbenutzer-Lizenzvereinbarung (EULA) für NETURAL\u003c/title\u003e\n\u003c/hea tzbeauftragten unter den Kontaktdaten, die auf unserer Website zur Verfügung stehen.\u003c/p\u003e\n\n\u003ch2\u003eAbonnements und Zahlungen\u003c/h2\u003e\n\n\u003ch3\u003eAbonnementzeitraum\u003c/h3\u003e\n\u003cp\u003eDer Dienst oder Teile des Dienstes sind nur mit einem kostenpflichtigen Abonnement verfügbar. Sie werden im Voraus auf wiederkehrender Basis (monatlich oder jährlich) abgerechnet, abhängig von dem von Ihnen gewählten Abonnementplan.\u003c/p\u003e\n\u003cp\u003eAm Ende jedes Zeitraums verlängert sich Ihr Abonnement automatisch unter den gleichen Bedingungen, es sei denn, Sie kündigen es oder das Unternehmen kündigt es.\u003c/p\u003e\n\n\u003ch3\u003eKündigung des Abonnements\u003c/h3\u003e\n\u003cp\u003eSie können die Verlängerung Ihres Abonnements über die Kontoeinstellungen oder durch Kontaktaufnahme mit uns stornieren. Sie erhalten keine Rückerstattung für bereits gezahlte Gebühren des aktuellen Abonnementzeitraums und können den Dienst bis zum Ende des aktuellen Zeitraums nutzen.\u003c/p\u003e\n\n\u003ch3\u003ePreisänderungen\u003c/h3\u003e\n\u003cp\u003eDas Unternehmen kann nach eigenem Ermessen die Abonnementpreise jederzeit ändern. Jede Änderung tritt am Ende des aktuellen Abonnementzeitraums in Kraft.\u003c/p\u003e\n\n\u003ch3\u003eRückerstattungen\u003c/h3\u003e\n\u003cp\u003eMit Ausnahme der gesetzlichen Anforderungen sind die gezahlten Abonnementgebühren nicht erstattungsfähig. Rückerstattungen können nach eigenem Ermessen des Unternehmens in Einzelfällen in Betracht gezogen werden.\u003c/p\u003e\n\n\u003ch3\u003eKostenlose Testversion\u003c/h3\u003e\n\u003cp\u003eDas Unternehmen kann für einen begrenzten Zeitraum eine kostenlose Testversion anbieten. Am Ende des Testzeitraums werden Ihnen automatisch Abonnementgebühren in Rechnung gestellt, es sei denn, Sie kündigen vor Ablauf des Testzeitraums.\u003c/p\u003e","label":"Terms of Use","languageLabel":"Deutsch"}]</script>
