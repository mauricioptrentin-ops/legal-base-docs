ine sensiblen persönlichen Informationen, wie zum Beispiel Adressen, Kontopasswörter usw. in den von uns verwendeten Cookies.\u003c/p\u003e\n    \n    \u003ch2\u003e1. Auslegung und Definitionen\u003c/h2\u003e\n\n    \u003ch3\u003e1.1 Auslegung\u003c/h3\u003e\n    \u003cp\u003eDie mit einem Großbuchstaben beginnenden Begriffe haben die folgenden Bedeutungen. Die folgenden Definitionen müssen dieselbe Bedeutung haben, unabhängig davon, ob sie im Singular oder Plural erscheinen.\u003c/p\u003e\n\n    \u003ch3\u003e1.2 Definitionen\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eUnternehmen\u003c/strong\u003e (in dieser Cookie-Richtlinie als \"das Unternehmen\", \"wir\", \"uns\" oder \"unser\" bezeichnet) bezieht sich auf MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e sind kleine Dateien, die von einer Website auf Ihrem Computer, mobilen Gerät oder einem anderen Gerät gespeichert werden und Informationen zu Ihrem Surfverhalten auf dieser Website zwischen Ihren verschiedenen Nutzungen enthalten.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSeite\u003c/strong\u003e bezieht sich auf NETURAL, zugänglich unter \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eunserer Kontaktseite\u003c/a\u003e.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSie\u003c/strong\u003e bedeutet die Person, die auf die Seite zugreift oder diese verwendet, oder eine Gesellschaft oder juristische Person, für die die betreffende Person auf die Seite zugreift oder sie verwendet, sofern zutreffend.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e2. Nutzung von Cookies\u003c/h2\u003e\n    \u003cp\u003eWir verwenden Cookies, um das Benutzererlebnis auf unserer Seite zu verbessern. Cookies können \"persistente\" oder \"Sitzungs\"-Cookies sein. Persistente Cookies verbleiben auf Ihrem Computer oder mobilen Gerät, auch wenn Sie offline sind, während Sitzungs-Cookies gelöscht werden, sobald Sie Ihren Browser schließen.\u003c/p\u003e\n    \n    \u003ch3\u003e2.1 Arten von Cookies, die wir verwenden\u003c/h3\u003e\n    \u003cp\u003eWir verwenden sowohl Sitzungs- als auch permanente Cookies, um die nachstehend definierten Zwecke zu erfüllen.\u003c/p\u003e\n\n    \u003ch3\u003e3. Cookies-Essentials\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eTyp:\u003c/strong\u003e Sitzungs-Cookies\u003cbr\u003e\n    \u003cstrong\u003eVerwaltet von:\u003c/strong\u003e uns\u003cbr\u003e\n    \u003cstrong\u003eZweck:\u003c/strong\u003e Diese Cookies sind unerlässlich, um Ihnen die über die Website verfügbaren Dienste bereitzustellen und Ihnen die Nutzung einiger Funktionen zu ermöglichen. Sie helfen bei der Authentifizierung von Benutzern und verhindern den missbräuchlichen Gebrauch von Benutzerkonten. Ohne diese Cookies können die von Ihnen angeforderten Dienste nicht bereitgestellt werden, und wir verwenden diese Cookies ausschließlich, um Ihnen diese Dienste bereitzustellen.\u003c/p\u003e\n\n    \u003ch3\u003e4. Cookies für die Funktionalität\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eTyp:\u003c/strong\u003e Permanente Cookies\u003cbr\u003e\n    \u003cstrong\u003eVerwaltet von:\u003c/strong\u003e uns\u003cbr\u003e\n    \u003cstrong\u003eZweck:\u003c/strong\u003e Diese Cookies ermöglichen uns, uns an die Entscheidungen zu erinnern, die Sie bei der Nutzung der Seite treffen, beispielsweise Ihre Anmeldeinformationen oder Ihre Sprachpräferenz. Diese Cookies sollen Ihnen ein persönlicheres Erlebnis bieten und verhindern, dass Sie Ihre Präferenzen bei jedem Besuch der Seite erneut eingeben müssen.\u003c/p\u003e\n\n    \u003ch3\u003e5. Cookies zur Nachverfolgung und Leistung\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eTyp:\u003c/strong\u003e Permanente Cookies\u003cbr\u003e\n    \u003cstrong\u003eVerwaltet von:\u003c/strong\u003e Dritten\u003cbr\u003e\n    \u003cstrong\u003eZweck:\u003c/strong\u003e Diese Cookies werden verwendet, um Informationen über den Verkehr auf der Seite und darüber, wie die Benutzer die Seite verwenden, zu verfolgen. Die durch diese Cookies gesammelten Informationen können Sie direkt oder indirekt als individuellen Besucher identifizieren.\u003c/p\u003e\n\n    \u003ch3\u003e6. Cookies für Werbung\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eTyp:\u003c/strong\u003e Permanente Cookies\u003cbr\u003e\n    \u003cstrong\u003eVerwaltet von:\u003c/strong\u003e Dritten\u003cbr\u003e\n    \u003cstrong\u003eZweck:\u003c/strong\u003e Diese Cookies verfolgen Ihr Surfverhalten, um Ihnen Werbung zu zeigen, die wahrscheinlich von Interesse für Sie ist.\u003c/p\u003e\n\n    \u003ch2\u003e7. Ihre Wahl bezüglich Cookies\u003c/h2\u003e\n    \u003cp\u003eWenn Sie die Verwendung von Cookies auf der Seite vermeiden möchten, müssen Sie zunächst die Verwendung von Cookies in Ihrem Browser deaktivieren und dann die in Ihrem Browser gespeicherten Cookies, die mit dieser Seite verbunden sind, löschen. Sie können diese Option jederzeit nutzen, um die Verwendung von Cookies zu verhindern.\u003c/p\u003e\n    \u003cp\u003eWenn Sie unsere Cookies nicht akzeptieren, kann es sein, dass Sie auf einige Unannehmlichkeiten bei der Nutzung der Seite stoßen und einige Funktionen möglicherweise nicht richtig funktionieren.\u003c/p\u003e\n\n    \u003ch3\u003e7.1 So deaktivieren Sie Cookies\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eChrome:\u003c/strong\u003e \u003ca href=\"https://support.google.com/accounts/answer/32050\"\u003eUnterstützung für Chrome\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInternet Explorer:\u003c/strong\u003e \u003ca href=\"http://support.microsoft.com/kb/278835\"\u003eUnterstützung für Internet Explorer\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eFirefox:\u003c/strong\u003e \u003ca href=\"https://support.mozilla.org/en-US/kb/delete-cookies-remove-info-websites-stored\"\u003eUnterstützung für Firefox\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSafari:\u003c/strong\u003e \u003ca href=\"https://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac\"\u003eUnterstützung für Safari\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e8. Eingebettete Inhalte von anderen Websites\u003c/h2\u003e\n    \u003cp\u003eDer Dienst kann eingebettete Inhalte beinhalten (z. B. Videos, Bilder, Artikel usw.). Eingebettete Inhalte von anderen Websites verhalten sich genau so, als hätte der Besucher die andere Website besucht.\u003c/p\u003e\n    \u003cp\u003eDiese Websites können Daten über Sie sammeln, Cookies verwenden, zusätzliche Tracking-Informationen von Dritten einbetten und Ihre Interaktion mit diesem eingebetteten Inhalt überwachen, einschließlich der Verfolgung Ihrer Interaktion mit dem eingebetteten Inhalt, wenn Sie ein Konto haben und bei dieser Website angemeldet sind.\u003c/p\u003e\n\n    \u003ch2\u003e9. LGPD-Konformität\u003c/h2\u003e\n    \u003cp\u003eDieses Dokument entspricht dem brasilianischen Allgemeinen Datenschutzgesetz (LGPD - Gesetz Nr. 13.709/2018) und seinen Aktualisierungen, einschließlich:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eANPD-Beschluss CD Nr. 19/2024:\u003c/strong\u003e Regeln für die internationale Übertragung personenbezogener Daten.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVorfallmeldung:\u003c/strong\u003e Frist von 3 (drei) Werktagen zur Benachrichtigung der ANPD und der betroffenen Personen.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRechte der Betroffenen:\u003c/strong\u003e Zugang, Berichtigung, Übertragbarkeit, Löschung und Widerruf der Einwilligung.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDatenschutzbeauftragter (DPO):\u003c/strong\u003e Kontaktinformationen sind öffentlich verfügbar.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eWir verpflichten uns, die erforderlichen Maßnahmen zu ergreifen, um sicherzustellen, dass Ihre Datenschutzrechte gewahrt bleiben und dass alle Verfahren zur Datenverarbeitung den Anforderungen des LGPD entsprechen. Bei Verstößen können Geldstrafen in Höhe von bis zu 2 % des jährlichen Umsatzes in Brasilien oder BRL 50 Millionen pro Verstoß verhängt werden.\u003c/p\u003e\n\n    \u003ch2\u003e10. Kontakt\u003c/h2\u003e\n    \u003cp\u003eWenn Sie Fragen zu dieser Cookie-Richtlinie haben, können Sie uns kontaktieren:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eE-Mail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003eBesuchen Sie unsere Kontaktseite: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eKontaktseite\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eHaftungsausschluss\u003c/h2\u003e\n    \u003cp\u003eDIESE DIENSTLEISTUNG WIRD \"WIE BESEHEN\" UND \"WIE VERFÜGBAR\" BEREITGESTELLT, OHNE IRGENDEINE GARANTIEN, AUSDRÜCKLICH ODER IMPLIZIERT, EINSCHLIESSLICH, ABER NICHT BESCHRÄNKT AUF, IMPLIZIERTE GARANTIEN DER MARKTFÄHIGKEIT, EIGNUNG FÜR EINEN BESTIMMTEN ZWECK UND NICHTVERLETZUNG.\u003c/p\u003e\n\n    \u003ch2\u003eHaftungsbeschränkung\u003c/h2\u003e\n    \u003cp\u003eIM MAXIMALEN AUSMAẞ, DAS DAS ANWENDBARE RECHT ERLAUBT, IST DAS UNTERNEHMEN NICHT HAFTBAR FÜR SPEZIELLE, NEBEN- ODER FOLGESCHÄDEN IRGENDWELCHER ART (EINSCHLIESSLICH, ABER NICHT BEGRENZT AUF, SCHÄDEN FÜR VERLORENEN GEWINN, DATEN- ODER ANDERE INFORMATIONEN, FÜR UNTERBRECHUNGEN DES GESCHÄFTS, FÜR PERSONENSCHÄDEN, VERLUST DER PRIVATSPHÄRE, DIE AUS DER NUTZUNG ODER DER UNMÖGLICHKEIT DER NUTZUNG DES DIENSTES ENTSTEHEN, DRITTPARTY-SOFTWARE UND/ODER DRITTPARTY-HARDWARE, DIE MIT DEM DIENST VERWENDET WIRD, ODER ANDERWEITIG IM ZUSAMMENHANG MIT IRGENDEINER BESTIMMUNG DIESER BEDINGUNGEN).\u003c/p\u003e\n    \u003cp\u003eDie Gesamthaftung des Unternehmens aus diesem Vertrag darf den höheren Betrag nicht überschreiten: (a) den Gesamtbetrag, den Sie für den Dienst in den 12 Monaten vor dem Anspruch bezahlt haben; oder (b) $20.00 (zwanzig Dollar).\u003c/p\u003e\n\n    \u003ch2\u003eEntschädigung\u003c/h2\u003e\n    \u003cp\u003eSie stimmen zu, das Unternehmen und seine Tochtergesellschaften, Direktoren, Mitarbeiter, Vertreter, Lizenzgeber und Lieferanten von allen Ansprüchen, Haftungen, Schäden, Urteilen, Kosten und Ausgaben (einschließlich angemessener Anwaltsgebühren) freizustellen, zu verteidigen und schadlos zu halten, die sich aus oder im Zusammenhang mit: (a) Ihrer Nutzung des Dienstes; (b) einem Verstoß Ihrerseits gegen diese Bedingungen; (c) Inhalten, die Sie über den Dienst veröffentlichen oder übertragen; (d) Ihrem Verstoß gegen geltendes Recht, Vorschriften oder Bestimmungen; oder (e) Ihrem Verstoß gegen die Rechte Dritter ergeben.\u003c/p\u003e\n\n    \u003ch2\u003eAkzeptanz durch Nutzung\u003c/h2\u003e\n    \u003cp\u003eINDEM SIE AUF DEN DIENST ZUGREIFEN, DIESEN HERUNTERLADEN, INSTALLIEREN ODER NUTZEN, BESTÄTIGEN SIE, DASS SIE DIESE BEDINGUNGEN GELESEN, VERSTANDEN UND DAMIT EINVERSTANDEN SIND, BINDUNG DARAN ZU SEIN. WENN SIE MIT DIESEN BEDINGUNGEN NICHT EINVERSTANDEN SIND, GREIFEN SIE NICHT AUF DEN DIENST ZU ODER NUTZEN SIE DIESEN NICHT.\u003c/p\u003e\n    \u003cp\u003eDie fortgesetzte Nutzung des Dienstes nach Änderungen dieser Bedingungen stellt Ihre Zustimmung zu solchen Änderungen dar.\u003c/p\u003e\n\n    \u003ch2\u003eRechtswahl und Gerichtsstand\u003c/h2\u003e\n    \u003cp\u003eDiese Bedingungen unterliegen den Gesetzen der Föderativen Republik Brasilien, ohne Berücksichtigung dessen Kollisionsnormen.\u003c/p\u003e\n    \u003cp\u003eAlle Streitigkeiten, die sich aus oder im Zusammenhang mit diesen Bedingungen ergeben, unterliegen der ausschließlichen Zuständigkeit der Gerichte der Stadt São Paulo, Bundesstaat São Paulo, Brasilien, und die Parteien verzicht ür Sie erstellt wurde, um auf unseren Dienst oder Teile unseres Dienstes zuzugreifen.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUnternehmen\u003c/strong\u003e (bezogen als \"das Unternehmen\", \"wir\", \"uns\" oder \"unser\" in dieser Datenschutzerklärung) bezieht sich auf MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICAÇÃO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASILIEN.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e sind kleine Dateien, die auf Ihrem Computer, Mobilgerät oder einem anderen Gerät von einer Website abgelegt werden und Details Ihres Browserverlaufs auf dieser Website zwischen verschiedenen Einsätzen enthalten.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLand\u003c/strong\u003e bezieht sich auf: Brasilien\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGerät\u003c/strong\u003e bedeutet jedes Gerät, das auf den Dienst zugreifen kann, wie Computer, Mobiltelefone oder Tablets.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePersonenbezogene Daten\u003c/strong\u003e sind sämtliche Informationen, die sich auf eine identifizierte oder identifizierbare Person beziehen.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDienst\u003c/strong\u003e bezieht sich auf die Anwendung NETURAL oder die zugehörige Website.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDienstanbieter\u003c/strong\u003e bedeutet jede natürliche oder juristische Person, die Daten im Auftrag des Unternehmens verarbeitet.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNutzungsdaten\u003c/strong\u003e bezeichnet die automatisch gesammelten Daten, die durch die Nutzung des Dienstes oder die eigene Infrastruktur des Dienstes erzeugt werden.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWebsite\u003c/strong\u003e bezieht sich auf NETURAL, erreichbar unter \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ediesem Link\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSie\u003c/strong\u003e bedeutet die Person, die auf den Dienst zugreift oder diesen nutzt, oder das Unternehmen oder eine andere juristische Person, im Namen derer eine solche Person auf den Dienst zugreift oder diesen verwendet, wie zutreffend.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eErhebung und Nutzung Ihrer personenbezogenen Daten\u003c/h2\u003e\n\n\u003ch3\u003eArten der gesammelten Daten\u003c/h3\u003e\n\n\u003ch4\u003epersonenbezogene Daten\u003c/h4\u003e\n\n\u003cp\u003eWenn Sie unseren Dienst nutzen, können wir Sie bitten, uns bestimmte personenbezogene Informationen bereitzustellen, die zur Kontaktaufnahme oder Identifizierung verwendet werden können. Zu den personenbezogenen Informationen gehören, sind aber nicht beschränkt auf:\u003c/p\u003e\n\n\u003cul\u003e\n\u003cli\u003eE-Mail-Adresse\u003c/li\u003e\n\u003cli\u003eName und Nachname\u003c/li\u003e\n\u003cli\u003eTelefonnummer\u003c/li\u003e\n\u003cli\u003eAdresse, Bundesland, Provinz, Postleitzahl, Stadt\u003c/li\u003e\n\u003cli\u003eNutzungsdaten\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch4\u003eNutzungsdaten\u003c/h4\u003e\n\n\u003cp\u003eDie Nutzungsdaten werden automatisch beim Nutzen des Dienstes gesammelt.\u003c/p\u003e\n\n\u003cp\u003eDie Nutzungsdaten können Informationen umfassen wie die IP-Adresse Ihres Geräts (z. B. IP-Adresse), den Browsertyp, die Browserversion, die Seiten unseres Dienstes, die Sie besuchen, das Datum und die Uhrzeit Ihres Besuchs, die Zeit, die Sie auf diesen Seiten verbringen, eindeutige Gerätekennungen und andere Diagnosedaten.\u003c/p\u003e\n\n\u003ch3\u003eVerwendung Ihrer personenbezogenen Daten\u003c/h3\u003e\n\n\u003cp\u003eDas Unternehmen kann personenbezogene Daten für die folgenden Zwecke verwenden:\u003c/p\u003e\n\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eZur Bereitstellung und Wartung unseres Dienstes,\u003c/strong\u003e einschließlich der Überwachung der Nutzung unseres Dienstes.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eZur Ve 3c/h3\u003e\n\n\u003cp\u003eIn Übereinstimmung mit der LGPD und den Aktualisierungen von 2024 werden wir die Nationale Datenschutzbehörde (ANPD) und die betroffenen betroffenen Personen innerhalb von 3 (drei) Werktagen nach dem Bekanntwerden eines Sicherheitsvorfalls, der Risiken oder relevante Schäden für die Betroffenen mit sich bringen könnte, benachrichtigen.\u003c/p\u003e\n\n\u003ch3\u003eDatenschutzbeauftragter (DPO)\u003c/h3\u003e\n\n\u003cp\u003eUm Ihre Rechte auszuüben oder Fragen zur Verarbeitung Ihrer personenbezogenen Daten zu klären, können Sie sich an unseren Datenschutzbeauftragten wenden:\u003c/p\u003e\n\n\u003cul\u003e\n\u003cli\u003eE-Mail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eÄnderungen an dieser Datenschutzerklärung\u003c/h2\u003e\n\n\u003cp\u003eWir können unsere Datenschutzerklärung von Zeit zu Zeit aktualisieren. Wir werden Sie über Änderungen informieren, indem wir die neue Datenschutzerklärung auf dieser Seite veröffentlichen.\u003c/p\u003e\n\n\u003cp\u003eWir empfehlen Ihnen, diese Datenschutzerklärung regelmäßig auf Änderungen zu überprüfen.\u003c/p\u003e\n\n\u003ch2\u003eKontaktaufnahme\u003c/h2\u003e\n\n\u003cp\u003eWenn Sie Fragen zu dieser Datenschutzerklärung haben, können Sie uns kontaktieren:\u003c/p\u003e\n\n\u003cul\u003e\n\u003cli\u003eE-Mail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eIndem Sie diese Seite besuchen: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eKontaktseite\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eHaftungsausschluss\u003c/h2\u003e\n\n\u003cp\u003e\u003cstrong\u003eDIE DIENSTLEISTUNGEN WERDEN \"WIE BESEHEN\" UND \"WIE VERFÜGBAR\" OHNE IHIRGENDWELCHE GARANTIEN, OB AUSDRÜCKLICH ODER STILLSCHWEIGEND, ANGEBOTEN, EINSCHLIESSLICH, ABER NICHT BEGRENZT AUF, STILLSCHWEIGENDE GARANTIEN DER MARKTFÄHIGKEIT, EIGNUNG FÜR EINEN BESTIMMTEN ZWECK UND NICHTVERLETZUNG.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eDas Unternehmen garantiert nicht, dass: (a) der Dienst Ihre Anforderungen erfüllen wird; (b) der Dienst ununterbrochen, zeitgerecht, sicher oder fehlerfrei sein wird; (c) die Ergebnisse, die aus der Nutzung des Dienstes ergeben, korrekt oder zuverlässig sein werden; oder (d) die Qualität von Produkten, Dienstleistungen, Informationen oder anderen Materialien, die über den Dienst bezogen werden, Ihre Erwartungen erfüllen wird.\u003c/p\u003e\n\n\u003ch2\u003eHaftungsbeschränkung\u003c/h2\u003e\n\n\u003cp\u003e\u003cstrong\u003eIM MAXIMAL MÖGLICHEN LÄRM, DER VON DEM ANWENDBAREN RECHT ERMÖGLICHT WIRD, IST DAS UNTERNEHMEN FÜR KEINE SPEZIELLEN, ZUFÄLLIGEN, INDIREKTEN ODER FOLGESCHÄDEN HAFTBAR (DAS EINSCHLIEßLICH, ABER NICHT BEGRENZT AUF, SCHÄDEN FÜR VERLUST VON GEWINNEN, DATEN ODER ANDEREN INFORMATIONEN, FÜR UNTERBRECHUNGEN IM GESCHÄFT, FÜR PERSONENSCHÄDEN, VERLUST VON PRIVATSPHÄRE, DIE AUS DER NUTZUNG ODER DER UNMÖGLICHKEIT DER NUTZUNG DES DIENSTES, DRITTER SOFTWARE UND/ODER DRITTER HARDWARE, DIE MIT DEM DIENST VERWENDET WIRD, ODER BEZUGS AUF IRGENDEINE BESTIMMUNG DIESER BEDINGUNGEN ENTSTEHEN.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eDie Gesamthaftung des Unternehmens im Rahmen dieses Vertrages übersteigt nicht den größeren Betrag von: (a) dem Gesamtbetrag, den Sie für den Dienst während der 12 Monate vor erheblichem Anspruch gezahlt haben; oder (b) 20,00 $ (zwanzig Dollar).\u003c/p\u003e\n\n\u003ch2\u003eSchadloshaltung\u003c/h2\u003e\n\n\u003cp\u003eSie stimmen zu, das Unternehmen, seine verbundenen Unternehmen, Direktoren, Mitarbeiter, Vertreter, Lizenzgeber und Lieferanten von und gegen alle Ansprüche, Haftungen, Schäden, Urteile, Kosten und Ausgaben (einschließlich angemessener Anwaltsgebühren), die sich aus oder im Zusammenhang mit ergeben: (a) Ihrer Nutzung des Dienstes; (b) einer Verletzung dieser Bedingungen durch Sie; (c) einem Inhalt, den Sie über den Dienst posten oder übertragen; (d) Ihrer Verletzung eines anwendbaren Gesetzes, einer Vorschrift oder einer Regel und (e) Ihrer Verletzung von Rechten Dritter.\u003c/p\u003e\n\n\u003ch2\u003eAkzeptanz durch Benutzung\u003c/h2\u003e\n\n\u003cp\u003eDurch den Zugriff auf, das Herunterladen, Installieren oder Verwenden des Dienstes erkennen Sie an, dass Sie diese Bedingungen gelesen, verstanden und damit einverstanden sind, an diese gebunden zu sein. Wenn Sie diesen Bedingungen nicht zustimmen, greifen Sie bitte nicht auf den Dienst zu oder nutzen Sie diesen nicht.\u003c/p\u003e\n\n\u003cp\u003eDie fortgesetzte Nutzung des Dienstes nach Änderungen dieser Bedingungen stellt Ihre Zustimmung zu diesen Änderungen dar.\u003c/p\u003e\n\n\u003ch2\u003eGeltendes Recht und Gerichtsstand\u003c/h2\u003e\n\n\u003cp\u003eDiese Bedingungen unterliegen dem Recht der Föderativen Republik Brasilien und sind gemäß diesem auszulegen, ohne Rücksicht auf dessen Kollisionsnormen.\u003c/p\u003e\n\n\u003cp\u003eAlle Streitigkeiten, die sich aus oder im Zusammenhang mit diesen Bedingungen ergeben, unterliegen der ausschließlichen Zuständigkeit der Gerichte der Stadt São Paulo, Bundesstaat São Paulo, Brasilien, und die Parteien erklären unwiderruflich, auf jede Einrede gegen die Zuständigkeit solcher Gerichte zu verzichten.\u003c/p\u003e\n\n\u003ch2\u003eRisikotransfer\u003c/h2\u003e\n\n\u003cp\u003eSie übernehmen sämtliche Verantwortung und Risiko für die Nutzung des Dienstes. DER DIENST WIRD \"WIE BESEHEN\" OHNE GARANTIEN IRGENDEINER ART bereitgestellt. DAS UNTERNEHMEN HAFTET NICHT FÜR SCHÄDEN, DIE AUS DER NUTZUNG ODER UNMÖGLICHKEIT DER NUTZUNG DES DIENSTES ENTSTEHEN, EINSCHLIEßLICH SCHÄDEN, DIE DURCH MALWARE, VIREN ODER EINEN FEHLERHAFTEN ODER UNVOLLSTÄNDIGEN COMPUTERPROGRAMM VERURSACHT WERDEN.\u003c/p\u003e\n\n\u003ch2\u003eAbonnements und Zahlungen\u003c/h2\u003e\n\n\u003ch3\u003eAbonnementsperiode\u003c/h3\u003e\n\n\u003cp\u003eDer Dienst oder einige Teile des Dienstes sind nur mit einem kostenpflichtigen Abonnement erhältlich. Sie werden im Voraus auf wiederkehrender Basis (monatlich oder jährlich) abgerechnet, abhängig von dem von Ihnen gewählten Abonnementplan.\u003c/p\u003e\n\n\u003cp\u003eAm Ende jeder Periode erneuert sich Ihr Abonnement automatisch unter den gleichen Bedingungen, es sei denn, Sie kündigen es oder das Unternehmen kündigt es.\u003c/p\u003e\n\n\u003ch3\u003eKündigung des Abonnements\u003c/h3\u003e\n\n\u003cp\u003eSie können die Verlängerung Ihres Abonnements über die Kontoeinstellungen oder durch Kontaktaufnahme mit uns kündigen. Sie erhalten keine Rückerstattung für bereits gezahlte Gebühren für den aktuellen Abrechnungszeitraum und können bis zum Ende des aktuellen Zeitraums auf den Dienst zugreifen.\u003c/p\u003e\n\n\u003ch3\u003ePreisanpassungen\u003c/h3\u003e\n\n\u003cp\u003eDas Unternehmen kann nach eigenem Ermessen die Abonnementpreise jederzeit ändern. Jede Änderung tritt am Ende des aktuellen Abrechnungszeitraums in Kraft.\u003c/p\u003e\n\n\u003ch3\u003eRückerstattungen\u003c/h3\u003e\n\n\u003cp\u003eSofern gesetzlich nicht anders vorgeschrieben, sind kostenpflichtige Abonnementgebühren nicht rückerstattbar. Rückerstattungen können nach eigenem Ermessen des Unternehmens in Einzelfällen berücksichtigt werden.\u003c/p\u003e\n\n\u003ch3\u003eKostenlose Testversion\u003c/h3\u003e\n\n\u003cp\u003eDas Unternehmen kann eine kostenlose Testversion für einen begrenzten Zeitraum anbieten. Am Ende der Testphase werden Ihnen automatisch Abonnementgebühren in Rechnung gestellt, es sei denn, Sie kündigen vor Ablauf der Testphase.\u003c/p\u003e","label":"Privacy Policy","languageLabel":"Deutsch"},{"documentType":"return_refund","language":"DE","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003eRückgabe- und Rückerstattungsrichtlinie\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003ch2\u003eRückgabe- und Rückerstattungsrichtlinie\u003c/h2\u003e\n\u003cp\u003eLetzte Aktualisierung: 20. Januar 2026\u003c/p\u003e\n\n\u003cp\u003eVielen Dank für Ihren Kauf bei NETURAL.\u003c/p\u003e\n\n\u003cp\u003eFalls Sie mit Ihrem Kauf nicht vollends zufrieden sind, sind wir hier, um Ihnen zu helfen.\u003c/p\u003e\n\n\u003ch2\u003eAuslegung und Definitionen\u003c/h2\u003e\n\n\u003ch3\u003eDefinitionen\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eUnternehmen:\u003c/strong\u003e Bezieht sich auf MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eWare:\u003c/strong\u003e Bezieht sich auf Artikel, die zum Verkauf über den Dienst angeboten werden.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eBestellungen:\u003c/strong\u003e Bezieht sich auf Ihre Anfrage, Waren von uns zu kaufen.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDienst:\u003c/strong\u003e Bezieht sich auf NETURAL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSie:\u003c/strong\u003e Bezieht sich auf die Person, die auf den Dienst zugreift oder ihn nutzt, oder das Unternehmen oder eine andere rechtliche Einheit, in deren Namen eine solche Person auf den Dienst zugreift oder ihn nutzt.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eIhre Berechtigung zur Rückerstattung\u003c/h2\u003e\n\n\u003cp\u003eDie folgenden Artikel sind für eine Rückerstattung berechtigt:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eDefekte oder beschädigte Waren zum Zeitpunkt der Lieferung.\u003c/li\u003e\n    \u003cli\u003eWaren, die nicht mit der bereitgestellten Beschreibung übereinstimmen.\u003c/li\u003e\n    \u003cli\u003eUnbenutzte Waren in ihrer Originalverpackung.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eUm für eine Rückgabe berechtigt zu sein, muss Ihr Artikel unbenutzt und in dem Zustand sein, in dem Sie ihn erhalten haben. Er muss außerdem in der Originalverpackung sein.\u003c/p\u003e\n\n\u003ch2\u003eFristen für Anfragen\u003c/h2\u003e\n\n\u003cp\u003eSie haben 7 (sieben) Kalendertage ab dem Datum des Erhalts des Produkts Zeit, um die Rückgabe oder Rückerstattung zu beantragen, gemäß dem Verbraucherschutzgesetz (Ley Nº 8.078/90).\u003c/p\u003e\n\n\u003cp\u003eFür digitale Abonnements können Sie die Stornierung und Rückerstattung innerhalb von 7 Tagen nach dem Abschluss beantragen, vorausgesetzt, die Dienstleistung wurde nicht genutzt.\u003c/p\u003e\n\n\u003ch2\u003eRückerstattungsprozess\u003c/h2\u003e\n\n\u003cp\u003eUm eine Rückerstattung zu beantragen, befolgen Sie bitte diese Schritte:\u003c/p\u003e\n\u003col\u003e\n    \u003cli\u003eKontaktieren Sie uns unter \u003cstrong\u003e\u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/strong\u003e mit Ihrer Bestellnummer und Grund für die Rückerstattung.\u003c/li\u003e\n    \u003cli\u003eWarten Sie auf unsere Antwort mit Anweisungen, wie Sie weiter verfahren sollen.\u003c/li\u003e\n    \u003cli\u003eFalls zutreffend, senden Sie den Artikel gemäß den bereitgestellten Anweisungen zurück.\u003c/li\u003e\n    \u003cli\u003eNachdem wir den Artikel erhalten und inspiziert haben, werden wir Sie über die Genehmigung oder Ablehnung der Rückerstattung informieren.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003cp\u003eWenn genehmigt, wird Ihre Rückerstattung bearbeitet und ein Guthaben wird innerhalb von 14 Werktagen automatisch auf die ursprüngliche Zahlungsmethode angewendet.\u003c/p\u003e\n\n\u003ch2\u003eNicht rückerstattbare Artikel\u003c/h2\u003e\n\n\u003cp\u003eDie folgenden Artikel sind nicht für eine Rückerstattung berechtigt:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eDigitale Produkte, die bereits heruntergeladen oder aufgerufen wurden.\u003c/li\u003e\n    \u003cli\u003eAbonnements, die nach dem 7-tägigen Zeitraum gekündigt wurden, wenn der Dienst bereits genutzt wurde.\u003c/li\u003e\n    \u003cli\u003ePersonalisierte Artikel, die auf Bestellung gefertigt wurden.\u003c/li\u003e\n    \u003cli\u003eArtikel, die aufgrund ihrer Beschaffenheit nicht zurückgegeben werden können (z.B. aus hygienischen Gründen).\u003c/li\u003e\n    \u003cli\u003eGeschenkkarten.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eTeilweise Rückerstattungen\u003c/h2\u003e\n\n\u003cp\u003eIn bestimmten Fällen werden nur teilweise Rückerstattungen gewährt:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eArtikel mit offensichtlichen Gebrauchsspuren.\u003c/li\u003e\n    \u003cli\u003eArtikel, die mehr als 7 Tage nach der Lieferung zurückgegeben werden.\u003c/li\u003e\n    \u003cli\u003eArtikel, die sich nicht in ihrem ursprünglichen Zustand befinden oder fehlende Teile aufweisen.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eVerspätete oder fehlende Rückzahlungen\u003c/h2\u003e\n\n\u003cp\u003eWenn Sie noch keine Rückerstattung erhalten haben:\u003c/p\u003e\n\u003col\u003e\n    \u003cli\u003eÜberprüfen Sie zunächst Ihr Bankkonto erneut.\u003c/li\u003e\n    \u003cli\u003eKontaktieren Sie Ihr Kreditkartenunternehmen, da es möglicherweise einige Zeit dauern kann, bis Ihre Rückerstattung offiziell angezeigt wird.\u003c/li\u003e\n    \u003cli\u003eKontaktieren Sie Ihre Bank, da in der Regel eine Bearbeitungszeit besteht, bevor eine Rückerstattung bereitgestellt wird.\u003c/li\u003e\n    \u003cli\u003eWenn Sie all dies getan haben und Ihre Rückerstattung immer noch nicht erhalten haben, kontaktieren Sie uns bitte unter \u003cstrong\u003e\u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003ch2\u003eUmtausch\u003c/h2\u003e\n\n\u003cp\u003eWir ersetzen nur Artikel, die defekt oder beschädigt sind. Wenn Sie denselben Artikel umtauschen möchten, senden Sie uns bitte eine E-Mail an \u003cstrong\u003e\u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/strong\u003e.\u003c/p\u003e\n\n\u003ch2\u003eKontakt\u003c/h2\u003e\n\n\u003cp\u003eWenn Sie Fragen zu uns  Sie über den Dienst posten oder übermitteln; (d) Ihrem Verstoß gegen geltendes Recht, Regeln oder Vorschriften; oder (e) Ihrem Verstoß gegen die Rechte eines Dritten entstehen.\u003c/p\u003e\n\n\u003ch2\u003eHaftungsausschluss für Gewährleistungen\u003c/h2\u003e\n\u003cp\u003eDER DIENST WIRD \"WIE BESEHEN\" UND \"WIE VERFÜGBAR\" OHNE IRGENDEINE ART VON GEWÄHRLEISTUNGEN, AUSDRÜCKLICH ODER STILLSCHWEIGEND, ZUR VERFÜGUNG GESTELLT, EINSCHLIESSLICH, ABER NICHT BEGRENZT AUF STILLSCHWEIGENDE GEWÄHRLEISTUNGEN DER MARKTFÄHIGKEIT, EIGNUNG FÜR EINEN BESTIMMTEN ZWECK UND NICHTVERLETZUNG.\u003c/p\u003e\n\n\u003cp\u003eDAS UNTERNEHMEN GIBT KEINE GARANTIE DAFÜR AB: (A) DASS DER DIENST IHREN ANFORDERUNGEN ENTSPRICHT; (B) DASS DER DIENST UNUNTERBROCHEN, RECHTZEITIG, SICHER ODER FEHLERFREI SEIN WIRD; (C) DASS DIE AUS DEN NUTZUNG DES DIENSTES ERZIELTEN ERGEBNISSE GENAU ODER ZUVERLÄSSIG SEIN WERDEN; ODER (D) DASS DIE QUALITÄT IRGENDEINER PRODUKTE, DIENSTLEISTUNGEN, INFORMATIONEN ODER ANDERER MATERIALIEN, DIE ÜBER DEN DIENST BEZOGEN WERDEN, IHREN ERWARTUNGEN ENTSPRICHT.\u003c/p\u003e\n\n\u003ch2\u003eAkzeptanz durch Nutzung\u003c/h2\u003e\n\u003cp\u003eINDEM SIE AUF DEN DIENST ZUGREIFEN, IHN HERUNTERLADEN, INSTALLIEREN ODER NUTZEN, BESTÄTIGEN SIE, DASS SIE DIESE BEDINGUNGEN GELESEN UND VERSTANDEN HABEN UND SICH MIT IHNEN EINVERSTANDENERKLÄREN. WENN SIE DIESEN BEDINGUNGEN NICHT ZUSTIMMEN, GREIFEN SIE BITTE NICHT AUF DEN DIENST ZU ODER NUTZEN SIE DIESEN NICHT.\u003c/p\u003e\n\n\u003cp\u003eDie fortgesetzte Nutzung des Dienstes nach Änderungen dieser Bedingungen stellt Ihre Zustimmung zu solchen Änderungen dar.\u003c/p\u003e\n\n\u003ch2\u003eAnwendbares Recht und Gerichtsstand\u003c/h2\u003e\n\u003cp\u003eDiese Bedingungen unterliegen den Gesetzen der Föderativen Republik Brasilien und sind entsprechend auszulegen, ohne Rücksicht auf deren kollisionsrechtlichen Bestimmungen.\u003c/p\u003e\n\n\u003cp\u003eJede Streitigkeit, die sich aus oder im Zusammenhang mit diesen Bedingungen ergibt, unterliegt der ausschließlichen Zuständigkeit der Gerichte der Stadt São Paulo, Bundesstaat São Paulo, Brasilien, und die Parteien verzichten unwiderruflich auf jeglichen Einwand gegen die Zuständigkeit dieser Gerichte.\u003c/p\u003e\n\n\u003ch2\u003eRisikoübernahme\u003c/h2\u003e\n\u003cp\u003eSIE ÜBERNEHMEN DIE VOLLE VERANTWORTUNG UND DAS RISIKO FÜR IHRE NUTZUNG DES DIENSTES. DER DIENST WIRD \"WIE BESEHEN\" OHNE IRGENDEINE ART VON GEWÄHRLEISTUNGEN BEREITGESTELLT. DAS UNTERNEHMEN ÜBERNIMMT KEINE HAFTUNG FÜR SCHÄDEN, DIE AUS DER NUTZUNG ODER UNMÖGLICHKEIT DER NUTZUNG DES DIENSTES RESULTIEREN, EINSCHLIESSLICH SCHÄDEN, DIE DURCH SCHADSOftware, VIRUSSE ODER IRGENDEIN UNSACHGEMÄSSES ODER UNVOLLSTÄNDIGES COMPUTERPROGRAMM VERURSACHT WERDEN.\u003c/p\u003e\n\n\u003ch2\u003eLGPD-Konformität\u003c/h2\u003e\n\u003cp\u003eDieses Dokument entspricht dem brasilianischen Allgemeinen Datenschutzgesetz (LGPD - Gesetz Nr. 13.709/2018) und seinen Aktualisierungen, einschließlich:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD-Beschluss CD Nr. 19/2024:\u003c/strong\u003e Regeln für die internationale Übertragung personenbezogener Daten.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVorfallmeldung:\u003c/strong\u003e Frist von 3 (drei) Werktagen zur Benachrichtigung der ANPD und der betroffenen Personen.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eRechte der Betroffenen:\u003c/strong\u003e Zugang, Berichtigung, Übertragbarkeit, Löschung und Widerruf der Einwilligung.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDatenschutzbeauftragter (DPO):\u003c/strong\u003e Die Kontaktinformationen sind öffentlich verfügbar.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eDie Nichteinhaltung dieser Bestimmungen kann zu Strafen von bis zu 2 % des jährlichen Umsatzes in Brasilien oder 50 Millionen BRL pro Verstoß führen.\u003c/p\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Return and Refund","languageLabel":"Deutsch"},{"documentType":"disclaimer","language":"PT","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003eIsenção de Responsabilidade - NETURAL\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch1\u003eIsenção de Responsabilidade\u003c/h1\u003e\n    \u003cp\u003eÚltima atualização: 20 de janeiro de 2026\u003c/p\u003e\n\n    \u003ch2\u003eInterpretação e Definições\u003c/h2\u003e\n\n    \u003ch3\u003eInterpretação\u003c/h3\u003e\n    \u003cp\u003eAs palavras cuja letra inicial é maiúscula têm significados definidos nas seguintes condições. As seguintes definições devem ter o mesmo significado, independentemente de aparecerem no singular ou no plural.\u003c/p\u003e\n\n    \u003ch3\u003eDefinições\u003c/h3\u003e\n    \u003cp\u003ePara os fins desta isenção de responsabilidade:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"a Empresa\", \"Nós\", \"Nosso\" neste termo de isenção de responsabilidade) refere-se a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServiço\u003c/strong\u003e refere-se ao site, ao aplicativo ou a ambos, especificamente ao software denominado NETURAL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVocê\u003c/strong\u003e significa o indivíduo que acessa o Serviço, ou a empresa, ou outra pessoa jurídica em nome da qual esse indivíduo está acessando ou usando o Serviço, conforme aplicável.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e refere-se a NETURAL, acessível em \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003enossa página de contato\u003c/a\u003e.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAplicativo\u003c/strong\u003e significa o programa de software fornecido pela Empresa denominado NETURAL.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eExoneração de Responsabilidade Geral\u003c/h2\u003e\n    \u003cp\u003eAs informações contidas no Serviço são apenas para fins de informação geral.\u003c/p\u003e\n    \u003cp\u003eA EMPRESA NÃO ASSUME NENHUMA RESPONSABILIDADE POR ERROS OU OMISSÕES NO CONTEÚDO DO SERVIÇO.\u003c/p\u003e\n    \u003cp\u003eEM NENHUM CASO A EMPRESA SERÁ RESPONSÁVEL POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS OU CONSEQUENTES DE QUALQUER NATUREZA, SEJA EM UMA AÇÃO CONTRATUAL, NEGLIGÊNCIA OU OUTRO ATO ILÍCITO, DECORRENTE DE OU EM CONEXÃO COM O USO DO SERVIÇO OU DO CONTEÚDO DO SERVIÇO.\u003c/p\u003e\n    \u003cp\u003eA EMPRESA RESERVA-SE O DIREITO DE FAZER ACRÉSCIMOS, EXCLUSÕES OU MODIFICAÇÕES NO CONTEÚDO DO SERVIÇO A QUALQUER MOMENTO, SEM AVISO PRÉVIO.\u003c/p\u003e\n    \u003cp\u003eA EMPRESA NÃO GARANTE QUE O SERVIÇO ESTEJA LIVRE DE VÍRUS OU OUTROS COMPONENTES PREJUDICIAIS.\u003c/p\u003e\n\n    \u003ch2\u003eIsenção de Responsabilidade de Links Externos\u003c/h2\u003e\n    \u003cp\u003eO Serviço pode conter links para sites externos que não são fornecidos ou mantidos por ou de qualquer forma afiliados à Empresa.\u003c/p\u003e\n    \u003cp\u003eOBSERVE QUE A EMPRESA NÃO GARANTE A PRECISÃO, RELEVÂNCIA, OPORTUNIDADE OU INTEGRIDADE DE QUAISQUER INFORMAÇÕES NESSES SITES EXTERNOS.\u003c/p\u003e\n\n    \u003ch2\u003eIsenção de Responsabilidade por Erros e Omissões\u003c/h2\u003e\n    \u003cp\u003eAs informações fornecidas pelo Serviço são apenas para orientação geral sobre assuntos de interesse. Mesmo que a Empresa tome todas as precauções para garantir que o conteúdo do Serviço seja atualizado e preciso, podem ocorrer erros.\u003c/p\u003e\n    \u003cp\u003eALÉM DISSO, DEVIDO À NATUREZA MUTÁVEL DAS LEIS, REGRAS E REGULAMENTOS, PODE HAVER ATRASOS, OMISSÕES OU IMPRECISÕES NAS INFORMAÇÕES CONTIDAS NO SERVIÇO.\u003c/p\u003e\n    \u003cp\u003eA EMPRESA NÃO SE RESPONSABILIZA POR QUAISQUER ERROS OU OMISSÕES, OU PELOS RESULTADOS OBTIDOS COM O USO DESTA INFORMAÇÃO.\u003c/p\u003e\n\n    \u003ch2\u003eIsenção de Responsabilidade de Uso Justo\u003c/h2\u003e\n    \u003cp\u003eA Empresa pode usar material protegido por direitos autorais que nem sempre foi especificamente autorizado pelo proprietário dos direitos autorais. A Empresa está disponibilizando esse material para crítica, comentário, reportagem, ensino, bolsa de estudos ou pesquisa.\u003c/p\u003e\n    \u003cp\u003eA EMPRESA ACREDITA QUE ISSO CONSTITUI UM \"USO JUSTO\" DE QUALQUER MATERIAL PROTEGIDO POR DIREITOS AUTORAL, CONFORME PREVISTO NA SEÇÃO 107 DA LEI DE DIREITOS AUTORAIS DOS ESTADOS UNIDOS.\u003c/p\u003e\n    \u003cp\u003eSE DESEJAR USAR MATERIAL PROTEGIDO POR DIREITOS AUTORAIS DO SERVIÇO PARA SEUS PRÓPRIOS FINS QUE VÃO ALÉM DO USO JUSTO, VOCÊ DEVE OBTENHA PERMISSÃO DO PROPRIETÁRIO DOS DIREITOS AUTORAIS.\u003c/p\u003e\n\n    \u003ch2\u003eIsenção de Responsabilidade Expressa das Visualizações\u003c/h2\u003e\n    \u003cp\u003eO Serviço pode conter pontos de vista e opiniões dos autores que não refletem necessariamente a política oficial ou posição de qualquer outro autor, agência, organização, empregador ou empresa, incluindo a Empresa.\u003c/p\u003e\n    \u003cp\u003eOS COMENTÁRIOS PUBLICADOS PELOS USUÁRIOS SÃO DE SUA EXCLUSIVA RESPONSABILIDADE E OS USUÁRIOS ASSUMEM TOTAL RESPONSABILIDADE, RESPONSABILIDADE E CULPA POR QUALQUER DIFAMAÇÃO OU LITÍGIO QUE RESULTA DE ALGO ESCRITO OU COMO RESULTADO DIRETO DE ALGO ESCRITO EM UM COMENTÁRIO. A EMPRESA NÃO SE RESPONSABILIZA POR NENHUM COMENTÁRIO PUBLICADO POR USUÁRIOS E RESERVA-SE O DIREITO DE EXCLUIR QUALQUER COMENTÁRIO POR QUALQUER MOTIVO.\u003c/p\u003e\n\n    \u003ch2\u003eIsenção de Responsabilidade Profissional\u003c/h2\u003e\n    \u003cp\u003eAs informações sobre o Serviço são fornecidas com o entendimento de que a Empresa não está envolvida na prestação de serviços e consultoria jurídica, contábil, tributária ou outros profissionais. Como tal, não deve ser usado como um substituto para a consulta a consultores profissionais de contabilidade, fiscais, jurídicos ou outros consultores competentes.\u003c/p\u003e\n    \u003cp\u003eEM NENHUM CASO, A EMPRESA OU SEUS FORNECEDORES SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS OU CONSEQUENTES DE QUALQUER NATUREZA DECORRENTES DE OU EM CONEXÃO COM SEU ACESSO OU USO OU INCAPACIDADE DE ACESSAR OU USAR O SERVIÇO.\u003c/p\u003e\n\n    \u003ch2\u003eUse por Sua Conta e Risco\u003c/h2\u003e\n    \u003cp\u003eTODAS AS INFORMAÇÕES NO SERVIÇO SÃO FORNECIDAS \"NO ESTADO EM QUE SE ENCONTRAM\", SEM GARANTIA DE INTEGRIDADE, PRECISÃO, OPORTUNIDADE OU DOS RESULTADOS OBTIDOS COM O USO DESSAS INFORMAÇÕES E SEM GARANTIA DE QUALQUER TIPO, EXPRESSA OU IMPLÍCITA, INCLUINDO, MAS NÃO LIMITADO A GARANTIAS DE DESEMPENHO, COMERCIALIZAÇÃO E ADEQUAÇÃO A UMA FINALIDADE ESPECÍFICA.\u003c/p\u003e\n    \u003cp\u003eA EMPRESA NÃO SERÁ RESPONSÁVEL PERANTE VOCÊ OU QUALQUER OUTRA PESSOA POR QUALQUER DECISÃO OU AÇÃO TOMADA COM BASE NAS INFORMAÇÕES FORNECIDAS PELO SERVIÇO OU POR QUAISQUER DANOS CONSEQUENTES, ESPECIAIS OU SEMELHANTES, MESMO SE AVISADA DA POSSIBILIDADE DE TAIS DANOS.\u003c/p\u003e\n\n    \u003ch2\u003eContato\u003c/h2\u003e\n    \u003cp\u003eSe você tiver alguma dúvida sobre esta isenção de responsabilidade, pode entrar em contato conosco:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eE-mail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003eVisitando nossa página de contato: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003enossa página de contato\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eConformidade com a LGPD\u003c/h2\u003e\n    \u003cp\u003eEste documento está em conformidade com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018) e suas atualizações, incluindo:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eResolução CD/ANPD nº 19/2024\u003c/strong\u003e: Regras para transferência internacional de dados pessoais.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eNotificação de Incidentes\u003c/strong\u003e: Prazo de 3 (três) dias úteis para comunicação à ANPD e aos titulares afetados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDireitos dos Titulares\u003c/strong\u003e: Acesso, correção, portabilidade, eliminação e revogação de consentimento.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEncarregado de Proteção de Dados (DPO)\u003c/strong\u003e: Informações de contato disponíveis publicamente.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eLimitação de Responsabilidade\u003c/h2\u003e\n    \u003cp\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, EM NENHUM CASO A EMPRESA OU SEUS FORNECEDORES SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS OU CONSEQUENTES DE QUALQUER NATUREZA (INCLUINDO, MAS NÃO LIMITADO A, DANOS POR PERDA DE LUCROS, PERDA DE DADOS OU OUTRAS INFORMAÇÕES, POR INTERRUPÇÃO DE NEGÓCIOS, POR LESÃO PESSOAL, PERDA DE PRIVACIDADE DECORRENTE DE OU DE QUALQUER FORMA RELACIONADA AO USO OU INCAPACIDADE DE USAR O SERVIÇO, SOFTWARE DE TERCEIROS E/OU HARDWARE DE TERCEIROS USADO COM O SERVIÇO, OU DE OUTRA FORMA EM CONEXÃO COM QUALQUER DISPOSIÇÃO DESTES TERMOS).\u003c/p\u003e\n    \u003cp\u003eA RESPONSABILIDADE TOTAL DA EMPRESA SOB ESTE ACORDO NÃO EXCEDERÁ O MAIOR VALOR ENTRE: (A) O VALOR TOTAL PAGO POR VOCÊ PELO SERVIÇO DURANTE OS 12 MESES ANTERIORES À RECLAMAÇÃO; OU (B) R$ 100,00 (CEM REAIS).\u003c/p\u003e\n\n    \u003ch2\u003eIndenização\u003c/h2\u003e\n    \u003cp\u003eVocê concorda em indenizar, defender e isentar a Empresa, suas afiliadas, diretores, funcionários, agentes, licenciadores e fornecedores de e contra todas e quaisquer reclamações, responsabilidades, danos, julgamentos, custos e despesas (incluindo honorários advocatícios razoáveis) decorrentes de ou relacionados a: (a) seu uso do Serviço; (b) qualquer violação destes Termos por você; (c) qualquer conte he Application during the 12 months preceding the claim; or (b) $20.00 (twenty dollars).\u003c/p\u003e\n\n\u003ch2\u003eGoverning Law\u003c/h2\u003e\n\n\u003cp\u003eThis Agreement shall be governed by and construed in accordance with the laws of the Federative Republic of Brazil, without regard to its conflict of law provisions.\u003c/p\u003e\n\n\u003cp\u003eAny dispute arising out of or relating to this Agreement shall be submitted to the exclusive jurisdiction of the courts of the city of São Paulo, State of São Paulo, Brazil, and the parties irrevocably waive any objection to the jurisdiction of such courts.\u003c/p\u003e\n\n\u003ch2\u003eContact Us\u003c/h2\u003e\n\n\u003cp\u003eIf you have any questions about this Agreement, you can contact us:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eEmail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eVisit this page: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eLGPD Compliance\u003c/h2\u003e\n\n\u003ch3\u003eGeneral Compliance\u003c/h3\u003e\n\n\u003cp\u003eThis document complies with the Brazilian General Data Protection Law (LGPD - Law No. 13.709/2018) and its updates, including:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD Resolution CD No. 19/2024\u003c/strong\u003e: Rules for international transfer of personal data.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eIncident Notification\u003c/strong\u003e: Three (3) business day deadline to notify ANPD and affected data subjects of a data breach.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eData Subject Rights\u003c/strong\u003e: Rights of access, correction, portability, deletion, and consent revocation.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eData Protection Officer (DPO)\u003c/strong\u003e: Contact information available for inquiries regarding data processing.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eData Subject Rights\u003c/h3\u003e\n\n\u003cp\u003eAs a data subject, you have the following rights under the LGPD:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eAccess the personal data we hold about you.\u003c/li\u003e\n    \u003cli\u003eRequest corrections to your personal data.\u003c/li\u003e\n    \u003cli\u003eRequest the portability of your personal data.\u003c/li\u003e\n    \u003cli\u003eRequest the deletion of your personal data.\u003c/li\u003e\n    \u003cli\u003eRequest revocation of consent for data processing.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eWe will respond to your requests to exercise these rights within the timelines established by the LGPD.\u003c/p\u003e\n\n\u003ch3\u003eInternational Data Transfers\u003c/h3\u003e\n\n\u003cp\u003eIn the case of any international transfer of personal data originating from Brazil, we will ensure compliance with the standard contractual clauses approved by the ANPD as per Resolution CD/ANPD No. 19/2024. You acknowledge that information may be transmitted to other countries, and we will make reasonable efforts to protect your data during such transfers.\u003c/p\u003e\n\n\u003ch3\u003eData Breach Notification\u003c/h3\u003e\n\n\u003cp\u003eIn the event of a data breach, we will notify the ANPD and affected users within three (3) business days as required by the LGPD.\u003c/p\u003e\n\n\u003cp\u003eYou acknowledge that you have read, understood, and agree to be bound by these Terms. If you do not agree to these Terms, do not access or use the Application. Continued use of the Application after any modifications to these Terms constitutes your acceptance of such modifications.\u003c/p\u003e","label":"End-User License Agreement (EULA)","languageLabel":"English"},{"documentType":"disclaimer","language":"ES","content":"\u003ch2\u003eExención de Responsabilidad\u003c/h2\u003e\n\n\u003cp\u003eÚltima actualización: 20 de enero de 2026\u003c/p\u003e\n\n\u003ch2\u003eInterpretación y Definiciones\u003c/h2\u003e\n\n\u003ch3\u003eInterpretación\u003c/h3\u003e\n\u003cp\u003eLas palabras cuya letra inicial es mayúscula tienen significados definidos en las siguientes condiciones. Las siguientes definiciones deben tener el mismo significado, independientemente de que aparezcan en singular o plural.\u003c/p\u003e\n\n\u003ch3\u003eDefiniciones\u003c/h3\u003e\n\u003cp\u003ePara los fines de esta exención de responsabilidad:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"la Empresa\", \"Nosotros\", \"Nuestro\" en este término de exención de responsabilidad) se refiere a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICAÇÃO VISUAL LTDA., con CNPJ: 08.337.937/0001-69 y dirección ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServicio\u003c/strong\u003e se refiere al sitio web, la aplicación o a ambos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e significa el individuo que accede al Servicio, o la empresa, u otra persona jurídica en nombre de la cual ese individuo está accediendo o utilizando el Servicio, según corresponda.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSitio\u003c/strong\u003e se refiere a NETURAL, accesible en \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAplicación\u003c/strong\u003e significa el programa de software proporcionado por la Empresa denominado NETURAL.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eExención de Responsabilidad General\u003c/h2\u003e\n\u003cp\u003eLa información contenida en el Servicio es únicamente para fines de información general.\u003c/p\u003e\n\u003cp\u003eLA EMPRESA NO ASUME NINGUNA RESPONSABILIDAD o de los derechos de autor. La Empresa está poniendo a disposición este material para crítica, comentario, información, enseñanza, investigación o estudios académicos.\u003c/p\u003e\n\u003cp\u003eLA EMPRESA CREE QUE ESTO CONSTITUYE UN \"USO JUSTO\" DE CUALQUIER MATERIAL PROTEGIDO POR DERECHOS DE AUTOR, CONFORME A LO ESTABLECIDO EN LA LEY DE DERECHOS DE AUTOR DE BRASIL.\u003c/p\u003e\n\u003cp\u003eSI DESEA UTILIZAR MATERIAL PROTEGIDO POR DERECHOS DE AUTOR DEL SERVICIO PARA SUS PROPIOS FINES QUE VAYAN MÁS ALLÁ DEL USO JUSTO, DEBE OBTENER PERMISO DEL PROPIETARIO DE LOS DERECHOS DE AUTOR.\u003c/p\u003e\n\n\u003ch2\u003eExención de Responsabilidad por Opiniones Expresadas\u003c/h2\u003e\n\u003cp\u003eEl Servicio puede contener puntos de vista y opiniones de los autores y no reflejan necesariamente la política oficial o posición de cualquier otro autor, agencia, organización, empleador o empresa, incluida la Empresa.\u003c/p\u003e\n\u003cp\u003eLOS COMENTARIOS PUBLICADOS POR LOS USUARIOS SON DE SU EXCLUSIVA RESPONSABILIDAD Y LOS USUARIOS ASUMEN TOTAL RESPONSABILIDAD, RESPONSABILIDAD Y CULPA POR CUALQUIER DIFAMACIÓN O LITIGIO QUE SURJA DE ALGO ESCRITO O COMO RESULTADO DIRECTO DE ALGO ESCRITO EN UN COMENTARIO. LA EMPRESA NO SE RESPONSABILIZA POR NINGÚN COMENTARIO PUBLICADO POR USUARIOS Y SE RESERVA EL DERECHO DE ELIMINAR CUALQUIER COMENTARIO POR CUALQUIER MOTIVO.\u003c/p\u003e\n\n\u003ch2\u003eExención de Responsabilidad Profesional\u003c/h2\u003e\n\u003cp\u003eLa información sobre el Servicio se proporciona con el entendimiento de que la Empresa no está involucrada en la prestación de servicios y asesorías legales, contabilísticas, fiscales u otros profesionales. Por lo tanto, no debe usarse como un sustituto para la consulta a asesores profesionales competentes en contabilidad, impuestos, derecho u otros campos.\u003c/p\u003e\n\u003cp\u003eEN NINGÚN CASO, LA EMPRESA O SUS PROVEEDORES SERÁN RESPONSABLES POR CUALQUIER DAÑO ESPECIAL, INCIDENTAL, INDIRECTO O CONSECUENTE DE CUALQUIER NATURALEZA DERIVADA DE O EN RELACIÓN CON SU ACCESO O USO O INCAPACIDAD DE ACCEDER O USAR EL SERVICIO.\u003c/p\u003e\n\n\u003ch2\u003eUso bajo Su Propio Riesgo\u003c/h2\u003e\n\u003cp\u003eToda la información en el Servicio se proporciona \"tal como está\", sin garantía de integridad, precisión, oportunidad o de los resultados obtenidos con el uso de esta información y sin garantía de ningún tipo, expresa o implícita, incluida, entre otras, las garantías de rendimiento, comerciabilidad y adecuación a un fin específico.\u003c/p\u003e\n\u003cp\u003eLA EMPRESA NO SERÁ RESPONSABLE ANTE USTED O ANTE NINGUNA OTRA PERSONA POR CUALQUIER DECISIÓN O ACCIÓN TOMADA BASADA EN LA INFORMACIÓN PROVEÍDA POR EL SERVICIO O POR CUALQUIER DAÑO CONSECUENTE, ESPECIAL O SIMILAR, AUNQUE SE HAYA ADVERTIDO DE LA POSIBILIDAD DE TALES DAÑOS.\u003c/p\u003e\n\n\u003ch2\u003eContacto\u003c/h2\u003e\n\u003cp\u003eSi tiene alguna pregunta sobre esta exención de responsabilidad, puede contactarnos:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eCorreo electrónico:\u003c/strong\u003e \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVisitando nuestra página de contacto:\u003c/strong\u003e \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eCumplimiento de la LGPD\u003c/h2\u003e\n\u003cp\u003eEste documento cumple con la Ley General de Protección de Datos de Brasil (LGPD - Ley N° 13.709/2018) y sus actualizaciones, incluyendo:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eResolución CD/ANPD N° 19/2024:\u003c/strong\u003e Reglas para transferencia internacional de datos personales.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotificación de Incidentes:\u003c/strong\u003e Plazo de 3 (tres) días hábiles para comunicar a la ANPD y a los titulare \n\u003ch2\u003eContenido del Usuario\u003c/h2\u003e\n\nUsted es el único responsable de cualquier contenido que publique, cargue, enlace o de otra manera ponga a disposición a través del Servicio. La Empresa no asume ninguna responsabilidad por el contenido publicado por los usuarios.\n\n\u003ch2\u003eDerechos de Propiedad Intelectual\u003c/h2\u003e\n\nEl Servicio y su contenido original, recursos y funcionalidades son y seguirán siendo propiedad exclusiva de la Empresa. El Servicio está protegido por derechos de autor, marcas registradas y otras leyes en Brasil y en otros países.\n\n\u003ch2\u003eRescisión de Cuenta\u003c/h2\u003e\n\nPodemos rescindir o suspender su acceso inmediatamente, sin previo aviso o responsabilidad, por cualquier razón, incluyendo, sin limitación, si usted viola estos Términos.\n\n\u003ch2\u003eModificaciones de los Términos\u003c/h2\u003e\n\nNos reservamos el derecho, a nuestra exclusiva discreción, de modificar o reemplazar estos Términos en cualquier momento. Si una revisión es material, intentaremos notificar con al menos 30 días de anticipación antes de que entren en vigor nuevos términos.\n\n\u003ch2\u003eExención de Responsabilidad\u003c/h2\u003e\n\nEL SERVICIO SE PROPORCIONA \"TAL CUAL\" Y \"DISPONIBLE\" SIN GARANTÍAS DE NINGÚN TIPO, YA SEAN EXPRESAS O IMPLÍCITAS, INCLUYENDO, PERO NO LIMITÁNDOSE A, GARANTÍAS IMPLÍCITAS DE COMERCIABILIDAD, APTITUD PARA UN PROPÓSITO PARTICULAR Y NO INFRACCIÓN.\n\nLA EMPRESA NO GARANTIZA QUE: (A) EL SERVICIO SATISFARÁ SUS REQUISITOS; (B) EL SERVICIO SERÁ ININTERUMPIDO, OPORTUNO, SEGURO O LIBRE DE ERRORES; (C) LOS RESULTADOS OBTENIDOS DEL USO DEL SERVICIO SERÁN PRECISOS O FIABLES; O (D) LA CALIDAD DE CUALQUIER PRODUCTO, SERVICIO, INFORMACIÓN U OTRO MATERIAL OBTENIDO A TRAVÉS DEL SERVICIO CUMPLIRÁ CON SUS EXPECTATIVAS.\n\n\u003ch2\u003eLimitación de Responsabilidad\u003c/h2\u003e\n\nHASTA EL MÁXIMO GRADO PERMITIDO POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES SERÁN RESPONSABLES POR CUALQUIER DAÑO ESPECIAL, INCIDENTAL, INDIRECTO O CONSECUENTE (INCLUYENDO, PERO NO LIMITÁNDOSE A, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS O OTRA INFORMACIÓN, INTERRUPCIÓN DEL NEGOCIO, LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD QUE SURJA O DE CUALQUIER MANERA ESTÉ RELACIONADA CON EL USO O LA INCAPACIDAD DE USAR EL SERVICIO, SOFTWARE DE TERCEROS Y/O HARDWARE DE TERCEROS UTILIZADOS CON EL SERVICIO, O DE OTRA MANERA EN CONEXIÓN CON CUALQUIER DISPOSICIÓN DE ESTOS TÉRMINOS).\n\nLa responsabilidad total de la Empresa bajo este acuerdo no excederá la mayor de: (a) la cantidad total pagada por usted por el Servicio durante los 12 meses anteriores a la reclamación; o (b) $20.00 (veinte dólares).\n\n\u003ch2\u003eIndemnización\u003c/h2\u003e\n\nUsted acepta indemnizar, defender y mantener indemne a la Empresa, sus afiliados, directores, empleados, agentes, licenciantes y proveedores de y contra todas las reclamaciones, responsabilidades, daños, juicios, costos y gastos (incluyendo honorarios razonables de abogados) que surjan o estén relacionados con: (a) su uso del Servicio; (b) cualquier incumplimiento de estos Términos por su parte; (c) cualquier contenido que publique o transmita a través del Servicio; (d) su violación de cualquier ley, regla o regulación aplicable; o (e) su violación de los derechos de cualquier tercero.\n\n\u003ch2\u003eContacto\u003c/h2\u003e\n\nSi tiene alguna pregunta sobre estos Términos de Uso, puede ponerse en contacto con nosotros:\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eCorreo electrónico:\u003c/strong\u003e \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVisitando esta página:\u003c/strong\u003e \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eCumplimiento de la LGPD\u003c/h2\u003e\n\nEste documento cumple con l ables. Los reembolsos pueden considerarse caso por caso a la única discreción de la Empresa.\n\n\u003ch3\u003ePrueba Gratuita\u003c/h3\u003e\n\nLa Empresa puede ofrecer una prueba gratuita por un tiempo limitado. Al final del período de prueba, se le cobrará automáticamente las tarifas de suscripción a menos que cancele antes del final del período de prueba.\n\n\u003ch2\u003eAsunción de Riesgo\u003c/h2\u003e\n\nUSTED ASUME TOTAL RESPONSABILIDAD Y RIESGO POR SU USO DEL SERVICIO. EL SERVICIO SE PROPORCIONA \"TAL CUAL\" SIN GARANTÍAS DE NINGÚN TIPO. LA EMPRESA NO SERÁ RESPONSABLE DE NINGÚN DAÑO RESULTANTE DEL USO O LA INCAPACIDAD DE USAR EL SERVICIO, INCLUYENDO DAÑOS CAUSADOS POR MALWARE, VIRUS O CUALQUIER PROGRAMA INFORMÁTICO INCORRECTO O INCOMPLETO.\n\n\u003cp\u003eAl utilizar NETURAL, usted acepta todos estos Términos y se compromete a cumplirlos en su totalidad.\u003c/p\u003e","label":"Terms of Use","languageLabel":"Español"},{"documentType":"eula","language":"ES","content":"\u003ch2\u003eContrato de Licencia de Usuario Final (\"Contrato\")\u003c/h2\u003e\n\n\u003cp\u003eÚltima actualización: 20 de enero de 2026\u003c/p\u003e\n\n\u003cp\u003eLea este Contrato de Licencia de Usuario Final con atención antes de hacer clic en el botón \"Acepto\", descargar o usar NETURAL.\u003c/p\u003e\n\n\u003ch2\u003eInterpretación y Definiciones\u003c/h2\u003e\n\n\u003ch3\u003eInterpretación\u003c/h3\u003e\n\n\u003cp\u003eLas palabras cuya primera letra es mayúscula tienen significados definidos en las siguientes condiciones. Las siguientes definiciones tendrán el mismo significado, independientemente de aparecer en singular o plural.\u003c/p\u003e\n\n\u003ch3\u003eDefiniciones\u003c/h3\u003e\n\u003cp\u003ePara los fines de este Contrato de Licencia de Usuario Final:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eContrato\u003c/strong\u003e significa este Contrato de Licencia de Usuario Final que constituye el acuerdo completo entre Usted y la Empresa con respec cumento legal entre Usted y la Empresa y rige el uso de la Aplicación proporcionada a Usted por la Empresa.\u003c/p\u003e\n\n\u003cp\u003eLa Aplicación es licenciada, no vendida, a Usted por la Empresa para su uso estrictamente de acuerdo con los términos de este Contrato.\u003c/p\u003e\n\n\u003ch2\u003eLicencia\u003c/h2\u003e\n\n\u003ch3\u003eAlcance de la Licencia\u003c/h3\u003e\n\n\u003cp\u003eLa Empresa le concede a Usted una licencia revocable, no exclusiva, intransferible y limitada para descargar, instalar y usar la Aplicación estrictamente de acuerdo con los términos de este Contrato.\u003c/p\u003e\n\n\u003cp\u003eUsted solo puede usar la Aplicación en un Dispositivo que sea de su propiedad o control.\u003c/p\u003e\n\n\u003cp\u003eLa licencia concedida a usted por la Empresa es exclusivamente para fines personales y no comerciales, estrictamente de acuerdo con los términos de este Contrato.\u003c/p\u003e\n\n\u003ch3\u003eRestricciones de Licencia\u003c/h3\u003e\n\n\u003cp\u003eUsted acepta no hacer y no permitirá que otros:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eLicencien, vendan, alquilen, arrenden, asignen, distribuyan, transmitan, hospeden, subcontraten, divulguen o de otra manera exploten comercialmente la Aplicación o la pongan a disposición de terceros.\u003c/li\u003e\n    \u003cli\u003eCopien o usen la Aplicación para cualquier propósito distinto del permitido en la sección 'Licencia' anterior.\u003c/li\u003e\n    \u003cli\u003eModifiquen, hagan trabajos derivados, desensamblen, descifren, compilen o realicen ingeniería inversa de cualquier parte de la Aplicación.\u003c/li\u003e\n    \u003cli\u003eElimine, altere u oculte cualquier aviso de propiedad (incluyendo cualquier aviso de derechos de autor o marca registrada) de la Empresa o de sus afiliadas.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eContenido\u003c/h2\u003e\n\n\u003ch3\u003eRestricciones de Contenido\u003c/h3\u003e\n\n\u003cp\u003eLa Empresa no es responsable de las entradas 03e\n\n\u003cp\u003eLa Empresa puede, de vez en cuando, proporcionar mejoras o mejoras en las características/funcionalidades de la Aplicación, que pueden incluir parches, correcciones de errores, actualizaciones, mejoras y otras modificaciones.\u003c/p\u003e\n\n\u003cp\u003eUsted acepta que la Empresa no tiene la obligación de proporcionar ninguna Actualización o continuar proporcionándole o habilitando cualquier característica y/o funcionalidad específica de la Aplicación.\u003c/p\u003e\n\n\u003ch3\u003eMantenimiento y Soporte\u003c/h3\u003e\n\n\u003cp\u003eLa Empresa no proporciona ningún mantenimiento o soporte para la descarga y uso de la Aplicación.\u003c/p\u003e\n\n\u003ch2\u003eServicios de Terceros\u003c/h2\u003e\n\n\u003cp\u003eLa Aplicación puede mostrar, incluir o proporcionar contenido de terceros o proporcionar enlaces a sitios o servicios de terceros.\u003c/p\u003e\n\n\u003cp\u003eUsted reconoce y acepta que la Empresa no será responsable de ningún Servicio de Terceros, incluyendo su precisión, integridad, oportunidad, validez, conformidad de derechos de autor, legalidad, decencia, calidad o cualquier otro aspecto de los mismos.\u003c/p\u003e\n\n\u003ch2\u003eVigencia y Rescisión\u003c/h2\u003e\n\n\u003cp\u003eEste Contrato permanecerá en vigor hasta que sea rescindido por Usted o por la Empresa.\u003c/p\u003e\n\n\u003cp\u003eLa Empresa puede, a su exclusivo criterio, en cualquier momento y por cualquier razón, suspender o rescindir este Contrato con o sin aviso previo.\u003c/p\u003e\n\n\u003cp\u003eEste Acuerdo será rescindido de inmediato, sin aviso previo de la Empresa, en caso de que Usted deje de cumplir cualquier disposición de este Acuerdo.\u003c/p\u003e\n\n\u003cp\u003eTras la rescisión de este Contrato, Usted deberá interrumpir todo uso de la Aplicación y eliminar todas las copias de la Aplicación de su dispositivo.\u003c/p\u003e\n\n\u003ch2\u003eIndemnización\u003c/h2\u003e\n\n\u003cp\u003eUsted acepta indemnizar y mantener indemne a la Empresa y a sus padres, subsidiarias, afiliadas, directores, empleados, agentes, socios y licenciadores de cualquier reclamación o demanda, incluyendo honorarios razonables de abogados, que surjan o resulten de su: (a) uso de la Aplicación; (b) violación de este Contrato o de cualquier ley o regulación; o (c) violación de cualquier derecho de terceros.\u003c/p\u003e\n\n\u003ch2\u003eSin Garantías\u003c/h2\u003e\n\n\u003cp\u003eLa Aplicación se proporciona a usted \"TAL CUAL\" y \"SEGÚN DISPONIBILIDAD\" y con todas las fallas y defectos sin garantía de ningún tipo.\u003c/p\u003e\n\n\u003cp\u003eEN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, LA EMPRESA, EN SU NOMBRE Y EN NOMBRE DE SUS AFILIADAS Y SUS RESPECTIVOS LICENCIADORES Y PROVEEDORES DE SERVICIOS, RENUNCIA EXPRESAMENTE A TODAS LAS GARANTÍAS, YA SEAN EXPRESAS, IMPLÍCITAS, LEGALES O DE OTRA FORMA, EN RELACIÓN CON LA APLICACIÓN, INCLUYENDO TODAS LAS GARANTÍAS IMPLÍCITAS DE COMERCIABILIDAD, ADECUACIÓN A UN PROPÓSITO PARTICULAR, TITULO Y NO VIOLACIÓN.\u003c/p\u003e\n\n\u003cp\u003eSin limitación a lo anterior, la Empresa no ofrece ninguna garantía o compromiso, y no realiza ninguna representación de ningún tipo de que la Aplicación satisfará sus requisitos, alcanzará los resultados deseados, será compatible o funcionará con cualquier otro software, aplicación, sistema o servicio, operará sin interrupción, cumplirá con los estándares de rendimiento o fiabilidad, o estará libre de errores.\u003c/p\u003e\n\n\u003ch2\u003eLimitación de Responsabilidad\u003c/h2\u003e\n\n\u003cp\u003eEN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES SERÁN RESPONSABLES POR CUALQUIER DAÑO ESPECIAL, INCIDENTAL, INDIRECTO O CONSECUENTE DE CUALQUIER NATUREZA (INCLUYENDO, PERO NO LIMITADO A, DAÑOS POR PÉRDIDA DE GANANCIAS, PÉRDIDA DE DATOS U OTRA INFORMACIÓN, POR INTERRUPCIÓN DEL NEGOCIO, POR LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD QUE SURJA DE O DE OTRA MANERA RELACIONADA CON EL USO O IMPOSIBILIDAD DE USAR LA APLICACIÓN).\u003c/p\u003e\n\n\u003cp\u003eLa responsabilidad total de la Empresa en virtud de este acuerdo no excederá el mayor de: (a) el monto total pagado por Usted por el Servicio durante los 12 meses anteriores a la reclamación; o (b) 20.00 (veinte dólares).\u003c/p\u003e\n\n\u003ch2\u003eLey Aplicable\u003c/h2\u003e\n\n\u003cp\u003eEste Contrato se regirá e interpretará de acuerdo con las leyes de la República Federativa de Brasil, sin tener en cuenta sus disposiciones sobre conflictos de leyes.\u003c/p\u003e\n\n\u003cp\u003eCualquier disputa que surja de o esté relacionada con este Contrato se someterá a la jurisdicción exclusiva de los tribunales de la ciudad de São Paulo, Estado de São Paulo, Brasil, y las partes renuncian irrevocablemente a cualquier objeción a la jurisdicción de dichos tribunales.\u003c/p\u003e\n\n\u003ch2\u003eContacto\u003c/h2\u003e\n\n\u003cp\u003eSi tiene alguna pregunta sobre este Contrato, puede contactarnos:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eEmail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eVisite esta página: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eContacto\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eCumplimiento de la LGPD\u003c/h2\u003e\n\n\u003cp\u003eEste documento cumple con la Ley General de Protección de Datos de Brasil (LGPD - Ley N° 13.709/2018) y sus actualizaciones, incluyendo:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eResolución CD/ANPD N° 19/2024:\u003c/strong\u003e Reglas para transferencia internacional de datos personales.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotificación de Incidentes:\u003c/strong\u003e Plazo de 3 (tres) días hábiles para comunicar a la ANPD y a los titulares afectados.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerechos de los Titulares:\u003c/strong\u003e Acceso, corrección, portabilidad, elimi enos que cancele antes del final del período de prueba.\u003c/p\u003e","label":"End-User License Agreement (EULA)","languageLabel":"Español"},{"documentType":"terms_of_service","language":"ES","content":"\u003ch2\u003eTérminos de Servicio\u003c/h2\u003e\n\n\u003cp\u003eÚltima actualización: 20 de enero de 2026\u003c/p\u003e\n\n\u003cp\u003ePor favor, lea estos Términos de Servicio (\"Términos\") cuidadosamente antes de usar el servicio NETURAL operado por INCODE TECH.\u003c/p\u003e\n\n\u003ch2\u003eInterpretación y Definiciones\u003c/h2\u003e\n\n\u003ch3\u003eInterpretación\u003c/h3\u003e\n\n\u003cp\u003eLas palabras cuya letra inicial es mayúscula tienen significados definidos a continuación.\u003c/p\u003e\n\n\u003ch3\u003eDefiniciones\u003c/h3\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e se refiere a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., CNPJ: 08.337.937/0001-69, NIRE: 35.220.949.742, con dirección en ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServicio\u003c/strong\u003e se refiere a NETURAL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e significa el individuo que accede al Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCuenta\u003c/strong\u003e significa una cuenta única creada para que usted acceda a nuestro Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSuscripción\u003c/strong\u003e se refiere a los servicios o el acceso al Servicio ofrecido mediante suscripción.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eDescripción del Servicio\u003c/h2\u003e\n\n\u003cp\u003eNETURAL es un servicio que permite a los usuarios interactuar con una plataforma diseñada para proporcionar diversas funcionalidades específicas en el ámbito de la tecnología y desarrollo digital. El Servicio puede incluir recursos tanto pagos como gratuit ríodo de prueba, se le cobrará automáticamente la cuota de suscripción a menos que cancele antes de que finalice el período de prueba.\u003c/p\u003e\n\n\u003ch2\u003eDisponibilidad del Servicio\u003c/h2\u003e\n\n\u003cp\u003eLa Empresa se esfuerza por mantener el Servicio disponible las 24 horas del día, los 7 días de la semana. Sin embargo, la Empresa no garantiza que el Servicio estará disponible de manera ininterrumpida o sin errores.\u003c/p\u003e\n\n\u003cp\u003eLa Empresa se reserva el derecho de modificar, suspender o interrumpir el Servicio, temporal o permanentemente, en cualquier momento y sin previo aviso.\u003c/p\u003e\n\n\u003ch2\u003ePropiedad Intelectual\u003c/h2\u003e\n\n\u003cp\u003eTodo el contenido incluido en el Servicio, como texto, gráficos, logotipos, íconos, imágenes, clips de audio, descargas digitales y software, es propiedad de la Empresa o de sus proveedores de contenido y está protegido por las leyes de derechos de autor brasileñas e internacionales.\u003c/p\u003e\n\n\u003ch2\u003eLimitação de Responsabilidade\u003c/h2\u003e\n\n\u003cp\u003e\u003cstrong\u003eEN NINGÚN CASO LA EMPRESA, SUS DIRECTORES, EMPLEADOS, SOCIOS, AGENTES, PROVEEDORES O AFILIADOS SERÁN RESPONSABLES POR CUALQUIER DAÑO ESPECIAL, INCIDENTAL, INDIRECTO O CONSECUENTE DE NINGÚN TIPO (INCLUYENDO, PERO NO LIMITÁNDOSE A, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS O OTRA INFORMACIÓN, INTERRUPCIÓN DEL NEGOCIO, LESIONES PERSONALES, PÉRDIDAS DE PRIVACIDAD QUE SURJAN DE O ESTÉN DE CUALQUIER MANERA RELACIONADOS CON EL USO O LA INCAPACIDAD DE USAR EL SERVICIO, SOFTWARE DE TERCEROS Y/O HARDWARE DE TERCEROS UTILIZADOS CON EL SERVICIO, O DE OTRA MANERA EN CONEXIÓN CON CUALQUIER DISPOSICIÓN DE ESTOS TÉRMINOS).\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eLa responsabilidad total de la Empresa bajo este acuerdo no excederá el mayor de: (a) el total de la cantidad pagada por usted por el Servicio durante los 12 meses anteriores a la reclamación; o (b) $20.00 (veinte dólares).\ 003c/h3\u003e\n\n\u003cp\u003eEl Servicio o algunas partes del Servicio están disponibles solo con una Suscripción paga. Se le facturará por adelantado de forma recurrente (mensual o anual), dependiendo del tipo de plan de suscripción que seleccione.\u003c/p\u003e\n\n\u003cp\u003eAl final de cada período, su Suscripción se renovará automáticamente bajo las mismas condiciones a menos que usted la cancele o la Empresa la cancele.\u003c/p\u003e\n\n\u003ch3\u003eCancelación de Suscripción\u003c/h3\u003e\n\n\u003cp\u003eUsted puede cancelar la renovación de su Suscripción a través de la configuración de su Cuenta o poniéndose en contacto con nosotros. No recibirá un reembolso por las tarifas ya pagadas por el período de suscripción actual y puede acceder al Servicio hasta el final del período actual.\u003c/p\u003e\n\n\u003ch3\u003eCambios en los Precios\u003c/h3\u003e\n\n\u003cp\u003eLa Empresa puede, a su exclusivo criterio, modificar los precios de suscripción en cualquier momento. Cualquier cambio entrará en vigencia al final del período de suscripción actual.\u003c/p\u003e\n\n\u003ch3\u003eReembolsos\u003c/h3\u003e\n\n\u003cp\u003eExcepto cuando lo exija la ley, las tarifas de suscripción pagadas no son reembolsables. Los reembolsos pueden ser considerados caso por caso a discreción exclusiva de la Empresa.\u003c/p\u003e\n\n\u003ch3\u003ePrueba Gratuita\u003c/h3\u003e\n\n\u003cp\u003eLa Empresa puede ofrecer una prueba gratuita por un tiempo limitado. Al final del período de prueba, se le cobrará automáticamente las tarifas de suscripción a menos que cancele antes del final del período de prueba.\u003c/p\u003e\n\n\u003cp\u003e© 2026 INCODE TECH. Todos los derechos reservados.\u003c/p\u003e","label":"Copyright","languageLabel":"Español"},{"documentType":"terms_of_use","language":"FR","content":"\u003ch2\u003eConditions d’Utilisation\u003c/h2\u003e\n\n\u003cp\u003eDernière mise à jour : 20 janvier 2026\u003c/p\u003e\n\n\u003cp\u003eVeuillez lire attentivement ces Condi
