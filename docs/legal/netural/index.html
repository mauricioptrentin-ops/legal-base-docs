<script type="application/json" id="documents">[{"documentType":"eula","language":"PT","content":"\u003ch2\u003eContrato de Licença de Usuário Final (\"Contrato\")\u003c/h2\u003e\n\n\u003cp\u003eÚltima atualização: 20 de janeiro de 2026\u003c/p\u003e\n\n\u003cp\u003eLeia este Contrato de Licença do Usuário Final com atenção antes de clicar no botão \"Concordo\", baixando ou usando NETURAL.\u003c/p\u003e\n\n\u003ch2\u003eInterpretação e Definições\u003c/h2\u003e\n\n\u003ch3\u003eInterpretação\u003c/h3\u003e\n\n\u003cp\u003eAs palavras cuja letra inicial é maiúscula têm significados definidos nas seguintes condições. As seguintes definições devem ter o mesmo significado, independentemente de aparecerem no singular ou no plural.\u003c/p\u003e\n\n\u003ch3\u003eDefinições\u003c/h3\u003e\n\n\u003cp\u003ePara os fins deste Contrato de Licença de Usuário Final:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eContrato\u003c/strong\u003e significa este Contrato de Licença de Usuário Final que constitui o contrato integral entre Você e a Empresa com relação ao uso do Aplicativo.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAplicativo\u003c/strong\u003e significa o programa de software fornecido pela Empresa, denominado NETURAL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"Empresa\", \"Nós\", \"Nos\" ou \"Nossos\" neste Contrato) refere-se a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICAÇÃO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eConteúdo\u003c/strong\u003e refere-se a conteúdo como texto, imagens ou outras informações que podem ser postadas, carregadas, vinculadas ou de outra forma disponibilizadas por Você.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePaís\u003c/strong\u003e refere-se a: Brasil.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e significa qualquer dispositivo que pode acessar o Aplicativo, como um computador, um telefone celular ou um tablet digital.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServiços de Terceiros\u003c/strong\u003e significa quaisquer serviços ou conteúdo fornecidos por terceiros que podem ser exibidos, incluídos ou disponibilizados pelo Aplicativo.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVocê\u003c/strong\u003e significa o indivíduo que acessa ou usa o Aplicativo ou a empresa, ou outra pessoa jurídica em nome da qual esse indivíduo está acessando ou usando o Aplicativo, conforme aplicável.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eReconhecimento\u003c/h2\u003e\n\n\u003cp\u003eAo clicar no botão \"Concordo\", baixando ou usando o Aplicativo, Você concorda em obedecer aos termos e condições deste Acordo. Se não concordar com os termos deste Contrato, não clique no botão \"Concordo\", não baixe ou não use o aplicativo.\u003c/p\u003e\n\n\u003cp\u003eEste Contrato é um documento legal entre Você e a Empresa e rege o uso do Aplicativo disponibilizado a Você pela Empresa.\u003c/p\u003e\n\n\u003cp\u003eO Aplicativo é licenciado, não vendido, a Você pela Empresa para uso estritamente de acordo com os termos deste Contrato.\u003c/p\u003e\n\n\u003ch2\u003eLicença\u003c/h2\u003e\n\n\u003ch3\u003eEscopo da Licença\u003c/h3\u003e\n\n\u003cp\u003eA Empresa concede a Você uma licença revogável, não exclusiva, intransferível e limitada para baixar, instalar e usar o Aplicativo estritamente de acordo com os termos deste Contrato.\u003c/p\u003e\n\n\u003cp\u003eVocê só pode usar o Aplicativo em um Dispositivo de sua propriedade ou controle.\u003c/p\u003e\n\n\u003cp\u003eA licença concedida a você pela Empresa é exclusivamente para fins pessoais e não comerciais estritamente de acordo com os termos deste Contrato.\u003c/p\u003e\n\n\u003ch3\u003eRestrições de Licença\u003c/h3\u003e\n\n\u003cp\u003eVocê concorda em não fazer e não permitirá que outr s decorrente ou relacionada ao Aplicativo.\u003c/p\u003e\n\n\u003ch2\u003eSuas Sugestões\u003c/h2\u003e\n\n\u003cp\u003eQualquer feedback, comentários, ideias, melhorias ou sugestões fornecidas por você à empresa com relação ao aplicativo devem permanecer como propriedade única e exclusiva da empresa.\u003c/p\u003e\n\n\u003cp\u003eA Empresa estará livre para usar, copiar, modificar, publicar ou redistribuir as sugestões para qualquer finalidade e de qualquer forma, sem qualquer crédito ou compensação para você.\u003c/p\u003e\n\n\u003ch2\u003eModificações no Aplicativo\u003c/h2\u003e\n\n\u003cp\u003eA Empresa reserva-se o direito de modificar, suspender ou descontinuar, temporária ou permanentemente, o Aplicativo ou qualquer serviço ao qual se conecte, com ou sem aviso prévio e sem responsabilidade para com Você.\u003c/p\u003e\n\n\u003ch3\u003eAtualizações do Aplicativo\u003c/h3\u003e\n\n\u003cp\u003eA Empresa pode, de tempos em tempos, fornecer aprimoramentos ou melhorias nos recursos/funcionalidades do Aplicativo, que podem incluir patches, correções de bugs, atualizações, upgrades e outras modificações.\u003c/p\u003e\n\n\u003cp\u003eVocê concorda que a Empresa não tem obrigação de fornecer quaisquer Atualizações ou continuar a fornecer ou habilitar quaisquer recursos e/ou funcionalidades específicas do Aplicativo para Você.\u003c/p\u003e\n\n\u003ch3\u003eManutenção e Suporte\u003c/h3\u003e\n\n\u003cp\u003eA Empresa não fornece qualquer manutenção ou suporte para o download e uso do Aplicativo.\u003c/p\u003e\n\n\u003ch2\u003eServiços de Terceiros\u003c/h2\u003e\n\n\u003cp\u003eO Aplicativo pode exibir, incluir ou disponibilizar conteúdo de terceiros ou fornecer links para sites ou serviços de terceiros.\u003c/p\u003e\n\n\u003cp\u003eVocê reconhece e concorda que a Empresa não será responsável por quaisquer Serviços de Terceiros, incluindo sua precisão, integridade, oportunidade, validade, conformidade de direitos autorais, legalidade, decência, qualidade ou qualquer outro aspecto dos mesmos.\u003c/p\u003e\n\n\u003ch2\u003eVigência e Rescisão\u003c/h2\u003e\n\n\u003cp\u003eEste Contrato permanecerá em vigor até ser rescindido por Você ou pela Empresa.\u003c/p\u003e\n\n\u003cp\u003eA Empresa pode, a seu exclusivo critério, a qualquer momento e por qualquer ou nenhum motivo, suspender ou rescindir este Contrato com ou sem aviso prévio.\u003c/p\u003e\n\n\u003cp\u003eEste Acordo será rescindido imediatamente, sem aviso prévio da Empresa, no caso de você deixar de cumprir qualquer disposição deste Acordo.\u003c/p\u003e\n\n\u003cp\u003eApós a rescisão deste Contrato, Você deve interromper todo o uso do Aplicativo e excluir todas as cópias do Aplicativo do seu dispositivo.\u003c/p\u003e\n\n\u003ch2\u003eIndenização\u003c/h2\u003e\n\n\u003cp\u003eVocê concorda em indenizar, defender e isentar a Empresa, suas afiliadas, diretores, funcionários, agentes, licenciadores e fornecedores de e contra todas e quaisquer reclamações, responsabilidades, danos, julgamentos, custos e despesas (incluindo honorários advocatícios razoáveis) decorrentes de ou relacionados a:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eseu uso do Serviço;\u003c/li\u003e\n    \u003cli\u003equalquer violação destes Termos por você;\u003c/li\u003e\n    \u003cli\u003equalquer conteúdo que você postar ou transmitir através do Serviço;\u003c/li\u003e\n    \u003cli\u003esua violação de qualquer lei, regra ou regulamento aplicável;\u003c/li\u003e\n    \u003cli\u003esua violação dos direitos de terceiros.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eSem Garantias\u003c/h2\u003e\n\n\u003cp\u003eO SERVIÇO É FORNECIDO \"COMO ESTÁ\" E \"CONFORME DISPONÍVEL\", SEM GARANTIAS DE QUALQUER TIPO, EXPRESSAS OU IMPLÍCITAS, INCLUINDO, MAS NÃO LIMITADO A, GARANTIAS IMPLÍCITAS DE COMERCIALIZAÇÃO, ADEQUAÇÃO A UM DETERMINADO FIM E NÃO VIOLAÇÃO.\u003c/p\u003e\n\n\u003cp\u003eA EMPRESA NÃO GARANTE QUE: (A) O SERVIÇO ATENDERÁ SUAS NECESSIDADES; (B) O SERVIÇO SERÁ ININTERRUPTO, OPORTUNO, SEGURO OU LIVRE DE ERROS; (C) OS RESULTADOS OBTIDOS DO USO DO SERVIÇO SERÃO PRECISOS OU CONFIÁVEIS; OU (D) A QUALIDADE DE QUAISQUER PRODUTOS, SERVIÇOS, INFORMAÇÕES OU OUTROS MATERIAIS OBTIDOS ATRAVÉS DO SERVIÇO ATENDERÁ SUAS EXPECTATIVAS.\u003c/p\u003e\n\n\u003ch2\u003eLimitação de Responsabilidade\u003c/h2\u003e\n\n\u003cp\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, EM NENHUM CASO A EMPRESA OU SEUS FORNECEDORES SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS OU CONSEQUENTES DE QUALQUER NATUREZA (INCLUINDO, MAS NÃO LIMITADO A, DANOS POR PERDA DE LUCROS, PERDA DE DADOS OU OUTRAS INFORMAÇÕES, POR INTERRUPÇÃO DE NEGÓCIOS, POR LESÃO PESSOAL, PERDA DE PRIVACIDADE DECORRENTE DE OU DE QUALQUER FORMA RELACIONADA AO USO OU INCAPACIDADE DE USAR O SERVIÇO, SOFTWARE DE TERCEIROS E/OU HARDWARE DE TERCEIROS USADO COM O SERVIÇO, OU DE OUTRA FORMA EM CONEXÃO COM QUALQUER DISPOSIÇÃO DESTES TERMOS).\u003c/p\u003e\n\n\u003cp\u003eA responsabilidade total da Empresa sob este acordo não excederá o maior valor entre: (a) o valor total pago por Você pelo Serviço durante os 12 meses anteriores à reclamação; ou (b) R$ 100,00 (cem reais).\u003c/p\u003e\n\n\u003ch2\u003eLei Aplicável\u003c/h2\u003e\n\n\u003cp\u003eEstes Termos serão regidos e interpretados de acordo com as leis da República Federativa do Brasil, sem considerar suas disposições sobre conflitos de leis.\u003c/p\u003e\n\n\u003cp\u003eQualquer disputa decorrente ou relacionada a estes Termos será submetida à jurisdição exclusiva dos tribunais da cidade de São Paulo, Estado de São Paulo, Brasil, e as partes renunciam irrevogavelmente a qualquer objeção à jurisdição de tais tribunais.\u003c/p\u003e\n\n\u003ch2\u003eContato\u003c/h2\u003e\n\n\u003cp\u003eSe você tiver alguma dúvida sobre este Contrato, você pode entrar em contato conosco:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eE-mail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eVisitando esta página: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eConformidade com a LGPD\u003c/h2\u003e\n\n\u003cp\u003eEste documento está em conformidade com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018) e suas atualizações, incluindo:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eNotificação de Incidentes\u003c/strong\u003e: Prazo de 3 (três) dias úteis para comunicação à ANPD e aos titulares afetados.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eTransferências Internacionais de Dados\u003c/strong\u003e: As transferências de dados pessoais para outros países devem utilizar cláusulas contratuais padrão aprovadas pela ANPD.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDireitos dos Titulares\u003c/strong\u003e: Você tem direito a acesso, correção, portabilidade, eliminação e revogação de consentimento a qualquer momento.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEncarregado de Proteção de Dados (DPO)\u003c/strong\u003e: Informações de contato disponíveis publicamente.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePenalidades\u003c/strong\u003e: Até 2% da receita anual da empresa no Brasil ou R$ 50 milhões por violação.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eAssinaturas e Pagamentos\u003c/h2\u003e\n\n\u003ch3\u003ePeríodo de Assinatura\u003c/h3\u003e\n\n\u003cp\u003eO Serviço ou algumas partes do Serviço estão disponíveis apenas com uma Assinatura paga. Você será cobrado antecipadamente em uma base recorrente (mensal ou anual), dependendo do tipo de plano de assinatura que você selecionar.\u003c/p\u003e\n\n\u003cp\u003eNo final de cada período, sua Assinatura será renovada automaticamente sob as mesmas condições, a menos que você a cancele ou a Empresa a cancele.\u003c/p\u003e\n\n\u003ch3\u003eCancelamento de Assinatura\u003c/h3\u003e\n\n\u003c tuguês"},{"documentType":"terms_and_conditions","language":"PT","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003eTermos e Condições\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003eTermos e Condições\u003c/h2\u003e\n    \u003cp\u003eÚltima atualização: 20 de janeiro de 2026\u003c/p\u003e\n    \u003cp\u003ePor favor, leia estes termos e condições cuidadosamente antes de usar nosso serviço.\u003c/p\u003e\n    \n    \u003ch2\u003eInterpretação e Definições\u003c/h2\u003e\n    \u003ch3\u003eInterpretação\u003c/h3\u003e\n    \u003cp\u003eAs palavras cuja letra inicial é maiúscula têm significados definidos nas seguintes condições. As seguintes definições devem ter o mesmo significado, independentemente de aparecerem no singular ou no plural.\u003c/p\u003e\n\n    \u003ch3\u003eDefinições\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eAplicativo\u003c/strong\u003e significa o programa de software fornecido pela Empresa, denominado NETURAL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAfiliado\u003c/strong\u003e significa uma entidade que controla, é controlada ou está sob o controle comum de uma parte, onde \"controle\" significa a propriedade de 50% ou mais das ações.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eConta\u003c/strong\u003e significa uma conta única criada para Você acessar nosso Serviço ou partes de nosso Serviço.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePaís\u003c/strong\u003e refere-se a: Brasil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"Empresa\", \"Nós\", \"Nos\" ou \"Nossos\" neste Contrato) refere-se a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICAÇÃO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eConteúdo\u003c/strong\u003e refere-se a conteúdo como texto, imagens ou outras informações que podem ser postadas, carregadas, vinculadas ou de outra forma disponibilizadas por Você.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e significa qualquer dispositivo que pode acessar o Serviço.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServiço\u003c/strong\u003e refere-se ao Aplicativo, ao Site ou a ambos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTermos e Condições\u003c/strong\u003e (também chamados de \"Termos\") significa estes Termos e Condições que constituem o acordo completo entre Você e a Empresa.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e refere-se ao NETURAL, acessível em \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVocê\u003c/strong\u003e significa o indivíduo que acessa ou usa o Serviço, ou a empresa ou outra pessoa jurídica em nome da qual esse indivíduo está acessando ou usando o Serviço.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eReconhecimento\u003c/h2\u003e\n    \u003cp\u003eEstes são os Termos e Condições que regem o uso deste Serviço e do contrato que opera entre Você e a Empresa. Estes Termos e Condições estabelecem os direitos e obrigações de todos os usuários em relação ao uso do Serviço.\u003c/p\u003e\n    \u003cp\u003eSeu acesso e uso do Serviço estão condicionados à sua aceitação e conformidade com estes Termos e Condições. Estes Termos e Condições se aplicam a todos os visitantes, usuários e outras pessoas que acessam ou usam o Serviço.\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eAo acessar ou usar o Serviço, você concorda em obedecer a estes Termos e Condições. Se você discordar de qualquer parte destes Termos e Condições, você não poderá acessar o Serviço.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eVocê declara que tem mais de 18 anos. A Empresa não permite que menores de 18 anos usem o Serviço.\u003c/p\u003e\n    \u003cp\u003eSeu acesso e uso do Serviço também estão condicionados à sua aceitação e conformidade com a Política de Privacidade da Empresa.\u003c/p\u003e\n\n    \u003ch2\u003eContas de Usuário\u003c/h2\u003e\n    \u003cp\u003eAo criar uma conta conosco, você deve nos fornecer informações precisas, completas e atuais em todos os momentos. A falha em fazê-lo constitui uma violação dos Termos.\u003c/p\u003e\n    \u003cp\u003eVocê é responsável por proteger a senha que usa para acessar o Serviço e por quaisquer atividades ou ações sob sua senha.\u003c/p\u003e\n    \u003cp\u003eVocê concorda em não divulgar sua senha a terceiros. Você deve nos notificar imediatamente ao tomar conhecimento de qualquer violação de segurança ou uso não autorizado de sua conta.\u003c/p\u003e\n\n    \u003ch2\u003eAssinaturas e Pagamentos\u003c/h2\u003e\n    \u003ch3\u003ePeríodo de Assinatura\u003c/h3\u003e\n    \u003cp\u003eO Serviço ou algumas partes do Serviço estão disponíveis apenas com uma Assinatura paga. Você será cobrado antecipadamente em uma base recorrente (mensal ou anual), dependendo do tipo de plano de assinatura que você selecionar.\u003c/p\u003e\n    \u003cp\u003eNo final de cada período, sua Assinatura será renovada automaticamente sob as mesmas condições, a menos que você a cancele ou a Empresa a cancele.\u003c/p\u003e\n\n    \u003ch3\u003eCancelamento de Assinatura\u003c/h3\u003e\n    \u003cp\u003eVocê pode cancelar a renovação de sua Assinatura através das configurações de sua Conta ou entrando em contato conosco. Você não receberá um reembolso pelas taxas já pagas pelo período de assinatura atual e poderá acessar o Serviço até o final do período atual.\u003c/p\u003e\n\n    \u003ch3\u003eAlterações de Preço\u003c/h3\u003e\n    \u003cp\u003eA Empresa pode, a seu exclusivo critério, modificar os preços de assinatura a qualquer momento. Qualquer alteração entrará em vigor no final do período de assinatura atual.\u003c/p\u003e\n\n    \u003ch3\u003eReembolsos\u003c/h3\u003e\n    \u003cp\u003eExceto quando exigido por lei, as taxas de assinatura pagas não são reembolsáveis. Reembolsos podem ser considerados caso a caso a critério exclusivo da Empresa.\u003c/p\u003e\n\n    \u003ch3\u003eTeste Gratuito\u003c/h3\u003e\n    \u003cp\u003eA Empresa pode oferecer uma avaliação gratuita por tempo limitado. No final do período de avaliação, você será cobrado automaticamente pelas taxas de assinatura, a menos que cancele antes do término do período de avaliação.\u003c/p\u003e\n\n    \u003ch2\u003eConteúdo do Usuário\u003c/h2\u003e\n    \u003cp\u003eNosso Serviço permite que Você publique Conteúdo. Você é responsável pelo Conteúdo que publica no Serviço, incluindo sua legalidade, confiabilidade e adequação.\u003c/p\u003e\n    \u003cp\u003eAo publicar Conteúdo no Serviço, Você nos concede o direito e a licença de usar, modificar, executar publicamente, exibir publicamente, reproduzir e distribuir tal Conteúdo no e através do Serviço.\u003c/p\u003e\n    \u003cp\u003eVocê declara e garante que: (i) o Conteúdo é seu ou você tem o direito de usá-lo e nos conceder os direitos e licença conforme previsto nestes Termos, e (ii) a publicação de seu Conteúdo no ou através do Serviço não viola os direitos de privacidade, direitos de publicidade, direitos autorais, direitos contratuais ou quaisquer outros direitos de qualquer pessoa.\u003c/p\u003e\n\n    \u003ch2\u003ePropriedade Intelectual\u003c/h2\u003e\n    \u003cp\u003eO Serviço e seu conteúdo original (excluindo o Conteúdo fornecido por Você ou outros usuários), recursos e funcionalidades são e permanecerão propriedade exclusiva da Empresa e seus licenciadores.\u003c/p\u003e\n    \u003cp\u003eO Serviço é protegido por direitos autorais, marcas registradas e outras leis tanto do Brasil quanto de países estrangeiros.\u003c/p\u003e\n    \u003cp\u003eNossas marcas comerciais e trade dress não podem ser usados em conexão com qualquer prod s à reclamação; ou (b) R$ 100,00 (cem reais).\u003c/p\u003e\n\n    \u003ch2\u003eIsenção de Garantias\u003c/h2\u003e\n    \u003cp\u003eO SERVIÇO É FORNECIDO \"COMO ESTÁ\" E \"CONFORME DISPONÍVEL\", SEM GARANTIAS DE QUALQUER TIPO, EXPRESSAS OU IMPLÍCITAS, INCLUINDO, MAS NÃO LIMITADO A, GARANTIAS IMPLÍCITAS DE COMERCIALIZAÇÃO, ADEQUAÇÃO A UM DETERMINADO FIM E NÃO VIOLAÇÃO.\u003c/p\u003e\n    \u003cp\u003eA EMPRESA NÃO GARANTE QUE: (A) O SERVIÇO ATENDERÁ SUAS NECESSIDADES; (B) O SERVIÇO SERÁ ININTERRUPTO, OPORTUNO, SEGURO OU LIVRE DE ERROS; (C) OS RESULTADOS OBTIDOS DO USO DO SERVIÇO SERÃO PRECISOS OU CONFIÁVEIS; OU (D) A QUALIDADE DE QUAISQUER PRODUTOS, SERVIÇOS, INFORMAÇÕES OU OUTROS MATERIAIS OBTIDOS ATRAVÉS DO SERVIÇO ATENDERÁ SUAS EXPECTATIVAS.\u003c/p\u003e\n\n    \u003ch2\u003eAceitação pelo Uso\u003c/h2\u003e\n    \u003cp\u003eAO ACESSAR, BAIXAR, INSTALAR OU USAR O SERVIÇO, VOCÊ RECONHECE QUE LEU, ENTENDEU E CONCORDA EM FICAR VINCULADO A ESTES TERMOS. SE VOCÊ NÃO CONCORDAR COM ESTES TERMOS, NÃO ACESSE OU USE O SERVIÇO.\u003c/p\u003e\n    \u003cp\u003eO uso continuado do Serviço após quaisquer modificações nestes Termos constitui sua aceitação de tais modificações.\u003c/p\u003e\n\n    \u003ch2\u003eLei Aplicável\u003c/h2\u003e\n    \u003cp\u003eEstes Termos serão regidos e interpretados de acordo com as leis da República Federativa do Brasil, sem considerar suas disposições sobre conflitos de leis.\u003c/p\u003e\n    \u003cp\u003eQualquer disputa decorrente ou relacionada a estes Termos será submetida à jurisdição exclusiva dos tribunais da cidade de São Paulo, Estado de São Paulo, Brasil, e as partes renunciam irrevogavelmente a qualquer objeção à jurisdição de tais tribunais.\u003c/p\u003e\n\n    \u003ch2\u003eResolução de Disputas\u003c/h2\u003e\n    \u003cp\u003eSe você tiver qualquer preocupação ou disputa sobre o Serviço, você concorda em primeiro tentar resolver a disputa informalmente entrando em contato com a Empresa.\u003c/p\u003e\n\n    \u003ch2\u003eDisposições Gerais\u003c/h2\u003e\n    \u003ch3\u003eRenúncia\u003c/h3\u003e\n    \u003cp\u003eA falha da Empresa em aplicar qualquer direito ou disposição destes Termos não será considerada uma renúncia a esses direitos.\u003c/p\u003e\n\n    \u003ch3\u003eDivisibilidade\u003c/h3\u003e\n    \u003cp\u003eSe qualquer disposição destes Termos for considerada inaplicável ou inválida, tal disposição será alterada e interpretada para atingir os objetivos de tal disposição na maior extensão possível sob a lei aplicável e as disposições restantes continuarão em pleno vigor e efeito.\u003c/p\u003e\n\n    \u003ch3\u003eAcordo Integral\u003c/h3\u003e\n    \u003cp\u003eEstes Termos constituem o acordo integral entre Você e a Empresa com relação ao uso do Serviço e substituem todos os acordos anteriores e contemporâneos.\u003c/p\u003e\n\n    \u003ch2\u003eContato\u003c/h2\u003e\n    \u003cp\u003eSe você tiver alguma dúvida sobre estes Termos e Condições, você pode entrar em contato conosco:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eE-mail:\u003c/strong\u003e info@incodetech.com.br\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVisitando esta página:\u003c/strong\u003e \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eConformidade com a LGPD\u003c/h2\u003e\n    \u003cp\u003eEste documento está em conformidade com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018) e suas atualizações, incluindo:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eResolução CD/ANPD nº 19/2024:\u003c/strong\u003e Regras para transferência internacional de dados pessoais.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eNotificação de Incidentes:\u003c/strong\u003e Prazo de 3 (três) dias úteis para comunicação à ANPD e aos titulares afetados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDireitos dos Titulares:\u003c/strong\u003e Acesso, correção, portabilidade, eliminação e revogação de consentimento.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEncarregado de Proteção de Dados (DPO):\u003c/strong\u003e Informações de contato disponíveis publicamente.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eAs penalidades por violação da LGPD podem chegar a 2% da receita anual da Empresa no Brasil ou R$ 50 milhões por violação.\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e","label":"Terms and Conditions","languageLabel":"Português"},{"documentType":"terms_and_conditions","language":"ES","content":"\u003ch2\u003eTérminos y Condiciones\u003c/h2\u003e\n\n\u003cp\u003eÚltima actualización: 20 de enero de 2026\u003c/p\u003e\n\n\u003cp\u003ePor favor, lea estos términos y condiciones cuidadosamente antes de usar nuestro servicio.\u003c/p\u003e\n\n\u003ch2\u003eInterpretación y Definiciones\u003c/h2\u003e\n\n\u003ch3\u003eInterpretación\u003c/h3\u003e\n\n\u003cp\u003eLas palabras cuya letra inicial es mayúscula tienen significados definidos en las siguientes condiciones. Las siguientes definiciones deben tener el mismo significado, independientemente de aparecer en singular o plural.\u003c/p\u003e\n\n\u003ch3\u003eDefiniciones\u003c/h3\u003e\n\n\u003cp\u003ePara los fines de estos Términos y Condiciones:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eAplicación\u003c/strong\u003e significa el programa de software proporcionado por la Empresa, denominado NETURAL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAfiliado\u003c/strong\u003e significa una entidad que controla, es controlada o está bajo el control común de una parte, donde \"control\" significa la propiedad de 50% o más de las acciones.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCuenta\u003c/strong\u003e significa una cuenta única creada para usted para acceder a nuestro Servicio o partes de nuestro Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePaís\u003c/strong\u003e se refiere a: Brasil.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"Empresa\", \"Nosotros\" o \"Nuestro\" en este contrato) se refiere a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SÃO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eContenido\u003c/strong\u003e se refiere a contenido como texto, imágenes u otra información que puede ser publicada, cargada, vinculada o de cualquier otra forma proporcionada por usted.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e significa cualquier dispositivo que pueda acceder al Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServicio\u003c/strong\u003e se refiere a la Aplicación, al Sitio o a ambos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eTérminos y Condiciones\u003c/strong\u003e (también llamados \"Términos\") significa estos Términos y Condiciones que constituyen el acuerdo completo entre usted y la Empresa.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSitio\u003c/strong\u003e se refiere a NETURAL, accesible en \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e significa el individuo que accede o utiliza el Servicio, o la empresa o entidad jurídica en nombre de la cual dicho individuo está accediendo o utilizando el Servicio.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eReconocimiento\u003c/h2\u003e\n\n\u003cp\u003eEstos son los Términos y Condiciones que rigen el uso de este Servicio y el contrato que opera entre usted y la Empresa. Estos Términos y Condiciones establecen los derechos y obligaciones de todos los usuarios en relación con el uso del Servicio.\u003c/p\u003e\n\n\u003cp\u003eSu acceso y uso del Servicio están condicionados a su aceptación y conformidad con estos Términos y Condiciones. Estos Términos y Condiciones se aplican a todos los visitantes, usuarios y otras personas que acceden o utilizan el Servicio.\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eAl acceder o usar el Servicio, usted acepta cumplir con estos Términos y Condiciones. Si no está de acuerdo con alguna parte de estos Términos y Condiciones, no podrá acceder al Servicio.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eUsted declara que tiene más de 18 años. La Empresa no permite que menores de 18 años utilicen el Servicio.\u003c/p\u003e\n\n\u003cp\u003eSu acceso y uso del Servicio también están condicionados a su aceptación y conformidad con la Política de Privacidad de la Empresa.\u003c/p\u003e\n\n\u003ch2\u003eContas de Usuario\u003c/h2\u003e\n\n\u003cp\u003eAl crear una cuenta con nosotros, debe proporcionar información precisa, completa y actual en todo momento. La falta de hacerlo constituye una violación de los Términos.\u003c/p\u003e\n\n\u003cp\u003eUsted es responsable de proteger la contraseña que utiliza para acceder al Servicio y de cualquier actividad o acción bajo su contraseña.\u003c/p\u003e\n\n\u003cp\u003eUsted acepta no divulgar su contraseña a terceros. Debe notificarnos de inmediato si toma conocimiento de cualquier violación de seguridad o uso no autorizado de su cuenta.\u003c/p\u003e\n\n\u003ch2\u003ePedidos de Bienes/Servicios\u003c/h2\u003e\n\n\u003cp\u003eEl Servicio o algunas partes del Servicio están disponibles solo con una Suscripción de pago. Se le facturará por adelantado de forma recurrente (mensual o anual), dependiendo del tipo de plan de suscripción que seleccione.\u003c/p\u003e\n\n\u003cp\u003eAl final de cada período, su Suscripción se renovará automáticamente bajo las mismas condiciones a menos que la cancele o la Empresa la cancele.\u003c/p\u003e\n\n\u003ch2\u003eAssinaturas\u003c/h2\u003e\n\n\u003cp\u003ePuede cancelar la renovación de su Suscripción a través de la configuración de su Cuenta o contactándonos. No recibirá un reembolso por las tarifas ya pagadas para el período de suscripción actual y puede acceder al Servicio hasta el final del período actual.\u003c/p\u003e\n\n\u003cp\u003eLa Empresa puede, a su sola discreción, modificar los precios de suscripción en cualquier momento. Cualquier cambio entrará en vigor al final del período actual de suscripción.\u003c/p\u003e\n\n\u003cp\u003eExcepto cuando sea requerido por la ley, las tarifas de suscripción pagadas no son reembolsables. Los reembolsos pueden considerarse caso por caso a la sola discreción de la Empresa.\u003c/p\u003e\n\n\u003cp\u003eLa Empresa puede ofrecer una prueba gratuita por un tiempo limitado. Al final del período de prueba, se le cobrará automáticamente las tarifas de suscripción a menos que cancele antes del final del período de prueba.\u003c/p\u003e\n\n\u003ch2\u003eConteúdo do Usuário\u003c/h2\u003e\n\n\u003cp\u003eNuestro Servicio permite que usted publique Contenido. Usted es responsable por el Contenido que publica en el Servicio, incluyendo su legalidad, fiabilidad y adecuación.\u003c/p\u003e\n\n\u003cp\u003eAl publicar Contenido en el Servicio, usted nos concede el derecho y la licencia de usar, modificar, ejecutar públicamente, mostrar públicamente, reproducir y distribuir tal Contenido en y a través del Servicio.\u003c/p\u003e\n\n\u003cp\u003eUsted declara y garantiza que: (i) el Contenido es suyo o usted tiene el derecho de usarlo y concedernos los derechos y licencia según lo previsto en estos Términos, y (ii) la publicación de su Contenido en o a través del Servicio no viola los derechos de privacidad, derechos de publicidad, derechos de autor, derechos contractuales o cualquier otro derecho de cualquier persona.\u003c/p\u003e\n\n\u003ch2\u003ePropriedade Intelectual\u003c/h2\u003e\n\n\u003cp\u003eEl Servicio y su contenido original (excluyendo el Contenido proporcionado por usted o otros usuarios), características y funcionalidades son y seguirán siendo propiedad exclusiva de la Empresa y sus licenciantes.\u003c/p\u003e\n\n\u003cp\u003eEl Servicio está protegido por derechos de autor, marcas registradas y otras leyes tanto de Brasil como de países extranjeros.\u003c/p\u003e\n\n\u003cp\u003eNuestras marcas comerciales y dress de comercio no pueden ser utilizadas en conexión con ningún producto o servicio sin el consentimiento previo por escrito de la Empresa.\u003c/p\u003e\n\n\u003ch2\u003eLinks para Outros Sites\u003c/h2\u003e\n\n\u003cp\u003eNuestro Servicio puede contener enlaces a sitios o servicios de terceros que no son propiedad o están controlados por la Empresa.\u003c/p\u003e\n\n\u003cp\u003eLa Empresa no tiene control y no asume ninguna responsabilidad por el contenido, políticas de privacidad o prácticas de cualesquiera sitios o servicios de terceros. Usted reconoce y acepta que la Empresa no será responsable, directa o indirectamente, por ningún daño o pérdida causada o supuestamente causada por o en conexión con el uso o confianza en tal contenido, bienes o servicios disponibles en o a través de tales sitios o servicios.\u003c/p\u003e\n\n\u003ch2\u003eRescisão\u003c/h2\u003e\n\n\u003cp\u003ePodemos rescindir o suspender su Cuenta inmediatamente, sin previo aviso ni responsabilidad, por cualquier motivo, incluyendo, sin limitación, si usted viola estos Términos y Condiciones.\u003c/p\u003e\n\n\u003cp\u003eTras la rescisión, su derecho a usar el Servicio cesará inmediatamente.\u003c/p\u003e\n\n\u003ch2\u003eLimitação de Responsabilidade\u003c/h2\u003e\n\n\u003cp\u003eA pesar de cualquier daño que usted pueda incurrir, la responsabilidad total de la Empresa y de cualquiera de sus proveedores bajo cualquier disposición de estos Términos y su recurso exclusivo por todo lo expuesto anteriormente será limitada al importe efectivamente pagado por usted a través del Servicio o 100 BRL si no ha comprado nada a través del Servicio.\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eEN LA MEDIDA MÁXIMA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES SERÁN RESPONSABLES POR CUALQUIER DAÑO ESPECIAL, INCIDENTAL, INDIRECTO O CONSECUENTE DE NINGÚN TIPO\u003c/strong\u003e (INCLUYENDO, PERO NO LIMITADO A, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS U OTRA INFORMACIÓN, POR INTERRUPCIÓN DEL NEGOCIO, POR LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD QUE SURJA DE O ESTÉ EN CUALQUIER MANERA RELACIONADO CON EL USO O INCAPACIDAD DE USAR EL SERVICIO, SOFTWARE DE TERCEROS Y/O HARDWARE DE TERCEROS UTILIZADO CON EL SERVICIO, O DE OTRA FORMA EN CONEXIÓN CON CUALQUIER DISPOSICIÓN DE ESTOS TÉRMINOS), AUNQUE LA EMPRESA O CUALQUIER PROVEEDOR HAYA SIDO NOTIFICADO DE LA POSIBILIDAD DE TALES DAÑOS Y AUNQUE EL RECURSO FALLA EN SU PROPÓSITO ESENCIAL.\u003c/p\u003e\n\n\u003ch2\u003eIsenção de Garantias\u003c/h2\u003e\n\n\u003cp\u003eEL SERVICIO SE PROPORCIONA \"COMO ESTÁ\" Y \"SEGÚN DISPONIBILIDAD\" SIN GARANTÍAS DE NINGÚN TIPO, EXPRESAS O IMPLÍCITAS, INCLUYENDO, PERO NO LIMITADO A, GARANTÍAS IMPLÍCITAS DE COMERCIABILIDAD, ADECUACIÓN PARA UN PROPÓSITO PARTICULAR Y NO INFRACCIÓN.\u003c/p\u003e\n\n\u003cp\u003eLA EMPRESA NO GARANTIZA QUE: (A) EL SERVICIO CUMPLIRÁ CON SUS REQUISITOS; (B) EL SERVICIO SERÁ ININTERUMPIDO, OPORTUNO, SEGURO O LIBRE DE ERRORES; (C) LOS RESULTADOS OBTENIDOS DEL USO DEL SERVICIO SERÁN PRECISOS O CONFIABLES; O (D) LA CALIDAD DE CUALQUIER PRODUCTO, SERVICIO, INFORMACIÓN O CUALQUIER OTRO MATERIAL OBTENIDO A TRAVÉS DEL SERVICIO CUMPLIRÁ CON SUS EXPECTATIVAS.\u003c/p\u003e\n\n\u003ch2\u003eLei Aplicável\u003c/h2\u003e\n\n\u003cp\u003eEstos Términos se regirán e interpretarán de acuerdo con las leyes de la República Federativa de Brasil, sin tener en cuenta sus disposiciones sobre conflictos de leyes.\u003c/p\u003e\n\n\u003ch2\u003eResolução de Disputas\u003c/h2\u003e\n\n\u003cp\u003eSi usted tiene alguna preocupación o disputa sobre el Servicio, acepta intentar resolver la disputa de manera informal contacta    \u003cli\u003e\u003cstrong\u003eDerechos de los Titulares\u003c/strong\u003e: Acceso, corrección, portabilidad, eliminación y revocación del consentimiento.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDelegado de Protección de Datos (DPO)\u003c/strong\u003e: Información de contacto disponible públicamente.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eUsted asume toda la responsabilidad y riesgo por su uso del Servicio. EL SERVICIO SE PROPORCIONA \"COMO ESTÁ\" SIN GARANTÍAS DE NINGÚN TIPO. LA EMPRESA NO SERÁ RESPONSABLE POR NINGÚN DAÑO RESULTANTE DEL USO O INCAPACIDAD DE USAR EL SERVICIO, INCLUYENDO DAÑOS CAUSADOS POR MALWARE, VIRUS O CUALQUIER PROGRAMA INFORMÁTICO INCORRECTO O INCOMPLETO.\u003c/p\u003e\n\n\u003cp\u003eLas sanciones por violaciones a la LGPD pueden alcanzar el 2% de los ingresos anuales de Brasil o hasta 50 millones de BRL por violación.\u003c/p\u003e","label":"Terms and Conditions","languageLabel":"Español"},{"documentType":"disclaimer","language":"FR","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003eDisclaimer de NETURAL\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003eExonération de Responsabilité\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eDernière mise à jour:\u003c/strong\u003e 20 janvier 2026\u003c/p\u003e\n\n    \u003ch2\u003eInterprétation et Définitions\u003c/h2\u003e\n\n    \u003ch3\u003eInterprétation\u003c/h3\u003e\n    \u003cp\u003eLes mots dont la première lettre est en majuscule ont des significations définies dans les conditions suivantes. Les définitions suivantes doivent avoir le même sens, qu'elles apparaissent au singulier ou au pluriel.\u003c/p\u003e\n\n    \u003ch3\u003eDéfinitions\u003c/h3\u003e\n    \u003cp\u003eAux fins de cette exonération de responsabilité :\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eEntreprise\u003c/strong\u003e (appelée \"l'Entreprise\", \"Nous\", \"Notre\" dans cette exonération de responsabilité) fait référence à MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRÉSIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eService\u003c/strong\u003e fait référence au site, à l'application ou aux deux.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVous\u003c/strong\u003e signifie l'individu qui accède au Service, ou l'entreprise, ou une autre personne morale au nom de laquelle cet individu accède ou utilise le Service, selon le cas.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e fait référence à NETURAL, accessible à https://www.incodetech.com.br/contact.html.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eApplication\u003c/strong\u003e signifie le programme de logiciel fourni par l'Entreprise dénommé NETURAL.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eExonération de Responsabilité Générale\u003c/h2\u003e\n    \u003cp\u003eLes informations contenues dans le Service sont fournies uniquement à des fins d'information générale.\u003c/p\u003e\n    \u003cp\u003eL'ENTREPRISE NE PREND AUCUNE RESPONSABILITÉ POUR DES ERREURS OU OMISSIONS DANS LE CONTENU DU SERVICE.\u003c/p\u003e\n    \u003cp\u003eEN AUCUN CAS, L'ENTREPRISE NE SERA RESPONSABLE DES DOMMAGES SPÉCIAUX, DIRECTS, INDIRECTS, CONSÉCUTIFS OU INCIDENTAUX OU DE TOUS DOMMAGES, QUE CE SOIT EN VERTU D'UNE ACTION CONTRACTUELLE, D'UNE NÉGLIGENCE OU D'AUTRE ACTE ILLICITE, DÉCOULANT DE OU EN LIEN AVEC L'UTILISATION DU SERVICE OU DU CONTENU DU SERVICE.\u003c/p\u003e\n    \u003cp\u003eL'ENTREPRISE RESERVE LE DROIT D'APPORTER DES AJOUTS, DES EXCLUSIONS OU DES MODIFICATIONS AU CONTENU DU SERVICE À TOUT MOMENT, SANS PRÉAVIS.\u003c/p\u003e\n    \u003cp\u003eL'ENTREPRISE NE GARANTIT PAS QUE LE SERVICE SOIT DÉNUÉ DE VIRUS OU D'AUTRES COMPOSANTS NUISIBLES.\u003c/p\u003e\n\n    \u003ch2\u003eExonération de Responsabilité de Liens Externes\u003c/h2\u003e\n    \u003cp\u003eLe Service peut contenir des liens vers des sites externes qui ne sont pas fournis ou maintenus par ou de quelque manière affiliés à l'Entreprise.\u003c/p\u003e\n    \u003cp\u003eVEUILLEZ NOTER QUE L'ENTREPRISE NE GARANTIT PAS L'EXACTITUDE, LA RELEVANCE, L'OPPORTUNITÉ OU L'INTÉGRALITÉ DES INFORMATIONS FOURNIES SUR CES SITES EXTERNES.\u003c/p\u003e\n\n    \u003ch2\u003eExonération de Responsabilité par Erreurs et Omisssions\u003c/h2\u003e\n    \u003cp\u003eLes informations fournies par le Service servent uniquement de guide général sur des sujets d'intérêt. Bien que l'Entreprise prenne toutes les précautions nécessaires pour garantir que le contenu du Service soit à jour et précis, des erreurs peuvent survenir. De plus, en raison de la nature changeante des lois, règles et réglementations, il peut y avoir des retards, omissions ou imprécisions dans les informations contenues dans le Service.\u003c/p\u003e\n    \u003cp\u003eL'ENTREPRISE NE SERA PAS RESPONSABLE DES ERREURS OU OMISSIONS, NI DES RÉSULTATS OBTENUS DANS L'UTILISATION DE CES INFORMATIONS.\u003c/p\u003e\n\n    \u003ch2\u003eExonération de Responsabilité de Usage Équitable\u003c/h2\u003e\n    \u003cp\u003eL'Entreprise peut utiliser du matériel protégé par des droits d'auteur qui n'a pas toujours été spécifiquement autorisé par le propriétaire des droits d'auteur. L'Entreprise met ce matériel à disposition à des fins de critique, de commentaire, de reportage, d'enseignement, de recherche ou d'étude.\u003c/p\u003e\n    \u003cp\u003eL'ENTREPRISE ESTIME QUE CECI CONSTITUE UN \"USAGE ÉQUITABLE\" DE TOUT MATÉRIAU PROTÉGÉ PAR DES DROITS D'AUTEUR, CONFORMÉMENT À LA SECTION 107 DE LA LOI SUR LE DROIT D'AUTEUR.\u003c/p\u003e\n    \u003cp\u003eSI VOUS SOUHAITEZ UTILISER DU MATÉRIAU PROTÉGÉ PAR DES DROITS D'AUTEUR DU SERVICE À DES FINS PROPRES QUI DÉPASSENT L'USAGE ÉQUITABLE, VOUS DEVEZ OBTENIR L'AUTORISATION DU PROPRIÉTAIRE DES DROITS D'AUTEUR.\u003c/p\u003e\n\n    \u003ch2\u003eExonération de Responsabilité Explicite des Visions\u003c/h2\u003e\n    \u003cp\u003eLe Service peut contenir des points de vue et des opinions des auteurs qui ne reflètent pas nécessairement la politique officielle ou la position de tout autre auteur, agence, organisation, employeur ou entreprise, y compris l'Entreprise.\u003c/p\u003e\n    \u003cp\u003eLES COMMENTAIRES PUBLIÉS PAR LES UTILISATEURS SONT DE LEUR SEULE RESPONSABILITÉ ET LES UTILISATEURS ASSUMENT L'ENTIÈRE RESPONSABILITÉ, LA RESPONSABILITÉ ET LA FAUTE POUR TOUTE DIFFAMATION OU LITIGE QUI RÉSULTE DE QUOI QUE CE SOIT ÉCRIT OU PAR RÉSULTAT DIRECT D'UNE QUOI QUE CE SOIT ÉCRIT DANS UN COMMENTAIRE. L'ENTREPRISE N'EST PAS RESPONSABLE DES COMMENTAIRES PUBLIÉS PAR DES UTILISATEURS ET SE RESERVE LE DROIT DE SUPPRIMER DES COMMENTAIRES POUR QUELQUE RAISON QUE CE SOIT.\u003c/p\u003e\n\n    \u003ch2\u003eExonération de Responsabilité Professionnelle\u003c/h2\u003e\n    \u003cp\u003eLes informations sur le Service sont fournies avec la compréhension que l'Entreprise n'est pas impliquée dans la fourniture de services ou de conseils juridiques, comptables, fiscaux ou autres professionnels. En tant que tel, ces informations ne doivent pas être considérées comme un substitut à la consultation de conseillers professionnels en comptabilité, en fiscalité, en droit ou autres conseillers compétents.\u003c/p\u003e\n    \u003cp\u003eEN AUCUN CAS, L'ENTREPRISE OU SES FOURNISSEURS NE SERA RESPONSABLE D'AUCUN DOMMAGE SPÉCIAL, INCIDENTEL, INDIRECT OU CONSÉCUTIF DE QUELQUE NATURE QUE CE SOIT DÉCOULANT DE OU EN LIEN AVEC VOTRE ACCÈS OU UTILISATION, OU L'IMPOSSIBILITÉ D'ACCÉDER OU D'UTILISER LE SERVICE.\u003c/p\u003e\n\n    \u003ch2\u003eUtilisation à Vos Risques et Périls\u003c/h2\u003e\n    \u003cp\u003eToutes les informations sur le Service sont fournies \"en l'état\", sans garantie d'intégrité, d'exactitude, d'opportunité, ou des résultats obtenus avec l'utilisation de ces informations et sans garantie de quelque type que ce soit, expresse ou implicite, y compris, mais sans s'y limiter, des garanties de performance, de commercialité et d'adéquation à un but particulier.\u003c/p\u003e\n    \u003cp\u003eL'ENTREPRISE NE SERA PAS RESPONSABLE ENVERS VOUS OU TOUTE AUTRE PERSONNE POUR TOUTE DECISION OU ACTION ENTREPRISEE SUR LA BASE DES INFORMATIONS FOURNIES PAR LE SERVICE OU POUR DES DOMMAGES CONSÉCUTIFS, SPÉCIAUX OU SIMILAIRES, MÊME SI L'ENTREPRISE A ÉTÉ AVISÉE DE LA POSSIBILITÉ DE TELS DOMMAGES.\u003c/p\u003e\n\n    \u003ch2\u003eContact\u003c/h2\u003e\n    \u003cp\u003eSi vous avez des questions concernant cette exonération de responsabilité, vous pouvez nous contacter :\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eE-mail : \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003eVisitez notre page de contact : \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eici\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eConformité LGPD\u003c/h2\u003e\n    \u003cp\u003eCe document est conforme à la Loi Générale sur la Protection des Données du Brésil (LGPD - Loi n° 13.709/2018) et ses mises à jour, notamment :\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eRésolution CD/ANPD n° 19/2024\u003c/strong\u003e : Règles pour le transfert international de données personnelles\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eNotification d'Incidents\u003c/strong\u003e : Délai de 3 (trois) jours ouvrables pour notifier l'ANPD et les personnes concernées\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDroits des Personnes Concernées\u003c/strong\u003e : Accès, rectification, portabilité, suppression et révocation du consentement\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDélégué à la Protection des Données (DPO)\u003c/strong\u003e : Coordonnées publiquement disponibles\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eDes pénalités peuvent aller jusqu'à 2 % du chiffre te politique de cookies explique ce que sont les cookies et comment nous les utilisons. Vous devez lire cette politique pour comprendre quel type de cookies nous utilisons ou les informations que nous collectons à l'aide des cookies et comment ces informations sont utilisées.\u003c/p\u003e\n\n\u003cp\u003eLes cookies ne contiennent généralement pas d'informations qui identifient personnellement un utilisateur, mais les informations personnelles que nous stockons à votre sujet peuvent être liées aux informations stockées et obtenues dans les cookies. Pour plus d'informations sur la façon dont nous utilisons, stockons et protégeons vos données personnelles, veuillez consulter notre Politique de Confidentialité.\u003c/p\u003e\n\n\u003cp\u003eNous ne stockons pas d'informations personnelles sensibles, telles que des adresses postales, des mots de passe de comptes, etc. dans les cookies que nous utilisons.\u003c/p\u003e\n\n\u003ch2\u003eInterprétation et Définitions\u003c/h2\u003e\n\n\u003ch3\u003eInterprétation\u003c/h3\u003e\n\u003cp\u003eLes mots dont la première lettre est en majuscule ont des significations définies dans les conditions suivantes. Les définitions suivantes doivent avoir le même sens, qu'elles apparaissent au singulier ou au pluriel.\u003c/p\u003e\n\n\u003ch3\u003eDéfinitions\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eEntreprise\u003c/strong\u003e (appelée \"l'Entreprise\", \"Nous\", \"Notre\" ou \"Nos\" dans cette Politique de Cookies) fait référence à MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e désigne de petits fichiers qui sont placés sur votre ordinateur, appareil mobile ou tout autre dispositif par un site web, contenant des détails sur votre historique de navigation sur ce site au cours de vos différentes utilisations.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e fait référence à NETURAL, accessible à \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003econtact\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVous\u003c/strong\u003e signifie l'individu qui accède ou utilise le site, ou une entreprise, ou toute personne juridique au nom de laquelle cet individu accède ou utilise le site, le cas échéant.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eL'utilisation des Cookies\u003c/h2\u003e\n\n\u003ch3\u003eTypes de Cookies Utilisés\u003c/h3\u003e\n\u003cp\u003eLes cookies peuvent être \"Persistants\" ou \"de Session\". Les cookies persistants restent sur votre ordinateur personnel ou appareil mobile lorsque vous êtes hors ligne, tandis que les cookies de session sont supprimés dès que vous fermez le navigateur.\u003c/p\u003e\n\n\u003cp\u003eNous utilisons des cookies de session et persistants aux fins définies ci-dessous :\u003c/p\u003e\n\n\u003ch3\u003eCookies Essentiels\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eType :\u003c/strong\u003e Cookies de session\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAdministré par :\u003c/strong\u003e Nous\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eObjectif :\u003c/strong\u003e Ces cookies sont essentiels pour vous fournir les services disponibles via le site et vous permettre d'utiliser certaines de ses fonctionnalités. Ils aident à authentifier les utilisateurs et à prévenir l'utilisation frauduleuse des comptes utilisateurs. Sans ces cookies, les services que vous avez demandés ne peuvent être fournis et nous n'utilisons ces cookies que pour vous fournir ces services.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eCookies de Fonctionnalité\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eType :\u003c/strong\u003e Cookies persistants\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAdministré par :\u003c/strong\u00 003e\n\n\u003cp\u003eSi vous n'acceptez pas nos cookies, vous pourriez rencontrer certains inconvénients lors de l'utilisation du site et certaines fonctionnalités pourraient ne pas fonctionner correctement.\u003c/p\u003e\n\n\u003ch3\u003eComment Désactiver les Cookies\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eChrome :\u003c/strong\u003e \u003ca href=\"https://support.google.com/accounts/answer/32050\"\u003eInstructions pour Chrome\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eInternet Explorer :\u003c/strong\u003e \u003ca href=\"http://support.microsoft.com/kb/278835\"\u003eInstructions pour Internet Explorer\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eFirefox :\u003c/strong\u003e \u003ca href=\"https://support.mozilla.org/en-US/kb/delete-cookies-remove-info-websites-stored\"\u003eInstructions pour Firefox\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSafari :\u003c/strong\u003e \u003ca href=\"https://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac\"\u003eInstructions pour Safari\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eContenu Incorporé\u003c/h2\u003e\n\u003cp\u003eLe Service peut inclure du contenu intégré (par exemple, des vidéos, des images, des articles, etc.). Le contenu intégré d'autres sites se comporte exactement de la même manière que si le visiteur avait visité l'autre site.\u003c/p\u003e\n\u003cp\u003eCes sites peuvent collecter des données vous concernant, utiliser des cookies, intégrer un suivi supplémentaire de tiers et surveiller votre interaction avec ce contenu intégré, y compris le suivi de votre interaction avec le contenu intégré si vous possédez un compte et êtes connecté à ce site.\u003c/p\u003e\n\n\u003ch2\u003eConformité LGPD\u003c/h2\u003e\n\u003cp\u003eCe document est conforme à la Loi Générale sur la Protection des Données du Brésil (LGPD - Loi n° 13.709/2018) et ses mises à jour, notamment :\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eRésolution CD/ANPD n° 19/2024 :\u003c/strong\u003e Règles pour le transfert international de données personnelles\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotification d'Incidents :\u003c/strong\u003e Délai de 3 (trois) jours ouvrables pour notifier l'ANPD et les personnes concernées\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDroits des Personnes Concernées :\u003c/strong\u003e Accès, rectification, portabilité, suppression et révocation du consentement\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDélégué à la Protection des Données (DPO) :\u003c/strong\u003e Coordonnées publiquement disponibles\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eConditions de Service et Protection Juridique\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eLIMITATION DE RESPONSABILITÉ :\u003c/strong\u003e DANS LA MESURE MAXIMALE PERMISE PAR LA LOI APPLICABLE, EN AUCUN CAS L'ENTREPRISE OU SES FOURNISSEURS NE SERONT TENUS RESPONSABLES DES DOMMAGES SPÉCIAUX, ACCESSOIRES, INDIRECTS OU CONSÉCUTIFS QUELQU'EN SOIT (Y COMPRIS, MAIS SANS S'Y LIMITER, DES DOMMAGES POUR PERTE DE PROFITS, PERTE DE DONNÉES OU AUTRES INFORMATIONS, POUR INTERRUPTION D'ACTIVITÉ, POUR BLESSURE PERSONNELLE, PERTE DE CONFIDENTIALITÉ DÉCOULANT DE OU EN LIEN DANS TOUTE MESURE COMME RELATIF À L'UTILISATION OU À L'INCAPACITÉ D'UTILISER LE SERVICE, LOGICIEL TIERS ET / OU MATÉRIEL TIERS UTILISÉ AVEC LE SERVICE, OU AUTREMENT EN LIEN AVEC TOUTE DISPOSITION DE CE CONTRAT).\u003c/p\u003e\n\n\u003cp\u003eLa responsabilité totale de l'Entreprise en vertu du présent accord ne dépassera pas le montant le plus élevé entre : (a) le montant total payé par vous pour le Service durant les 12 mois précédant la réclamation ; ou (b) 20,00 $ (vingt dollars).\u003c/p\u003e\n\n\u003ch3\u003eIndemnisation\u003c/h3\u003e\n\u003cp\u003eVous acceptez d'indemniser, de défendre et de dégager l'Entreprise, ses filiales, administrateurs, employés, agents, concédants et f rheberrechtlich geschütztem Material darstellt, wie in Abschnitt 107 des US-Urheberrechtsgesetzes vorgesehen.\u003c/p\u003e\n\u003cp\u003eWenn Sie urheberrechtlich geschütztes Material des Dienstes für eigene Zwecke verwenden möchten, die über das Fair Use hinausgehen, müssen Sie die Erlaubnis des Urheberrechtsinhabers einholen.\u003c/p\u003e\n\n\u003ch2\u003eHaftungsausschluss für Ansichten\u003c/h2\u003e\n\n\u003cp\u003eDer Dienst kann Ansichten und Meinungen von Autoren enthalten und spiegelt nicht unbedingt die offizielle Politik oder Position eines anderen Autors, einer Agentur, Organisation, Arbeitgebers oder Unternehmens wider, einschließlich des Unternehmens.\u003c/p\u003e\n\u003cp\u003eDie von den Nutzern veröffentlichten Kommentare liegen in ihrer alleinigen Verantwortung, wobei die Nutzer die volle Verantwortung, Haftung und Schuld für etwaige Verleumdungen oder rechtliche Auseinandersetzungen übernehmen, die aus etwas resultieren, das in einem Kommentar geschrieben wurde oder direkt aus etwas, das in einem Kommentar geschrieben wurde. Das Unternehmen haftet nicht für Kommentare, die von Nutzern veröffentlicht werden, und behält sich das Recht vor, jeden Kommentar aus beliebigem Grund zu löschen.\u003c/p\u003e\n\n\u003ch2\u003eHaftungsausschluss für professionelle Beratung\u003c/h2\u003e\n\n\u003cp\u003eDie Informationen über den Dienst werden mit dem Verständnis bereitgestellt, dass das Unternehmen nicht an der Bereitstellung von rechtlichen, buchhalterischen, steuerlichen oder anderen professionellen Dienstleistungen und Beratungen beteiligt ist. Daher sollten sie nicht als Ersatz für die Konsultation professioneller Berater in den Bereichen Buchhaltung, Steuern, Recht oder andere kompetente Berater verwendet werden.\u003c/p\u003e\n\u003cp\u003eIn keinem Fall sind das Unternehmen oder seine Anbieter für spezielle, zufällige, indirekte oder Folgeschäden jeglicher Art verantwortlich, die aus oder im Zusammenhang mit Ihrem Zugriff oder Ihrer Nutzung oder Ihrer Unfähigkeit, auf den Dienst zuzugreifen oder ihn zu nutzen, entstehen.\u003c/p\u003e\n\n\u003ch2\u003eVerwendung auf eigene Gefahr\u003c/h2\u003e\n\n\u003cp\u003eAlle Informationen im Dienst werden \"wie sie sind\" bereitgestellt, ohne Garantie für Vollständigkeit, Genauigkeit, Aktualität oder der Ergebnisse, die aus der Nutzung dieser Informationen entstehen, und ohne Garantie jeglicher Art, weder ausdrücklich noch stillschweigend, einschließlich, aber nicht beschränkt auf Gewährleistungen der Leistungsfähigkeit, der Marktgängigkeit und der Eignung für einen bestimmten Zweck.\u003c/p\u003e\n\u003cp\u003eDas Unternehmen ist Ihnen oder einer anderen Person gegenüber nicht verantwortlich für Entscheidungen oder Handlungen, die auf Informationen beruhen, die vom Dienst bereitgestellt werden, oder für irgendwelche Folgeschäden, speziellen oder ähnlichen Schäden, selbst wenn auf die Möglichkeit solcher Schäden hingewiesen wurde.\u003c/p\u003e\n\n\u003ch2\u003eKontakt\u003c/h2\u003e\n\n\u003cp\u003eWenn Sie Fragen zu diesem Haftungsausschluss haben, können Sie uns kontaktieren:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eE-Mail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eBesuchen Sie unsere Kontaktseite: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eHaftungsbeschränkung\u003c/h2\u003e\n\n\u003cp\u003eIM MAXIMALEN DURCH DAS ANWENDBARE RECHT ERLAUBTEN UMFANG HAFTET DAS UNTERNEHMEN ODER SEINE LIEFERANTEN IN KEINEM FALL FÜR SPEZIELLE, ZUFÄLLIGE, INDIREKTE ODER FOLGESCHÄDEN JEDER ART (EINSCHLIEßLICH, ABER NICHT BEGRENZT AUF SCHÄDEN FÜR VERLUST VON GEWINNEN, DATEN ODER ANDEREN INFORMATIONEN, FÜR UNTERBRECHUNGEN IM GESCHÄFT, FÜR PERSONENSCHÄDEN, VERLUST DER PRIVATSPHÄRE, DIE AUS ODER IN IRGENDEINER WEISE IM ZUSAMMENHANG MIT DER NUTZUNG ODER DER UNMÖGLICHKEIT DER NUTZUNG DES DIENSTES ENTSTEHEN, DRITTHERSTELLER-SOFTWARE UND/ODER DRITTHERSTELLER-HARDWARE, DIE MIT DEM DIENST VERWENDET WIRD, ODER ANDERS IM ZUSAMMENHANG MIT EINER BESTIMMUNG DIESER BEDINGUNGEN).\u003c/p\u003e\n\n\u003cp\u003eDie gesamte Haftung des Unternehmens aus diesem Vertrag darf den größeren Betrag von: (a) dem insgesamt von Ihnen für den Dienst in den 12 Monaten vor der Forderung gezahlten Betrag; oder (b) 20,00 $ (zwanzig Dollar) nicht überschreiten.\u003c/p\u003e\n\n\u003ch2\u003eSchadenersatz\u003c/h2\u003e\n\n\u003cp\u003eSie erklären sich bereit, das Unternehmen, seine Tochtergesellschaften, Direktoren, Mitarbeiter, Beauftragten, Lizenzgeber und Lieferanten von und gegen alle Ansprüche, Verpflichtungen, Schäden, Urteile, Kosten und Ausgaben (einschließlich angemessener Anwaltsgebühren), die aus oder im Zusammenhang mit ergeben: (a) Ihrer Nutzung des Dienstes; (b) einem Verstoß gegen diese Bedingungen durch Sie; (c) Inhalten, die Sie über den Dienst veröffentlichen oder übermitteln; (d) Ihrer Verletzung geltenden Rechts, Reglungen oder Vorschriften; oder (e) Ihrer Verletzung der Rechte Dritter.\u003c/p\u003e\n\n\u003ch2\u003eHaftungsausschluss für Garantien\u003c/h2\u003e\n\n\u003cp\u003eDER DIENST WIRD \"WIE ER IST\" UND \"WIE VERFÜGBAR\" OHNE GARANTIEN IRGENDWELCHER ART, WEDER AUSDRÜCKLICH NOCH STILLSCHWEIGEND, EINSCHLIESSLICH, ABER NICHT BEGRENZT AUF STILLSCHWEIGENDE GARANTIEN FÜR HANDELSÜBLICHKEIT, EIGNUNG FÜR EINEN BESTIMMTEN ZWECK UND NICHTVERLETZUNG.\u003c/p\u003e\n\n\u003cp\u003eDAS UNTERNEHMEN GARANTIERT NICHT, DASS: (A) DER DIENST IHREN ANFORDERUNGEN ENTSPRICHT; (B) DER DIENST UNUNTERBROCHEN, RECHTZEITIG, SICHER ODER FEHLERFREI SEIN WIRD; (C) DIE ERGEBNISSE, DIE AUS DER NUTZUNG DES DIENSTES ERZIELT WERDEN, GENAU ODER ZUVERLÄSSIG SIND; ODER (D) DIE QUALITÄT IRGENDEINER PRODUKTE, DIENSTLEISTUNGEN, INFORMATIONEN ODER ANDERER MATERIALIEN, DIE ÜBER DEN DIENST BEZUGNEHMEN, IHRE ERWARTUNGEN ERFÜLLEN.\u003c/p\u003e\n\n\u003ch2\u003eAkzeptanz durch Nutzung\u003c/h2\u003e\n\n\u003cp\u003eDurch den Zugriff auf, das Herunterladen, die Installation oder die Nutzung des Dienstes erkennen Sie an, dass Sie diese Bedingungen gelesen, verstanden haben und sich verpflichten, daran gebunden zu sein. Wenn Sie diesen Bedingungen nicht zustimmen, greifen Sie nicht auf den Dienst zu oder nutzen Sie ihn nicht.\u003c/p\u003e\n\u003cp\u003eDie fortgesetzte Nutzung des Dienstes nach Änderungen dieser Bedingungen stellt Ihre Zustimmung zu diesen Änderungen dar.\u003c/p\u003e\n\n\u003ch2\u003eGeltendes Recht und Gerichtsbarkeit\u003c/h2\u003e\n\n\u003cp\u003eDiese Bedingungen unterliegen dem Recht der Föderativen Republik Brasilien und sind gemäß diesem auszulegen, ohne Rücksicht auf etwaige kollisionsrechtliche Bestimmungen.\u003c/p\u003e\n\u003cp\u003eAlle Streitigkeiten, die aus oder im Zusammenhang mit diesen Bedingungen entstehen, unterliegen der ausschließlichen Zuständigkeit der Gerichte der Stadt São Paulo, Bundesstaat São Paulo, Brasilien, wobei die Parteien unwiderruflich auf jede Einwendung gegen die Gerichtsbarkeit dieser Gerichte verzichten.\u003c/p\u003e\n\n\u003ch2\u003eHaftungsübernahme\u003c/h2\u003e\n\n\u003cp\u003eSIE ÜBERNEHMEN DIE VOLLE VERANTWORTUNG UND DAS RISIKO FÜR IHRE NUTZUNG DES DIENSTES. DER DIENST WIRD \"WIE ER IST\" OHNE GARANTIEN IRGENDWELCHER ART BEREITGESTELLT. DAS UNTERNEHMEN HAFTET NICHT FÜR SCHÄDEN, DIE AUS DER NUTZUNG ODER DER UNMÖGLICHKEIT DER NUTZUNG DES DIENSTES ENTSTEHEN, EINSCHLIEßLICH SCHÄDEN, DIE DURCH MALWARE, VIRUSSE ODER JEDES FALSCHES ODER UNVOLLSTÄNDIGES COMPUTERPROGRAMM VERURSACHT WERDEN.\u003c/p\u003e\n\n\u003ch2\u003eLGPD-Konformität\u003c/h2\u003e\n\n\u003cp\u003eDieses Dokument entspricht dem brasilianischen Allgemeinen Datenschutzgesetz (LGPD - Gesetz Nr. 13.709/2018) und seinen Aktualisierungen, einschließlich:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD-Beschluss CD Nr. 19/2024\u003c/strong\u003e: Regeln für die internationale Übertragung personenbezogen 003eDienst\u003c/strong\u003e bezeichnet \u003cstrong\u003eNETURAL\u003c/strong\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSie\u003c/strong\u003e bedeutet die Person, die auf den Dienst zugreift.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eKonto\u003c/strong\u003e bezeichnet ein einzelnes Konto, das für Sie erstellt wurde, um auf unseren Dienst zuzugreifen.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAbonnement\u003c/strong\u003e bezieht sich auf die Dienstleistungen oder den Zugang zum Dienst, die/der im Rahmen eines Abonnements angeboten wird.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eBeschreibung des Dienstes\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eNETURAL\u003c/strong\u003e ist ein Dienst, der es Benutzern ermöglicht, verschiedene Funktionen zur Verwaltung und Optimierung ihrer Software-Anwendungen zu nutzen. Der Dienst kann sowohl kostenpflichtige als auch kostenlose Funktionen umfassen.\u003c/p\u003e\n\n\u003ch2\u003eKonten von Benutzern\u003c/h2\u003e\n\u003cp\u003eUm auf bestimmte Funktionen des Dienstes zuzugreifen, müssen Sie möglicherweise ein Konto erstellen. Sie sind dafür verantwortlich, die Vertraulichkeit Ihres Kontos und Ihres Passworts zu wahren.\u003c/p\u003e\n\u003cp\u003eSie stimmen zu, die Verantwortung für alle Aktivitäten zu übernehmen, die unter Ihrem Konto stattfinden. Sie müssen uns unverzüglich über jede unbefugte Nutzung Ihres Kontos informieren.\u003c/p\u003e\n\n\u003ch2\u003ePreismodell\u003c/h2\u003e\n\u003ch3\u003eAbonnementzeitraum\u003c/h3\u003e\n\u003cp\u003eDer Dienst oder Teile des Dienstes sind nur mit einem kostenpflichtigen Abonnement verfügbar. Sie werden im Voraus auf wiederkehrender Basis (monatlich oder jährlich) in Rechnung gestellt, je nach Art des von Ihnen gewählten Abonnementplans.\u003c/p\u003e\n\u003cp\u003eAm Ende jedes Zeitraums wird Ihr Abonnement automatisch unter denselben Bedingungen erneuert, es sei denn, Sie stornieren es oder das Unternehmen storniert es.\u003c/p\u003e\n\n\u003ch3\u003eStornierung des Abonnements\u003c/h3\u003e\n\u003cp\u003eSie können die Erneuerung Ihres Abonnements über die Kontoeinstellungen oder indem Sie uns kontaktieren, stornieren. Sie erhalten keine Rückerstattung für bereits gezahlte Gebühren für den aktuellen Abonnementszeitraum und können bis zum Ende des aktuellen Zeitraums auf den Dienst zugreifen.\u003c/p\u003e\n\n\u003ch3\u003ePreisänderungen\u003c/h3\u003e\n\u003cp\u003eDas Unternehmen kann nach eigenem Ermessen die Abonnementpreise jederzeit ändern. Jede Änderung tritt am Ende des aktuellen Abonnementszeitraums in Kraft.\u003c/p\u003e\n\n\u003ch3\u003eRückerstattungen\u003c/h3\u003e\n\u003cp\u003eMit Ausnahme von gesetzlich geforderten Rückerstattungen sind die Gebühren für kostenpflichtige Abonnements nicht rückerstattbar. Rückerstattungen können nach eigenem Ermessen des Unternehmens von Fall zu Fall in Betracht gezogen werden.\u003c/p\u003e\n\n\u003ch3\u003eKostenlose Testversion\u003c/h3\u003e\n\u003cp\u003eDas Unternehmen kann eine kostenlose Testversion für einen begrenzten Zeitraum anbieten. Am Ende der Testphase werden Ihnen automatisch Abonnementgebühren berechnet, es sei denn, Sie stornieren vor Ende der Testphase.\u003c/p\u003e\n\n\u003ch2\u003eVerfügbarkeit des Dienstes\u003c/h2\u003e\n\u003cp\u003eDas Unternehmen bemüht sich, den Dienst 24 Stunden am Tag, 7 Tage die Woche verfügbar zu halten. Das Unternehmen garantiert jedoch nicht, dass der Dienst ununterbrochen oder fehlerfrei verfügbar ist.\u003c/p\u003e\n\u003cp\u003eDas Unternehmen behält sich das Recht vor, den Dienst jederzeit, vorübergehend oder dauerhaft, ganz oder teilweise, nach eigenem Ermessen mit oder ohne Vorankündigung zu ändern, auszusetzen oder einzustellen.\u003c/p\u003e\n\n\u003ch2\u003eGeistiges Eigentum\u003c/h2\u003e\n\u003cp\u003eAlle Inhalte, die im Dienst enthalten sind, einschließlich, aber nicht beschränkt auf Texte, Grafiken, Logos, Icons, Bilder, Audio-Clips, digitale Downloads und Software, sind Eigentum des Unternehmens oder seiner Inhaltsanbieter und durch brasilianische und internationale Urheberrechtsgesetze geschützt.\u003c/p\u003e\n\n\u003ch2\u003eHaftungsbeschränkung\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eUNTER KEINEN UMSTÄNDEN HAFTET DAS UNTERNEHMEN ODER SEINE LIEFERANTEN FÜR IRGENDEINE SPEZIELLE, ZUFÄLLIGE, INDIREKTE ODER FOLGESCHÄDEN IRGENDEINER ART (EINSCHLIEßLICH, ABER NICHT BESCHRÄNKT AUF, SCHÄDEN FÜR DEN VERLUST VON GEWINNEN, DATEN ODER ANDEREN INFORMATIONEN, FÜR UNTERBRECHUNGEN IM GESCHÄFT, FÜR PERSONENSCHÄDEN, VERLUST DER PRIVATSPHÄRE, DIE AUS DEM GEBRAUCH DES DIENSTES ODER AUS DER UNFÄHIGKEIT, DEN DIENST ZU NUTZEN, ENTSTEHEN, ODER ANDERWEITIG IM ZUSAMMENHANG MIT EINER BESTIMMUNG DIESER BEDINGUNGEN.\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eDie Haftung des Unternehmens im Rahmen dieser Vereinbarung beschränkt sich auf den höheren Betrag von: (a) dem Gesamtbetrag, den Sie für den Dienst in den 12 Monaten vor der Forderung bezahlt haben; oder (b) 20,00 USD (zwanzig Dollar).\u003c/p\u003e\n\n\u003ch2\u003eIndemnifizierung\u003c/h2\u003e\n\u003cp\u003eSie stimmen zu, das Unternehmen, seine Tochtergesellschaften, Direktoren, Mitarbeiter, Vertreter, Lizenzgeber und Lieferanten von und gegen alle Ansprüche, Verbindlichkeiten, Schäden, Urteile, Kosten und Ausgaben (einschließlich angemessener Anwaltskosten) schadlos zu halten, die sich ergeben aus oder in Verbindung stehen mit: (a) Ihrer Nutzung des Dienstes; (b) einem Verstoß gegen diese Bedingungen durch Sie; (c) jeglichem Inhalt, den Sie über den Dienst posten oder übertragen; (d) Ihrem Verstoß gegen geltendes Recht, Vorschrift oder Verordnung; oder (e) Ihrem Verstoß gegen die Rechte Dritter.\u003c/p\u003e\n\n\u003ch2\u003eÄnderungen des Dienstes\u003c/h2\u003e\n\u003cp\u003eDas Unternehmen behält sich das Recht vor, unseren Dienst und jede Dienstleistung oder Material, das wir über den Dienst bereitstellen, nach eigenem Ermessen und ohne Vorankündigung zu ändern oder zurückz äftsbedingungen sorgfältig durch, bevor Sie unseren Dienst nutzen.\u003c/p\u003e\n\n\u003ch2\u003eAuslegung und Definitionen\u003c/h2\u003e\n\n\u003ch3\u003eAuslegung\u003c/h3\u003e\n\u003cp\u003eWorte, deren Anfangsbuchstabe großgeschrieben ist, haben die in diesen Bedingungen definierten Bedeutungen. Die folgenden Definitionen haben unabhängig von ihrer Form (Singular oder Plural) dieselbe Bedeutung.\u003c/p\u003e\n\n\u003ch3\u003eDefinitionen\u003c/h3\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003cstrong\u003eApp\u003c/strong\u003e bezieht sich auf das von der Firma bereitgestellte Softwareprogramm mit dem Namen NETURAL.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003ePartner\u003c/strong\u003e bezeichnet eine Entität, die eine Kontrolle über, unter Kontrolle von, oder unter gemeinsamer Kontrolle mit einer Partei hat, wobei „Kontrolle“ die Eigentümerschaft von 50 % oder mehr der Aktien bedeutet.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eKonto\u003c/strong\u003e bedeutet ein einzigartiges Konto, das Sie erstellt haben, um auf unseren Dienst oder Teile unseres Dienstes zuzugreifen.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eLand\u003c/strong\u003e bezieht sich auf: Brasilien.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eUnternehmen\u003c/strong\u003e (bezeichnet als „Unternehmen“, „Wir“, „Uns“ oder „Unsere“ in diesem Vertrag) bezieht sich auf MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICAÇÃO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eInhalt\u003c/strong\u003e bezieht sich auf Inhalte wie Texte, Bilder oder andere Informationen, die von Ihnen gepostet, hochgeladen, verlinkt oder auf andere Weise bereitgestellt werden können.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eGerät\u003c/strong\u003e bedeutet jedes Gerät, das auf den Dienst zugreifen kann.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eDienst\u003c/strong\u003e bezieht sich auf die App, die Website oder beide.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eAllgemeine Geschäftsbedingungen\u003c/strong\u003e (auch als „Bedingungen“ bezeichnet) bezeichnen diese Allgemeinen Geschäftsbedingungen, die die vollständige Vereinbarung zwischen Ihnen und dem Unternehmen darstellen.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eWebsite\u003c/strong\u003e bezieht sich auf NETURAL, zugänglich unter \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eSie\u003c/strong\u003e bedeutet die Person, die auf den Dienst zugreift oder ihn verwendet, oder das Unternehmen oder die juristische Person, in deren Namen diese Person auf den Dienst zugreift oder ihn verwendet.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eAkzeptanz\u003c/h2\u003e\n\n\u003cp\u003eDiese Allgemeinen Geschäftsbedingungen regeln die Nutzung dieses Dienstes und den Vertrag zwischen Ihnen und dem Unternehmen. Diese Bedingungen legen die Rechte und Pflichten aller Benutzer in Bezug auf die Nutzung des Dienstes fest.\u003c/p\u003e\n\n\u003cp\u003eIhr Zugang und Ihre Nutzung des Dienstes sind von Ihrer Akzeptanz und Einhaltung dieser Allgemeinen Geschäftsbedingungen abhängig. Diese Bedingungen gelten für alle Besucher, Benutzer und andere Personen, die auf den Dienst zugreifen oder ihn nutzen.\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eDurch den Zugriff auf oder die Nutzung des Dienstes erklären Sie sich mit diesen Bedingungen einverstanden. Wenn Sie mit einem Teil dieser Bedingungen nicht einverstanden sind, dürfen Sie den Dienst nicht nutzen.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eSie bestätigen, dass Sie älter als 18 Jahre sind. Das Unternehmen gestattet nicht, dass Personen unter 18 Jahren den Dienst nutzen.\u003c/p\u003e\n\n\u003cp\u003eIhr Zugang und Ihre Nutzung des Dienstes hängen ebenfalls von Ihrer Akzeptanz und Einhaltung der Datenschutzrichtlinie des Unternehmens ab.\u003c/p\u003e\n\n\u003ch2\u003eBenutzerkonten\u003c/h2\u003e\n\n\u003cp\u003eWenn Sie ein Konto bei uns erstellen, müssen Sie uns zu jeder Zeit genaue, vollständige und aktuelle Informationen bereitstellen. Die Nichterfüllung dieser Anforderungen stellt einen Verstoß gegen die Bedingungen dar.\u003c/p\u003e\n\n\u003cp\u003eSie sind verantwortlich für den Schutz des Passworts, das Sie zur Anmeldung bei dem Dienst verwenden, sowie für alle Aktivitäten oder Maßnahmen, die unter Ihrem Passwort stattfinden.\u003c/p\u003e\n\n\u003cp\u003eSie stimmen zu, Ihr Passwort nicht an Dritte weiterzugeben. Sie müssen uns unverzüglich benachrichtigen, wenn Sie von einer Verletzung der Sicherheit oder einer unbefugten Nutzung Ihres Kontos Kenntnis erlangen.\u003c/p\u003e\n\n\u003ch2\u003eAbonnements und Zahlungen\u003c/h2\u003e\n\n\u003ch3\u003eAbonnementdauer\u003c/h3\u003e\n\n\u003cp\u003eDer Dienst oder einige Teile des Dienstes sind nur mit einem kostenpflichtigen Abonnement verfügbar. Sie werden im Voraus auf wiederkehrender Basis (monatlich oder jährlich) je nach Art des von Ihnen ausgewählten Abonnements abgerechnet.\u003c/p\u003e\n\n\u003cp\u003eAm Ende jedes Zeitraums wird Ihr Abonnement unter denselben Bedingungen automatisch erneuert, es sei denn, Sie kündigen es oder das Unternehmen kündigt es.\u003c/p\u003e\n\n\u003ch3\u003eKündigung des Abonnements\u003c/h3\u003e\n\n\u003cp\u003eSie können die Erneuerung Ihres Abonnements über die Einstellungen Ihres Kontos oder durch Kontaktaufnahme mit uns kündigen. Sie erhalten keine Rückerstattung für bereits gezahlte Gebühren für den aktuellen Abrechnungszeitraum und können bis zum Ende des aktuellen Zeitraums auf den Dienst zugreifen.\u003c/p\u003e\n\n\u003ch3\u003ePreisanpassungen\u003c/h3\u003e\n\n\u003cp\u003eDas Unternehmen kann nach eigenem Ermessen die Abonnementpreise jederzeit ändern. Jede Änderung tritt am Ende des aktuellen Abrechnungszeitraums in Kraft.\u003c/p\u003e\n\n\u003ch3\u003eRückerstattungen\u003c/h3\u003e\n\n\u003cp\u003eAußer wenn es gesetzlich vorgeschrieben ist, sind kostenpflichtige Abonnementgebühren nicht erstattungsfähig. Rückerstattungen können nach eigenem Ermessen des Unternehmens von Fall zu Fall in Betracht gezogen werden.\u003c/p\u003e\n\n\u003ch3\u003eKostenlose Testphase\u003c/h3\u003e\n\n\u003cp\u003eDas Unternehmen kann für einen begrenzten Zeitraum eine kostenlose Testphase anbieten. Am Ende der Testphase werden Ihnen die Abonnementgebühren automatisch in Rechnung gestellt, es sei denn, Sie kündigen vor dem Ende der Testphase.\u003c/p\u003e\n\n\u003ch2\u003eInhalt des Benutzers\u003c/h2\u003e\n\n\u003cp\u003eUnser Dienst ermöglicht es Ihnen, Inhalte zu veröffentlichen. Sie sind verantwortlich für die Inhalte, die Sie im Dienst veröffentlichen, einschließlich ihrer Legalität, Zuverlässigkeit und Angemessenheit.\u003c/p\u003e\n\n\u003cp\u003eDurch das Veröffentlichen von Inhalten im Dienst gewähren Sie uns die Rechte und Lizenzen zur Nutzung, Modifikation, öffentlichen Aufführung, öffentlichen Anzeige, Vervielfältigung und Verteilung solcher Inhalte im und durch den Dienst.\u003c/p\u003e\n\n\u003cp\u003eSie erklären und gewährleisten, dass: (i) die Inhalte Ihnen gehören oder Sie das Recht haben, diese zu verwenden und uns die Rechte und Lizenzen gemäß diesen Bedingungen zu gewähren und (ii) die Veröffentlichung Ihrer Inhalte im oder durch den Dienst keine Rechte auf Privatsphäre, Werberechte, Urheberrechte, vertragliche Rechte oder andere Rechte Dritter verletzt.\u003c/p\u003e\n\n\u003ch2\u003eGeistiges Eigentum\u003c/h2\u003e\n\n\u003cp\u003eDer Dienst und sein ursprünglicher Inhalt (außer den Inhalten, die von Ihnen oder anderen Benutzern bereitgestellt werden), Funktionen und Merkmale sind und bleiben das ausschließliche Eigentum des Unternehmens und seiner Lizenzgeber.\u003c/p\u003e\n\n\u003cp\u003eDer Dienst ist durch Urheberrechte, Marken und andere Gesetze sowohl in Brasilien als auch in anderen Ländern geschützt.\u003c/p\u003e\n\n\u003cp\u003eUnsere Marken und unser Handelsauftritt dürfen nicht in Verbindung mit einem Produkt oder einer Dienstleistung ohne die vorherige schriftliche Zustimmung des Unternehmens verwendet werden.\u003c/p\u003e\n\n\u003ch2\u003eLinks zu anderen Websites\u003c/h2\u003e\n\n\u003cp\u003eUnser Dienst kann Links zu Websites oder Diensten Dritter enthalten, die nicht im Eigentum oder unter der Kontrolle des Unternehmens stehen.\u003c/p\u003e\n\n\u003cp\u003eDas Unternehmen hat keine Kontrolle über und übernimmt keine Verantwortung für den Inhalt, die Datenschutzrichtlinien oder die Praktiken solcher Websites oder Dienste Dritter. Sie erkennen an und stimmen zu, dass das Unternehmen nicht direkt oder indirekt verantwortlich ist für Schäden oder Verluste, die verursacht wurden oder angeblich verursacht wurden durch oder in Verbindung mit der Nutzung oder dem Vertrauen auf solche Inhalte, Waren oder Dienstleistungen, die über oder in Verbindung mit diesen Websites oder Diensten verfügbar sind.\u003c/p\u003e\n\n\u003ch2\u003eKündigung\u003c/h2\u003e\n\n\u003cp\u003eWir können Ihr Konto sofort, ohne vorherige Ankündigung oder Haftung, aus beliebigen Gründen kündigen, insbesondere wenn Sie gegen diese Allgemeinen Geschäftsbedingungen verstoßen.\u003c/p\u003e\n\n\u003cp\u003eNach der Kündigung erlischt Ihr Recht zur Nutzung des Dienstes sofort.\u003c/p\u003e\n\n\u003ch2\u003eHaftungsbeschränkung\u003c/h2\u003e\n\n\u003cp\u003eUNGEACHTET ANY SCHÄDEN, DIE SIE MÖGLICHERWEISE ERLEIDEN, WIRD DIE GESAMTHAFTUNG DES UNTERNEHMENS UND JEDER SEINER LIEFERANTEN IM RAHMEN DIESER BEDINGUNGEN UND IHRES EINZIGEN RECHTSMITTELS BEGRENZT AUF DEN TATSÄCHLICHEN BETRAG, DER VON IHNEN FÜR DEN DIENST IN DEN 12 MONATEN VOR DEM ANSPRUCH GEZAHLT WURDE; ODER (B) 20,00 USD (ZWANZIG US-DOLLAR).\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eIN DEM MAßE, DAS DURCH DAS ANWENDBARE RECHT ERLAUBT IST, SIND UNTER KEINEN UMSTÄNDEN DAS UNTERNEHMEN ODER SEINE LIEFERANTEN FÜR SPEZIELLE, NEBEN- ODER FOLGESCHÄDEN IRGENDEINER ART HAFTBAR\u003c/strong\u003e (EINSCHLIESSLICH, ABER NICHT BESCHRÄNKT AUF SCHÄDEN IM ZUSAMMENHANG MIT PROFITVERLUST, DATENVERLUST ODER ANDERE INFORMATIONEN, FÜR GESCHÄFTSUNTERBRECHUNG, FÜR PERSONENSCHÄDEN, VERLUST VON PRIVATSPHÄRE, DIE AUS DER NUTZUNG ODER DER UNMÖGLICHKEIT DER NUTZUNG DES DIENSTES ENTSTEHEN, DRITTE SOFTWARE UND/ODER DRITTE HARDWARE, DIE MIT DEM DIENST VERWENDET WIRD, ODER ANDERS IN VERBINDUNG MIT IRGENDEINER BESTIMMUNG DIESER BEDINGUNGEN).\u003c/p\u003e\n\n\u003ch2\u003eHaftungsausschluss\u003c/h2\u003e\n\n\u003cp\u003eDER DIENST WIRD „WIE BESEHEN“ UND „WIE VERFÜGBAR“ OHNE GARANTIEN IRGENDWELCHER ART, WEDER AUSDRÜCKLICH NOCH IMPLIZIT, EINSCHLIESSLICH, ABER NICHT BESCHRÄNKT AUF IMPLIZIERTE GARANTIEN DER MARKTFÄHIGKEIT, EIGNUNG FÜR EINEN BESTIMMTEN ZWECK UND NICHTVERLETZUNG.\u003c/p\u003e\n\n\u003cp\u003eDAS UNTERNEHMEN GIBT KEINE GARANTIE, DASS: (A) DER DIENST IHREN ANFORDERUNGEN ENTSPRICHT; (B) DER DIENST UNUNTERBROCHEN, RECHTZEITIG, SICHER ODER FEHLERFREI IST; (C) DIE ERGEBNISSE, DIE AUS DER NUTZUNG DES DIENSTES ERZIELT WERDEN, GENAU ODER ZUVERLÄSSIG SIND; ODER (D) DIE QUALITÄT IRGENDWELCHER PRODUKTE, DIENSTLEISTUNGEN, INFORMATIONEN ODER ANDEREN MATERIALIEN, DIE ÜBER DEN DIENST ERHALTEN WERDEN, IHREN ERWARTUNGEN ENTSPRICHT.\u003c/p\u003e\n\n\u003ch2\u003eGeltendes Recht und Gerichtsbarkeit\u003c/h2\u003e\n\n\u003cp\u003eDiese Bedingungen unterliegen dem Recht der Föderativen Republik Brasilien, ohne Rücksicht auf deren Kollisionsnormen.\u003c/p\u003e\n\n\u003cp\u003eAlle Streitigkeiten, die sich aus oder im Zusammenhang mit diesen Bedingungen ergeben, unterliegen der ausschließlichen Zuständigkeit der Gerichte der Stadt São Paulo, Bundesstaat São Paulo, Brasilien, und die Parteien verzichten unwiderruflich auf jegliche Einwendungen gegen die Zuständigkeit solcher Gerichte.\u003c/p\u003e\n\n\u003ch2\u003eRisikotransfer\u003c/h2\u003e\n\n\u003cp\u003eSIE ÜBERNEHMEN DIE VOLLE VERANTWORTUNG UND DAS RISI
