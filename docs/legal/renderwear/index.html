    \u003ch2\u003eHaftungsausschluss für professionelle Beratung\u003c/h2\u003e\n    \u003cp\u003eDie Informationen über den Dienst werden mit dem Verständnis bereitgestellt, dass das Unternehmen nicht an der Bereitstellung von Rechts-, Rechnungslegungs-, Steuer- oder anderen professionellen Dienstleistungen und Beratungen beteiligt ist. Daher sollten sie nicht als Ersatz für eine Beratung durch qualifizierte Fachleute in den Bereichen Rechnungswesen, Steuern, Recht oder anderen anwendbaren Disziplinen angesehen werden.\u003c/p\u003e\n\n    \u003cp\u003eIN KEINEM FALL SIND DAS UNTERNEHMEN ODER SEINE LIEFERANTEN FÜR IRGENDEINE ART VON SPEZIELLEN, ZUFÄLLIGEN, INDIREKTEN ODER FOLGESCHÄDEN, DIE AUS ODER IM ZUSAMMENHANG MIT IHREM ZUGRIFF ODER DER NUTZUNG ODER DER UNMÖGLICHKEIT ZU GREIFEN ODER ZU NUTZEN DES DIENSTES ENTSTEHEN, HAFTBAR.\u003c/p\u003e\n\n    \u003ch2\u003eVerwendung auf eigenes Risiko\u003c/h2\u003e\n    \u003cp\u003eAlle Informationen im Dienst werden \"wie sie sind\" bereitgestellt, ohne Gewähr für Vollständigkeit, Genauigkeit, Aktualität oder die Ergebnisse, die aus der Nutzung dieser Informationen resultieren, und ohne Gewähr jeglicher Art, weder ausdrücklich noch stillschweigend, einschließlich, aber nicht beschränkt auf Gewährleistungen der Marktgängigkeit, Eignung für einen bestimmten Zweck und Nichtverletzung.\u003c/p\u003e\n\n    \u003cp\u003eDas Unternehmen haftet Ihnen oder einer anderen Person gegenüber nicht für Entscheidungen oder Maßnahmen, die auf der Grundlage von Informationen beruhen, die durch den Dienst bereitgestellt werden, oder für etwaige Folgeschäden, spezielle Schäden oder ähnliche Schäden, selbst wenn es auf die Möglichkeit solcher Schäden hingewiesen wurde.\u003c/p\u003e\n\n    \u003ch2\u003eKontakt\u003c/h2\u003e\n    \u003cp\u003eWenn Sie Fragen zu diesem Haftungsausschluss haben, können Sie uns kontaktieren:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eE-Mail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003eBesuchen Sie unsere Kontaktseite: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eLGPD-Konformität\u003c/h2\u003e\n    \u003cp\u003eDieses Dokument entspricht dem brasilianischen Allgemeinen Datenschutzgesetz (LGPD - Gesetz Nr. 13.709/2018) und seinen Aktualisierungen, einschließlich:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eANPD-Beschluss CD Nr. 19/2024:\u003c/strong\u003e Regeln für die internationale Übertragung personenbezogener Daten.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVorfallmeldung:\u003c/strong\u003e Frist von 3 (drei) Werktagen zur Benachrichtigung der ANPD und der betroffenen Personen.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRechte der Betroffenen:\u003c/strong\u003e Zugang, Berichtigung, Übertragbarkeit, Löschung und Widerruf der Einwilligung.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eDie verantwortliche Stelle für die Datenverarbeitung ist MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., die unter oben genannter Adresse zu erreichen ist.\u003c/p\u003e\n    \u003cp\u003eIn Übereinstimmung mit den Anforderungen der LGPD wird das Unternehmen sicherstellen, dass die Rechte der betroffenen Personen gewahrt bleiben, und die Betroffenen über alle relevanten Aspekte im Hinblick auf ihre Daten informiert werden. Das Unternehmen wird zudem angemessene technische und organisatorische Maßnahmen ergreifen, um die Sicherheit der verarbeiteten Daten zu gewährleisten.\u003c/p\u003e\n\n    \u003ch2\u003eAbonnements und Zahlungen\u003c/h2\u003e\n    \n    \u003ch3\u003eAbonnementzeitraum\u003c/h3\u003e\n    \u003cp\u003eDer Dienst oder einige Teile des Dienstes sind nur mit einem kostenpflichtigen Abonnement verfügbar. Sie werden im Voraus regelmäßig (monatlich oder jährlich) in Rechnung gestellt, abhängig von dem von Ihnen gewählten Abonnementplan.\u003c/p\u003e\n\n    \u003ch3\u003eStornierung des Abonnements\u003c/h3\u003e\n    \u003cp\u003eSie können die Erneuerung Ihres Abonnements über die Kontoeinstellungen oder indem Sie uns kontaktieren, stornieren. Sie erhalten keine Rückerstattung für bereits gezahlte Gebühren für den aktuellen Abonnementzeitraum und können bis zum Ende des aktuellen Zeitraums auf den Dienst zugreifen.\u003c/p\u003e\n\n    \u003ch3\u003ePreiserhöhungen\u003c/h3\u003e\n    \u003cp\u003eDas Unternehmen kann nach eigenem Ermessen die Abonnementpreise jederzeit ändern. Jede Änderung tritt am Ende des aktuellen Abonnementzeitraums in Kraft.\u003c/p\u003e\n\n    \u003ch3\u003eRückerstattungen\u003c/h3\u003e\n    \u003cp\u003eAußer wenn gesetzlich vorgeschrieben, sind die Gebühren für das kostenpflichtige Abonnement nicht rückerstattbar. Rückerstattungen können von Fall zu Fall nach eigenem Ermessen des Unternehmens in Betracht gezogen werden.\u003c/p\u003e\n\n    \u003ch3\u003eKostenloses Testangebot\u003c/h3\u003e\n    \u003cp\u003eDas Unternehmen kann ein kostenloses Testangebot für einen begrenzten Zeitraum anbieten. Am Ende des Testzeitraums werden Ihnen automatisch die Abonnementgebühren in Rechnung gestellt, es sei denn, Sie stornieren vor dem Ende des Testzeitraums.\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e","label":"Haftungsausschluss","languageLabel":"Deutsch"},{"documentType":"return_refund","language":"DE","content":"\u003ch2\u003eRückgabe- und Rückerstattungsrichtlinie\u003c/h2\u003e\n\n\u003cp\u003eLetzte Aktualisierung: 20. Januar 2026\u003c/p\u003e\n\n\u003cp\u003eVielen Dank, dass Sie bei \u003cstrong\u003eRENDERWEAR\u003c/strong\u003e gekauft haben.\u003c/p\u003e\n\n\u003cp\u003eWenn Sie mit Ihrem Kauf nicht vollständig zufrieden sind, sind wir hier, um zu helfen.\u003c/p\u003e\n\n\u003ch2\u003eAuslegung und Definitionen\u003c/h2\u003e\n\n\u003ch3\u003eDefinitionen\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eUnternehmen\u003c/strong\u003e bezieht sich auf \u003cstrong\u003eMIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA.\u003c/strong\u003e, \u003cstrong\u003eALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL\u003c/strong\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eWaren\u003c/strong\u003e bezieht sich auf die Artikel, die im Service zum Verkauf angeboten werden.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eBestellungen\u003c/strong\u003e bedeutet eine Anfrage Ihrerseits, Waren von uns zu kaufen.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eService\u003c/strong\u003e bezieht sich auf \u003cstrong\u003eRENDERWEAR\u003c/strong\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSie\u003c/strong\u003e bedeutet die Person, die auf den Service zugreift oder diesen verwendet, oder das Unternehmen oder die andere juristische Person, in deren Namen eine solche Person auf den Service zugreift oder diesen verwendet.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eIhre Berechtigung für eine Rückerstattung\u003c/h2\u003e\n\n\u003cp\u003eDie folgenden Artikel sind für eine Rückerstattung berechtigt:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eWaren, die bei Erhalt fehlerhaft oder beschädigt sind.\u003c/li\u003e\n    \u003cli\u003eWaren, die nicht mit der angegebenen Beschreibung übereinstimmen.\u003c/li\u003e\n    \u003cli\u003eUnbenutzte Waren in der Originalverpackung.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eUm für eine Rückgabe berechtigt zu sein, muss Ihr Artikel unbenutzt und in dem Zustand, in dem Sie ihn erhalten haben, sein. Er muss sich auch in der Originalverpackung befinden.\u003c/p\u003e\n\n\u003ch2\u003eFristen für Anträge\u003c/h2\u003e\n\n\u003cp\u003eSie haben 7 (sieben) Tage ab dem Datum des Erhalts des Produkts Zeit, um eine Rückgabe oder Rückerstattung gemäß dem brasilianischen Verbraucherschutzgesetz (Gesetz Nr. 8.078/90) zu beantragen.\u003c/p\u003e\n\n\u003cp\u003eBei digitalen Abonnements können Sie innerhalb von 7 Tagen nach Vertragsschluss stornieren und eine Rückerstattung anfordern, vorausgesetzt, der Service wurde nicht in Anspruch genommen.\u003c/p\u003e\n\n\u003ch2\u003eRückerstattungsprozess\u003c/h2\u003e\n\n\u003cp\u003eUm eine Rückerstattung zu beantragen, folgen Sie bitte diesen Schritten:\u003c/p\u003e\n\u003col\u003e\n    \u003cli\u003eKontaktieren Sie uns unter \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e mit Ihrer Bestellnummer und dem Grund für die Rückerstattung.\u003c/li\u003e\n    \u003cli\u003eWarten Sie auf unsere Antwort mit Anweisungen, wie Sie fortfahren sollen.\u003c/li\u003e\n    \u003cli\u003eFalls zutreffend, senden Sie den Artikel gemäß den bereitgestellten Anweisungen zurück.\u003c/li\u003e\n    \u003cli\u003eNachdem wir den Artikel erhalten und geprüft haben, benachrichtigen wir Sie über die Genehmigung oder Ablehnung der Rückerstattung.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003cp\u003eWenn genehmigt, wird Ihre Rückerstattung bearbeitet und automatisch innerhalb von bis zu 14 Werktagen auf Ihre ursprüngliche Zahlungsmethode gutgeschrieben.\u003c/p\u003e\n\n\u003ch2\u003eNicht rückerstattbare Artikel\u003c/h2\u003e\n\n\u003cp\u003eDie folgenden Artikel sind nicht für eine Rückerstattung berechtigt:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eDigitale Produkte, die bereits heruntergeladen oder aufgerufen wurden.\u003c/li\u003e\n    \u003cli\u003eAbonnements nach Ablauf der 7-Tage-Frist, wenn der Service bereits genutzt wurde.\u003c/li\u003e\n    \u003cli\u003ePersonalisierten, maßgefertigten Produkte.\u003c/li\u003e\n    \u003cli\u003eProdukte, die aufgrund ihrer Beschaffenheit nicht zurückgegeben werden können (z. B. aus hygienischen Gründen).\u003c/li\u003e\n    \u003cli\u003eGeschenkkarten.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eTeilweise Rückerstattungen\u003c/h2\u003e\n\n\u003cp\u003eIn bestimmten Situationen können nur teilweise Rückerstattungen gewährt werden:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eArtikel mit offensichtlichen Gebrauchsspuren.\u003c/li\u003e\n    \u003cli\u003eArtikel, die mehr als 7 Tage nach der Lieferung zurückgegeben werden.\u003c/li\u003e\n    \u003cli\u003eArtikel, die nicht im Originalzustand sind oder fehlende Teile aufweisen.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eVerspätete oder fehlende Rückerstattungen\u003c/h2\u003e\n\n\u003cp\u003eWenn Sie noch keine Rückerstattung erhalten haben:\u003c/p\u003e\n\u003col\u003e\n    \u003cli\u003eÜberprüfen Sie zunächst Ihr Bankkonto erneut.\u003c/li\u003e\n    \u003cli\u003eKontaktieren Sie das Unternehmen Ihrer Kreditkarte, da es einige Zeit dauern kann, bis Ihre Rückerstattung offiziell verbucht wurde.\u003c/li\u003e\n    \u003cli\u003eKontaktieren Sie Ihre Bank, da es in der Regel auch eine Verarbeitungszeit gibt, bevor eine Rückerstattung angewiesen wird.\u003c/li\u003e\n    \u003cli\u003eWenn Sie all dies getan haben und Ihre Rückerstattung noch nicht erhalten haben, kontaktieren Sie uns unter \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003ch2\u003eUmtausch\u003c/h2\u003e\n\n\u003cp\u003eWir tauschen nur Artikel aus, wenn sie fehlerhaft oder beschädigt sind. Wenn Sie einen Artikel gegen denselben Artikel tauschen müssen, senden Sie uns bitte eine E-Mail an \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e.\u003c/p\u003e\n\n\u003ch2\u003eKontaktieren Sie uns\u003c/h2\u003e\n\n\u003cp\u003eWenn Sie Fragen zu unserer Rückgabe- und Rückerstattungsrichtlinie haben, kontaktieren Sie uns bitte:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eE-Mail: \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e\u003c/li\u003e\n    \u003cli\u003eBesuchen Sie diese Seite: \u003cstrong\u003e\u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eKontakt\u003c/a\u003e\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eHaftungsbeschränkung\u003c/h2\u003e\n\n\u003cp\u003eIM MAXIMALEN, DURCH ANWENDBARES RECHT ERLAUBTEN UMFANG, IST DAS UNTERNEHMEN IN KEINEM FALL FÜR SPEZIELLE, ZUFÄLLIGE, INDIREKTE ODER FOLGESCHÄDEN HAFTBAR, DIE IN IRGENDEINER WEISE MIT DER NUTZUNG ODER DER UNMÖGLICHKEIT ZUR NUTZUNG DES SERVICES, DRITTPARTY-SOFTWARE UND/ODER DRITTPARTY-HARDWARE, DIE MIT DEM SERVICE VERWENDET WURDEN, ODER ANDERS IN VERBINDUNG MIT IRGENDEINER BESTIMMUNG DIESER BEDINGUNGEN, ZUSAMMENHÄNGEN.\u003c/p\u003e\n\n\u003cp\u003eDie Gesamthaftung des Unternehmens im Rahmen dieser Vereinbarung übersteigt nicht den höheren Betrag von: (a) dem Gesamtbetrag, den Sie für den Service in den 12 Monaten vor der Klage bezahlt haben; oder (b) 20,00 $ (zwanzig Dollar).\u003c/p\u003e\n\n\u003ch2\u003eSchadenersatz\u003c/h2\u003e\n\n\u003cp\u003eSie verpflichten sich, das Unternehmen, seine Tochtergesellschaften, Direktoren, Mitarbeiter, Agenten, Lizenzgeber und Lieferanten von allen Ansprüchen, Verbindlichkeiten, Schäden, Urteilen, Kosten und Aufwendungen (einschließlich angemessener Anwaltsgebühren) freizustellen, zu verteidigen und schadlos zu halten, die aus oder im Zusammenhang mit: (a) Ihrer Nutzung des Services; (b) einem Verstoß gegen diese Bedingungen durch Sie; (c) jeglichem Inhalt, den Sie über den Service posten oder übertragen; (d) Ihrem Verstoß gegen geltende Gesetze, Vorschriften oder Regelungen; oder (e) Ihrem Verstoß gegen die Rechte Dritter entstehen.\u003c/p\u003e\n\n\u003ch2\u003eHaftungsausschluss\u003c/h2\u003e\n\n\u003cp\u003eDER SERVICE WIRD „WIE BESEHEN“ UND „WIE VERFÜGBAR“ OHNE GARANTIEN JEGLICHER ART, WEDER AUSDRÜCKLICH NOCH IMPLIZIERT, ZUSAMMENGEFASST, EINSCHLIEßLICH, ABER NICHT BEGRENZT AUF, IMPLIZIERTE GARANTIEN DER MARKTGÄNGIGKEIT, EIGNUNG FÜR EINEN BESTIMMTEN ZWECK UND NICHTVERLETZUNG.\u003c/p\u003e\n\n\u003cp\u003eDas Unternehmen garantiert nicht, dass: (A) DER SERVICE IHREN ANFORDERUNGEN ENTSPRICHT; (B) DER SERVICE UNUNTERBROCHEN, RECHTZEITIG, SICHER ODER FEHLERFREI SEIN WIRD; (C) DIE ERGEBNISSE, DIE AUS DER NUTZUNG DES SERVICES ERZIELT WERDEN, GENAU ODER ZUVERLÄSSIG SEIN WERDEN; ODER (D) DIE QUALITÄT IRGENDWELCHER PRODUKTE, DIENSTLEISTUNGEN, INFORMATIONEN ODER ANDEREN MATERIALIEN, DIE ÜBER DEN SERVICE ERHALTEN WERDEN, IHREN ERWARTUNGEN ENTSPRICHT.\u003c/p\u003e\n\n\u003ch2\u003eAkzeptanz durch Nutzung\u003c/h2\u003e\n\n\u003cp\u003eINDEN SIE AUF DEN SERVICE ZUGREIFEN, HERUNTERLADEN, INSTALLIEREN ODER DIESEN UTILISIEREN, BESTÄTIGEN SIE, DASS SIE DIESE BEDINGUNGEN GELESEN HABEN, VERSTANDEN HABEN UND EINE VERPFLICHTUNG ZUR EINHALTUNG DIESER BEDINGUNGEN EINGEGANGEN SIND. WENN SIE DIESEN BEDINGUNGEN NICHT ZUSTIMMEN, GREIFEN SIE NICHT AUF DEN SERVICE ZU ODER VERWENDEN SIE DIESEN NICHT.\u003c/p\u003e\n\n\u003cp\u003eDie fortgesetzte Nutzung des Services nach Änderungen dieser Bedingungen stellt Ihre Akzeptanz solcher Änderungen dar.\u003c/p\u003e\n\n\u003ch2\u003eGeltendes Recht und Gerichtsbarkeit\u003c/h2\u003e\n\n\u003cp\u003eDiese Bedingungen unterliegen den Gesetzen der Föderativen Republik Brasilien und sind gemäß diesen auszulegen, ohne Berücksichtigung der Vorschriften zum internationalen Privatrecht.\u003c/p\u003e\n\n\u003cp\u003eAlle Streitigkeiten, die aus diesen Bedingungen entstehen oder damit in Zusammenhang stehen, sind der ausschließlichen Gerichtsbarkeit der Gerichte der Stadt São Paulo, Bundesstaat São Paulo, Brasilien, unterworfen, und die Parteien verzichten unwiderruflich auf Einwände gegen die Gerichtsbarkeit dieser Gerichte.\u003c/p\u003e\n\n\u003ch2\u003eRisikotransfer\u003c/h2\u003e\n\n\u003cp\u003eSie übernehmen die volle Verantwortung und das Risiko für Ihre Nutzung des Services. Der Service wird „WIE BESEHEN“ OHNE GARANTIEN JEGLICHER ART bereitgestellt. Das Unternehmen haftet nicht für Schäden, die sich aus der Nutzung oder der Unmöglichkeit der Nutzung des Services ergeben, einschließlich Schäden, die durch Malware, Viren oder falsche oder unvollständige Computerprogramme verursacht werden.\u003c/p\u003e\n\n\u003ch2\u003eLGPD-Konformität\u003c/h2\u003e\n\n\u003cp\u003eDieses Dokument entspricht dem brasilianischen Allgemeinen Datenschutzgesetz (LGPD - Gesetz Nr. 13.709/2018) und seinen Aktualisierungen, einschließlich:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD-Beschluss CD Nr. 19/2024\u003c/strong\u003e: Regeln für die internationale Übertragung personenbezogener Daten\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVorfallmeldung\u003c/strong\u003e: Frist von 3 (drei) Werktagen zur Benachrichtigung der ANPD und der betroffenen Personen\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eRechte der Betroffenen\u003c/strong\u003e: Zugang, Berichtigung, Übertragbarkeit, Löschung und Widerruf der Einwilligung\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDatenschutzbeauftragter (DPO)\u003c/strong\u003e: Kontaktinformationen sind öffentlich verfügbar\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eStrafen\u003c/strong\u003e: Bis zu 2 % des jährlichen Umsatzes in Brasilien oder BRL 50 Millionen pro Verstoß\u003c/li\u003e\n\u003c/ul\u003e","label":"Rückgabe und Erstattung","languageLabel":"Deutsch"},{"documentType":"privacy_policy","language":"DE","content":"\u003ch2\u003eDatenschutzrichtlinie\u003c/h2\u003e\n\n\u003cp\u003eLetzte Aktualisierung: 20. Januar 2026\u003c/p\u003e\n\n\u003cp\u003eDiese Datenschutzrichtlinie beschreibt unsere Richtlinien und Verfahren zu der Erhebung, Nutzung und Offenlegung Ihrer Informationen, wenn Sie den Dienst nutzen, und informiert Sie über Ihre Datenschutzrechte und wie das Gesetz Sie schützt.\u003c/p\u003e\n\n\u003cp\u003eWir verwenden Ihre personenbezogenen Daten, um den Dienst bereitzustellen und zu verbessern. Durch die Nutzung des Dienstes stimmen Sie der Erhebung und Nutzung von Informationen gemäß dieser Datenschutzrichtlinie zu.\u003c/p\u003e\n\n\u003ch2\u003e1. Auslegung und Definitionen\u003c/h2\u003e\n\n\u003ch3\u003e1.1 Auslegung\u003c/h3\u003e\n\u003cp\u003eDie Wörter, deren Anfangsbuchstaben großgeschrieben sind, haben die folgenden definierten Bedeutungen. Diese Definitionen sind unabhängig von der Anzahl im Singular oder Plural zu verstehen.\u003c/p\u003e\n\n\u003ch3\u003e1.2 Definitionen\u003c/h3\u003e\n\u003cp\u003eFür die Zwecke dieser Datenschutzrichtlinie:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eAccount\u003c/strong\u003e bezeichnet ein einzigartiges Konto, das für Sie erstellt wurde, um auf unseren Dienst oder Teile unseres Dienstes zuzugreifen.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUnternehmen\u003c/strong\u003e (bezeichnet als \"das Unternehmen\", \"wir\", \"uns\" oder \"unser\" in dieser Datenschutzrichtlinie) bezieht sich auf MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASILIEN.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e sind kleine Dateien, die auf Ihrem Computer, mobilen Gerät oder einem anderen Gerät von einer Website platziert werden und Details Ihres Browserverlaufs auf dieser Website zwischen deren vielen Nutzungen enthalten.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eLand\u003c/strong\u003e bezieht sich auf: Brasilien.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eGerät\u003c/strong\u003e bezeichnet jedes Gerät, das auf den Dienst zugreifen kann, wie einen Computer, ein Mobiltelefon oder ein Tablet.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePersonenbezogene Daten\u003c/strong\u003e sind alle Informationen, die sich auf eine identifizierte oder identifizierbare Person beziehen.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDienst\u003c/strong\u003e bezieht sich auf die App oder die Website oder beides.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDrittanbieter\u003c/strong\u003e bezeichnet jede physische oder juristische Person, die die Daten im Auftrag des Unternehmens verarbeitet.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNutzungsdaten\u003c/strong\u003e beziehen sich auf die automatisch gesammelten Daten, die durch die Nutzung des Dienstes oder durch die Infrastruktur des Dienstes selbst erzeugt werden.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eWebsite\u003c/strong\u003e bezieht sich auf RENDERWEAR, abrufbar über \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSie\u003c/strong\u003e bezeichnet die Person, die auf den Dienst zugreift oder ihn nutzt, oder die Gesellschaft oder eine andere juristische Person, in deren Namen eine solche Person auf den Dienst zugreift oder ihn nutzt, sofern zutreffend.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e2. Erhebung und Nutzung Ihrer personenbezogenen Daten\u003c/h2\u003e\n\n\u003ch3\u003e2.1 Arten der gesammelten Daten\u003c/h3\u003e\n\n\u003ch4\u003e2.1.1 Personenbezogene Daten\u003c/h4\u003e\n\u003cp\u003eWenn Sie unseren Dienst nutzen, können wir Sie auffordern, uns bestimmte personenbezogene Daten bereitzustellen, die verwendet werden können, um Sie zu kontaktieren oder zu identifizieren. Zu den personenbezogenen Daten gehören, sind aber nicht beschränkt auf:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eE-Mail-Adresse\u003c/li\u003e\n    \u003cli\u003eName und Nachname\u003c/li\u003e\n    \u003cli\u003eTelefonnummer\u003c/li\u003e\n    \u003cli\u003eAdresse, Staat, Provinz, Postleitzahl, Stadt\u003c/li\u003e\n    \u003cli\u003eNutzungsdaten\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch4\u003e2.1.2 Nutzungsdaten\u003c/h4\u003e\n\u003cp\u003eDie Nutzungsdaten werden automatisch erfasst, wenn Sie den Dienst nutzen.\u003c/p\u003e\n\u003cp\u003eDie Nutzungsdaten können Informationen enthalten wie die IP-Adresse Ihres Gerätes (z. B. IP-Adresse), den Gerätetyp, die Browserversion, die Seiten unseres Dienstes, die Sie besuchen, das Datum und die Uhrzeit Ihres Besuchs, die Zeit, die Sie auf diesen Seiten verbringen, einzigartige Geräteziffern und andere Diagnosedaten.\u003c/p\u003e\n\n\u003ch3\u003e2.2 Verwendung Ihrer personenbezogenen Daten\u003c/h3\u003e\n\u003cp\u003eDas Unternehmen kann die personenbezogenen Daten für die folgenden Zwecke verwenden:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eUm unseren Dienst bereitzustellen und aufrechtzuerhalten,\u003c/strong\u003e einschließlich der Überwachung der Nutzung unseres Dienstes.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUm Ihr Konto zu verwalten:\u003c/strong\u003e um Ihre Registrierung als Benutzer des Dienstes zu verwalten.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eZur Vertragserfüllung:\u003c/strong\u003e zur Entwicklung, Einhaltung und Ausführung des Verkaufsvertrags über die Produkte, Waren oder Dienstleistungen, die Sie erworben haben.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUm mit Ihnen Kontakt aufzunehmen:\u003c/strong\u003e Um Sie per E-Mail, Telefonanrufen, SMS oder anderen äquivalenten Formen elektronischer Kommunikation zu kontaktieren.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUm Ihre Anfragen zu verwalten:\u003c/strong\u003e Um Ihre Anfragen an uns zu bearbeiten und zu verwalten.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e3. Aufbewahrung Ihrer personenbezogenen Daten\u003c/h2\u003e\n\u003cp\u003eDas Unternehmen wird Ihre personenbezogenen Daten nur so lange aufbewahren, wie es für die in dieser Datenschutzrichtlinie festgelegten Zwecke erforderlich ist. Wir werden Ihre personenbezogenen Daten nur in dem Umfang aufbewahren und verwenden, die zur Erfüllung unserer rechtlichen Verpflichtungen erforderlich sind.\u003c/p\u003e\n\n\u003ch2\u003e4. Übertragung Ihrer personenbezogenen Daten\u003c/h2\u003e\n\u003cp\u003eIhre Informationen, einschließlich personenbezogener Daten, werden in den Betriebsbüros des Unternehmens und an anderen Orten, an denen die an der Verarbeitung beteiligten Parteien sich befinden, verarbeitet. Das bedeutet, dass diese Informationen an Computer übertragen werden können, die sich außerhalb Ihres Bundeslandes, Ihrer Provinz, Ihres Landes oder einer anderen behördlichen Jurisdiktion befinden, in der die Datenschutzgesetze von denen Ihrer juristischen Zuständigkeit abweichen können.\u003c/p\u003e\n\u003cp\u003eIn Übereinstimmung mit der LGPD und der Resolution CD/ANPD Nr. 19/2024 wird jede internationale Übertragung personenbezogener Daten unter Verwendung von ANPD-genehmigten Standardvertragsklauseln oder anderen rechtlich gültigen Mechanismen durchgeführt.\u003c/p\u003e\n\n\u003ch2\u003e5. Offenlegung Ihrer personenbezogenen Daten\u003c/h2\u003e\n\u003cp\u003eDas Unternehmen kann Ihre personenbezogenen Daten unter den folgenden Umständen offenlegen:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eWenn wir gesetzlich dazu verpflichtet sind, die personenbezogenen Daten offenzulegen.\u003c/li\u003e\n    \u003cli\u003eWenn wir die öffentliche Ordnung oder die Rechte und das Eigentum des Unternehmens schützen müssen.\u003c/li\u003e\n    \u003cli\u003eIm Falle einer Fusion, Übernahme oder Verkauf aller oder eines Teils der Vermögenswerte des Unternehmens.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e6. Sicherheit Ihrer personenbezogenen Daten\u003c/h2\u003e\n\u003cp\u003eDie Sicherheit Ihrer personenbezogenen Daten ist uns wichtig, allerdings dürfen Sie nicht vergessen, dass kein Übertragungsverfahren über das Internet oder eine elektronische Speichermethode absolut sicher ist. Während wir uns bemühen, kommerziell akzeptable Mittel zum Schutz Ihrer personenbezogenen Daten zu verwenden, können wir deren absolute Sicherheit nicht garantieren.\u003c/p\u003e\n\n\u003ch2\u003e7. Rechte der betroffenen Personen (LGPD)\u003c/h2\u003e\n\u003cp\u003eGemäß dem brasilianischen Allgemeinen Datenschutzgesetz (LGPD - Gesetz Nr. 13.709/2018) haben Sie die folgenden Rechte:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eBestätigung und Zugang:\u003c/strong\u003e Bestätigen, dass eine Verarbeitung stattfindet, und auf Ihre personenbezogenen Daten zugreifen.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eBerichtigung:\u003c/strong\u003e Die Berichtigung unvollständiger, ungenauer oder veralteter Daten beantragen.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAnonymisierung, Sperrung oder Löschung:\u003c/strong\u003e Die Anonymisierung, Sperrung oder Löschung von Daten, die überflüssig, übermäßig oder in Nichtübereinstimmung behandelt wurden, beantragen.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePortabilität:\u003c/strong\u003e Die Portabilität der Daten zu einem anderen Dienstanbieter beantragen.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEntfernung:\u003c/strong\u003e Die Entfernung der personenbezogenen Daten, die mit Ihrer Zustimmung verarbeitet werden, beantragen.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eInformation:\u003c/strong\u003e Informiert werden über die öffentlichen und privaten Entitäten, mit denen wir Ihre Daten teilen.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eWiderruf der Zustimmung:\u003c/strong\u003e Die Zustimmung jederzeit widerrufen.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e8. Sicherheitsvorfallmeldung\u003c/h2\u003e\n\u003cp\u003eIn Übereinstimmung mit der LGPD und den Aktualisierungen von 2024 werden wir die Nationale Datenschutzbehörde (ANPD) und die betroffenen Personen innerhalb von 3 (drei) Werktagen nach Kenntnisnahme eines jeden Sicherheitsvorfalls, der ein relevantes Risiko oder einen Schaden für die betroffenen Personen darstellen kann, benachrichtigen.\u003c/p\u003e\n\n\u003ch2\u003e9. Datenschutzbeauftragter (DPO)\u003c/h2\u003e\n\u003cp\u003eUm Ihre Rechte auszuüben oder Fragen zur Verarbeitung Ihrer personenbezogenen Daten zu klären, wenden Sie sich an unseren Datenschutzbeauftragten:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eE-Mail: info@incodetech.com.br\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e10. Änderungen dieser Datenschutzrichtlinie\u003c/h2\u003e\n\u003cp\u003eWir können unsere Datenschutzrichtlinie von Zeit zu Zeit aktualisieren. Wir werden Sie über Änderungen informieren, indem wir die neue Datenschutzrichtlinie auf dieser Seite veröffentlichen.\u003c/p\u003e\n\u003cp\u003eWir empfehlen Ihnen, diese Datenschutzrichtlinie regelmäßig auf mögliche Änderungen zu überprüfen.\u003c/p\u003e\n\n\u003ch2\u003e11. Kontakt\u003c/h2\u003e\n\u003cp\u003eWenn Sie Fragen zu dieser Datenschutzrichtlinie haben, können Sie uns kontaktieren:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eE-Mail: info@incodetech.com.br\u003c/li\u003e\n    \u003cli\u003eIndem Sie diese Seite besuchen: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eKontakt\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e12. Haftungsbeschränkung\u003c/h2\u003e\n\u003cp\u003eSOFERN IM ANWENDBAREN RECHT ERLAUBT, HAFTET DAS UNTERNEHMEN IN KEINEM FALL FÜR SPEZIELLE, INCIDENTAL, INDIREKTE ODER FOLGESCHÄDEN IRGENDWIE (EINSCHLIESSLICH, ABER NICHT BEGRENZT AUF, SCHÄDEN FÜR VERLUST VON GEWINNEN, DATEN- ODER ANDEREN INFORMATIONEN, FÜR UNTERBRECHUNG DES GESCHÄFTS, FÜR PERSONENSCHÄDEN, VERLUST DER PRIVATSPHÄRE, DIE AUS ODER IN IRGENDEINER WEISE MIT DER NUTZUNG ODER UNMÖGLICHKEIT, DEN DIENST ZU NUTZEN, DREITPARTEISOFTWARE UND/ODER DRITTPARTY-HARDWARE, DIE MIT DEM DIENST VERWENDET WIRD, ODER ANDERS IN VERBINDUNG MIT EINER BESTIMMUNG DIESER BEDINGUNGEN).\u003c/p\u003e\n\u003cp\u003eDie Gesamtverantwortung des Unternehmens aus dieser Vereinbarung übersteigt nicht den größeren der folgenden Beträge: (a) den Gesamtbetrag, den Sie für den Dienst in den 12 Monaten vor dem Anspruch bezahlt haben; oder (b) 20,00 $ (zwanzig Dollar).\u003c/p\u003e\n\n\u003ch2\u003e13. Entschädigung\u003c/h2\u003e\n\u003cp\u003eSie stimmen zu, das Unternehmen, seine Tochtergesellschaften, Direktoren, Mitarbeiter, Agenten, Lizenzgeber und Lieferanten von allen Ansprüchen, Haftungen, Schäden, Urteilen, Kosten und Aufwendungen (einschließlich angemessener Anwaltsgebühren) freizustellen, zu verteidigen und schadlos zu halten, die aus oder im Zusammenhang mit: (a) Ihrer Nutzung des Dienstes; (b) einem Verstoß gegen diese Bedingungen durch Sie; (c) jeglichem Inhalt, den Sie über den Dienst posten oder übermitteln; (d) Ihrer Verletzung von geltendem Recht, Vorschriften oder Regeln; oder (e) Ihrer Verletzung der Rechte eines Dritten entstehen.\u003c/p\u003e\n\n\u003ch2\u003e14. Haftungsausschluss für Gewährleistungen\u003c/h2\u003e\n\u003cp\u003eDER DIENST WIRD \"WIE ER IST\" UND \"WIE VERFÜGBAR\" OHNE JEDE ART VON GEWÄHRLEISTUNGEN, WEDER AUSDRÜCKLICH NOCH IMPLIZIERT, BEREITGESTELLT, EINSCHLIESSLICH, ABER NICHT BEGRENZT AUF, IMPLIZITE GEWÄHRLEISTUNGEN DER MARKTGÄNGIGKEIT, DER EIGNUNG FÜR EINEN BESTIMMTEN ZWECK UND DER NICHTVERLETZUNG.\u003c/p\u003e\n\u003cp\u003eDas Unternehmen GARANTIERT NICHT, DASS: (A) DER DIENST IHREN ANFORDERUNGEN ENTSPRICHT; (B) DER DIENST UNTERBRECHUNGS-, RECHTZEIT-, SICHER UND FEHLERFREI IST; (C) DIE ERGEBNISSE AUS DER NUTZUNG DES DIENSTES GENAU ODER ZUVERLÄSSIG SIND; ODER (D) DIE QUALITÄT IRGENDEINER PRODUKTE, DIENSTE, INFORMATIONEN ODER ANDEREN MATERIALIEN, DIE DURCH DEN DIENST ERHALTEN WERDEN, IHREN ERWARTUNGEN ENTSPRICHT.\u003c/p\u003e\n\n\u003ch2\u003e15. Akzeptanz durch Nutzung\u003c/h2\u003e\n\u003cp\u003eINDEN SIE AUF DEN DIENST ZUGREIFEN, HERUNTERLADEN, INSTALLIEREN ODER DEN DIENST NUTZEN, ERKENNEN SIE AN, DASS SIE DIESE BEDINGUNGEN GEGESEN HABEN, VERSTANDEN UND ZUSTIMMEN, AN DIESE GEBUNDEN ZU SEIN. WENN SIE DIESEN BEDINGUNGEN NICHT ZUSTIMMEN, GREIFEN SIE NICHT AUF DEN DIENST ZU ODER NUTZEN SIE DIESEN NICHT.\u003c/p\u003e\n\u003cp\u003eDie fortgesetzte Nutzung des Dienstes nach Änderungen dieser Bedingungen stellt Ihre Akzeptanz dieser Änderungen dar.\u003c/p\u003e\n\n\u003ch2\u003e16. Anwendbares Recht und Gerichtsstand\u003c/h2\u003e\n\u003cp\u003eDiese Bedingungen unterliegen den Gesetzen der Föderativen Republik Brasilien und sind gemäß diesen auszulegen, ohne Berücksichtigung der Bestimmungen über das internationale Privatrecht.\u003c/p\u003e\n\u003cp\u003eJede Streitigkeit, die sich aus oder im Zusammenhang mit diesen Bedingungen ergibt, wird der ausschließlichen Gerichtsbarkeit der Gerichte der Stadt São Paulo, Bundesstaat São Paulo, Brasilien, unterbreitet, und die Parteien verzichten unwiderruflich auf jeden Einwand gegen die Gerichtsbarkeit dieser Gerichte.\u003c/p\u003e\n\n\u003ch2\u003e17. Risikoübernahme\u003c/h2\u003e\n\u003cp\u003eSIE ÜBERNEHMEN VOLLE VERANTWORTUNG UND RISIKO FÜR IHRE NUTZUNG DES DIENSTES. DER DIENST WIRD \"WIE ER IST\" OHNE JEGLICHE GEWÄHRLEISTUNGEN BEREITGESTELLT. DAS UNTERNEHMEN HAFTET NICHT FÜR SCHÄDEN, DIE AUS DER NUTZUNG ODER UNMÖGLICHKEIT DER NUTZUNG DES DIENSTES ENTSTEHEN, EINSCHLIESSLICH SCHÄDEN, DIE DURCH MALWARE, VIREN ODER PROGRAMMFEHLER VERURSACHT WERDEN.\u003c/p\u003e","label":"Datenschutzrichtlinie","languageLabel":"Deutsch"},{"documentType":"terms_of_use","language":"DE","content":"\u003ch2\u003eAllgemeine Nutzungsbedingungen\u003c/h2\u003e\n\n\u003cp\u003eLetzte Aktualisierung: 20. Januar 2026\u003c/p\u003e\n\n\u003cp\u003eBitte lesen Sie diese Allgemeinen Nutzungsbedingungen (\"Bedingungen\") sorgfältig durch, bevor Sie RENDERWEAR verwenden.\u003c/p\u003e\n\n\u003ch2\u003eAuslegung und Definitionen\u003c/h2\u003e\n\n\u003ch3\u003eAuslegung\u003c/h3\u003e\n\u003cp\u003eDie Wörter, deren Anfangsbuchstaben großgeschrieben sind, haben die in den folgenden Bedingungen definierten Bedeutungen.\u003c/p\u003e\n\n\u003ch3\u003eDefinitionen\u003c/h3\u003e\n\u003cp\u003eFür die Zwecke dieser Allgemeinen Nutzungsbedingungen:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eUnternehmen\u003c/strong\u003e bezieht sich auf MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDienst\u003c/strong\u003e bezieht sich auf RENDERWEAR.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSie\u003c/strong\u003e bedeutet die Person, die auf den Dienst zugreift oder diesen verwendet.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eInhalt\u003c/strong\u003e bedeutet alle Informationen, Texte, Grafiken oder andere Materialien.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eAnerkennung der Bedingungen\u003c/h2\u003e\n\n\u003cp\u003eDurch den Zugriff auf oder die Nutzung unseres Dienstes stimmen Sie zu, an diese Bedingungen gebunden zu sein. Wenn Sie mit einem Teil der Bedingungen nicht einverstanden sind, ist es Ihnen nicht gestattet, auf den Dienst zuzugreifen oder ihn zu nutzen.\u003c/p\u003e\n\n\u003ch2\u003eAkzeptable Nutzung\u003c/h2\u003e\n\n\u003cp\u003eSie stimmen zu, den Dienst nur für legale Zwecke und gemäß diesen Bedingungen zu verwenden. Sie stimmen zu, den Dienst nicht zu nutzen:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eIn einer Weise, die gegen geltendes lokales, nationales oder internationales Recht oder Vorschriften verstößt.\u003c/li\u003e\n    \u003cli\u003eZu Zwecken, die Minderjährige schädigen oder ausnutzen könnten.\u003c/li\u003e\n    \u003cli\u003eUm unaufgeforderte oder nicht genehmigte Werbung oder Werbematerialien zu übertragen oder zu beantragen.\u003c/li\u003e\n    \u003cli\u003eUm sich als das Unternehmen, einen Mitarbeiter des Unternehmens, einen anderen Benutzer oder eine andere Person oder Einrichtung auszugeben oder dies zu versuchen.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eVerbotene Aktivitäten\u003c/h2\u003e\n\n\u003cp\u003eEs ist Ihnen untersagt, die Website oder deren Inhalte zu nutzen:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eFür illegale Zwecke.\u003c/li\u003e\n    \u003cli\u003eUm andere zur Durchführung oder Teilnahme an illegalen Handlungen aufzufordern.\u003c/li\u003e\n    \u003cli\u003eUm gegen geltende Vorschriften, Regeln oder Gesetze zu verstoßen.\u003c/li\u003e\n    \u003cli\u003eUm unsere oder die geistigen Eigentumsrechte anderer zu verletzen.\u003c/li\u003e\n    \u003cli\u003eUm zu belästigen, zu missbrauchen, zu beleidigen, zu schädigen, zu diffamieren, zu verleumden, herabzusetzen, einzuschüchter oder zu diskriminieren.\u003c/li\u003e\n    \u003cli\u003eUm falsche oder irreführende Informationen zu übermitteln.\u003c/li\u003e\n    \u003cli\u003eUm Viren oder andere Arten von schädlichem Code hochzuladen oder zu übertragen.\u003c/li\u003e\n    \u003cli\u003eUm persönliche Daten anderer zu sammeln oder zu verfolgen.\u003c/li\u003e\n    \u003cli\u003eFür Spam, Phishing, Pharming, Pretexting, Spidering, Crawlen oder Scraping.\u003c/li\u003e\n    \u003cli\u003eFür obszöne oder unmoralische Zwecke.\u003c/li\u003e\n    \u003cli\u003eUm Sicherheitsmerkmale des Dienstes zu umgehen oder zu deaktivieren.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eBenutzerinhalte\u003c/h2\u003e\n\n\u003cp\u003eSie sind allein verantwortlich für alle Inhalte, die Sie über den Dienst posten, hochladen, verlinken oder auf andere Weise bereitstellen. Das Unternehmen übernimmt keine Verantwortung für von Nutzern gepostete Inhalte.\u003c/p\u003e\n\n\u003ch2\u003eRechte an geistigem Eigentum\u003c/h2\u003e\n\n\u003cp\u003eDer Dienst und seine originellen Inhalte, Merkmale und Funktionen sind und bleiben das ausschließliche Eigentum des Unternehmens. Der Dienst ist durch Urheberrechte, Marken und andere Gesetze der Republik Brasilien und anderer Länder geschützt.\u003c/p\u003e\n\n\u003ch2\u003eKonto kündigen\u003c/h2\u003e\n\n\u003cp\u003eWir können Ihren Zugang sofort, ohne Vorankündigung oder Haftung aus beliebigen Gründen beenden oder aussetzen, einschließlich, aber nicht beschränkt auf, wenn Sie gegen diese Bedingungen verstoßen.\u003c/p\u003e\n\n\u003ch2\u003eÄnderungen der Bedingungen\u003c/h2\u003e\n\n\u003cp\u003eWir behalten uns das Recht vor, diese Bedingungen nach unserem alleinigen Ermessen jederzeit zu ändern die Parteien verzichten unwiderruflich auf alle Einwände gegen die Jurisdiktion dieser Gerichte.\u003c/p\u003e\n\n\u003ch2\u003eRisikotransfer\u003c/h2\u003e\n\n\u003cp\u003eSIE ÜBERNEHMEN DIE VOLLE VERANTWORTUNG UND DAS RISIKO FÜR IHRE NUTZUNG DES DIENSTES. DER DIENST WIRD \"WIE BEZAHLT\" OHNE GARANTIEN IRGENDEINER ART BEREITGESTELLT. DAS UNTERNEHMEN IST NICHT FÜR SCHÄDEN HAFTBAR, DIE AUS DER NUTZUNG ODER UNMÖGLICHKEIT DER NUTZUNG DES DIENSTES RESULTIEREN, EINSCHLIEßLICH SCHÄDEN, DIE DURCH SCHADSOFTWARE, VIREN ODER JEDES FALSCHE ODER UNVOLLSTÄNDIGE COMPUTERPROGRAMM VERURSACHT WERDEN.\u003c/p\u003e\n\n\u003ch2\u003eLGPD-Konformität\u003c/h2\u003e\n\n\u003cp\u003eDieses Dokument entspricht dem brasilianischen Allgemeinen Datenschutzgesetz (LGPD - Gesetz Nr. 13.709/2018) und seinen Aktualisierungen, einschließlich:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD-Beschluss CD Nr. 19/2024\u003c/strong\u003e: Regeln für die internationale Übertragung personenbezogener Daten.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVorfallmeldung\u003c/strong\u003e: Frist von 3 (drei) Werktagen zur Benachrichtigung der ANPD und der betroffenen Personen.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eRechte der Betroffenen\u003c/strong\u003e: Zugang, Berichtigung, Übertragbarkeit, Löschung und Widerruf der Einwilligung.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDatenschutzbeauftragter (DPO)\u003c/strong\u003e: Kontaktinformationen öffentlich verfügbar.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eAbonnements und Zahlungen\u003c/h2\u003e\n\n\u003ch3\u003eAbonnementzeitraum\u003c/h3\u003e\n\u003cp\u003eDer Dienst oder einige Teile des Dienstes sind nur mit einem kostenpflichtigen Abonnement verfügbar. Sie werden im Voraus auf wiederkehrender Basis (monatlich oder jährlich) in Rechnung gestellt, abhängig von dem von Ihnen gewählten Abonnementplan.\u003c/p\u003e\n\n\u003cp\u003eAm Ende jedes Zeitraums wird Ihr Abonnement automatisch unter NAU ODER ZUVERLÄSSIG SEIN; ODER (D) DIE QUALITÄT VON PRODUKTEN, DIENSTLEISTUNGEN, INFORMATIONEN ODER ANDEREN MATERIALIEN, DIE ÜBER DEN DIENST ERHALTEN WERDEN, WIRD IHREN ERWARTUNGEN ENTSPRECHEN.\u003c/p\u003e\n\n\u003ch2\u003eRechtsanwendung\u003c/h2\u003e\n\n\u003cp\u003eDiese Bedingungen unterliegen den Gesetzen der Brasilianischen Republik und werden in Übereinstimmung mit deren Bestimmungen ausgelegt, ohne Rücksicht auf die Vorschriften zu den Konflikten der Gesetze.\u003c/p\u003e\n\n\u003ch2\u003eStreitbeilegung\u003c/h2\u003e\n\n\u003cp\u003eWenn Sie Bedenken oder Streitigkeiten zu diesem Dienst haben, stimmen Sie zu, zunächst informell zu versuchen, die Streitigkeit zu klären, indem Sie das Unternehmen kontaktieren.\u003c/p\u003e\n\n\u003ch2\u003eAllgemeine Bestimmungen\u003c/h2\u003e\n\n\u003ch3\u003eVerzicht\u003c/h3\u003e\n\n\u003cp\u003eDas Versäumnis des Unternehmens, ein Recht oder eine Bestimmung dieser Bedingungen durchzusetzen, wird nicht als Verzicht auf dieses Recht betrachtet.\u003c/p\u003e\n\n\u003ch3\u003eTeilbarkeit\u003c/h3\u003e\n\n\u003cp\u003eWenn eine Bestimmung dieser Bedingungen für nicht durchsetzbar oder ungültig erachtet wird, wird diese Bestimmung geändert und ausgelegt, um die Ziele dieser Bestimmung im größtmöglichen Umfang im Rahmen des anwendbaren Rechts zu erreichen, und die verbleibenden Bestimmungen bleiben in vollem Umfang in Kraft und Wirkung.\u003c/p\u003e\n\n\u003ch3\u003eVollständige Vereinbarung\u003c/h3\u003e\n\n\u003cp\u003eDiese Bedingungen stellen die vollständige Vereinbarung zwischen Ihnen und dem Unternehmen in Bezug auf die Nutzung des Dienstes dar und ersetzen alle vorherigen und zeitgenössischen Vereinbarungen.\u003c/p\u003e\n\n\u003ch2\u003eKontakt\u003c/h2\u003e\n\n\u003cp\u003eWenn Sie Fragen zu diesen Nutzungsbedingungen haben, können Sie uns kontaktieren:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eE-Mail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eDurch Besuch dieser Seite: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eLGPD-Konformität\u003c/h2\u003e\n\n\u003cp\u003eDieses Dokument entspricht dem brasilianischen Allgemeinen Datenschutzgesetz (LGPD - Gesetz Nr. 13.709/2018) und seinen Aktualisierungen, einschließlich:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD-Beschluss CD Nr. 19/2024\u003c/strong\u003e: Regeln für die internationale Übertragung personenbezogener Daten.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVorfallmeldung\u003c/strong\u003e: Frist von 3 (drei) Werktagen zur Benachrichtigung der ANPD und der betroffenen Personen.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eRechte der Betroffenen\u003c/strong\u003e: Zugang, Berichtigung, Übertragbarkeit, Löschung und Widerruf der Einwilligung.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDatenschutzbeauftragter (DPO)\u003c/strong\u003e: Die Kontaktinformationen sind öffentlich verfügbar.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eDie Nichteinhaltung der oben genannten Bestimmungen kann zu Strafen von bis zu 2 % des jährlichen Umsatzes in Brasilien oder BRL 50 Millionen pro Verstoß führen.\u003c/p\u003e","label":"Allgemeine Geschäftsbedingungen","languageLabel":"Deutsch"},{"documentType":"disclaimer","language":"PT","content":"\u003ch2\u003eExoneração de Responsabilidade\u003c/h2\u003e\n\n\u003cp\u003eÚltima atualização: 20 de janeiro de 2026\u003c/p\u003e\n\n\u003ch2\u003eInterpretação e Definições\u003c/h2\u003e\n\n\u003ch3\u003eInterpretação\u003c/h3\u003e\n\n\u003cp\u003eAs palavras cuja letra inicial é maiúscula têm significados definidos nas seguintes condições. As seguintes definições devem ter o mesmo significado, independentemente de aparecerem no singular ou no plural.\u003c/p\u003e\n\n\u003ch3\u003eDefinições\u003c/h3\u003e\n\n\u003cp\u003ePara os fins desta isenção de responsabilidade:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"a Empresa\", \"Nós\", \"Nosso\" neste termo de isenção de responsabilidade) refere-se a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., domiciliada em ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServiço\u003c/strong\u003e refere-se ao site, ao aplicativo ou a ambos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVocê\u003c/strong\u003e significa o indivíduo que acessa o Serviço, ou a empresa, ou outra pessoa jurídica em nome da qual esse indivíduo está acessando ou usando o Serviço, conforme aplicável.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e refere-se ao RENDERWEAR, acessível em \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAplicativo\u003c/strong\u003e significa o programa de software fornecido pela Empresa denominado RENDERWEAR.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eExoneração de Responsabilidade Geral\u003c/h2\u003e\n\n\u003cp\u003eAs informações contidas no Serviço são apenas para fins de informação geral.\u003c/p\u003e\n\n\u003cp\u003eA EMPRESA NÃO ASSUME NENHUMA RESPONSABILIDADE POR ERROS OU OMISSÕES NO CONTEÚDO DO SERVIÇO.\u003c/p\u003e\n\n\u003cp\u003eEM NENHUMA CIRCUNSTÂNCIA A EMPRESA SERÁ RESPONSÁVEL POR QUAISQUER DANOS ESPECIAIS, DIRETOS, INDIRETOS, CONSEQUENCIAIS OU INCIDENTAIS, OU QUAISQUER DANOS, SEJA EM UMA AÇÃO CONTRATUAL, NEGLIGÊNCIA OU OUTRO ATO ILÍCITO, DECORRENTES DE OU EM CONEXÃO COM O USO DO SERVIÇO OU DO CONTEÚDO DO SERVIÇO. A EMPRESA RESERVA-SE O DIREITO DE FAZER ACRÉSCIMOS, EXCLUSÕES OU MODIFICAÇÕES NO CONTEÚDO DO SERVIÇO A QUALQUER MOMENTO, SEM AVISO PRÉVIO.\u003c/p\u003e\n\n\u003cp\u003eA EMPRESA NÃO GARANTE QUE O SERVIÇO ESTEJA LIVRE DE VÍRUS OU OUTROS COMPONENTES PREJUDICIAIS.\u003c/p\u003e\n\n\u003ch2\u003eIsenção de Responsabilidade de Links Externos\u003c/h2\u003e\n\n\u003cp\u003eO Serviço pode conter links para sites externos que não são fornecidos ou mantidos por ou de qualquer forma afiliados à Empresa.\u003c/p\u003e\n\n\u003cp\u003eOBSERVE QUE A EMPRESA NÃO GARANTE A PRECISÃO, RELEVÂNCIA, OPORTUNIDADE OU INTEGRIDADE DE QUALQUER INFORMAÇÃO NESSAS SITES EXTERNOS.\u003c/p\u003e\n\n\u003ch2\u003eIsenção de Responsabilidade por Erros e Omissões\u003c/h2\u003e\n\n\u003cp\u003eAs informações fornecidas pelo Serviço são apenas para orientação geral sobre assuntos de interesse. Mesmo que a Empresa tome todas as precauções para garantir que o conteúdo do Serviço seja atualizado e preciso, podem ocorrer erros. Além disso, devido à natureza mutável das leis, regras e regulamentos, pode haver atrasos, omissões ou imprecisões nas informações contidas no Serviço.\u003c/p\u003e\n\n\u003cp\u003eA EMPRESA NÃO SE RESPONSABILIZA POR QUAISQUER ERROS OU OMISSÕES, OU PELOS RESULTADOS OBTIDOS COM O USO DESTA INFORMAÇÃO.\u003c/p\u003e\n\n\u003ch2\u003eIsenção de Responsabilidade de Uso Justo\u003c/h2\u003e\n\n\u003cp\u003eA Empresa pode usar material protegido por direitos autorais que nem sempre foi especificamente autorizado pelo proprietário dos direitos autorais. A Empresa está disponibilizando esse material para crítica, comentário, reportagem, ensino, bolsa de estudos ou pesquisa.\u003c/p\u003e\n\n\u003cp\u003eA EMPRESA ACREDITA QUE ISSO CONSTITUI UM \"USO JUSTO\" DE QUALQUER MATERIAL PROTEGIDO POR DIREITOS AUTORAIS, CONFORME PREVISTO NA SEÇÃO 107 DA LEI DE DIREITOS AUTORAIS DOS ESTADOS UNIDOS.\u003c/p\u003e\n\n\u003cp\u003eSE DESEJAR USAR MATERIAL PROTEGIDO POR DIREITOS AUTORAIS DO SERVIÇO PARA SEUS PRÓPRIOS FINS QUE VÃO ALÉM DO USO JUSTO, VOCÊ DEVE OBTER PERMISSÃO DO PROPRIETÁRIO DOS DIREITOS AUTORAIS.\u003c/p\u003e\n\n\u003ch2\u003eIsenção de Responsabilidade Expressa das Visualizações\u003c/h2\u003e\n\n\u003cp\u003eO Serviço pode conter pontos de vista e opiniões dos autores e não refletem necessariamente a política oficial ou posição de qualquer outro autor, agência, organização, empregador ou empresa, incluindo a Empresa.\u003c/p\u003e\n\n\u003cp\u003eOS COMENTÁRIOS PUBLICADOS PELOS USUÁRIOS SÃO DE SUA EXCLUSIVA RESPONSABILIDADE E OS USUÁRIOS ASSUMEM TOTAL RESPONSABILIDADE, RESPONSABILIDADE E CULPA POR QUALQUER DIFAMAÇÃO OU LITÍGIO QUE RESULTAR DE ALGO ESCRITO OU COMO RESULTADO DIRETO DE ALGO ESCRITO EM UM COMENTÁRIO. A EMPRESA NÃO SE RESPONSABILIZA POR NENHUM COMENTÁRIO PUBLICADO POR USUÁRIOS E RESERVA-SE O DIREITO DE EXCLUIR QUALQUER COMENTÁRIO POR QUALQUER MOTIVO.\u003c/p\u003e\n\n\u003ch2\u003eIsenção de Responsabilidade Profissional\u003c/h2\u003e\n\n\u003cp\u003eAs informações sobre o Serviço são fornecidas com o entendimento de que a Empresa não está envolvida na prestação de serviços e consultoria jurídica, contábil, tributária ou outros profissionais. Como tal, não deve ser usado como um substituto para a consulta a consultores profissionais de contabilidade, fiscais, jurídicos ou outros consultores competentes.\u003c/p\u003e\n\n\u003cp\u003eEM NENHUM CASO, A EMPRESA OU SEUS FORNECEDORES SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS OU CONSEQUENTES DE QUALQUER NATUREZA DECORRENTES DE OU EM CONEXÃO COM SEU ACESSO OU USO OU INCAPACIDADE DE ACESSAR OU USAR O SERVIÇO.\u003c/p\u003e\n\n\u003ch2\u003eUse por Sua Conta e Risco\u003c/h2\u003e\n\n\u003cp\u003eTodas as informações no Serviço são fornecidas \"no estado em que se encontram\", sem garantia de integridade, precisão, oportunidade ou dos resultados obtidos com o uso dessas informações e sem garantia de qualquer tipo, expressa ou implícita, incluindo, mas não limitado a garantias de desempenho, comercialização e adequação a uma finalidade específica.\u003c/p\u003e\n\n\u003cp\u003eA EMPRESA NÃO SERÁ RESPONSÁVEL PER nados a: (a) seu uso do Serviço; (b) qualquer violação destes Termos por você; (c) qualquer conteúdo que você postar ou transmitir através do Serviço; (d) sua violação de qualquer lei, regra ou regulamento aplicável; ou (e) sua violação dos direitos de terceiros.\u003c/p\u003e\n\n\u003ch2\u003eAceitação pelo Uso\u003c/h2\u003e\n\n\u003cp\u003eAO ACESSAR, BAIXAR, INSTALAR OU USAR O SERVIÇO, VOCÊ RECONHECE QUE LEU, ENTENDEU E CONCORDOU EM FICAR VINCULADO A ESTES TERMOS. SE VOCÊ NÃO CONCORDAR COM ESTES TERMOS, NÃO ACESSE OU USE O SERVIÇO.\u003c/p\u003e\n\n\u003cp\u003eO uso continuado do Serviço após quaisquer modificações nestes Termos constitui sua aceitação de tais modificações.\u003c/p\u003e\n\n\u003ch2\u003eLei Aplicável e Jurisdição\u003c/h2\u003e\n\n\u003cp\u003eEstes Termos serão regidos e interpretados de acordo com as leis da República Federativa do Brasil, sem considerar suas disposições sobre conflitos de leis.\u003c/p\u003e\n\n\u003cp\u003eQualquer disputa decorrente ou relacionada a estes Termos será submetida à jurisdição exclusiva dos tribunais da cidade de São Paulo, Estado de São Paulo, Brasil, e as partes renunciam irrevogavelmente a qualquer objeção à jurisdição de tais tribunais.\u003c/p\u003e\n\n\u003ch2\u003eConformidade com a LGPD\u003c/h2\u003e\n\n\u003cp\u003eEste documento está em conformidade com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018) e suas atualizações, incluindo:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eResolução CD/ANPD nº 19/2024\u003c/strong\u003e: Regras para transferência internacional de dados pessoais\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotificação de Incidentes\u003c/strong\u003e: Prazo de 3 (três) dias úteis para comunicação à ANPD e aos titulares afetados\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDireitos dos Titulares\u003c/strong\u003e: Acesso, correção, portabilidade, eliminação e revogação de consentimento\u003c/li\u003e\n    \u003cli\u003e\u003cstrong eriod.\u003c/p\u003e","label":"Copyright","languageLabel":"English"},{"documentType":"eula","language":"ES","content":"\u003ch2\u003eContrato de Licencia de Usuario Final (\"Contrato\")\u003c/h2\u003e\n\n\u003cp\u003eÚltima actualización: 20 de enero de 2026\u003c/p\u003e\n\n\u003cp\u003eLea este Contrato de Licencia de Usuario Final con atención antes de hacer clic en el botón \"Acepto\", descargar o usar RENDERWEAR.\u003c/p\u003e\n\n\u003ch2\u003eInterpretación y Definiciones\u003c/h2\u003e\n\n\u003ch3\u003eInterpretación\u003c/h3\u003e\n\n\u003cp\u003eLas palabras cuya letra inicial es mayúscula tienen significados definidos en las siguientes condiciones. Las siguientes definiciones deben tener el mismo significado, independientemente de aparecer en singular o plural.\u003c/p\u003e\n\n\u003ch3\u003eDefiniciones\u003c/h3\u003e\n\n\u003cp\u003ePara los fines de este Contrato de Licencia de Usuario Final:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eContrato\u003c/strong\u003e significa este Contrato de Licencia de Usuario Final que constituye el contrato integral entre Usted y la Empresa con respecto al uso de la Aplicación.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAplicación\u003c/strong\u003e significa el programa de software proporcionado por la Empresa, denominado RENDERWEAR.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"Empresa\", \"Nosotros\" o \"Nuestros\" en este Contrato) se refiere a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eContenido\u003c/strong\u003e se refiere a contenido como texto, imágenes u otras informaciones que pueden ser publicadas, subidas, vinculadas o de otra manera disponibles por Usted.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePaís\u003c/strong\u003e se refiere a: Bra u003c/p\u003e\n\n\u003cp\u003eUsted reconoce y acepta que la Empresa no será responsable de ningún Servicio de Terceros, incluida su precisión, integridad, oportunidad, validez, cumplimiento de derechos de autor, legalidad, decencia, calidad o cualquier otro aspecto de los mismos.\u003c/p\u003e\n\n\u003ch2\u003eVigencia y Rescisión\u003c/h2\u003e\n\n\u003cp\u003eEste Contrato permanecerá en vigor hasta ser rescindido por Usted o por la Empresa.\u003c/p\u003e\n\n\u003cp\u003eLa Empresa puede, a su exclusivo criterio, en cualquier momento y por cualquier o ningún motivo, suspender o rescindir este Contrato con o sin aviso previo.\u003c/p\u003e\n\n\u003cp\u003eEste Acuerdo será rescindido inmediatamente, sin aviso previo de la Empresa, en caso de que usted deje de cumplir cualquier disposición de este Acuerdo.\u003c/p\u003e\n\n\u003cp\u003eTras la rescisión de este Contrato, deberá cesar todo uso de la Aplicación y eliminar todas las copias de la Aplicación de su dispositivo.\u003c/p\u003e\n\n\u003ch2\u003eIndemnización\u003c/h2\u003e\n\n\u003cp\u003eUsted acepta indemnizar y eximir a la Empresa y sus matrices, subsidiarias, afiliadas, directores, empleados, agentes, socios y licenciadores de cualquier reclamación o demanda, incluidos honorarios de abogados razonables, debidos o derivados de su: (a) uso de la Aplicación; (b) violación de este Contrato o de cualquier ley o regulación; o (c) violación de cualquier derecho de terceros.\u003c/p\u003e\n\n\u003ch2\u003eSin Garantías\u003c/h2\u003e\n\n\u003cp\u003eLa Aplicación se proporciona a usted \"TAL CUAL\" y \"SEGÚN DISPONIBILIDAD\" y con todos los defectos y fallos sin garantía de ningún tipo.\u003c/p\u003e\n\n\u003cp\u003eEN LA MEDIDA MÁXIMA PERMITIDA POR LA LEY APLICABLE, LA EMPRESA, EN SU NOMBRE Y EN EL NOMBRE DE SUS AFILIADAS Y SUS RESPECTIVOS LICENCIANTES Y PROVEEDORES DE SERVICIOS, RENUNCIA EXPRESAMENTE A TODAS LAS GARANTÍAS, SEAN EXPRESAS, IMPLÍCITAS, LEGALES O DE OTRA MANERA, EN RELACIÓN A LA APLICACIÓN, INCLU
