   \u003cli\u003eCorreo electrónico: info@incodetech.com.br\u003c/li\u003e\n    \u003cli\u003eVisite esta página: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eCumplimiento de la LGPD\u003c/h2\u003e\n\n\u003cp\u003eEste documento cumple con la Ley General de Protección de Datos de Brasil (LGPD - Ley N° 13.709/2018) y sus actualizaciones, incluyendo:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eResolución CD/ANPD N° 19/2024\u003c/strong\u003e: Reglas para la transferencia internacional de datos personales.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotificación de Incidentes\u003c/strong\u003e: Plazo de 3 (tres) días hábiles para comunicar a la ANPD y a los titulares afectados.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerechos de los Titulares\u003c/strong\u003e: Acceso, corrección, portabilidad, eliminación y revocación del consentimiento.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDelegado de Protección de Datos (DPO)\u003c/strong\u003e: Información de contacto disponible públicamente.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eSuscripciones y Pagos\u003c/h2\u003e\n\n\u003ch3\u003ePeriodo de Suscripción\u003c/h3\u003e\n\n\u003cp\u003eEl Servicio o algunas partes del Servicio son accesibles únicamente con una Suscripción paga. Se le cobrará por adelantado de forma recurrente (mensualmente o anualmente), dependiendo del tipo de plan de suscripción que seleccione.\u003c/p\u003e\n\n\u003cp\u003eAl final de cada periodo, su Suscripción se renovará automáticamente bajo las mismas condiciones, a menos que usted la cancele o la Empresa la cancele.\u003c/p\u003e\n\n\u003ch3\u003eCancelación de la Suscripción\u003c/h3\u003e\n\n\u003cp\u003eUsted puede cancelar la renovación de su Suscripción a través de la configuración de su Cuenta o contactándonos. No recibirá un reembolso por cuotas ya pagadas para el periodo de suscripción actual y podrá acceder al Servicio hasta el final del periodo actual.\u003c/p\u003e\n\n\u003ch3\u003eCambios en los Precios\u003c/h3\u003e\n\n\u003cp\u003eLa Empresa puede, a su exclusivo criterio, modificar los precios de las suscripciones en cualquier momento. Cualquier cambio entrará en vigor al final del periodo de suscripción actual.\u003c/p\u003e\n\n\u003ch3\u003eReembolsos\u003c/h3\u003e\n\n\u003cp\u003eExcepto cuando la ley lo exija, las cuotas de suscripción pagadas no son reembolsables. Los reembolsos pueden ser considerados caso por caso a exclusivo criterio de la Empresa.\u003c/p\u003e\n\n\u003ch3\u003ePrueba Gratuita\u003c/h3\u003e\n\n\u003cp\u003eLa Empresa puede ofrecer una prueba gratuita por un tiempo limitado. Al final del periodo de prueba, se le cobrará automáticamente las cuotas de suscripción a menos que cancele antes del final del periodo de prueba.\u003c/p\u003e","label":"Acuerdo de Licencia de Usuario Final (EULA)","languageLabel":"Español"},{"documentType":"terms_and_conditions","language":"ES","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003eTérminos y Condiciones - RENDERWEAR\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003eTérminos y Condiciones\u003c/h2\u003e\n    \u003cp\u003eÚltima actualización: 20 de enero de 2026\u003c/p\u003e\n    \u003cp\u003ePor favor, lea estos términos y condiciones cuidadosamente antes de usar nuestro servicio.\u003c/p\u003e\n\n    \u003ch2\u003eInterpretación y Definiciones\u003c/h2\u003e\n    \u003ch3\u003eInterpretación\u003c/h3\u003e\n    \u003cp\u003eLas palabras cuya letra inicial es mayúscula tienen significados definidos en las siguientes condiciones. Las siguientes definiciones deben tener el mismo significado, independientemente de aparecer en singular o plural.\u003c/p\u003e\n    \n    \u003ch3\u003eDefiniciones\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eAplicación\u003c/strong\u003e significa el programa de software proporcionado por la Empresa, denominado RENDERWEAR.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAfiliado\u003c/strong\u003e significa una entidad que controla, es controlada o está bajo el control común de una parte, donde \"control\" significa la propiedad de 50% o más de las acciones.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCuenta\u003c/strong\u003e significa una cuenta única creada para Usted acceder a nuestro Servicio o partes de nuestro Servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePaís\u003c/strong\u003e se refiere a: Brasil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"Empresa\", \"Nosotros\" o \"Nuestro\" en este Contrato) se refiere a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICAÇÃO VISUAL LTDA., ubicada en ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eContenido\u003c/strong\u003e se refiere al contenido como texto, imágenes u otra información que puede ser publicada, cargada, vinculada o de otro modo puesta a disposición por Usted.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e significa cualquier dispositivo que puede acceder al Servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServicio\u003c/strong\u003e se refiere a la Aplicación, el Sitio o ambos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eTérminos y Condiciones\u003c/strong\u003e (también llamados \"Términos\") significan estos Términos y Condiciones que constituyen el acuerdo completo entre Usted y la Empresa.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSitio\u003c/strong\u003e se refiere a RENDERWEAR, accesible en \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eeste enlace\u003c/a\u003e.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e significa el individuo que accede o utiliza el Servicio, o la empresa u otra persona jurídica en nombre de la cual este individuo está accediendo o utilizando el Servicio.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eReconocimiento\u003c/h2\u003e\n    \u003cp\u003eEstos son los Términos y Condiciones que rigen el uso de este Servicio y operan entre Usted y la Empresa. Estos Términos y Condiciones establecen los derechos y obligaciones de todos los usuarios respecto al uso del Servicio.\u003c/p\u003e\n    \u003cp\u003eSu acceso y uso del Servicio están condicionados a su aceptación y conformidad con estos Términos y Condiciones. Estos Términos y Condiciones se aplican a todos los visitantes, usuarios y otras personas que acceden o usan el Servicio.\u003c/p\u003e\n    \u003cstrong\u003eAl acceder o usar el Servicio, usted acepta obedecer a estos Términos y Condiciones. Si no está de acuerdo con alguna parte de estos Términos y Condiciones, no podrá acceder al Servicio.\u003c/strong\u003e\n    \u003cp\u003eUsted declara que tiene más de 18 años. La Empresa no permite que menores de 18 años usen el Servicio.\u003c/p\u003e\n    \u003cp\u003eSu acceso y uso del Servicio también están condicionados a su aceptación y conformidad con la Política de Privacidad de la Empresa.\u003c/p\u003e\n\n    \u003ch2\u003eContas de Usuario\u003c/h2\u003e\n    \u003cp\u003eAl crear una cuenta con nosotros, debe proporcionarnos información precisa, completa y actualizada en todo momento. La falta de cumplimiento con esta obligación constituye una violación de los Términos.\u003c/p\u003e\n    \u003cp\u003eUsted es responsable de proteger la contraseña que utiliza para acceder al Servicio y de cualquier actividad o acción bajo su contraseña.\u003c/p\u003e\n    \u003cp\u003eUsted acepta no divulgar su contraseña a terceros. Debe notificarnos inmediatamente al tomar conocimiento de cualquier violación de seguridad o uso no autorizado de su cuenta.\u003c/p\u003e\n\n    \u003ch2\u003ePedidos de Bienes/Servicios\u003c/h2\u003e\n    \u003ch3\u003ePeriodo de Suscripción\u003c/h3\u003e\n    \u003cp\u003eEl Servicio o algunas partes del Servicio están disponibles únicamente con una Suscripción paga. Usted será facturado por adelantado de manera recurrente (mensual o anual), dependiendo del tipo de plan de suscripción que seleccione.\u003c/p\u003e\n    \u003cp\u003eAl final de cada periodo, su Suscripción se renovará automáticamente bajo las mismas condiciones a menos que la cancele o la Empresa la cancele.\u003c/p\u003e\n    \n    \u003ch3\u003eCancelación de Suscripción\u003c/h3\u003e\n    \u003cp\u003ePuede cancelar la renovación de su Suscripción a través de la configuración de su Cuenta o contactándonos. No recibirá un reembolso por tarifas ya pagadas por el periodo de suscripción actual y podrá acceder al Servicio hasta el final del periodo vigente.\u003c/p\u003e\n\n    \u003ch3\u003eCambios de Precio\u003c/h3\u003e\n    \u003cp\u003eLa Empresa puede, a su entera discreción, modificar los precios de suscripción en cualquier momento. Cualquier cambio entrará en vigor al final del periodo de suscripción actual.\u003c/p\u003e\n\n    \u003ch3\u003eReembolsos\u003c/h3\u003e\n    \u003cp\u003eExcepto cuando lo requiera la ley, las tarifas de suscripción pagadas no son reembolsables. Los reembolsos pueden ser considerados caso por caso a la entera discreción de la Empresa.\u003c/p\u003e\n\n    \u003ch3\u003ePrueba Gratuita\u003c/h3\u003e\n    \u003cp\u003eLa Empresa puede ofrecer una prueba gratuita por un tiempo limitado. Al final del periodo de prueba, se le cobrará automáticamente las tarifas de suscripción a menos que cancele antes del final del periodo de prueba.\u003c/p\u003e\n\n    \u003ch2\u003eContenido del Usuario\u003c/h2\u003e\n    \u003cp\u003eNuestro Servicio permite que Usted publique Contenido. Usted es responsable del Contenido que publica en el Servicio, incluyendo su legalidad, confiabilidad y adecuación.\u003c/p\u003e\n    \u003cp\u003eAl publicar Contenido en el Servicio, Usted nos concede el derecho y la licencia de usar, modificar, ejecutar públicamente, exhibir públicamente, reproducir y distribuir tal Contenido en y a través del Servicio.\u003c/p\u003e\n    \u003cp\u003eUsted declara y garantiza que: (i) el Contenido es suyo o tiene el derecho de usarlo y de concedernos derechos y licencia conforme se establece en estos Términos, y (ii) la publicación de su Contenido en o a través del Servicio no viola los derechos de privacidad, derechos de publicidad, derechos de autor, derechos contractuales o cualquier otro derecho de cualquier persona.\u003c/p\u003e\n\n    \u003ch2\u003ePropiedad Intelectual\u003c/h2\u003e\n    \u003cp\u003eEl Servicio y su contenido original (excluyendo el Contenido proporcionado por Usted u otros usuarios), características y funcionalidades son y seguirán siendo propiedad exclusiva de la Empresa y sus licenciadores.\u003c/p\u003e\n    \u003cp\u003eEl Servicio está protegido por derechos de autor, marcas registradas y otras leyes tanto de Brasil como de países extranjeros.\u003c/p\u003e\n    \u003cp\u003eNuestras marcas comerciales y diseños no pueden ser utilizados en conexión con ningún producto o servicio sin el consentimiento previo por escrito de la Empresa.\u003c/p\u003e\n\n    \u003ch2\u003eLinks para Otros Sitios\u003c/h2\u003e\n    \u003cp\u003eNuestro Servicio puede contener enlaces a sitios o servicios de terceros que no son propiedad ni están controlados por la Empresa.\u003c/p\u003e\n    \u003cp\u003eLa Empresa no tiene control y no asume ninguna responsabilidad por el contenido, políticas de privacidad o prácticas de cualesquiera sitios o servicios de terceros. Usted reconoce y acepta que la Empresa no será responsable, directa o indirectamente, por cualquier daño o pérdida causada o alegadamente causada por o en conexión con el uso o confianza en tal contenido, bienes o servicios disponibles en o a través de tales sitios o servicios.\u003c/p\u003e\n\n    \u003ch2\u003eRescisión\u003c/h2\u003e\n    \u003cp\u003ePodemos rescindir o suspender su Cuenta inmediatamente, sin previo aviso o responsabilidad, por cualquier motivo, incluyendo, sin limitación, si Usted viola estos Términos y Condiciones.\u003c/p\u003e\n    \u003cp\u003eTras la rescisión, su derecho a usar el Servicio cesará inmediatamente.\u003c/p\u003e\n\n    \u003ch2\u003eLimitación de Responsabilidad\u003c/h2\u003e\n    \u003cp\u003eNo obstante cualquier daño que Usted pueda incurrir, la responsabilidad total de la Empresa y de cualquiera de sus proveedores bajo cualquier disposición de estos Términos y su recurso exclusivo para todo lo anterior será limitado al monto realmente pagado por Usted a través del Servicio o 100 BRL si Usted no ha comprado nada a través del Servicio.\u003c/p\u003e\n    \u003cstrong\u003eEN LA MEDIDA MÁXIMA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO SERÁ RESPONSABLE LA EMPRESA O SUS PROVEEDORES POR CUALQUIER DAÑO ESPECIAL, INCIDENTAL, INDIRECTO O CONSECUENTE DE CUALQUIER NATURALEZA\u003c/strong\u003e (incluyendo, pero no limitado a, daños por pérdida de beneficios, pérdida de datos u otra información, por interrupción del negocio, por lesiones personales, pérdida de privacidad que surja de o de cualquier forma relacionada con el uso o la incapacidad de usar el Servicio, software de terceros y/o hardware de terceros utilizado con el Servicio, o de otra forma en conexión con cualquier disposición de estos Términos).\n    \n    \u003ch2\u003eExención de Garantías\u003c/h2\u003e\n    \u003cp\u003eEL SERVICIO SE PROPORCIONA \"TAL CUAL\" Y \"SEGÚN DISPONIBILIDAD\" SIN GARANTÍAS DE NINGÚN TIPO, TÁCITAS O EXPRESAS, INCLUYENDO, PERO NO LIMITADO A, GARANTÍAS TÁCITAS DE COMERCIABILIDAD, ADECUACIÓN PARA UN PROPÓSITO PARTICULAR Y NO INFRACCIÓN.\u003c/p\u003e\n    \u003cp\u003eLA EMPRESA NO GARANTIZA QUE: (A) EL SERVICIO CUMPLIRÁ CON SUS REQUISITOS; (B) EL SERVICIO SERÁ ININTERRUMPIDO, OPORTUNO, SEGURO O LIBRE DE ERRORES; (C) LOS RESULTADOS OBTENIDOS DEL USO DEL SERVICIO SERÁN EXACTOS O FIABLES; O (D) LA CALIDAD DE CUALQUIER PRODUCTO, SERVICIO, INFORMACIÓN U OTRO MATERIAL OBTENIDO A TRAVÉS DEL SERVICIO CUMPLIRÁN CON SUS EXPECTATIVAS.\u003c/p\u003e\n\n    \u003ch2\u003eDerechos de los Usuarios\u003c/h2\u003e\n    \u003cp\u003eConforme a la Ley General de Protección de Datos de Brasil (LGPD - Ley N° 13.709/2018), usted tiene derecho a:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eAcceder a sus datos personales.\u003c/li\u003e\n        \u003cli\u003eSolicitar la corrección de sus datos personales.\u003c/li\u003e\n        \u003cli\u003eSolicitar la eliminación de sus datos.\u003c/li\u003e\n        \u003cli\u003eRevocar su consentimiento en cualquier momento.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003eLos detalles sobre estos derechos están disponibles en la Política de Privacidad de la Empresa.\u003c/p\u003e\n\n    \u003ch2\u003eAceptación por Uso\u003c/h2\u003e\n    \u003cp\u003eAL ACCEDER, DESCARGAR, INSTALAR O UTILIZAR EL SERVICIO, USTED RECONOCE QUE HA LEÍDO, ENTIENDE Y ACEPTA ESTAR SUJETO A ESTOS TÉRMINOS. SI NO ACEPTA ESTOS TÉRMINOS, NO ACCEDA NI UTILICE EL SERVICIO.\u003c/p\u003e\n    \u003cp\u003eEl uso continuo del Servicio después de cualquier modificación a estos Términos constituye su aceptación de tales modificaciones.\u003c/p\u003e\n\n    \u003ch2\u003eLey Aplicable\u003c/h2\u003e\n    \u003cp\u003eEstos Términos se regirán e interpretarán de acuerdo con las leyes de la República Federativa del Brasil, sin tener en cuenta sus disposiciones sobre conflictos de leyes.\u003c/p\u003e\n    \u003cp\u003eCualquier disputa que surja de o esté relacionada con estos Términos será presentada a la jurisdicción exclusiva de los tribunales de la ciudad de São Paulo, Estado de São Paulo, Brasil, y las partes renuncian irrevocablemente a cualquier objeción a la jurisdicción de dichos tribunales.\u003c/p\u003e\n\n    \u003ch2\u003eResolución de Disputas\u003c/h2\u003e\n    \u003cp\u003eSi usted tiene alguna preocupación o disputa sobre el Servicio, acepta intentar resolver la disputa informalmente contactando a la Empresa.\u003c/p\u003e\n\n    \u003ch2\u003eDisposiciones Generales\u003c/h2\u003e\n    \u003ch3\u003eRenuncia\u003c/h3\u003e\n    \u003cp\u003eLa falta de la Empresa en ejercer cualquier derecho o disposición de estos Términos no será considerada como una renuncia a esos derechos.\u003c/p\u003e\n\n    \u003ch3\u003eDivisibilidad\u003c/h3\u003e\n    \u003cp\u003eSi alguna disposición de estos Términos es considerada inaplicable o inválida, tal disposición será alterada e interpretada para alcanzar los objetivos de dicha disposición en la mayor medida posible bajo la ley aplicable, y las disposiciones restantes continuarán en pleno vigor y efecto.\u003c/p\u003e\n\n    \u003ch3\u003eA Acuerdo Integral\u003c/h3\u003e\n    \u003cp\u003eEstos Términos constituyen el acuerdo completo entre Usted y la Empresa respecto al uso del Servicio y sustituyen todos los acuerdos anteriores y contemporáneos.\u003c/p\u003e\n\n    \u003ch2\u003eContacto\u003c/h2\u003e\n    \u003cp\u003eSi tiene alguna duda sobre estos Términos y Condiciones, puede contactarnos:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eCorreo electrónico: info@incodetech.com.br\u003c/li\u003e\n        \u003cli\u003eVisitando esta página: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\u003c/body\u003e\n\u003c/html\u003e","label":"Términos y Condiciones","languageLabel":"Español"},{"documentType":"eula","language":"FR","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003eContrat de Licence de Utilisateur Final\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch1\u003eContrat de Licence de Utilisateur Final (\"Contrat\")\u003c/h1\u003e\n    \u003cp\u003eDernière mise à jour : 20 janvier 2026\u003c/p\u003e\n    \u003cp\u003eVeuillez lire attentivement ce Contrat de Licence de Utilisateur Final avant de cliquer sur le bouton \"J'accepte\", de télécharger ou d'utiliser RENDERWEAR.\u003c/p\u003e\n\n    \u003ch2\u003eInterprétation et Définitions\u003c/h2\u003e\n\n    \u003ch3\u003eInterprétation\u003c/h3\u003e\n    \u003cp\u003eLes mots dont la première lettre est en majuscule ont des significations définies dans les conditions suivantes. Les définitions suivantes doivent avoir le même sens, qu'elles apparaissent au singulier ou au pluriel.\u003c/p\u003e\n\n    \u003ch3\u003eDéfinitions\u003c/h3\u003e\n    \u003cp\u003eAux fins de ce Contrat de Licence de Utilisateur Final :\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eContrat\u003c/strong\u003e désigne ce Contrat de Licence de Utilisateur Final qui constitue l'intégralité de l'accord entre Vous et la Société concernant l'utilisation de l'Application.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eApplication\u003c/strong\u003e désigne le programme de logiciel fourni par la Société, dénommé RENDERWEAR.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSociété\u003c/strong\u003e (appelée \"Société\", \"Nous\", \"Nos\" ou \"Nos\" dans ce Contrat) désigne MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICAÇÃO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eContenu\u003c/strong\u003e désigne tout contenu tel que texte, images ou autres informations qui peuvent être postées, chargées, liées ou autrement mises à disposition par Vous.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePays\u003c/strong\u003e désigne : Brésil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDispositif\u003c/strong\u003e désigne tout appareil qui peut accéder à l'Application, tel qu'un ordinateur, un téléphone mobile ou une tablette numérique.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServices de Tiers\u003c/strong\u003e désigne tous les services ou contenus fournis par des tiers qui peuvent être affichés, inclus ou mis à disposition par l'Application.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVous\u003c/strong\u003e désigne l'individu qui accède à ou utilise l'Application ou la société ou autre personne juridique au nom de laquelle cet individu accède à ou utilise l'Application, le cas échéant.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eReconnaissance\u003c/h2\u003e\n    \u003cp\u003eEn cliquant sur le bouton \"J'accepte\", en téléchargeant ou en utilisant l'Application, Vous acceptez de respecter les termes et conditions de ce Contrat. Si Vous n'acceptez pas ces termes, ne cliquez pas sur le bouton \"J'accepte\", ne téléchargez pas et n'utilisez pas l'Application.\u003c/p\u003e\n    \u003cp\u003eCe Contrat est un document légal entre Vous et la Société et régit l'utilisation de l'Application mise à votre disposition par la Société.\u003c/p\u003e\n    \u003cp\u003eL'Application est licenciée, non vendue, à Vous par la Société pour une utilisation strictement conforme aux termes de ce Contrat.\u003c/p\u003e\n\n    \u003ch2\u003eLicence\u003c/h2\u003e\n\n    \u003ch3\u003ePortée de la Licence\u003c/h3\u003e\n    \u003cp\u003eLa Société vous accorde une licence révocable, non exclusive, non transférable et limitée pour télécharger, installer et utiliser l'Application strictement conformément aux termes de ce Contrat.\u003c/p\u003e\n    \u003cp\u003eVous ne pouvez utiliser l'Application que sur un Dispositif que vous possédez ou contrôlez.\u003c/p\u003e\n    \u003cp\u003eLa licence qui vous est accordée par la Société est exclusivement à des fins personnelles et non commerciales, strictement conformément aux termes de ce Contrat.\u003c/p\u003e\n\n    \u003ch3\u003eRestrictions de Licence\u003c/h3\u003e\n    \u003cp\u003eVous vous engagez à ne pas faire et à ne pas permettre à d'autres :\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eLicencier, vendre, louer, céder, distribuer, transmettre, héberger, sous-traiter, divulguer ou autrement exploiter commercialement l'Application ou la mettre à disposition de tiers.\u003c/li\u003e\n        \u003cli\u003eCopier ou utiliser l'Application à toute autre fin que celle permise dans la section 'Licence' ci-dessus.\u003c/li\u003e\n        \u003cli\u003eModifier, créer des œuvres dérivées, décompiler, désassembler ou réaliser une ingénierie inverse de toute partie de l'Application.\u003c/li\u003e\n        \u003cli\u003eSupprimer, modifier ou dissimuler toute mention de propriété (y compris tout avis de droits d'auteur ou de marque déposée) de la Société ou de ses filiales.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eContenu\u003c/h2\u003e\n\n    \u003ch3\u003eRestrictions de Contenu\u003c/h3\u003e\n    \u003cp\u003eLa Société n'est pas responsable des entrées, informations ou contenus des utilisateurs de l'Application. Vous comprenez expressément et convenez que vous êtes le seul responsable du Contenu et de toutes les activités qui se produisent sur votre compte.\u003c/p\u003e\n    \u003cp\u003eVous ne pouvez transmettre aucun Contenu qui soit illégal, offensant, troublant, menaçant, diffamatoire, obscène ou autrement contestable.\u003c/p\u003e\n    \u003cp\u003eLa Société se réserve le droit, mais non l'obligation, de déterminer à sa seule discrétion si tout Contenu est approprié ou non et conforme à cet Accord, de refuser ou de supprimer tout Contenu.\u003c/p\u003e\n\n    \u003ch2\u003ePropriété Intellectuelle\u003c/h2\u003e\n    \u003cp\u003eL'Application, y compris, sans limitation, tous les droits d'auteur, brevets, marques commerciales, secrets commerciaux et autres droits de propriété intellectuelle, sont et resteront la propriété unique et exclusive de la Société.\u003c/p\u003e\n    \u003cp\u003eLa Société ne sera pas tenue de vous indemniser ou de vous défendre concernant toute réclamation de tiers découlant ou liée à l'Application.\u003c/p\u003e\n\n    \u003ch2\u003eVos Suggestions\u003c/h2\u003e\n    \u003cp\u003eTout retour, commentaire, idée, amélioration ou suggestion que vous fournissez à la Société concernant l'Application demeurera la propriété unique et exclusive de la Société.\u003c/p\u003e\n    \u003cp\u003eLa Société sera libre d'utiliser, de copier, de modifier, de publier ou de redistribuer les suggestions à toute fin et sous toute forme, sans aucune reconnaissance ou compensation pour vous.\u003c/p\u003e\n\n    \u003ch2\u003eModifications de l'Application\u003c/h2\u003e\n    \u003cp\u003eLa Société se réserve le droit de modifier, de suspendre ou de suspendre temporairement ou définitivement, l'Application ou tout service auquel elle se connecte, avec ou sans préavis et sans responsabilité envers vous.\u003c/p\u003e\n\n    \u003ch3\u003eMises à Jour de l'Application\u003c/h3\u003e\n    \u003cp\u003eLa Société peut, de temps à autre, fournir des améliorations ou des mises à jour des fonctionnalités de l'Application, qui peuvent inclure des correctifs, des corrections de bogues, des mises à jour, des mises à niveau et d'autres modifications.\u003c/p\u003e\n    \u003cp\u003eVous convenez que la Société n'a aucune obligation de fournir des Mises à Jour ou de continuer à fournir ou activer des fonctionnalités et/ou caractéristiques spécifiques de l'Application pour vous.\u003c/p\u003e\n\n    \u003ch3\u003eMaintenance et Support\u003c/h3\u003e\n    \u003cp\u003eLa Société ne fournit aucune maintenance ou support pour le téléchargement et l'utilisation de l'Application.\u003c/p\u003e\n\n    \u003ch2\u003eServices de Tiers\u003c/h2\u003e\n    \u003cp\u003eL'Application peut afficher, inclure ou mettre à disposition du contenu de tiers ou fournir des liens vers des sites ou services de tiers.\u003c/p\u003e\n    \u003cp\u003eVous reconnaissez et convenez que la Société ne sera pas responsable d'aucun Service de Tiers, y compris leur exactitude, intégrité, réactivité, validité, conformité en matière de droits d'auteur, légalité, décence, qualité ou tout autre aspect de ceux-ci.\u003c/p\u003e\n\n    \u003ch2\u003eVigence et Résiliation\u003c/h2\u003e\n    \u003cp\u003eCe Contrat restera en vigueur jusqu'à ce qu'il soit résilié par vous ou par la Société.\u003c/p\u003e\n    \u003cp\u003eLa Société peut, à sa seule discrétion, à tout moment et pour n'importe quelle raison ou sans motif, suspendre ou résilier ce Contrat avec ou sans préavis.\u003c/p\u003e\n    \u003cp\u003eCe Contrat sera résilié immédiatement, sans préavis de la part de la Société, dans le cas où vous ne respecteriez pas une disposition de ce Contrat.\u003c/p\u003e\n    \u003cp\u003eAprès la résiliation de ce Contrat, vous devez cesser toute utilisation de l'Application et supprimer toutes les copies de l'Application de votre Dispositif.\u003c/p\u003e\n\n    \u003ch2\u003eIndemnisation\u003c/h2\u003e\n    \u003cp\u003eVous vous engagez à indemniser et à dégager de toute responsabilité la Société et ses sociétés mères, filiales, affiliées, directeurs, employés, agents, partenaires et concédants de licence de toute réclamation ou demande, y compris les honoraires d'avocats raisonnables, résultant de ou en rapport avec votre : (a) utilisation de l'Application ; (b) violation de ce Contrat ou de toute loi ou règlement ; ou (c) violation de tout droit de tiers.\u003c/p\u003e\n\n    \u003ch2\u003eSans Garanties\u003c/h2\u003e\n    \u003cp\u003eL'Application est fournie à vous \"Telle quelle\" et \"Tel qu'Disponible\" et avec tous les défauts et défauts sans garantie de quelque sorte.\u003c/p\u003e\n    \u003cp\u003eDans toute la mesure permise par la loi applicable, la Société, en son propre nom et au nom de ses affiliés et de ses concédants de licence et prestataires de services respectifs, renonce expressément à toutes les garanties, qu'elles soient expresses, implicites, légales ou autres, concernant l'Application, y compris toutes les garanties implicites cter :\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eE-mail : \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003eVisitez cette page : \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eConformité LGPD\u003c/h2\u003e\n    \u003cp\u003eCe document est conforme à la Loi Générale sur la Protection des Données du Brésil (LGPD - Loi n° 13.709/2018) et ses mises à jour, notamment :\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eRésolution CD/ANPD n° 19/2024 :\u003c/strong\u003e Règles pour le transfert international de données personnelles.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eNotification d'Incidents :\u003c/strong\u003e Délai de 3 (trois) jours ouvrables pour notifier l'ANPD et les personnes concernées.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDroits des Personnes Concernées :\u003c/strong\u003e Accès, rectification, portabilité, suppression et révocation du consentement.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDélégué à la Protection des Données (DPO) :\u003c/strong\u003e Coordonnées publiquement disponibles.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003eAbonnements et Paiements\u003c/h3\u003e\n\n    \u003ch4\u003ePériode d'Abonnement\u003c/h4\u003e\n    \u003cp\u003eLe Service ou certaines parties du Service ne sont disponibles qu'avec un Abonnement payant. Vous serez facturé à l'avance sur une base récurrente (mensuelle ou annuelle), selon le type de plan d'abonnement que vous sélectionnez.\u003c/p\u003e\n    \u003cp\u003eÀ la fin de chaque période, votre Abonnement se renouvellera automatiquement dans les mêmes conditions, sauf si vous l'annulez ou que la Société l'annule.\u003c/p\u003e\n\n    \u003ch4\u003eAnnulation d'Abonnement\u003c/h4\u003e\n    \u003cp\u003eVous u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eConformité LGPD\u003c/h2\u003e\n\n\u003cp\u003eCe document est conforme à la Loi Générale sur la Protection des Données du Brésil (LGPD - Loi n° 13.709/2018) et ses mises à jour, notamment :\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eRésolution CD/ANPD n° 19/2024\u003c/strong\u003e : Règles pour le transfert international de données personnelles\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotification d'Incidents\u003c/strong\u003e : Délai de 3 (trois) jours ouvrables pour notifier l'ANPD et les personnes concernées\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDroits des Personnes Concernées\u003c/strong\u003e : Accès, rectification, portabilité, suppression et révocation du consentement\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDélégué à la Protection des Données (DPO)\u003c/strong\u003e : Coordonnées publiquement disponibles\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eEn utilisant notre Service, vous acceptez également notre Politique de Confidentialité, qui fournit des détails sur la façon dont nous collectons, utilisons et protégeons vos informations.\u003c/p\u003e\n\n\u003cp\u003eNous nous réservons le droit de modifier ces Conditions à tout moment, et toute modification prendra effet immédiatement après sa publication sur notre Site. Votre utilisation continue du Service après la publication des modifications constitue votre acceptation des nouvelles Conditions.\u003c/p\u003e","label":"Termes et Conditions","languageLabel":"Français"},{"documentType":"privacy_consent","language":"DE","content":"\u003ch2\u003eDatenschutzbestimmungen für Cookies\u003c/h2\u003e\n\n\u003cp\u003eAktualisiert am: 20. Januar 2026\u003c/p\u003e\n\n\u003cp\u003eDiese Datenschutzbestimmungen erläutern, was Cookies sind und wie wir sie verwenden. Sie sollten diese Bestimmungen lesen, um zu verstehen, welche Arten von Cookies wir verwenden oder welche Informationen wir mithilfe von Cookies sammeln und wie diese Informationen verwendet werden.\u003c/p\u003e\n\n\u003cp\u003eCookies enthalten normalerweise keine Informationen, die einen Benutzer persönlich identifizieren, aber die personenbezogenen Daten, die wir über Sie speichern, können an die Informationen, die in Cookies gespeichert sind und die durch Cookies gesammelt werden, gebunden sein. Für weitere Informationen darüber, wie wir Ihre personenbezogenen Daten verwenden, speichern und schützen, lesen Sie unsere Datenschutzerklärung.\u003c/p\u003e\n\n\u003cp\u003eWir speichern keine sensiblen personenbezogenen Daten, wie Anschriften, Kontopasswörter usw. in den Cookies, die wir verwenden.\u003c/p\u003e\n\n\u003ch2\u003e1. Auslegung und Definitionen\u003c/h2\u003e\n\n\u003ch3\u003e1.1 Auslegung\u003c/h3\u003e\n\u003cp\u003eDie Worte, die mit einem Großbuchstaben beginnen, haben die folgenden Bedeutungen. Die folgenden Definitionen sollen unabhängig davon, ob sie im Singular oder Plural erscheinen, denselben Sinn haben.\u003c/p\u003e\n\n\u003ch3\u003e1.2 Definitionen\u003c/h3\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003cstrong\u003eUnternehmen\u003c/strong\u003e (in dieser Cookie-Richtlinie als \"das Unternehmen\", \"wir\", \"uns\" oder \"unser\" bezeichnet) bezieht sich auf MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e bezeichnet kleine Dateien, die von einer Website auf Ihrem Computer, mobilen Gerät oder einem anderen Gerät platziert werden und Details zu Ihrem Surfverhalten auf dieser Website zwischen den verschiedenen Nutzungen enthalten.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eWebsite\u003c/strong\u003e bezieht sich auf RENDERWEAR, zugänglich unter \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ewww.incodetech.com.br\u003c/a\u003e.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eSie\u003c/strong\u003e bezeichnet die Einzelperson, die auf die Website zugreift oder sie nutzt, oder ein Unternehmen oder eine juristische Person, in deren Namen die Einzelperson auf die Website zugreift oder sie nutzt, je nach Anwendbarkeit.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e2. Verwendung von Cookies\u003c/h2\u003e\n\n\u003ch3\u003e2.1 Arten von Cookies, die wir verwenden\u003c/h3\u003e\n\u003cp\u003eDie Cookies können entweder \"Persistente\" oder \"Sitzungs-Cookies\" sein. Persistente Cookies bleiben auf Ihrem Computer oder mobilen Gerät, auch wenn Sie offline sind, während Sitzungs-Cookies nach dem Schließen des Browsers gelöscht werden.\u003c/p\u003e\n\u003cp\u003eWir verwenden sowohl Sitzungs-Cookies als auch persistente Cookies für die Zwecke, die unten definiert sind:\u003c/p\u003e\n\n\u003ch3\u003e2.2 Essenzielle Cookies\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eTyp:\u003c/strong\u003e Sitzungs-Cookies\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVerwaltet von:\u003c/strong\u003e Uns\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eZweck:\u003c/strong\u003e Diese Cookies sind erforderlich, um Ihnen die über die Website verfügbaren Dienste bereitzustellen und Ihnen die Nutzung einiger ihrer Funktionen zu ermöglichen. Sie helfen bei der Authentifizierung von Benutzern und verhindern den missbräuchlichen Gebrauch von Benutzerkonten. Ohne diese Cookies können die von Ihnen angeforderten Dienste nicht bereitgestellt werden und wir verwenden diese Cookies nur, um Ihnen diese Dienste anzubieten.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003e2.3 Cookies für die Akzeptanz der Cookie-Richtlinie\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eTyp:\u003c/strong\u003e Persistente Cookies\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVerwaltet von:\u003c/strong\u003e Uns\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eZweck:\u003c/strong\u003e Diese Cookies identifizieren, ob die Benutzer die Verwendung von Cookies auf der Website akzeptiert haben.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003e2.4 Funktionale Cookies\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eTyp:\u003c/strong\u003e Persistente Cookies\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVerwaltet von:\u003c/strong\u003e Uns\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eZweck:\u003c/strong\u003e Diese Cookies ermöglichen es uns, die Entscheidungen, die Sie bei der Nutzung der Website treffen, zu speichern, wie z.B. Ihre Anmeldedaten oder Spracheinstellungen. Diese Cookies sollen Ihnen eine persönlichere Erfahrung bieten und verhindern, dass Sie Ihre Präferenzen bei jedem Besuch der Website erneut eingeben müssen.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003e2.5 Tracking- und Leistungs-Cookies\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eTyp:\u003c/strong\u003e Persistente Cookies\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVerwaltet von:\u003c/strong\u003e Dritten\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eZweck:\u003c/strong\u003e Diese Cookies werden verwendet, um Informationen über den Datenverkehr zur Website und die Nutzung der Website durch die Benutzer zu verfolgen. Die durch diese Cookies gesammelten Informationen können Sie direkt oder indirekt als individuellen Besucher identifizieren.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003e2.6 Werbung- und Targeting-Cookies\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eTyp:\u003c/strong\u003e Persistente Cookies\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVerwaltet von:\u003c/strong\u003e Dritten\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eZweck:\u003c/strong\u003e Diese Cookies verfolgen Ihre Surfgewohnheiten, um Werbung anzuzeigen, die wahrscheinlich von Ihrem Interesse ist.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e3. Ihre Wahl bezüglich der Cookies\u003c/h2\u003e\n\u003cp\u003eWenn Sie die Verwend ßlich der Verfolgung Ihrer Interaktion mit dem eingebetteten Inhalt, falls Sie ein Konto haben und auf dieser Seite angemeldet sind.\u003c/p\u003e\n\n\u003ch2\u003e5. LGPD-Konformität\u003c/h2\u003e\n\u003cp\u003eDieses Dokument entspricht dem brasilianischen Allgemeinen Datenschutzgesetz (LGPD - Gesetz Nr. 13.709/2018) und seinen Aktualisierungen, einschließlich:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD-Beschluss CD Nr. 19/2024\u003c/strong\u003e: Regeln für die internationale Übertragung personenbezogener Daten\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVorfallmeldung:\u003c/strong\u003e Frist von 3 (drei) Werktagen zur Benachrichtigung der ANPD und der betroffenen Personen\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eRechte der Betroffenen:\u003c/strong\u003e Zugang, Berichtigung, Übertragbarkeit, Löschung und Widerruf der Einwilligung\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDatenschutzbeauftragter (DPO):\u003c/strong\u003e Kontaktinformationen öffentlich verfügbar\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eWir müssen Ihren Verstand erhalten, bevor wir nicht wesentliche Cookies auf Ihrem Gerät ablegen. Sie können Ihre Cookie-Einstellungen jederzeit anpassen.\u003c/p\u003e\n\n\u003ch2\u003e6. Kontakt\u003c/h2\u003e\n\u003cp\u003eWenn Sie Fragen zu diesen Cookie-Richtlinien haben, können Sie uns kontaktieren:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eE-Mail:\u003c/strong\u003e \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eBesuchen Sie unsere Kontaktseite:\u003c/strong\u003e \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eKontaktseite\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e7. Haftungsausschluss und Beschränkung der Haftung\u003c/h2\u003e\n\u003cp\u003eSofern gesetzlich zulässig, haften das Unternehmen oder seine Lieferanten in keinem Fall für spez cher Änderungen dar.\u003c/p\u003e\n\n\u003ch2\u003e10. Anwendbares Recht und Gerichtsstand\u003c/h2\u003e\n\u003cp\u003eDiese Bedingungen unterliegen den Gesetzen der Brasilianischen Republik und sind gemäß diesen auszulegen, ohne Rücksicht auf die Kollisionsnormen.\u003c/p\u003e\n\u003cp\u003eAlle Streitigkeiten, die sich aus oder im Zusammenhang mit diesen Bedingungen ergeben, sind der ausschließlichen Gerichtsbarkeit der Gerichte der Stadt São Paulo, Bundesstaat São Paulo, Brasilien, unterworfen, und die Parteien verzichten unwiderruflich auf jegliche Einwendungen gegen die Gerichtsbarkeit solcher Gerichte.\u003c/p\u003e\n\n\u003ch2\u003e11. Risikoübernahme\u003c/h2\u003e\n\u003cp\u003eSie übernehmen die volle Verantwortung und das Risiko für Ihre Nutzung des Dienstes. Der Dienst wird \"wie er ist\" ohne jegliche Gewährleistung bereitgestellt. Das Unternehmen haftet nicht für Schäden, die aus der Nutzung oder Unfähigkeit zur Nutzung des Dienstes resultieren, einschließlich Schäden durch Malware, Viren oder jedes falsche oder unvollständige Computerprogramm.\u003c/p\u003e","label":"Datenschutzeinwilligung (Cookies)","languageLabel":"Deutsch"},{"documentType":"eula","language":"DE","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003eEndbenutzer-Lizenzvertrag\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003eEndbenutzer-Lizenzvertrag (\"Vertrag\")\u003c/h2\u003e\n    \u003cp\u003eLetzte Aktualisierung: 20. Januar 2026\u003c/p\u003e\n    \u003cp\u003eBitte lesen Sie diesen Endbenutzer-Lizenzvertrag sorgfältig durch, bevor Sie auf \"Ich stimme zu\" klicken, RENDERWEAR herunterladen oder verwenden.\u003c/p\u003e\n\n    \u003ch2\u003eAuslegung und Definitionen\u003c/h2\u003e\n\n    \u003ch3\u003eAuslegung\u003c/h3\u003e\n    \u003cp\u003eDie in diesem Vertrag verwendeten Begriffe mit einem großen Anfangsbuchstaben haben die in den folgenden Bedingungen definierten Bedeutungen. Die folgenden Definitionen haben unabhängig von der Verwendung im Singular oder Plural die gleiche Bedeutung.\u003c/p\u003e\n\n    \u003ch3\u003eDefinitionen\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eVertrag\u003c/strong\u003e bedeutet diesen Endbenutzer-Lizenzvertrag, der den gesamten Vertrag zwischen Ihnen und der Firma bezüglich der Nutzung der Anwendung darstellt.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAnwendung\u003c/strong\u003e bezieht sich auf das von der Firma bereitgestellte Softwareprogramm namens RENDERWEAR.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eFirma\u003c/strong\u003e (im Folgenden \"Firma\", \"Wir\", \"Uns\" oder \"Unser\") bezieht sich auf MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInhalt\u003c/strong\u003e bezieht sich auf Inhalte wie Texte, Bilder oder andere Informationen, die Sie posten, hochladen, verlinken oder auf andere Weise zur Verfügung stellen können.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eLand\u003c/strong\u003e bezieht sich auf: Brasilien.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eGerät\u003c/strong\u003e bedeutet jedes Gerät, das auf die Anwendung zugreifen kann, wie einen Computer, ein Mobiltelefon oder ein digitales Tablet.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDienste von Dritten\u003c/strong\u003e bedeutet alle von Dritten bereitgestellten Dienste oder Inhalte, die in der Anwendung angezeigt, einbezogen oder zur Verfügung gestellt werden können.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSie\u003c/strong\u003e bezeichnet die Person, die auf die Anwendung zugreift oder sie benutzt, oder das Unternehmen oder die juristische Person, in deren Namen diese Person auf die Anwendung zugreift oder sie verwendet, je nach Anwendbarkeit.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eAkzeptanz\u003c/h2\u003e\n    \u003cp\u003eDurch Klicken auf den Button \"Ich stimme zu\", das Herunterladen oder die Nutzung der Anwendung stimmen Sie den Bedingungen und Konditionen dieses Vertrags zu. Wenn Sie nicht mit den Bedingungen dieses Vertrags einverstanden sind, klicken Sie nicht auf \"Ich stimme zu\", laden Sie die Anwendung nicht herunter und verwenden Sie sie nicht.\u003c/p\u003e\n    \u003cp\u003eDieser Vertrag ist ein rechtliches Dokument zwischen Ihnen und der Firma und regelt die Nutzung der Anwendung, die Ihnen von der Firma bereitgestellt wird.\u003c/p\u003e\n    \u003cp\u003eDie Anwendung wird Ihnen von der Firma lizenziert, nicht verkauft, zur Nutzung streng gemäß den Bedingungen dieses Vertrags.\u003c/p\u003e\n\n    \u003ch2\u003eLizenz\u003c/h2\u003e\n\n    \u003ch3\u003eUmfang der Lizenz\u003c/h3\u003e\n    \u003cp\u003eDie Firma gewährt Ihnen eine widerrufbare, nicht-exklusive, nicht übertragbare und eingeschränkte Lizenz zum Herunterladen, Installieren und Verwenden der Anwendung, strikt gemäß den Bedingungen dieses Vertrags.\u003c/p\u003e\n    \u003cp\u003eSie dürfen die Anwendung nur auf einem Gerät verwenden, das Sie besitzen oder kontrollieren.\u003c/p\u003e\n    \u003cp\u003eDie Ihnen von der Firma eingeräumte Lizenz ist ausschließlich für persönliche und nicht-kommerzielle Zwecke und strikt gemäß den Bedingungen dieses Vertrags.\u003c/p\u003e\n\n    \u003ch3\u003eEinschränkungen der Lizenz\u003c/h3\u003e\n    \u003cp\u003eSie stimmen zu, Folgendes nicht zu tun und auch anderen nicht zu erlauben:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eDie Anwendung zu lizenzieren, zu verkaufen, zu vermieten, zu vermieten, abzutreten, zu verteilen, zu übertragen, zu hosten, auszulagern, zu veröffentlichen oder anderweitig kommerziell zu nutzen oder der Anwendung Dritten zur Verfügung zu stellen.\u003c/li\u003e\n        \u003cli\u003eDie Anwendung zu kopieren oder für andere Zwecke zu verwenden als die in dem obenstehenden Ab leinige und exklusive Eigentum der Firma.\u003c/p\u003e\n    \u003cp\u003eDie Firma ist berechtigt, Vorschläge für beliebige Zwecke und in beliebiger Weise zu nutzen, zu kopieren, zu ändern, zu veröffentlichen oder weiterzuverbreiten, ohne Ihnen eine Anerkennung oder Entschädigung zu gewähren.\u003c/p\u003e\n\n    \u003ch2\u003eÄnderungen an der Anwendung\u003c/h2\u003e\n    \u003cp\u003eDie Firma behält sich das Recht vor, die Anwendung oder jeden Dienst, mit dem sie verbunden ist, vorübergehend oder dauerhaft zu ändern, auszusetzen oder einzustellen, ganz oder teilweise, mit oder ohne vorherige Ankündigung und ohne Haftung gegenüber Ihnen.\u003c/p\u003e\n\n    \u003ch3\u003eUpdates der Anwendung\u003c/h3\u003e\n    \u003cp\u003eDie Firma kann von Zeit zu Zeit Verbesserungen oder Aktualisierungen der Funktionen/Features der Anwendung bereitstellen, die Patches, Fehlerbehebungen, Updates, Upgrades und andere Änderungen umfassen können.\u003c/p\u003e\n    \u003cp\u003eSie stimmen zu, dass die Firma nicht verpflichtet ist, irgendwelche Updates bereitzustellen oder weiterhin bestimmte Funktionen und/oder Features der Anwendung für Sie bereitzustellen oder zu aktivieren.\u003c/p\u003e\n\n    \u003ch3\u003eWartung und Support\u003c/h3\u003e\n    \u003cp\u003eDie Firma bietet keine Wartung oder Unterstützung für den Download und die Nutzung der Anwendung an.\u003c/p\u003e\n\n    \u003ch2\u003eDienste von Dritten\u003c/h2\u003e\n    \u003cp\u003eDie Anwendung kann Inhalte von Dritten anzeigen, einbeziehen oder bereitstellen oder Links zu Websites oder Diensten von Dritten bereitstellen.\u003c/p\u003e\n    \u003cp\u003eSie erkennen an und stimmen zu, dass die Firma nicht verantwortlich ist für irgendwelche Dienste von Dritten, einschließlich ihrer Genauigkeit, Vollständigkeit, Aktualität, Rechtmäßigkeit, Anstand, Qualität oder irgendeinem anderen Aspekt.\u003c/p\u003e\n\n    \u003ch2\u003eLaufzeit und Kündigung\u003c/h2\u003e\n    \u003cp\u003eDieser Vertrag bleibt in Kraft
