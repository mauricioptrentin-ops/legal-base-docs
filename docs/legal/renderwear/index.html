e\u003cstrong\u003eAssinatura:\u003c/strong\u003e refere-se ao modelo de pagamento recorrente (SaaS) para acesso ao Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eTermos:\u003c/strong\u003e refere-se a estes Termos de Serviço que formam o acordo integral entre Você e a Empresa em relação ao uso do Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServiço de Terceiros:\u003c/strong\u003e significa qualquer serviço ou conteúdo (incluindo dados, informações, produtos ou serviços) fornecido por terceiros que pode ser exibido, incluído ou disponibilizado pelo Serviço.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e2. Descrição do Serviço\u003c/h2\u003e\n\n\u003cp\u003eO \u003cstrong\u003eRENDERWEAR\u003c/strong\u003e é uma solução de software avançada desenvolvida pela INCODE TECH destinada a processamento gráfico, renderização e design. O Serviço é fornecido sob licença, não vendido, e a Empresa retém todos os direitos de propriedade sobre o software subjacente.\u003c/p\u003e\n\n\u003cp\u003eA Empresa concede a Você uma licença limitada, não exclusiva, intransferível, não sublicenciável e revogável para usar o Serviço estritamente de acordo com estes Termos. Esta licença destina-se exclusivamente ao uso interno de seus negócios ou uso pessoal, conforme o plano de assinatura adquirido.\u003c/p\u003e\n\n\u003cp\u003eVocê concorda que a Empresa pode, a qualquer momento e sem aviso prévio, atualizar o Serviço, alterar recursos, modificar a interface do usuário ou descontinuar certas funcionalidades (\"Updates\"). Tais Updates podem ser necessários para manter a compatibilidade, segurança ou melhorar o Serviço. Você concorda em receber tais Updates automaticamente.\u003c/p\u003e\n\n\u003ch2\u003e3. Contas de Usuário\u003c/h2\u003e\n\n\u003ch3\u003e3.1. Criação e Segurança da Conta\u003c/h3\u003e\n\u003cp\u003eAo criar uma Conta conosco, Você deve fornecer informações precisas, completas e atuais em todos os momentos. O não cumprimento desta obrigação constitui uma violação destes Termos, o que pode resultar no encerramento imediato de sua Conta em nosso Serviço.\u003c/p\u003e\n\n\u003cp\u003eVocê é inteiramente responsável por salvaguardar a senha que usa para acessar o Serviço e por quaisquer atividades ou ações sob sua senha, seja sua senha com nosso Serviço ou um Serviço de Terceiros. Você concorda em não divulgar sua senha a terceiros. Você deve nos notificar imediatamente ao tomar conhecimento de qualquer violação de segurança ou uso não autorizado de sua conta.\u003c/p\u003e\n\n\u003ch3\u003e3.2. Proibições de Uso\u003c/h3\u003e\n\u003cp\u003eVocê não pode usar como nome de usuário o nome de outra pessoa ou entidade ou que não esteja legalmente disponível para uso, um nome ou marca comercial que esteja sujeita a quaisquer direitos de outra pessoa ou entidade que não seja Você sem a devida autorização, ou um nome que seja ofensivo, vulgar ou obsceno.\u003c/p\u003e\n\n\u003ch3\u003e3.3. Encerramento de Conta pela Empresa\u003c/h3\u003e\n\u003cp\u003eNós podemos encerrar ou suspender sua Conta imediatamente, sem aviso prévio ou responsabilidade, por qualquer motivo, incluindo, sem limitação, se Você violar estes Termos. Após o encerramento, seu direito de usar o Serviço cessará imediatamente. Se desejar encerrar sua conta, Você pode simplesmente interromper o uso do Serviço ou solicitar o cancelamento através dos canais oficiais.\u003c/p\u003e\n\n\u003ch2\u003e4. Termos de Pagamento\u003c/h2\u003e\n\n\u003ch3\u003e4.1. Assinaturas e Renovação Automática\u003c/h3\u003e\n\u003cp\u003eO Serviço é cobrado em regime de assinatura (\"Assinatura\"). Você será cobrado antecipadamente em uma base recorrente e periódica (como mensalmente ou anualmente), dependendo do tipo de plano de assinatura que você selecionar ao comprar a Assinatura.\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eAO FORNECER UM MÉTODO DE PAGAMENTO, VOCÊ AUTORIZA EXPRESSAMENTE A EMPRESA A COBRAR AS TAXAS DE ASSINATURA APLICÁVEIS, BEM COMO QUAISQUER IMPOSTOS ASSOCIADOS, EM INTERVALOS REGULARES ATÉ QUE A ASSINATURA SEJA CANCELADA.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eNo final de cada período, sua Assinatura será renovada automaticamente sob as mesmas condições exatas, a menos que Você a cancele ou a Empresa a cancele. O não pagamento resultará na suspensão imediata do acesso ao Serviço.\u003c/p\u003e\n\n\u003ch3\u003e4.2. Cancelamento de Assinatura\u003c/h3\u003e\n\u003cp\u003eVocê pode cancelar a renovação de sua Assinatura através da página de configurações da sua Conta ou entrando em contato com a Empresa em \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e. O cancelamento entrará em vigor no dia seguinte ao último dia do período de assinatura atual. \u003cstrong\u003eVocê não receberá um reembolso pelas taxas já pagas pelo período de assinatura atual\u003c/strong\u003e e poderá acessar o Serviço até o final de tal período.\u003c/p\u003e\n\n\u003ch3\u003e4.3. Alterações de Preço\u003c/h3\u003e\n\u003cp\u003eA Empresa, a seu exclusivo critério e a qualquer momento, pode modificar as taxas de Assinatura. Qualquer alteração na taxa de Assinatura entrará em vigor no final do período de Assinatura atual. A Empresa fornecerá a Você um aviso prévio razoável de qualquer alteração nas taxas de Assinatura para lhe dar a oportunidade de encerrar sua Assinatura antes que tal alteração entre em vigor. O uso continuado do Serviço após a alteração da taxa de Assinatura entrar em vigor constitui seu acordo em pagar o valor da taxa de Assinatura modificada.\u003c/p\u003e\n\n\u003ch3\u003e4.4. Política de Reembolso\u003c/h3\u003e\n\u003cp\u003eExceto quando exigido por lei, as taxas de Assinatura pagas são \u003cstrong\u003eNÃO REEMBOLSÁVEIS\u003c/strong\u003e. Certas solicitações de reembolso para Assinaturas podem ser consideradas pela Empresa caso a caso e concedidas a critério exclusivo da Empresa. A natureza digital do software RENDERWEAR impede a devolução do \"produto\" uma vez acessado ou baixado.\u003c/p\u003e\n\n\u003ch3\u003e4.5. Teste Gratuito\u003c/h3\u003e\n\u003cp\u003eA Empresa pode, a seu exclusivo critério, oferecer uma Assinatura com um teste gratuito por um período limitado de tempo (\"Free Trial\"). Você pode ser obrigado a inserir suas informações de faturamento para se inscrever no Teste Gratuito. Se Você inserir suas informações de faturamento ao se inscrever no Teste Gratuito, Você não será cobrado pela Empresa até que o Teste Gratuito expire. No último dia do período de Teste Gratuito, a menos que Você tenha cancelado sua Assinatura, Você será cobrado automaticamente as taxas de Assinatura aplicáveis para o tipo de Assinatura que Você selecionou.\u003c/p\u003e\n\n\u003ch2\u003e5. Disponibilidade do Serviço\u003c/h2\u003e\n\n\u003cp\u003eA Empresa se esforça para manter o Serviço operacional e acessível; no entanto, o Serviço é fornecido dependendo de infraestrutura de terceiros e conectividade com a Internet. A Empresa não garante tempo de atividade (uptime) específico, exceto se expressamente acordado em um Contrato de Nível de Serviço (SLA) separado e assinado entre as partes.\u003c/p\u003e\n\n\u003cp\u003eA Empresa reserva-se o direito de suspender o Serviço para:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eManutenção programada ou de emergência;\u003c/li\u003e\n    \u003cli\u003eAtualizações de segurança;\u003c/li\u003e\n    \u003cli\u003eEventos de força maior, incluindo greves, desastres naturais, guerras, ou falhas na infraestrutura de internet global.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eA EMPRESA NÃO SERÁ RESPONSÁVEL POR QUAISQUER DANOS OU PERDAS DECORRENTES DE TEMPOS DE INATIVIDADE DO SERVIÇO, INDISPONIBILIDADE DE DADOS OU INTERRUPÇÕES.\u003c/p\u003e\n\n\u003ch2\u003e6. Propriedade Intelectual\u003c/h2\u003e\n\n\u003ch3\u003e6.1. Direitos da Empresa\u003c/h3\u003e\n\u003cp\u003eO Serviço e seu conteúdo original (excluindo o Conteúdo fornecido por Você ou outros usuários), características e funcionalidades são e permanecerão de propriedade exclusiva da Empresa e de seus licenciadores. O Serviço é protegido por direitos autorais, marcas registradas e outras leis do Brasil e de países estrangeiros (tratados internacionais).\u003c/p\u003e\n\u003cp\u003eNossas marcas comerciais, incluindo \"RENDERWEAR\", \"INCODE TECH\", \"IN/FUSE BRANDING\" e \"MT/FORM DESIGN\", e a identidade visual comercial não podem ser usadas em conexão com qualquer produto ou serviço sem o consentimento prévio por escrito da Empresa.\u003c/p\u003e\n\n\u003ch3\u003e6.2. Conteúdo do Usuário\u003c/h3\u003e\n\u003cp\u003eVocê retém todos os direitos sobre qualquer Conteúdo que enviar, postar ou exibir no ou através do Serviço. Ao enviar, postar ou exibir Conteúdo, Você concede à Empresa uma licença mundial, não exclusiva e isenta de royalties para usar, processar, armazenar, reproduzir e adaptar tal Conteúdo apenas na medida necessária para fornecer e manter o Serviço para Você.\u003c/p\u003e\n\n\u003ch3\u003e6.3. Restrições (Engenharia Reversa)\u003c/h3\u003e\n\u003cp\u003eVocê concorda estritamente em não, e não permitirá que terceiros:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eLicenciar, vender, alugar, arrendar, transferir, ceder, distribuir, hospedar ou explorar comercialmente o Serviço;\u003c/li\u003e\n    \u003cli\u003eModificar, fazer trabalhos derivados, desmontar, descompilar, ou fazer engenharia reversa de qualquer parte do Serviço;\u003c/li\u003e\n    \u003cli\u003eAcessar o Serviço para construir um serviço similar ou competitivo;\u003c/li\u003e\n    \u003cli\u003eRemover, alterar ou ocultar quaisquer avisos de direitos autorais ou outras marcas de propriedade incorporadas ao Serviço.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003e7. Limitação de Responsabilidade\u003c/h2\u003e\n\n\u003cp\u003e\u003cstrong\u003eESTA CLÁUSULA É DE EXTREMA IMPORTÂNCIA. LEIA COM ATENÇÃO.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL (INCLUINDO O CÓDIGO CIVIL E O CÓDIGO DE DEFESA DO CONSUMIDOR, QUANDO APLICÁVEL), EM NENHUM CASO A EMPRESA (MIRA DESIGN COMERCIO E SERVICOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA.), SEUS DIRETORES, FUNCIONÁRIOS, PARCEIROS, AGENTES, FORNECEDORES OU AFILIADOS SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS, CONSEQUENTES OU PUNITIVOS DE QUALQUER NATUREZA.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eISSO INCLUI, MAS NÃO SE LIMITA A: DANOS POR PERDA DE LUCROS (LUCROS CESSANTES), PERDA DE RECEITA, PERDA DE VENDAS, PERDA DE DADOS OU OUTRAS INFORMAÇÕES, INTERRUPÇÃO DE NEGÓCIOS, DANOS EMERGENTES, LESÃO PESSOAL, PERDA DE PRIVACIDADE DECORRENTE DE OU DE QUALQUER FORMA RELACIONADA AO USO OU INCAPACIDADE DE USAR O SERVIÇO, SOFTWARE DE TERCEIROS E/OU HARDWARE DE TERCEIROS USADO COM O SERVIÇO, OU DE OUTRA FORMA EM CONEXÃO COM QUALQUER DISPOSIÇÃO DESTES TERMOS.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eMESMO QUE A EMPRESA TENHA SIDO AVISADA DA POSSIBILIDADE DE TAIS DANOS E MESMO QUE A REPARAÇÃO FALHE EM SEU PROPÓSITO ESSENCIAL, A RESPONSABILIDADE TOTAL DA EMPRESA SOB ESTE ACORDO E POR QUALQUER CAUSA DE AÇÃO SERÁ ESTRITAMENTE LIMITADA AO MAIOR VALOR ENTRE: (A) O VALOR TOTAL PAGO EFETIVAMENTE POR VOCÊ PELO SERVIÇO DURANTE OS 12 (DOZE) MESES IMEDIATAMENTE ANTERIORES À DATA DO EVENTO QUE DEU ORIGEM À RECLAMAÇÃO; OU (B) R$ 100,00 (CEM REAIS).\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eALGUMAS JURISDIÇÕES NÃO PERMITEM A EXCLUSÃO DE GARANTIAS IMPLÍCITAS OU A LIMITAÇÃO DE RESPONSABILIDADE POR DANOS INCIDENTAIS OU CONSEQUENTES, O QUE SIGNIFICA QUE ALGUMAS DAS LIMITAÇÕES ACIMA PODEM NÃO SE APLICAR A VOCÊ. NESSAS JURISDIÇÕES, A RESPONSABILIDADE DE CADA PARTE SERÁ LIMITADA NA MAIOR EXTENSÃO PERMITIDA POR LEI.\u003c/p\u003e\n\n\u003ch2\u003e8. Indenização\u003c/h2\u003e\n\n\u003cp\u003eVocê concorda em defender, indenizar e isentar a Empresa, suas afiliadas, empresas controladoras, subsidiárias, diretores, funcionários, agentes, licenciadores e fornecedores de e contra todas e quaisquer reclamações, responsabilidades, danos, perdas, julgamentos, prêmios, custos e despesas (incluindo, mas não limitado a, honorários advocatícios razoáveis e custos judiciais) decorrentes de ou relacionados a:\u003c/p\u003e\n\u003col type=\"a\"\u003e\n    \u003cli\u003eSeu uso e acesso ao Serviço;\u003c/li\u003e\n    \u003cli\u003eSua violação de qualquer termo destes Termos;\u003c/li\u003e\n    \u003cli\u003eSua violação de qualquer direito de terceiros, incluindo, sem limitação, qualquer direito autoral, propriedade ou direito de privacidade;\u003c/li\u003e\n    \u003cli\u003eQualquer alegação de que seu Conteúdo causou danos a terceiros;\u003c/li\u003e\n    \u003cli\u003eSua violação de qualquer lei, regra ou regulamento aplicável, incluindo a LGPD.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eEsta obrigação de defesa e indenização sobreviverá a estes Termos e ao seu uso do Serviço.\u003c/p\u003e\n\n\u003ch2\u003e9. Isenção de Garantias (As-Is)\u003c/h2\u003e\n\n\u003cp\u003e\u003cstrong\u003eO SERVIÇO É FORNECIDO A VOCÊ \"COMO ESTÁ\" (AS-IS) E \"CONFORME DISPONÍVEL\" (AS-AVAILABLE) E COM TODAS AS FALHAS E DEFEITOS SEM GARANTIA DE QUALQUER TIPO.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eNA EXTENSÃO MÁXIMA PERMITIDA PELA LEI APLICÁVEL, A EMPRESA, EM SEU PRÓPRIO NOME E EM NOME DE SUAS AFILIADAS E SEUS RESPECTIVOS LICENCIADORES E PROVEDORES DE SERVIÇOS, ISENTA-SE EXPRESSAMENTE DE TODAS AS GARANTIAS, SEJAM EXPRESSAS, IMPLÍCITAS, ESTATUTÁRIAS OU OUTRAS, COM RELAÇÃO AO SERVIÇO, INCLUINDO TODAS AS GARANTIAS IMPLÍCITAS DE COMERCIALIZAÇÃO, ADEQUAÇÃO A UM DETERMINADO FIM, TÍTULO E NÃO VIOLAÇÃO, E GARANTIAS QUE POSSAM SURGIR DO CURSO DE NEGOCIAÇÃO, CURSO DE DESEMPENHO, USO OU PRÁTICA COMERCIAL.\u003c/p\u003e\n\n\u003cp\u003eSEM LIMITAÇÃO AO PRECEDENTE, A EMPRESA NÃO FORNECE GARANTIA OU COMPROMISSO, E NÃO FAZ REPRESENTAÇÃO DE QUALQUER TIPO DE QUE O SERVIÇO ATENDERÁ ÀS SUAS NECESSIDADES, ALCANÇARÁ QUAISQUER RESULTADOS PRETENDIDOS, SERÁ COMPATÍVEL OU FUNCIONARÁ COM QUALQUER OUTRO SOFTWARE, APLICATIVOS, SISTEMAS OU SERVIÇOS, OPERARÁ SEM INTERRUPÇÃO, ATENDERÁ A QUAISQUER PADRÕES DE DESEMPENHO OU CONFIABILIDADE OU ESTARÁ LIVRE DE ERROS OU QUE QUAISQUER ERROS OU DEFEITOS PODEM OU SERÃO CORRIGIDOS.\u003c/p\u003e\n\n\u003ch2\u003e10. Assunção de Risco\u003c/h2\u003e\n\n\u003cp\u003e\u003cstrong\u003eVOCÊ ASSUME TOTAL RESPONSABILIDADE E RISCO PELO USO DO SERVIÇO.\u003c/strong\u003e A EMPRESA NÃO SERÁ RESPONSÁVEL POR QUAISQUER DANOS RESULTANTES DO USO OU DA INCAPACIDADE DE USO DO SERVIÇO, INCLUINDO DANOS CAUSADOS POR MALWARE, VÍRUS, TROJANS, OU QUALQUER PROGRAMA DE COMPUTADOR INCORRETO OU INCOMPLETO. É DE SUA EXCLUSIVA RESPONSABILIDADE MANTER BACKUPS ADEQUADOS DE SEUS DADOS E PROTEGER SEU AMBIENTE DE TI.\u003c/p\u003e\n\n\u003ch2\u003e11. Modificações do Serviço e dos Termos\u003c/h2\u003e\n\n\u003cp\u003eA Empresa reserva-se o direito de retirar ou alterar nosso Serviço, e qualquer serviço ou material que fornecemos através do Serviço, a nosso exclusivo critério, sem aviso prévio. Não seremos responsáveis se, por qualquer motivo, todo ou qualquer parte do Serviço estiver indisponível a qualquer momento ou por qualquer período.\u003c/p\u003e\n\n\u003cp\u003ePodemos revisar e atualizar estes Termos de tempos em tempos a nosso exclusivo critério. Todas as alterações entram em vigor imediatamente quando as publicamos e se aplicam a todo o acesso e uso do Serviço a partir de então. \u003cstrong\u003eO uso continuado do Serviço após a publicação dos Termos de Serviço revisados significa que Você aceita e concorda com as alterações.\u003c/strong\u003e Espera-se que Você verifique esta página periodicamente para estar ciente de quaisquer alterações, pois elas são vinculativas para Você.\u003c/p\u003e\n\n\u003ch2\u003e12. Conformidade com a LGPD e Proteção de Dados (Atualização 2024-2025)\u003c/h2\u003e\n\n\u003cp\u003eEste documento e as práticas da Empresa estão em total conformidade com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018) e suas atualizações mais recentes, visando garantir a privacidade e proteção dos seus dados pessoais.\u003c/p\u003e\n\n\u003ch3\u003e12.1. Tratamento de Dados\u003c/h3\u003e\n\u003cp\u003eA Empresa atua como Controladora dos dados pessoais coletados (como nome, e-mail, dados de faturamento). Ao utilizar o Serviço, você consente com a coleta e processamento destes dados conforme descrito em nossa Política de Privacidade.\u003c/p\u003e\n\n\u003ch3\u003e12.2. Direitos dos Titulares\u003c/h3\u003e\n\u003cp\u003eConforme garantido pela LGPD, Você possui os seguintes direitos em relação aos seus dados pessoais:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eConfirmação da existência de tratamento;\u003c/li\u003e\n    \u003cli\u003eAcesso aos dados;\u003c/li\u003e\n    \u003cli\u003eCorreção de dados incompletos, inexatos ou desatualizados;\u003c/li\u003e\n    \u003cli\u003eAnonimização, bloqueio ou eliminação de dados desnecessários;\u003c/li\u003e\n    \u003cli\u003ePortabilidade dos dados a outro fornecedor de serviço;\u003c/li\u003e\n    \u003cli\u003eRevogação do consentimento.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePara exercer esses direitos, entre em contato com nosso Encarregado (DPO) através do e-mail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch3\u003e12.3. Transferência Internacional de Dados (Resolução CD/ANPD nº 19/2024)\u003c/h3\u003e\n\u003cp\u003eO Serviço RENDERWEAR possui alcance global e seus dados podem ser processados em servidores localizados fora do Brasil. A Empresa garante que qualquer transferência internacional de dados observará estritamente os ditames da \u003cstrong\u003eResolução CD/ANPD nº 19/2024\u003c/strong\u003e. Utilizamos mecanismos de transferência aprovados, como as Cláusulas Padrão Contratuais, para assegurar que os dados transferidos gozem de um nível de proteção equivalente ao exigido pela LGPD.\u003c/p\u003e\n\n\u003ch3\u003e12.4. Notificação de Incidentes\u003c/h3\u003e\n\u003cp\u003eEm conformidade com as diretrizes da ANPD para 2024-2025, a Empresa compromete-se a comunicar à Autoridade Nacional de Proteção de Dados (ANPD) e ao titular dos dados a ocorrência de incidente de segurança que possa acarretar risco ou dano relevante aos titulares. Tal comunicação será feita no prazo de \u003cstrong\u003e3 (três) dias úteis\u003c/strong\u003e, contados da data do conhecimento do incidente.\u003c/p\u003e\n\n\u003ch2\u003e13. Resolução de Disputas\u003c/h2\u003e\n\n\u003cp\u003eSe Você tiver qualquer disputa, reclamação ou controvérsia com a Empresa decorrente ou relacionada a estes Termos ou ao Serviço, Você concorda em primeiro tentar resolver a disputa informalmente entrando em contato com a Empresa pelo e-mail \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e. A Empresa fará esforços de boa fé para resolver a disputa. Se a disputa não for resolvida dentro de 30 (trinta) dias após o envio, qualquer uma das partes poderá iniciar um processo formal.\u003c/p\u003e\n\n\u003ch2\u003e14. Lei Aplicável e Jurisdição\u003c/h2\u003e\n\n\u003ch3\u003e14.1. Lei Aplicável\u003c/h3\u003e\n\u003cp\u003eEstes Termos serão regidos e interpretados estritamente de acordo com as leis da República Federativa do Brasil, sem considerar suas disposições sobre conflitos de leis.\u003c/p\u003e\n\n\u003ch3\u003e14.2. Foro de Eleição\u003c/h3\u003e\n\u003cp\u003eQualquer disputa, ação ou processo judicial decorrente ou relacionado a estes Termos, ao Serviço ou à relação entre as partes será submetido à jurisdição exclusiva dos tribunais da Comarca da cidade de \u003cstrong\u003eSão Paulo, Estado de São Paulo, Brasil\u003c/strong\u003e. As partes renunciam irrevogavelmente a qualquer objeção à jurisdição, local ou inconveniência de tais tribunais e renunciam a qualquer outro foro, por mais privilegiado que seja.\u003c/p\u003e\n\n\u003ch2\u003e15. Disposições Gerais\u003c/h2\u003e\n\n\u003ch3\u003e15.1. Divisibilidade\u003c/h3\u003e\n\u003cp\u003eSe qualquer disposição destes Termos for considerada inexequível ou inválida, tal disposição será alterada e interpretada para atingir os objetivos de tal disposição na maior medida possível sob a lei aplicável e as disposições restantes continuarão em pleno vigor e efeito.\u003c/p\u003e\n\n\u003ch3\u003e15.2. Renúncia\u003c/h3\u003e\n\u003cp\u003eExceto conforme previsto neste documento, a falha em exercer um direito ou em exigir o cumprimento de uma obrigação sob estes Termos não afetará a capacidade de uma parte de exercer tal direito ou exigir tal cumprimento a qualquer momento posterior, nem a renúncia de uma violação constituirá uma renúncia de qualquer violação subsequente.\u003c/p\u003e\n\n\u003ch3\u003e15.3. Acordo Integral\u003c/h3\u003e\n\u003cp\u003eOs Termos constituem o acordo integral entre Você e a Empresa em relação ao uso do Serviço e substituem todos os acordos e entendimentos anteriores e contemporâneos, sejam orais ou escritos.\u003c/p\u003e\n\n\u003ch2\u003e16. Contato\u003c/h2\u003e\n\n\u003cp\u003eSe você tiver alguma dúvida sobre estes Termos de Serviço, reclamações ou notificações legais, entre em contato conosco:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa:\u003c/strong\u003e MIRA DESIGN COMERCIO E SERVICOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNome Comercial:\u003c/strong\u003e INCODE TECH / RENDERWEAR\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEndereço:\u003c/strong\u003e ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eE-mail:\u003c/strong\u003e \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eWebsite e Contato:\u003c/strong\u003e \u003ca href=\"https://www.incodetech.com.br/contact.html\" target=\"_blank\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003chr\u003e\n\u003cp\u003e\u003cem\u003eAo utilizar o software RENDERWEAR, você confirma que leu estes Termos, compreendeu seu conteúdo e concorda em estar legalmente vinculado a eles.\u003c/em\u003e\u003c/p\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Termos de Serviço","languageLabel":"Português"},{"documentType":"return_refund","language":"PT","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003ePolítica de Devolução e Reembolso\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003ePolítica de Devolução e Reembolso\u003c/h2\u003e\n    \u003cp\u003eÚltima atualização: 20 de janeiro de 2026\u003c/p\u003e\n    \u003cp\u003eObrigado por comprar em RENDERWEAR.\u003c/p\u003e\n    \u003cp\u003eSe você não estiver totalmente satisfeito com sua compra, estamos aqui para ajudar.\u003c/p\u003e\n\n    \u003ch2\u003eInterpretação e Definições\u003c/h2\u003e\n\n    \u003ch3\u003eDefinições\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa:\u003c/strong\u003e refere-se a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., CNPJ: 08.337.937/0001-69, com sede na ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eBens:\u003c/strong\u003e refere-se aos itens oferecidos para venda no Serviço.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePedidos:\u003c/strong\u003e significa uma solicitação sua para comprar Bens de nós.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServiço:\u003c/strong\u003e refere-se a RENDERWEAR.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVocê:\u003c/strong\u003e significa o indivíduo acessando ou usando o Serviço, ou a empresa, ou outra entidade legal em nome da qual tal indivíduo está acessando ou usando o Serviço.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003e Sua Elegibilidade para Reembolso\u003c/h2\u003e\n    \u003cp\u003eOs seguintes itens são elegíveis para reembolso:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eBens com defeito ou danificados no momento da entrega.\u003c/li\u003e\n        \u003cli\u003eBens que não correspondem à descrição fornecida.\u003c/li\u003e\n        \u003cli\u003eBens não utilizados e em sua embalagem original.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003ePara ser elegível para um retorno, seu item deve estar não utilizado e nas mesmas condições em que você o recebeu. Também deve estar na embalagem original.\u003c/p\u003e\n\n    \u003ch2\u003ePrazos para Solicitação\u003c/h2\u003e\n    \u003cp\u003eVocê tem 7 (sete) dias corridos a partir da data de recebimento do produto para solicitar a devolução ou reembolso, conforme previsto no Código de Defesa do Consumidor (Lei nº 8.078/90).\u003c/p\u003e\n    \u003cp\u003ePara assinaturas digitais, você pode cancelar e solicitar reembolso em até 7 dias após a contratação, desde que o serviço não tenha sido utilizado.\u003c/p\u003e\n\n    \u003ch2\u003eProcesso de Reembolso\u003c/h2\u003e\n    \u003cp\u003ePara solicitar um reembolso, siga estas etapas:\u003c/p\u003e\n    \u003col\u003e\n        \u003cli\u003eEntre em contato conosco em \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e com seu número de pedido e motivo do reembolso.\u003c/li\u003e\n        \u003cli\u003eAguarde nossa resposta com instruções sobre como proceder.\u003c/li\u003e\n        \u003cli\u003eSe aplicável, devolva o item conforme as instruções fornecidas.\u003c/li\u003e\n        \u003cli\u003eApós recebermos e inspecionarmos o item, notificaremos você sobre a aprovação ou rejeição do reembolso.\u003c/li\u003e\n    \u003c/ol\u003e\n    \u003cp\u003eSe aprovado, seu reembolso será processado e um crédito será aplicado automaticamente ao seu método de pagamento original em até 14 dias úteis.\u003c/p\u003e\n\n    \u003ch2\u003eItens Não Reembolsáveis\u003c/h2\u003e\n    \u003cp\u003eOs seguintes itens não são elegíveis para reembolso:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eProdutos digitais que já foram baixados ou acessados.\u003c/li\u003e\n        \u003cli\u003eAssinaturas após o período de 7 dias, se o serviço já foi utilizado.\u003c/li\u003e\n        \u003cli\u003eProdutos personalizados feitos sob encomenda.\u003c/li\u003e\n        \u003cli\u003eProdutos que por sua natureza não podem ser devolvidos (por exemplo, por razões de higiene).\u003c/li\u003e\n        \u003cli\u003eCartões-presente.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eReembolsos Parciais\u003c/h2\u003e\n    \u003cp\u003eEm certas situações, apenas reembolsos parciais são concedidos:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eItem com sinais evidentes de uso.\u003c/li\u003e\n        \u003cli\u003eItem devolvido mais de 7 dias após a entrega.\u003c/li\u003e\n        \u003cli\u003eItem não na condição original ou com peças faltando.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eReembolsos Atrasados ou Ausentes\u003c/h2\u003e\n    \u003cp\u003eSe você ainda não recebeu um reembolso:\u003c/p\u003e\n    \u003col\u003e\n        \u003cli\u003ePrimeiro verifique sua conta bancária novamente.\u003c/li\u003e\n        \u003cli\u003eEntre em contato com a empresa do seu cartão de crédito, pois pode levar algum tempo antes que seu reembolso seja oficialmente lançado.\u003c/li\u003e\n        \u003cli\u003eEntre em contato com seu banco, pois geralmente há algum tempo de processamento antes que um reembolso seja lançado.\u003c/li\u003e\n        \u003cli\u003eSe você fez tudo isso e ainda não recebeu seu reembolso, entre em contato conosco em \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e.\u003c/li\u003e\n    \u003c/ol\u003e\n\n    \u003ch2\u003eTrocas\u003c/h2\u003e\n    \u003cp\u003eSó substituímos itens se estiverem com defeito ou danificados. Se você precisar trocá-lo pelo mesmo item, envie-nos um e-mail em \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e.\u003c/p\u003e\n\n    \u003ch2\u003eContato\u003c/h2\u003e\n    \u003cp\u003eSe você tiver alguma dúvida sobre nossa Política de Devolução e Reembolso, entre em contato conosco:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eE-mail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003eVisitando esta página: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eClique aqui\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eLimitação de Responsabilidade\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, EM NENHUM CASO A EMPRESA OU SEUS FORNECEDORES SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS OU CONSEQUENTES DE QUALQUER NATUREZA (INCLUINDO, MAS NÃO LIMITADO A, DANOS POR PERDA DE LUCROS, PERDA DE DADOS OU OUTRAS INFORMAÇÕES, POR INTERRUPÇÃO DE NEGÓCIOS, POR LESÃO PESSOAL, PERDA DE PRIVACIDADE DECORRENTE DE OU DE QUALQUER FORMA RELACIONADA AO USO OU INCAPACIDADE DE USAR O SERVIÇO, SOFTWARE DE TERCEIROS E/OU HARDWARE DE TERCEIROS USADO COM O SERVIÇO, OU DE OUTRA FORMA EM CONEXÃO COM QUALQUER DISPOSIÇÃO DESTES TERMOS).\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eA responsabilidade total da Empresa sob este acordo não excederá o maior valor entre: (a) o valor total pago por Você pelo Serviço durante os 12 meses anteriores à reclamação; ou (b) R$ 100,00 (cem reais).\u003c/p\u003e\n\n    \u003ch2\u003eIndenização\u003c/h2\u003e\n    \u003cp\u003eVocê concorda em indenizar, defender e isentar a Empresa, suas afiliadas, diretores, funcionários, agentes, licenciadores e fornecedores de e contra todas e quaisquer reclamações, responsabilidades, danos, julgamentos, custos e despesas (incluindo honorários advocatícios razoáveis) decorrentes de ou relacionados a:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e(a) seu uso do Serviço;\u003c/li\u003e\n        \u003cli\u003e(b) qualquer violação destes Termos por você;\u003c/li\u003e\n        \u003cli\u003e(c) qualquer conteúdo que você postar ou transmitir através do Serviço;\u003c/li\u003e\n        \u003cli\u003e(d) sua violação de qualquer lei, regra ou regulamento aplicável; ou\u003c/li\u003e\n        \u003cli\u003e(e) sua violação dos direitos de terceiros.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eIsenção de Garantias\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eO SERVIÇO É FORNECIDO \"COMO ESTÁ\" E \"CONFORME DISPONÍVEL\", SEM GARANTIAS DE QUALQUER TIPO, EXPRESSAS OU IMPLÍCITAS, INCLUINDO, MAS NÃO LIMITADO A, GARANTIAS IMPLÍCITAS DE COMERCIALIZAÇÃO, ADEQUAÇÃO A UM DETERMINADO FIM E NÃO VIOLAÇÃO.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eA EMPRESA NÃO GARANTE QUE:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e(A) O SERVIÇO ATENDERÁ SUAS NECESSIDADES;\u003c/li\u003e\n        \u003cli\u003e(B) O SERVIÇO SERÁ ININTERRUPTO, OPORTUNO, SEGURO OU LIVRE DE ERROS;\u003c/li\u003e\n        \u003cli\u003e(C) OS RESULTADOS OBTIDOS DO USO DO SERVIÇO SERÃO PRECISOS OU CONFIÁVEIS; OU\u003c/li\u003e\n        \u003cli\u003e(D) A QUALIDADE DE QUAISQUER PRODUTOS, SERVIÇOS, INFORMAÇÕES OU OUTROS MATERIAIS OBTIDOS ATRAVÉS DO SERVIÇO ATENDERÁ SUAS EXPECTATIVAS.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eAceitação pelo Uso\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eAO ACESSAR, BAIXAR, INSTALAR OU USAR O SERVIÇO, VOCÊ RECONHECE QUE LEU, ENTENDEU E CONCORDA EM FICAR VINCULADO A ESTES TERMOS. SE VOCÊ NÃO ACORDAR COM ESTES TERMOS, NÃO ACESSE OU USE O SERVIÇO.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eO uso continuado do Serviço após quaisquer modificações nestes Termos constitui sua aceitação de tais modificações.\u003c/p\u003e\n\n    \u003ch2\u003eLei Aplicável e Jurisdição\u003c/h2\u003e\n    \u003cp\u003eEstes Termos serão regidos e interpretados de acordo com as leis da República Federativa do Brasil, sem considerar suas disposições sobre conflitos de leis.\u003c/p\u003e\n    \u003cp\u003eQualquer disputa decorrente ou relacionada a estes Termos será submetida à jurisdição exclusiva dos tribunais da cidade de São Paulo, Estado de São Paulo, Brasil, e as partes renunciam irrevogavelmente a qualquer objeção à jurisdição de tais tribunais.\u003c/p\u003e\n\n    \u003ch2\u003eAssunção de Risco\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eVOCÊ ASSUME TOTAL RESPONSABILIDADE E RISCO PELO USO DO SERVIÇO. O SERVIÇO É FORNECIDO \"COMO ESTÁ\" SEM GARANTIAS DE QUALQUER TIPO. A EMPRESA NÃO SERÁ RESPONSÁVEL POR QUAISQUER DANOS RESULTANTES DO USO OU DA INCAPACIDADE DE USO DO SERVIÇO, INCLUINDO DANOS CAUSADOS POR MALWARE, VÍRUS OU QUALQUER PROGRAMA DE COMPUTADOR INCORRETO OU INCOMPLETO.\u003c/strong\u003e\u003c/p\u003e\n\n    \u003ch2\u003eConformidade com a LGPD\u003c/h2\u003e\n    \u003cp\u003eEste documento está em conformidade com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018) e suas atualizações, incluindo:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eResolução CD/ANPD nº 19/2024:\u003c/strong\u003e Regras para transferência internacional de dados pessoais.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eNotificação de Incidentes:\u003c/strong\u003e Prazo de 3 (três) dias úteis para comunicação à ANPD e aos titulares afetados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDireitos dos Titulares:\u003c/strong\u003e Acesso, correção, portabilidade, eliminação e revogação de consentimento.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEncarregado de Proteção de Dados (DPO):\u003c/strong\u003e Informações de contato disponíveis publicamente.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePenalidades:\u003c/strong\u003e Até 2% da receita anual do Brasil ou R$ 50 milhões por violação.\u003c/li\u003e\n    \u003c/ul\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Devolução e Reembolso","languageLabel":"Português"},{"documentType":"privacy_policy","language":"PT","content":"\u003ch2\u003ePolítica de Privacidade\u003c/h2\u003e\n\n\u003cp\u003eÚltima atualização: 20 de janeiro de 2026\u003c/p\u003e\n\n\u003cp\u003eEsta Política de Privacidade descreve nossas políticas e procedimentos sobre a coleta, uso e divulgação de suas informações quando você usa o Serviço RENDERWEAR e informa sobre seus direitos de privacidade e como a lei protege você.\u003c/p\u003e\n\n\u003cp\u003eUsamos seus dados pessoais para fornecer e melhorar o Serviço. Ao usar o Serviço, você concorda com a coleta e uso de informações de acordo com esta Política de Privacidade.\u003c/p\u003e\n\n\u003ch2\u003eInterpretação e Definições\u003c/h2\u003e\n\n\u003ch3\u003eInterpretação\u003c/h3\u003e\n\u003cp\u003eAs palavras cuja letra inicial é maiúscula têm significados definidos nas seguintes condições. As seguintes definições devem ter o mesmo significado, independentemente de aparecerem no singular ou no plural.\u003c/p\u003e\n\n\u003ch3\u003eDefinições\u003c/h3\u003e\n\u003cp\u003ePara os fins desta Política de Privacidade:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eConta\u003c/strong\u003e significa uma conta única criada para você acessar nosso Serviço ou partes de nosso Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"a Empresa\", \"Nós\", \"Nos\" ou \"Nosso\" nesta Política de Privacidade) refere-se a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e são pequenos arquivos que são colocados em seu computador, dispositivo móvel ou qualquer outro dispositivo por um site, contendo os detalhes de seu histórico de navegação nesse site entre seus muitos usos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePaís\u003c/strong\u003e refere-se a: Brasil.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e significa qualquer dispositivo que pode acessar o Serviço, como um computador, um telefone celular ou um tablet digital.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDados Pessoais\u003c/strong\u003e são quaisquer informações que se relacionam a um indivíduo identificado ou identificável.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServiço\u003c/strong\u003e refere-se ao Aplicativo RENDERWEAR ou ao Site, ou ambos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePrestador de Serviços\u003c/strong\u003e significa qualquer pessoa física ou jurídica que processa os dados em nome da Empresa.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDados de Uso\u003c/strong\u003e refere-se aos dados coletados automaticamente, gerados pelo uso do Serviço ou pela própria infraestrutura do Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e refere-se ao RENDERWEAR, acessível a partir de \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVocê\u003c/strong\u003e significa o indivíduo acessando ou usando o Serviço, ou a empresa, ou outra entidade legal em nome da qual tal indivíduo está acessando ou usando o Serviço, conforme aplicável.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eColeta e Uso de Seus Dados Pessoais\u003c/h2\u003e\n\n\u003ch3\u003eTipos de Dados Coletados\u003c/h3\u003e\n\n\u003ch4\u003eDados Pessoais\u003c/h4\u003e\n\u003cp\u003eAo usar nosso Serviço, podemos solicitar que você nos forneça certas informações de identificação pessoal que podem ser usadas para contatá-lo ou identificá-lo. As informações de identificação pessoal podem incluir, mas não estão limitadas a:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eEndereço de email\u003c/li\u003e\n    \u003cli\u003eNome e sobrenome\u003c/li\u003e\n    \u003cli\u003eNúmero de telefone\u003c/li\u003e\n    \u003cli\u003eEndereço, Estado, Província, CEP/Código Postal, Cidade\u003c/li\u003e\n    \u003cli\u003eDados de Uso\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch4\u003eDados de Uso\u003c/h4\u003e\n\u003cp\u003eOs Dados de Uso são coletados automaticamente ao usar o Serviço.\u003c/p\u003e\n\u003cp\u003eOs Dados de Uso podem incluir informações como o endereço de Protocolo de Internet do seu Dispositivo (por exemplo, endereço IP), tipo de navegador, versão do navegador, as páginas do nosso Serviço que você visita, a hora e data da sua visita, o tempo gasto nessas páginas, identificadores exclusivos de dispositivos e outros dados de diagnóstico.\u003c/p\u003e\n\n\u003ch2\u003eUso de Seus Dados Pessoais\u003c/h2\u003e\n\u003cp\u003eA Empresa pode usar Dados Pessoais para os seguintes fins:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003ePara fornecer e manter nosso Serviço\u003c/strong\u003e, incluindo monitorar o uso de nosso Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara gerenciar sua Conta:\u003c/strong\u003e para gerenciar seu registro como usuário do Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara a execução de um contrato:\u003c/strong\u003e o desenvolvimento, conformidade e execução do contrato de compra dos produtos, itens ou serviços que você adquiriu.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara entrar em contato com você:\u003c/strong\u003e Para entrar em contato com você por e-mail, chamadas telefônicas, SMS, ou outras formas equivalentes de comunicação eletrônica.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePara gerenciar suas solicitações:\u003c/strong\u003e Para atender e gerenciar suas solicitações para nós.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eRetenção de Seus Dados Pessoais\u003c/h2\u003e\n\u003cp\u003eA Empresa reterá seus Dados Pessoais apenas pelo tempo necessário para os fins estabelecidos nesta Política de Privacidade. Reteremos e usaremos seus Dados Pessoais na medida necessária para cumprir nossas obrigações legais.\u003c/p\u003e\n\n\u003ch2\u003eTransferência de Seus Dados Pessoais\u003c/h2\u003e\n\u003cp\u003eSuas informações, incluindo Dados Pessoais, são processadas nos escritórios operacionais da Empresa e em quaisquer outros lugares onde as partes envolvidas no processamento estejam localizadas. Isso significa que essas informações podem ser transferidas para — e mantidas em — computadores localizados fora do seu estado, província, país ou outra jurisdição governamental onde as leis de proteção de dados podem diferir daquelas da sua jurisdição.\u003c/p\u003e\n\u003cp\u003eEm conformidade com a LGPD e a Resolução CD/ANPD nº 19/2024, qualquer transferência internacional de dados pessoais será realizada mediante Cláusulas Contratuais Padrão aprovadas pela ANPD ou outros mecanismos legalmente válidos.\u003c/p\u003e\n\n\u003ch2\u003eDivulgação de Seus Dados Pessoais\u003c/h2\u003e\n\u003cp\u003ePodemos divulgar seus Dados Pessoais nas seguintes circunstâncias:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eSe for exigido por lei para cumprir uma obrigação legal.\u003c/li\u003e\n    \u003cli\u003ePara proteger e defender os direitos ou propriedade da Empresa.\u003c/li\u003e\n    \u003cli\u003ePara prevenir ou investigar possíveis irregularidades em relação ao Serviço.\u003c/li\u003e\n    \u003cli\u003ePara proteger a segurança pessoal dos usuários do Serviço ou do público.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eSegurança de Seus Dados Pessoais\u003c/h2\u003e\n\u003cp\u003eA segurança de seus Dados Pessoais é importante para nós, mas lembre-se de que nenhum método de transmissão pela Internet ou método de armazenamento eletrônico é 100% seguro. Embora nos esforcemos para usar meios comercialmente aceitáveis para proteger seus Dados Pessoais, não podemos garantir sua segurança absoluta.\u003c/p\u003e\n\n\u003ch2\u003eDireitos de Proteção de Dados (LGPD)\u003c/h2\u003e\n\n\u003cp\u003eDe acordo com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018), você tem os seguintes direitos:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eConfirmação e Acesso:\u003c/strong\u003e Confirmar a existência de tratamento e acessar seus dados pessoais.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCorreção:\u003c/strong\u003e Solicitar a correção de dados incompletos, inexatos ou desatualizados.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAnonimização, Bloqueio ou Eliminação:\u003c/strong\u003e Solicitar a anonimização, bloqueio ou eliminação de dados desnecessários, excessivos ou tratados em desconformidade.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePortabilidade:\u003c/strong\u003e Solicitar a portabilidade dos dados a outro fornecedor de serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEliminação:\u003c/strong\u003e Solicitar a eliminação dos dados pessoais tratados com o consentimento do titular.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eInformação:\u003c/strong\u003e Ser informado sobre as entidades públicas e privadas com as quais compartilhamos seus dados.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eRevogação do Consentimento:\u003c/strong\u003e Revogar o consentimento a qualquer momento.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eNotificação de Incidentes de Segurança\u003c/h3\u003e\n\u003cp\u003eEm conformidade com a LGPD e as atualizações de 2024, notificaremos a Autoridade Nacional de Proteção de Dados (ANPD) e os titulares afetados em até 3 (três) dias úteis a partir do conhecimento de qualquer incidente de segurança que possa acarretar risco ou dano relevante aos titulares.\u003c/p\u003e\n\n\u003ch3\u003eEncarregado de Proteção de Dados (DPO)\u003c/h3\u003e\n\u003cp\u003ePara exercer seus direitos ou esclarecer dúvidas sobre o tratamento de seus dados pessoais, entre em contato com nosso Encarregado de Proteção de Dados:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eE-mail: info@incodetech.com.br\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eCookies e Tecnologias Similares\u003c/h2\u003e\n\u003cp\u003ePodemos usar Cookies e tecnologias semelhantes para rastrear a atividade em nosso Serviço e armazenar certas informações.\u003c/p\u003e\n\n\u003ch3\u003eTipos de Cookies Usados\u003c/h3\u003e\n\u003cp\u003eOs Cookies que usamos podem ser classificados em:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies de Sessão:\u003c/strong\u003e Usamos Cookies de Sessão para operar nosso Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies Persistentes:\u003c/strong\u003e Usamos Cookies Persistentes para lembrar suas preferências e outras informações.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eAlterações a Esta Política de Privacidade\u003c/h2\u003e\n\u003cp\u003ePodemos atualizar nossa Política de Privacidade de tempos em tempos. Notificaremos você sobre quaisquer alterações publicando a nova Política de Privacidade nesta página.\u003c/p\u003e\n\u003cp\u003eRecomendamos que você revise esta Política de Privacidade periodicamente para quaisquer alterações.\u003c/p\u003e\n\n\u003ch2\u003eAssunção de Risco\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eVOCÊ ASSUME TOTAL RESPONSABILIDADE E RISCO PELO USO DO SERVIÇO. O SERVIÇO É FORNECIDO \"COMO ESTÁ\" SEM GARANTIAS DE QUALQUER TIPO. A EMPRESA NÃO SERÁ RESPONSÁVEL POR QUAISQUER DANOS RESULTANTES DO USO OU DA INCAPACIDADE DE USO DO SERVIÇO, INCLUINDO DANOS CAUSADOS POR MALWARE, VÍRUS OU QUALQUER PROGRAMA DE COMPUTADOR INCORRETO OU INCOMPLETO.\u003c/strong\u003e\u003c/p\u003e\n\n\u003ch2\u003eLimitação de Responsabilidade\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, EM NENHUM CASO A EMPRESA OU SEUS FORNECEDORES SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS OU CONSEQUENTES DE QUALQUER NATUREZA (INCLUINDO, MAS NÃO LIMITADO A, DANOS POR PERDA DE LUCROS, PERDA DE DADOS OU OUTRAS INFORMAÇÕES, POR INTERRUPÇÃO DE NEGÓCIOS, POR LESÃO PESSOAL, PERDA DE PRIVACIDADE DECORRENTE DE OU DE QUALQUER FORMA RELACIONADA AO USO OU INCAPACIDADE DE USAR O SERVIÇO, SOFTWARE DE TERCEIROS E/OU HARDWARE DE TERCEIROS USADO COM O SERVIÇO, OU DE OUTRA FORMA EM CONEXÃO COM QUALQUER DISPOSIÇÃO DESTES TERMOS).\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eA responsabilidade total da Empresa sob este acordo não excederá o maior valor entre: (a) o valor total pago por Você pelo Serviço durante os 12 meses anteriores à reclamação; ou (b) R$ 100,00 (cem reais).\u003c/p\u003e\n\n\u003ch2\u003eIndenização\u003c/h2\u003e\n\u003cp\u003eVocê concorda em indenizar, defender e isentar a Empresa, suas afiliadas, diretores, funcionários, agentes, licenciadores e fornecedores de e contra todas e quaisquer reclamações, responsabilidades, danos, julgamentos, custos e despesas (incluindo honorários advocatícios razoáveis) decorrentes de ou relacionados a:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e(a) seu uso do Serviço;\u003c/li\u003e\n    \u003cli\u003e(b) qualquer violação destes Termos por você;\u003c/li\u003e\n    \u003cli\u003e(c) qualquer conteúdo que você postar ou transmitir através do Serviço;\u003c/li\u003e\n    \u003cli\u003e(d) sua violação de qualquer lei, regra ou regulamento aplicável;\u003c/li\u003e\n    \u003cli\u003e(e) sua violação dos direitos de terceiros.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eAceitação pelo Uso\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eAO ACESSAR, BAIXAR, INSTALAR OU USAR O SERVIÇO, VOCÊ RECONHECE QUE LEU, ENTENDEU E CONCORDA EM FICAR VINCULADO A ESTA POLÍTICA DE PRIVACIDADE. SE VOCÊ NÃO CONCORDAR COM ESTES TERMOS, NÃO ACESSE OU USE O SERVIÇO.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eO uso continuado do Serviço após quaisquer modificações nesta Política de Privacidade constitui sua aceitação de tais modificações.\u003c/p\u003e\n\n\u003ch2\u003eLei Aplicável e Jurisdição\u003c/h2\u003e\n\u003cp\u003eEsta Política de Privacidade será regida e interpretada de acordo com as leis da República Federativa do Brasil, sem considerar suas disposições sobre conflitos de leis.\u003c/p\u003e\n\u003cp\u003eQualquer disputa decorrente ou relacionada a esta Política de Privacidade será submetida à jurisdição exclusiva dos tribunais da cidade de São Paulo, Estado de São Paulo, Brasil, e as partes renunciam irrevogavelmente a qualquer objeção à jurisdição de tais tribunais.\u003c/p\u003e\n\n\u003ch2\u003eContato\u003c/h2\u003e\n\u003cp\u003eSe você tiver alguma dúvida sobre esta Política de Privacidade, você pode entrar em contato conosco:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eE-mail: info@incodetech.com.br\u003c/li\u003e\n    \u003cli\u003eVisitando esta página: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","label":"Política de Privacidade","languageLabel":"Português"},{"documentType":"privacy_consent","language":"PT","content":"\u003ch2\u003ePolítica de Cookies e Consentimento de Privacidade\u003c/h2\u003e\n\n\u003cp\u003eÚltima atualização: 20 de janeiro de 2026\u003c/p\u003e\n\n\u003cp\u003eEsta política de cookies explica o que são cookies e como os usamos. Você deve ler esta política para entender que tipo de cookies usamos ou as informações que coletamos usando cookies e como essas informações são usadas.\u003c/p\u003e\n\n\u003cp\u003eOs cookies normalmente não contêm nenhuma informação que identifique pessoalmente um usuário, mas as informações pessoais que armazenamos sobre você podem estar vinculadas às informações armazenadas e obtidas nos cookies. Para obter mais informações sobre como usamos, armazenamos e mantemos seus dados pessoais seguros, consulte nossa Política de Privacidade.\u003c/p\u003e\n\n\u003cp\u003eNão armazenamos informações pessoais confidenciais, como endereços de correspondência, senhas de contas, etc., nos cookies que usamos.\u003c/p\u003e\n\n\u003ch2\u003eInterpretação e Definições\u003c/h2\u003e\n\n\u003ch3\u003eInterpretação\u003c/h3\u003e\n\n\u003cp\u003eAs palavras cuja letra inicial é maiúscula têm significados definidos nas seguintes condições. As seguintes definições devem ter o mesmo significado, independentemente de aparecerem no singular ou no plural.\u003c/p\u003e\n\n\u003ch3\u003eDefinições\u003c/h3\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"a Empresa\", \"Nós\", \"Nos\" ou \"Nossos\" nesta Política de Cookies) refere-se a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICAÇÃO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SÃO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e significa pequenos arquivos que são colocados em seu computador, dispositivo móvel ou qualquer outro dispositivo por um site da Web, contendo detalhes de seu histórico de navegação nesse site entre seus vários usos.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e refere-se ao RENDERWEAR, acessível em \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003e nosso site de contato\u003c/a\u003e.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eVocê\u003c/strong\u003e significa o indivíduo que acessa ou usa o site, ou uma empresa, ou qualquer pessoa jurídica em nome da qual tal indivíduo está acessando ou usando o site, conforme aplicável.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eO Uso dos Cookies\u003c/h2\u003e\n\n\u003ch3\u003eTipos de Cookies que Usamos\u003c/h3\u003e\n\n\u003cp\u003eOs cookies podem ser \"Persistentes\" ou \"de Sessão\". Os cookies persistentes permanecem em seu computador pessoal ou dispositivo móvel quando você fica offline, enquanto os cookies de sessão são excluídos assim que você fecha o navegador.\u003c/p\u003e\n\n\u003cp\u003eUsamos cookies de sessão e persistentes para os fins definidos abaixo:\u003c/p\u003e\n\n\u003ch4\u003eCookies Essenciais\u003c/h4\u003e\n\n\u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies de sessão\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Nós\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e Esses cookies são essenciais para fornecer a você os serviços disponíveis por meio do site e permitir que você use alguns de seus recursos. Eles ajudam a autenticar usuários e prevenir o uso fraudulento de contas de usuários. Sem esses cookies, os serviços que você solicitou não podem ser fornecidos e nós apenas usamos esses cookies para fornecer esses serviços a você.\u003c/p\u003e\n\n\u003ch4\u003eCookies de Aceitação de Política de Cookies\u003c/h4\u003e\n\n\u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies persistentes\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Nós\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e Esses cookies identificam se os usuários aceitaram o uso de cookies no site.\u003c/p\u003e\n\n\u003ch4\u003eCookies de Funcionalidade\u003c/h4\u003e\n\n\u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies persistentes\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Nós\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e Esses cookies nos permitem lembrar as escolhas que você faz quando usa o site, como lembrar seus detalhes de login ou preferência de idioma. O objetivo desses cookies é fornecer a você uma experiência mais pessoal e evitar que você tenha que inserir novamente suas preferências toda vez que usar o site.\u003c/p\u003e\n\n\u003ch4\u003eCookies de Rastreamento e Desempenho\u003c/h4\u003e\n\n\u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies persistentes\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Terceiros\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e Esses cookies são usados para rastrear informações sobre o tráfego para o site e como os usuários usam o site. As informações coletadas por meio desses cookies podem identificá-lo direta ou indiretamente como um visitante individual.\u003c/p\u003e\n\n\u003ch4\u003eCookies de Publicidade e Segmentação\u003c/h4\u003e\n\n\u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies persistentes\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Terceiros\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e Esses cookies rastreiam seus hábitos de navegação para permitir que mostremos publicidade que provavelmente será do seu interesse.\u003c/p\u003e\n\n\u003ch2\u003eSuas Escolhas\u003c/h2\u003e\n\n\u003cp\u003eSe preferir evitar o uso de cookies no site, primeiro você deve desativar o uso de cookies no seu navegador e, em seguida, excluir os cookies salvos no seu navegador associados a este site. Você pode usar esta opção para impedir o uso de cookies a qualquer momento.\u003c/p\u003e\n\n\u003cp\u003eSe você não aceitar nossos cookies, poderá ter alguns inconvenientes no uso do site e alguns recursos podem não funcionar corretamente.\u003c/p\u003e\n\n\u003ch3\u003eComo Desativar Cookies\u003c/h3\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\u003cstrong\u003eChrome:\u003c/strong\u003e \u003ca href=\"https://support.google.com/accounts/answer/32050\"\u003e Clique aqui\u003c/a\u003e\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eInternet Explorer:\u003c/strong\u003e \u003ca href=\"http://support.microsoft.com/kb/278835\"\u003e Clique aqui\u003c/a\u003e\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eFirefox:\u003c/strong\u003e \u003ca href=\"https://support.mozilla.org/en-US/kb/delete-cookies-remove-info-websites-stored\"\u003e Clique aqui\u003c/a\u003e\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eSafari:\u003c/strong\u003e \u003ca href=\"https://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac\"\u003e Clique aqui\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eConteúdo Incorporado\u003c/h2\u003e\n\n\u003cp\u003eO Serviço pode incluir conteúdo incorporado (por exemplo, vídeos, imagens, artigos, etc.). O conteúdo incorporado de outros sites se comporta exatamente da mesma forma como se o visitante tivesse visitado o outro site.\u003c/p\u003e\n\n\u003cp\u003eEsses sites podem coletar dados sobre você, usar cookies, incorporar rastreamento adicional de terceiros e monitorar sua interação com esse conteúdo incorporado, incluindo rastrear sua interação com o conteúdo incorporado se você tiver uma conta e estiver conectado a esse site.\u003c/p\u003e\n\n\u003ch2\u003eConformidade com a LGPD\u003c/h2\u003e\n\n\u003cp\u003eEste documento está em conformidade com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018) e suas atualizações, incluindo:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\u003cstrong\u003eResolução CD/ANPD nº 19/2024:\u003c/strong\u003e Regras para transferência internacional de dados pessoais.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eNotificação de Incidentes:\u003c/strong\u003e Prazo de 3 (três) dias úteis para comunicação à ANPD e aos titulares afetados.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eDireitos dos Titulares:\u003c/strong\u003e Acesso, correção, portabilidade, eliminação e revogação de consentimento.\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eEncarregado de Proteção de Dados (DPO):\u003c/strong\u003e Informações de contato disponíveis publicamente.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eEm conformidade com a LGPD, obtemos seu consentimento antes de colocar cookies não essenciais em seu dispositivo. Você pode gerenciar suas preferências de cookies a qualquer momento.\u003c/p\u003e\n\n\u003ch2\u003eContato\u003c/h2\u003e\n\n\u003cp\u003eSe você tiver alguma dúvida sobre esta política de cookies, pode entrar em contato conosco:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\u003cstrong\u003eE-mail:\u003c/strong\u003e \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eVisitando nossa página de contato:\u003c/strong\u003e \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eClique aqui\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eLimitação de Responsabilidade\u003c/h2\u003e\n\n\u003cp\u003eNA MÁXIMA EXTENSÃO PERMITIDA PELA LEI APLICÁVEL, EM NENHUM CASO A EMPRESA OU SEUS FORNECEDORES SERÃO RESPONSÁVEIS POR QUAISQUER DANOS ESPECIAIS, INCIDENTAIS, INDIRETOS OU CONSEQUENTES DE QUALQUER NATUREZA (INCLUINDO, MAS NÃO LIMITADO A, DANOS POR PERDA DE LUCROS, PERDA DE DADOS OU OUTRAS INFORMAÇÕES, POR INTERRUPÇÃO DE NEGÓCIOS, POR LESÃO PESSOAL, PERDA DE PRIVACIDADE DECORRENTE DE OU DE QUALQUER FORMA RELACIONADA AO USO OU INCAPACIDADE DE USAR O SERVIÇO, SOFTWARE DE TERCEIROS E/OU HARDWARE DE TERCEIROS USADO COM O SERVIÇO, OU DE OUTRA FORMA EM CONEXÃO COM QUALQUER DISPOSIÇÃO DESTES TERMOS).\u003c/p\u003e\n\n\u003cp\u003eA responsabilidade total da Empresa sob este acordo não excederá o maior valor entre: (a) o valor total pago por Você pelo Serviço durante os 12 meses anteriores à reclamação; ou (b) R$ 100,00 (cem reais).\u003c/p\u003e\n\n\u003ch2\u003eIndenização\u003c/h2\u003e\n\n\u003cp\u003eVocê concorda em indenizar, defender e isentar a Empresa, suas afiliadas, diretores, funcionários, agentes, licenciadores e fornecedores de e contra todas e quaisquer reclamações, responsabilidades, danos, julgamentos, custos e despesas (incluindo honorários advocatíci  Risco\u003c/h2\u003e\n\n\u003cp\u003eVOCÊ ASSUME TOTAL RESPONSABILIDADE E RISCO PELO USO DO SERVIÇO. O SERVIÇO É FORNECIDO \"COMO ESTÁ\" SEM GARANTIAS DE QUALQUER TIPO. A EMPRESA NÃO SERÁ RESPONSÁVEL POR QUAISQUER DANOS RESULTANTES DO USO OU DA INCAPACIDADE DE USO DO SERVIÇO, INCLUINDO DANOS CAUSADOS POR MALWARE, VÍRUS OU QUALQUER PROGRAMA DE COMPUTADOR INCORRETO OU INCOMPLETO.\u003c/p\u003e","label":"Consentimento de Privacidade (Cookies)","languageLabel":"Português"},{"documentType":"terms_and_conditions","language":"PT","content":"\u003ch2\u003eTermos e Condições\u003c/h2\u003e\n\n\u003cp\u003eÚltima atualização: 20 de janeiro de 2026\u003c/p\u003e\n\n\u003cp\u003ePor favor, leia estes termos e condições cuidadosamente antes de usar nosso serviço.\u003c/p\u003e\n\n\u003ch2\u003eInterpretação e Definições\u003c/h2\u003e\n\n\u003ch3\u003eInterpretação\u003c/h3\u003e\n\n\u003cp\u003eAs palavras cuja letra inicial é maiúscula têm significados definidos nas seguintes condições. As seguintes definições devem ter o mesmo significado, independentemente de aparecerem no singular ou no plural.\u003c/p\u003e\n\n\u003ch3\u003eDefinições\u003c/h3\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eAplicativo\u003c/strong\u003e significa o programa de software fornecido pela Empresa, denominado RENDERWEAR.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAfiliado\u003c/strong\u003e significa uma entidade que controla, é controlada ou está sob o controle comum de uma parte, onde \"controle\" significa a propriedade de 50% ou mais das ações.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eConta\u003c/strong\u003e significa uma conta única criada para Você acessar nosso Serviço ou partes de nosso Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePaís\u003c/strong\u003e refere-se a: Brasil.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"Empresa\", \"Nós\", \"Nos\" ou \"Nossos\" neste Contrato) refere-se a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICAÇÃO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SÃO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eConteúdo\u003c/strong\u003e refere-se a conteúdo como texto, imagens ou outras informações que podem ser postadas, carregadas, vinculadas ou de outra forma disponibilizadas por Você.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDispositivo\u003c/strong\u003e significa qualquer dispositivo que pode acessar o Serviço.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServiço\u003c/strong\u003e refere-se ao Aplicativo, ao Site ou a ambos.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eTermos e Condições\u003c/strong\u003e (também chamados de \"Termos\") significa estes Termos e Condições que constituem o acordo completo entre Você e a Empresa.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e refere-se a RENDERWEAR, acessível em \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVocê\u003c/strong\u003e significa o indivíduo que acessa ou usa o Serviço, ou a empresa ou outra pessoa jurídica em nome da qual esse indivíduo está acessando ou usando o Serviço.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eReconhecimento\u003c/h2\u003e\n\n\u003cp\u003eEstes são os Termos e Condições que regem o uso deste Serviço e do contrato que opera entre Você e a Empresa. Estes Termos e Condições estabelecem os direitos e obrigações de todos os usuários em relação ao uso do Serviço.\u003c/p\u003e\n\n\u003cp\u003eSeu acesso e uso do Serviço estão condicionados à sua aceitação e conformidade com estes Termos e Condições. Estes Termos e Condições se aplicam a todos os visitantes, usuários e outras pessoas que acessam ou usam o Serviço.\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eAo acessar ou usar o Serviço, você concorda em obedecer a estes Termos e Condições. Se você discordar de qualquer parte destes Termos e Condições, você não poderá acessar o Serviço.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eVocê declara que tem mais de 18 anos. A Empresa não permite que menores de 18 anos usem o Serviço.\u003c/p\u003e\n\n\u003cp\u003eSeu acesso e uso do Serviço também estão condicionados à sua aceitação e conformidade com a Política de Privacidade da Empresa.\u003c/p\u003e\n\n\u003ch2\u003eContas de Usuário\u003c/h2\u003e\n\n\u003cp\u003eAo criar uma conta conosco, você deve nos fornecer informações precisas, completas e atuais em todos os momentos. A falha em fazê-lo constitui uma violação dos Termos.\u003c/p\u003e\n\n\u003cp\u003eVocê é responsável por proteger a senha que usa para acessar o Serviço e por quaisquer atividades ou ações sob sua senha.\u003c/p\u003e\n\n\u003cp\u003eVocê concorda em não divulgar sua senha a terceiros. Você deve nos notificar imediatamente ao tomar conhecimento de qualquer violação de segurança ou uso não autorizado de sua conta.\u003c/p\u003e\n\n\u003ch2\u003ePedidos de Bens/Serviços\u003c/h2\u003e\n\n\u003cp\u003eO Serviço ou algumas partes do Serviço estão disponíveis apenas com uma Assinatura paga. Você será cobrado antecipadamente em uma base recorrente (mensal ou anual), dependendo do tipo de plano de assinatura que você selecionar.\u003c/p\u003e\n\n\u003cp\u003eNo final de cada período, sua Assinatura será renovada automaticamente sob as mesmas condições, a menos que você a cancele ou a Empresa a cancele.\u003c/p\u003e\n\n\u003ch3\u003eCancelamento de Assinatura\u003c/h3\u003e\n\n\u003cp\u003eVocê pode cancelar a renovação de sua Assinatura através das configurações de sua Conta ou entrando em contato conosco. Você não receberá um reembolso pelas taxas já pagas pelo período de assinatura atual e poderá acessar o Serviço até o final do período atual.\u003c/p\u003e\n\n\u003ch3\u003eAlterações de Preço\u003c/h3\u003e\n\n\u003cp\u003eA Empresa pode, a seu exclusivo critério, modificar os preços de assinatura a qualquer momento. Qualquer alteração entrará em vigor no final do período de assinatura atual.\u003c/p\u003e\n\n\u003ch3\u003eReembolsos\u003c/h3\u003e\n\n\u003cp\u003eExceto quando exigido por lei, as taxas de assinatura pagas não são reembolsáveis. Reembolsos podem ser considerados caso a caso a critério exclusivo da Empresa.\u003c/p\u003e\n\n\u003ch3\u003eTeste Gratuito\u003c/h3\u003e\n\n\u003cp\u003eA Empresa pode oferecer uma avaliação gratuita por tempo limitado. No final do período de avaliação, você será cobrado automaticamente pelas taxas de assinatura, a menos que cancele antes do término do período de avaliação.\u003c/p\u003e\n\n\u003ch2\u003eConteúdo do Usuário\u003c/h2\u003e\n\n\u003cp\u003eNosso Serviço permite que Você publique Conteúdo. Você é responsável pelo Conteúdo que publica no Serviço, incluindo sua legalidade, confiabilidade e adequação.\u003c/p\u003e\n\n\u003cp\u003eAo publicar Conteúdo no Serviço, Você nos concede o direito e a licença de usar, modificar, executar publicamente, exibir publicamente, reproduzir e distribuir tal Conteúdo no e através do Serviço.\u003c/p\u003e\n\n\u003cp\u003eVocê declara e garante que: (i) o Conteúdo é seu ou você tem o direito de usá-lo e nos conceder os direitos e licença conforme previsto nestes Termos, e (ii) a publicação de seu Conteúdo no ou através do Serviço não viola os direitos de privacidade, direitos de publicidade, direitos autorais, direitos contratuais ou quaisquer outros direitos de qualquer pessoa.\u003c/p\u003e\n\n\u003ch2\u003ePropriedade Intelectual\u003c/h2\u003e\n\n\u003cp\u003eO Serviço e seu conteúdo original (excluindo o Conteúdo fornecido por Você ou outros usuários), recursos e funcionalidades são e permanecerão propriedade exclusiva da Empresa e seus licenciadores.\u003c/p\u003e\n\n\u003cp\u003eO Serviço é protegido por direitos autorais, marcas registradas e outras leis tanto do Brasil quanto de países
