  --muted-foreground:220 9% 46%;
  --accent:217 33% 95%;
  --font-sans:Inter,system-ui,sans-serif;
  font-family:var(--font-sans);
  font-synthesis:none;
  text-rendering:optimizeLegibility
}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{min-width:320px;min-height:100dvh;margin:0;background:hsl(var(--background));color:hsl(var(--foreground));font-family:var(--font-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit}
.dark{
  color-scheme:dark;
  --background:222 47% 6%;
  --foreground:210 40% 98%;
  --border:217 33% 17%;
  --card:222 47% 8%;
  --card-foreground:210 40% 98%;
  --card-border:217 33% 17%;
  --primary:217 91% 60%;
  --primary-foreground:0 0% 100%;
  --muted:217 33% 17%;
  --muted-foreground:215 20% 65%;
  --accent:217 33% 17%
}
.site-header{position:sticky;top:0;z-index:50;border-bottom:1px solid hsl(var(--border));background:hsl(var(--card)/.5);backdrop-filter:blur(8px)}
.header-inner{width:100%;max-width:1152px;min-height:72px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand-cluster,.product-brand,.header-controls{display:flex;align-items:center}
.brand-cluster{min-width:0;gap:24px}
.product-brand{min-width:0;gap:16px}
.brand-logo{width:40px;height:40px;flex:0 0 40px;object-fit:contain}
.brand-fallback{display:grid;place-items:center;border-radius:8px;background:hsl(var(--primary)/.1);color:hsl(var(--primary))}
.brand-fallback-icon{width:20px;height:20px}
.brand-copy{min-width:0}
.brand-copy h1{margin:0;font-size:18px;font-weight:700;line-height:28px;letter-spacing:-.025em}
.brand-copy p{margin:0;color:hsl(var(--muted-foreground));font-size:12px;line-height:16px}
.company-name{display:flex;align-items:center;gap:8px;color:hsl(var(--muted-foreground));font-size:14px;line-height:20px;white-space:nowrap}
.building-icon{width:16px;height:16px;flex:0 0 16px}
.header-controls{flex:0 0 auto;gap:16px}
.language-picker{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid hsl(var(--border));border-radius:8px;background:hsl(var(--card))}
.language-button{min-width:32px;min-height:32px;padding:0 12px;border:1px solid transparent;border-radius:6px;background:transparent;color:hsl(var(--foreground));font-size:12px;font-weight:500;line-height:16px;white-space:nowrap;cursor:pointer}
.language-button:hover{background:hsl(var(--muted))}
.language-button[aria-pressed=true]{border-color:hsl(var(--primary));background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.theme-toggle{position:relative;width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;padding:0;border:1px solid transparent;border-radius:6px;background:transparent;color:hsl(var(--foreground));cursor:pointer}
.theme-toggle:hover{background:hsla(var(--foreground)/.04)}
.theme-toggle svg{position:absolute;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease,opacity .2s ease}
.theme-toggle .sun-icon{opacity:1;transform:rotate(0) scale(1)}
.theme-toggle .moon-icon{opacity:0;transform:rotate(90deg) scale(0)}
.dark .theme-toggle .sun-icon{opacity:0;transform:rotate(-90deg) scale(0)}
.dark .theme-toggle .moon-icon{opacity:1;transform:rotate(0) scale(1)}
.page-shell{width:100%;max-width:1152px;margin:0 auto;padding:32px 24px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:32px}
.document-rail{min-width:0}
.document-rail h2{margin:0 0 16px;color:hsl(var(--muted-foreground));font-size:14px;font-weight:600;line-height:20px;letter-spacing:.05em;text-transform:uppercase}
.document-list{display:grid;gap:8px}
.document-button{width:100%;min-height:44px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid transparent;border-radius:8px;background:hsl(var(--card));color:hsl(var(--card-foreground));text-align:left;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.document-button:hover{background:hsl(var(--muted))}
.document-button[aria-pressed=true]{border-color:hsl(var(--primary));background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.doc-icon{width:20px;height:20px;flex:0 0 20px}
.document-label{flex:1;font-size:14px;font-weight:500;line-height:20px}
.chevron{width:16px;height:16px;flex:0 0 16px}
.document-main{min-width:0}
.document-card{min-height:0;padding:32px;border:1px solid hsl(var(--card-border));border-radius:12px;background:hsl(var(--card));color:hsl(var(--card-foreground));box-shadow:0 2px 4px -1px hsl(0 0% 0%/.08)}
.dark .document-card{box-shadow:0 2px 4px -1px hsl(0 0% 0%/.25)}
.document-heading{display:flex;align-items:center;gap:12px;margin:0 0 24px;padding:0 0 24px;border-bottom:1px solid hsl(var(--border))}
.active-icon{display:grid;place-items:center;width:24px;height:24px;flex:0 0 24px;color:hsl(var(--primary))}
.active-icon .doc-icon{width:24px;height:24px}
.document-heading h1{margin:0;font-size:24px;font-weight:700;line-height:32px;letter-spacing:-.025em}
.document-heading p{margin:4px 0 0;color:hsl(var(--muted-foreground));font-size:14px;line-height:20px}
.legal-prose{max-width:none;overflow-wrap:anywhere;font-size:16px;line-height:1.625}
.legal-prose h1{margin:32px 0 24px;font-size:24px;font-weight:700;line-height:1.33;letter-spacing:-.025em}
.legal-prose h2{margin:24px 0 16px;font-size:20px;font-weight:600;line-height:1.4;letter-spacing:-.025em}
.legal-prose h3{margin:16px 0 12px;font-size:18px;font-weight:600;line-height:1.5;letter-spacing:-.025em}
.legal-prose h4,.legal-prose h5,.legal-prose h6{margin:16px 0 12px;font-size:16px;font-weight:600;line-height:1.5}
.legal-prose p{margin:1.25em 0 16px}
.legal-prose ul,.legal-prose ol{margin:1.25em 0 16px;padding-left:24px}
.legal-prose li{margin:8px 0}
.legal-prose blockquote{margin:1.25em 0;padding:2px 16px;border-left:4px solid hsl(var(--border));color:hsl(var(--muted-foreground))}
.legal-prose a{color:hsl(var(--primary));text-decoration:underline}
.legal-prose strong,.legal-prose b{font-weight:700}
.legal-prose hr{height:1px;margin:24px 0;border:0;background:hsl(var(--border))}
.legal-prose pre,.legal-prose code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.legal-prose code{padding:.1em .3em;border-radius:4px;background:hsl(var(--muted))}
.legal-prose pre{overflow:auto;padding:16px;border-radius:8px;background:hsl(var(--muted));font-size:14px}
.legal-prose pre code{padding:0;background:none}
.legal-prose table{width:100%;margin:16px 0;border-collapse:collapse}
.legal-prose th,.legal-prose td{padding:8px 12px;border:1px solid hsl(var(--border));text-align:left;vertical-align:top}
.legal-prose th{background:hsl(var(--muted));font-weight:600}
.site-footer{margin-top:48px;border-top:1px solid hsl(var(--border))}
.footer-inner{width:100%;max-width:1152px;margin:0 auto;padding:32px 24px;color:hsl(var(--muted-foreground));text-align:center;font-size:12px;line-height:16px}
.footer-inner p{margin:8px 0 0}
.footer-inner p:first-child{margin-top:0}
.company-registration{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.empty-documents{padding:48px 0;color:hsl(var(--muted-foreground));text-align:center}
button:focus-visible{outline:2px solid hsl(var(--primary));outline-offset:2px}
@media(min-width:1024px){.layout{grid-template-columns:280px minmax(0,1fr)}}
@media(max-width:767px){
  .company-name{display:none}
  .header-inner{flex-wrap:wrap;row-gap:12px}
  .header-controls{margin-left:auto}
  .page-shell{padding-top:32px}
}
@media(max-width:480px){
  .brand-cluster{flex:1}
  .header-controls{width:100%;justify-content:space-between;gap:8px}
  .language-picker{gap:2px}
  .document-card{padding:32px}
}
@media print{
  .site-header{position:static}
  .header-controls,.document-rail,.site-footer{display:none}
  .page-shell{width:100%;padding:0}
  .layout{display:block}
  .document-card{border:0;box-shadow:none}
}

ón de contacto disponible públicamente.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eSuscripciones y Pagos\u003c/h2\u003e\n\n\u003ch3\u003ePeriodo de Suscripción\u003c/h3\u003e\n\u003cp\u003eEl Servicio o algunas partes del Servicio están disponibles solo con una Suscripción paga. Se le facturará por anticipado de manera recurrente (mensual o anual), dependiendo del tipo de plan de suscripción que seleccione.\u003c/p\u003e\n\u003cp\u003eAl final de cada periodo, su Suscripción se renovará automáticamente bajo las mismas condiciones a menos que usted la cancele o la Empresa la cancele.\u003c/p\u003e\n\n\u003ch3\u003eCancelación de Suscripción\u003c/h3\u003e\n\u003cp\u003ePuede cancelar la renovación de su Suscripción a través de la configuración de su Cuenta o poniéndose en contacto con nosotros. No recibirá un reembolso por las tarifas ya pagadas por el periodo de suscripción actual y podrá acceder al Servicio hasta el final del periodo actual.\u003c/p\u003e\n\n\u003ch3\u003eCambios de Precio\u003c/h3\u003e\n\u003cp\u003eLa Empresa puede, a su exclusivo criterio, modificar los precios de suscripción en cualquier momento. Cualquier cambio entrará en vigor al final del periodo de suscripción actual.\u003c/p\u003e\n\n\u003ch3\u003eReembolsos\u003c/h3\u003e\n\u003cp\u003eExcepto cuando lo exija la ley, las tarifas de suscripción pagadas no son reembolsables. Los reembolsos pueden ser considerados caso por caso a la sola discreción de la Empresa.\u003c/p\u003e\n\n\u003ch3\u003ePrueba Gratuita\u003c/h3\u003e\n\u003cp\u003eLa Empresa puede ofrecer una prueba gratuita por un tiempo limitado. Al final del periodo de prueba, se le cobrará automáticamente las tarifas de suscripción a menos que cancele antes del final del periodo de prueba.\u003c/p\u003e","label":"Términos de Uso","languageLabel":"Español"},{"documentType":"copyright","language":"ES","content":"\u003ch2\u003eAviso de Derechos de Autor\u003c/h2\u003e\n\u003cp\u003eÚltima actualización: 20 de enero de 2026\u0 n    \u003cli\u003eE-mail : info@incodetech.com.br\u003c/li\u003e\n    \u003cli\u003eVisitez cette page : \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eContactez-nous\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e© 2026 MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA. Tous droits réservés.\u003c/p\u003e\n\n\u003ch2\u003eLimitation de Responsabilité\u003c/h2\u003e\n\u003cp\u003eAU MAXIMUM AUTORISÉ PAR LA LOI APPLICABLE, EN AUCUN CAS LA SOCIÉTÉ OU SES FOURNISSEURS NE SERONT RESPONSABLES DE TOUT DOMMAGE SPÉCIAL, INCIDENTAL, INDIRECT OU CONSÉCUTIF, Y COMPRIS, MAIS SANS S'Y LIMITER, DES DOMMAGES POUR PERTE DE PROFITS, PERTE DE DONNÉES OU AUTRE INFORMATION, INTERRUPTION D’AFFAIRES, BLESSURE CORPORELLE, PERTE DE CONFIDENTIALITÉ RÉSULTANT DE OU DANS TOUTE MESURE RELATIF À L'UTILISATION OU L'INCAPACITÉ À UTILISER LE SERVICE, LOGICIEL TIER ET/OU MATÉRIEL TIER UTILISÉ AVEC LE SERVICE, OU AUTREMENT EN RELATION AVEC UNE DISPOSITION DE CES TERMES.\u003c/p\u003e\n\u003cp\u003eLa responsabilité totale de la Société en vertu de cet accord ne dépassera pas le plus élevé des montants suivants : (a) le montant total que vous avez payé pour le Service au cours des 12 mois précédant la réclamation ; ou (b) 20,00 $ (vingt dollars).\u003c/p\u003e\n\n\u003ch2\u003eIndemnisation\u003c/h2\u003e\n\u003cp\u003eVous vous engagez à indemniser, défendre et dégager la Société, ses affiliés, directeurs, employés, agents, licenciés et fournisseurs contre toutes réclamations, responsabilités, dommages, jugements, coûts et dépenses (y compris les honoraires d'avocat raisonnables) découlant de ou liés à : (a) votre utilisation du Service ; (b) toute violation de ces Conditions par vous ; (c) tout contenu que vous publiez ou transmettez par le biais du Service ; (d) votre violation de toute loi, règle ou réglementation applicable ; ou (e) votre violation des droits de tout tiers.\u003c/p\u003e\n\n\u003ch2\u003eAvis de Non-Garantie\u003c/h2\ À UTILISER LE SERVICE, Y COMPRIS LES DOMMAGES CAUSÉS PAR DES MALICIELS, VIRUS OU TOUT PROGRAMME INFORMATIQUE INCORRECT OU INCOMPLET.\u003c/p\u003e\n\n\u003ch2\u003eConformité LGPD\u003c/h2\u003e\n\u003cp\u003eCe document est conforme à la Loi Générale sur la Protection des Données du Brésil (LGPD - Loi n° 13.709/2018) et ses mises à jour, notamment :\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eRésolution CD/ANPD n° 19/2024\u003c/strong\u003e : Règles pour le transfert international de données personnelles.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotification d'Incidents\u003c/strong\u003e : Délai de 3 (trois) jours ouvrables pour notifier l'ANPD et les personnes concernées.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDroits des Personnes Concernées\u003c/strong\u003e : Accès, rectification, portabilité, suppression et révocation du consentement.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDélégué à la Protection des Données (DPO)\u003c/strong\u003e : Coordonnées publiquement disponibles.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLes sanctions peuvent atteindre jusqu'à 2 % des revenus annuels au Brésil ou 50 millions de BRL par violation.\u003c/p\u003e\n\n\u003ch2\u003eAbonnements et Paiements\u003c/h2\u003e\n\n\u003ch3\u003ePériode d'Abonnement\u003c/h3\u003e\n\u003cp\u003eLe Service ou certaines parties du Service ne sont disponibles que par abonnement payant. Vous serez facturé à l'avance sur une base récurrente (mensuelle ou annuelle), en fonction du type de plan d'abonnement que vous choisissez.\u003c/p\u003e\n\n\u003ch3\u003eAnnulation de l'Abonnement\u003c/h3\u003e\n\u003cp\u003eVous pouvez annuler le renouvellement de votre abonnement via les paramètres de votre compte ou en nous contactant. Vous ne recevrez pas de remboursement des frais déjà payés pour la période d'abonnement actuelle et vous pourrez accéder au Service jusqu'à la fin de la période en cours.\u003c/p\u003e\n\n\u003ch3\u003eModifications de Prix\u003c/h3\u003e\n\u003cp\u003eLa Société peut, à sa seule discrétion, modifier les prix d'abonnement à tout moment. Toute modification prendra effet à la fin de la période d'abonnement en cours.\u003c/p\u003e\n\n\u003ch3\u003eRemboursements\u003c/h3\u003e\n\u003cp\u003eSauf si la loi l'exige, les frais d'abonnement payés ne sont pas remboursables. Les remboursements peuvent être envisagés au cas par cas à la seule discrétion de la Société.\u003c/p\u003e\n\n\u003ch3\u003eEssai Gratuit\u003c/h3\u003e\n\u003cp\u003eLa Société peut offrir un essai gratuit pendant une période limitée. À la fin de la période d'essai, vous serez automatiquement facturé des frais d'abonnement sauf si vous annulez avant la fin de la période d'essai.\u003c/p\u003e\n\n\u003c/html\u003e","label":"Droits d'Auteur","languageLabel":"Français"},{"documentType":"terms_of_service","language":"DE","content":"\u003ch2\u003eAllgemeine Geschäftsbedingungen\u003c/h2\u003e\n\n\u003cp\u003eLetzte Aktualisierung: 20. Januar 2026\u003c/p\u003e\n\n\u003cp\u003eBitte lesen Sie diese Allgemeinen Geschäftsbedingungen (\"Bedingungen\") sorgfältig durch, bevor Sie den Dienst \u003cstrong\u003eRENDERWEAR\u003c/strong\u003e, betrieben von \u003cstrong\u003eINCODE TECH\u003c/strong\u003e, nutzen.\u003c/p\u003e\n\n\u003ch2\u003eAuslegung und Definitionen\u003c/h2\u003e\n\n\u003ch3\u003eAuslegung\u003c/h3\u003e\n\u003cp\u003eDie Begriffe, deren Anfangsbuchstabe großgeschrieben ist, haben die unten definierten Bedeutungen.\u003c/p\u003e\n\n\u003ch3\u003eDefinitionen\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eUnternehmen\u003c/strong\u003e bezieht sich auf \u003cstrong\u003eMIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA.\u003c/strong\u003e, \u003cstrong\u003eALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDienst\u003c/strong\u003e bezieht sich auf \u003cstrong\u003eRENDERWEAR\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSie\u003c/strong\u003e bedeutet die Person, die auf den Dienst zugreift.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eKonto\u003c/strong\u003e bedeutet ein einzigartiges Konto, das für Sie erstellt wurde, um auf unseren Dienst zuzugreifen.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAbonnement\u003c/strong\u003e bezieht sich auf die Dienstleistungen oder den Zugang zum Dienst, der auf Abonnementbasis angeboten wird.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eBeschreibung des Dienstes\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eRENDERWEAR\u003c/strong\u003e ist ein Dienst, der es Ihnen ermöglicht, innovative Inhalte zu erstellen und zu bearbeiten. Der Dienst kann sowohl kostenpflichtige als auch kostenlose Funktionen umfassen.\u003c/p\u003e\n\n\u003ch2\u003eNutzerdaten\u003c/h2\u003e\n\u003cp\u003eUm auf bestimmte Funktionen des Dienstes zugreifen zu können, müssen Sie möglicherweise ein Konto erstellen. Sie sind dafür verantwortlich, die Vertraulichkeit Ihres Kontos und Passworts zu wahren.\u003c/p\u003e\n\u003cp\u003eSie stimmen zu, die Verantwortung für alle Aktivitäten zu übernehmen, die unter Ihrem Konto durchgeführt werden. Sie müssen uns sofort über jede unbefugte Nutzung Ihres Kontos informieren.\u003c/p\u003e\n\n\u003ch2\u003eZahlungsbedingungen\u003c/h2\u003e\n\n\u003ch3\u003eAbonnementzeitraum\u003c/h3\u003e\n\u003cp\u003eDer Dienst oder Teile des Dienstes sind nur mit einem kostenpflichtigen Abonnement verfügbar. Sie werden im Voraus auf wiederkehrender Basis (monatlich oder jährlich) abgerechnet, abhängig von der Art des von Ihnen ausgewählten Abonnementplans.\u003c/p\u003e\n\u003cp\u003eAm Ende jedes Zeitraums verlängert sich Ihr Abonnement automatisch unter den gleichen Bedingungen, es sei denn, Sie kündigen es oder das Unternehmen kündigt es.\u003c/p\u003e\n\n\u003ch3\u003eKündigung des Abonnements\u003c/h3\u003e\n\u003cp\u003eSie können die Verlängerung Ihres Abonnements über die Kontoeinstellungen oder durch Kontaktaufnahme mit uns kündigen. Sie erhalten keine Rückerstattung für bereits gezahlte Gebühren für den aktuellen Abonnementzeitraum und haben weiterhin Zugang zum Dienst bis zum Ende des aktuellen Zeitraums.\u003c/p\u003e\n\n\u003ch3\u003ePreisänderungen\u003c/h3\u003e\n\u003cp\u003eDas Unternehmen kann nach eigenem Ermessen die Abonnementpreise jederzeit ändern. Jede Änderung tritt am Ende des aktuellen Abonnementzeitraums in Kraft.\u003c/p\u003e\n\n\u003ch3\u003eRückerstattungen\u003c/h3\u003e\n\u003cp\u003eSofern gesetzlich nicht anders vorgeschrieben, sind die Gebühren für kostenpflichtige Abonnements nicht rückerstattbar. Rückerstattungen können nach eigenem Ermessen des Unternehmens fallweise geprüft werden.\u003c/p\u003e\n\n\u003ch3\u003eKostenloses Probeabonnement\u003c/h3\u003e\n\u003cp\u003eDas Unternehmen kann für einen begrenzten Zeitraum ein kostenloses Probeabonnement anbieten. Am Ende des Probezeitraums werden Ihnen automatisch die Abonnementgebühren berechnet, es sei denn, Sie kündigen vor Ablauf des Probezeitraums.\u003c/p\u003e\n\n\u003ch2\u003eVerfügbarkeit des Dienstes\u003c/h2\u003e\n\u003cp\u003eDas Unternehmen bemüht sich, den Dienst 24 Stunden am Tag, 7 Tage die Woche verfügbar zu halten. Das Unternehmen garantiert jedoch nicht, dass der Dienst ununterbrochen oder fehlerfrei verfügbar ist.\u003c/p\u003e\n\u003cp\u003eDas Unternehmen behält sich das Recht vor, den Dienst jederzeit vorübergehend oder dauerhaft zu ändern, auszusetzen oder einzustellen, mit oder ohne vorherige Ankündigung.\u003c/p\u003e\n\n\u003ch2\u003eGeistiges Eigentum\u003c/h2\u003e\n\u003cp\u003eDer gesamte Inhalt, der im Dienst enthalten ist, einschließlich Text, Grafiken, Logos, Icons, Bilder, Audio-Clips, digitale Downloads und Software, ist Eigentum des Unternehmens oder seiner Inhaltanbieter und durch das brasilianische und internationale Urheberrecht geschützt.\u003c/p\u003e\n\n\u003ch2\u003eHaftungsbeschränkung\u003c/h2\u003e\n\u003cp\u003eIN KEINEM FALL HAFTET DAS UNTERNEHMEN ODER SEINE LIEFERANTEN FÜR BESONDERE, NEBEN-, INDIREKTE ODER FOLGESCHÄDEN JEDER ART (EINSCHLIESSLICH, ABER NICHT BEGRENZT AUF, SCHÄDEN FÜR VERLORENEN GEWINN, DATENVERLUST ODER ANDERE INFORMATIONEN, FÜR GESCHÄFTSUNTERBRECHUNG, FÜR PERSONENSCHÄDEN, VERLORENEN PRIVATSPHÄRE, DIE AUS ODER IN IRGENDEINER WEISE MIT DER NUTZUNG ODER DER UNFÄHIGKEIT, DEN DIENST ZU NUTZEN, DRITTANBIETER-SOFTWARE UND/ODER DRITTANBIETER-HARDWARE, DIE MIT DEM DIENST VERWENDET WERDEN, ODER ANDERSFALLS IM ZUSAMMENHANG MIT IRGENDEINER BESTIMMUNG DIESER BEDINGUNGEN ENTSTEHEN.\u003c/p\u003e\n\u003cp\u003eDie Gesamthaftung des Unternehmens aus diesem Vertrag darf den größeren Betrag nicht überschreiten: (a) den Gesamtbetrag, den Sie im Jahr vor dem anspruchsberechtigten Anspruch für den Dienst gezahlt haben; oder (b) 20,00 USD (zwanzig Dollar).\u003c/p\u003e\n\n\u003ch2\u003eIndemnifizierung\u003c/h2\u003e\n\u003cp\u003eSie stimmen zu, das Unternehmen, seine Tochtergesellschaften, Direktoren, Mitarbeiter, Vertreter, Lizenzgeber und Lieferanten von und gegen alle Ansprüche, Haftungen, Schäden, Urteile, Kosten und Ausgaben (einschließlich angemessener Anwaltsgebühren) schadlos zu halten, die sich aus oder in Verbindung mit ergeben:\u003cbr\u003e\n(a) Ihrer Nutzung des Dienstes;\u003cbr\u003e\n(b) einem Verstoß Ihrerseits gegen diese Bedingungen;\u003cbr\u003e\n(c) Inhalten, die Sie über den Dienst posten oder übermitteln;\u003cbr\u003e\n(d) Ihrem Verstoß gegen geltendes Recht, Vorschriften oder Bestimmungen;\u003cbr\u003e\n(e) Ihrem Verstoß gegen die Rechte Dritter.\u003c/p\u003e\n\n\u003ch2\u003eÄnderungen des Dienstes\u003c/h2\u003e\n\u003cp\u003eDas Unternehmen behält sich das Recht vor, unseren Dienst und alle Dienste oder Materialien, die wir über den Dienst bereitstellen, nach eigenem Ermessen ohne vorherige Ankündigung zurückzuziehen oder zu ändern.\u003c/p\u003e\n\n\u003ch2\u003eStreitbeilegung\u003c/h2\u003e\n\u003cp\u003eWenn Sie mit dem Unternehmen eine Streitigkeit haben, stimmen Sie zu, zunächst zu versuchen, diese informell zu lösen, indem Sie uns unter \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e kontaktieren.\u003c/p\u003e\n\n\u003ch2\u003eAnwendbares Recht\u003c/h2\u003e\n\u003cp\u003eDiese Bedingungen unterliegen den Gesetzen der Föderativen Republik Brasilien und werden nach diesen ausgelegt, ohne Berücksichtigung der Bestimmungen über Konflikte von Gesetzen.\u003c/p\u003e\n\u003cp\u003eJede Streitigkeit, die sich aus oder im Zusammenhang mit diesen Bedingungen ergibt, unterliegt der ausschließlichen Gerichtsbarkeit der Gerichte der Stadt São Paulo, Bundesstaat São Paulo, Brasilien, und die Parteien verzichten unwiderruflich auf jeden Einwand gegen die Zuständigkeit solcher Gerichte.\u003c/p\u003e\n\n\u003ch2\u003eKontakt\u003c/h2\u003e\n\u003cp\u003eWenn Sie Fragen zu diesen Allgemeinen Geschäftsbedingungen haben, kontaktieren Sie uns bitte:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eE-Mail: \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eBesuchen Sie diese Seite: \u003cstrong\u003e\u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eKontaktseite\u003c/a\u003e\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eLGPD-Konformität\u003c/h2\u003e\n\u003cp\u003eDieses Dokument entspricht dem brasilianischen Allgemeinen Datenschutzgesetz (LGPD - Gesetz Nr. 13.709/2018) und seinen Aktualisierungen, einschließlich:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eANPD-Beschluss CD Nr. 19/2024\u003c/strong\u003e: Regeln für die internationale Übertragung personenbezogener Daten.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVorfallmeldung\u003c/strong\u003e: Frist von 3 (drei) Werktagen zur Benachrichtigung der ANPD und der betroffenen Personen.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRechte der Betroffenen\u003c/strong\u003e: Zugang, Berichtigung, Übertragbarkeit, Lös
