h3\u003ePrueba Gratuita\u003c/h3\u003e\n\n\u003cp\u003eLa Empresa puede ofrecer una prueba gratuita por un tiempo limitado. Al final del período de prueba, se le cobrará automáticamente las tarifas de suscripción a menos que cancele antes del final del período de prueba.\u003c/p\u003e\n\n\u003ch2\u003eDisponibilidad del Servicio\u003c/h2\u003e\n\n\u003cp\u003eLa Empresa se esfuerza por mantener el Servicio disponible las 24 horas, los 7 días de la semana. Sin embargo, la Empresa no garantiza que el Servicio estará disponible de manera ininterrumpida o libre de errores.\u003c/p\u003e\n\n\u003cp\u003eLa Empresa se reserva el derecho de modificar, suspender o descontinuar el Servicio, temporal o permanentemente, en cualquier momento, con o sin aviso previo.\u003c/p\u003e\n\n\u003ch2\u003ePropiedad Intelectual\u003c/h2\u003e\n\n\u003cp\u003eTodo el contenido incluido en el Servicio, como texto, gráficos, logotipos, íconos, imágenes, clips de audio, descargas digitales y software, es propiedad de la Empresa o de sus proveedores de contenido y está protegido por las leyes de derechos de autor brasileñas e internacionales.\u003c/p\u003e\n\n\u003ch2\u003eLimitación de Responsabilidad\u003c/h2\u003e\n\n\u003cp\u003e\u003cstrong\u003eEN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES SERÁN RESPONSABLES POR CUALESQUIERA DAÑOS ESPECIALES, INCIDENTALES, INDIRECTOS O CONSECUENTES QUE SURJAN DE CUALQUIER MANERA RELACIONADA CON EL USO O IMPOSIBILIDAD DE USAR EL SERVICIO, INCLUYENDO, PERO NO LIMITÁNDOSE A, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS O OTRA INFORMACIÓN, INTERRUPCIÓN DEL NEGOCIO, POR LESIONES PERSONALES O POR PÉRDIDA DE PRIVACIDAD.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eLa responsabilidad total de la Empresa bajo este acuerdo no excederá el mayor de: (a) el monto total pagado por usted por el Servicio durante los 12 meses anteriores a la reclamación; o (b) $20.00 (veinte dólares).\u003c/p\u003e\n\n\u003ch2\u003eIndemnización\u003c/h2\u003e\n\n\u003cp\u003eUsted acepta indemnizar, defender y mantener indemne a la Empresa, sus afiliados, directores, empleados, agentes, licenciantes y proveedores de cualquier reclamación, responsabilidad, daños, juicios, costos y gastos (incluidos los honorarios razonables de abogados) que surjan de o estén relacionados con: (a) su uso del Servicio; (b) cualquier incumplimiento de estos Términos por usted; (c) cualquier contenido que publique o transmita a través del Servicio; (d) su violación de cualquier ley, norma o regulación aplicable; o (e) su violación de los derechos de cualquier tercero.\u003c/p\u003e\n\n\u003ch2\u003eModificaciones del Servicio\u003c/h2\u003e\n\n\u003cp\u003eLa Empresa se reserva el derecho de retirar o alterar nuestro Servicio, y cualquier servicio o material que proporcionemos a través del Servicio, a nuestro exclusivo criterio, sin aviso previo.\u003c/p\u003e\n\n\u003ch2\u003eResolución de Disputas\u003c/h2\u003e\n\n\u003cp\u003eSi usted tiene alguna disputa con la Empresa, acepta intentar resolverla de manera informal contactando a \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch2\u003eLei Aplicable\u003c/h2\u003e\n\n\u003cp\u003eEstos Términos se regirán e interpretarán de acuerdo con las leyes de la República Federativa de Brasil, sin considerar sus disposiciones sobre conflictos de leyes.\u003c/p\u003e\n\n\u003ch2\u003eContacto\u003c/h2\u003e\n\n\u003cp\u003eSi tiene alguna pregunta sobre estos Términos de Servicio, contáctenos:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eEmail:\u003c/strong\u003e \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVisitando esta página:\u003c/strong\u003e \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eCumplimiento de la LGPD\u003c/h2\u003e\n\n\u003cp\u003eEste documento cumple con la Ley General de Protección de Datos de Brasil (LGPD - Ley N° 13.709/2018) y sus actualizaciones, incluyendo:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eResolución CD/ANPD N° 19/2024:\u003c/strong\u003e Reglas para transferencia internacional de datos personales.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotificación de Incidentes:\u003c/strong\u003e Plazo de 3 (tres) días hábiles para comunicar a la ANPD y a los titulares afectados.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerechos de los Titulares:\u003c/strong\u003e Acceso, corrección, portabilidad, eliminación y revocación del consentimiento.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDelegado de Protección de Datos (DPO):\u003c/strong\u003e Información de contacto disponible públicamente.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePenalizaciones:\u003c/strong\u003e Hasta el 2% de los ingresos anuales de Brasil o BRL 50 millones por violación.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eAceptación por Uso\u003c/h2\u003e\n\n\u003cp\u003eAL ACCEDER, DESCARGAR, INSTALAR O UTILIZAR EL SERVICIO, USTED RECONOCE QUE HA LEÍDO, COMPRENDIDO Y ACEPTA ESTAR SUJETO A ESTOS TÉRMINOS. SI NO ACEPTA ESTOS TÉRMINOS, NO ACCEDA NI UTILICE EL SERVICIO.\u003c/p\u003e\n\n\u003cp\u003eEl uso continuo del Servicio después de cualquier modificación de estos Términos constituye su aceptación de tales modificaciones.\u003c/p\u003e","label":"Términos de Servicio","languageLabel":"Español"},{"documentType":"disclaimer","language":"FR","content":"\u003ch2\u003eExonération de Responsabilité\u003c/h2\u003e\n\n\u003cp\u003eDernière mise à jour : 20 janvier 2026\u003c/p\u003e\n\n\u003ch2\u003eInterprétation et Définitions\u003c/h2\u003e\n\n\u003ch3\u003eInterprétation\u003c/h3\u003e\n\u003cp\u003eLes mots dont la première lettre est en majuscule ont des significations définies dans les conditions ci-dessous. Les définitions suivantes doivent avoir le même sens, qu'elles apparaissent au singulier ou au pluriel.\u003c/p\u003e\n\n\u003ch3\u003eDéfinitions\u003c/h3\u003e\n\u003cp\u003eAux fins de cette exonération de responsabilité :\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eEntreprise\u003c/strong\u003e (désignée comme \"l'Entreprise\", \"Nous\", \"Notre\" dans cette exonération de responsabilité) fait référence à MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICAÇÃO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRÉSIL.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eService\u003c/strong\u003e fait référence au site, à l'application ou aux deux.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVous\u003c/strong\u003e signifie l'individu qui accède au Service, ou l'entreprise, ou toute autre personne morale au nom de laquelle cet individu accède ou utilise le Service, selon le cas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e désigne RENDERWEAR, accessible à \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eApplication\u003c/strong\u003e désigne le programme logiciel fourni par l'Entreprise appelé RENDERWEAR.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eExonération de Responsabilité Générale\u003c/h2\u003e\n\n\u003cp\u003eLes informations contenues dans le Service sont uniquement à des fins d'information générale.\u003c/p\u003e\n\n\u003cp\u003eL'Entreprise ne saisi aucune responsabilité pour les erreurs ou omissions dans le contenu du Service.\u003c/p\u003e\n\n\u003cp\u003eEN AUCUNE CIRCONSTANCE, L'ENTREPRISE NE SERA RESPONSABLE DES DOMMAGES SPÉCIAUX, DIRECTS, INDIRECTS, CONSÉCUTIFS OU INCIDENTAUX, OU DES DOMMAGES DE QUELQUE NATURE QUE CE SOIT, QUE CE SOIT DANS LE CADRE D'UNE ACTION CONTRACTUELLE, D'UNE NÉGLIGENCE OU D'UN AUTRE ACTE ILLICITE, DÉCOULANT DE OU EN LIEN AVEC L'UTILISATION DU SERVICE OU DU CONTENU DU SERVICE. L'ENTREPRISE SE RÉSERVE LE DROIT D'APPORTER DES AJOUTS, DES SUPPRESSIONS OU DES MODIFICATIONS AU CONTENU DU SERVICE À TOUT MOMENT, SANS PRÉAVIS.\u003c/p\u003e\n\n\u003cp\u003eL'ENTREPRISE NE GARANTIT PAS QUE LE SERVICE SOIT EXEMPT DE VIRUS OU D'AUTRES ÉLÉMENTS NUISIBLES.\u003c/p\u003e\n\n\u003ch2\u003eExonération de Responsabilité de Liens Externes\u003c/h2\u003e\n\n\u003cp\u003eLe Service peut contenir des liens vers des sites externes qui ne sont pas fournis ou maintenus par ou d'une quelconque manière affiliés à l'Entreprise.\u003c/p\u003e\n\n\u003cp\u003eSOYEZ AVERTIS QUE L'ENTREPRISE NE GARANTIT PAS L'EXACTITUDE, LA PERTINENCE, L'OPPORTUNITÉ OU L'INTÉGRALITÉ D'INFORMATIONS SUR CES SITES EXTERNES.\u003c/p\u003e\n\n\u003ch2\u003eExonération de Responsabilité pour Erreurs et Omissions\u003c/h2\u003e\n\n\u003cp\u003eLes informations fournies par le Service sont uniquement à titre d'orientation générale sur des questions d'intérêt. Bien que l'Entreprise prenne toutes les précautions pour s'assurer que le contenu du Service soit à jour et précis, des erreurs peuvent survenir. De plus, en raison de la nature changeante des lois, règlements et réglementations, des retards, omissions ou inexactitudes peuvent apparaître dans les informations contenues dans le Service.\u003c/p\u003e\n\n\u003cp\u003eL'ENTREPRISE N'ASSUME AUCUNE RESPONSABILITÉ POUR DES ERREURS OU OMISSIONS, NI POUR LES RÉSULTATS OBTENUS EN UTILISANT CES INFORMATIONS.\u003c/p\u003e\n\n\u003ch2\u003eExonération de Responsabilité de Usage Équitable\u003c/h2\u003e\n\n\u003cp\u003eL'Entreprise peut utiliser du matériel protégé par des droits d'auteur qui n'a pas toujours été spécifiquement autorisé par le propriétaire des droits d'auteur. L'Entreprise met à disposition ce matériel pour critique, commentaire, reportage, enseignement, recherche ou études.\u003c/p\u003e\n\n\u003cp\u003eL'ENTREPRISE CROIT QUE CECI CONSTITUE UN \"USAGE ÉQUITABLE\" DE TOUT MATÉRIAU PROTÉGÉ PAR DES DROITS D'AUTEUR, TEL QUE PRÉVU DANS LA SECTION 107 DE LA LOI SUR LES DROITS D'AUTEUR DES ÉTATS-UNIS.\u003c/p\u003e\n\n\u003cp\u003eSi vous souhaitez utiliser du matériel protégé par des droits d'auteur du Service pour vos propres besoins qui dépassent l'usage équitable, vous devez obtenir l'autorisation du propriétaire des droits d'auteur.\u003c/p\u003e\n\n\u003ch2\u003eExonération de Responsabilité des Opinions\u003c/h2\u003e\n\n\u003cp\u003eLe Service peut contenir des points de vue et opinions des auteurs qui ne reflètent pas nécessairement la politique officielle ou la position d'autres auteurs, agences, organisations, employeurs ou entreprises, y compris l'Entreprise.\u003c/p\u003e\n\n\u003cp\u003eLes commentaires publiés par les utilisateurs sont sous leur seule responsabilité et les utilisateurs assument l'entière responsabilité, ainsi que toutes les conséquences légales en cas de diffamation ou de litige résultant de tout ce qui est écrit ou comme conséquence directe de tout ce qui est écrit dans un commentaire. L'ENTREPRISE NE PEUT ÊTRE TENUE POUR RESPONSABLE DES COMMENTAIRES PUBLIÉS PAR LES UTILISATEURS ET SE RÉSERVE LE DROIT DE SUPPRIMER TOUT COMMENTAIRE POUR TOUTE RAISON.\u003c/p\u003e\n\n\u003ch2\u003eExonération de Responsabilité Professionnelle\u003c/h2\u003e\n\n\u003cp\u003eLes informations sur le Service sont fournies dans le cadre de la compréhension que l'Entreprise n'est pas impliquée dans la fourniture de services et de conseils juridiques, comptables, fiscaux ou autres professionnels. Par conséquent, elles ne doivent pas être utilisées comme un substitut à la consultation avec des conseillers professionnels en comptabilité, fiscaux, juridiques ou d'autres conseillers compétents.\u003c/p\u003e\n\n\u003cp\u003eEN AUCUN CAS, L'ENTREPRISE OU SES FOURNISSEURS NE SERONT RESPONSABLES DES DOMMAGES SPÉCIAUX, INCIDENTAUX, INDIRECTS OU CONSÉCUTIFS DE QUELQUE NATURE QUE CE SOIT DÉCOULANT DE OU EN LIEN AVEC VOTRE ACCÈS OU UTILISATION OU INCAPACITÉ D'ACCÉDER OU D'UTILISER LE SERVICE.\u003c/p\u003e\n\n\u003ch2\u003eUtilisation à Vos Risques et Périls\u003c/h2\u003e\n\n\u003cp\u003eToutes les informations dans le Service sont fournies \"TELS QUELS\", sans garantie d'intégrité, d'exactitude, d'opportunité ou des résultats obtenus par l'utilisation de ces informations et sans aucune garantie de quelque type que ce soit, exprimée ou implicite, y compris, mais sans s'y limiter, les garanties de performance, de qualité marchande et d'adéquation à un but particulier.\u003c/p\u003e\n\n\u003cp\u003eVOUS ASSUMEZ L'INTÉGRALE RESPONSABILITÉ ET LE RISQUE LORS DE VOTRE UTILISATION DU SERVICE. L'ENTREPRISE NE SERA PAS RESPONSABLE DES DOMMAGES RÉSULTANT DE L'UTILISATION OU DE L'INCAPACITÉ À UTILISER LE SERVICE, Y COMPRIS LES DOMMAGES PROVOQUÉS PAR DES MALWARES, DES VIRUS OU TOUT PROGRAMME INFORMATIQUE INCORRECT OU INCOMPLET.\u003c/p\u003e\n\n\u003ch2\u003eContact\u003c/h2\u003e\n\n\u003cp\u003eSi vous avez des questions concernant cette exonération de responsabilité, vous pouvez nous contacter :\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eEmail : \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eEn visitant notre page de contact : \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","label":"Avis de Non-Responsabilité","languageLabel":"Français"},{"documentType":"return_refund","language":"FR","content":"\u003ch2\u003ePolitique de Retour et de Remboursement\u003c/h2\u003e\n\n\u003cp\u003eDernière mise à jour : 20 janvier 2026\u003c/p\u003e\n\n\u003cp\u003eMerci d'avoir acheté RENDERWEAR.\u003c/p\u003e\n\n\u003cp\u003eSi vous n'êtes pas entièrement satisfait de votre achat, nous sommes là pour vous aider.\u003c/p\u003e\n\n\u003ch2\u003eInterprétation et Définitions\u003c/h2\u003e\n\n\u003ch3\u003eDéfinitions\u003c/h3\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eEntreprise\u003c/strong\u003e : désigne MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRÉSIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eBiens\u003c/strong\u003e : désigne les articles proposés à la vente dans le Service.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCommandes\u003c/strong\u003e : signifie une demande de votre part d'acheter des Biens chez nous.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eService\u003c/strong\u003e : désigne RENDERWEAR.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVous\u003c/strong\u003e : désigne l'individu accédant ou utilisant le Service, ou la société ou autre entité légale pour le compte de laquelle cet individu accède ou utilise le Service.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eVotre Éligibilité pour Remboursement\u003c/h2\u003e\n\n\u003cp\u003eLes articles suivants sont éligibles pour un remboursement :\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eBiens défectueux ou endommagés au moment de la livraison.\u003c/li\u003e\n    \u003cli\u003eBiens qui ne correspondent pas à la description fournie.\u003c/li\u003e\n    \u003cli\u003eBiens non utilisés et dans leur emballage d'origine.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003ePour être éligible à un retour, votre article doit être inutilisé et dans le même état que vous l'avez reçu. Il doit également être dans l'emballage d'origine.\u003c/p\u003e\n\n\u003ch2\u003ePrazos pour Solicitação\u003c/h2\u003e\n\n\u003cp\u003eVous disposez de 7 (sept) jours calendaires à compter de la date de réception du produit pour demander un retour ou un remboursement, conformément au Code de la Protection des Consommateurs brésilien (Loi n° 8.078/90).\u003c/p\u003e\n\n\u003cp\u003ePour les abonnements numériques, vous pouvez annuler et demander un remboursement dans les 7 jours suivant la souscription, tant que le service n'a pas été utilisé.\u003c/p\u003e\n\n\u003ch2\u003eProcessus de Remboursement\u003c/h2\u003e\n\n\u003cp\u003ePour demander un remboursement, suivez ces étapes :\u003c/p\u003e\n\n\u003col\u003e\n    \u003cli\u003eContactez-nous à l'adresse \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e en indiquant votre numéro de commande et le motif du remboursement.\u003c/li\u003e\n    \u003cli\u003eAttendez notre réponse avec des instructions sur la façon de procéder.\u003c/li\u003e\n    \u003cli\u003eSi applicable, renvoyez l'article conformément aux instructions fournies.\u003c/li\u003e\n    \u003cli\u003eAprès réception et inspection de l'article, nous vous informerons de l'approbation ou du refus du remboursement.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003cp\u003eSi approuvé, votre remboursement sera traité, et un crédit sera automatiquement appliqué à votre méthode de paiement d'origine dans un délai de 14 jours ouvrables.\u003c/p\u003e\n\n\u003ch2\u003eItems Non Remboursables\u003c/h2\u003e\n\n\u003cp\u003eLes articles suivants ne sont pas éligibles pour un remboursement :\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eProduits numériques qui ont déjà été téléchargés ou accessibles.\u003c/li\u003e\n    \u003cli\u003eAbonnements après la période de 7 jours, si le service a déjà été utilisé.\u003c/li\u003e\n    \u003cli\u003eProduits personnalisés fabriqués sur commande.\u003c/li\u003e\n    \u003cli\u003eProduits qui, de par leur nature, ne peuvent être retournés (par exemple, pour des raisons d'hygiène).\u003c/li\u003e\n    \u003cli\u003eCartes-cadeaux.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eRemboursements Partiels\u003c/h2\u003e\n\n\u003cp\u003eDans certaines situations, seuls des remboursements partiels peuvent être accordés :\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eArticle présentant des signes évidents d'utilisation.\u003c/li\u003e\n    \u003cli\u003eArticle retourné plus de 7 jours après la livraison.\u003c/li\u003e\n    \u003cli\u003eArticle non dans son état d'origine ou avec des pièces manquantes.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eRemboursements Atrasés ou Absents\u003c/h2\u003e\n\n\u003cp\u003eSi vous n'avez pas encore reçu votre remboursement :\u003c/p\u003e\n\n\u003col\u003e\n    \u003cli\u003eVérifiez d'abord à nouveau votre compte bancaire.\u003c/li\u003e\n    \u003cli\u003eContactez l'entreprise de votre carte de crédit, car il peut falloir du temps avant que votre remboursement soit officiellement alloué.\u003c/li\u003e\n    \u003cli\u003eContactez votre banque, car il y a souvent un délai de traitement avant que le remboursement soit crédité.\u003c/li\u003e\n    \u003cli\u003eSi vous avez suivi ces étapes et n'avez toujours pas reçu votre remboursement, contactez-nous à \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003ch2\u003eÉchanges\u003c/h2\u003e\n\n\u003cp\u003eNous ne remplaçons les articles que s'ils sont défectueux ou endommagés. Si vous avez besoin de remplacer un article par le même, envoyez-nous un e-mail à \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e.\u003c/p\u003e\n\n\u003ch2\u003eContact\u003c/h2\u003e\n\n\u003cp\u003eSi vous avez des questions concernant notre Politique de Retour et de Remboursement, contactez-nous :\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eE-mail : \u003cstrong\u003einfo@incodetech.com.br\u003c/strong\u003e\u003c/li\u003e\n    \u003cli\u003eEn visitant cette page : \u003cstrong\u003e\u003ca href=\"https://www.incodetech.com.br/contact.html\" target=\"_blank\"\u003eContactez-nous\u003c/a\u003e\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eLimitation de Responsabilité\u003c/h2\u003e\n\n\u003cp\u003eÀ LA MAXIMUM AUTORISÉ PAR LA LOI APPLICABLE, EN AUCUN CAS, L'ENTREPRISE OU SES FOURNISSEURS NE SAURAIENT ÊTRE TENUS RESPONSABLES DE TOUT DOMMAGE SPÉCIAL, INCIDENTEL, INDIRECT OU CONSÉCUTIF (Y COMPRIS, MAIS SANS S'Y LIMITER, LES DOMMAGES POUR PERTE DE PROFITS, PERTE DE DONNÉES OU AUTRES INFORMATIONS, INTERRUPTION DE SERVICE, BLESSURES PERSONNELLES, PERTE DE CONFIDENTIALITÉ DÉCOULANT DE OU EN RELATION DE QUELQUE MANIÈRE QUE CE SOIT AVEC L'UTILISATION OU L'INCAPACITÉ À UTILISER LE SERVICE, LOGICIEL TIERS ET/OU MATÉRIEL TIERS UTILISÉS AVEC LE SERVICE, OU D'UNE AUTRE MANIÈRE EN LIEN AVEC TOUTE DISPOSITION DE CES TERMES).\u003c/p\u003e\n\n\u003cp\u003eLa responsabilité totale de l'Entreprise en vertu de cet accord ne dépassera pas le plus élevé des montants suivants : (a) le montant total payé par Vous pour le Service au cours des 12 mois précédant la réclamation ; ou (b) 20,00 $ (vingt dollars).\u003c/p\u003e\n\n\u003ch2\u003eIndemnisation\u003c/h2\u003e\n\n\u003cp\u003eVous acceptez d'indemniser, de défendre et de dégager l'Entreprise, ses affiliés, directeurs, employés, agents, licenciés et fournisseurs de toute réclamation, responsabilité, dommage, jugement, coût et dépense (y compris les frais raisonnables d'avocat) découlant ou liés à : (a) votre utilisation du Service ; (b) toute violation de ces Conditions par vous ; (c) tout contenu que vous publiez ou transmettez par l'intermédiaire du Service ; (d) votre violation de toute loi, règle ou réglementation applicable ; ou (e) votre violation des droits de tout tiers.\u003c/p\u003e\n\n\u003ch2\u003eAvis de Non-Garantie\u003c/h2\u003e\n\n\u003cp\u003eLE SERVICE EST FOURNI \"EN L'ÉTAT\" ET \"SELON LA DISPONIBILITÉ\" SANS GARANTIES D'AUCUNE SORTE, EXPRESSES OU IMPLICITES, Y COMPRIS, MAIS SANS S'Y LIMITER, AUX GARANTIES IMPLICITES DE QUALITÉ MARCHANDE, D'ADAPTATION À UN USAGE PARTICULIER ET DE NON-VIOLATION.\u003c/p\u003e\n\n\u003cp\u003eL'ENTREPRISE NE GARANTIT PAS QUE : (A) LE SERVICE RÉPONDRA À VOS EXIGENCES ; (B) LE SERVICE SERA ININTERROMPU, OPÉRATIONNEL, SÉCURISÉ OU SANS ERREURS ; (C) LES RÉSULTATS OBTENUS DE L'UTILISATION DU SERVICE SERONT EXACTS OU FIABLES ; OU (D) LA QUALITÉ DE TOUT PRODUIT, SERVICE, INFORMATION OU AUTRE MATÉRIAU OBTENU PAR LE BIAIS DU SERVICE RÉPONDRA À VOS ATTENTES.\u003c/p\u003e\n\n\u003ch2\u003eAcceptation par l'utilisation\u003c/h2\u003e\n\n\u003cp\u003eEN ACCÉDANT, TÉLÉCHARGER, INSTALLANT OU UTILISANT LE SERVICE, VOUS RECONNAISSEZ AVOIR LU, COMPRIS ET ACCEPTE D'ÊTRE LIÉ PAR CES CONDITIONS. SI VOUS NE CONSENTEZ PAS À CES CONDITIONS, NE PAS ACCÉDER NI UTILISER LE SERVICE.\u003c/p\u003e\n\n\u003cp\u003eL'utilisation continue du Service après toute modification de ces Conditions constitue votre acceptation de ces modifications.\u003c/p\u003e\n\n\u003ch2\u003eDroit Applicable et Juridiction\u003c/h2\u003e\n\n\u003cp\u003eCes Conditions sont régies et interprétées conformément aux lois de la République Fédérative du Brésil, sans égard à ses dispositions sur les conflits de lois.\u003c/p\u003e\n\n\u003cp\u003eToute dispute découlant de ou liée à ces Conditions sera soumise à la compétence exclusive des tribunaux de la ville de São Paulo, État de São Paulo, Brésil, et les parties renoncent irrévocablement à toute objection à la juridiction de ces tribunaux.\u003c/p\u003e\n\n\u003ch2\u003eAssomption de Risque\u003c/h2\u003e\n\n\u003cp\u003eVOUS ASSUMEZ LA RESPONSABILITÉ ET LE RISQUE ENTIERS EN CE QUI CONCERNE VOTRE UTILISATION DU SERVICE. LE SERVICE EST FOURNI \"EN L'ÉTAT\" SANS GARANTIES D'AUCUNE SORTE. L'ENTREPRISE NE PEUT EN AUCUN CAS ÊTRE TENUE RESPONSABLE DE TOUS DOMMAGES RÉSULTANT DE L'UTILISATION OU DE L'INCAPACITÉ À UTILISER LE SERVICE, Y COMPRIS LES DOMMAGES CAUSÉS PAR DES MALICIELS, VIRUS OU TOUT PROGRAMME INFORMATIQUE INCORRECT OU INCOMPLET.\u003c/p\u003e\n\n\u003ch2\u003eConformité LGPD\u003c/h2\u003e\n\n\u003cp\u003eCe document est conforme à la Loi Générale sur la Protection des Données du Brésil (LGPD - Loi n° 13.709/2018) et ses mises à jour, notamment :\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eRésolution CD/ANPD n° 19/2024\u003c/strong\u003e : Règles pour le transfert international de données personnelles.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotification d'Incidents\u003c/strong\u003e : Délai de 3 (trois) jours ouvrables pour notifier l'ANPD et les personnes concernées.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDroits des Personnes Concernées\u003c/strong\u003e : Accès, rectification, portabilité, suppression et révocation du consentement.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDélégué à la Protection des Données (DPO)\u003c/strong\u003e : Coordonnées publiquement disponibles.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePénalités\u003c/strong\u003e : Jusqu'à 2 % du chiffre d'affaires annuel au Brésil ou 50 millions de BRL par violation.\u003c/li\u003e\n\u003c/ul\u003e","label":"Retour et Remboursement","languageLabel":"Français"},{"documentType":"privacy_policy","language":"FR","content":"\u003ch2\u003ePolitique de Confidentialité\u003c/h2\u003e\n\n\u003cp\u003eDernière mise à jour : 20 janvier 2026\u003c/p\u003e\n\n\u003cp\u003eCette Politique de Confidentialité décrit nos politiques et procédures concernant la collecte, l'utilisation et la divulgation de vos informations lorsque vous utilisez le Service et informe sur vos droits en matière de confidentialité ainsi que sur la manière dont la loi vous protège.\u003c/p\u003e\n\n\u003cp\u003eNous utilisons vos données personnelles pour fournir et améliorer le Service. En utilisant le Service, vous consentez à la collecte et à l'utilisation d'informations conformément à cette Politique de Confidentialité.\u003c/p\u003e\n\n\u003ch2\u003eInterprétation et Définitions\u003c/h2\u003e\n\n\u003ch3\u003eInterprétation\u003c/h3\u003e\n\n\u003cp\u003eLes mots dont la première lettre est en majuscule ont des significations définies dans les conditions suivantes. Les définitions suivantes doivent avoir la même signification, qu'elles apparaissent au singulier ou au pluriel.\u003c/p\u003e\n\n\u003ch3\u003eDéfinitions\u003c/h3\u003e\n\n\u003cp\u003eAux fins de cette Politique de Confidentialité :\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eCompte\u003c/strong\u003e désigne un compte unique créé pour vous permettre d'accéder à notre Service ou à certaines parties de notre Service.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEntreprise\u003c/strong\u003e (appelée \"l'Entreprise\", \"Nous\", \"Nos\" ou \"Notre\" dans cette Politique de Confidentialité) fait référence à MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICAÇÃO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e désignent de petits fichiers qui sont placés sur votre ordinateur, appareil mobile ou tout autre appareil par un site Web, contenant les détails de votre historique de navigation sur ce site entre ses diverses utilisations.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePays\u003c/strong\u003e fait référence à : Brésil.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDispositif\u003c/strong\u003e désigne tout appareil qui peut accéder au Service, tel qu'un ordinateur, un téléphone mobile ou une tablette numérique.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDonnées Personnelles\u003c/strong\u003e désigne toute information se rapportant à une personne physique identifiée ou identifiable.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eService\u003c/strong\u003e désigne l'Application ou le Site, ou les deux.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePrestataire de Services\u003c/strong\u003e désigne toute personne physique ou morale qui traite les données au nom de l'Entreprise.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDonnées de Utilisation\u003c/strong\u003e désigne les données collectées automatiquement, générées par l'utilisation du Service ou par l'infrastructure même du Service.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e désigne RENDERWEAR, accessible à partir de \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003enotre page de contact\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVous\u003c/strong\u003e désigne l'individu accédant ou utilisant le Service, ou la société ou toute autre entité juridique au nom de laquelle cet individu accède ou utilise le Service, le cas échéant.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eCollecte et Utilisation de Vos Données Personnelles\u003c/h2\u003e\n\n\u003ch3\u003eTypes de Données Collectées\u003c/h3\u003e\n\n\u003ch4\u003eDonnées Personnelles\u003c/h4\u003e\n\n\u003cp\u003eLors de l'utilisation de notre Service, nous pouvons vous demander de nous fournir certaines informations personnelles susceptibles d'être utilisées pour vous contacter ou vous identifier. Les informations personnelles peuvent inclure, sans s'y limiter :\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eAdresse e-mail\u003c/li\u003e\n    \u003cli\u003eNom et prénom\u003c/li\u003e\n    \u003cli\u003eNuméro de téléphone\u003c/li\u003e\n    \u003cli\u003eAdresse, État, Province, Code Postal, Ville\u003c/li\u003e\n    \u003cli\u003eDonnées de Utilisation\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch4\u003eDonnées de Utilisation\u003c/h4\u003e\n\n\u003cp\u003eLes Données de Utilisation sont collectées automatiquement lors de l'utilisation du Service.\u003c/p\u003e\n\n\u003cp\u003eLes Données de Utilisation peuvent inclure des informations telles que l'adresse IP de votre Dispositif (par exemple, adresse IP), type de navigateur, version du navigateur, les pages de notre Service que vous visitez, l'heure et la date de votre visite, le temps passé sur ces pages, des identifiants uniques de dispositifs et d'autres données de diagnostic.\u003c/p\u003e\n\n\u003ch3\u003eUtilisation de Vos Données Personnelles\u003c/h3\u003e\n\n\u003cp\u003eL'Entreprise peut utiliser les Données Personnelles pour les finalités suivantes :\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eFournir et maintenir notre Service\u003c/strong\u003e, y compris surveiller l'utilisation de notre Service.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eGérer votre Compte\u003c/strong\u003e : pour gérer votre enregistrement en tant qu'utilisateur du Service.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eExécution d'un contrat\u003c/strong\u003e : le développement, la conformité et l'exécution du contrat d'achat des produits, articles ou services que vous avez acquis.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePour vous contacter\u003c/strong\u003e : Pour vous contacter par e-mail, appels téléphoniques, SMS ou d'autres formes de communication électronique équivalente.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eGérer vos demandes\u003c/strong\u003e : Pour répondre et gérer vos demandes adressées à nous.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eConservation de Vos Données Personnelles\u003c/h3\u003e\n\n\u003cp\u003eL'Entreprise conservera vos Données Personnelles uniquement le temps nécessaire aux fins énoncées dans cette Politique de Confidentialité. Nous conserverons et utiliserons vos Données Personnelles dans la mesure nécessaire pour respecter nos obligations légales.\u003c/p\u003e\n\n\u003ch3\u003eTransfert de Vos Données Personnelles\u003c/h3\u003e\n\n\u003cp\u003eVos informations, y compris les Données Personnelles, sont traitées dans les bureaux opérationnels de l'Entreprise et dans d'autres endroits où les parties impliquées dans le traitement sont situées. Cela signifie que ces informations peuvent être transférées vers — et conservées sur — des ordinateurs situés en dehors de votre état, province, pays ou autre juridiction gouvernementale où les lois sur la protection des données peuvent différer de celles de votre juridiction.\u003c/p\u003e\n\n\u003cp\u003eConformément à la LGPD et à la Résolution CD/ANPD n° 19/2024, tout transfert international de données personnelles sera effectué par le biais de Clauses Contractuelles Standards approuvées par l'ANPD ou d'autres mécanismes légalement valables.\u003c/p\u003e\n\n\u003ch3\u003eDivulgation de Vos Données Personnelles\u003c/h3\u003e\n\n\u003cp\u003eL'Entreprise peut divulguer vos Données Personnelles dans les circonstances suivantes :\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eConformité légale : si cela est requis par la loi ou en réponse à des demandes valides des autorités publiques.\u003c/li\u003e\n    \u003cli\u003eProtection de droits : pour protéger et défendre les droits ou la propriété de l'Entreprise.\u003c/li\u003e\n    \u003cli\u003ePrévention de préjudices : pour prévenir toute préjudice potentiel à la sécurité des utilisateurs ou d'autres personnes.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eSécurité de Vos Données Personnelles\u003c/h3\u003e\n\n\u003cp\u003eLa sécurité de vos Données Personnelles est importante pour nous, mais veuillez garder à l'esprit qu'aucun mode de transmission sur Internet ou méthode de stockage électronique n'est 100 % sûr. Bien que nous nous efforcions d'utiliser des moyens commercialement acceptables pour protéger vos Données Personnelles, nous ne pouvons garantir leur sécurité absolue.\u003c/p\u003e\n\n\u003ch2\u003eDroits de Protection de Données (LGPD)\u003c/h2\u003e\n\n\u003cp\u003eConformément à la Loi Générale sur la Protection des Données (LGPD - Loi n° 13.709/2018), vous avez les droits suivants :\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eConfirmation et Accès\u003c/strong\u003e : confirmer l'existence d'un traitement et accéder à vos données personnelles.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCorrection\u003c/strong\u003e : demander la correction de données incomplètes, inexactes ou obsolètes.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAnonimisation, Blocage ou Élimination\u003c/strong\u003e : demander l'anonimisation, le blocage ou l'élimination de données jugées inutiles, excessives ou traitées de manière non conforme.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePortabilité\u003c/strong\u003e : demander la portabilité des données à un autre fournisseur de services.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eÉlimination\u003c/strong\u003e : demander l'élimination des données personnelles traitées avec le consentement du titulaire.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eInformation\u003c/strong\u003e : être informé des entités publiques et privées avec lesquelles nous partageons vos données.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eRévocation du Consentement\u003c/strong\u003e : pouvoir révoquer le consentement à tout moment.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eNotificiation d'Incidents de Sécurité\u003c/h3\u003e\n\n\u003cp\u003eConformément à la LGPD et aux mises à jour de 2024, nous notifierons l'Autorité Nationale de Protection des Données (ANPD) et les titulaires concernés dans les 3 (trois) jours ouvrables suivant la découverte de tout incident de sécurité pouvant présenter un risque ou un dommage important aux titulaires.\u003c/p\u003e\n\n\u003ch3\u003eEntraînement de Protection des Données (DPO)\u003c/h3\u003e\n\n\u003cp\u003ePour exercer vos droits ou pour toute question concernant le traitement de vos données personnelles, veuillez contacter notre Délégué à la Protection des Données :\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eE-mail\u003c/strong\u003e : info@incodetech.com.br\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eLiabilité Limitée\u003c/h2\u003e\n\n\u003cp\u003eEN AUCUN CAS, DANS LA MESURE MAXIMALE AUTORISÉE PAR LA LOI APPLICABLE, L'ENTREPRISE OU SES FOURNISSEURS NE PEUVENT ÊTRE TENUS RESPONSABLES DES DOMMAGES SPÉCIAUX, ACCESSOIRES, INDIRECTS OU CONSÉCUTIFS DE QUELQUE NATURE QUE CE SOIT (Y COMPRIS, MAIS SANS S'Y LIMITER, AUX DOMMAGES POUR PERTE DE PROFITS, PERTE DE DONNÉES OU D'AUTRES INFORMATIONS, INTERRUPTIONS D'ACTIVITÉ, BLESSURES PERSONNELLES, PERTE DE CONFIDENTIALITÉ DÉCOULANT OU D'UNE MANIÈRE LIÉE À L'UTILISATION OU L'IMPOSSIBILITÉ D'UTILISER LE SERVICE, LOGICIEL TIERS ET/OU MATÉRIEL TIERS UTILISÉ AVEC LE SERVICE, OU AUTREMENT EN RELATION AVEC QUELQUE DISPOSITION DES TERMES).\u003c/p\u003e\n\n\u003cp\u003eLa responsabilité totale de l'Entreprise en vertu de cet accord ne dépassera pas le plus élevé des suivants : (a) le montant total que vous avez payé pour le Service au cours des 12 mois précédant la réclamation ; ou (b) 20,00 $ (vingt dollars).\u003c/p\u003e\n\n\u003ch2\u003eIndemnisation\u003c/h2\u003e\n\n\u003cp\u003eVous acceptez d'indemniser, de défendre et de tenir à l'écart l'Entreprise, ses affiliés, directeurs, employés, agents, concédants de licence et fournisseurs contre toutes réclamations, responsabilités, dommages, jugements, coûts et dépenses (y compris des honoraires d'avocats raisonnables) découlant ou liés à : (a) votre utilisation du Service ; (b) toute violation de ces Conditions par vous ; (c) tout contenu que vous publiez ou transmettez via le Service ; (d) votre violation de toute loi, règle ou règlement applicable ; ou (e) votre violation des droits de tout tiers.\u003c/p\u003e\n\n\u003ch2\u003eClause de Non-Garantie\u003c/h2\u003e\n\n\u003cp\u003eLE SERVICE EST FOURNI \"EN L'ÉTAT\" ET \"SELON DISPONIBILITÉ\" SANS GARANTIES DE QUELQUE NATURE QUE CE SOIT, EXPRESSE OU IMPLICITE, Y COMPRIS, MAIS SANS S'Y LIMITER, DES GARANTIES IMPLICITES DE QUALITÉ MARCHANDE, D'ADAPTATION À UN USAGE PARTICULIER ET DE NON-VIOLATION.\u003c/p\u003e\n\n\u003cp\u003eL'ENTREPRISE NE GARANTIT PAS QUE : (A) LE SERVICE RÉPONDRA À VOS EXIGENCES ; (B) LE SERVICE SERA ININTERROMPU, PROMPT, SÉCURISÉ OU SANS ERREUR ; (C) LES RÉSULTATS OBTENUS PAR L'UTILISATION DU SERVICE SERONT EXACTS OU FIABLES ; OU (D) LA QUALITÉ DES PRODUITS, SERVICES, INFORMATIONS OU AUTRES MATÉRIAUX OBTENUS PAR LE SERVICE RÉPONDRA À VOS ATTENTES.\u003c/p\u003e\n\n\u003ch2\u003eAcceptation par l'Utilisation\u003c/h2\u003e\n\n\u003cp\u003eEN ACCÉDANT, TÉLÉCHARGEANT, INSTALLANT OU UTILISANT LE SERVICE, VOUS RECONNAISSEZ AVOIR LU, COMPRIS ET ACCEPTEZ D'ÊTRE LIÉ PAR CES CONDITIONS. SI VOUS N'ACCEPTEZ PAS CES CONDITIONS, VEUILLEZ NE PAS ACCÉDER OU UTILISER LE SERVICE.\u003c/p\u003e\n\n\u003cp\u003eLa poursuite de l'utilisation du Service après toute modification de ces Conditions constitue votre acceptation de telles modifications.\u003c/p\u003e\n\n\u003ch2\u003eDroit Applicable et Juridiction\u003c/h2\u003e\n\n\u003cp\u003eCes Conditions seront régies et interprétées conformément aux lois de la République Fédérative du Brésil, sans tenir compte de ses dispositions en matière de conflit de lois.\u003c/p\u003e\n\n\u003cp\u003eToute dispute découlant ou liée à ces Conditions sera soumise à la juridiction exclusive des tribunaux de la ville de São Paulo, État de São Paulo, Brésil, et les parties renoncent irrévocablement à toute objection à la juridiction de ces tribunaux.\u003c/p\u003e\n\n\u003ch2\u003eModifications à cette Politique de Confidentialité\u003c/h2\u003e\n\n\u003cp\u003eNous pouvons mettre à jour notre Politique de Confidentialité de temps à autre. Nous vous informerons de toute modification en publiant la nouvelle Politique de Confidentialité sur cette page.\u003c/p\u003e\n\n\u003cp\u003eNous vous recommandons de consulter régulièrement cette Politique de Confidentialité pour d'éventuelles modifications.\u003c/p\u003e\n\n\u003ch2\u003eContact\u003c/h2\u003e\n\n\u003cp\u003eSi vous avez des questions concernant cette Politique de Confidentialité, vous pouvez nous contacter :\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eE-mail\u003c/strong\u003e : info@incodetech.com.br\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEn visitant cette page\u003c/strong\u003e : \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003enotre page de contact\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","label":"Politique de Confidentialité","languageLabel":"Français"},{"documentType":"privacy_consent","language":"FR","content":"\u003ch2\u003ePolitique de Cookies et Consentement de Confidentialité\u003c/h2\u003e\n\n\u003cp\u003eDernière mise à jour : 20 janvier 2026\u003c/p\u003e\n\n\u003cp\u003eCette politique de cookies explique ce que sont les cookies et comment nous les utilisons. Vous devez lire cette politique pour comprendre quels types de cookies nous utilisons ou les informations que nous collectons en utilisant des cookies et comment ces informations sont utilisées.\u003c/p\u003e\n\n\u003cp\u003eLes cookies ne contiennent généralement pas d'informations permettant d'identifier personnellement un utilisateur, mais les informations personnelles que nous stockons à votre sujet peuvent être liées aux informations stockées et obtenues dans les cookies. Pour plus d'informations sur la manière dont nous utilisons, stockons et protégeons vos données personnelles, veuillez consulter notre Politique de Confidentialité.\u003c/p\u003e\n\n\u003cp\u003eNous ne stockons pas d'informations personnelles sensibles, telles que des adresses postales, des mots de passe de comptes, etc., dans les cookies que nous utilisons.\u003c/p\u003e\n\n\u003ch2\u003eInterprétation et Définitions\u003c/h2\u003e\n\n\u003ch3\u003eInterprétation\u003c/h3\u003e\n\u003cp\u003eLes mots dont la première lettre est en majuscule ont des significations définies dans les conditions suivantes. Les définitions suivantes doivent avoir le même sens, qu'elles apparaissent au singulier ou au pluriel.\u003c/p\u003e\n\n\u003ch3\u003eDéfinitions\u003c/h3\u003e\n\u003cp\u003eAux fins de cette Politique de Cookies :\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eEntreprise\u003c/strong\u003e (référencée comme \"l’Entreprise\", \"Nous\", \"Nos\" ou \"Ours\" dans cette Politique de Cookies) désigne MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e désigne de petits fichiers qui sont placés sur votre ordinateur, appareil mobile ou tout autre dispositif par un site web, contenant des détails de votre historique de navigation sur ce site entre vos diverses utilisations.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e désigne RENDERWEAR, accessible à \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVous\u003c/strong\u003e désigne l'individu qui accède ou utilise le site, ou une entreprise, ou toute personne morale au nom de laquelle cet individu accède ou utilise le site, le cas échéant.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eLe Usage des Cookies\u003c/h2\u003e\n\n\u003ch3\u003eTypes de Cookies Utilisés\u003c/h3\u003e\n\u003cp\u003eLes cookies peuvent être \"Persistants\" ou \"de Session\". Les cookies persistants restent sur votre ordinateur personnel ou appareil mobile lorsque vous êtes hors ligne, tandis que les cookies de session sont supprimés dès que vous fermez votre navigateur.\u003c/p\u003e\n\u003cp\u003eNous utilisons des cookies de session et persistants pour les objectifs définis ci-dessous :\u003c/p\u003e\n\n\u003ch4\u003eCookies Essentiels\u003c/h4\u003e\n\u003cstrong\u003eType : Cookies de session\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eGéré par : Nous\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eObjectif :\u003c/strong\u003e Ces cookies sont essentiels pour vous fournir les services disponibles via le site et permettre que vous puissiez utiliser certaines de ses fonctionnalités. Ils aident à authentifier les utilisateurs et à prévenir l'utilisation frauduleuse des comptes utilisateurs. Sans ces cookies, les services que vous avez demandés ne peuvent pas être fournis et nous utilisons uniquement ces cookies pour vous fournir ces services.\u003c/p\u003e\n\n\u003ch4\u003eCookies d'Acceptation de Politique de Cookies\u003c/h4\u003e\n\u003cstrong\u003eType : Cookies persistants\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eGéré par : Nous\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eObjectif :\u003c/strong\u003e Ces cookies identifient si les utilisateurs ont accepté l'utilisation de cookies sur le site.\u003c/strong\u003e\n\n\u003ch4\u003eCookies de Fonctionnalité\u003c/h4\u003e\n\u003cstrong\u003eType : Cookies persistants\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eGéré par : Nous\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eObjectif :\u003c/strong\u003e Ces cookies nous permettent de nous souvenir des choix que vous faites lorsque vous utilisez le site, comme retenir vos détails de connexion ou vos préférences linguistiques. L'objectif de ces cookies est de vous offrir une expérience plus personnalisée et d'éviter que vous ayez à ressaisir vos préférences chaque fois que vous utilisez le site.\u003c/strong\u003e\n\n\u003ch4\u003eCookies de Suivi et de Performance\u003c/h4\u003e\n\u003cstrong\u003eType : Cookies persistants\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eGéré par : Tiers\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eObjectif :\u003c/strong\u003e Ces cookies sont utilisés pour suivre les informations concernant le trafic vers le site et comment les utilisateurs l’utilisent. Les informations collectées via ces cookies peuvent vous identifier directement ou indirectement en tant que visiteur individuel.\u003c/strong\u003e\n\n\u003ch4\u003eCookies de Publicité et de Ciblage\u003c/h4\u003e\n\u003cstrong\u003eType : Cookies persistants\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eGéré par : Tiers\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eObjectif :\u003c/strong\u003e Ces cookies suivent vos habitudes de navigation afin de nous permettre d'afficher des publicités qui seront probablement de votre intérêt.\u003c/strong\u003e\n\n\u003ch2\u003eVos Choix en matière de Cookies\u003c/h2\u003e\n\u003cp\u003eSi vous préférez éviter l'utilisation de cookies sur le site, vous devez d'abord désactiver l'utilisation de cookies dans votre navigateur, puis supprimer les cookies enregistrés dans votre navigateur associés à ce site. Vous pouvez utiliser cette option pour empêcher l'utilisation de cookies à tout moment.\u003c/p\u003e\n\u003cp\u003eSi vous n'acceptez pas nos cookies, vous pourriez rencontrer certains inconvénients dans l'utilisation du site et certaines fonctionnalités pourraient ne pas fonctionner correctement.\u003c/p\u003e\n\n\u003ch3\u003eComment Désactiver les Cookies\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eChrome :\u003c/strong\u003e \u003ca href=\"https://support.google.com/accounts/answer/32050\"\u003ehttps://support.google.com/accounts/answer/32050\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eInternet Explorer :\u003c/strong\u003e \u003ca href=\"http://support.microsoft.com/kb/278835\"\u003ehttp://support.microsoft.com/kb/278835\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eFirefox :\u003c/strong\u003e \u003ca href=\"https://support.mozilla.org/en-US/kb/delete-cookies-remove-info-websites-stored\"\u003ehttps://support.mozilla.org/en-US/kb/delete-cookies-remove-info-websites-stored\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSafari :\u003c/strong\u003e \u003ca href=\"https://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac\"\u003ehttps://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eContenu Incorporé\u003c/h2\u003e\n\u003cp\u003eLe Service peut inclure du contenu incorporé (par exemple, des vidéos, des images, des articles, etc.). Le contenu incorporé d'autres sites se comporte exactement comme si le visiteur avait visité l'autre site.\u003c/p\u003e\n\u003cp\u003eCes sites peuvent collecter des données à votre sujet, utiliser des cookies, incorporer un suivi supplémentaire de tiers et surveiller votre interaction avec ce contenu incorporé, y compris suivre votre interaction avec le contenu incorporé si vous avez un compte et êtes connecté à ce site.\u003c/p\u003e\n\n\u003ch2\u003eConformité avec la LGPD\u003c/h2\u003e\n\u003cp\u003eCe document est conforme à la Loi Générale sur la Protection des Données du Brésil (LGPD - Loi n° 13.709/2018) et ses mises à jour, notamment :\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eRésolution CD/ANPD n° 19/2024\u003c/strong\u003e : Règles pour le transfert international de données personnelles.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotification d'Incidents :\u003c/strong\u003e Délai de 3 (trois) jours ouvrables pour notifier l'ANPD et les personnes concernées.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDroits des Personnes Concernées :\u003c/strong\u003e Accès, rectification, portabilité, suppression et révocation du consentement.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDélégué à la Protection des Données (DPO) :\u003c/strong\u003e Coordonnées publiquement disponibles.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eVous pouvez gérer vos préférences de cookies à tout moment et vous avez le droit de demander l'accès, la rectification, la portabilité ou la suppression de vos données personnelles, ainsi que de retirer votre consentement à tout moment.\u003c/p\u003e\n\n\u003ch2\u003eEntre en Contact avec Nous\u003c/h2\u003e\n\u003cp\u003eSi vous avez des questions concernant cette politique de cookies, vous pouvez nous contacter :\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eE-mail :\u003c/strong\u003e \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVisitez notre page de contact :\u003c/strong\u003e \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps:/ cumentType":"terms_of_service","language":"FR","content":"\u003ch2\u003eConditions Générales de Service\u003c/h2\u003e\n\n\u003cp\u003eDernière mise à jour : 20 janvier 2026\u003c/p\u003e\n\n\u003cp\u003eVeuillez lire attentivement ces Conditions Générales de Service (\"Conditions\") avant d'utiliser le service RENDERWEAR exploité par INCODE TECH.\u003c/p\u003e\n\n\u003ch2\u003eInterprétation et Définitions\u003c/h2\u003e\n\n\u003ch3\u003eInterprétation\u003c/h3\u003e\n\u003cp\u003eLes mots dont la première lettre est en majuscule ont les significations définies ci-dessous.\u003c/p\u003e\n\n\u003ch3\u003eDéfinitions\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eEntreprise\u003c/strong\u003e fait référence à MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eService\u003c/strong\u003e fait référence à RENDERWEAR.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eVous\u003c/strong\u003e désigne l'individu accédant au Service.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCompte\u003c/strong\u003e désigne un compte unique créé pour vous permettre d'accéder à notre Service.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAbonnement\u003c/strong\u003e désigne les services ou l'accès au Service offert par abonnement.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eDescription du Service\u003c/h2\u003e\n\n\u003cp\u003eRENDERWEAR est un service qui permet aux utilisateurs de créer et de gérer des contenus graphiques. Le Service peut inclure des fonctionnalités gratuites et payantes.\u003c/p\u003e\n\n\u003ch2\u003eComptes de Utilisateur\u003c/h2\u003e\n\n\u003cp\u003ePour accéder à certains fonctionnalités du Service, vous devez créer un compte. Vous êtes responsable de la confidentialité de votre compte et de votre mot de passe.\u003c/p\u003e\n\n\u003cp\u003eVous acceptez d'assumer la responsabilité de toutes les activités qui se déroulent sous votre compte. Vous devez nous informer immédiatement de toute utilisation non autorisée de votre compte.\u003c/p\u003e\n\n\u003ch2\u003eTermes de Paiement\u003c/h2\u003e\n\n\u003ch3\u003ePériode d'Abonnement\u003c/h3\u003e\n\u003cp\u003eLe Service ou certaines parties du Service ne sont disponibles qu'avec un Abonnement payant. Vous serez facturé à l'avance de manière récurrente (mensuellement ou annuellement), en fonction du type de plan d'abonnement que vous choisissez.\u003c/p\u003e\n\n\u003cp\u003eÀ la fin de chaque période, votre Abonnement sera automatiquement renouvelé dans les mêmes conditions, sauf si vous l'annulez ou si l'Entreprise l'annule.\u003c/p\u003e\n\n\u003ch3\u003eAnnulation d'Abonnement\u003c/h3\u003e\n\u003cp\u003eVous pouvez annuler le renouvellement de votre Abonnement via les paramètres de votre Compte ou en nous contactant. Vous ne recevrez pas de remboursement pour les frais déjà payés pour la période d'abonnement en cours et vous pourrez accéder au Service jusqu'à la fin de la période en cours.\u003c/p\u003e\n\n\u003ch3\u003eChangements de Prix\u003c/h3\u003e\n\u003cp\u003eL'Entreprise peut, à sa seule discrétion, modifier les prix d'abonnement à tout moment. Tout changement prendra effet à la fin de la période d'abonnement en cours.\u003c/p\u003e\n\n\u003ch3\u003eRemboursements\u003c/h3\u003e\n\u003cp\u003eSauf lorsque requis par la loi, les frais d'abonnement payés ne sont pas remboursables. Les remboursements peuvent être envisagés au cas par cas à la seule discrétion de l'Entreprise.\u003c/p\u003e\n\n\u003ch3\u003eEssai Gratuit\u003c/h3\u003e\n\u003cp\u003eL'Entreprise peut offrir un essai gratuit pendant une durée limitée. À la fin de la période d'essai, vous serez automatiquement facturé des frais d'abonnement, sauf si vous annulez avant la fin de la période d'essai.\u003c/p\u003e\n\n\u003ch2\u003eDisponibilité du Service\u003c/h2\u003e\n\n\u003cp\u003eL'Entreprise s'efforce de maintenir le Service disponible 24 heures sur 24, 7 jours sur 7. Cependant, l'Entreprise ne garantit pas que le Service sera disponible en continu ou exempt d'erreurs.\u003c/p\u003e\n\n\u003cp\u003eL'Entreprise se réserve le droit de modifier, suspendre ou interrompre le Service, temporairement ou définitivement, à tout moment, avec ou sans préavis.\u003c/p\u003e\n\n\u003ch2\u003ePropriété Intellectuelle\u003c/h2\u003e\n\n\u003cp\u003eTout le contenu inclus dans le Service, tel que texte, graphiques, logos, icônes, images, clips audio, téléchargements numériques et logiciels, appartient à l'Entreprise ou à ses fournisseurs de contenu et est protégé par les lois sur les droits d'auteur brésiliens et internationaux.\u003c/p\u003e\n\n\u003ch2\u003eLimitation de Responsabilité\u003c/h2\u003e\n\n\u003cp\u003e\u003cstrong\u003eL'ENTREPRISE NE SAURAIT ÊTRE TENUE RESPONSABLE DE QUELQUE DOMMAGE QUE CE SOIT, Y COMPRIS MAIS SANS S'Y LIMITER, LES DOMMAGES SPÉCIAUX, INCIDENTELS, INDIRECTS OU CONSÉCUTIFS, RÉSULTANT DE l'UTILISATION DE OU DE L'INCAPACITÉ À UTILISER LE SERVICE, Y COMPRIS, SANS LIMITATION, LA PERTE DE PROFITS, DE DONNÉES OU D'AUTRES INFORMATIONS, L'INTERRUPTION D'ACTIVITÉ, OU LA VIOLATION DE LA VIE PRIVÉE LIÉE DE QUELQUE MANIÈRE QUE CE SOIT À L'UTILISATION DU SERVICE.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eLa responsabilité totale de l'Entreprise en vertu de ces Conditions ne pourra en aucun cas dépasser le montant total que vous avez payé pour le Service au cours des 12 mois précédant la réclamation ou 20,00 $ (vingt dollars), selon le montant le plus élevé.\u003c/p\u003e\n\n\u003ch2\u003eIndemnisation\u003c/h2\u003e\n\n\u003cp\u003eVous acceptez d'indemniser, de défendre et de dégager l'Entreprise, ses sociétés affiliées, directeurs, employés, agents, concédants de licence et fournisseurs de toute et contre toute réclamation, responsabilité, dommage, jugement, coût et dépense (y compris les honoraires raisonnables d'avocat) découlant de ou liés à : (a) votre utilisation du Service; (b) toute violation de ces Conditions par vous; (c) tout contenu que vous publiez ou transmettez par le Service; (d) votre violation de toute loi, règle ou réglementation applicable; ou (e) votre violation des droits de tout tiers.\u003c/p\u003e\n\n\u003ch2\u003eModifications du Service\u003c/h2\u003e\n\n\u003cp\u003eL'Entreprise se réserve le droit de retirer ou de modifier notre Service, ainsi que tout service ou matériel que nous fournissons par l'intermédiaire du Service, à sa seule discrétion, sans préavis.\u003c/p\u003e\n\n\u003ch2\u003eRésolution de Disputes\u003c/h2\u003e\n\n\u003cp\u003eSi vous avez une dispute avec l'Entreprise, vous acceptez d'essayer d'abord de la résoudre informellement en contactant \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch2\u003eLois Applicables\u003c/h2\u003e\n\n\u003cp\u003eCes Conditions seront régies et interprétées conformément aux lois de la République Fédérative du Brésil, sans égard à ses dispositions en matière de conflit de lois.\u003c/p\u003e\n\n\u003ch2\u003eContact\u003c/h2\u003e\n\n\u003cp\u003eSi vous avez des questions concernant ces Conditions Générales de Service, veuillez nous contacter :\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eEmail : \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eEn visitant cette page : \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eContactez-nous\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eConformité LGPD\u003c/h2\u003e\n\n\u003cp\u003eCe document est conforme à la Loi Générale sur la Protection des Données du Brésil (LGPD - Loi n° 13.709/2018) et ses mises à jour, notamment :\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eRésolution CD/ANPD n° 19/2024 :\u003c/strong\u003e Règles pour le transfert international de données personnelles.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotification d'Incidents :\u003c/strong\u003e Délai de 3 (trois) jours ouvrables pour notifier l'ANPD et les personnes concernées.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDroits des Personnes Concernées :\u003c/strong\u003e Accès, rectification, portabilité, suppression et révocation du consentement.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDélégué à la Protection des Données (DPO) :\u003c/strong\u003e Coordonnées publiquement disponibles.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eLa notification d'incidents de données doit être effectuée dans un délai de 3 jours ouvrables, selon la législation applicable. Les transferts internationaux de données doivent utiliser des clauses contractuelles types approuvées par l'ANPD, conformément à la Résolution CD/ANPD n° 19/2024. Les personnes concernées ont les droits d'accès, de correction, de portabilité, de suppression de leurs données, et de révocation du consentement à tout moment.\u003c/p\u003e\n\n\u003cp\u003eLes pénalités en cas de non-conformité peuvent s’élever à 2 % du chiffre d'affaires annuel du Brésil ou à 50 millions BRL par violation.\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eEN ACCÉDANT, TÉLÉCHARGEANT, INSTALLANT OU UTILISANT LE SERVICE, VOUS RECONNAISSEZ AVOIR LU, COMPRIS ET ACCEPTEZ D'ÊTRE LIÉ PAR CES CONDITIONS. SI VOUS NE LES ACCEPTEZ PAS, VEUILLEZ NE PAS ACCÉDER OU UTILISER LE SERVICE.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eLa poursuite de l'utilisation du Service après toute modification de ces Conditions constitue votre acceptation de ces modifications.\u003c/p\u003e","label":"Conditions de Service","languageLabel":"Français"},{"documentType":"disclaimer","language":"DE","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003eHaftungsausschluss für RENDERWEAR\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003eHaftungsausschluss für RENDERWEAR\u003c/h2\u003e\n    \u003cp\u00 c/p\u003e\n    \n    \u003cp\u003eDas Unternehmen übernimmt keine Verantwortung für Fehler oder Auslassungen im Inhalt des Dienstes.\u003c/p\u003e\n    \n    \u003cp\u003eIN KEINEM FALL IST DAS UNTERNEHMEN FÜR SPEZIELLE, ZUFÄLLIGE, INDIREKTE ODER FOLGESCHÄDEN HAFTBAR, WAS AUCH IMMER (EINSCHLIESSLICH, ABER NICHT BESCHRÄNKT AUF SCHÄDEN FÜR VERLUST VON GEWINNEN, DATEN ODER ANDEREN INFORMATIONEN, FÜR GESCHÄFTSUNTERBRECHUNGEN, FÜR PERSONENSCHÄDEN, VERLUST VON PRIVATSPHÄRE, DIE AUS ODER IN IRGENDEINER WEISE MIT DERNUTZUNG ODER UNMÖGLICHKEIT DER NUTZUNG DES DIENSTES VERBUNDEN SIND, DRITTPARTY-SOFTWARE UND/ODER DRITTPARTY-HARDWARE, DIE MIT DEM DIENST VERWENDET WIRD, ODER ANDERS IN VERBINDUNG MIT EINER BESTIMMUNG DIESER BEDINGUNGEN).\u003c/p\u003e\n    \n    \u003cp\u003eDie Gesamthaftung des Unternehmens aus diesem Vertrag darf den größeren Betrag nicht überschreiten: (a) den Gesamtbetrag, den Sie für den Dienst in den 12 Monaten vor der Anspruchstellung bezahlt haben; oder (b) 20,00 USD (zwanzig Dollar).\u003c/p\u003e\n\n    \u003ch2\u003eHaftungsausschluss für externe Links\u003c/h2\u003e\n    \u003cp\u003eDer Dienst kann Links zu externen Websites enthalten, die nicht von oder in irgendeiner Weise mit dem Unternehmen bereitgestellt oder gewartet werden.\u003c/p\u003e\n    \n    \u003cp\u003eBitte beachten Sie, dass das Unternehmen keine Gewähr für die Richtigkeit, Relevanz, Aktualität oder Vollständigkeit von Informationen auf diesen externen Websites übernimmt.\u003c/p\u003e\n\n    \u003ch2\u003eHaftungsausschluss für Fehler und Auslassungen\u003c/h2\u003e\n    \u003cp\u003eDie im Dienst bereitgestellten Informationen dienen nur zur allgemeinen Orientierung in Angelegenheiten von Interesse. Obwohl das Unternehmen alle Vorkehrungen trifft, um sicherzustellen, dass der Inhalt des Dienstes aktuell und genau ist, können Fehler auftreten. Aufgrund der sich ändernden Natur von Gesetzen, Vorschriften und Bestimmungen können Verzögerungen, Auslassungen oder Ungenauigkeiten in d
