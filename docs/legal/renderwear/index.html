Termos será submetida à jurisdição exclusiva dos tribunais da cidade de São Paulo, Estado de São Paulo, Brasil, e as partes renunciam irrevogavelmente a qualquer objeção à jurisdição de tais tribunais.\u003c/p\u003e\n\n\u003ch2\u003eResolução de Disputas\u003c/h2\u003e\n\n\u003cp\u003eSe você tiver qualquer preocupação ou disputa sobre o Serviço, você concorda em primeiro tentar resolver a disputa informalmente entrando em contato com a Empresa.\u003c/p\u003e\n\n\u003ch2\u003eDisposições Gerais\u003c/h2\u003e\n\n\u003ch3\u003eRenúncia\u003c/h3\u003e\n\n\u003cp\u003eA falha da Empresa em aplicar qualquer direito ou disposição destes Termos não será considerada uma renúncia a esses direitos.\u003c/p\u003e\n\n\u003ch3\u003eDivisibilidade\u003c/h3\u003e\n\n\u003cp\u003eSe qualquer disposição destes Termos for considerada inaplicável ou inválida, tal disposição será alterada e interpretada para atingir os objetivos de tal disposição na maior extensão possível sob a lei aplicável e as disposições restantes continuarão em pleno vigor e efeito.\u003c/p\u003e\n\n\u003ch3\u003eAcordo Integral\u003c/h3\u003e\n\n\u003cp\u003eEstes Termos constituem o acordo integral entre Você e a Empresa com relação ao uso do Serviço e substituem todos os acordos anteriores e contemporâneos.\u003c/p\u003e\n\n\u003ch2\u003eContato\u003c/h2\u003e\n\n\u003cp\u003eSe você tiver alguma dúvida sobre estes Termos e Condições, você pode entrar em contato conosco:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eE-mail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eVisitando esta página: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eConformidade com a LGPD\u003c/h2\u003e\n\n\u003cp\u003eEste documento está em conformidade com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018) e suas atualizações, incluindo:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eResolução CD/ANPD nº 19/2024\u003c/strong\u003e: Regras para transferência internacional de dados pessoais.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotificação de Incidentes\u003c/strong\u003e: Prazo de 3 (três) dias úteis para comunicação à ANPD e aos titulares afetados.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDireitos dos Titulares\u003c/strong\u003e: Acesso, correção, portabilidade, eliminação e revogação de consentimento.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eEncarregado de Proteção de Dados (DPO)\u003c/strong\u003e: Informações de contato disponíveis publicamente.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eVocê tem o direito de acessar, corrigir ou eliminar seus dados pessoais, bem como revogar seu consentimento a qualquer momento. Caso ocorra um incidente de segurança envolvendo seus dados pessoais, sera notificado no prazo de 3 (três) dias úteis.\u003c/p\u003e\n\n\u003cp\u003eA Empresa não transferirá dados pessoais internacionalmente sem o consentimento expresso dos titulares e utilizando cláusulas contratuais padrão aprovadas pela ANPD, conforme a Resolução CD/ANPD nº 19/2024.\u003c/p\u003e\n\n\u003ch2\u003eAssunção de Risco\u003c/h2\u003e\n\n\u003cp\u003e\u003cstrong\u003eVOCÊ ASSUME TOTAL RESPONSABILIDADE E RISCO PELO USO DO SERVIÇO. O SERVIÇO É FORNECIDO \"COMO ESTÁ\" SEM GARANTIAS DE QUALQUER TIPO. A EMPRESA NÃO SERÁ RESPONSÁVEL POR QUAISQUER DANOS RESULTANTES DO USO OU DA INCAPACIDADE DE USO DO SERVIÇO, INCLUINDO DANOS CAUSADOS POR MALWARE, VÍRUS OU QUALQUER PROGRAMA DE COMPUTADOR INCORRETO OU INCOMPLETO.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eA Empresa não será responsável por quaisquer penalidades impostas pela ANPD, que podem chegar a 2% da receita anual do Brasil ou R$ 50 milhões por violação.\u003c/p\u003e\n\n\u003cp\u003eVocê concorda em indenizar, defender e isentar a Empresa, suas afiliadas, diretores, funcionários, agentes, licenciadores e fornecedores de e contra todas e quaisquer reclamações, responsabilidades, danos, julgamentos, custos e despesas (incluindo honorários advocatícios razoáveis) decorrentes de ou relacionados a: (a) seu uso do Serviço; (b) qualquer violação destes Termos por você; (c) qualquer conteúdo que você postar ou transmitir através do Serviço; (d) sua violação de qualquer lei, regra ou regulamento aplicável; ou (e) sua violação dos direitos de terceiros.\u003c/p\u003e","label":"Termos e Condições","languageLabel":"Português"},{"documentType":"return_refund","language":"EN","content":"\u003ch2\u003eReturn and Refund Policy\u003c/h2\u003e\n\n\u003cp\u003eLast updated: January 20, 2026\u003c/p\u003e\n\n\u003cp\u003eThank you for purchasing from RENDERWEAR.\u003c/p\u003e\n\n\u003cp\u003eIf you are not entirely satisfied with your purchase, we are here to help.\u003c/p\u003e\n\n\u003ch3\u003eInterpretation and Definitions\u003c/h3\u003e\n\n\u003ch4\u003eDefinitions\u003c/h4\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eCompany\u003c/strong\u003e refers to MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICAÇÃO VISUAL LTDA., located at ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eGoods\u003c/strong\u003e refers to the items offered for sale in the Service.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eOrders\u003c/strong\u003e means a request from you to purchase Goods from us.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eService\u003c/strong\u003e refers to RENDERWEAR.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eYou\u003c/strong\u003e means the individual accessing or using the Service, or the company or other legal entity on behalf of which such individual is accessing or using the Service.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eYour Eligibility for Refund\u003c/h3\u003e\n\n\u003cp\u003eThe following items are eligible for a refund:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eGoods that are defective or damaged at the time of delivery.\u003c/li\u003e\n    \u003cli\u003eGoods that do not match the description provided.\u003c/li\u003e\n    \u003cli\u003eUnused Goods in their original packaging.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eTo be eligible for a return, your item must be unused and in the same condition that you received it. It must also be in the original packaging.\u003c/p\u003e\n\n\u003ch3\u003eTimeframes for Request\u003c/h3\u003e\n\n\u003cp\u003eYou have 7 (seven) calendar days from the date of receipt of the product to request a return or refund as mandated by the Consumer Protection Code (Law No. 8.078/90).\u003c/p\u003e\n\n\u003cp\u003eFor digital subscriptions, you may cancel and request a refund within 7 days after purchase, provided the service has not been used.\u003c/p\u003e\n\n\u003ch3\u003eRefund Process\u003c/h3\u003e\n\n\u003cp\u003eTo request a refund, follow these steps:\u003c/p\u003e\n\u003col\u003e\n    \u003cli\u003eContact us at \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e with your order number and reason for the refund.\u003c/li\u003e\n    \u003cli\u003eWait for our response with instructions on how to proceed.\u003c/li\u003e\n    \u003cli\u003eIf applicable, return the item as per the instructions provided.\u003c/li\u003e\n    \u003cli\u003eOnce we receive and inspect the item, we will notify you about the approval or rejection of your refund.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003cp\u003eIf approved, your refund will be processed, and a credit will automatically be applied to your original payment method within 14 business days.\u003c/p\u003e\n\n\u003ch3\u003eNon-Refundable Items\u003c/h3\u003e\n\n\u003cp\u003eThe following items are not eligible for refund:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eDigital products that have been downloaded or accessed.\u003c/li\u003e\n    \u003cli\u003eSubscriptions after the 7-day period if the service has already been used.\u003c/li\u003e\n    \u003cli\u003eCustom-made products made to order.\u003c/li\u003e\n    \u003cli\u003eItems that are inherently not returnable (e.g., for hygiene reasons).\u003c/li\u003e\n    \u003cli\u003eGift cards.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003ePartial Refunds\u003c/h3\u003e\n\n\u003cp\u003eIn certain situations, only partial refunds are granted:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eItem with obvious signs of use.\u003c/li\u003e\n    \u003cli\u003eItem returned more than 7 days after delivery.\u003c/li\u003e\n    \u003cli\u003eItem not in original condition or missing parts.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eLate or Missing Refunds\u003c/h3\u003e\n\n\u003cp\u003eIf you haven’t received a refund yet:\u003c/p\u003e\n\u003col\u003e\n    \u003cli\u003eCheck your bank account again.\u003c/li\u003e\n    \u003cli\u003eContact your credit card company, as it may take some time before your refund is officially posted.\u003c/li\u003e\n    \u003cli\u003eContact your bank, as there is often some processing time before a refund is posted.\u003c/li\u003e\n    \u003cli\u003eIf you’ve done all of this and you still have not received your refund, please contact us at \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003ch3\u003eExchanges\u003c/h3\u003e\n\n\u003cp\u003eWe only replace items if they are defective or damaged. If you need to exchange it for the same item, email us at \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch3\u003eContact Us\u003c/h3\u003e\n\n\u003cp\u003eIf you have any questions about our Return and Refund Policy, please contact us:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eEmail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eVisiting this page: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eContact Us\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eLimitation of Liability\u003c/h3\u003e\n\n\u003cp\u003e\u003cstrong\u003eTO THE MAXIMUM EXTENT PERMITTED BY APPLICABLE LAW, IN NO EVENT SHALL THE COMPANY OR ITS SUPPLIERS BE LIABLE FOR ANY SPECIAL, INCIDENTAL, INDIRECT, OR CONSEQUENTIAL DAMAGES WHATSOEVER (INCLUDING, BUT NOT LIMITED TO, DAMAGES FOR LOSS OF PROFITS, LOSS OF DATA OR OTHER INFORMATION, FOR BUSINESS INTERRUPTION, FOR PERSONAL INJURY, LOSS OF PRIVACY ARISING OUT OF OR IN ANY WAY RELATED TO THE USE OF OR INABILITY TO USE THE SERVICE, THIRD-PARTY SOFTWARE AND/OR THIRD-PARTY HARDWARE USED WITH THE SERVICE, OR OTHERWISE IN CONNECTION WITH ANY PROVISION OF THESE TERMS).\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eThe Company's total liability under this agreement shall not exceed the greater of: (a) the total amount paid by You for the Service during the 12 months preceding the claim; or (b) $20.00 (twenty dollars).\u003c/p\u003e\n\n\u003ch3\u003eIndemnification\u003c/h3\u003e\n\n\u003cp\u003eYou agree to indemnify, defend, and hold harmless the Company, its affiliates, directors, employees, agents, licensors, and suppliers from and against all claims, liabilities, damages, judgments, costs, and expenses (including reasonable attorneys' fees) arising out of or related to: (a) your use of the Service; (b) any breach of these Terms by you; (c) any content you post or transmit through the Service; (d) your violation of any applicable law, rule, or regulation; or (e) your violation of the rights of any third party.\u003c/p\u003e\n\n\u003ch3\u003eDisclaimer of Warranties\u003c/h3\u003e\n\n\u003cp\u003e\u003cstrong\u003eTHE SERVICE IS PROVIDED \"AS IS\" AND \"AS AVAILABLE\" WITHOUT WARRANTIES OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING, BUT NOT LIMITED TO, IMPLIED WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NON-INFRINGEMENT.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eTHE COMPANY DOES NOT WARRANT THAT: (A) THE SERVICE WILL MEET YOUR REQUIREMENTS; (B) THE SERVICE WILL BE UNINTERRUPTED, TIMELY, SECURE OR ERROR-FREE; (C) THE RESULTS OBTAINED FROM USE OF THE SERVICE WILL BE ACCURATE OR RELIABLE; OR (D) THE QUALITY OF ANY PRODUCTS, SERVICES, INFORMATION OR OTHER MATERIALS OBTAINED THROUGH THE SERVICE WILL MEET YOUR EXPECTATIONS.\u003c/p\u003e\n\n\u003ch3\u003eAcceptance by Use\u003c/h3\u003e\n\n\u003cp\u003eBY ACCESSING, DOWNLOADING, INSTALLING OR USING THE SERVICE, YOU ACKNOWLEDGE THAT YOU HAVE READ, UNDERSTOOD AND AGREE TO BE BOUND BY THESE TERMS. IF YOU DO NOT AGREE TO THESE TERMS, DO NOT ACCESS OR USE THE SERVICE.\u003c/p\u003e\n\n\u003cp\u003eContinued use of the Service after any modifications to these Terms constitutes your acceptance of such modifications.\u003c/p\u003e\n\n\u003ch3\u003eGoverning Law and Jurisdiction\u003c/h3\u003e\n\n\u003cp\u003eThese Terms shall be governed by and construed in accordance with the laws of the Federative Republic of Brazil, without regard to its conflict of law provisions.\u003c/p\u003e\n\n\u003cp\u003eAny dispute arising out of or relating to these Terms shall be submitted to the exclusive jurisdiction of the courts of the city of São Paulo, State of São Paulo, Brazil, and the parties irrevocably waive any objection to the jurisdiction of such courts.\u003c/p\u003e\n\n\u003ch3\u003eAssumption of Risk\u003c/h3\u003e\n\n\u003cp\u003eYOU ASSUME FULL RESPONSIBILITY AND RISK FOR YOUR USE OF THE SERVICE. THE SERVICE IS PROVIDED \"AS IS\" WITHOUT WARRANTIES OF ANY KIND. THE COMPANY SHALL NOT BE LIABLE FOR ANY DAMAGES RESULTING FROM THE USE OR INABILITY TO USE THE SERVICE, INCLUDING DAMAGES CAUSED BY MALWARE, VIRUSES OR ANY INCORRECT OR INCOMPLETE COMPUTER PROGRAM.\u003c/p\u003e\n\n\u003ch3\u003eLGPD Compliance\u003c/h3\u003e\n\n\u003cp\u003eThis document complies with the Brazilian General Data Protection Law (LGPD - Law No. 13.709/2018) and its updates, including:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eANPD Resolution CD No. 19/2024:\u003c/strong\u003e Rules for international transfer of personal data.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eIncident Notification:\u003c/strong\u003e 3 (three) business day deadline to notify ANPD and affected data subjects.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eData Subject Rights:\u003c/strong\u003e Access, correction, portability, deletion, and consent revocation.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eData Protection Officer (DPO):\u003c/strong\u003e Contact information publicly available.\u003c/li\u003e\n\u003c/ul\u003e \n\n\u003cp\u003eKey LGPD 2024-2025 requirements include:\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eData breach notification: 3 business days to notify ANPD and affected users.\u003c/li\u003e\n    \u003cli\u003eInternational data transfers: Must use ANPD-approved Standard Contractual Clauses (Resolution CD/ANPD No. 19/2024).\u003c/li\u003e\n    \u003cli\u003eData subject rights: Access, correction, portability, deletion, and consent revocation.\u003c/li\u003e\n    \u003cli\u003eDPO contact information must be publicly available.\u003c/li\u003e\n    \u003cli\u003ePenalties: Up to 2% of annual Brazil revenue or BRL 50 million per violation.\u003c/li\u003e\n\u003c/ul\u003e \n\n\u003cp\u003eFor further inquiries regarding our Return and Refund Policy or LGPD compliance, feel free to contact us.\u003c/p\u003e","label":"Return and Refund","languageLabel":"English"},{"documentType":"privacy_policy","language":"EN","content":"\u003ch2\u003ePrivacy Policy\u003c/h2\u003e\n\n\u003cp\u003eLast updated: January 20, 2026\u003c/p\u003e\n\n\u003cp\u003eThis Privacy Policy describes our policies and procedures on the collection, use, and disclosure of your information when you use the Service and informs you about your privacy rights and how the law protects you.\u003c/p\u003e\n\n\u003cp\u003eWe use your personal data to provide and improve the Service. By using the Service, you agree to the collection and use of information in accordance with this Privacy Policy.\u003c/p\u003e\n\n\u003ch2\u003eInterpretation and Definitions\u003c/h2\u003e\n\n\u003ch3\u003eInterpretation\u003c/h3\u003e\n\n\u003cp\u003eThe words whose initial letter is capitalized have meanings defined under the following conditions. The following definitions shall have the same meaning regardless of whether they appear in the singular or in the plural.\u003c/p\u003e\n\n\u003ch3\u003eDefinitions\u003c/h3\u003e\n\n\u003cp\u003eFor the purposes of this Privacy Policy:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eAccount\u003c/strong\u003e means a unique account created for you to access our Service or parts of our Service.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCompany\u003c/strong\u003e (referred to as \"the Company\", \"We\", \"Us\" or \"Our\" in this Privacy Policy) refers to MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e are small files that are placed on your computer, mobile device, or any other device by a website, containing the details of your browsing history on that website among its many uses.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCountry\u003c/strong\u003e refers to: Brazil.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDevice\u003c/strong\u003e means any device that can access the Service, such as a computer, a mobile phone, or a tablet.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePersonal Data\u003c/strong\u003e is any information that relates to an identified or identifiable individual.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eService\u003c/strong\u003e refers to the Application or the Website, or both.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eService Provider\u003c/strong\u003e means any natural or legal person who processes the data on behalf of the Company.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUsage Data\u003c/strong\u003e refers to data collected automatically, either generated by the use of the Service or from its infrastructure itself.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSite\u003c/strong\u003e refers to RENDERWEAR, accessible from \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eYou\u003c/strong\u003e means the individual accessing or using the Service, or the company, or another legal entity on behalf of which such an individual is accessing or using the Service, as applicable.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eCollection and Use of Your Personal Data\u003c/h2\u003e\n\n\u003ch3\u003eTypes of Data Collected\u003c/h3\u003e\n\n\u003ch4\u003ePersonal Data\u003c/h4\u003e\n\n\u003cp\u003eWhile using our Service, we may ask you to provide us with certain personally identifiable information that can be used to contact or identify you. Personally identifiable information may include, but is not limited to:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eEmail address\u003c/li\u003e\n    \u003cli\u003eFirst and last name\u003c/li\u003e\n    \u003cli\u003ePhone number\u003c/li\u003e\n    \u003cli\u003eAddress, State, Province, ZIP/Postal code, City\u003c/li\u003e\n    \u003cli\u003eUsage Data\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch4\u003eUsage Data\u003c/h4\u003e\n\n\u003cp\u003eUsage Data is collected automatically, either generated by the use of the Service or from its infrastructure itself. Usage Data may include information such as your Device's Internet Protocol address (e.g., IP address), browser type, browser version, the pages of our Service that ortability of the data to another service provider.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDeletion:\u003c/strong\u003e To request the deletion of your personal data processed with the consent of the holder.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eInformation:\u003c/strong\u003e To be informed about the public and private entities with which we share your data.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eRevocation of Consent:\u003c/strong\u003e To revoke consent at any time.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eData Breach Notification\u003c/h3\u003e\n\n\u003cp\u003eIn accordance with the LGPD and the 2024 updates, we will notify the National Data Protection Authority (ANPD) and affected data subjects within 3 (three) business days of becoming aware of any security incident that may result in relevant risk or damage to the data subjects.\u003c/p\u003e\n\n\u003ch3\u003eData Protection Officer (DPO)\u003c/h3\u003e\n\n\u003cp\u003eTo exercise your rights or clarify doubts about the processing of your personal data, please contact our Data Protection Officer:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eEmail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eChanges to This Privacy Policy\u003c/h2\u003e\n\n\u003cp\u003eWe may update our Privacy Policy from time to time. We will notify you of any changes by posting the new Privacy Policy on this page.\u003c/p\u003e\n\n\u003cp\u003eWe recommend that you review this Privacy Policy periodically for any changes.\u003c/p\u003e\n\n\u003ch2\u003eContact Us\u003c/h2\u003e\n\n\u003cp\u003eIf you have any questions about this Privacy Policy, please contact us:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eEmail: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eBy visiting this page: \u003ca href=\"https://www.incod com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eYou\u003c/strong\u003e means the individual accessing or using the site, or a company, or any legal entity on behalf of which such individual is accessing or using the site, as applicable.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eThe Use of Cookies\u003c/h2\u003e\n\n\u003ch3\u003eTypes of Cookies Used\u003c/h3\u003e\n\u003cp\u003eCookies can be \"Persistent\" or \"Session\". Persistent cookies remain on your personal computer or mobile device when you go offline, while session cookies are deleted as soon as you close your browser.\u003c/p\u003e\n\n\u003cp\u003eWe use session and persistent cookies for the purposes defined below:\u003c/p\u003e\n\n\u003ch4\u003eEssential Cookies\u003c/h4\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eType:\u003c/strong\u003e Session Cookies\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eManaged by:\u003c/strong\u003e Us\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePurpose:\u003c/strong\u003e These cookies are essential for providing you with services available through the site and enabling you to use some of its features. They help authenticate users and prevent the fraudulent use of user accounts. Without these cookies, the services you requested cannot be provided, and we only use these cookies to provide those services to you.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch4\u003eCookie Consent Cookies\u003c/h4\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eType:\u003c/strong\u003e Persistent Cookies\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eManaged by:\u003c/strong\u003e Us\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePurpose:\u003c/strong\u003e These cookies identify whether users have accepted the use of cookies on the site.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch4\u003eFunctionality Cookies\u003c/h4\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eType:\u003c/strong\u003e Persistent Cookies\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eManaged by:\u003c/strong\u003e Us\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePurpose:\u003c/strong\u003e These cookies allow us to remember the choices you make when using the site, such as remembering your login details or language preference. The purpose of these cookies is to provide you with a more personal experience and to prevent you from having to re-enter your preferences every time you use the site.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch4\u003eTracking and Performance Cookies\u003c/h4\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eType:\u003c/strong\u003e Persistent Cookies\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eManaged by:\u003c/strong\u003e Third Parties\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePurpose:\u003c/strong\u003e These cookies are used to track information about traffic to the site and how users utilize the site. The information collected through these Cookies may identify you directly or indirectly as an individual visitor.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch4\u003eAdvertising and Targeting Cookies\u003c/h4\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eType:\u003c/strong\u003e Persistent Cookies\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eManaged by:\u003c/strong\u003e Third Parties\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePurpose:\u003c/strong\u003e These cookies track your browsing habits to enable us to display advertising likely to be of interest to you.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eYour Choices Regarding Cookies\u003c/h2\u003e\n\u003cp\u003eIf you prefer to avoid the use of cookies on the site, you must first disable the use of cookies in your browser and then delete the cookies saved in your browser associated with this site. You can use this option to prevent the use of cookies at any time.\u003c/p\u003e\n\n\u003cp languageLabel":"English"},{"documentType":"disclaimer","language":"ES","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"es\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eDescargo de Responsabilidad - RENDERWEAR\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003eDescargo de Responsabilidad\u003c/h2\u003e\n    \u003cp\u003eÚltima actualización: 20 de enero de 2026\u003c/p\u003e\n\n    \u003ch2\u003eInterpretación y Definiciones\u003c/h2\u003e\n    \u003ch3\u003eInterpretación\u003c/h3\u003e\n    \u003cp\u003eLas palabras cuya letra inicial es mayúscula tienen significados definidos en las siguientes condiciones. Las siguientes definiciones deben tener el mismo significado, independientemente de aparecer en singular o plural.\u003c/p\u003e\n\n    \u003ch3\u003eDefiniciones\u003c/h3\u003e\n    \u003cp\u003ePara los fines de este descargo de responsabilidad:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e (referida como \"la Empresa\", \"Nosotros\", \"Nuestro\" en este descargo de responsabilidad) se refiere a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServicio\u003c/strong\u003e se refiere al sitio web, al aplicativo o a ambos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e significa el individuo que accede al Servicio, o la empresa, o cualquier persona jurídica en nombre de la cual dicho individuo está accediendo o utilizando el Servicio, según sea aplicable.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSitio\u003c/strong\u003e se refiere a RENDERWEAR, accesible en \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAplicativo\u003c/strong\u003e significa el programa de software proporcionado por la Empresa denominado RENDERWEAR.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eExoneração de Responsabilidade Geral\u003c/h2\u003e\n    \u003cp\u003eLa información contenida en el Servicio es únicamente para fines de información general.\u003c/p\u003e\n    \u003cp\u003eLA EMPRESA NO ASUME NINGUNA RESPONSABILIDAD POR ERRORES O OMISIONES EN EL CONTENIDO DEL SERVICIO.\u003c/p\u003e\n    \u003cp\u003eEN NINGÚN CASO LA EMPRESA SERÁ RESPONSABLE POR CUALESQUIERA DAÑOS ESPECIALES, DIRECTOS, INDIRECTOS, CONSECUENCIALES O INCIDENTAL, O CUALQUIER DAÑO, YA SEA EN UNA ACCIÓN CONTRACTUAL, NEGLIGENCIA O CUALQUIER OTRA ACCIÓN ILÍCITA, QUE SURJA DE O EN RELACIÓN CON EL USO DEL SERVICIO O EL CONTENIDO DEL SERVICIO. LA EMPRESA SE RESERVA EL DERECHO DE HACER ADICIONES, EXCLUSIONES O MODIFICACIONES EN EL CONTENIDO DEL SERVICIO EN CUALQUIER MOMENTO, SIN PREVIO AVISO.\u003c/p\u003e\n    \u003cp\u003eLA EMPRESA NO GARANTIZA QUE EL SERVICIO ESTÉ LIBRE DE VIRUS U OTROS COMPONENTES PERJUDICIALES.\u003c/p\u003e\n\n    \u003ch2\u003eIsenção de Responsabilidade de Links Externos\u003c/h2\u003e\n    \u003cp\u003eEl Servicio puede contener enlaces a sitios externos que no son proporcionados o mantenidos por o de cualquier forma afiliados a la Empresa.\u003c/p\u003e\n    \u003cp\u003eLA EMPRESA NO GARANTIZA LA PRECISIÓN, RELEVANCIA, OPORTUNIDAD O INTEGRIDAD DE CUALQUIER INFORMACIÓN EN ESTOS SITIOS EXTERNOS.\u003c/p\u003e\n\n    \u003ch2\u003eIsenção de Responsabilidade por Erros e Omissões\u003c/h2\u003e\n    \u003cp\u003eLas informaciones proporcionadas por el Servicio son solo para orientación general sobre asuntos de interés. A pesar de que la Empresa tome todas las precauciones para garantizar que el contenido del Servicio esté actualizado y sea preciso, pueden ocurrir errores. Además, debido a la naturaleza mutable de las leyes, reglas y regulaciones, puede haber retrasos, omisiones o imprecisiones en la información contenida en el Servicio.\u003c/p\u003e\n    \u003cp\u003eLA EMPRESA NO SE RESPONSABILIZA POR CUALESQUIERA ERRORES O OMISIONES, O POR LOS RESULTADOS OBTENIDOS CON EL USO DE ESTA INFORMACIÓN.\u003c/p\u003e\n\n    \u003ch2\u003eIsenção de Responsabilidade de Uso Justo\u003c/h2\u003e\n    \u003cp\u003eLa Empresa puede utilizar material protegido por derechos de autor que no siempre ha sido específicamente autorizado por el propietario de los derechos de autor. La Empresa está proporcionando este material para crítica, comentario, informe, educación, investigación o investigación.\u003c/p\u003e\n    \u003cp\u003eLA EMPRESA CREE QUE ESTO CONSTITUYE UN \"USO JUSTO\" DE CUALQUIER MATERIAL PROTEGIDO POR DERECHOS DE AUTOR, SEGÚN LO PREVISTO EN LA SECCIÓN 107 DE LA LEY DE DERECHOS DE AUTOR DE LOS ESTADOS UNIDOS.\u003c/p\u003e\n    \u003cp\u003eSI DESEA UTILIZAR MATERIAL PROTEGIDO POR DERECHOS DE AUTOR DEL SERVICIO PARA SUS PROPIOS FINES QUE VAN MÁS ALLÁ DEL USO JUSTO, DEBE OBTENER PERMISO DEL PROPIETARIO DE LOS DERECHOS DE AUTOR.\u003c/p\u003e\n\n    \u003ch2\u003eIsenção de Responsabilidade Expressa das Visualizações\u003c/h2\u003e\n    \u003cp\u003eEl Servicio puede contener puntos de vista y opiniones de los autores y no reflejan necesariamente la política oficial o posición de cualquier otro autor, agencia, organización, empleador o empresa, incluyendo la Empresa.\u003c/p\u003e\n    \u003cp\u003eLOS COMENTARIOS PUBLICADOS POR LOS USUARIOS SON DE SU EXCLUSIVA RESPONSABILIDAD Y LOS USUARIOS ASUMEN TOTAL RESPONSABILIDAD, RESPONSABILIDAD Y CULPA POR CUALQUIER DIFAMACIÓN O LITIGIO QUE RESULTE DE ALGO ESCRITO O COMO RESULTADO DIRECTO DE ALGO ESCRITO EN UN COMENTARIO. LA EMPRESA NO SE RESPONSABILIZA POR NINGÚN COMENTARIO PUBLICADO POR USUARIOS Y SE RESERVA EL DERECHO DE ELIMINAR CUALQUIER COMENTARIO POR CUALQUIER MOTIVO.\u003c/p\u003e\n\n    \u003ch2\u003eIsenção de Responsabilidade Profissional\u003c/h2\u003e\n    \u003cp\u003eLa información sobre el Servicio se proporciona con el entendimiento de que la Empresa no está involucrada en la prestación de servicios de asesoría legal, contable, fiscal o de otro tipo. Como tal, no debe ser utilizada como un sustituto para consultar a asesores profesionales de contabilidad, fiscales, legales o otros asesores competentes.\u003c/p\u003e\n    \u003cp\u003eEN NINGÚN CASO, LA EMPRESA O SUS PROVEEDORES SERÁN RESPONSABLES POR CUALESQUIERA DAÑOS ESPECIALES, INCIDENTALES, INDIRECTOS O CONSECUENTES DE CUALQUIER NATURALEZA QUE SURJAN DE O EN RELACIÓN CON SU ACCESO O USO O INCAPACIDAD DE ACCEDER O USAR EL SERVICIO.\u003c/p\u003e\n\n    \u003ch2\u003eUse por Su Cuenta y Riesgo\u003c/h2\u003e\n    \u003cp\u003eTODA LA INFORMACIÓN EN EL SERVICIO SE PROPORCIONA \"EN EL ESTADO EN QUE SE ENCUENTRA\", SIN GARANTÍA DE INTEGRIDAD, PRECISIÓN, OPORTUNIDAD O DE LOS RESULTADOS OBTENIDOS CON EL USO DE DICHA INFORMACIÓN Y SIN GARANTÍA DE NINGÚN TIPO, EXPRESA O IMPLÍCITA, INCLUYENDO, PERO NO LIMITÁNDOSE A GARANTÍAS DE RENDIMIENTO, COMERCIALIZACIÓN Y ADECUACIÓN A UN FIN PARTICULAR.\u003c/p\u003e\n    \u003cp\u003eLA EMPRESA NO SERÁ RESPONSABLE ANTE USTED O ANTE CUALQUIER OTRA PERSONA POR CUALQUIER DECISIÓN O ACCIÓN TOMADA CON BASE EN LA INFORMACIÓN PROPORCIONADA POR EL SERVICIO O POR CUALESQUIERA DAÑOS CONSIGUIENTES, ESPECIALES O SIMILARES, AÚN AUNQUE SE HAYA AVISADO DE LA POSIBILIDAD DE TALES DAÑOS.\u003c/p\u003e\n\n    \u003ch2\u003eContacto\u003c/h2\u003e\n    \u003cp\u003eSi tiene alguna pregunta sobre este descargo de responsabilidad, puede ponerse en contacto con nosotros:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eCorreo electrónico: \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003eVisitando nuestra página de contacto: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eCumplimiento de la LGPD\u003c/h2\u003e\n    \u003cp\u003eEste documento cumple con la Ley General de Protección de Datos de Brasil (LGPD - Ley N° 13.709/2018) y sus actualizaciones, incluyendo:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eResolución CD/ANPD N° 19/2024\u003c/strong\u003e: Reglas para transferencia internacional de datos personales.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eNotificación de Incidentes\u003c/strong\u003e: Plazo de 3 (tres) días hábiles para comunicar a la ANPD y a los titulares afectados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDerechos de los Titulares\u003c/strong\u003e: Acceso, corrección, portabilidad, eliminación y revocación del consentimiento.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDelegado de Protección de Datos (DPO)\u003c/strong\u003e: Información de contacto disponible públicamente.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cp\u003e Según la Ley, las sanciones pueden ser de hasta el 2% de la facturación anual en Brasil o de R$ 50 millones por violación.\u003c/p\u003e\n\n    \u003ch2\u003eAceptación por Uso\u003c/h2\u003e\n    \u003cp\u003eAL ACCEDER, DESCARGAR, INSTALAR O USAR EL SERVICIO, USTED RECONOCE QUE HA LEÍDO, COMPRENDIDO Y ACUERDA ESTAR SUJETO A ESTOS TÉRMINOS. SI NO ESTÁ DE ACUERDO CON ESTOS TÉRMINOS, NO ACCEDA NI USE EL SERVICIO.\u003c/p\u003e\n    \u003cp\u003eEl uso continuado del Servicio después de cualquier modificación a estos Términos constituye su aceptación de tales modificaciones.\u003c/p\u003e\n\n    \u003ch2\u003eLimitación de Responsabilidad\u003c/h2\u003e\n    \u003cp\u003eEN LA MEDIDA MÁXIMA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES SERÁN RESPONSABLES POR CUALESQUIERA DAÑOS ESPECIALES, INCIDENTALES, INDIRECTOS O CONSECUENCIALES QUE SURJAN DE O EN RELACIÓN CON EL USO O LA INCAPACIDAD DE USAR EL SERVICIO, SOFTWARE DE TERCEROS Y/O HARDWARE DE TERCEROS UTILIZADOS CON EL SERVICIO, O DE OTRA MANERA EN CONEXIÓN CON CUALQUIER DISPOSICIÓN DE ESTOS TÉRMINOS.\u003c/p\u003e\n    \u003cp\u003eLa responsabilidad total de la Empresa bajo este acuerdo no excederá el mayor de: (a) la cantidad total pagada por usted por el Servicio durante los 12 meses anteriores a la reclamación; o (b) $20.00 (veinte dólares).\u003c/p\u003e\n\n    \u003ch2\u003eIndemnización\u003c/h2\u003e\n    \u003cp\u003eUsted acepta indemnizar, defender y mantener a la Empresa, sus afiliados, directores, empleados, agentes, licenciatarios y proveedores indemnes de y contra todas las reclamaciones, responsabilidades, daños, juicios, costos y gastos (incluidos honorarios razonables de abogados) que surjan de o estén relacionados con: (a) su uso del Servicio; (b) cualquier incumplimiento de estos Términos por parte suya; (c) cualquier contenido que usted publique o transmita a través del Servicio; (d) su violación de cualquier ley, regla o regulación aplicable; o (e) su violación de los derechos de cualquier tercero.\u003c/p\u003e\n\n    \u003ch2\u003eJurisprudencia y Ley Aplicable\u003c/h2\u003e\n    \u003cp\u003eEstos Términos se regirán e interpretarán de acuerdo con las leyes de la República Federativa de Brasil, sin tener en cuenta sus disposiciones sobre conflictos de leyes.\u003c/p\u003e\n    \u003cp\u003eCualquier disputa que surja de o esté relacionada con estos Términos se someterá a la jurisdicción exclusiva de los tribunales de la ciudad de São Paulo, Estado de São Paulo, Brasil, y las partes renuncian irrevocablemente a cualquier objeción a la jurisdicción de dichos tribunales.\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e","label":"Aviso Legal","languageLabel":"Español"},{"documentType":"return_refund","language":"ES","content":"\u003ch2\u003ePolítica de Devolución y Reembolso\u003c/h2\u003e\n\n\u003cp\u003eÚltima actualización: 20 de enero de 2026\u003c/p\u003e\n\n\u003cp\u003eGracias por comprar en RENDERWEAR.\u003c/p\u003e\n\n\u003cp\u003eSi no está totalmente satisfecho con su compra, estamos aquí para ayudar.\u003c/p\u003e\n\n\u003ch2\u003eInterpretación y Definiciones\u003c/h2\u003e\n\n\u003ch3\u003eDefiniciones\u003c/h3\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e se refiere a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ubicada en ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eBienes\u003c/strong\u003e se refiere a los artículos ofrecidos para la venta en el Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePedidos\u003c/strong\u003e significa una solicitud suya para comprar Bienes de nosotros.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServicio\u003c/strong\u003e se refiere a RENDERWEAR.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e significa el individuo que accede o utiliza el Servicio, o la empresa, o cualquier otra entidad legal en nombre de la cual tal individuo está accediendo o utilizando el Servicio.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eSu Elegibilidad para Reembolso\u003c/h2\u003e\n\n\u003cp\u003eLos siguientes artículos son elegibles para reembolso:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eBienes defectuosos o dañados en el momento de la entrega.\u003c/li\u003e\n    \u003cli\u003eBienes que no corresponden a la descripción proporcionada.\u003c/li\u003e\n    \u003cli\u003eBienes no utilizados y en su embalaje original.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003ePara ser elegible para un retorno, su artículo debe estar no utilizado y en las mismas condiciones en que lo recibió. También debe estar en el embalaje original.\u003c/p\u003e\n\n\u003ch2\u003ePrazos para Solicitud\u003c/h2\u003e\n\n\u003cp\u003eTiene 7 (siete) días corridos a partir de la fecha de recepción del producto para solicitar la devolución o reembolso, según lo dispuesto en el Código de Defensa del Consumidor (Ley nº 8.078/90).\u003c/p\u003e\n\n\u003cp\u003ePara suscripciones digitales, puede cancelar y solicitar reembolso hasta 7 días después de la contratación, siempre que el servicio no haya sido utilizado.\u003c/p\u003e\n\n\u003ch2\u003eProceso de Reembolso\u003c/h2\u003e\n\n\u003cp\u003ePara solicitar un reembolso, siga estos pasos:\u003c/p\u003e\n\n\u003col\u003e\n    \u003cli\u003ePóngase en contacto con nosotros a través de info@incodetech.com.br con su número de pedido y motivo del reembolso.\u003c/li\u003e\n    \u003cli\u003eEspere nuestra respuesta con instrucciones sobre cómo proceder.\u003c/li\u003e\n    \u003cli\u003eSi es aplicable, devuelva el artículo conforme a las instrucciones proporcionadas.\u003c/li\u003e\n    \u003cli\u003eDespués de recibir e inspeccionar el artículo, le notificaremos sobre la aprobación o rechazo del reembolso.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003cp\u003eSi se aprueba, su reembolso será procesado y un crédito se aplicará automáticamente a su método de pago original en hasta 14 días hábiles.\u003c/p\u003e\n\n\u003ch2\u003eÍtems No Reembolsables\u003c/h2\u003e\n\n\u003cp\u003eLos siguientes artículos no son elegibles para reembolso:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eProductos digitales que ya han sido descargados o accedidos.\u003c/li\u003e\n    \u003cli\u003eSuscripciones después del periodo de 7 días, si el servicio ya fue utilizado.\u003c/li\u003e\n    \u003cli\u003eProductos personalizados que fueron hechos a medida.\u003c/li\u003e\n    \u003cli\u003eProductos que por su naturaleza no pueden ser devueltos (por ejemplo, por razones de higiene).\u003c/li\u003e\n    \u003cli\u003eTarjetas de regalo.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eReembolsos Parciales\u003c/h2\u003e\n\n\u003cp\u003eEn ciertas situaciones, solo se conceden reembolsos parciales:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eArtículo con evidencia de uso evidente.\u003c/li\u003e\n    \u003cli\u003eArtículo devuelto más de 7 días después de la entrega.\u003c/li\u003e\n    \u003cli\u003eArtículo no en condiciones originales o con piezas faltantes.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eReembolsos Atrasados o Ausentes\u003c/h2\u003e\n\n\u003cp\u003eSi todavía no ha recibido un reembolso:\u003c/p\u003e\n\n\u003col\u003e\n    \u003cli\u003ePrimero verifique su cuenta bancaria nuevamente.\u003c/li\u003e\n    \u003cli\u003ePóngase en contacto con la compañía de su tarjeta de crédito, ya que puede llevar algún tiempo antes de que su reembolso sea oficialmente liberado.\u003c/li\u003e\n    \u003cli\u003ePóngase en contacto con su banco, ya que generalmente hay un tiempo de procesamiento antes de que un reembolso sea liberado.\u003c/li\u003e\n    \u003cli\u003eSi ha hecho todo esto y aún no ha recibido su reembolso, póngase en contacto con nosotros a través de info@incodetech.com.br.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003ch2\u003eIntercambios\u003c/h2\u003e\n\n\u003cp\u003eSolo reemplazamos artículos si están defectuosos o dañados. Si necesita cambiarlo por el mismo artículo, envíenos un correo electrónico a info@incodetech.com.br.\u003c/p\u003e\n\n\u003ch2\u003eContacto\u003c/h2\u003e\n\n\u003cp\u003eSi tiene alguna pregunta sobre nuestra Política de Devolución y Reembolso, contáctenos:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003eEmail: info@incodetech.com.br\u003c/li\u003e\n    \u003cli\u003eVisitando esta página: \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003eContacto\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eExención de Responsabilidad y Limitación de Responsabilidad\u003c/h2\u003e\n\n\u003cp\u003e\u003cstrong\u003eEN LA MEDIDA MÁXIMA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES SERÁN RESPONSABLES POR NINGÚN DAÑO ESPECIAL, INCIDENTAL, INDIRECTO O CONSECUENTE, INCLUYENDO, PERO NO LIMITÁNDOSE A, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS U OTRA INFORMACIÓN, POR INTERRUPCIÓN DEL NEGOCIO, POR LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD QUE SURJA DE O DE CUALQUIER MANERA ESTÉ RELACIONADO CON EL USO O LA INCAPACIDAD DE USAR EL SERVICIO, SOFTWARE DE TERCEROS Y/O HARDWARE DE TERCEROS UTILIZADOS CON EL SERVICIO, O DE OTRA MANERA EN RELACIÓN CON CUALQUIER DISPOSICIÓN DE ESTOS TÉRMINOS.\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eLa responsabilidad total de la Empresa bajo este acuerdo no excederá el mayor de: (a) la cantidad total pagada por Usted por el Servicio durante los 12 meses anteriores a la reclamación; o (b) $20.00 (veinte dólares).\u003c/p\u003e\n\n\u003ch2\u003eIndemnización\u003c/h2\u003e\n\n\u003cp\u003eUsted acepta indemnizar, defender y mantener indemne a la Empresa, sus afiliados, directores, empleados, agentes, licenciantes y proveedores de y contra todas las reclamaciones, responsabilidades, daños, juicios, costos y gastos (incluidas las tarifas razonables de abogados) que surjan de o estén relacionados con: (a) su uso del Servicio; (b) cualquier incumplimiento de estos Términos por su parte; (c) cualquier contenido que usted publique o transmita a través del Servicio; (d) su violación de cualquier ley, regla o regulación aplicable; o (e) su violación de los derechos de cualquier tercero.\u003c/p\u003e\n\n\u003ch2\u003eDescargo de Responsabilidad de Garantías\u003c/h2\u003e\n\n\u003cp\u003eEL SERVICIO SE PROPORCIONA \"TAL CUAL\" Y \"SEGÚN ESTÉ DISPONIBLE\", SIN GARANTÍAS DE NINGÚN TIPO, EXPRESAS O IMPLÍCITAS, INCLUYENDO, PERO NO LIMITÁNDOSE A, GARANTÍAS IMPLÍCITAS DE COMERCIALIZABILIDAD, IDONEIDAD PARA UN PROPÓSITO PARTICULAR Y NO INFRACCIÓN.\u003c/p\u003e\n\n\u003cp\u003eLA EMPRESA NO GARANTIZA QUE: (A) EL SERVICIO CUMPLIRÁ CON SUS REQUISITOS; (B) EL SERVICIO SERÁ ININTERRUMPIDO, OPORTUNO, SEGURO O LIBRE DE ERRORES; (C) LOS RESULTADOS OBTENIDOS DEL USO DEL SERVICIO SERÁN PRECISOS O CONFIABLES; O (D) LA CALIDAD DE CUALQUIER PRODUCTO, SERVICIO, INFORMACIÓN U OTROS MATERIALES OBTENIDOS A TRAVÉS DEL SERVICIO CUMPLIRÁN CON SUS EXPECTATIVAS.\u003c/p\u003e\n\n\u003ch2\u003eAceptación por Uso\u003c/h2\u003e\n\n\u003cp\u003eAL ACCEDER, DESCARGAR, INSTALAR O UTILIZAR EL SERVICIO, USTED RECONOCE QUE HA LEÍDO, ENTENDIDO Y ACEPTA ESTAR SUJETO A ESTOS TÉRMINOS. SI NO ESTÁ DE ACUERDO CON ESTOS TÉRMINOS, NO ACCEDA NI USE EL SERVICIO.\u003c/p\u003e\n\n\u003cp\u003eEl uso continuo del Servicio después de cualquier modificación a estos Términos constituye su aceptación de tales modificaciones.\u003c/p\u003e\n\n\u003ch2\u003eLegislación y Jurisdicción Aplicable\u003c/h2\u003e\n\n\u003cp\u003eEstos Términos se regirán e interpretarán de acuerdo con las leyes de la República Federativa de Brasil, sin tener en cuenta sus disposiciones sobre conflictos de leyes.\u003c/p\u003e\n\n\u003cp\u003eCualquier disputa que surja de o esté relacionada con estos Términos se someterá a la jurisdicción exclusiva de los tribunales de la ciudad de São Paulo, Estado de São Paulo, Brasil, y las partes renuncian irrevocablemente a cualquier objeción a la jurisdicción de dichos tribunales.\u003c/p\u003e\n\n\u003ch2\u003eAsunción de Riesgos\u003c/h2\u003e\n\n\u003cp\u003eUSTED ASUME PLENA RESPONSABILIDAD Y RIESGO POR SU USO DEL SERVICIO. EL SERVICIO SE PROPORCIONA \"TAL CUAL\" SIN GARANTÍAS DE NINGÚN TIPO. LA EMPRESA NO SERÁ RESPONSABLE POR NINGÚN DAÑO DERIVADO DEL USO O LA INCAPACIDAD DE USAR EL SERVICIO, INCLUYENDO DAÑOS CAUSADOS POR MALWARE, VIRUS O CUALQUIER PROGRAMA INFORMÁTICO INCORRECTO O INCOMPLETO.\u003c/p\u003e\n\n\u003ch2\u003eCumplimiento de la LGPD\u003c/h2\u003e\n\n\u003cp\u003eEste documento cumple con la Ley General de Protección de Datos de Brasil (LGPD - Ley N° 13.709/2018) y sus actualizaciones, incluyendo:\u003c/p\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eResolución CD/ANPD N° 19/2024:\u003c/strong\u003e Reglas para la transferencia internacional de datos personales.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eNotificación de Incidentes:\u003c/strong\u003e Plazo de 3 (tres) días hábiles para comunicar a la ANPD y a los titulares afectados.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDerechos de los Titulares:\u003c/strong\u003e Acceso, corrección, portabilidad, eliminación y revocación del consentimiento.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDelegado de Protección de Datos (DPO):\u003c/strong\u003e Información de contacto disponible públicamente.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003e\u003cstrong\u003eLas sanciones pueden ser de hasta el 2% de los ingresos anuales en Brasil o BRL 50 millones por violación.\u003c/strong\u003e\u003c/p\u003e","label":"Devolución y Reembolso","languageLabel":"Español"},{"documentType":"privacy_policy","language":"ES","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003ePolítica de Privacidad\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003ePolítica de Privacidad\u003c/h2\u003e\n    \u003cp\u003eÚltima actualización: 20 de enero de 2026\u003c/p\u003e\n    \u003cp\u003eEsta Política de Privacidad describe nuestras políticas y procedimientos sobre la recopilación, uso y divulgación de sus datos personales cuando utiliza el Servicio y le informa sobre sus derechos de privacidad y cómo la ley lo protege.\u003c/p\u003e\n    \u003cp\u003eUtilizamos sus datos personales para proporcionar y mejorar el Servicio. Al utilizar el Servicio, usted acepta la recopilación y el uso de información de acuerdo con esta Política de Privacidad.\u003c/p\u003e\n\n    \u003ch2\u003eInterpretación y Definiciones\u003c/h2\u003e\n    \u003ch3\u003eInterpretación\u003c/h3\u003e\n    \u003cp\u003eLas palabras que comienzan con letra mayúscula tienen significados definidos bajo las siguientes condiciones. Las siguientes definiciones tendrán el mismo significado, independientemente de si aparecen en singular o en plural.\u003c/p\u003e\n\n    \u003ch3\u003eDefiniciones\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eCuenta:\u003c/strong\u003e significa una cuenta única creada para que usted acceda a nuestro Servicio o partes de nuestro Servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa:\u003c/strong\u003e (denominada \"la Empresa\", \"Nosotros\", \"Nos\" o \"Nuestro\" en esta Política de Privacidad) se refiere a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICAÇÃO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCookies:\u003c/strong\u003e son pequeños archivos que se colocan en su computadora, dispositivo móvil o cualquier otro dispositivo por un sitio web, que contienen los detalles de su historial de navegación en dicho sitio entre sus múltiples usos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePaís:\u003c/strong\u003e se refiere a Brasil.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDispositivo:\u003c/strong\u003e significa cualquier dispositivo que pueda acceder al Servicio, como una computadora, un teléfono celular o una tableta digital.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDatos Personales:\u003c/strong\u003e son cualquier información que se relacione con un individuo identificado o identificable.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eServicio:\u003c/strong\u003e se refiere a la Aplicación o al Sitio, o ambos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePrestador de Servicios:\u003c/strong\u003e significa cualquier persona física o jurídica que procesa los datos en nombre de la Empresa.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDatos de Uso:\u003c/strong\u003e se refiere a los datos que se recopilan automáticamente, generados por el uso del Servicio o por la propia infraestructura del Servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSitio:\u003c/strong\u003e se refiere a RENDERWEAR, accesible desde \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eUsted:\u003c/strong\u003e significa el individuo que accede o utiliza el Servicio, o la empresa u otra entidad legal en nombre de la cual dicho individuo accede o utiliza el Servicio, según sea el caso.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eColeta e Uso de Seus Dados Pessoais\u003c/h2\u003e\n    \u003ch3\u003eTipos de Datos Coletados\u003c/h3\u003e\n\n    \u003ch4\u003eDatos Personales\u003c/h4\u003e\n    \u003cp\u003eAl utilizar nuestro Servicio, podemos solicitar que nos proporcione cierta información de identificación personal que pueda usarse para contactarlo o identificarlo. La información de identificación personal puede incluir, pero no se limita a:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003eDirección de correo electrónico\u003c/li\u003e\n        \u003cli\u003eNombre y apellido\u003c/li\u003e\n        \u003cli\u003eNúmero de teléfono\u003c/li\u003e\n        \u003cli\u003eDirección, Estado, Provincia, Código Postal, Ciudad\u003c/li\u003e\n        \u003cli\u003eDatos de Uso\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch4\u003eDatos de Uso\u003c/h4\u003e\n    \u003cp\u003eLos Datos de Uso se recopilan automáticamente al usar el Servicio.\u003c/p\u003e\n    \u003cp\u003eLos Datos de Uso pueden incluir información como la dirección de Protocolo de Internet de su Dispositivo (por ejemplo, dirección IP), tipo de navegador, versión del navegador, las páginas de nuestro Servicio que visita, la hora y fecha de su visita, el tiempo gastado en esas páginas, identificadores únicos de dispositivos y otros datos de diagnóstico.\u003c/p\u003e\n\n    \u003ch3\u003eUso de Seus Dados Pessoais\u003c/h3\u003e\n    \u003cp\u003eLa Empresa puede utilizar Datos Personales para los siguientes fines:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003ePara proporcionar y mantener nuestro Servicio:\u003c/strong\u003e incluyendo el monitoreo del uso de nuestro Servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara gestionar su Cuenta:\u003c/strong\u003e para administrar su registro como usuario del Servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara la ejecución de un contrato:\u003c/strong\u003e el desarrollo, cumplimiento y ejecución del contrato de compra de los productos, elementos o servicios que ha adquirido.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara contactarlo:\u003c/strong\u003e Para ponerse en contacto con usted por correo electrónico, llamadas telefónicas, SMS o otras formas equivalentes de comunicación electrónica.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePara gestionar sus solicitudes:\u003c/strong\u003e Para satisfacer y gestionar sus solicitudes hacia nosotros.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003eRetención de Seus Dados Pessoais\u003c/h3\u003e\n    \u003cp\u003eLa Empresa retendrá sus Datos Personales solo por el tiempo necesario para los fines establecidos en esta Política de Privacidad. Retendremos y utilizaremos sus Datos Personales en la medida necesaria para cumplir con nuestras obligaciones legales.\u003c/p\u003e\n\n    \u003ch3\u003eTransferência de Seus Dados Pessoais\u003c/h3\u003e\n    \u003cp\u003eSu información, incluidos los Datos Personales, es procesada en las oficinas operativas de la Empresa y en cualquier otro lugar donde las partes involucradas en el procesamiento estén ubicadas. Esto significa que esta información puede ser transferida a — y mantenida en — computadoras localizadas fuera de su estado, provincia, país o cualquier otra jurisdicción gubernamental donde las leyes de protección de datos pueden diferir de las de su jurisdicción.\u003c/p\u003e\n    \u003cp\u003eDe conformidad con la LGPD y la Resolución CD/ANPD n° 19/2024, cualquier transferencia internacional de datos personales se llevará a cabo mediante Cláusulas Contractuales Estándar aprobadas por la ANPD o otros mecanismos legalmente válidos.\u003c/p\u003e\n\n    \u003ch3\u003eSeguridad de Seus Dados Pessoais\u003c/h3\u003e\n    \u003cp\u003eLa seguridad de sus Datos Personales es importante para nosotros, pero recuerde que ningún método de transmisión por Internet o método de almacenamiento electrónico es 100% seguro. Aunque nos esforzamos por utilizar medios comercialmente aceptables para proteger sus Datos Personales, no podemos garantizar su seguridad absoluta.\u003c/p\u003e\n\n    \u003ch2\u003eDerechos de Protección de Datos (LGPD)\u003c/h2\u003e\n    \u003cp\u003eDe conformidad con la Ley General de Protección de Datos (LGPD - Ley N° 13.709/2018), usted tiene los siguientes derechos:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eConfirmación y Acceso:\u003c/strong\u003e Confirmar la existencia de tratamiento y acceder a sus datos personales.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCorrección:\u003c/strong\u003e Solicitar la corrección de datos incompletos, inexactos o desactualizados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eAnonimización, Bloqueo o Eliminación:\u003c/strong\u003e Solicitar la anonimización, bloqueo o eliminación de datos innecesarios, excesivos o tratados en desconformidad.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePortabilidad:\u003c/strong\u003e Solicitar la portabilidad de los datos a otro proveedor de servicio.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eEliminación:\u003c/strong\u003e Solicitar la eliminación de los datos personales tratados con el consentimiento del titular.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInformación:\u003c/strong\u003e Ser informado sobre las entidades públicas y privadas con las que compartimos sus datos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eRevocación del Consentimiento:\u003c/strong\u003e Revocar el consentimiento en cualquier momento.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch3\u003eNotificación de Incidentes de Seguridad\u003c/h3\u003e\n    \u003cp\u003eDe conformidad con la LGPD y las actualizaciones de 2024, notificaremos a la Autoridad Nacional de Protección de Datos (ANPD) y a los titulares afectados dentro de los 3 (tres) días hábiles a partir del conocimiento de cualquier incidente de seguridad que pueda representar un riesgo o daño relevante para los titulares.\u003c/p\u003e\n\n    \u003ch3\u003eDelegado de Protección de Datos (DPO)\u003c/h3\u003e\n    \u003cp\u003ePara ejercer sus derechos o aclarar dudas sobre el tratamiento de sus datos personales, comuníquese con nuestro Delegado de Protección de Datos:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eCorreo electrónico:\u003c/strong\u003e \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eAlterações a Esta Política de Privacidade\u003c/h2\u003e\n    \u003cp\u003ePodemos actualizar nuestra Política de Privacidad de tiempo en tiempo. Le notificaremos sobre cualquier cambio publicando la nueva Política de Privacidad en este sitio.\u003c/p\u003e\n    \u003cp\u003eLe recomendamos que revise esta Política de Privacidad periódicamente para verificar cualquier cambio.\u003c/p\u003e\n\n    \u003ch2\u003eContato\u003c/h2\u003e\n    \u003cp\u003eSi tiene alguna pregunta sobre esta Política de Privacidad, puede encontrarnos:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eCorreo electrónico:\u003c/strong\u003e \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVisite nuestra página:\u003c/strong\u003e \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eLimitación de Responsabilidad\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eEN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES SERÁN RESPONSABLES POR CUALQUIER DAÑO ESPECIAL, INCIDENTAL, INDIRECTO O CONSECUENTE DE CUALQUIER TIPO (INCLUYENDO, PERO NO LIMITÁNDOSE A, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS U OTRA INFORMACIÓN, POR INTERRUPCIÓN DEL NEGOCIO, POR LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD QUE SURJA DE O DE CUALQUIER MANERA RELACIONADA CON EL USO O LA INCAPACIDAD DE USAR EL SERVICIO, SOFTWARE DE TERCEROS Y/O HARDWARE DE TERCEROS UTILIZADOS CON EL SERVICIO, O DE OTRA MANERA EN RELACIÓN CON CUALQUIER DISPOSICIÓN DE ESTOS TÉRMINOS).\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eLa responsabilidad total de la Empresa bajo este acuerdo no excederá del mayor de: (a) el total pagado por usted por el Servicio durante los 12 meses anteriores a la reclamación; o (b) $20.00 (veinte dólares).\u003c/p\u003e\n\n    \u003ch2\u003eIndemnización\u003c/h2\u003e\n    \u003cp\u003eUsted acepta indemnizar, defender y mantener indemne a la Empresa, sus afiliados, directores, empleados, agentes, licenciantes y proveedores de y contra todas las reclamaciones, responsabilidades, daños, juicios, costos y gastos (incluidos los honorarios razonables de abogados) que surjan de o estén relacionados con: (a) su uso del Servicio; (b) cualquier incumplimiento de estos Términos por parte de usted; (c) cualquier contenido que publique o transmita a través del Servicio; (d) su violación de cualquier ley, regla o regulación aplicable; o (e) su violación de los derechos de cualquier tercero.\u003c/p\u003e\n\n    \u003ch2\u003eAviso de No Garantía\u003c/h2\u003e\n    \u003cp\u003e\u003cstrong\u003eEL SERVICIO SE PROPORCIONA \"TAL CUAL\" Y \"SEGÚN DISPONIBILIDAD\" SIN GARANTÍAS DE NINGÚN TIPO, EXPRESAS O IMPLÍCITAS, INCLUYENDO, PERO NO LIMITÁNDOSE A, GARANTÍAS IMPLÍCITAS DE COMERCIABILIDAD, APTITUD PARA UN FIN PARTICULAR Y NO INFRINGEMENT.\u003c/strong\u003e\u003c/p\u003e\n    \u003cp\u003eLA EMPRESA NO GARANTIZA QUE: (A) EL SERVICIO CUMPLIRÁ CON SUS REQUISITOS; (B) EL SERVICIO SERÁ ININTERRUMPIDO, OPORTUNO, SEGURO O LIBRE DE ERRORES; (C) LOS RESULTADOS OBTENIDOS DEL USO DEL SERVICIO SERÁN EXACTOS O CONFIABLES; O (D) LA CALIDAD DE CUALQUIER PRODUCTO, SERVICIO, INFORMACIÓN O CUALQUIER OTRO MATERIAL OBTENIDO A TRAVÉS DEL SERVICIO CUMPLIRÁ CON SUS EXPECTATIVAS.\u003c/p\u003e\n\n    \u003ch2\u003eAceptación por Uso\u003c/h2\u003e\n    \u003cp\u003eAL ACCEDER, DESCARGAR, INSTALAR O UTILIZAR EL SERVICIO, USTED RECONOCE QUE HA LEÍDO, ENTIENDE Y ACEPTA ESTAR SUJETO A ESTOS TÉRMINOS. SI NO ACEPTA ESTOS TÉRMINOS, NO ACCEDA NI UTILICE EL SERVICIO.\u003c/p\u003e\n    \u003cp\u003eEl uso continuo del Servicio tras cualquier modificación a estos Términos constituye su aceptación de tales modificaciones.\u003c/p\u003e\n\n    \u003ch2\u003eLey Aplicable y Jurisdicción\u003c/h2\u003e\n    \u003cp\u003eEstos Términos se regirán e interpretarán de acuerdo con las leyes de la República Federativa de Brasil, sin tener en cuenta sus disposiciones sobre conflictos de leyes.\u003c/p\u003e\n    \u003cp\u003eCualquier disputa que surja de o esté relacionada con estos Términos se presentará ante la jurisdicción exclusiva de los tribunales de la ciudad de São Paulo, Estado de São Paulo, Brasil, y las partes renuncian irrevocablemente a cualquier objeción a la jurisdicción de dichos tribunales.\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e","label":"Política de Privacidad","languageLabel":"Español"},{"documentType":"privacy_consent","language":"ES","content":"\u003chtml\u003e\n\u003chead\u003e\n    \u003ctitle\u003ePolítica de Cookies y Consentimiento de Privacidad - RENDERWEAR\u003c/title\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003ePolítica de Cookies y Consentimiento de Privacidad\u003c/h2\u003e\n    \u003cp\u003eÚltima actualización: 20 de enero de 2026\u003c/p\u003e\n    \u003cp\u003eEsta política de cookies explica qué son los cookies y cómo los utilizamos. Debe leer esta política para entender qué tipos de cookies usamos o la información que recopilamos mediante cookies y cómo se utiliza dicha información.\u003c/p\u003e\n    \u003cp\u003eLos cookies normalmente no contienen ninguna información que identifique personalmente a un usuario, pero la información personal que almacenamos sobre usted puede estar vinculada a la información almacenada y obtenida en los cookies. Para obtener más información sobre cómo utilizamos, almacenamos y mantenemos seguros sus datos personales, consulte nuestra Política de Privacidad.\u003c/p\u003e\n    \u003cp\u003eNo almacenamos información personal confidencial, como direcciones, contraseñas de cuentas, etc., en los cookies que utilizamos.\u003c/p\u003e\n\n    \u003ch2\u003eInterpretación y Definiciones\u003c/h2\u003e\n    \u003ch3\u003eInterpretación\u003c/h3\u003e\n    \u003cp\u003eLas palabras cuya letra inicial es mayúscula tienen significados definidos en las siguientes condiciones. Las siguientes definiciones deben tener el mismo significado, independientemente de aparecer en singular o plural.\u003c/p\u003e\n\n    \u003ch3\u003eDefiniciones\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e: Se refiere a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., CNPJ 08.337.937/0001-69, con domicilio en ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eCookies\u003c/strong\u003e: Son pequeños archivos que se instalan en su computadora, dispositivo móvil o cualquier otro dispositivo por un sitio web, conteniendo detalles de su historial de navegación en ese sitio entre sus varios usos.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSitio\u003c/strong\u003e: Se refiere a RENDERWEAR, accesible en \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e: El individuo que accede o utiliza el sitio, o una empresa o cualquier persona jurídica en nombre de la cual tal individuo está accediendo o utilizando el sitio, según corresponda.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eEl Uso de los Cookies\u003c/h2\u003e\n    \u003cp\u003eLos cookies pueden ser \"Persistentes\" o \"de Sesión\". Los cookies persistentes permanecen en su computadora personal o dispositivo móvil cuando está desconectado, mientras que los cookies de sesión se eliminan tan pronto como cierra el navegador.\u003c/p\u003e\n    \u003cp\u003eUtilizamos cookies de sesión y persistentes para los fines definidos debajo:\u003c/p\u003e\n\n    \u003ch3\u003eCookies Esenciales\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies de sesión\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Nosotros\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e Estos cookies son esenciales para proporcionarle los servicios disponibles a través del sitio y permitirle usar algunas de sus características. Ayudan a autenticar usuarios y prevenir el uso fraudulento de cuentas de usuarios. Sin estos cookies, los servicios que usted solicitó no pueden ser proporcionados y solo utilizamos estos cookies para proporcionar estos servicios a usted.\u003c/p\u003e\n\n    \u003ch3\u003eCookies de Funcionalidad\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies persistentes\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Nosotros\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e Estos cookies nos permiten recordar las elecciones que usted hace al utilizar el sitio, como recordar sus detalles de inicio de sesión o preferencias de idioma. El objetivo de estos cookies es proporcionarle una experiencia más personal y evitar que tenga que ingresar nuevamente sus preferencias cada vez que utilice el sitio.\u003c/p\u003e\n\n    \u003ch3\u003eCookies de Rastreo y Desempeño\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies persistentes\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Terceros\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e Estos cookies son utilizados para rastrear información sobre el tráfico del sitio y cómo los usuarios utilizan el sitio. La información recopilada a través de estos Cookies puede identificarlo directa o indirectamente como un visitante individual.\u003c/p\u003e\n\n    \u003ch3\u003eCookies de Publicidad\u003c/h3\u003e\n    \u003cp\u003e\u003cstrong\u003eTipo:\u003c/strong\u003e Cookies persistentes\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eAdministrado por:\u003c/strong\u003e Terceros\u003c/p\u003e\n    \u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e Estos cookies rastrean sus hábitos de navegación para permitir que mostremos publicidad que probablemente será de su interés.\u003c/p\u003e\n\n    \u003ch2\u003eSus Elecciones\u003c/h2\u003e\n    \u003cp\u003eSi prefiere evitar el uso de cookies en el sitio, primero debe desactivar el uso de cookies en su navegador y luego eliminar los cookies guardados en su navegador asociados con este sitio. Puede usar esta opción para impedir el uso de cookies en cualquier momento.\u003c/p\u003e\n    \u003cp\u003eSi no acepta nuestros cookies, puede experimentar algunos inconvenientes al utilizar el sitio y algunas funciones pueden no funcionar correctamente.\u003c/p\u003e\n\n    \u003ch3\u003eCómo Desactivar Cookies\u003c/h3\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eChrome:\u003c/strong\u003e \u003ca href=\"https://support.google.com/accounts/answer/32050\" target=\"_blank\"\u003ehttps://support.google.com/accounts/answer/32050\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eInternet Explorer:\u003c/strong\u003e \u003ca href=\"http://support.microsoft.com/kb/278835\" target=\"_blank\"\u003ehttp://support.microsoft.com/kb/278835\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eFirefox:\u003c/strong\u003e \u003ca href=\"https://support.mozilla.org/en-US/kb/delete-cookies-remove-info-websites-stored\" target=\"_blank\"\u003ehttps://support.mozilla.org/en-US/kb/delete-cookies-remove-info-websites-stored\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eSafari:\u003c/strong\u003e \u003ca href=\"https://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac\" target=\"_blank\"\u003ehttps://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eContenido Incorporado\u003c/h2\u003e\n    \u003cp\u003eEl Servicio puede incluir contenido incrustado (por ejemplo, videos, imágenes, artículos, etc.). El contenido incorporado de otros sitios se comporta de la misma manera que si el visitante hubiera visitado el otro sitio.\u003c/p\u003e\n    \u003cp\u003eEstos sitios pueden recopilar datos sobre usted, utilizar cookies, incorporar rastreo adicional de terceros y monitorear su interacción con el contenido incorporado, incluyendo rastrear su interacción con el contenido incorporado si usted tiene una cuenta y está conectado a dicho sitio.\u003c/p\u003e\n\n    \u003ch2\u003eCumplimiento de la LGPD\u003c/h2\u003e\n    \u003cp\u003eEste documento cumple con la Ley General de Protección de Datos de Brasil (LGPD - Ley N° 13.709/2018) y sus actualizaciones, incluyendo:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eResolución CD/ANPD N° 19/2024:\u003c/strong\u003e Reglas para la transferencia internacional de datos personales.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eNotificación de Incidentes:\u003c/strong\u003e Plazo de 3 (tres) días hábiles para comunicar a la ANPD y a los titulares afectados.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDerechos de los Titulares:\u003c/strong\u003e Acceso, corrección, portabilidad, eliminación y revocación del consentimiento.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eDelegado de Protección de Datos (DPO):\u003c/strong\u003e Información de contacto disponible públicamente.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003ePenalizaciones:\u003c/strong\u003e Hasta el 2% de los ingresos anuales de Brasil o 50 millones de BRL por violación.\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eContacto\u003c/h2\u003e\n    \u003cp\u003eSi tiene alguna duda sobre esta política de cookies, puede ponerse en contacto con nosotros:\u003c/p\u003e\n    \u003cul\u003e\n        \u003cli\u003e\u003cstrong\u003eCorreo electrónico:\u003c/strong\u003e \u003ca href=\"mailto:info@incodetech.com.br\"\u003einfo@incodetech.com.br\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eVisitando nuestra página de contacto:\u003c/strong\u003e \u003ca href=\"https://www.incodetech.com.br/contact.html\"\u003ehttps://www.incodetech.com.br/contact.html\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n\n    \u003ch2\u003eAceptación por Uso\u003c/h2\u003e\n    \u003cp\u003eAL ACCEDER, DESCARGAR, INSTALAR O UTILIZAR EL SERVICIO, USTED RECONOCE QUE HA LEÍDO, COMPRENDIDO Y ACEPTA ESTAR SUJETO A ESTOS TÉRMINOS. SI NO ACEPTA ESTOS TÉRMINOS, NO ACCEDA NI UTILICE EL SERVICIO.\u003c/p\u003e\n\n    \u003ch2\u003eLimitación de Responsabilidad\u003c/h2\u003e\n    \u003cp\u003eEN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY APLICABLE, EN NINGÚN CASO LA EMPRESA O SUS PROVEEDORES SERÁN RESPONSABLES DE NINGÚN DAÑO ESPECIAL, INCIDENTAL, INDIRECTO O CONSECUENTE (INCLUYENDO, PERO NO LIMITADO A, DAÑOS POR PÉRDIDA DE BENEFICIOS, PÉRDIDA DE DATOS U OTRA INFORMACIÓN, POR INTERRUPCIÓN DEL NEGOCIO, POR LESIONES PERSONALES, PÉRDIDA DE PRIVACIDAD QUE SURJA EN RELACIÓN O EN CUALQUIER MANERA CON EL USO O LA INCAPACIDAD DE USAR EL SERVICIO, SOFTWARE DE TERCEROS Y/O HARDWARE DE TERCEROS UTILIZADOS CON EL SERVICIO, O DE OTRA MANERA EN RELACIÓN CON CUALQUIER DISPOSICIÓN DE ESTOS TÉRMINOS).\u003c/p\u003e\n    \u003cp\u003eLa responsabilidad total de la Empresa bajo este acuerdo no excederá el mayor de: (a) la cantidad total pagada por usted por el Servicio durante los 12 meses anteriores a la reclamación; o (b) $20.00 (veinte dólares).\u003c/p\u003e\n\n    \u003ch2\u003eIndemnización\u003c/h2\u003e\n    \u003cp\u003eUsted acepta indemnizar, defender y mantener a la Empresa, sus afiliados, directores, empleados, agentes, licenciadores y proveedores a salvo de todas las reclamaciones, responsabilidades, daños, juicios, costos y gastos (incluidos los honorarios razonables de abogados) que surjan de o estén relacionados con: (a) su uso del Servicio; (b) cualquier incumplimiento de estos Términos por su parte; (c) cualquier contenido que usted publique o transmita a través del Servicio; (d) su violación de cualquier ley, regla o regulación aplicable; o (e) su violación de los derechos de cualquier tercero.\u003c/p\u003e\n\n    \u003ch2\u003eAsunción de Riesgo\u003c/h2\u003e\n    \u003cp\u003eUSTED ASUME PLENA RESPONSABILIDAD Y RIESGO POR SU USO DEL SERVICIO. EL SERVICIO SE PROPORCIONA \"TAL CUAL\" SIN GARANTÍAS DE NINGÚN TIPO. LA EMPRESA NO SERÁ RESPONSABLE DE NINGUN DAÑO RESULTANTE DEL USO O LA INCAPACIDAD DE USAR EL SERVICIO, INCLUYENDO DAÑOS CAUSADOS POR MALWARE, VIRUS O CUALQUIER PROGRAMA INFORMÁTICO INCORRECTO O INCOMPLETO.\u003c/p\u003e\n\n    \u003ch2\u003eDerecho Aplicable y Jurisdicción\u003c/h2\u003e\n    \u003cp\u003eEstos Términos se regirán e interpretarán de acuerdo con las leyes de la República Federativa de Brasil, sin tener en cuenta sus disposiciones sobre conflictos de leyes.\u003c/p\u003e\n    \u003cp\u003eCualquier disputa que surja de o esté relacionada con estos Términos se someterá a la jurisdicción exclusiva de los tribunales de la ciudad de São Paulo, Estado de São Paulo, Brasil, y las partes renuncian irrevocablemente a cualquier objeción a la jurisdicción de dichos tribunales.\u003c/p\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e","label":"Consentimiento de Privacidad (Cookies)","languageLabel":"Español"},{"documentType":"terms_of_service","language":"ES","content":"\u003ch2\u003eTérminos de Servicio\u003c/h2\u003e\n\n\u003cp\u003eÚltima actualización: 20 de enero de 2026\u003c/p\u003e\n\n\u003cp\u003ePor favor, lea estos Términos de Servicio (\"Términos\") cuidadosamente antes de usar el servicio RENDERWEAR operado por INCODE TECH.\u003c/p\u003e\n\n\u003ch2\u003eInterpretación y Definiciones\u003c/h2\u003e\n\n\u003ch3\u003eInterpretación\u003c/h3\u003e\n\n\u003cp\u003eLas palabras cuya letra inicial es mayúscula tienen significados definidos a continuación.\u003c/p\u003e\n\n\u003ch3\u003eDefiniciones\u003c/h3\u003e\n\n\u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eEmpresa\u003c/strong\u003e se refiere a MIRA DESIGN COMERCIO E SERVIÇOS DE DESENHO INDUSTRIAL E COMUNICACAO VISUAL LTDA., ALAMEDA CAMPINAS 728, 6 ANDAR, CJ 63 - JARDIM PAULISTA, SAO PAULO, SP, 01404-001, BRASIL.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eServicio\u003c/strong\u003e se refiere a RENDERWEAR.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eUsted\u003c/strong\u003e significa el individuo que accede al Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCuenta\u003c/strong\u003e significa una cuenta única creada para usted para acceder a nuestro Servicio.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSuscripción\u003c/strong\u003e se refiere a los servicios o el acceso al Servicio ofrecido mediante suscripción.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2\u003eDescripción del Servicio\u003c/h2\u003e\n\n\u003cp\u003eRENDERWEAR es un servicio que permite la creación y gestión de contenido visual y diseño industrial. El Servicio puede incluir características tanto de pago como gratuitas.\u003c/p\u003e\n\n\u003ch2\u003eCuentas de Usuario\u003c/h2\u003e\n\n\u003cp\u003ePara acceder a ciertos recursos del Servicio, es posible que deba crear una cuenta. Usted es responsable de mantener la confidencialidad de su cuenta y contraseña.\u003c/p\u003e\n\n\u003cp\u003eUsted acepta asumir la responsabilidad por todas las actividades que ocurran bajo su cuenta. Debe notificarnos de inmediato sobre cualquier uso no autorizado de su cuenta.\u003c/p\u003e\n\n\u003ch2\u003eTérminos de Pago\u003c/h2\u003e\n\n\u003ch3\u003ePeríodo de Suscripción\u003c/h3\u003e\n\n\u003cp\u003eEl Servicio o algunas partes del Servicio están disponibles solo con una Suscripción paga. Se le cobrará por adelantado de manera recurrente (mensual o anual), dependiendo del tipo de plan de suscripción que seleccione.\u003c/p\u003e\n\n\u003cp\u003eAl final de cada período, su Suscripción se renovará automáticamente bajo las mismas condiciones, a menos que usted la cancele o la Empresa la cancele.\u003c/p\u003e\n\n\u003ch3\u003eCancelación de la Suscripción\u003c/h3\u003e\n\n\u003cp\u003ePuede cancelar la renovación de su Suscripción a través de la configuración de su Cuenta o contactándonos. No recibirá un reembolso por los honorarios ya pagados por el período de suscripción actual y podrá acceder al Servicio hasta el final del período actual.\u003c/p\u003e\n\n\u003ch3\u003eCambios en los Precios\u003c/h3\u003e\n\n\u003cp\u003eLa Empresa puede, a su sola discreción, modificar los precios de suscripción en cualquier momento. Cualquier cambio entrará en vigor al final del período de suscripción actual.\u003c/p\u003e\n\n\u003ch3\u003eReembolsos\u003c/h3\u003e\n\n\u003cp\u003eExcepto cuando lo exija la ley, las tarifas de suscripción pagadas no son reembolsables. Los reembolsos pueden ser considerados caso por caso a exclusivo criterio de la Empresa.\u003c/p\u003e\n\n\u003c
